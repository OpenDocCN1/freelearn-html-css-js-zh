  \ 查看有关如何查找发票等的常见问题。此二维码将带你进入帮助页面。 | ![](img/Need_help.png) |\n\n注意：如果你仍然遇到问题，请联系\
  \ [`customercare@packt.com`](https://www.packtpub.com/contact)。\n\n# 附录 A\n\n# 在开发工作流中简化\
  \ Playwright\n\n在书中，我们探索了如何使用 `Playwright` 编写、组织和运行可靠的测试。但总有一些额外的细节无法完美地融入正文。这就是本附录的作用。本附录深入探讨了\
  \ `Playwright` 如何融入当今的开发实践，例如 Agile、DevOps 和不同的 CI/CD 流水线。\n\n# 使用云测试服务实现扩展性和跨环境测试\n\
  \n在本地运行大型自动化测试套件通常是不切行的。并行运行测试时受限于你机器的硬件（`CPU` 和 `RAM`），而且维护测试所需的各种浏览器、操作系统和设备组合也很困难。\n\
  \n云测试平台通过提供按需访问的海量虚拟机和真实设备网格解决了这些问题。这允许实现大规模并行（同时运行数百个测试）和全面的跨环境覆盖，而无需你进行任何基础设施管理。\n\
  \n\n\n\n\n`Microsoft Playwright Testing`（作为 `Azure App Testing`的一部分）是一项为 Playwright\
  \ 设计的云服务，支持 Windows、Linux 和 macOS 上的 Chromium、Firefox 和 WebKit 大规模并行运行。它支持用于分布式测试运行的分片（sharding）、统一报告，并与\
  \ Azure Pipelines 集成以实现 CI/CD。该服务允许你在几分钟内运行数千次测试，并提供共享工作区，以便从本地测试到云测试的平滑过渡。\n\n\
  其他优秀选项还包括：\n\n*   `BrowserStack`：与 Playwright API 兼容，并让你访问真实的设备和浏览器。它是通过 BrowserStack\
  \ 能力进行移动端测试的理想选择（[`www.browserstack.com/docs/automate/playwright`](https://www.browserstack.com/docs/automate/playwright)）。\n\
  \n*   `Sauce Labs`：允许你使用 `saucectl` CLI 在云端运行 Playwright 测试，支持模拟器和真实设备（[`docs.saucelabs.com/web-apps/automated-testing/playwright/`](https://docs.saucelabs.com/web-apps/automated-testing/playwright/)）。\n\
  \n*   `LambdaTest`：为实时测试提供 WebSocket 连接，并提供专注于 Playwright 的功能，如 AI 驱动的测试编排（[`www.lambdatest.com/playwright-testing`](https://www.lambdatest.com/playwright-testing)）。\n\
  \n这些平台使得在广泛的环境（例如不同的操作系统和浏览器组合）中进行测试变得更容易，并可以通过并行测试执行高效扩展。你可以在 `playwright.config.ts`\
  \ 中使用环境变量配置凭据，并将运行直接集成到你的 CI 流水线中。\n\n## 在敏捷工作流中决定何时使用 Playwright\n\n敏捷（`Agile`）方法专注于快速进展和频繁发布功能性软件。Playwright\
  \ 以其快速的跨浏览器测试能力完美契合。关键在于根据你的测试需求知道何时使用它。\n\n在基于迭代（Sprint）的工作流中，Playwright 在在迭代结束时验证用户故事（user\
  \ stories）方面表现出色。例如，在迭代评审期间运行 `end-to-end`（`E2E`）测试有助于确认新功能与现有功能顺畅运行。为了保持进度，将 Playwright\
  \ 集成到你的 CI/CD 流水中，在每次提交或拉取请求（pull request）时运行测试，从而在迭代期间提供即时反馈。这与敏捷方法交付可用软件的目标高度一致，因为\
  \ Playwright 的自动等待和可靠的定位器使得处理动态 UI 变得更加流畅且不易出现不稳定（flaky）。\n\n对于`测试驱动开发`（`TDD`），与传统的单元级\
  \ TDD 相比，Playwright 更适合更高级别的测试。虽然单元测试（例如使用 `Jest`）关注于组件逻辑，但 Playwright 可以通过先为关键用户流编写\
  \ E2E 测试来驱动 `UI TDD`，然后构建功能以通过测试。它在使用 `Cucumber` 等工具的`行为驱动开发`（`BDD`）中特别有用，Playwright\
  \ 在此可以自动执行 Gherkin 场景。\n\n以下是依赖 Playwright 的时机：\n\n*   `迭代早期`：在早期的前端构建上运行冒烟测试（例如初始的可点击原型），以确认基础导航和渲染。\n\
  \n*   `迭代中期`：使用 API  Mock（（桩）或路由拦截，在后端服务完全就绪之前验证前端行为。\n\n*   `迭代结束`：运行全面的回归测试，以确保迭代的工作已准备好演示或发布。\n\
  \n由于 E2E 测试速度较慢，不要对每个细小更改都过度使用 Playwright：请将其留给集成点，并依靠更快的单元测试来完成 TDD 循环。在成熟的敏捷团队中，使用工作器（workers）或分片的并行执行可以让每日测试运行变得可行，并保持你的迭代不正轨。\n\
  \n# 使 Playwright 测试与 DevOps 原则一致\n\n当你将测试视为一种持续的自动化实践，而不是最后的障碍时，Playwright 就成为了一个极佳的助手。它为你提供更早的反馈，帮助你的团队在不放弃可靠性的情况下快速移动。Playwright\
  \ 与保持现代 DevOps 团队顺利运行的核心原则一致：\n\n*   `持续测试`：在*第七章* 中的*将工作流与 CI/CD 流水线集成*中，我们看到 Playwright\
  \ 如何接入 CI/CD 流水线以自动运行测试。例如，在 GitHub Actions 或 `Jenkins` 中，你可以设置一个工作流来安装依赖、运行 `npx\
  \ playwright test` 并共享报告。这可以及早发现问题。通过分片并行执行可以将测试时间从几小时缩短到几分钟，即使对于大型套件也是如此。你还可以使用\
  \ `Allure` 等工具增强流水线内的报告，以获得更好的洞察。\n\n*   `左移测试`（Shift-left testing）：这一 DevOps 原则将测试推向开发周期的早期，以便尽早发现缺陷。Playwright\
  \ 通过组件测试（例如使用 `@playwright/experimental-ct-react`）支持这一点，让你可以在没有完整应用的情况下测试 UI 元素。你可以在编写代码时本地运行这些测试。\n\
  \n以下是实现方法：\n\n*   通过 CI 检查在代码审查中包含测试\n*   使用 mocks 和固定件（fixtures）在不依赖外部服务的情况下进行测试\n\
  *   配合右移监控（shift-right monitoring）以捕获生产环境中的问题\n\n因此，通过将 Playwright 嵌入 DevOps 流水线，你实现了更快的发布并降低了成本。\n\
  \n# 使用 Playwright 构建高效的反馈循环\n\n当测试失败时，你希望团队能够立即获，并有清晰的步骤来查明哪里出了问题。Playwright 通过其报告工具和与\
  \ CI/CD 系统的集成使其变得简单。\n\n如果测试在 CI/CD 流水线（例如 GitHub Actions）中失败，系统可以直接在拉取请求中突出显示问题，并指向失败的具体行或用例。在\
  \ Azure Pipelines 中，使用 `JUnit` 报告器，你可以发布结果并通过电子邮件或 `Microsoft Teams` 或 `Slack` 等工具设置警报。\n\
  \n为了深入研究失败的细节，Playwright 提供了几种报告工具（在书中我们已经查看了 HTML 报告和跟踪查看器）：\n\n*   `JSON` 或 `JUnit\
  \ 报告器`：这些生成 CI 工具解析的结构化文件，以便自定义仪表板或与 `Jira` 等系统集成。例如，`JUnit XML` 文件适用于 `Jenkins`\
  \ 或 `CircleCI`。\n\n*   `HTML 器`：创建一个易于的 Web 报告，保存在 `playwright-report` 文件夹中，包含测试结果、截图、视频和跟踪。你可以设置为在失败时打开或作为\
  \ CI 制物上传，例如在 GitHub Actions 中使用 `actions/upload-artifact`。团队可以通过 `npx show-report`\
  \ 查看或从 CI 构建中下载。\n\n*   `跟踪查看器`（Trace Viewer）：Playwright 的跟踪允许你逐步重放测试，显示网络请求、DOM\
  \ 快照和控制台日志。这些可以在 HTML 报告中访问或单独使用，使得发现网络延迟或 UI 异常变得简单。\n\n在你的 `playwright.config.ts`\
  \ 文件中你可以配置多个报告器，例如 `reporter: [['dot'], ['html'], ['json']]`，以获得简洁的 CI 输出，同时为本地调试保留丰富的诊断信息。\n\
  \n对于使用分片并行运行的大型测试套件，`Blob` 报告器（参见 [https://playwright.dev/docs/test-reporters](https://playwright.dev/docs/test-reporters））将结果合并为单一统一报告。这种设置确保了反馈循环的紧凑：失败会阻止\
  \ CI 合并，警报传给正确的团队成员，详细的诊断有助于快速解决问题。\n\n附录 B\n\n# 参考和资源\n\n\n\n\n\n随着你继续你的 Playwright\
