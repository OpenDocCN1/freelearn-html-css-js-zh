- "# Playwright 自动化测试实用指南\n\n\n\n![](img/9781806106479cov_Low_Res.jpg)\n\n\n\n\n![](img/New_Packt_Logo.png)\n\
  \n\n\n\n\n\n\n\n# 前言\n\n在过去的几年里，我有幸认识了 Butch，并与 Faraz 见过几次。每一次互动都给我留下了深刻的印象，不仅是因为他们技术上的精湛，更是因为他们的周全、谦逊和慷慨。在我们这样一个变化瞬息万变的领域，这些特质是稀缺且宝贵的。真正的专业不仅在于了解工具，更在于理解如何思考这些工具、如何教授它们，以及如何让其他人易于使用。\n\
  \nPlaywright 处于重塑现代软件工程的许多变革的交汇点。它不仅仅是另一个测试工具；它代表了我们处理自动化、可靠性和开发者体验方式的转变。它将速度与表达力、力量与易用性结合在一起。然而，正如任何快速演进的技术一样，其真正的潜能开启并非通过代码本身，而是通过围绕其形成的社区和知识。这正是\
  \ Butch 和 Faraz 发挥作用的地方。\n\n这本书不仅仅是一本技术手册。它是由两个亲历过这段旅程、面对过陷阱、并为团队每天遇到的现实问题找到优雅解决方案的人所绘制的地图。他们提炼的不仅是\
  \ Playwright 能做什么，更是如何良好地使用它。他们阐明了一种植根于好奇心、清晰度以及对工艺和流程尊的质量工程思维。\n\n我们生活在一个 AI、自动化和无情创新不断定义软件可能性的时代。框架以令人眩晕的速度兴起又落下。团队被要求更快的速度、更智能的测试和更自信的发布，而且往往面临人手更少、时间更紧的情况。在这一切之中，这样的书籍起到了脚石的作用。它们提醒我们，虽然技术在变，但健全的工程原理长久不变。\n\
  \n在 AI 辅助开发的时代，人们很容易让工具为我们做更多思考。但 Butch 和 Faraz 显示，理解依然至关重要。最好的工程师不仅仅是在自动化任务；他们还在构建能够表达意图、创造信心并帮助团队安全前行的系统。审慎地使用\
  \ Playwright 是少数可以实现这一点的稀有工具之一，而这本书将向你展示如何做到。\n\n随着时间的推移，我开始将与 Butch 和 Faraz 的每一次互动都视为一次学习的机会。他们带来了一种既深具技术性又充满人文关怀的能量。他们关注细节，不是因为刻板，而是因为他们知道工艺存在于细节之中。他们还关心人：他们的同事、他们的社区，以及将继承我们今天正在构建系统的下一代工程师。\n\
  \n这种精神贯穿于每一页。这本书非常实用的、富有见地，并且充满了超越 Playwright 本身的教训。它鼓励将测试视为探索，将自动化视为沟通，将工程视为手工艺。它承认了现代开发中的混沌、不断变化的库、无休止的更新以及\
  \ AI 日益增长的影响，并提供了一只坚定的手来帮助应对这一切。\n\n使这部作品如此宝贵的，不仅是因为它教你如何编写更好的测试。它还教你如何更好地思考测试、如何思考系统，以及在变不可预测的世界中，你作为可靠软件的构建者的角色。\n\
  \n无论你是第一次接触 Playwright，还是在带领团队经历它的下一次演进，请花时间阅读这本书。让它引导你。让它再次确认：卓越并非来自追求每一个新趋势，而是来自掌握基础知识并以好奇心、同理心和纪律应用它们。\n\
  \nButch 和 Faraz 体现了这种哲学。他们的工作对于任何相信质量重要、清晰有价值，并且相信学习（无论以何种混乱、快乐、人性的形式）始终是伟大工程的核心的人来说都是一份礼物。\n\
  \n*Ben Fellows*\n– Loop Software & Testing Services, Inc CEO\nPlaywright 大使\n\n\
  # 贡献者\n\n# 关于作者\n\nFaraz K. Kelhini 是一位测试自动化工程师、全栈 JavaScript 专家和作者，拥有十年将复杂的 Web\
  \ 问题转化为优雅解决方案的经验。他编写了三本广受好评的书：`Modern Asynchronous JavaScript`、`Text Processing\
  \ with JavaScript` 和 `JavaScript Teasers`。除了书籍，Faraz 还为 `Educative.io` 创建交互课程，为\
  \ `LogRocket` 编写深度教程，并担任 Pearson 和 Packt 的技术编辑润色稿。无论是构建企业级应用、开发核心工具，还是指导新兴人才，Faraz\
  \ 的使命始终如一：赋予开发者编写更智能代码并乐在其中的能力。\n\n编写这本书是一次收获丰的合作。感谢 Butch Mayhew 与我一起构建并完善了这一愿景，感谢我们的编辑\
  \ Adrija Mitra 的细心指导，感谢 Aaron Lazar 对这个项目的支持。感谢你，读者的加入。我希望这些实践能帮助你发布更好的软件，甚至可能让你更喜欢测试。\n\
  \nButch Mayhew 是一位 Playwright 大使和质量顾问，致力于通过现代测试实践和务实的自动化来实现组织的质量。凭借在测试自动化领域 10 多年的经验和深厚的探索性测试背景，他通过改进测试方式、测试内容以及从结果中学习的速度，帮助团队对他们的软件建立信心。他是\
  \ `Howdy QA` 的创始人，该咨询公司为公司提供 Playwright 应用、框架设计、CI/CD 集成、无障碍测试和实战培训。他的方法将强大的技术执行与以文化为中心的思维相结合：质量不是一个阶段，而是团队共同建立的习惯。他还在\
  \ LinkedIn Learning 上创建了关于 Playwright 的课程，为工程师和测试人员提供了一个结构化的、实战的路径来提升他们的自动化技能。\n\
  \n\n\n\n\n我要感谢我的妻子和家人在今年以及多年来对我提供的所有支持。我要感谢 Faraz Kelhini 为本书付出的所有汗水和努力。特别感谢 Sergei\
  \ Gapanovich，他的友谊，以及他通过诚实的挑战、敏锐的反馈和永之以恒的好奇心提升了我的技术水平。最后，感谢整个 Packt 团队在本书编写期间提供的支持。\n\
  \n# 关于评审员\n\nCarlos Gauto 在技术圈以 Charly Automatiza 闻名，是一位深耕的 IT 项目负责人，在软件开发、测试自动化和性能工程方面拥有超过\
  \ 19 年的实践经验。他的职业生涯以实战角色为特色，将技术专长与对导师和社区建设的热忱激情结合在一起。\n\n作为微软 MVP 和工具大使（`Playwright`、`Grafana\
  \ k6`、`SelectorsHub`），他还是 AI 倡导者，参与了西班牙和拉丁美的重要活动，并用西班牙语、葡萄牙语和英语进行演讲。\n\nDeepak Kamboj\
  \ 是微软的高级软件工程师，拥有 24 年以上的经验，其中 8 年从事架构工作。他领导着专注于 AI 代理工作流、测试自动化和基础设施的关键项目，并开发了一个大型\
  \ `Playwright` 测试设置，为 50 多个内部团队执行超过 14,000 次测试。他的工作直接专注于提高企业的效率和可靠性。\n\n他深热于将 AI、生产力和自动化相结合，使开发工作变得更加顺畅和智能。他的核心专长涵盖\
  \ AI 代理、生成式测试、`Copilot Studio`、`RAG` 以及基于 `MCP` 的自动化和 AI 驱动解决方案。\n\n作为一名受信任的顾问、教练和会议演讲者，他指导团队采用下一代\
  \ AI，确保测试可靠性并优化 DevOps。他分享实用的真实解决方案，并探索创新的 AI 用法产生切实影响，推进 AI 自动化、工作流编排以及为云时代构建现代、目标驱动的代理生态系统。Deepak\
  \ 欢迎关于下一代软件测试以及驱动技术成功的实用解决方案的讨论。\n\n# 前言\n\n本书是你掌握 `Playwright` 的微软用于端到端测试的现代自动化框架实践指南。在这些章节中，我们将从开始学习\
  \ `Playwright` 的核心功能（如浏览器自动化、选择器和定位器），到使用固件、页面对象和测试数据管理构建健壮的测试套件。你将学习如何运行测试、将它们集成到\
  \ CI/CD 流线中、使用 `Playwright Test` 进行报告和调试，甚至为复杂的 Web 应用程序扩展测试。\n\n当我第一次开始做自动化测试时，我记得那种感觉就像在同时处理太多的事情：浏览器版本、测试运行器、CI\
  \ 流水线，以及那个总在发布前才出现的神秘“超时错误”。自动化承诺了速度和信心，但很多时候带来的是挫败感和无休止的调试会议。我想改变现状。\n\n然后我发现了\
  \ `Playwright`，感觉就像是有人终于读了每个测试者的愿望清单，并决定构建我们一直期待的工具。一种可以在现代 Web 应用中真正运行的快速、可靠的跨浏览器测试？但即使有这样强大的工具，仍然存在学习曲线：如何有效地使用它，如何构建测试，以及如何保持它们快速、可读且易于维护。\n\
  \n在深入研究 `Playwright` 生态系统时，我遇到了 Butch Mayhew 的博客，里面充满了见见且实用的建议，立即引起了我的共鸣。Butch 作为一名\
  \ `Playwright` 大使，在让测试变得平易近人以及将复杂概念拆解为清晰解释方面极具天赋。一次对话引向另一次对话，很快，我们决定联手编写这本书。\n\n\
  本书是合作的成果：我们共同的经验、我们学到的教训（有时是付出的代价换来的），以及我们对 `Playwright` 的可能性的兴奋。它充满了实践示例、真实场景和可操作的指导，帮助你为现代\
  \ Web 应用程序构建快速、可靠且可扩展的测试。\n\n无论你是涉足测试自动化的开发者，还是寻求升级工具箱的 QA 工程师，还是旨在为发布带来稳定性和信心的技术主管，我们都是为了你而编写了这本书。\n\
  \n## 本书的读者群体\n\n本书适用于任何认为自动化测试应该让生活变得更轻松，而不是更困难的人。\n\n如果你是一个寻求将端到端测试集成到开发流程中的 `developer`，你将发现关于编写整洁、可维护的测试代码以及构建与应用程序无缝运行的测试的实用指导。\n\
  \n如果你是一个厌倦了追逐不稳定测试和处理跨浏览器间不一致结果的 `software tester`、`QA engineer` 或 `SDET`，本书将向你展示\
  \ `Playwright` 如何简化你的工作流。\n\n如果你是一个 `team lead` 或 `engineering manager`，本书将帮助你理解如何构建一个随团队规模扩展的\
  \ `Playwright` 测试框架，以便你可以标准化测试实践、减少维护开销，并在不牺牲质量的情况下加速交付周期。\n\n如果你已经拥有一些 `Selenium`、`Cypress`\
  \ 或 `Puppeteer` 的经验，你将很快发现 `Playwright` 如何获取这些熟悉的概念，并通过自动等待、跨浏览器执行和健壮的并行化等强大功能将其推向远。你还将学习让你的现有测试实践更高效、更具扩展性的技巧。\n\
  \n## 本书涵盖的内容\n\n# 第 1 章：快速设置回顾\n作为你的切入点，提供关于设置 `Playwright` 和编写基础测试的简要回顾。它确保你能够快速运行起测试环境并理解\
  \ `Playwright` 的核心结构。\n\n# 第 2 章：高级选择器与动态内容处理\n探索使用 `Playwright` 的选择器引擎与复杂的 Web\
  \ 元素进行交互的技巧。它涵盖了动态内容、等待以及如 iframe 和 shadow DOM 等高级 DOM 结构。\n\n# 第 3 章：跨 Chromium、Firefox\
  \ 和 WebKit 的浏览器无关测试\n向你介绍 `Playwright` 的跨浏览器测试能力。我们将深入研究调整浏览器上下文的所有方式：调整视口大小和用户代理、模拟各种设备，甚至设置权限。\n\
  \n# 第 4 章：AI 驱动的测试生成\n探索 AI 工具如何通过从自然语言生成脚本和完善测试可靠性来改进 `Playwright` 的测试创建。\n\n###\
  \ 第 5 章：使用固件系统构建可扩展测试\n展示如何充分利用 `Playwright` 固件系统的潜力。我们将从内置固件开始，然后转向创建自定义固件并理解固件的作用和生命周期如何影响你的测试。\n\
  \n# 第 6 章：测试并行化与性能优化\n重点关注通过并行运行和优化性能来高效扩展测试。它包括使用 Chrome DevTools 协议衡量并改进 Web 应用指标。\n\
  \n### 第 7 章：与 CI/CD 流线集成工作流\n详细介绍如何使用 GitHub Actions 将 `Playwright` 测试集成到 CI/CD\
  \ 工作流中。它涵盖了自动化流水的环境设置和报告。\n\n\n\n\n\n# 第 8 章：B34148_08_ePub.xhtml__idTextAnchor200:\
  \ 无头测试与调试\n介绍了如何以无头模式运行测试以提高效率，并使用 Playwright 工具调试失败的测试。它包含了用于诊断的媒体捕获。\n\n# 第 9\
  \ 章：B34148_09_ePub.xhtml__idTextAnchor223: 使用 Playwright 和 Axe-core 进行无障碍测试\n涵盖了如何使用\
  \ Playwright 和 `axe-core` 等库进行 Web 无障碍性测试。强调了确保应用程序包容性的最佳实践。\n\n# 第 10 章：B34148_10_ePub.xhtml__idTextAnchor243:\
  \ 设置视觉回归测试\n涉及设置测试以比较截图、处理差异并确保视觉的一致性。\n\n# 第 11 章：B34148_11_ePub.xhtml__idTextAnchor266:\
  \ 测试移动 Web 体验\n侧重于通过模拟设备和处理来测试移动 Web 体验。解决了移动端特有的挑战。\n\n# 第 12 章：B34148_12_ePub.xhtml__idTextAnchor295:\
  \ 表单测试\n探索了表单交互测试，包括输入、验证和特殊字段。确保对用户输入的健壮处理。\n\n# 第 13 章：B34148_13_ePub.xhtml__idTextAnchor317:\
  \ 处理文件上传与下载\n解决了文件上传、下载和验证内容以及管理不同的文件类型。\n\n# 第 14 章：B34148_14_ePub.xhtml__idTextAnchor333:\
  \ 安全与认证\n侧重于登录管理、用户角色测试以及安全存储凭据。\n\n# 第 15 章：B34148_15_ePub.xhtml__idTextAnchor350:\
  \ 测试可维护性的最佳实践\n探索如何结构化测试、利用 `Page Object Model` (`POM`) 保持代码整洁，以及管理测试数据以避免令人沮丧的失败。\n\
  \n# 第 16 章：B34148_16_ePub.xhtml__idTextAnchor367: 实战项目——测试电子商务网站\n引导你为电子商务网站创建一个稳健且适应性强的端到端测试框架。\n\
  \n# 附录 A：在现代开发工作流中简化 Playwright\n深入探讨 Playwright 如何无缝融入当今的实践，如敏捷、DevOps 和不同的 CI/CD\
  \ 流水线。\n\n# 附录 B：参考文献与资源\n提供了一个精选列表以指导你的进一步探索。\n\n# 充分利用本书的价值\n\n- 你不需要成为测试大师或 JavaScript\
  \ 魔法师就能跟随，但具备一点编程经验会有帮助。如果你用过 `JavaScript`、`TypeScript` 甚至 `Python` 写过代码，你很快就会感到自如。书中的示例主要使用\
  \ `TypeScript`，因为它是 Playwright 的原生语言并有助于尽早发现错误，但你可以轻松将这些概念应用到任何支持的语言。其他所有内容我们将一起一步步完成，并提供大量的真实案例和实践练习。\n\
  - 在阅读这些章节时，你会发现有很多实操练习。不要只看它们：要尝试一一下！学习 Playwright 的最好方法是动手。拆解它、调整它、进行实验。通过观察测试运行（有时会失败），你学到的会比只读代码片段多得多。\n\
  - 每一章都建立在前一章的基础上，但如果你已经熟悉某些主题，可以随时跳着看。你可以将本书作为从头到尾的引导教程，也可以在解决特定的测试挑战时作为参考。\n\n\
  ## 下载示例代码文件\n\n本书的代码包托管在 GitHub 上：[`github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright`](https://github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright)。\n\
  \n我们从丰富的书籍和视频目录中还提供了其他代码包，地址为 [`github.com/PacktPublishing`](https://github.com/PacktPublishing)。去去看看吧！\n\
  \n## 使用的符号约定\n\n全书使用了多种文本符号约定。\n\n`CodeInText`：表示文本中的代码单词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟\
  \ URL、用户输入和 Twitter 账号。例如：“通过用 `base.extend()` 封装基础测试，我们引入了一个新的固件 (`noConsoleErrors`)，它会自动集成到测试生命周期中。”\n\
  \n代码块设置如下：\n\n```\n{\n  name: 'webkit-ipad',\n  use: {\n    ...devices['Desktop\
  \ Safari'],\n    userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:138.0)\
  \ Gecko/20100101 Firefox/138.0',\n  },\n},\n```\n\n任何命令行输入或输出如下所示：\n\n```\ngit add\
  \ .github/workflows/playwright.yml\ngit commit -m \"Add Playwright tests GitHub\
  \ Actions workflow\"\ngit push\n```\n\n**粗体**：表示新术语、重要单词或你在屏幕上看到的单词。例如，菜单或对话框中的单词在文中显示所示。例如：“Playwright\
  \ 提供了两个固件作用域 `test` 和 `worker`，每个都为不同的场景设计。”\n\n警告或重要提示显示所示。\n\n提示和技巧显示所示。\n\n#\
