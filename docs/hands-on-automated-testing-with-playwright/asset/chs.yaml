  \ |\n\n# 快速上手回顾\n\n欢迎开启 Playwright 之旅！此书将引导你掌握这一用于 Web 测试和自动化的通用工具。\n\nPlaywright\
  \ 最大的优势之一是能够通过单一 API 自动化控制 Chromium、Firefox 和 WebKit 等浏览器，这意味着你可以轻松地跨浏览器进行测试。另一个显著特性是它的自动等待（auto-wait）机制，它通过在与元素交互之前等待其准备就绪，帮助减少测试的波动（flaky\
  \ tests）。此外，它还支持 JavaScript、Python 和 C# 等多种语言，因此团队可以在他们偏好的技术栈中使用它。\n\n在深入学习这些精彩功能之前，让我们花几分钟时间确保一切配置妥当。即使你以前用过\
  \ Playwright，本章也将确保我们都处于同一个起线上。\n\n在本章中，我们将从安装 Playwright 及其依赖项开始，搭建开发环境。然后，我们将探索\
  \ Playwright Test 和 Playwright Library 之间的区别，这将帮助你理解何时使用哪一个。\n\n接下来，你将通过编写和运行第一个测试来获得实践经验。我们还将涵盖如何配置测试环境以获得最佳生产力，并深入探讨\
  \ Playwright 测试运行器的基础，为你提供坚实的基础。\n\n到本章结束时，你将拥有一个功能完整的 Playwright 配置，理解关键组件，并准备好自信地开始编写和运行测试。\n\
  \n以下我们将探索的关键主题：\n\n*   安装 Playwright 和依赖项\n*   理解 Playwright Test 和 Playwright Library\
  \ 的区别\n*   编写并运行你的第一个测试\n*   配置测试环境\n*   理解 Playwright 测试运行器基础\n\n让我们开始吧！\n\n# 书籍附带的免费福利\n\
  \n你的购买包含了此书的免费 PDF 副本以及其他专属福利。请查看*前言*中的*附赠免费福利*章节以立即解锁这些福利并最大化你的学习体验。\n\n## 技术要求\n\
  \n本章的源代码可在 [`github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright/tree/main/Chapter01`](https://github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright/tree/main/Chapter01)\
  \ 获取。\n\n# 理解 Playwright Test 和 Playwright Library 的区别\n\n新手中的一个常见问题是：Playwright\
  \ Test 和 Playwright Library 之间有什么区别？尽管它们具有相同的功能，但每个都适用于不同的用场景。\n\n想象你正在构建一个数据提取流水线，每晚从多个网站抓取内容。你不需要完整的测试报告或断言。你只需要可靠的浏览器自动化。在这种情况下，Playwright\
  \ Library 非常合。。你可以将其接入现有的 Node.js 工作流中，使用 `cron` 进行调度，并保持轻量化。\n\n现在，假设你正在开发 Web\
  \ 应用程序，并希望确保登录、结账和仪表板工作流在 Chrome、Firefox 和 Safari 中保持可靠。Playwright Test 处理编排工作：运行测试、生成报告，并在无需额外设置的情况下让调试变得更容易。\n\
  \n更准确地说，`Playwright Library` 提供了一组用于自动化浏览器任务的 API。你可以使用它执行以下操作：\n\n*   以无头（headless）或有头（headed）模式启动浏览器。这意味着你可以在不显示浏览器窗口的情况下（无头）运行自动化测试，速度更快且适用于\
  \ CI 流水线），或者带有可见窗口运行（有头），这有助于调试和开发。\n*   通过点击、填写表单和捕屏与网页交互。\n*   在浏览器的上下文中执行 JavaScript。\n\
  \n此 API 可以与任何测试运行器（如 Jest 或 Mocha）结合，甚至用于自定义脚本中。其设计专注于浏览器自动化，并将测试编排和报告留给你自己。\n\n\
  另一方面，`Playwright Test` 在核心库的基础上构建，但增加了简化编写测试的功能。它具有以下特性：\n\n*   内置测试运行器，可自动识别测试文件、并行运行它们，并支持多个浏览器\n\
  *   通过 CLI 生成视觉报告并调试测试失败原因\n*   用于运行测试、为失败调试录制视频等的命令行选项\n\n所以，如果你已经在你信任的另一个测试框架内工作，或者需要将浏览器自动化集成到更大的流程中，请使用\
  \ Playwright Library。如果你的重点是快速编写测试并使用全方位解决方案，Playwright Test 是更好的选择。\n\n在下一节中，我们将查看如何在你的系统上安装每一个。\n\
  \n# 安装 Playwright 及其依赖项\n\n在进行任何操作之前，你必须确保系统已准备好运行 Playwright。Playwright 构建在 Node.js\
  \ 之上，因此，验证 Node 和 `npm`（或 `yarn`）可用是第一步。\n\n## 安装 Node.js\n\n大多数现代开发系统已经安装了 Node，但如果没有，请从\
  \ [nodejs.org](https://nodejs.org/en) 下载。我们建议使用长期支持（LTS）版本。你可以通过以下命令验证安装情况：\n\n\
  ```\nnode -v\nnpm -v\n```\n\n这些命令应该返回版本号，确认 Node.js 和 npm 已安装。如果你正在管理多个版本，请考虑使用\
  \ `nvm`。\n\n## 初始化项目\n\n创建一个项目目录并将其初始化为 `npm` 项目：\n\n```\nmkdir playwright-quick-setup\n\
  cd playwright-quick-setup\nnpm init -y\n```\n\n此命令会创建一个 `package.json` 文件，它是管理项目依赖所必需的。\n\
  \n## 安装 Playwright\n\n正如我们在本章早期提到的，安装 Playwright 有两种主要方式：Playwright Library 和 Playwright\
  \ Test。\n\n要安装 Playwright Library，可以使用以下命令：\n\n```\nnpm install playwright\n```\n\
  \n这安装核心 Playwright 库，它提供了浏览器自动化 API。如果你想通过编程使用 Playwright 的自动化能力或将其与其他框架集成，则适用于它。\n\
  \n如果你倾向于集成测试解决方案，请安装：\n\n```\nnpm install --save-dev @playwright/test\n```\n\n这安装\
  \ Playwright Test 包，它包含了内置的测试运行器、断言以及并行执行等功能。\n\n注意，上述命令仅将 `@playwright/test` 作为开发依赖安装到现有项目中。它不会创建配置文件或示例测试或初始化任何项目结构。此外，它不会自动安装浏览器二进制文件（你需要单独运行\
  \ `npx playwright install`）。\n\n当你向已有测试设置的项目添加 Playwright Test，或者你倾向于手动配置 Playwright\
  \ 时，请使用这种方法。你还需要设置 `playwright.config.ts` 文件并自行组织测试结构。\n\n如果你想要带有配置和示例的引导式设置，或者想通过让\
  \ Playwright 为脚搭建项目来节省时间，请使用：\n\n```\nnpm init playwright@latest\n```\n\n此命令初始化一个带有\
  \ Playwright Test 框架的新 Playwright 项目。它设置了一个完整的测试环境，包括以下内容：\n\n\n\n\n\n*   将 `@playwright/test`\
  \ 安装为开发依赖\n*   创建一个示例配置文件 (`playwright.config.ts`)\n*   生成示例文件（例如 `tests/example.spec.ts`）\n\
  *   可选地安装浏览器二进制文件（如果你在设置提示中选择了此项）\n\n因此，如果你需要使用绑定的测试运行器来构建测试，请选择 Playwright Test；否则，如果你正将其集成到不同的测试框架中，核心\
  \ API 通常就足够了。现在环境已经准备就绪，我们可以开始构建并运行你的第一个 Playwright 测试。\n\n# 编写并运行你的第一个测试\n\n准备好运行你的第一个测试了吗？太棒了！在本节结束时，你你拥有一个一个功能性的测试，它可以访问网站、检查其标题，并为更高级的测试策略奠定基础。\n\
  \n## 设置简单的测试文件\n\n在你的 `tests` 目录下创建一个名为 `example.spec.ts` 的新文件。然后，添加以下代码：\n\n```\n\
  import { test, expect } from '@playwright/test';\ntest('homepage has Playwright\
  \ in title', async ({ page }) => {\n  // 导航到 Playwright 主页\nawait page.goto('https://playwright.dev');\n\
  \n  // 获取页面的标题\nconst title = await page.title();\n\n  // 断言标题是否包含 'Playwright'\n\
  expect(title).toContain('Playwright');\n});\n```\n\n这个简单的测试使用 Playwright Test 的\
  \ API 来定义一个新测试，然后启动浏览器页面并导航到 Playwright 主页。接下来，它获取页面标题并断言它包含 `Playwright` 关键字。\n\
  \n## 运行测试\n\n要运行测试，请在终端中执行以下命令：\n\n```\nnpx playwright test\n```\n\n测试运行器将扫描你的项目目录，找到你的测试文件，启动相应的浏览器，执行测试，然后输出报告。\n\
  \n你也可以像这样告诉 Playwright 运行特定的特定的测试：\n\n```\nnpx playwright test tests/example.spec.ts\n\
  ```\n\n此外，你可以通过以下命令启用调试模式：\n\n```\nnpx playwright test --debug\n```\n\n此命令将打开一个交互式检查器，帮助你排查测试执行过程中可能出现的任何问题。\n\
  \n我们将在第 8 章，*无头测试与调试*中深入探讨调试。\n\n默认情况下，Playwright 以无头模式（headless）运行测试，这意味着不会显示浏览器\
  \ UI。在有头模式下，测试执行期间会显示浏览器 UI。这对于调试或需要视觉确认的情况非常有用。\n\n你可以通过以下命令启用它：\n\n```\nnpx playwright\
  \ test --headed\n```\n\n你也可以通过修改测试配置 (`playwright.config.ts`) 来：\n\n```\nuse: {\n\
  \  headless: false,\n}\n```\n\nPlaywright 支持多个浏览器引擎：\n\n*   `Chromium`（用于 Chrome\
  \ 和 Edge）\n*   `Firefox`\n*   `WebKit`（用于 Safari）\n\n要在特定浏览器中运行测试，你可以使用此类 CLI 标志：\n\
  \n```\nnpx playwright test --project=chromium\nnpx playwright test --project=firefox\n\
  npx playwright test --project=webkit\n```\n\n或者，你也可以在 projects (`playwright.config.ts`)\
  \ 中定义项目：\n\n```\nprojects: [\n  { name: 'chromium', use: { headless: false } },\n\
  \  { name: 'firefox', use: { headless: false } },\n  { name: 'webkit', use: { headless:\
  \ false } },\n],\n```\n\n## 解析测试结果\n\n运行 `npx playwright test` 后，你将看到一个信息丰富的摘要。我们将在第\
  \ 6 章，*测试并行化*中深入探讨此。\n\n## 设置你的 IDE\n\n使用现代 IDE（如 **Visual Studio Code**，**VS Code**）可以提高你的编码体验。从安装实用的扩展开始，例如官方的\
  \ Playwright Test 扩展，它提供了语法高亮、代码补全和内联测试结果：\n\n![Figure 1.1: Extensions view in VS\
  \ Code](img/B34148_01_1.png)\n\n图 1.1：VS Code 中的扩展视图\n\n要在 VS Code 中安装扩展，请遵循以下步骤：\n\
  \n1.  点击侧边活动栏上的扩展图标进入扩展视图（或按 *Ctrl* + *Shift* + *X*）。\n\n## 组织你的项目\n\n为了让测试代码、辅助函数和配置清晰分离，请考虑以下结构：\n\
  \n```\nroot/\n├── auth/               # 凭据和会话导出\n├── fixtures/           # 静态或半静态测试数据\n\
  ├── helpers/            # 一次性或交叉函数\n├── playwright-report/  # 生成的 HTML 报告\n├── playwright.config.ts#\
  \ Playwright 设置\n├── package.json        # NPM 清单\n├── tsconfig.json       # TypeScript\
  \ 配置\n├── .gitignore          # 忽略排除的文件\n├── README.md           # 项目概述\n├── src/\
  \                # 页面对象模型 (POM)\n│   ├── pages/          # 单个页面类\n│   └── utils/\
  \          # 共享 API 逻辑\n└── tests/              # 测试场景\n    ├── in/            \
  \ # 与登录相关的测试\n    ├── out/            # 与注销相关的测试\n    └── example.spec.ts # 示例测试\n\
  ```\n\n这种组织方式使得：\n\n*   配置位于 `Root`：你的编译器选项、`playwright.config.ts`、环境变量，以及你的 `package.json`\
  \ 和 `.gitignore` 都在这里。\n*   在 `tests/` 中，我们将 `in` 和 `out` 场景分组到子目录中，以便共享设置逻辑（例如\
  \ `login.setup.ts`）并将相关的测试放在一起。\n*   `src/` 是你的**页面对象模型** (**POM**) 的核心。`pages/`\
  \ 存放单个页面类，而 `utils/` 是底层辅助函数的所在地。\n*   `fixtures/` 存放静态或半静态的测试数据（JSON、CSV 等），测试可以加载这些数据。\n\
  *   `auth/` 包含凭据、会话导出、令牌或任何你不希望散落在代码中的敏感或特定于环境的内容。\n*   `helpers/` 存放不适合整齐放入 `utils/`\
  \ 的一次性函数，例如列表生成器或自定义断言。\n*   最后，自动生成的输出（如原始 JSON 日志、HTML 报告、截图和视频）存储在 `test-results/`\
  \ 和 `playwright-report/` 中。\n\n\n\n\n\n2. 在搜索栏中，输入 `Playwright Test`。\n\n3. 找到由\
  \ Microsoft 提供的 `Playwright Test` VS Code 扩展并点击 `Install`。\n\n你也可以添加 `ESLint` 和\
  \ `Prettier` 进行代码格式化，这有助于保持代码的一致性。设置它们的步骤与你为 VS Code 安装 `Playwright Test` 非常相似。\n\
  \n## 配置 Playwright 设置\n\nPlaywright 允许你通过使用 `playwright.config.ts` 文件来自定义测试运行方式。在该文件中，你可以设置全局偏好、调整浏览器行为并微调测试的执行方式。本节将引导你了解关键设置以帮助你上手。\n\
  \n首先，进入你的项目目录。如果你还没有 `playwright.config.ts` 文件（可能你正在处理一个现有项目），可以手动创建配置文件。\n\n以下是一个最小配置的示例：\n\
  \n```\nimport { defineConfig } from '@playwright/test';\nexport default defineConfig({\n\
  \  testDir: './tests', // 测试文件所在的目录\ntimeout: 30000, // 测试超时时间（毫秒）\nuse: {\n   \
  \ browserName: 'chromium', // 默认浏览器\nheadless: true, // 以无头模式运行测试\nviewport: { width:\
  \ 1280, height: 720 }, // 默认窗口大小\n  },\n});\n```\n\n一旦初始配置到位，你就可以开始进行自定义，以更好地满足你项目的特定测试需求。\n\
  \n配置文件支持多种选项来自定义测试执行。在设置时，最好起开始保持简单。从基础设置开始，仅在以后需要时再增加复杂性。此外，确保通过在配置文件中添加注释来记录你的选择。这样，你就能轻松地记住为什么进行某些设置，对于之后其他维护该项目的人来说也会更加清晰。\n\
  \n以下是最常用的设置。我们将在后面的章节中再次讨论其中许多内容，所以如果你现在还不完全确定它们是如何运作的，不必担心。\n\n### 测试目录和文件匹配\n\n\
  使用这些选项控制 Playwright 在发现测试时包含或排除哪些：\n\n* `testDir`：指定包含测试文件的目录。默认情况下，Playwright 在\
  \ `./tests` 文件夹中查找测试。\n\n* `testMatch`：定义匹配测试文件的模式（例如 `*.spec.ts` 或 `/*.test.ts`）。\n\
  \n* `testIgnore`：从测试发现中排除文件或目录（例如 `/*.setup.ts`）。\n\n以下是一个示例：\n\n```\nexport default\
  \ defineConfig({\n  testDir: './tests',\n  testMatch: '/*.spec.ts',\n  testIgnore:\
  \ '/*.unit.ts',\n});\n```\n\n### 超时设置\n\n这些设置定义了 Playwright 在测试运行的不同阶段在超时之前应该等待多长时间：\n\
  \n* `timeout`：单个测试完成的最大时间（毫秒）\n\n* `globalTimeout`：整个测试套件运行的最大时间\n\n* `actionTimeout`：单个\
  \ Playwright 动作（例如 `page.click()`）的超时时间\n\n以下是一个示例：\n\n```\nexport default defineConfig({\n\
  \  timeout: 30000, // 每个测试 30 秒\nglobalTimeout: 1800000, // 整个套件运行 30 分钟\nuse: {\n\
  \    actionTimeout: 10000, // 每个动作 10 秒\n  },\n});\n```\n\n### 浏览器和上下文选项\n\n`use`\
  \ 属性定义了所有测试的默认浏览器和上下文设置：\n\n* `browserName`：指定浏览器（Chromium、Firefox 或 WebKit）\n\n\
  * `headless`：以无头（`true`）或有头（`false`）模式运行浏览器\n\n* `viewport`：设置默认窗口大小\n\n* `locale`：配置浏览器的语言（例如\
  \ `en-US`）\n\n* `timezoneId`：设置浏览器的时区（例如 `America/New_York`）\n\n* `device`：模拟 Playwright\
  \ 设备列表中的特定设备（例如 `iPhone 16`）\n\n以下是一个示例：\n\n```\nexport default defineConfig({\n\
  \  use: {\n    browserName: 'firefox',\n    headless: false,\n    viewport: { width:\
  \ 1920, height: 1080 },\n    locale: 'en-GB',\n    timezoneId: 'Europe/London',\n\
  \    device: 'Desktop Firefox',\n  },\n});\n```\n\n### 并行和工作线程\n\n这些选项管理测试如何并行执行以及跨\
  \ CPU 资源执行：\n\n* `workers`：并行测试工作线程的数量。设置为数字（如 `4`）或 `'50%'` 以使用一半的 CPU 核心\n\n*\
  \ `fullyParallel`：启用（`true`）或禁用（`false`）在单个文件内并行运行测试\n\n以下是一个示例：\n\n```\nexport\
  \ default defineConfig({\n  workers: 3, // 并行运行 3 个测试\nfullyParallel: true,\n});\n\
  ```\n\n### 重试和失败处理\n\n这些设置有助于控制测试重试以及测试运行在失败后何时停止：\n\n* `retries`：控制失败的测试在标记为失败之前重试的次数\n\
  \n* `maxFailures`：设置全局阈值，规定在 Playwright 停止整个测试运行之前允许的测试失败次数\n\n以下是一个示例：\n\n```\n\
  export default defineConfig({\n  retries: 2, // 重试失败的测试两次\nmaxFailures: 10, // 失败\
  \ 10 次后停止\n```\n\n\n\n默认情况下，Playwright 的测试运行器会将你的测试文件分发到多个工作进程中（通常每个 CPU 核心一个），以充分利用现代多核系统的性能。这种并发处理机制缩短了整体测试时间，特别是对于大型项目，因为它能够同时运行多个测试，而不是等待一个测试完成后再开始下一个。\n\
  \nPlaywright 允许你通过 `playwright.config.ts` 中的配置来控制线程的数量：\n\n```typescript\nimport\
  \ { defineConfig } from '@playwright/test';\nexport default defineConfig({\n  workers:\
  \ 4,\n  // … other settings\n});\n```\n\n测试隔离对于确保一个测试的结果永远不会影响另一个测试至关重要。在 Playwright\
  \ 中，隔离通过为每个测试使用新的浏览器上下文（browser context）来实现。由于每个测试都有自己的浏览器上下文，由一个测试设置的任何状态（如 cookie、会话数据或本地存储）都仅局限于该测试本身。\n\
  \n这种分离是由 Playwright 测试运行器自动完成的。即使一个测试登录了应用程序、操作了本地存储或更改了 cookie，这些更改也处于特定的上下文中，这对于避免出现不稳定的（flaky）测试结果至关重要。\n\
  \n## 使用内置钩和固件\n\nPlaywright 的内置钩（hooks）和固件（fixtures）是让编写隔离测试变得简单的两个特性。让我们探索一下吧！\n\
  \n### 钩 (Hooks)\n\n`Hooks`是在测试过程中特定时刻运行的函数。你可以使用它们在测试开始之前初始化资源，例如打开数据库连接或准备测试数据。当测试完成后，钩可以帮助你完成收尾工作：关闭连接、清理数据或为下次运行记录有用信息。\n\
  \n常见的钩包括：\n\n* `test.beforeAll`：在文件或组中的所有测试之前运行一次。这适用于那些只需要执行一次的昂贵设置任务。\n* `test.beforeEach`：在每个单独的测试之前执行。非常适合导航到起始页面或确保状态新鲜等操作。\n\
  * `test.afterEach`：在每个测试之后运行，允许你清理资源或重置某些配置。\n* `test.afterAll`：在文件或组中的所有测试之后运行一次，通常用于最终清理。\n\
  \n例如，假设你想编写一个脚本，登录网站并运行两个测试：一个确认库存页的标题，另一个确认购物车链接是否可见。以下是你可以使用 `beforeEach` 钩编写此脚本的方式：\n\
  \n```typescript\nimport { test, expect } from '@playwright/test';\ntest.beforeEach(async\
  \ ({ page }) => {\n  await page.goto('https://www.saucedemo.com/');\n  await page.getByPlaceholder('Username').fill('standard_user');\n\
  \  await page.getByPlaceholder('Password').fill('secret_sauce');\n  await page.getByRole('button',\
  \ { name: 'Login' }).click();\n  await expect(page).toHaveURL(/inventory.html/);\n\
  });\ntest('Check inventory page title', async ({ page }) => {\n  await expect(page).toHaveTitle('Swag\
  \ Labs');\n});\ntest('Check shopping cart link is visible', async ({ page }) =>\
  \ {\n  const cartLink = page.locator('.shopping_cart_link');\n  await expect(cartLink).toBeVisible();\n\
  });\n```\n\n该脚本首先从 `@playwright/test` 模块导入 `test` 和 `expect` 函数。它们是 Playwright 测试框架的一部分，其中\
  \ `test` 用于定义测试用例，而 `expect` 用于断言。\n\n定义了 `test.beforeEach` 钩在每个测试之前运行。它会打开一个新的浏览器页面并导航到\
  \ `https://www.saucedemo.com/`，这是一个非常有用的测试演示电子商务网站。\n\n第一个实际测试验证了登录后页面标题是否恰好为 `Swag\
  \ Labs`。这是确认应用程序已加载正确页面的快捷方法。\n\n第二个测试检查购物车链接（位于应用程序右上角）是否在页面上可见。它使用 CSS 类选择器 `.shopping_cart_link`\
  \ 来定位元素，然后检查它对用户是否可见。\n\n如果你现在还没有完全理解这段代码是如何工作的，也不要担心。现在重要的是知道 `beforeEach` 钩会准备好一切，以便每个测试都在带有身份验证的会话中运行。\n\
  \n### 固件 (Fixtures)\n\n另一方面，`fixture` 是一种预配置的助手，它为你的测试设置所需的所有内容。它负责资源的创建、配置和清理。这意味着你不需要重复编写相同的设置代码。\n\
  \n当你定义测试时，可以指定你需要的资源（例如 `page`、`browser` 或自定义资源），Playwright 将通过运行必要的固件函数自动提供这些资源。\n\
  \n例如，`request` 固件为你提供一个 `APIRequestContext` 实例，让你可以在同一个测试套件中轻松执行 HTTP 请求并在 Web 交互的同时进行\
  \ API 测试。你可以使用 `request.get()`、`request.post()` 和 `request.fetch()` 等方法与 API 交互。它是针对每个测试隔离的，因此无需担心共享状态问题。\n\
  \n以下是在 Playwright 中使用 `request` 固件的示例：\n\n```typescript\nimport { test, expect }\
  \ from '@playwright/test';\ntest('check API response', async ({ request }) => {\n\
  \  const response = await request.get('https://api.github.com');\n  expect(response.status()).toBe(200);\n\
  });\n```\n\n\n\n我们将从探索 Playwright 推荐的元素查找方式开始：`getBy*` 定位器。你还将学习何时切换到更传统的选择器会更明智。接下来，我们将查看\
  \ Playwright 如何处理元素的等待等待，以确保你的测试在处理动态内容时依然保持顺畅。我们还将涵盖如何处理浏览器警窗（alerts）、确认框（confirms）和提示框（prompts）。\n\
  \n你将熟练测试 iframes 内部的内容，并学习如何进入 shadow DOM 来测试存在于这些隐藏层中的 Web 组件。到本章结束时，你将准备好编写即使在应用程序\
  \ UI 不断变化也能保持健壮的测试。\n\n本章由以下部分组成：\n\n*   优先使用 Playwright 的 `getBy*` 定位器进行可访问性测试\n\
  *   在复杂或不支持的情况下使用备用选择器（`CSS`、`XPath`、基于文本的选择器）\n*   通过自动等待和自定义等待管理动态元素\n*   处理警窗框和确认对话框\n\
  *   与 iframes 和嵌套框架进行交互\n*   处理 shadow DOM 组件\n\n## 技术要求\n\n本章的源代码可在 `https://github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright/tree/main/Chapter02`\
  \ 获取。\n\n# 优先使用 Playwright 的 `getBy*` 定位器进行可访问性测试\n\n当你使用 Playwright 编写端端测试时，你选择的定位器会产生巨大影响：不仅影响测试的可靠性，还会影响你应用的可访问性（accessibility）。Playwright\
  \ 的 `getBy*` 定位器旨在旨在反映真实用户（包括使用辅助技术的辅助）如何与你的网站交互。通过依赖这些定位器，你不仅让测试更易维护，而且还在构建一个更具包容性的体验。让我们深入探讨为什么这些定位器更受青。\n\
  \n## 为什么 getBy* 定位器优于 CSS 和 XPath\n\nPlaywright 通过提供一组实用的定位器（如 `getByRole`、`getByLabel`、`getByPlaceholder`\
  \ 等），使得处理 Web 元素变得简单。这些定位器的设计考虑了可访问性，是旧式 CSS 或 XPath 选择器的现代替代方案（我们稍后会详细探讨这些内容）。\n\
  \n使用这些 `getBy*` 定位器最大的优势之一是它们能够优雅地处理 DOM 的变化。与依赖页面布局或样式的 CSS 或 XPath 不同，这些定位器针对的是元素背后的含义（如角色、标签和可见文本等）。这意味着即使\
  \ HTML 或样式被重写，只要这些可访问性属性保持不变，你的测试就有可能继续运行。\n\n例如，与其编写复杂的 CSS 选择器来定位按钮，你只需要使用以下：\n\
  \n```\ntest('Submits the form on button click', async ({ page }) => {\n  const submitButton\
  \ = await page.getByRole('button', \n    { name: /submit/i });\n  await submitButton.click();\n\
  });\n```\n\n在这里，`getByRole('button', { name: /submit/i })` 告诉 Playwright 寻找一个其可访问名称（例如其可见标签或\
  \ `aria-label`）匹配不区分大小写的正则表达式 `/submit/i` 的按钮元素。\n\n`/submit/` 是模式本身：它匹配精确的单词 *submit*。`i`\
  \ 是一个标志，使匹配不区分大小，因此它将匹配 *Submit*、*submit*、*SUBMIT* 等。\n\n虽然 `getBy*` 定位器不能完全替代全面的可访问性审计（如使用\
  \ Axe 等工具进行的审计），但它们可以帮助及早发现潜在问题。例如，如果 `getByRole` 定位器找不到按钮，可能意味着该元素缺少正确的 ARIA 角色或可访问名称。及早发现此类问题可以让你在任何上线之前获得修复的机会。\n\
  \n### 什么是 ARIA？\n\n`ARIA`（`Accessible Rich Internet Applications` 的缩写）在使网站对使用屏幕阅读器等辅助技术的人更具包容性和用户友好方面起着重要作用。它通过为页面上的元素添加额外信息（特别是自定义按钮、弹出窗口、滑块或任何用\
  \ JavaScript 构建的内容）来帮助这些元素默认可能无法被理解。ARIA 角色、状态和属性告诉辅助工具页面每个部分的用途以及其行为，以便户能够更轻松地导航和与之交互。\n\
  \n可用的 `getBy*` 定位器包括：\n\n*   `getByLabel`: 通过关联标签定位元素，例如链接到 `<label>` 标签的表单输入\n\
  *   `getByRole`: 通过其 ARIA 角色查找元素，如 `button` 或 `dialog`，并带有可选名称过滤\n*   `getByPlaceholder`:\
  \ 通过其占位文本定位输入框\n*   `getByText`: 通过其可见文本内容匹配元素\n*   `getByAltText`: 通过其替代文本（alt\
  \ text）定位图像\n*   `getByTitle`: 通过其 title 属性查找元素\n*   `getByTestId`: 通过自定义 test ID\
  \ 属性定位元素\n\n## 结合可访问性重新审我们的脚本\n\n让我们再次查看在 *第 1 章* *快速设置回顾* 中使用的脚本，用于登录电子商务网站并然后运行两个测试：\n\
  \n```\nimport { test, expect } from '@playwright/test';\ntest.beforeEach(async ({\
  \ page }) => {\n  await page.goto('https://www.saucedemo.com/');\n  await page.getByPlaceholder('Username').fill('standard_user');\n\
  \  await page.getByPlaceholder('Password').fill('secret_sauce');\n  await page.getByRole('button',\
  \ { name: 'Login' }).click();\n  await expect(page).toHaveURL(/inventory.html/);\n\
  });\ntest('Inventory page title', async ({ page }) => {\n  await expect(page).toHaveTitle('Swag\
  \ Labs');\n});\ntest('Check cart link is visible', async ({ page }) => {\n  const\
  \ cartLink = page.locator('.shopping_cart_link');\n  await expect(cartLink).toBeVisible();\n\
  });\n```\n\n这个测试不仅关注功能性，还关注可访问性，因为它依赖于辅助技术至关重要的属性。如果测试失败，可能意味着存在可访问性问题，例如缺少标签或角色，这些可以在部署之前解决。\n\
  \n在复杂情况下，你可能需要通过组合定位器来缩小范围。例如，为了定位表单中的特定按钮，你可以使用 `page.locator('form').getByRole('button',\
  \ { name: 'Submit' })`。\n\n脚本中的第二个测试使用 `page.locator('.shopping_cart_link')` 而不是\
  \ `getBy*` 方法（如 `getByRole` 或 `getByTestId`），是因为元素在页面 HTML 中的定义方式。\n\n目标元素如下：\n\n\
  ```\n<a class=\"shopping_cart_link\" data-test=\"shopping-cart-link\"></a>\n```\n\
  \n该 `<a>` 标签没有内部文本，没有可访问角色覆盖，也没有 ARIA 标签。Playwright 的 `getByRole()` 或 `getByText()`\
  \ 无法匹配它。同样，`getByLabel()`、`getByPlaceholder()` 等都依赖于可访问属性或标签，而该元素缺乏这些内容。\n\n当可访问标签或角色不可用时，退回到更通用的选择器是重要的。这引导我们进入下一节。\n\
  \n\n\n\n\n这就是 `fallback selectors`（回退选择器）大用场。当 HTML 结构不佳或你在处理外部组件时，它们可以完成任务。请记住，这些选择器通常依赖于页面结构或内部实现细节，这意味着如果页面发生变化，它们更容易失效。因此，虽然回退选择器在某些情况下很有用，但最好尽可能坚持使用\
  \ `getBy*` 定位器或 `test IDs`（我们稍后会讨论 test IDs）。\n\n## CSS 选择器\n\n在 Playwright 中，你可以通过\
  \ `page.locator()` 方法使用 `CSS selectors`。除非你通过开头使用 `xpath=` 等方式显式指定，否则 Playwright\
  \ 会自动假设你正在使用 CSS 选择器。\n\n例如，如果你想点击页面上的第一个按钮，可以编写以下代码：\n\n```\nawait page.locator('button').click();\n\
  ```\n\n如果你需要更具体的定位，可以使用如下类名、ID 或属性：\n\n```javascript\n// 为 ID 为 'login-form' 的输入框填充内容\n\
  await page.locator('#login-form').fill('user@example.com');\n// 填充密码输入框\nawait page.locator('input[type=\"\
  password\"]').fill('secret');\n```\n\nCSS 选择器对大多数开发者来说都是熟悉的且通常运行良好，但由于它们依赖于页面结构（该结构会随时间变化），过于复杂或深层嵌套的选择器（如\
  \ `#tsf > div:nth-child(2) > button`）很容易导致你的测试失败。这类选择器也不利于测试访问性，因为它们不像 `getBy*`\
  \ 定位器那样关注面向用户的属性。\n\n为了让你的测试更可靠，请尽量保持 CSS 选择器的简单。可能的情况下，使用 test IDs，它们可以在不依赖脆弱的页面结构的情况下定位元素。\n\
  \n## XPath 选择器\n\nXPath 是一种用于选择 XML 或 HTML 文档中节点的查询语言。在 Playwright 中，`page.locator()`\
  \ 也支持 XPath 选择器，任何以 `//` 或 `..` 开头的选择器都会被自动视为 XPath 表达式。\n\n使用 XPath 选择器，将其传递给 `page.locator()`。例如，这里是点击提交按钮的方法：\n\
  \n```javascript\nawait page.locator('//button[@type=\"submit\"]').click();\n```\n\
  \n此 XPath 选择了页面上任何具有 `type=\"submit\"` 属性的 `<button>` 元素。`//` 表示在整个 DOM 中搜索此类按钮，而\
  \ `[@type=\"submit\"]` 则过滤出仅包含该特定属性的元素。\n\n当 CSS 选择器无法胜任时，XPath 特别好用，例如当你需要根据文本内容或在其他元素中的嵌套方式来选择元素时：\n\
  \n```javascript\n// 选择包含特定文本的 div\nawait page.locator('//div[contains(text(), \"\
  Welcome\")]').click();\n// 选择特定表单的子按钮\nawait page.locator('//form[@id=\"login-form\"\
  ]//button').click();\n```\n\nPlaywright 还支持显式的 XPath 前缀以增加清晰度：\n\n```javascript\n\
  await page.locator('xpath=//button[@type=\"submit\"]').click();\n```\n\n由于 XPath\
  \ 表达式与页面结构紧密相关，如果布局发生变化，它们可能会失效。它们通常也比 CSS 选择器慢，尤其是当表达式变得复杂时。\n\n维护长或复杂的 XPath 字符串（如\
  \ `//*[@id=\"tsf\"]/div[2]/button`）可能很困难，最好尽可能避免。通常最好坚持使用 CSS 或 `getBy*` 定位器，除非\
  \ XPath 是唯一的选择。如果你确实需要使用 XPath，请尽量保持其简单，并专注于通过唯一属性或特定文本内容来选择元素。\n\n## 基于文本的选择器\n\
  \n如果你的目标元素包含文本内容，与 CSS 或 XPath 选择器相比，使用 `page.getByText()` 是一个更可读且更直接的选择。例如，如果你正在寻找一条欢迎消息，你可以这样写：\n\
  \n```javascript\nawait expect(page.getByText('Welcome, John')).toBeVisible();\n\
  ```\n\n默认情况下，`page.getByText()` 匹配子字符串并归一化空格。这意味着它将多个空格视为一个，并忽略任何前导或后缀空格。如果你需要更精确的匹配，可以使用精确匹配或正则表达式等选项来细调你的查询。\n\
  \n对于精确匹配，你可以这样操作：\n\n```javascript\nawait page.getByText('Welcome, John', { exact:\
  \ true }).click();\n```\n\n或者，如果你想使用正则表达式进行匹配（例如，名称可能会变化），请尝试以下操作：\n\n```javascript\n\
  await page.getByText(/welcome, [A-Za-z]+$/i).click();\n```\n\n`/` 和 `/` 表示正则的开始和结束；`i`\
  \ 标志使匹配不区分大小写。`[A-Za-z]+` 模式匹配一个或多个字母（大写或小写），`$` 断言这是字符串的结束。因此，它可以匹配诸如 `\"Welcome,\
  \ John\"` 或 `\"welcome, alice\"`，但不会匹配 `\"welcome, John123\"` 或 `\"hi, John\"`。\n\
  \n你也可以使用文本选择器来过滤其他定位器。假设你想点击一个包含文本 `Submit` 的按钮。与其仅通过角色搜索，不如通过文本进行过滤：\n\n```javascript\n\
  await page.getByRole('button').filter({ hasText: 'Submit' }).click();\n```\n\n基于文本的选择器并不适用于所有情况。如果文本频繁变化（如本地化或动态内容），你的测试失败可能会比你预期的更频繁。\n\
  \n除了通过文本过滤外，你还可以通过子元素/后代、不包含文本来过滤定位器。\n\n集成 test IDs\n\n如果你发现自己经常依赖回退选择器，这可能意味着你的应用程序缺少属性。改进这一点的一种棒方法是添加\
  \ test IDs，它们提供了一种可靠的定位元素的方式。Playwright 通过 `getByTestId()` 实现了这一点，它查找具有 `data-testid`\
  \ 属性的元素。\n\n示例：\n\n```javascript\n// HTML: <button data-testid=\"submit-button\"\
  >Submit</button>\nawait page.getByTestId('submit-button').click();\n```\n\n默认使用\
  \ `data-testid`。要使用自定义属性，你可以在配置中进行设置：\n\n```javascript\nimport { defineConfig }\
  \ from '@playwright/test';\nexport default defineConfig({\n  use: {\n    testIdAttribute:\
  \ 'data-pw'\n  }\n});\n\n# 使用自动等待和自定义等待管理动态元素\n\n在处理现代 Web 应用程序时，你经常会遇到根据用户操作或后台发生发生的情况而显示、消失或改变的动态元素。这些变化会让自动化测试变得棘手。如果你的测试在元素准备好之前尝试与其交互，可能会导致失败或行为不一致。\n\
  \nPlaywright 有内置的自动等待功能为你提供支持，它会暂停测试，直到元素准备就绪。但有时，你可能需要更多的控制，这就是自定义等待大用场的地方。\n\n\
  \n\n\n\n这就是 Playwright 的 `auto-wait`（自动等待）机制以及一系列自定义等待方法的用武之场：它们确保每个操作只有在应用程序处于预期状态时才执行。Playwright\
  \ 不再依赖于超时的猜测，而是使用智能自动等待来暂停测试执行，直到元素实际上准备就绪。\n\n它包含了一些实用的内置方法，如 `waitForLoadState`、`waitForResponse`\
  \ 和 `waitForFunction`，这些方法可以实时监控你的应用的行为和反应。这使得你的测试变得更易维护。\n\n当你执行点击按钮或填充文本字段等操作时，Playwright\
  \ 会自动确保元素满足以下条件：\n\n*   **可见（Visible）**：元素已在页面上渲染并可见。\n*   **稳定（Stable）**：元素没有在移动或调整大小（没有正在进行的动画）。\n\
  *   **可用（Enabled）**：元素未被禁用且可以进行交互。\n*   **可接收（Receivable）**：元素可以接收输入或点击（未被其他元素元素）。\n\
  \n这种内置等待消除了对任意暂停（如固定延迟）的需求。\n\n## 针对特定场景使用自定义等待\n\n虽然 Playwright 的自动等待在大多数情况下都表现出色，但在某些时候你可能需要更多的控制。当你需要等待特定内容时，`Custom\
  \ waits`（自定义等待）就变得非常有用。\n\n例如，你可能正在等待网络响应、动画完成，或者 Playwright 无法自动捕获的应用状态变化。在这些情况下，自定义等待逻辑有助于保持测试的可靠性。\n\
  \n幸运的是，Playwright 提供了多种构建自定义等待的方法。\n\n### page.waitForRequest(urlOrPredicate)\n\n\
  此方法等待特定的网络请求被启动。你可以提供一个 URL 或谓词函数来匹配该请求。\n\n这是一个示例：\n\n```\nawait page.waitForRequest('https://example.com/api/data');\n\
  ```\n\n这对于测试 API 驱动的应用程序特别有用。\n\n### page.waitForResponse(urlOrPredicate)\n\n`waitForResponse`\
  \ 等待网络响应并允许你验证响应的 URL、状态或其他属性。\n\n这是一个示例：\n\n```\nawait page.waitForResponse(response\
  \ => response.url().includes('api/orders') && response.status() === 200);\n```\n\
  \n这会等待来自 `/api/orders` 端点且状态码为 `200` 的响应。\n\n###waitForRequest` 和 `waitForResponse`\
  \ 都用于监控网络活动，但它们的作用不同。`waitForRequest` 等待浏览器启动特定的 HTTP 请求，该请求匹配 URL 或请求方法等标准。它适用于验证请求是否已发送（例如由用户操作触发的\
  \ API 调用）。相比之下，`waitForResponse` 等待服务器对特定请求的响应，并允许你检查响应状态、标头或正文（例如确认 API 响应成功）。简而言之，`waitForRequest`\
  \ 监控发出的内容，而 `waitForResponse` 监控返回的内容。它们结合使用可以让你对测试中的网络行为有极佳的控制力。\n\n### page.waitForLoadState(state)\n\
  \n此方法等待页面达到特定的加载状态。\n\n这是一个示例：\n\n```\nawait page.waitForLoadState('networkidle');\n\
  ```\n\n你通常不需要手动调用此方法，因为 Playwright 在执行操作之前会自动等待元素加载。\n\n### page.waitForFunction(pageFunction,\
  \ arg, options)\n\n你可以使用此方法等待 JavaScript 函数（`pageFunction`）在浏览器上下文中执行并返回真值（truthy\
  \ value）。\n\n这是一个示例：\n\n```\nawait page.waitForFunction('document.querySelector(\"\
  .my-element\") !== null');\n```\n\n在这里，我们告诉 Playwright 等待类名为 `my-element` 的元素存在。\n\
  \n### page.waitForEvent(event, options)\n\n当你需要等待页面上发生特定事件（如弹出窗口、下载或 websocket）时，请利用此方法。\n\
  \n这是一个示例：\n\n```\nconst popup = await page.waitForEvent('popup');\n```\n\n这段代码会等待一个新的浏览器窗口/标签页打开并返回该弹出页面。\n\
  \n### page.waitForURL(url, options)\n\n此方法用于暂停脚本执行，直到页面的 URL 匹配指定的值或模式。\n\n这是一个示例：\n\
  \n```\nawait page.waitForURL('**/newpage.html');\n```\n\n这对于处理页面重定向、等待导航完成或在单页应用切换期间管理动态\
  \ URL 变化特别有用。\n\n### page.waitForTimeout(milliseconds)\n\n此方法将按指定的毫秒数暂停测试执行。此方法被认为是一种反模式（anti-pattern），因为它引入了硬编码延迟，可能导致测试不稳定（flaky）。Playwright\
  \ 鼓励使用更健壮的等待机制来等待特定条件，而不是任意的时间间隔。\n\n这是一个示例：\n\n```\nawait page.waitForTimeout(3000);\
  \ // 等待 3 秒\n```\n\n仅将其作为调试的最后手段，或者在没有其他可靠等待条件时使用它。\n\n### page.waitForSelector(selector,\
  \ options)\n\n此方法等待匹配给定选择器的元素在 DOM 中出现。然而，通常不建议这样做，因为 Playwright 已经处理了在交互之前等待元素准备就绪。使用定位器对象（locator\
  \ objects）和 Web 优先断言（web-first assertions）有助于你的代码顺畅运行，无需使用 `waitForSelector`。\n\n\
  这是一个示例：\n\n```\nawait page.waitForSelector('#submit-button', { state: 'visible',\
  \ timeout: 5000 });\n```\n\n这将最多等待 5 秒直到 `#submit-button` 变为可见。\n\n### page.waitForNavigation(options)\n\
  \n你可以使用此方法等待页面导航到新的 URL，通常由表单提交或链接点击触发。你可以指定预期的 URL 和超时。\n\n这是一个示例：\n\n```\nawait\
  \ page.getByRole('link', { name: 'Dashboard' }).click();\nawait page.waitForNavigation({\
  \ url: 'https://example.com/dashboard', timeout: 10000 });\n```\n\n在 Playwright\
  \ 的最新版本中，`page.waitForNavigation` 被认为已过时。Playwright 建议使用 `waitForURL` 或直接依赖导航方法返回的\
  \ Promise。例如，当你使用 `await page.goto(url)` 时，它已经等待导航完成。因此，在大多数情况下，不需要单独调用 `waitForNavigation`。如果你正在等待更多的导航事件，可以使用\
  \ `page.waitForEvent('navigated')`。\n\n## 应用示例：验证语言切换\n\n现在你已经熟悉了创建自定义等待的不同方法，让我们来看一个真实的示例。假设你想编写测试脚本，导航到维基百科文章，模拟用户点击访问其他语言的按钮，并打开文章的德语版本。\n\
  \n我们可以这样实现：\n\n```\nimport { test, expect } from '@playwright/test';\ntest('Change\
  \ article language to Deutsch', async ({ page }) => {\n  // 进入维基百科页面\n  await page.goto('https://en.wikipedia.org/wiki/Playwright_(software)');\n\
  \  // 点击切换语言\n  await page.getByRole('button', { name: 'Go to an article in another'\
  \ }).click();\n  // 点击德语链接\n  await page.getByRole('link', { name: 'Deutsch' }).click();\n\
  \  // 等待德语维基百科 URL\n  await page.waitForURL('https://de.wikipedia.org/wiki/Playwright_(Software)',\
  \ { timeout: 5000 });\n  // 断言 URL 符合预期\n  expect(page.url()).toContain('de.wikipedia.org');\n\
  \  console.log('成功导航到德语维基百科。');\n});\n```\n\n\n\n\n\n脚本首先导航到英文版的 `Playwright (software)`\
  \ 维基百科条目。接下来，它模拟用户点击按钮以访问其他语言的文章。这是通过 `page.getByRole()` 实现的，它搜索可访问名称包含 `Go to an\
  \ article in another` 的按钮元素。一旦找到，使用 `click()` 方法模拟用户的点击操作。\n\n之后，脚本点击标记为 `Deutsch`\
  \ 的链接，以打开文章的德语版本。和之前一样，它使用 `getByRole()` 通过其可访问名称找到链接。然后，脚本使用 `page.waitForURL()`\
  \ 等待浏览器导航到预期的德国 URL，这确保了导航在 5 秒的超时时间内完成。这对于确认页面跳转成功发生至关重要。\n\n确认导航后，我们使用 `expect`\
  \ 来验证页面 URL 是否包含 `de.wikipedia.org`，这表明德语维基百科站点已加载。\n\n请记住，Playwright 的自动等待（auto-wait）功能已经替你处理了大多数标准情况。只有在处理超出常规的情况时，才尝试使用自定义等待。最好避免使用类似\
  \ `await page.waitForTimeout(5000)` 的固定延迟。它们会减慢测试速度；相反，请坚持自动等待或仅暂停足够时间的智能自定义等待。不要忘记：所有等待方法都允许你设置超时。你可以根据应用程序的性能调整这些设置，以免等待时间过长或过早失败。\n\
  \n因此，自定义等待让你对页面或元素何时就绪进行精确控制，但 Web 应用程序通常具有警框和确认弹出窗口等组件，需要不同的处理方法。让我们来看看此类交互元素的最佳方式。\n\
  \n# 处理警框和确认对话框\n\n在 Playwright 中处理 `browser dialogs`（例如 `alerts`、`confirmations`\
  \ 和 `prompts`）异常简单，得益于它的事件驱动型 API。只要页面上出现对话框，Playwright 就能让你立即与其交互。\n\n在 Web 应用中，这些对话框通常在调用\
  \ `window.alert()`、`window.confirm()` 或 `window.prompt()` 等 JavaScript 函数时弹出。这些模态窗口会暂停\
  \ JavaScript 执行，直到用户做出响应。\n\nPlaywright 允许你通过监听页面上的 `'dialog'` 事件来处理这些情况。当对话框出现时，Playwright\
  \ 会发出该事件并交给你对话框对象，你可以使用它来了解对话框的类型。你可以使用以下方法：\n\n* `dialog.type()`：确定它是 alert（警框）、confirm（确认）还是\
  \ prompt（提示）\n* `dialog.message()`：读取对话框中显示的消息\n* `dialog.defaultValue()`：如果是 prompt，则查看默认输入文本\n\
  \n它还允许你与对话框交互：\n\n* `dialog.accept()` 类似于点击 `OK`。对于 prompt，你可以传递字符串来模拟用户输入。\n* `dialog.dismiss()`\
  \ 类似于点击 `Cancel`，这对于确认对话框特别有用。\n\n只需确保在触发导致对话框的动作之前设置好对话框处理器即可；否则你可能会错过它。\n\n假设你测试的页面可能会显示多个对话框。在这种情况下，你可以编写以下代码：\n\
  \n```\nimport { test } from '@playwright/test';\ntest('handle all dialogs', async\
  \ ({ page }) => {\n  page.on('dialog', async dialog => {\n    console.log(`Dialog\
  \ type: ${dialog.type()}, \n                 message: ${dialog.message()}`);\n \
  \   if (dialog.type() === 'prompt')\n      await dialog.accept('some answer');\n\
  \    else if (dialog.type() === 'confirm')\n      await dialog.accept();      //\
  \ clicks \"OK\"\nelse\nawait dialog.dismiss();     // clicks \"Cancel\"\n  });\n\
  \  await page.goto(' https://testpages.eviltester.com/styled/alerts/alert-test.html');\n\
  \  await page.getByRole('button', {name: 'Show alert box'}).click();\n  await page.getByRole('button',\
  \ {name: 'Show confirm box'}).click();  \n});\n```\n\n此测试导航到 alerts 演示页面，并通过点击标记为\
  \ `Show alert box` 和 `Show confirm box` 的按钮触发两个对话框。脚本监听并处理页面触发的所有 JavaScript 对话框（alerts、confirms\
  \ 和 prompts）。\n\n在这里我们使用 `page.on()` 方法，是因为测试运行期间会出现多个对话框。但如果你预期只有一个对话框，也可以使用 `page.once()`（将\
  \ `page.on()` 替换为 `page.once()` 以查看效果）。这可以防止处理器无意中影响测试的无关部分。\n\n为了确保你的对话框显示正确的消息，你可以使用\
  \ `dialog.message()` 获取它并与预期文本进行对比。当你测试应用程序中的错误消息、确认框或指令性警框时，这非常有用。\n\n此外，不要忘记在测试中接受（accept）或关闭（dismiss）对话框。如果你让它悬在那里，模态可能会阻塞后续步骤并导致测试无限挂起。\n\
  \n在测试不同的网页时，你可能会遇到一个障碍是处理 iframes 和嵌套帧，它们被用于显示来自其他源或网站不同部分的内容。在下一节中，我们将介绍如何在自动化任务中流畅地处理这些元素。\n\
  \n# 与 iframes 和嵌套帧交互\n\nPlaywright 将每个网页视为由帧组成的树。主文档是主帧（main frame），其内部的任何 `<iframe>`\
  \ 元素都被被视为子帧（child frames）。某些网站使用 iframes 甚至嵌套帧来组织内容，通常是为了安全或保持内容模块化。如果你想与这些帧内部的内容进行交互（例如点击按钮），则需要将焦点切换到特定的帧。\n\
  \n## 访问 iframe\n\n`<iframe>` 元素创建一个加载另一个 HTML 文档的内联帧。它作为一个独立的浏览上下文运行，这意味着 `iframe`\
  \ 内部的元素与父页面是隔离的。\n\n要与 iframe 内部的元素协作，首先使用 `frameLocator` 找到 iframe。只需调用 `page.frameLocator(selector)`\
  \ 并传入 iframe 的 CSS 选择器、ID 或其他属性进行定位。一旦获取了 iframe，你就可以 `locator` 方法找到其内部元素并执行诸如点击、填充表单等操作。\n\
  \n这是一个示例：\n\n```\nimport { test, expect } from '@playwright/test';\ntest('Interact\
  \ with iframe', async ({ page }) => {\n  await page.goto('https://testpages.eviltester.com/styled/iframes-test.html');\n\
  \  // 定位 iframe\n  const frame = page.framelocator('#thedynamichtml');\n  // 与 iframe\
  \ 内部的元素交互\n  await expect(frame.getByRole('heading', { name: 'iFrame' })).toBeVisible();\n\
  });\n```\n\n此脚本访问一个包含 iframe 的网页，并检查其内部的标题是否可见。在 iframe 内部，它寻找一个文本为 `iFrame` 的标题，并确认其可见。这有助于验证\
  \ iframe 已正确加载且其内容已准备好进行交互。\n\n处理 iframes 的另一种方法是先使用 `locator` 获取 iframe 元素，然后使用\
  \ `contentFrame()` 获取实际的 `Frame` 对象，之后与其内部的元素交互：\n\n```\nimport { test, expect }\
  \ from '@playwright/test';\ntest('Interact with iframe', async ({ page }) => {\n\
  \  await page.goto('https://testpages.eviltester.com/styled/iframes-test.html');\n\
  \  // 与 iframe 内部的元素交互\n  await expect(page.locator('#thedynamichtml')\n       \
  \            .contentFrame()\n                   .getByRole('heading', { name: 'iFrame'\
  \ })).toBeVisible();\n});\n```\n\n这种方法可以得到相同的结果，但多了一个步骤。\n\n\n\n\n\n某些网站可能会在其他 iframe\
  \ 中嵌入 iframe，从而创建一个帧的层级结构。每个帧都有自己的 DOM 和上下文。在这种情况下，请仔细链式调用帧选择器：\n\n1. **定位父级 iframe**：使用\
  \ `page.frameLocator` 选择顶层 iframe。\n2. **定位嵌套的 iframe**：在父帧上使用 `frameLocator` 选择嵌套的\
  \ iframe。\n3. **与元素交互**：使用 `locator` 查找并与嵌套 iframe 中的元素交互。\n\n让我们来看一个如何处理嵌套 iframe\
  \ 的示例：\n\n```\nimport { test, expect } from '@playwright/test';\ntest('should correctly\
  \ find text in all nested frames', async ({ page }) => {\n  await page.goto('https://the-internet.herokuapp.com/nested_frames');\n\
  \  // 定位顶帧（包含嵌套帧）\nconst topFrame = page.frameLocator('frame[name=\"frame-top\"\
  ]');\n  // 定位嵌套在 'topFrame' 内部的帧\nconst leftFrame = topFrame.frameLocator('frame[name=\"\
  frame-left\"]');\n  const middleFrame = topFrame.frameLocator('frame[name=\"frame-middle\"\
  ]');\n  const rightFrame = topFrame.frameLocator('frame[name=\"frame-right\"]');\n\
  \  // 定位底帧（与 'topFrame' 同一层级）\nconst bottomFrame = page.frameLocator('frame[name=\"\
  frame-bottom\"]');\n  // 断言每个帧的文本内容\nawait expect(leftFrame.locator('body')).toHaveText('LEFT');\n\
  \  await expect(middleFrame.locator('body')).toHaveText('MIDDLE');\n  await expect(rightFrame.locator('body')).toHaveText('RIGHT');\n\
  \  await expect(bottomFrame.locator('body')).toHaveText('BOTTOM');\n});\n```\n\n\
  此测试帮助我们验证具有多个嵌套帧的网页是否在每个部分都显示了正确的文本。首先，我们定位 frame-top 帧。在内部，我们找到了三个嵌套帧：frame-left、frame-middle\
  \ 和 frame-right。我们还定位了 frame-bottom，它位于顶帧下方且处于同一层级。然后我们使用 `expect` 函数确认每个帧都包含了正确的文本。\n\
  \n如果你的 iframe 源自不同的源，浏览器安全策略（如同源策略）可能会限制你的操作。Playwright 在处理许多跨源情况方面表现出色，但始终记住潜在的限制是有好的。\n\
  \n当你处理现代 Web 应用（特别是使用 Web Components 的应用）时，在尝试与 Shadow DOM 内部元素交互时可能会遇到一些挑战。坦率地说，Playwright\
  \ 提供了工具来帮助。这引出了我们的下一个重要主题。\n\n# 处理 Shadow DOM 组件\n\n在 Web 开发中，**Shadow DOM** 允许你封装\
  \ DOM 的部分（例如自定义组件），使其样式和元素不会意外干扰页面的其他部分。这使得使用传统的 DOM 选择器访问或与这些嵌套元素交互变得有些困难。让我们看看穿透边界并与这些封装元素交互的方法。\n\
  \n## 定位主机元素\n\n这通常是访问 Shadow DOM 内元素最直接的方法。你首先定位具有 Shadow DOM 的宿主元素。从这个根定位器开始，你可以使用标准的\
  \ Playwright 选择器查询其内部的元素。\n\n假设你有一个这样的自定义 Web 组件：\n\n```\n<my-widget>\n  #shadow-root\n\
  \    <div class=\"internal-button\">Click me!</div>\n<style>\n.internal-button {\
  \ color: blue; }\n    </style>\n</my-widget>\n```\n\n以下是如何在 Playwright 中与按钮交互的方法：\n\
  \n```\nimport { test, expect } from '@playwright/test';\ntest('interacting with\
  \ shadow dom component', async ({ page }) => {\n  await page.goto('webpage.html');\n\
  \  // 定位主机元素\nconst widget = page.locator('my-widget');\n  // 现在你可以定位 shadow root\
  \ 内部的元素\nconst internalButton = widget.locator('.internal-button');\n  // 对内部元素执行操作\n\
  await internalButton.click();\n  const buttonText = await internalButton.innerText();\n\
  \  console.log(buttonText);\n  // 你可以在这里添加断言来验证行为\n// 例如，如果点击按钮改变了页面上的内容：\n// await\
  \ expect(page.locator('#some-indicator')).toHaveText('Button Clicked!');\n});\n\
  ```\n\n在此示例中，`page.locator('my-widget')` 为我们提供了一个作用限于 `<my-widget>` 元素 shadow root\
  \ 的新定位器。然后我们可以在 `shadow_root` 上使用熟悉的定位器策略（如 `.locator(\".internal-button\")`）来查找按钮。\n\
  \n## 使用 >>> 组合符\n\nPlaywright 还提供了一种穿透选择器语法，可以轻松定位开放 shadow DOM 内部的元素。这里的关键运算符是\
  \ `>>>` 符号，它告诉 Playwright 遍历 shadow 边界。\n\n假设我们使用之前相同的 HTML 结构：\n\n```\nimport {\
  \ test } from '@playwright/test';\ntest('interacting with shadow dom using deprecated\
  \ combinators', async ({ page }) => {\n  await page.goto('webpage.html');\n  const\
  \ internalButton = page.locator('my-widget >>> .internal-button');\n  await internalButton.click();\n\
  \  const buttonText = await internalButton.innerText();\n  console.log(buttonText);\n\
  });\n```\n\n`>>>` 充当穿透任何 shadow root 的指令。如果你有多个层，可以链式使用选择器：\n\n```\n// 穿透多个 shadow\
  \ 边界：\nawait page.click('parent-component >>> child-component >>> button');\n```\n\
  \n注意，现代版本的 Playwright 会自动遍历 shadow root，因此你可以使用普通的 CSS、文本或基于角色的定位器，无需任何特殊语法（尽管 XPath\
  \ 选择器默认不穿透）。封闭的（Closed）DOM 从组件外部无法访问。这意味着 Playwright 定位器在这些情况下无法工作。这并不是 Playwright\
  \ 的限制，而是 Web 标准中封装的一部分。\n\n\n\n\n\n在现代 Web 开发中，确保您的应用程序在所有主流浏览器中行为一致已不再是可选项，而是必不可少的。在本章中，我们将为您介绍\
  \ Playwright 的跨浏览器测试能力，并向您展示如何在零代码重复的情况下，针对所有主流浏览器运行单一端到端测试套件。您将学习如何在 Playwright\
  \ 配置中定义多个 `projects`，每个项目都针对不同的浏览器或设备配置进行自定义，以及如何并行启动它们，以便在开发周期早期发现兼容性问题。\n\n接下来，我们将深入探讨调整浏览器上下文（browser\
  \ contexts）的所有方法：调整视口大小和用户代理、模拟各种设备，甚至设置权限。这让您能够镜像真实的用户场景，并在潜在问题到达用户之前将其捕。我们还将涵盖如何保存和重用存储状态（storage\
  \ state）以加速测试流程，以及在准确性至关重要时如何针对 Microsoft Edge 或 Google Chrome 等品牌通道。\n\n在本章结束时，您将拥有一个清晰的、分步骤的计划，用于创建随处可靠运行的可重用测试。\n\
  \n本章由以下章节组成：\n\n* 为多浏览器测试配置 Playwright\n* 处理特定浏览器的行为\n* 编写跨浏览器兼容性测试\n* 调试特定浏览器的测试失败\n\
  \n让我们从为测试配置 Playwright 开始吧。\n\n## 技术要求\n\n本章的源代码可在此处获取 [`github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright/tree/main/Chapter03`](https://github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright/tree/main/Chapter03)。\n\
  \n## 为多浏览器测试配置 Playwright\n\n如果您想在不同的浏览器（如 `Chromium`、`Firefox` 和 `WebKit`）上运行 Playwright\
  \ 测试，而无需多次编写相同的测试，Playwright 通过一个名为 `projects` 的功能轻松实现了这一点。通过在配置文件设置项目，您可以定义使用哪种浏览器以及任何自定义设置（例如视口大小、设备模拟或特定的测试选项）。然后\
  \ Playwright 将负责在所有配置的浏览器上并行运行您的测试。\n\n## 使用 Playwright 项目运行测试\n\n一个项目定义了以下内容：\n\
  \n* 使用哪种浏览器引擎 (`browserName`: `'chromium'`、`'firefox'` 或 `'webkit'`)\n* 特定于浏览器的选项和参数\n\
  * 设备模拟（例如视口大小、用户代理和触摸支持）\n* 其他特定于项目的配置选项（如 `baseURL`、`use` 选项如 `storageState` 等）\n\
  \n`Playwright Test` 将使用工作进程并行运行测试。这些工作进程将根据配置的项目选取测试文件进行执行。在 `playwright.config.ts`\
  \ 文件中，您将找到一个 `projects` 数组。这里就是您定义想要运行测试的不同浏览器配置的地方。\n\n以下是一个 `playwright.config.ts`\
  \ 文件的示例，展示了基础的多浏览器配置：\n\n```\nprojects: [\n    {\n      name: 'chromium',\n    \
  \  use: { ...devices['Desktop Chrome'] },\n    },\n    {\n      name: 'firefox',\n\
  \      use: { ...devices['Desktop Firefox'] },\n    },\n    {\n      name: 'webkit',\n\
  \      use: { ...devices['Desktop Safari'] },\n    },\n  ],\n```\n\n让我们仔细查看 `projects`\
  \ 数组：\n\n* `name`: 这是该项目的描述性名称，将用于测试报告，以识别测试在哪个浏览器上运行。\n* `use`: 该对象包含特定于此项目的配置选项。Playwright\
  \ 在 `devices` 对象中提供了预配置的设备模拟。通过使用扩展语法 (`...`)，您继承了每个浏览器桌面版本的所有默认设置（如视口大小、用户代理等）。\n\
  \n您可以通过在每个项目的 `use` 对象中添加更多选项，来进一步自定义如何启动每个浏览器。\n\n## 自定义浏览器启动选项\n\n在您的 `playwright.config.ts`\
  \ 文件的每个项目的 `use` 对象中，您可以添加 Playwright 在启动浏览器时会传递的各种选项。您可以指定不同的视口大小、用户代理，甚至可以向浏览器传递命令行参数。\n\
  \n以下是一些常见且实用的选项。\n\n### userAgent\n\n默认情况下，Playwright 使用其启动的浏览器的真实用户代理，但您可以通过覆盖用户代理字符串来模拟不同的设备或浏览器。这对于测试您的网站在不同平台上的表现非常有用。\n\
  \n这是一个示例：\n\n```\n{\n  name: 'webkit-ipad',\n  use: {\n    ...devices['Desktop Safari'],\n\
  \    userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:138.0) Gecko/20100101\
  \ Firefox/138.0',\n  },\n},\n```\n\n注意，仅凭伪造用户代理并改变浏览器引擎的行为。如果您在运行 Safari 时伪造 Firefox\
  \ 的用户代理，您仍然在使用 Safari 的渲染引擎。要模拟 iPhone 或 Galaxy 等设备，请使用 Playwright 中预定义的设备（如 `devices['iPhone\
  \ 16 Pro']`），我们将在本章稍后部分讨论。\n\n### deviceScaleFactor\n\n此选项设置设备缩放因子，这对于在高 DPI DPI\
  \ 屏幕上进行测试非常重要。默认它设置为 `1`。\n\n这是一个示例：\n\n```\n{\n  name: 'chromium-high-dpi',\n \
  \ use: {\n    ...devices['Desktop Chrome'],\n    viewport: { width: 1280, height:\
  \ 720 },\n    deviceScaleFactor: 2,\n  },\n},\n```\n\n### viewport\n\n此选项允许您设置浏览器窗口的初始视口大小。这对于响应式设计测试至关重要。\n\
  \n这是一个示例：\n\n```\n{\n  name: 'chromium-large',\n  use: {\n    ...devices['Desktop\
  \ Chrome'],\n    viewport: { width: 1920, height: 1080 },\n  },\n},\n{\n  name:\
  \ 'firefox-mobile',\n  use: {\n    ...devices['Desktop Firefox'],\n    viewport:\
  \ { width: 375, height: 667 },\n  },\n},\n```\n\n### isMobile\n\n此接收一个布尔值，指示是否模拟移动设备。这通常与设置\
  \ `viewport` 和 `userAgent` 配合使用。\n\n这是一个示例：\n\n```\n{\n  name: 'chromium-mobile-only',\n\
  \  use: {\n    ...devices['Desktop Chrome'],\n    viewport: { width: 390, height:\
  \ 844 },\n    isMobile: true,\n  },\n},\n```\n\n### JavaScriptEnabled\n\n您可以显式控制浏览器是否启用了\
  \ JavaScript。这对于测试应用程序在禁用 JavaScript 时的表现有用。\n\n这是一个示例：\n\n```\n{\n  name: 'chromium-no-js',\n\
  \  use: {\n    ...devices['Desktop Chrome'],\n    javascriptEnabled: false,\n  },\n\
  },\n```\n\n### ignoreHTTPSErrors\n\n默认情况下，如果遇到 HTTPS 错误（例如由自签名证书或其他 SSL/TLS 问题引起），测试将失败。为了绕过这些错误，您可以在浏览器上下文配置中将\
  \ `ignoreHTTPSErrors` 选项设置为 `true` 来让 Playwright 忽略 HTTPS 错误。\n\n这是一个示例：\n\n```\n\
  {\n  name: 'chromium-ignore-https',\n  use: {\n    ...devices['Desktop Chrome'],\n\
  \    ignoreHTTPSErrors: true,\n  },\n},\n```\n\n### proxy\n\n为您的浏览器设置代理服务器允许其网络流量通过中间服务器进行路由。如果您的应用程序旨在通过代理访问，这将非常有用。\n\
  \n\n\n\n\n代理还可以帮助你模拟不同的网络场景。例如，你可以模拟来自不同地理位置的用户，或者测试你的应用在某些网络限制下的性能。\n\n在 Playwright\
  \ 中设置代理，你将使用一个包含以下选项的配置对象：\n\n* `server` (string)：这是关键设置。它告诉 Playwright 使用哪个代理服务器，并应包含完整地址：协议（`http://`、`https://`\
  \ 或 `socks5://`）、主机名或 IP 以及端口号。\n* `username` (string，可选)：如果代理需要登录，你可以在此处提供 `username`。\n\
  * `password` (string，可选)：如果你的代理需要进行身份验证，请在此处添加 `password`。\n* `bypass` (string 或字符串数组，可选)：你可以列出应该跳过代理的域名或主机。这对于直接访问本地资源或特定网站非常有用。\n\
  \n这里是一个示例：\n\n```javascript{\n  name: 'chromium-with-proxy',\n  use: {\n    ...devices['Desktop\
  \ Chrome'],\n    proxy: {\n      server: 'http://username:password@yourproxy.com:8080',\n\
  \    },\n  },\n},\n```\n\n使用此配置，任何使用 `chromium-with-proxy` 项目运行的测试将启动一个配置好的 Chromium\
  \ 浏览器，将其流量路由到指定的代理服务器。\n\n在实际设置中，避免在配置文件中硬编码凭据。相反，请使用环境变量或密钥管理器安全地存储它们。参见第 14 章，*安全与身份验证*。\n\
  \n## 权限\n\nPlaywright 允许你在测试开始之前管理浏览器权限（例如地理位置、摄像头或麦克风的访问）。当你测试依赖这些权限的功能时，非常有帮助，这样你就不需要在测试运行期间手动点击权限提示。\n\
  \n你可以为所有测试设置全局权限、为单个项目设置、甚至为特定的测试用例设置权限。只需在 Playwright 配置文件或 `test.use()` 块中使用 `use`\
  \ 选项。在 `use` 内部，`permissions` 字段接收字符串数组，每个字符串代表你想要允许的浏览器权限。\n\n这里是一个示例：\n\n```javascript{\n\
  \  name: 'chromium-with-location',\n  use: {\n    ...devices['Desktop Chrome'],\n\
  \    permissions: ['geolocation'], // 授予地理位置权限\n  },\n}\n```\n\n在此设置中，`chromium-with-location`\
  \ 项目使用 `Desktop Chrome` 设备配置并显式授予了 `geolocation` 访问权限。\n\n如果你想阻止所有权限，可以传递一个空数组：\n\
  \n```javascript{\n  name: 'chromium-no-camera',\n  use: {\n    ...devices['Desktop\
  \ Chrome'],\n    permissions: [], // 阻止所有权限\n  },\n}\n```\n\n使用此设置，浏览器将不会询问任何权限，依赖这些权限的功能将被阻止。\n\
  \nPlaywright 支持多种权限，尽管具体的列表可能会根据浏览器和版本略有不同。一些常用的支持权限包括：\n\n* `geolocation`\n* `camera`\n\
  * `microphone`\n* `notifications`\n* `clipboard-read`\n* `clipboard-write`\n* `midi`\n\
  * `accelerometer`\n* `gyroscope`\n* `magnetometer`\n* `ambient-light-sensor`\n*\
  \ `background-sync`\n* `payment-handler`\n* `storage-access`\n\n通过提前设置权限，你的测试将更容易维护。\n\
  \n## 存储状态 (Storage State)\n\nPlaywright 允许你在测试期间任何时候保存当前的浏览器存储（如 cookies、localStorage\
  \ 和 IndexedDB），并将其存储在文件中（通常是 JSON 文件）。稍后你可以在另一个测试开始时加载该保存的状态。\n\n使用 `storageState`\
  \ 的最大优势之一是它可以通过跳过重复登录步骤来加速测试。许多 Web 应用要求用户登录后才能进行操作，如果没有 `storageState`，你必须在每个测试中通过登录过程：访问登录页面、输入凭据并提交表单。这会迅速累积。\n\
  \n相反，你可以登录一次，保存 cookies，然后在未来的测试中重用该登录快照。这样，你的测试就可以通过身份验证后的会话直接进入操作。\n\n首先，编写一个\
  \ `login` 脚本进行登录并写入 `storageState`：\n\n```javascript\n// 打开页面并执行登录。\n// 然后将存储状态保存到文件：\n\
  await context.storageState({ path: 'logged_in_state.json' });\n```\n\n现在，你可以在 `playwright.config.ts`\
  \ 项目配置中引用该文件：\n\n```javascript{\n  name: 'chromium-logged-in',\n  use: {\n    ...devices['Desktop\
  \ Chrome'],\n    storageState: 'logged_in_state.json', // 保存文件的路径\n  },\n},\n```\n\
  \n如果你想查看此设置如何在多个项目之间进行扩展，请查看第 14 章，*安全与身份验证*。它展示了你如何创建一个设置项目（setup project）来跨测试生成并共享\
  \ `storageState` 数据。\n\n## 针对品牌浏览器的特定通道 (channels)\n\nPlaywright 通常附带其自身的 Chromium、Firefox\
  \ 和 WebKit 开源版本。但如果你想针对 Microsoft Edge 或 Google Chrome 等官方品牌版本进行测试，可以使用 `channel`\
  \ 选项。\n\n`channel` 设置告诉 Playwright 确切使用哪个发布版本，可以是 `stable`、`beta`、`dev` 或 `canary`。只需在项目配置中使用\
  \ `channel` 选项。这里是一个示例：\n\n```javascript{\n  name: 'edge-stable',\n  use: {\n  \
  \  ...devices['Desktop Edge'],\n    channel: 'msedge', // Stable 通道\n  },\n},\n\
  {\n  name: 'chrome-beta',\n  use: {\n    ...devices['Desktop Chrome'],\n    channel:\
  \ 'chrome-beta', // Beta 通道\n  },\n}\n```\n\n当你选择通道时，Playwright 将尝试使用系统中已安装的浏览器。如果找不到请求的浏览器，它会通过错误消息提示。你可以在\
  \ Playwright 文档中找到完整的列表：[`playwright.dev/api/class-browser`](https://playwright.dev/api/class-browser)。\n\
  \n## 在特定浏览器上运行测试\n\nPlaywright 提供了一种非常方便的方法针对特定的浏览器配置。主要方法是在执行 Playwright 测试时使用\
  \ `--project` 命令行标记，允许你指定在 `playwright.config` 文件的 `projects` 数组定义的定义或多个项目名称。\n\n\
  假设你的 `playwright.config.ts` 文件中有如下 `projects` 配置：\n\n```javascript\nprojects: [\n\
  \  {\n    name: 'chromium',\n    use: { ...devices['Desktop Chrome'] },\n  },\n\
  \  {\n    name: 'firefox',\n    use: { ...devices['Desktop Firefox'] },\n  },\n\
  \  {\n    name: 'webkit',\n    use: { ...devices['Desktop Safari'] },\n  },\n  {\n\
  \    name: 'mobile-chrome',\n    use: { ...devices['Pixel 5'] },\n  },\n],\n```\n\
  \n要仅使用 Chromium 浏览器配置执行测试，你可以在项目根目录下打开终端并运行：\n\n```bash\nnpx playwright test --project\
  \ chromium\n```\n\n然后 Playwright 将启动 Chromium 并使用该浏览器运行所有测试（在指定的测试文件内）。\n\n你可以通过多次使用\
  \ `--project` 标记来针对多个浏览器，每个标记跟随包含的项目名称：\n\n```bash\nnpx playwright test --project\
  \ chromium --project firefox\n```\n\n在这种情况下，Playwright 将运行两次测试：一次在 Chromium 中，一次在\
  \ Firefox 中。如果你定义了自定义项目配置（如前面的 `mobile-chrome` 示例），你可以以同样的方式针对它们：\n\n```bash\nnpx\
  \ playwright test --project mobile-chrome\n```\n\n\n\n\n\n注意项目名称是区分大小写的：请确保使用的项目名称的大小写与你在\
  \ `playwright.config` 文件中定义的完全一致；`'chromium'` 与 `'Chromium'` 是不同的。\n\n如果你在不带任何 `--project`\
  \ 标志的情况下运行 `npx playwright test`，Playwright 默认将对你配置文件中定义的所有项目运行测试。\n\n你可以将 `--project`\
  \ 标志与其他 Playwright CLI 选项结合，例如使用 `--grep` 来按名称过滤测试，以便在特定的浏览器上运行特定的测试集。\n\n以下是一个示例：\n\
  \n```\nnpx playwright test --project chromium --grep \"user login\"\n```\n\n这将仅运行标题中包含\
  \ `\"user login\"` 的测试，但仅在 `Chromium` 浏览器中运行。\n\n在编写端到端测试时，每个引擎实现标准的细微差异可能会导致意外之外的失败或不稳定行为（flaky\
  \ behavior）。让我们看看 Playwright 如何轻松地检测你正在运行哪种浏览器，以便你可以在需要时对测试逻辑进行分支处理。\n\n# 处理特定器的行为\n\
  \nPlaywright 提供了一种简单的方法来确定测试当前运行在何种浏览器引擎上。这对于实现条件逻辑非常重要。\n\n你可以通过 `browser` 句柄或\
  \ `page` 对象访问浏览器名称。使用 `page.context().browser().browserType().name()` 链式方法将返回一个指示浏览器类型的字符串，例如\
  \ `'chromium'`、`'firefox'` 或 `'webkit'`：\n\n```\nimport { test, expect } from '@playwright/test';\n\
  test('should log browser name', async ({ page }) => {\n  const browserName = page.context().browser().browserType().name();\n\
  \  console.log(`Currently running on: ${browserName}`);\n  if (browserName === 'firefox')\
  \ {\n    console.log('This is a Firefox-specific step.');\n    // 添加 Firefox 特有的操作或断言\n\
  \  } else if (browserName === 'chromium') {\n    console.log('This is a Chromium-specific\
  \ step.');\n    // 添加 Chromium 特有的操作或断言\n  }\n});\n```\n\n一旦识别出使用的是哪个浏览器，你就可以 `if`、`else\
  \ if`、`else` 或 `switch` 等条件语句根据情况运行不同的代码。\n\n另一个选项是直接从 `@playwright/test` 使用 `browserName`\
  \ 句柄。测试运行器方便地将 `browserName` 作为内置句柄提供，因此你可以在测试中轻松地访问它。这允许你根据浏览器和设备类型自定义测试。例如，在移动设备上，`Sign\
  \ in` 链接可能隐藏在汉堡菜单之后，因此你的测试需要额外点击才能打开它：\n\n```\nimport { test, expect } from '@playwright/test';\n\
  test('demonstrating device-specific logic', async ({ page, browserName, isMobile\
  \ }) => {\n  await page.goto('https://github.com/');\n  console.log(`Currently running\
  \ on: ${browserName}, Is mobile: ${isMobile}`);\n  if (isMobile) {\n    // 移动端特有行为：点击汉堡菜单显示\
  \ SignIn 链接\nawait page.getByRole('button', { name: 'Toggle navigation' }).click();\n\
  \    await expect(page.getByRole('link', { name: 'Sign in' })).toBeVisible();\n\
  \  } else if (browserName === 'firefox') {\n    // Firefox 可能会以不同的方式渲染特定元素\nawait\
  \ expect(page.getByRole('link', { name: 'Sign in' })).toBeVisible();\n  } else {\n\
  \    // 其他浏览器的默认行为\nawait expect(page.getByRole('link', { name: 'Sign in' })).toBeVisible();\n\
  \  }\n});\n```\n\n这个 Playwright 测试展示了你如何使用 `browserName` 和 `isMobile` 句柄，在测试 GitHub\
  \ 网页时添加适应不同浏览器和设备的逻辑。\n\n如果是移动端，测试会点击汉堡菜单（`getByRole('button', { name: 'Toggle navigation'\
  \ })`）打开导航，并检查 `Sign in` 链接是否可见（`getByRole('link', { name: 'Sign in' })`）。在桌面端上，它使用\
  \ `browserName` 来考虑 WebKit (Safari)、Firefox 或 Chromium 等浏览器之间的差异，并验证 `Sign in` 链接在无需任何额外步骤的情况下已经是可见的。\n\
  \n这种设置在功能表现不同时应用不同的断言、跳过在某些浏览器中不适用或引起问题的特定测试步骤，或者在渲染时间或行为不同时调整等待元素的方式时，会非常有用。\n\n\
  为不同的浏览器自定义测试是一个极很好的开始，但如何确保你的网站在不同设备上看起来良好且运行良好呢？这就是设备仿真（device emulation）大显身场的地方。它让你轻松看到网站在各种设备上的表现，而无需准备一抽屉设备。\n\
  \n## 使用设备仿真\n\nPlaywright 中的 `Device emulation` 让你能够模拟网站在智能手机、平板电脑甚至各种桌面设置上的行为。\n\
  \n设备仿真不仅仅是调整浏览器窗口的大小。它还可以模拟一系列完整的属性。仿真在检查触摸交互如何工作（如滑动、点击甚至虚拟键盘）时也非常好用。\n\n## 在 Playwright\
  \ 中使用预定义设备\n\nPlaywright 自带了一个预定义的常用设备描述符列表，使得仿真变得非常方便。预定义设备的列表维护在 GitHub 上的源代码中：[`github.com/microsoft/playwright/blob/main/packages/playwright-core/src/server/deviceDescriptorsSource.json`](https://github.com/microsoft/playwright/blob/main/packages/playwright-core/src/server/deviceDescriptorsSource.json)\n\
  \n你也可以在代码内部查看 Playwright 提供的预定义设备，而无需查阅外部文档：\n\n```\nimport { devices } from '@playwright/test';\n\
  console.log(devices);\n```\n\n这将记录所有你可以使用的设备描述符。\n\n## 手动配置仿真参数\n\nPlaywright 自带了一组非常有用的现成设备配置供你选择，但有时你可能想进一步微调设置，或者仿真一个不在列表中的设备。这时，你就应该在启动新的浏览器上下文时设置你的仿真参数。\n\
  \n浏览器上下文（browser context）是一个隔离的会话，等同于无模式配置：它保留自己的 Cookie、本地存储和会话数据。通过带有自定义选项创建一个新的上下文，你是在精确地告诉\
  \ Playwright 你希望为其中的每个页面提供什么样的“环境”。\n\n当你使用 `browser.newContext()` 创建新的浏览器上下文时，可以传递一个\
  \ `options` 对象来定制其行为。此此 `options` 对象允许你设置影响浏览器行为的各种属性。\n\n你可以配置的一些关键参数包括：\n\n- `hasTouch`：此布尔值表示仿真的设备是否支持触摸事件。\n\
  - `geolocation`：你可以提供一个包含纬度、经度和可选精度的对象来模拟特定的地理位置。这对于测试位置感知型功能非常用，例如 `{\"latitude\"\
  : 40.7128, \"longitude\": -74.0060}`。\n- `locale`：此字符串允许你模拟用户的区域，它会影响语言和区域设置，例如\
  \ `\"en-US\"`。\n- `timezoneId`：你可以设置浏览器上下文的时区，这对于测试处理日期和时间的应用程序至关重要，例如 `\"America/New_York\"\
  `。\n- `permissions`：此字符串数组允许为浏览器上下文授予特定的权限，例如 `'geolocation'`、`'notifications'`\
  \ 或 `'camera'`。\n- `colorScheme`：你可以模拟用户偏好的颜色方案，例如 `'light'` 或 `'dark'`。\n- `viewport`：此对象允许你以像素设置视口的尺寸。你可以指定宽度和高度，例如\
  \ `{\"width\": 1280, \"height\": 720}`。\n\n\n\n\n\n*   `userAgent`: 你可以设置自定义的代理代理字符串来模拟特定的浏览器或设备。该字符串会发送在\
  \ HTTP 请求头中，网站可以使用它提供不同的内容或布局，例如 `\"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36\
  \ (KHTML, like Gecko) Chrome/135.0.0.0 Safari/537.36 Edg/135.0.0.0\"`。\n\n*   `deviceScaleFactor`:\
  \ 此数字指定了设备缩放因子，即物理像素与逻辑像素之间的比例。它对于模拟高 DPI 显示器非常有用。\n\n*   `isMobile`: 将此布尔值设置为 `true`\
  \ 可可启用移动端模拟，这会影响触摸事件以及移动端用户代理的存在（如果没有显式设置）等内容。\n\n通过组合这些参数，你可以创建一个自定义的模拟环境，精确匹配\
  \ Playwright 默认设备列表中未提供的特定设备或浏览器场景特征。\n\n这是一个基础示例：\n\n```\nimport { test } from\
  \ '@playwright/test';\ntest('Emulate Android device and open github.com', async\
  \ ({ browser }) => {\n  const context = await browser.newContext({\n    viewport:\
  \ { width: 360, height: 640 },\n    userAgent: 'Mozilla/5.0 (Linux; Android 10;\
  \ SM-G975F) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.106 Mobile Safari/537.36',\n\
  \    deviceScaleFactor: 2,\n    isMobile: true,\n    hasTouch: true,\n    geolocation:\
  \ { latitude: 48.856613, longitude: 2.352222 },\n    locale: 'fr-FR',\n    timezoneId:\
  \ 'Europe/Paris',\n    permissions: ['geolocation'],\n  });\n  const page = await\
  \ context.newPage();\n  await page.goto('https://github.com');\n  // Add assertions\
  \ or interactions here\nawait context.close();\n});\n```\n\n当内置的设备预设无法满足你的测试需求时，这种手动配置提供了精确度。\n\
  \n虽然你可以直接在测试中定义这些参数，但最佳实践是将它们移动到 `playwright.config.ts` 文件中的 `use` 对象中。这可以保持测试代码的整洁，并便于在一个处管理特定环境的设置。\n\
  \n## 覆盖设备描述符的特定属性\n\n虽然预定义的设备描述符非常有用，但你有时需要针对特定的测试场景修改一个或两个属性，而无需从头创建一个全新的描述符。为了做到，你将使用所谓的**展开预定义的描述符\
  \ (spreading a predefined descriptor)**。这基本上意味着你从像 Pixel 8 或 iPhone 16 等设备的全部设置开始，并在基础上进行构建。\n\
  \n你使用展开语法 `(...devices['Device Name'])` 来实现这一点，它会将设备的所有属性复制到新对象中。一旦你展开了基础设置，就可以通过直接在同一个对象中添加或更改属性来定制任何需要的内容。如果同一个属性列出了多次，则以最后一个为准，这意味着你的自定义值将覆盖默认值。这是一个简单的示例：\n\
  \n```\n{\n  name: 'Custom iPhone 16',\n  use: {\n    ...devices['iPhone 16'],\n\
  \    viewport: { width: 390, height: 844 },\n    locale: 'fr-FR',\n  },\n}\n```\n\
  \n虽然预定义的设备描述符非常有用，但你有时需要针对特定的测试场景修改一个或两个属性，而无需从头创建一个全新的描述符。为了做到，你将使用所谓的**展开预定义的描述符\
  \ (spreading a predefined descriptor)**。这基本上意味着你从像 Pixel 8 或 iPhone 16 等设备的全部设置开始，并在基础上进行构建。\n\
  \n你使用展开语法 `(...devices['Device Name'])` 来实现这一点，它会将设备的所有属性复制到新对象中。一旦你展开了基础设置，就可以通过直接在同一个对象中添加或更改属性来定制任何需要的内容。如果同一个属性列出了多次，则以最后一个为准，这意味着你的自定义值将覆盖默认值。这是一个简单的示例：\n\
  \n```\n{\n  name: 'Custom iPhone 16',\n  use: {\n    ...devices['iPhone 16'],\n\
  \    viewport: { width: 390, height: 844 },\n    locale: 'fr-FR',\n  },\n}\n```\n\
  \n## 为跨浏览器兼容性编写测试\n\n编写测试时，目标应是用户实际看到和操作的内容，而不是内部细节。例如，检查按钮是否可见比检查其精确颜色更健壮。Playwright\
  \ 的 `expect` API 是实现此点的绝佳工具。它带有内置的自动重试机制，有助于处理浏览器之间的细微差异。\n\n此外，请记住视觉渲染在不同浏览器之间可能会略有不同。期望跨引擎实现像素级的精确通常是不符合现实的。如果你需要视觉检查，集成视觉工具是值得的。但对于大多数功能测试，最好是关注元素是否存在、是否处于正确的状态以及是否包含正确的内容。\n\
  \n某些功能（如 `backdrop-filter`、`:has()` CSS 选择器或 Web Animations API 中的某些动画）可能在所有地方都无法被完全支持。当你使用较新或不常用的功能时，先检查\
  \ `aniuse.com` 的浏览器兼容性是一个好主意。\n\n如果某个浏览器的行为略有不同，你可以在测试代码中使用条件逻辑来处理这些情况。例如，如果 WebKit\
  \ 特有的计时问题影响了动画，你可以编写条件检查，仅在 WebKit 中运行时调整行为。请务必记录存在该条件的原因，并避免过度使用这种方法。它应该是例外，而不是规则。\n\
  \n理想情况下，一个测试应该在所有浏览器上无故障运行。但有时，浏览器特定的 bug 或刻意的行为差异使得这变得不可能。在这种情况下，Playwright 允许你根据使用的浏览器跳过特定的测试（或测试的一部分）。当某个浏览器的已知问题导致测试不必要的失败时，这非常有用。\n\
  \n这是一个示例：\n\n```\ntest('feature X works', async ({ page, browserName }) => {\n \
  \ if (browserName === 'webkit' && someKnownWebKitIssue) {\n    test.skip(true, 'Skipping\
  \ due to known WebKit issue XYZ');\n  }\n  // ... 其余测试逻辑 ...\n});\n```\n\n\n\n\n\
  \n如果跳过某些步骤仍然不够，且某个工作流在特定浏览器中确实不同，你可以为它编写一个单独的测试。不过，这应该是最后的手段。维护单独的测试会增加开销，并可能违反`Don’t\
  \ Repeat Yourself` (`DRY`)原则，因此最好仅在绝对必要时使用，并始终附带清晰的文档来解释为什么测试会发生差异。\n\n记住，不要等到开发结束才运行跨浏览器测试。如果尽早将测试集成到你的工作流中，发现并修复问题将变得容易得多。经常在所有浏览器上运行你的测试，即使是在开发新功能或编写新测试时也是。这有助于你在兼容性问题变成更大的问题之前发现它们。\n\
  \n通过从一开始就跨浏览器测试，你自然会编写出更具移植性和健壮性的测试。此外，你还可以避免在后期 QA 阶段遇到令人沮丧的意外。\n\n# 调试特定浏览器测试失败\n\
  \n即使建立了良好的跨浏览器测试策略，你偶尔仍会遇到测试在一个浏览器中通过但在另一个浏览器中失败的情况。这些特定的浏览器失败会让人非常沮丧。\n\n你应该做的第一件事是确认失败确实仅限于特定的浏览器。首先在出现问题的浏览器中单独运行测试。如果你的测试套件通常在所有浏览器上运行，缩小范围将帮助你隔离问题并加速调试过程。\n\
  \n例如，正如我们在在本章早期讨论的，你可以使用以下命令在 Firefox 中运行特定测试：\n\n```bash\nnpx playwright test --project=\"\
  Firefox\"\n```\n\n一旦隔离了浏览器，就在 `headed` 模式下运行测试。这意味着浏览器窗口在测试期间是可见的，允许你实时查看发生的情况。通常，你只需通过观察测试运行就能发现视觉上的不一致或时序问题。\n\
  \n以下是在 WebKit 中这样操作：\n\n```bash\nnpx playwright test --project=\"WebKit\" --headed\n\
  ```\n\n如果视觉检查没有立即发现问题，请尝试放慢速度。Playwright 提供了 `slowMo` ，它可以减慢浏览器的操作，以便你更好地观察发生的情况。你可以这样在\
  \ `playwright.config.ts` 文件中启用它：\n\n```typescript\nprojects: [\n  {\n    name: 'chromium',\n\
  \    use: {\n      ...devices['Desktop Chrome'],\n      launchOptions: {\n     \
  \   slowMo: 1000, // 动作之间暂停 1000 毫秒 \n      }\n    }\n  }\n]\n```\n\n另一个实用的工具是 `page.pause()`。你可以将其直接插入到开始出错的测试代码中。当\
  \ Playwright 遇到此命令时，它会暂停测试并打开 Playwright Inspector。从那里，你可以逐步执行命令并仔细检查页面状态。\n\n这里是一个示例：\n\
  \n```typescript\nimport { test, expect } from '@playwright/test';\ntest('Change\
  \ article language to Deutschtest , async ({ page }) => {\n  await page.goto('https://en.wikipedia.org/wiki/Playwright_(software)');\n\
  \  await page.getByRole('button', { name: 'Go to an article in another' }).click();\n\
  \  await page.getByRole('link', { name: 'Deutsch' }).click();\n  await page.waitForURL('https://de.wikipedia.org/wiki/Playwright_(Software)',\
  \ { timeout: 5000 });\n  // 暂停执行以便手动检查\n  await page.pause();\n  console.log('Successfully\
  \ navigated to German Wikipedia.');\n});\n```\n\n此测试脚本在记录成功消息之前会暂停进行手动检查。\n\n`page.pause()`\
  \ 对于调试非常有用，但请记住在提交代码或在你的自动化流水线中运行测试之前将其移除。\n\n在引入任何特定浏览器的变通方案之前，花些时间理解为什么行为会有差异。是你的应用程序在特定浏览器中查看时的\
  \ Bug 吗？是已知的不兼容？还是该浏览器功能设计的有意差异？理解根源将帮助你选择正确的解决方案。\n\n开发者工具可以帮助你检查计算样式，以检查显示、可见性、透明度、转换或元素尺寸的差异。注意失败浏览器中的控制日志以捕捉细微的\
  \ JavaScript 错误。如果你依赖现代功能，考虑在应用程序和测试中都实现特性检测。这样，你就可以更顺利地处理任何差异。\n\n特定浏览器的 Bug 调试可能复杂且耗时，但通过\
  \ Playwright 的工具和一步步就进的方法，你可以创建在所有主流浏览器上顺利运行的测试。花点时间，保持条理，你以后将避免很多沮丧。\n\n我们将在*第\
  \ 8 章* *无头测试与调试* 中深入探讨调试技术。\n\n# 总结\n\n在为应用程序编写测试时，目标是在你支持的所有浏览器上实现一致的行为。跨浏览器兼容性应该是你的首要任务。虽然由于浏览器行为或支持特性的真实差异，有时需要包含特定浏览器的代码，但这些情况应该是例外，而非常态。保持此类逻辑隔离，以避免弄乱你的测试。\n\
  \n到目前，你已经看到在 Chromium、Firefox 和 WebKit 上运行相同的测试套件是多么简单，而无需为每个引擎重新发明轮子。Playwright\
  \ 提供了工具，让你在问题到达用户之前就发现并修复它们。\n\n\n\n\n\n`Playwright Codegen` 是 Playwright 框架中一个实用的功能，可以在你与网站交互时自动生成测试脚本。虽然它本身不是一个\
  \ AI 工具，但它可以很好地集成到 AI 驱动的测试工作流中，特别是与 AI 辅助工具或副驾驶（copilots）配合使用。它是加速测试自动化以及学习 Playwright\
  \ 工作原理 Perfect 工具，无需从零开始。\n\n## 录制测试\n\n当你使用 `Codegen` 时，它会记录你的操作（例如点击按钮、填写表单或在页面间导航），并实时转换为\
  \ Playwright 代码。\n\n要启动 `Codegen`，只需在终端中运行以下命令：\n\n```\nnpx playwright codegen https://www.google.com/\n\
  ```\n\n你将看到两个窗口弹出：\n\n* **Browser (浏览器)**：你在此处对网站执行操作。\n* **Playwright Inspector\
  \ (Playwright 检查)**：它根据你的交互实时显示生成的代码。\n\n你可以在终端命令中省略 URL，在浏览器打开后手动导航到目标网站。\n\n当你浏览网站时，`Codegen`\
  \ 会记录每次交互并将其转换为可读的 Playwright 代码。它甚至会选择智能且可靠的选择器（如角色、文本或测试 ID），并在需要时进行精炼，以确保每个元素都能被唯一锁定。\n\
  \n录制完成后，从 `Inspector` 复制生成的代码并粘贴到你的测试文件中。从那里，你可以对其进行自定义：重构、添加逻辑或包含测试数据。我们将在本章稍后的部分详细讨论如何操作。\n\
  \n## 添加断言\n\n如果你想检查某些内容是否可见或包含正确的文本，可以使用 `Inspector` 中的断言工具：\n\n1. 点击工具栏上的断言图标。\n\
  2. 选择你想要检查的元素。\n3. 选择断言类型（例如可见性、文本或值）。\n\n![](img/B34148_04_01.png)\n\n图 4.1：在工具栏中选择断言类型\n\
  \n`Codegen` 将将该断言直接添加到你的脚本中。\n\n请务必在测试中添加断言，以便验证页面上的所有内容运行情况都符合预期。如果没有断言，你的测试可能只是在应用程序中随处点击，而没有真正检查功能是否正常正常。断言有助于确认你的应用行为符合预期，并让你及早发现任何意外变化。\n\
  \n## 选择你的语言\n\n如果你倾向于使用特定的编程语言，`Codegen` 支持以下语言：\n\n* TypeScript\n* JavaScript\n\
  * Python\n* C#\n* Java\n\n只需从 `Inspector` 中选择你喜欢的语言即可。\n\n你也可以在终端中使用 `--lang` 标志来指定输出语言，例如所示：\n\
  \n```\nnpx playwright codegen --lang=python\n```\n\n## 使用 Pick Locator 工具\n\n即使你没有进行录制，仍然可以使用\
  \ `Codegen` 中的 `Pick Locator` 工具。将鼠标悬停在浏览器中的元素上，可以立即查看生成的选择器。这是一种无需编写代码即可为你的测试寻找稳健定位器的绝佳方法。\n\
  \n![图 4.2：悬停在元素上查看生成的选择器](img/B34148_04_02.png)\n\n图 4.2：悬停在元素上查看生成的选择器\n\n## Codegen\
  \ 的局限性\n\n虽然 `Codegen` 是一个非常好的起点，但它确实有一些需要注意的局限性。它生成的脚本通常相当基础。它们对于捕获直接的用户流非常好，但对于更复杂的场景（例如处理动态内容），你可能需要手动精炼代码。\n\
  \n另一个局限性是 `Codegen` 无法独立处理逻辑。它生成的代码中不会包含条件语句、循环或错误处理。如果你的测试需要决策支持或需要适应不同的条件，你需要手动添加这些逻辑。\n\
  \n最后，虽然 `Codegen` 在选择可靠选择器方面做得很好，但它并非万无一失。你可能会发现某些定位器需要调整，以确保你的测试保持稳定，且不会因 UI 的细微变化而崩溃。\n\
  \n为了方便处理此类问题，使用在测试期间能为你提供更多洞察和控制的工具非常有帮助。这就是 Playwright MCP 的用用场。\n\n# 为测试自动化配置\
  \ Playwright MCP\n\n`Playwright Model Context Protocol` (`MCP`) 是构建在 Playwright\
  \ 自动化框架之上的工具。它的特殊之处在于让 AI 模型（如 ChatGPT 或 Claude）能够通过 Web 页面的结构化快照实际上*看到*并与网站*交互*。简单来说，Playwright\
  \ MCP 为 AI 模型赋予了*眼睛*来查看网页内容，并提供了*手*来通过点击、打字、上传文件等方式进行交互。\n\n最简单的方法是使用 VS Code CLI\
  \ 安装 Playwright MCP 服务器。在 VS Code 中，进入顶部菜单并选择 **Terminal (终端)** | **New Terminal\
  \ (新建终端)**，或者在 Windows/Linux 上按下 `Ctrl` + `` ` `` (反引号)，在 macOS 上按下 `Cmd` + `` `\
  \ ``。\n\n然后，运行此命令：\n\n```\ncode --add-mcp '{\"name\":\"playwright\",\"command\"\
  :\"npx\",\"args\": [\"@playwright/mcp@latest\"]}'\n```\n\n如果你遇到类似 `code: command\
  \ not found` 的错误，说明 `code` CLI 不你的系统路径可用。要修复此，在 VS Code 中按 `Ctrl` + `Shift` + `P`\
  \ (Windows/Linux) 或 `Cmd` + `Shift` + `P` (macOS) 打开命令面板，并运行 `Shell Command: Install\
  \ 'code' command in PATH`。重启终端并重试。\n\n\n\n\n\n登录后，你可以让 Copilot 监控该仓库。就这么。在与网站交互时观察代码的生成，是学习\
  \ Playwright API 及其如何与页面元素交互的极佳方式。\n\n这是让 AI 代理能够安全、智能地与真实网站交互的一大步。Copilot 通过 `MCP`\
  \ 服务器与网页交互，分析其可访问性树（accessibility tree），并根据提示词生成定制的 Playwright 测试脚本。\n\n假设你想测试博客页面是否加载正常、搜索栏是否可用，以及点击标签是否能正确地过滤文章。\n\
  \n你只需要告诉 Copilot 以下内容：\n\n`Using Playwright, generate a test to verify the blog\
  \ at mashable.com loads, the search input works, and clicking a tag filters posts\
  \ correctly.`\n\n![图 4.5: 使用 Copilot 与网页交互](img/B34148_04_05.png)\n图 4.5：使用 Copilot\
  \ 与网页交互\n\nCopilot 会返回一个完整的 Playwright 测试脚本，并询问你是否想要运行它：\n\n![图 4.6: 你可以使用 Copilot\
  \ 运行你的脚本](img/B34148_04_06.png)\n图 4.6：你可以使用 Copilot 运行你的脚本\n\n你也可以直接使用 Playwright\
  \ CLI 运行脚本：\n\n```\nnpx playwright test\n```\n\n不要忘记检查输出。Copilot 表现很出色，但可能会漏掉一些边缘情况。正如我们很快看到的，你可以通过为特定内容添加断言，或处理如搜索结果为空等场景来完善它。如果测试失败，你甚至可以让\
  \ Copilot 分析失败原因并建议修复方案。\n\n所以，当你将 Copilot、`MCP` 和 Playwright 结合在一起时，你就获得了一种借助 AI\
  \ 快速创建测试的增强方式。你无需访问源代码即可自动化任务，而且可以使用自然语言提示代替代替编写脚本。\n\n你还可以向仓库添加一个 `.github/copilot-instructions.md`\
  \ 文件，为 GitHub Copilot 提供有关你项目的额外上下文。该文件可以包含详细信息，例如你的应用是如何构建、测试和部署的，或者你的团队遵循的特定编码规范。Copilot\
  \ 在在该仓库内建议代码时会自动引用这些指令，有助于它生成更符合你项目设置的响应。\n\n为了获得更高的精度，可以考虑查看 `github/awesome-copilot`\
  \ ([`github.com/github/awesome-copilot`](https://github.com/github/awesome-copilot))\
  \ 仓库，对于大型代码库或组件间代码风格异的多语言项目，这是一个极好的资源。这些预写的指令文件可以让你快速上手特定框架的指导。\n\n对于你的 Playwright\
  \ 测试，你可以利用以下指令：\n\n[`github.com/github/awesome-copilot/blob/main/instructions/playwright-typescript.instructions.md`](https://github.com/github/awesome-copilot/blob/main/instructions/playwright-typescript.instructions.md)\n\
  \n始终记住，检查生成的代码是关键。AI 能帮你完成 80–90% 的工作，但你的见解才能确保完全覆盖。这引出了我们进入下一节。\n\n# 完善 AI 生成脚本以提高可靠性\n\
  \nAI 生成的脚本可以是一个很好的起点，但它们通常需要一些润色以符合最佳实践并适应你项目的特定需求。它们通常包含基础操作，如导航、点击按钮或简单的断言，但在上下文感知逻辑、错误处理或元素选择方面可能存在不足。\n\
  \n请花几分钟检查以下内容：\n\n*   **脆弱的选择器**，例如 `div:nth-child(3)`。如果页面结构发生变化，这些选择器很容易失效。\n\
  *   **缺少等待**，在处理动态内容时可能会导致测试不稳定（flaky tests）。\n\n例如，一个基础的 AI 生成脚本可能会这样测试按钮：\n\n\
  ```\nawait page.click('button');\n```\n\n这种写法可行，但选择器不够具体。相反，目标应该是基于角色或文本的选择器（如 `getByRole`\
  \ 或 `getByText`）以及自定义数据属性，例如（`data-testid`）：\n\n```\nawait page.getByRole('button',\
  \ { name: 'Submit' }).click();\n```\n\n关键操作可以封装在 `try-catch` 块中以优雅的方式处理失败。不要忘记使用\
  \ `expect` 对预期结果进行断言。\n\n这是一个示例：\n\n```\n// AI-generated:\nimport { test, expect\
  \ } from '@playwright/test';\ntest('netlify.app - click on button', async ({ page\
  \ }) => {\n  await page.goto('https://sweetshop.netlify.app/');\n  await page.click('.btn');\n\
  });\n```\n\n我们可以这样改进这个 AI 生成的脚本：\n\n```\n// Improved:\nimport { test, expect } from\
  \ '@playwright/test';\ntest('netlify.app - click on button', async ({ page }) =>\
  \ {\n  try {\n    await page.goto('https://sweetshop.netlify.app', {timeout:30000});\n\
  \    await expect(page.getByText('Welcome')).toBeVisible();\n    await page.getByRole('link',\
  \ { name: 'Browse Sweets' }).click();\n  } catch (error) {\n    console.error('Something\
  \ went wrong:', error);\n    throw error;\n  }\n});\n```\n\n在这里，我们使用 `try-catch`\
  \ 块来捕获任何错误：如果发生问题，我们会记录该问题并抛出错误。\n\n\n\n\n\n然后你可以将这些内容粘贴到你偏好的 LLM（如 `ChatGPT`、`Grok`\
  \ 或 `GitHub Copilot`）中，获取解释、根原因分析和修复建议。这减少了向 AI 描述问题的人工工作，使得调试更快速、更准确。\n\n在接下来的章节中，我们将介绍如何实现回退定位器（fallback\
  \ locators），以便你的测试自动化能够动态适应变化，并随时间推移保持可靠性。\n\n# 实现健性的定位器策略\n\n现代 Web 应用变化很快：元素会移动，ID\
  \ 会更新，新的类名会不断出现。如果你的自动化测试依赖于静态定位器，这些变化很容易导致它们崩溃。这就是回退定位器大显身手的地方。\n\n回退定位器允许你从常见问题中恢复，例如元素缺失、过期的元素引用或微小的\
  \ UI 变化。它们不会立即失败，而是尝试通过替代方法寻找元素或重试操作。这有助于减少频繁手动更新。\n\n## 使用回退定位器\n\n如果没有回退逻辑，你将因为微小的变化而不断修复测试。这里有一个简单的示例，展示如何通过尝试多个定位器来让你的测试具有健壮性：\n\
  \n```\nimport { test, expect } from '@playwright/test';\ntest('Google search button',\
  \ async ({ page }) => {\n  await page.goto('https://google.com');\n  const locators\
  \ = [\n    page.getByTestId('submit-button'),\n    page.getByRole(\"button\", {\
  \ name: \"Google Search\" }),\n\n    page.getByText('Google Search'),\n  ];\n  for\
  \ (const locator of locators) {\n    try {\n      await locator.click({ timeout:\
  \ 5000 });\n      console.log('Success!');\n      return;\n    } catch {\n     \
  \ console.warn(`Locator failed: ${locator}, trying next...`);\n    }\n  }\n  throw\
  \ new Error(\"All locators failed for Submit button\");\n});\n```\n\n这段代码通过几种不同的方式检查按钮：通过它的角色和名称、`data-testid`\
  \ 属性，以及在按钮内查找 `Submit` 单词。这使得函数具有灵活性，以防按钮在不同版本的页面中编码不同。\n\n它会逐个遍历每个选项并尝试点击。如果某个在\
  \ 5 秒内不起作用，它将移动到下一个并记录警告以让你知道发生了什么。如果一个都不行，它将抛出一个错误，让你知道无法找到或点击该按钮。这是一个确保你的脚本即使页面发生细微变化也能继续运行的简单方法。添加回退定位器让你的测试更加可靠，特别是在稳定性是关键的\
  \ CI/CD 环境中。\n\n## 使用重试逻辑处理临时性失败\n\nPlaywright 内置的重试功能非常有用。如 `click`、`fill` 等操作会自动重试，直到元素就绪（即它是可见的、启用的等）。你也可以在你的\
  \ `playwright.config.ts` 文件中调整超时（详情请参阅 *第 1 章*，*快速设置复习*）。\n\n但如果你需要更多的控制，，可以利用 Playwright\
  \ 的 `expect().toPass()` 断言：\n\n```\n// 等待加载器消失（反复重试直到通过）\nawait expect(async ()\
  \ => {\n  // 断言加载器不再可见\nawait expect(page.locator('.loader')).not.toBeVisible();\n\
  }).toPass({\n  timeout: 3000,    // 尝试 3 秒\ninterval: 1000,   // 每半秒检查一次\n});\n\
  ```\n\n`expect().toPass()` 将反复运行函数直到其通过（或超时）。\n\n如果你想获得更多的控制，可以这样实现你自定义的重试逻辑：\n\n\
  ```\nasync function retryAction(action, maxAttempts = 3) {\n  for (let attempt =\
  \ 1; attempt <= maxAttempts; attempt++) {\n    try {\n      await action();\n  \
  \    return;\n    } catch (error) {\n      console.warn(`Attempt ${attempt} failed:\
  \ ${error}`);\n      if (attempt === maxAttempts) throw error;\n      await new\
  \ Promise(res => setTimeout(res, 1000));\n    }\n  }\n}\n// 使用方法\nawait retryAction(()\
  \ => page.getByText(\"Login\").click());\n```\n\n这段代码设置了一个函数，旨在多次尝试执行操作直到指定的次数。该函数接受两个参数：`action`（一个返回\
  \ promise 的函数）和 `maxAttempts`（可选数字，指定失败时应重试的次数）。\n\n如果操作在第一次尝试时成功了，太棒了！如果没有，它会捕获错误、记录警告、等待一秒并重试。如果在所有允许的尝试后仍然失败，它将抛出错误以便你根据需要进行处理。在这种情况下，我们使用该函数来尝试点击页面上的\
  \ `Login` 按钮。因此，如果按钮加载需要时间或没有立即就绪，此函数将耐心地重试而不是导致测试崩溃。这是一个让你的自动化测试对页面小插曲不敏感的简单方法。限制重试次数是重要的，限制尝试有助于防止浪费资源和时间的无限循环。\n\
  \n## 处理动态内容\n\n在处理在初始页面加载*之后*加载部分内容的 Web 页面（例如**加载更多**按钮或稍后填充的列表）时，在与元素交互之前，等待元素就绪是重要的。如果你尝试过早地点击或检查某些内容，你的测试可能会失败。为了处理这种情况，Playwright\
  \ 提供了如显式等待等工具，如下所示：\n\n```\nawait page.waitForSelector('img', {\n  state: 'visible',\n\
  \  timeout: 10000,\n});\n```\n\n在这里，你是在告诉 Playwright *等待 10 秒直到此元素出现*。但如果没有清晰的选择器可以等待怎么办？在这种情况下，你可以使用\
  \ `waitForFunction`：\n\n```\nawait page.waitForFunction(() => document.querySelector('.loaded')\
  \ !== null, {\n  timeout: 15000,\n});\n```\n\n这段代码持续检查你的自定义条件（在这种情况下，是否存在带有 `.loaded`\
  \ 类的元素），直到其变为 `true` 或达到超时。这在你需要更多控制时非常完美。\n\n## 尝试替代路径\n\n有时，你可能会尝试点击按钮或链接，但由于某些原因（可能被隐藏、加载缓慢或被另一个元素覆盖），点击并没有实际生效。与其让测试失败，你可以添加一个回退方案：\n\
  \n```\nimport { test, expect } from '@playwright/test';\ntest('should navigate to\
  \ sweets page', async ({ page }) => {\n  await page.goto('https://sweetshop.netlify.app/',\
  \ \n                  { waitUntil: 'domcontentloaded' });\n  try {\n    // 点击点击\
  \ Dashboard 链接\nawait page.getByRole('link', { name: 'Browse Sweets' })\n      \
  \        .click({ timeout: 5000 });\n    // 验证导航成功\nawait expect(page).toHaveURL(/sweets$/,\
  \ { timeout: 5000 });\n  } catch (error) {\n    console.warn('链接点击失败，直接导航...');\n\
  \    await page.goto('https://sweetshop.netlify.app/sweets', \n                \
  \    { waitUntil: 'domcontentloaded' });\n    // 验证回退导航\nawait expect(page).toHaveURL(/sweets$/,\
  \ { timeout: 10000 });\n  }\n});\n```\n\n\n\n\n\n`page.goto()` 方法中的 `waitUntil`\
  \ 选项告诉 Playwright 在继续后续操作之前，何时认为页面已“准备就绪”。在这种情况下，我们使用 `waitUntil: 'domcontentloaded'`，它在浏览器加载完主\
  \ HTML 时触发，但在图像、样式表或 iframe 等内容完全加载之前。对于大多数测试需求来说这足够了，特别是当你只需要检查或与文本、按钮或其他主页面结构部分的元素进行交互时。它还能让你的测试运行得更快，因为不需要等待其他所有内容的加载。\n\
  \n但如果你确实需要等待所有内容完全加载（例如，检查图像是否可见），你可能想要使用不同的选项，例如 `'load'`。\n\n## 使用由 AI 驱动的自愈功能\n\
  \n有时候，网站的简单更改（例如移动按钮或更改其颜色）会完全破坏你的自动化测试。这是一个常见且令人沮丧的问题，耗费大量时间。\n\nAI 驱动的自愈允许你的自动化测试智能地适应用户界面（UI）的变化，而不是立即失败。它们会自动“修复”并继续运行。\n\
  \n虽然 Playwright 没有内置的 AI 自愈功能，但你可以集成如 Testim 或 Mabl 等商业工具。想象一下，你编写了一个测试来点击按钮。传统的测试会根据特定的\
  \ ID 寻找，如果开发者后来更改了 ID，测试就会丢失并失败。\n\nAI 驱动的自愈框架工作方式不同。当你首次创建测试时，AI 会收集关于该按钮的信息：\n\
  \n* 它包含什么文本\n* 它看起来什么样（尺寸和颜色）\n* 它位于页面的什么位置\n\n如果测试在运行时无法通过原始 ID 找到按钮，AI 不会放弃。它会快速扫描页面，使用所有线索来寻找按钮，“啊！找到了。”然后测试使用新地址更新脚本并继续。最好的部分是，系统会记录此更改，这样你可以看到修复了什么，AI\
  \ 也会从中学习，变得更加智能。\n\n测试维护是那些悄悄吞噬你大量时间的任务之一。通过自愈，你可以大幅减少在修复测试花费的时间，释放出精力关注更重要的事情。它也让你的测试更加可靠。不再因为有人更改了按钮颜色或移动了标签而失败，除非存在真正的\
  \ Bug。这意味着你可以信任结果，并花费更少的时间去猜测失败的原因。\n\n简而言之，AI 驱动的自愈消除了测试自动化中最枯燥的部分，让你专注于真正的核心：构建交付软件。\n\
  \n尽管有优点，自愈测试也有权衡。一个缺点是测试执行速度变慢。此外，虽然自愈可以处理 UI 调整，但它无法防止大型重设计或结构性变化。此类重构仍会导致测试失败。还存在误报的风险。如果你的恢复逻辑过于激进，可能会掩盖应该导致测试失败的问题。最后，实现\
  \ AI 驱动或高级自愈工具会增加测试栈的复杂性，需要额外的设置。对于大多数小型项目来说，这些投入和开销可能并不值得。\n\n# 总结\n\nAI 正在改变自动化测试的游戏，`Playwright\
  \ Codegen`、`Playwright MCP` 和 `GitHub Copilot` 等工具让入门变得更容易。你现在可以通过与网站交互或使用自然语言提示来生成可靠的测试脚本。这很快就能提高你的生产力。\n\
  \n当然，AI 并非完美。它创建的脚本是一个很好的起点，但通常需要润色。脆弱的选择器、缺失的等待或跳过的边缘情况仍然会让你遇到困难。这正是你技能显身的地方：精炼\
  \ AI 提供的内容、添加更好的定位器、将操作封装在错误处理中，并确保测试实际上检查了预期结果。\n\n添加健壮的定位策略更进了一步。通过一些智能技术，你的测试可以处理\
  \ UI 的变化而不会崩溃，这对于在快速变化的项目中保持稳定非常完美。\n\n最后，当你将 AI 的速度与自己的经验相结合时，真正的魔法就会发生。你让 AI 完成繁重工作，而你对结果进行微调以适应现实世界。自动化测试是一个令人兴奋的时代。\n\
  \n在下一章中，我们将关注通过并行运行和优化性能来高效扩展测试。\n\n## 获取本书的 PDF 版本和专属额外内容\n\n扫描二维码（或访问 [packtpub.com/unlock](https://packtpub.com/unlock)）。按名称搜索此书，确认版本，然后按照页面步骤操作。\
  \ | ![](img/Unlock-01.png)![](img/Unlock.png) |\n\n| 注意：请保留发票。直接从 Packt 购买不需要发票。\
  \ |\n\n# 5\n\n# 使用 Fixture 系统构建可扩展测试\n\n如果每个测试都管理自己的设置和清理，测试现代 Web 可能会变得复杂。想象为每个测试反复启动浏览器、登录并设置环境。这不仅耗时，还会导致结果不一致。\n\
  \n这就是 Playwright fixtures（用例）的作用。受 Python `pytest` 框架的启发，fixtures 充当处理基本资源的复用构建块。它们管理所有后台工作，让你能够关注你正在测试的内容。你甚至可以创建自定义\
  \ fixtures 以完美符合你的项目需求。\n\n在本章中，你将发现如何充分利用 Playwright 的 fixture 系统。我们将从内置 fixtures\
  \ 开始，然后转向创建自己的 fixtures 并理解作用域（scope）和生命周期如何影响你的测试。我们还将涵盖高级主题，如嵌套 fixtures、将其与页面对象模型（POM）集成，以及设计让套件易于管理的可扩展架构。\n\
  \n因此，我们将在本章涵盖以下主题：\n\n* 查看内置 fixtures\n* 创建自定义 fixtures\n* 理解作用域和生命周期\n* Fixture\
  \ 示例\n\n## 技术要求\n\n本章的源代码可在 [`github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright/tree/main/Chapter05`](https://github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright/tree/main/Chapter05)\
  \ 获取。\n\n# 查看内置 fixtures\n\n内置 fixtures 是 Playwright Test 框架随附提供的易用工具。它们是预包的助手，负责常见任务，如设置和拆除浏览器、页面和上下文。它们让编写测试变得简单。\n\
  \n使用 fixtures 不需要任何特殊操作。它们默认是可用的。只需在测试函数中声明它们，Playwright 就会处理其余工作。\n\n核心机制是**依赖注入**。当你定义一个测试时，将需要的\
  \ fixtures 列为 `test` 函数的参数。Playwright 测试运行器看到这些参数，在测试运行之前后台初始化相应的对象，然后将它们传递给你的测试。测试结束后，它会自动清理。\n\
  \n\n\n\n\n例如，假设你写了这样一个测试：\n\n```\nimport { test, expect } from '@playwright/test';\n\
  test('my first test', async ({ page }) => {\n  await page.goto('https://playwright.dev/');\n\
  \  await expect(page).toHaveTitle(/Playwright/);\n});\n```\n\n在这里，你从未编写过任何代码来启动浏览器或创建新页面。`{\
  \ page }` 参数告诉测试运行器：“嘿，我这个测试需要一个全新的浏览器页面。”然后，运行器会为你执行以下步骤：\n\n1. **设置 (Sets up)**：启动浏览器，创建一个新的浏览器上下文，并创建一个新页面。\n\
  2. **注入 (Injects)**：将 `page` 对象传递到你的测试函数中。\n3. **执行 (Executes)**：运行你的测试代码。\n4. **卸载\
  \ (Tears down)**：自动关闭页面、上下文和浏览器。\n\n以下是主要的内置固件（fixtures）概述、它们的功能以及你如何在测试中使用它们。一旦你熟悉了这些\
  \ Playwright 固件，我们将查看如何创建自己的固件，以处理针对你测试需求定制的可复用设置和卸载逻辑。\n\n## browser 固件\n\n`browser`\
  \ 固件为测试提供了一个新的浏览器实例（Chromium、Firefox 或 WebKit）。浏览器实例在测试开始时启动，在测试结束时关闭。当你需要直接控制浏览器时（例如启动新上下文或管理浏览器级设置），可以使用它。\n\
  \n这里是一个示例：\n\n```\nimport { test, expect } from '@playwright/test';\ntest('manage\
  \ browser-level settings', async ({ browser }) => {\n  // 使用自定义设置创建新上下文\nconst context\
  \ = await browser.newContext({\n    userAgent: 'My Custom User Agent',\n    locale:\
  \ 'fr-FR',\n    // 其他选项如 timezoneId, colorScheme 等\n  });\n  // 在此上下文中创建一个页面\nconst\
  \ page = await context.newPage();\n  await page.goto('url');\n  // 在此处编写你的测试操作和断言\n\
  await context.close();\n});\n```\n\n另一个 `browser` 固件是 `browserName`，它只是一个表示正在使用的浏览器名称的字符串（`\"\
  chromium\"`、`\"firefox\"` 或 `\"webkit\"`）。对于基于浏览器类型的条件逻辑非常有用。\n\n这里是一个示例：\n\n```\n\
  import { test } from '@playwright/test';\ntest('check browser', async ({ browserName\
  \ }) => {\n  if (browserName === \"chromium\") {\n    console.log(`Running on ${browserName}`);\n\
  \  }\n});\n```\n\n## page 固件\n\n`page` 固件为测试提供了一个单一且隔离的浏览器页面（标签页），该页面在新的浏览器上下文中自动创建。它是测试单个网页或用户流的理想选择，因为它预先配置了上下文并在测试结束后自动关闭。这是最常用的固件，因为大多数测试都与单个页面交互。\n\
  \n这里是一个示例：\n\n```\nimport { test, expect } from '@playwright/test';\ntest('visit\
  \ page', async ({ page }) => {\n  await page.goto('https://www.google.com/');\n\
  \  await expect(page).toHaveTitle(/Google/);\n});\n```\n\n相比之下，我们之前讨论的 `browser`\
  \ 固件提供了一个完整的 `browser` 实例（Chromium、Firefox 或 WebKit），让你对整个浏览器有控制权，包括创建多个上下文、管理浏览器级设置或启动多个页面的能力。但它需要手动创建上下文和页面。本质上，`page`\
  \ 固件是用于简单单页测试的高级抽象，而 `browser` 固件为更复杂的场景提供了低级控制。`page` 固件还会使用你在 `playwright.config.ts`\
  \ 文件中定义的设置进行自动配置，例如默认浏览器类型和视口大小（我们在第一章“快速设置回顾”中讨论过的），这使得大多数测试变得变得方便。\n\n## context\
  \ 固件\n\n`context` 固件提供一个 `BrowserContext` 对象。上下文类似于无模式浏览器配置文件，拥有自己的 Cookie 和本地存储。在同一个上下文中创建的所有页面将共享这些内容。这对于需要在多个标签页之间管理登录状态的测试非常有用。\n\
  \n这里是一个示例：\n\n```\nimport { test, expect } from '@playwright/test';\ntest('should\
  \ share cookies between pages in the same context', async ({ context }) => {\n \
  \ // 在同一个上下文中创建两个页面\nconst page1 = await context.newPage();\n  const page2 = await\
  \ context.newPage();\n  // 在 page1 上设置 cookie\nawait page1.goto('https://playwright.dev/');\n\
  \  await page1.context().addCookies([{\n    name: 'test_cookie',\n    value: 'test_value',\n\
  \    domain: '.example.com',\n    path: '/',\n  }]);\n  // 在 page2 上导航到相同的域名\nawait\
  \ page2.goto('https://playwright.dev/');\n  // 验证 page2 是否可以访问相同的 cookie\nconst\
  \ cookies = await page2.context().cookies();\n  const testCookie = cookies.find(cookie\
  \ => cookie.name === 'test_cookie');\n  expect(testCookie).toBeDefined();\n  expect(testCookie.value).toBe('test_value');\n\
  \  // 清理\nawait page1.close();\n  await page2.close();\n});\n```\n\n在这里，脚本使用 `context`\
  \ 固件在同一个 `context` 中创建两个页面（`page1` 和 `page2`）。它将 `page1` 导航到 `https://playwright.dev/`，设置一个\
  \ cookie，然后让 `page2` 导航到相同域名。通过获取 cookie 验证 `test_cookie` 是否符合预期值。验证完成后，两个页面会被关闭。\n\
  \n## request 固件\n\n`request` 固件提供一个 `APIRequestContext` 实例，用于 API 或其他终端发送 HTTP 请求（如\
  \ `GET` 或 `POST`）。此固件对于测试 API 或通过 HTTP 请求准备数据非常有用。\n\n这里是一个示例：\n\n```\nimport {\
  \ test, expect } from '@playwright/test';\ntest('API request', async ({ request\
  \ }) => {\n  const response = await request.get('https://jsonplaceholder.typicode.com/todos/1');\n\
  \  expect(response.ok()).toBeTruthy();\n});\n```\n\n内置固件开箱可用，但你也可以创建自定义固件来完美适配你的应用程序。\n\
  \n# 创建固件\n\n如果没有汇总的方法，你可能会多个地方编写相同的设置步骤（如启动浏览器、导航到 URL 和登录）以及卸载步骤（如关闭浏览器），有时在每个测试文件中甚至每个测试中。\n\
  \n这导致了代码重复，增加了维护难度，并可能导致不一致，从而引发测试不稳定。此外，如果以后需要更改设置或卸载，你需要在许多地方进行更新。这正是项目级固件大显身手的地方。它们允许你在特定项目的所有测试中共享如浏览器实例等内容。\n\
  \n要在 Playwright 中设置自定义固件，你需要从扩展基础测试对象开始。首先，从 `@playwright/test` 导入基础测试。然后，使用 `test.extend()`\
  \ 方法添加你的固件。每个固件都是一个 `async` 函数，接收任何依赖项以及一个 `use` 回调。这为你提供了一个良好的流程：首先执行任何设置工作，通过\
  \ `use` 将控制权交还给测试，然后在测试结束后通过清理工作完成任务。\n\n例如，假设你有许多测试需要一个登录用户。你可以这样定义一个自定义固件：\n\n\
  \n\n\n\n```\n// fixtures/auth.ts\nimport { test as base } from '@playwright/test';\n\
  export const test = base.extend<{ loggedInPage: Page }>({\n  loggedInPage: async\
  \ ({ page }, use) => {\n    // --- Setup: Log the user in ---\nawait page.goto('https://www.saucedemo.com/');\n\
  \    await page.getByPlaceholder('Username').fill('standard_user');\n    await page.getByPlaceholder('Password').fill('secret_sauce');\n\
  \    await page.getByRole('button', { name: 'Login' }).click();\n    await page.waitForURL('https://www.saucedemo.com/inventory.html');\n\
  \n    console.log('User logged in!');\n    // Provide the logged-in page to the\
  \ test\nawait use(page);\n    // --- Teardown ---\n// Example: Log out if needed\n\
  // await page.click('#logout-button');\nconsole.log('Test finished, loggedInPage\
  \ fixture torn down.');\n  },\n});\n```\n\n注意看我们如何使用 `await use(value)` 将 fixture\
  \ 的值传递给 `use` 回调，这会将资源移交给测试执行。在脚本结束时，你可以在 `use` 调用之后实现 teardown 逻辑以清理资源。这确保了测试的隔离性，并防止了残留数据或打开的连接等副作用。\n\
  \n现在，你可以在代码中使用该 fixture：\n\n```\nimport { test } from '../fixtures/auth';\nimport\
  \ { expect } from '@playwright/test';\ntest('should display shopping cart after\
  \ login', async ({ loggedInPage }) => {\n  const cartLink = loggedInPage.locator('.shopping_cart_link');\n\
  \  await expect(cartLink).toBeVisible();\n});\n```\n\n以这种方式使用 fixture 有许多益处：\n\n\
  *   登录逻辑只定义一次，因此每个测试都可以关注它实际在测试的内容\n*   你可以在多个测试中使用同一个 fixture，而无需重复代码\n*   每个测试都会获得它自己全新的\
  \ `loggedInPage` fixture（默认是 `test` 作用域），这有助于防止一个测试意外影响到另一个测试\n*   Setup 和 teardown\
  \ 在任何地方的行为都相同，这有助于保持测试的可靠性（我们将在 `Fixture life cycle` 章节中讨论这一点）\n\n你还可以按项目类型（例如 `Desktop\
  \ Chrome` 与 `Mobile Safari`）对测试进行分组，并在具有正确仿真设置的各自的隔离环境中运行每个组。在测试内部，你仅需使用内置的 `page`\
  \ fixture，并让 Playwright 为你处理页面生命周期即可。\n\n如果你需要在 worker 内部的测试之间复用同一个登录页面，请考虑使用 `scope:\
  \ 'worker'` 选项定义你的 fixture。这确保了页面每个 worker 创建一次，并在其所有测试之间共享。有关更多详细信息，请参阅 Playwright\
  \ 关于 worker 作用域 fixture 的文档（[`playwright.dev/docs/test-fixtures#worker-scoped-fixtures`](https://playwright.dev/docs/test-fixtures#worker-scoped-fixtures)）。\n\
  \n到目前为止，我们查看了什么是 fixture、如何使用内置的 fixture，以及如何为自定义设置创建自己的 fixture。但仅仅知道 fixture 是什么只是故事的一半。要真正有效地使用它们，你还需要理解它们的生命周期有多长、它们何时被创建以及何时被销毁。\n\
  \n# 理解 fixture 作用域和生命周期\n\nFixture 作用域和生命周期概念定义了 fixture 存在的边界：它是为每个测试全新启动，还是在同一\
  \ worker 的多个测试之间进行复用。处理好这一点可能意味着缓慢、不稳定的测试套件与能够大规模流畅运行的套件之间的区别。\n\n## Fixture 作用域\n\
  \nFixture 的作用域定义了其资源在运行期间活跃多久，以及在测试之间如何共享。Playwright 提供了两种 fixture 作用域：`test` 和\
  \ `worker`，每个设计用于不同的场景：\n\n*   **Test**: `test scope` 是默认值，并提供了最强的隔离性。具有 test 作用域的\
  \ fixture 会为每个单独测试创建并清理，因此每个测试都会获得资源的全新实例。例如，内置的 `page` fixture 是 `test` 作用域的，这意味着每个测试都在一个全新的浏览器页面上运行。这防止了任何状态在测试之间泄漏，并确保了完全独立。权衡是性能：为每个测试创建和销毁资源会减慢速度，特别是在较大的测试套件中。\n\
  *   **Worker**: `worker scope` 在隔离性和性能之间提供了一个折中方案。具有 worker 作用域的 fixture 每个 worker\
  \ 进程创建一次，然后在该 worker 运行的所有测试之间共享。Playwright 中的 worker 是单个 Node.js 进程，它按顺序运行多个测试，你可以并行运行多个\
  \ worker（使用 `--workers` 选项）来加速。内置的 `browser` fixture 是 `worker` 作用域的，因为为每个测试启动新浏览器将非常消耗资源。Worker\
  \ 作用域非常适合可以在 worker 内部安全地复用的昂贵资源，但你需要留意状态，以避免测试之间相互干扰。\n\n## Fixture 生命周期\n\nFixture\
  \ 的生命周期描述了 fixture 在测试执行期间经历的历程：它的设置、使用和清理。Playwright 会自动处理这些步骤，因此浏览器、页面或自定义对象等资源将得到高效管理：\n\
  \n*   **Setup**: 这是 fixture 生命周期的起点，Playwright 在此处创建 fixture 需要的资源。Setup 只有在测试或另一个\
  \ fixture 实际需要时才会懒性地发生。例如，如果测试使用了内置的 `page` fixture，Playwright 将启动一个浏览器（如果尚未运行），并开启一个新的上下文。\n\
  *   **Usage**: 一旦 setup 完成，fixture 的资源就会移交给测试。这是测试实际运行的地方，无论是导航到 URL 还是点击按钮。fixture\
  \ 的作用域决定了它的行为：`test` 作用域的 fixture（如 `page`）为每个测试提供干净实例。`worker` 作用域的 fixture（如 `browser`）在运行该\
  \ worker 的测试之间共享。\n*   **Teardown**: 在测试（取决于作用域）结束后，Playwright 会自动清理 fixture。对于\
  \ `test` 作用域的 fixture（如 `page`），资源会在每个测试后关闭。`worker` 作用域的 fixture（如 `browser`）将在\
  \ worker 结束时清理。\n\n# 实际 fixture 示例\n\nfixture 的真正价值在你付诸实践时才会体现。在本节中，我们将通过实际示例演示如何在真实的测试场景中应用\
  \ fixture。我们将探索如何将 fixture 链在一起以实现登录工作流、自动检测损坏图像以及在页面加载时捕捉控制台日志。\n\n## 创建依赖于登录用户的页面对象\
  \ fixture\n\n**页面对象模型**（**POM**）是一种流行的设计模式，它通过将“测试在做什么”与“它如何与应用程序交互”分离来帮助组织测试代码。与其直接将定位器和交互逻辑散落在测试文件中，不如通过\
  \ POM 将它们整齐地封装在页面类中。\n\n\n\n\n学习一个框架或编程语言很少是一条径直的大路。我们将在 *第 15 章 *测试可维护性的最佳实践* 中重新回到\
  \ POM（页面对象模型），但现在我们的重点是如何将它们与 fixtures（变形）结合使用。如果你觉得这个主题有点挑战性，先复习 *第 15 章 可能会有帮助。\n\
  \n正如我们所学到的，fixtures 像助手一样，自动为你的测试提供重用的对象（包括页面对象）。如果没有 fixtures，你将不得不在每一个测试中手动创建并初始化页面对象。这对于小型项目尚可行，但很快就会变得重复且难以维护。fixtures\
  \ 通过允许你只定义一次页面对象，然后将其 `injecting`（注入）到任何需要它的测试中，从而解决了这个问题。这种组合（POM 用于结构，fixtures\
  \ 用于自动化）为你的项目提供了易于维护的测试套件。\n\n例如，你可以这样定义一个 `LoginPage` 类：\n\n```\n// pages/LoginPage.ts\n\
  import { Page, Locator } from '@playwright/test';\nexport class LoginPage {\n  private\
  \ readonly page: Page;\n  private readonly usernameInput: Locator;\n  private readonly\
  \ passwordInput: Locator;\n  private readonly submitButton: Locator;\n  constructor(page:\
  \ Page) {\n    this.page = page;\n    this.usernameInput = page.getByPlaceholder('Username');\n\
  \    this.passwordInput = page.getByPlaceholder('Password');\n    this.submitButton\
  \ = page.getByRole('button', { name: 'Login' });\n  }\n  async navigate() {\n  \
  \  await this.page.goto('https://www.saucedemo.com/');\n  }\n  async login(username:\
  \ string, password: string) {\n    await this.usernameInput.fill(username);\n  \
  \  await this.passwordInput.fill(password);\n    await this.submitButton.click();\n\
  \  }\n}\n```\n\n在这里，该类封装了登录页面工作的所有细节。测试不需要关心定位器或哪个按钮提交了表单：它们只需调用 `loginPage.login('user',\
  \ 'pass')`。\n\n然后，为它创建一个 fixture：\n\n```\n// fixtures/login.fixture.ts\nimport {\
  \ test as base } from '@playwright/test';\nimport { LoginPage } from '../pages/LoginPage';\n\
  export const test = base.extend({\n  loginPage: async ({ page }, use) => {\n   \
  \ const loginPage = new LoginPage(page);\n    await loginPage.navigate();\n    await\
  \ use(loginPage);\n  },\n});\nexport { expect } from '@playwright/test';\n```\n\n\
  这个 fixture 确保任何声明 `loginPage` 为依赖的测试都会自动获得初始化的 `LoginPage` 实例。你不需要在多个测试中重复设置逻辑：\n\
  \n```\n// tests/dashboard.spec.ts\nimport { test, expect } from '../fixtures/login.fixture';\n\
  test('login test', async ({ loginPage }) => {\n  await loginPage.login('standard_user',\
  \ 'secret_sauce');\n  await expect(loginPage.page).toHaveURL('https://www.saucedemo.com/inventory.html');\n\
  });\n```\n\n注意测试现在读起来几乎就像一句话：\n\n1. 使用这些凭登录。\n2. 检查我们是否进入了库存页面。\n\n这里完全没有提到选择器或按钮点击：细节被安全地隐藏在页面对象内部。\n\
  \nPOM 和 fixtures 的结合为测试设计带来了几个重要优势。测试变得更具维护性，因为页面结构的任何更改只需要在一个地方（页面对象）中更新定位器，而不需要跨越几十个测试。\n\
  \nfixture 通过让页面对象在整个套件中易于重用增加了另一层效率。它自动处理设置（setup）和清理（teardown），所以你不需要重复样板代码。这种方法高度可扩展性，因为\
  \ fixture 依赖可以模拟复杂的流程，而不会弄乱测试逻辑。\n\n## 构建一个测试损坏图片的 fixture\n\n为了加深你对 fixtures 的理解，让我们构建一个来检查页面上任何可能引起问题的图片。这个测试被设计为会失败，因为目标网站（`https://with-bugs.practicesoftwaretesting.com/#/`）故意包含了损坏图片。测试输出将清晰地报告损坏图片的\
  \ URL 及其 HTTP 状态，这证实了我们的新 fixture 运行完美。\n\n这种基于 fixture 的方法在这里非常有用，因为你现在可以将其添加到任何测试中，以快速检查损坏图片，而无需重复代码：\n\
  \n```\n// fixtures/image-validator.fixture.ts\nimport { test as base, expect } from\
  \ '@playwright/test';\n/**\n* 提供一个函数通过检查 src 属性、HTTP 状态码和图片内容的有效性来检查损坏图片。\n*/\n\
  export const test = base.extend({\n  imageValidator: async ({ page }, use) => {\n\
  \    const validateImages = async () => {\n      const allImages = await page.locator('img').all();\n\
  \      const brokenImages = [];\n      for (const img of allImages) {\n        const\
  \ src = await img.getAttribute('src');\n        if (!src) {\n          brokenImages.push({\
  \ \n            src: 'Missing src attribute', \n            status: 'N/A' \n   \
  \       });\n          continue;\n        }\n        const absoluteSrc = new URL(src,\
  \ page.url()).href;\n\n        try {\n          const response = await page.request.get(absoluteSrc);\n\
  \          if (!response.ok()) {\n            brokenImages.push({ \n           \
  \   src: absoluteSrc,\n              status: response.status()\n            });\n\
  \          } else {\n            const isCorrupted = await img.evaluate(image =>\
  \ image.naturalWidth === 0);\n            if (isCorrupted) {\n              brokenImages.push({\
  \ \n                src: absoluteSrc, \n                status: 'OK but corrupted\
  \ (naturalWidth is 0)'\n              });\n            }\n          }\n        }\
  \ catch (error) {\n          brokenImages.push({ \n            src: absoluteSrc,\
  \ \n            status: `Error: ${error.message}`\n          });\n        }\n  \
  \    }\n      const errorMessage = `Found ${brokenImages.length} broken images:\\\
  n${JSON.stringify(brokenImages, null, 2)}`;\n      expect(brokenImages, errorMessage).toEqual([]);\n\
  \    };\n    await use(validateImages);\n  },\n});\n```\n\n现在，在我们的测试文件中，可以使用以下内容：\n\
  \n```\n// tests/broken-images.spec.ts\nimport { expect } from '@playwright/test';\n\
  import { test } from \"../fixtures/image-validator.fixture.ts;\ntest.describe('Broken\
  \ Images Validation', () => {\n  test('should not find any broken images on the\
  \ page', async ({ page, imageValidator }) => {\n    await page.goto('https://with-bugs.practicesoftwaretesting.com/#/');\n\
  \n    await expect(page.locator('[data-test=\"product-1\"]')).toBeVisible();\n\n\
  \    await imageValidator();\n  });\n});\n```\n\n\n\n\n首先，我们从 `image-validator.fixture.ts`\
  \ 导入 fixture。在例例中，我们没有从 fixture 中导出 `expect`，因此我们必须从 Playwright 本身获取 `expect`。\n\
  \n测试导航到网站，等待主内容可见以确保图像已开始加载，然后调用我们从 `imageValidator` fixture 导入的 `validateImages`\
  \ 函数。\n\n代码应该在网站上找到两个损坏的图像，并将它们记录到控制台：\n\n```\nError: Found 2 broken images:\n[\n\
  \  {\n    \"src\": \"https://with-bugs.practicesoftwaretesting.com/broken.png\"\
  ,\n    \"status\": 404\n  },\n  {\n    \"src\": \"https://with-bugs.practicesoftwaretesting.com/broken.png\"\
  ,\n    \"status\": 404\n  }\n]\n```\n\n这种关注点分离使得 fixture 可以在多个测试用例或项目之间复用。\n\n##\
  \ 创建一个 fixture 来检查页面加载时的控制台日志\n\n许多应用程序会在控制台中静默地记录错误或警告，而不会破坏 UI。你可以定义一个 fixture，如果出现了意外的\
  \ `console.error()` 或 `console.warn()` 条，则使测试失败：\n\n```\n// fixtures/console.fixture.ts\n\
  import { test as base, expect } from '@playwright/test';\n/**\n* 检查页面加载时的控制台日志\n\
  */\nexport const test = base.extend({\n  noConsoleErrors: async ({ page }, use)\
  \ => {\n    const consoleErrors = [];\n    // 为 'console' 事件设置监听器。\n    page.on('console',\
  \ msg => {\n      // 检查消息类型是否为 'error'\nif (msg.type() === 'error') {\n        consoleErrors.push('\\\
  n' + msg.text());\n      }\n    });\n    // 在测试中使用 fixture。测试代码将在此处运行。\nawait use();\n\
  \    // 测试后，断言没有记录控制台错误。\n// 这部分是 fixture 的“清理 (teardown)”部分。\nexpect(consoleErrors,\
  \ `Unexpected console errors: ${consoleErrors.join()}`).toHaveLength(0);\n  },\n\
  });\n```\n\n通过使用 `base.extend()` 封装基础测试，我们引入了一个新的 fixture (`noConsoleErrors`)，它会自动集成到测试生命周期中。这意味着任何使用此文件中的\
  \ `test` 的测试都将自动从控制台错误监控中受益，而无需在每个测试文件中编写额外的代码。\n\n在 fixture 内部，Playwright 在页面对象上附加了一个事件监听器，监听浏览器发射的\
  \ `console` 事件。每当记录一条 `console` 消息时，fixture 都会检查消息类型是否为 `error`。如果是，消息文本将被推入一个名为\
  \ `consoleErrors()` 的数组中[注：根据代码，这里是 `consoleErrors`]。这有效地收集了测试运行期间出现在页面控制台中所有 JavaScript\
  \ 错误。\n\n我们可以像这样使用这个 fixture：\n\n```\nimport { test } from '../fixtures/console.fixture.ts';\n\
  test.describe('Page Load Console Logs', () => {\n  test('should load the page without\
  \ any console errors', async ({ noConsoleErrors, page }) => {\n    // 导航到 URL。 \n\
  // `noConsoleErrors` fixture 在此导航期间处于激活状态。\nawait page.goto('https://with-bugs.practicesoftwaretesting.com/#/');\n\
  \  });\n});\n```\n\n在此测试中，我们没有像通常那样直接将 `expect` 导入测试。相反，它是作为 fixture 的一部分运行的。虽然将断言移测试文件总是存在风险，但在这种情况下是合理的并且保持了代码的整洁。\n\
  \n当你测试网站时，你应该会得到以下输出：\n\n```\nError: Unexpected console errors: \nFailed to load\
  \ resource: the server responded with a status of 404 (),\nFailed to load resource:\
  \ the server responded with a status of 401 (Unauthorized),\nERROR {message: Unauthorized}\n\
  ```\n\n此 fixture 可用于防止开发者发布向控制台充斥调试日志、警告或弃用信息的代码。\n\n如果你想让 fixture 为每个测试自动运行，而无需手动导入或调用，可以使用\
  \ `{ auto: true }` 将其标记为自动 fixture。这确保了测试套件中的任何地方都不会遗漏控制台错误。查看此文档获取更多关于自动 fixture\
  \ 的细节：[`playwright.dev/docs/test-fixtures#automatic-fixtures`](https://playwright.dev/docs/test-fixtures#automatic-fixtures)。\n\
  \n# 总结\n\n在本章中，我们看到了 Playwright 的 fixtures 如何让测试更具可扩展性。你不需要反复编写相同的设置和清理代码，fixtures\
  \ 会替你处理这些工作，因此你的测试可以专注于真正重要的事情。\n\n我们探索了内置的 fixtures，如 `browser`、`page`、`context`\
  \ 和 `request`，然后转向了创建自定义 fixture 以处理如登录或验证应用状态等任务。在此过程中，我们学习了 fixture 的作用范围和生命周期，它们决定了资源保留多长时间以及何时被清理。最后，我们通过示例将所有内容付诸实践。结合\
  \ POM 等模式，fixtures 让你能够关注意图而非底层管道工作，从而保持你的测试代码的整洁。\n\n下一章将重点介绍如何通过并行运行测试和优化性能来高效扩展测试。\n\
  \n## 获取本书的 PDF 版本和独家额外内容\n\n扫描二维码（或访问 [packtpub.com/unlock](https://packtpub.com/unlock)）。按书名搜索此书，确认版本，然后按照页面上的步骤操作。\n\
  \n\n\n\n每个工作线程一次获取一个完整的测试文件，并在隔离环境中运行它。它会启动自己的浏览器上下文以确保没有任何内容被共享，从而使 Cookie 或本地存储等内容保持完全独立。\n\
  \n在运行时，Playwright 将整个测试文件分发到所有可用的工作线程。因此，如果你有 20 个测试文件和 4 个工作线程，每个工作线程将处理大约 5 个文件。在任何给定的测试文件中，测试用例将一个接一个运行（串行），除非你告诉\
  \ Playwright 并行运行（我们稍后会介绍）。\n\n由于每个工作线程都会创建自己的全新浏览器上下文，你无需担心测试之间意外共享状态。每个浏览器实例启动时都是干净的，你的测试将保持隔离状态。\n\
  \n## 控制工作线程数量\n\n你有两种主要方式来自定义 Playwright 使用的工作线程数量。从命令行，你可以使用 `--workers` 标记。例如，要启动正好四个工作线程，可以编写以下命令：\n\
  \n```\nnpx playwright test --workers=4\n```\n\n要完全禁用并行执行，你可以这样写：\n\n```\nnpx playwright\
  \ test --workers=1\n```\n\n你还可以使用百分比字符串，例如 `--workers=50%`，Playwright 将分配你机器逻辑核心数的百分比，并向下取整到最整数。这种方法在脚本或\
  \ CI 机器通常非常方便，在这些情况下你希望将并发性与可用资源挂钩，而不是硬编码数字。\n\n如果你喜欢将设置集成到存储库中，可以在 `playwright.config.ts`\
  \ 文件中设置 `workers` 字段。例如，在配置文件中设置 `workers: 6` 意味着 Playwright 运行的工作线程永远不会超过六个，无论检测到多少个核心。如果你省略了\
  \ `workers` 字段或将其设置为 `undefined`，Playwright 将回退到它的自动检测逻辑。\n\n在 CI 中通过根据环境变量条件地减少并发以防止运行过多的工作线程是常见做法。例如，你可能会检查\
  \ `process.env.CI` 是否为真，然后将 `workers` 设置为较小的值，这样 Playwright 仅在本地运行时才会进行自动检测：\n\n\
  ```javascript\nimport { PlaywrightTestConfig } from '@playwright/test';\nconst config:\
  \ PlaywrightTestConfig = {\n  workers: process.env.CI ? 2 : undefined, \n  use:\
  \ {\n    // 其他浏览器选项\n  },\n};\nexport default config;\n```\n\n## 在文件内并行化测试\n\n默认情况下，一旦工作线程获取了测试文件，Playwright\
  \ 就会按串行方式一个接一个执行该文件内部测试。如果你有多个可以安全同时运行的小型测试用例，你可以选择文件内并行。\n\nPlaywright 提供了 `test.describe.parallel()`，它允许你对测试分组，并让运行器将组中的每个测试视为视为自己的工作线程任务，同时仍然在同一个操作系统进程中运行：\n\
  \n```javascript\nimport { test, expect } from '@playwright/test';\ntest.describe.parallel('Parallel\
  \ test suite', () => {\n\n  test('Test 1 - Google.com has correct title', async\
  \ ({ page }) => {\n    await page.goto('https://google.com');\n    await expect(page).toHaveTitle('Google');\n\
  \  });\n  test('Test 2 - Playwright.dev has correct title', async ({ page }) =>\
  \ {\n    await page.goto('https://playwright.dev');\n    await expect(page).toHaveTitle(/Playwright/);\n\
  \  });\n  test('Test 3 - GitHub has correct title', async ({ page }) => {\n    await\
  \ page.goto('https://github.com');\n    await expect(page).toHaveTitle(/GitHub/);\n\
  \  });\n});\n```\n\n在实践中，当工作线程遇到 `test.describe.parallel` 块时，它会为每个测试启动单独的浏览器上下文并同时运行它们（在全局工作线程限制之内）。\n\
  \n因此，此功能通过同时启动多个浏览器上下文，帮助加速包含大量小型独立测试的测试套件。\n\n实现相同结果的另一种选项是使用 `test.describe.configure()`\
  \ 方法，例所示：\n\n```javascript\nimport { test, expect } from '@playwright/test';\ntest.describe.configure({mode:\
  \ 'parallel'}); \n\ntest('Test 1 - Google.com has correct title', async ({ page\
  \ }) => {\n  await page.goto('https://google.com');\n  await expect(page).toHaveTitle('Google');\n\
  });\ntest('Test 2 - Playwright.dev has correct title', async ({ page }) => {\n \
  \ await page.goto('https://playwright.dev');\n  await expect(page).toHaveTitle(/Playwright/);\n\
  });\ntest('Test 3 - GitHub has correct title', async ({ page }) => {\n  await page.goto('https://github.com');\n\
  \  await expect(page).toHaveTitle(/GitHub/);\n});\n```\n\n`test.describe.configure()`\
  \ 允许你配置 `test.describe()` 块内部测试的运行方式。虽然在示例中我们的测试没有封装在 `test.describe()` 块中，但此配置仍然影响整个测试文件。它确保每个测试都可以并发运行。\n\
  \n只需记住，运行过多的并行上下文可能会消耗系统的内存或文件描述符，因此平衡并行程度与你的拥资源是一个好主意。\n\n## 在全并行模式下运行所有 Playwright\
  \ 测试\n\n默认情况下，Playwright 并行运行测试文件，但每个文件中的测试在同一个工作线程进程中一个接一个运行。如果你想让所有文件的所有测试同时运行，可以在配置中设置\
  \ `fullyParallel: true`。\n\n```javascript\n// playwright.config.ts\nimport { defineConfig\
  \ } from '@playwright/test';\nexport default defineConfig({\n  fullyParallel: true,\n\
  });\n```\n\n如果你在特定项目中设置了 `fullyParallel: true`，它将仅影响该项目：\n\n```javascript\n// playwright.config.ts\n\
  export default defineConfig({\n  projects: [\n    {\n      name: 'chromium',\n \
  \     fullyParallel: true,\n    },\n  ],\n});\n```\n\n## 分片（拆分你的测试）\n\n如果你的团队在多个\
  \ CI 机器上运行测试，你可以通过将测试套件拆分成块来加速。这被称为分片（sharding）。Playwright 通过 `--shard=X/Y` 标记使其变得简单。\n\
  \n假设有两个运行器（Runner A 和 Runner B）。你可以这样划分测试套件：\n\n*   Runner A:\n    ```bash\n   \
  \ npx playwright test --shard=1/2\n    ```\n*   Runner B:\n    ```bash\n    npx\
  \ playwright test --shard=2/2\n    ```\n\nPlaywright 将自动将总测试文件分成等份，并为每个运行器分配部分。在每个分片内部，它仍将使用配置的工作线程并行运行测试。例如：\n\
  \n*   你有 40 个测试文件\n*   Runner A (`--shard=1/2`) 运行第 1–20 个文件\n*   Runner B (`--shard=2/2`)\
  \ 运行第 21–40 个文件\n*   每个运行器仍可以使用，例如四个工作线程来处理分配的文件\n\n你也可以在 `projects` 数组下或直接在配置中添加\
  \ `shard` 字段。`shard` 设置包含两个字段：`total` 和 `current`。\n\n```javascript\n// playwright.config.ts\n\
  import { defineConfig } from '@playwright/test';\nexport default defineConfig({\n\
  \  shard: {\n    total: 3,      // 总分片数\n    current: 1,    // 当前分片实例\n  },\n});\n\
  ```\n\n`current` 字段指定该 Playwright 进程应该运行哪个分片。`current` 的值从 `1` 开始，因此 `current: 1`\
  \ 代表第一个分片，`current: 2` 代表第二个分片，依此类推。每个分片将获得不同的测试文件子集，所有分片共同覆盖整个测试套件。\n\n\n\n假设你有\
  \ 300 个测试用例，并且将它们分散在 3 台机器上运行：\n\n* 机器 1 配置：\n```json\nshard: { total: 3, current:\
  \ 1 }\n```\n* 机器 2 配置：\n```json\nshard: { total: 3, current: 2 }\n```\n* 机器 3 配置：\n\
  ```json\nshard: { total: 3, current: 3 }\n```\n\n因此，每台机器运行约 100 个测试。\n\n当你有大量的测试文件时，`sharding`（分片）可以帮助你更快地运行整个套件。这是缩短测试时间（甚至缩短一半以上）并保持流水线快速运行的好方法。\n\
  \n## 调优并行性\n\n在决定运行多少个 worker 或并行执行多少测试时，平衡 CPU 和内存的使用非常重要。在内存有限的机器上启动过多的 worker\
  \ 可能会导致抖动甚至出现 `out of memory` (`OOM`) 错误。一个好的起点是通过程序化获取 CPU 核心数：\n\n```javascript\n\
  // playwright.config.js\nconst { defineConfig } = require('@playwright/test');\n\
  const os = require('os');\nconst cpuCount = os.cpus().length;\nmodule.exports =\
  \ defineConfig({\n  workers: Math.max(1, cpuCount - 1),\n  // other config options...\n\
  });\n```\n\n这段代码首先导入了 Node.js 内置的 `os` 模块，它可以提供有关系统的有用信息。然后它使用 `os.cpus()` 来查找你的机器有多少个逻辑\
  \ CPU 核心。例如，如果你有一个带有超线程的多内核 CPU，它可能会显示八个核心，因为每个物理核心显示为两个逻辑核心。\n\n接下来，它使用 `Math.max(1,\
  \ cpuCount - 1)` 计算测试 worker 的数量。换句话说，Playwright 将比 CPU 核心总数少一个的 worker 并运行测试，始终保留至少一个运行\
  \ worker。这与将 worker 数量设置为 `undefined` 并让 Playwright 为你做决定相似。\n\n减一的目的是避免完全耗尽机器的\
  \ CPU。运行过多的进程会降低速度或导致系统不稳定，特别是在高负载测试期间。得益于并行处理，你将获得更快的测试速度，而不会让你的计算机过载。\n\n从这里开始，在测试运行期间密切关注\
  \ CPU 和内存的使用。如果你发现 CPU 达到上限或内存紧张，减少 worker 的数量以保持运行顺畅是一个好主意。\n\n并行运行测试也给测试隔离带来了一些新挑战。由于多个\
  \ worker 将同时执行测试，你需要确保它们没有向同一个文件、数据库行或任何其他共享资源写入数据。否则，你可能会面临竞态条件和测试结果不稳定（flaky）。\n\
  \n如前所述，Playwright 将测试文件分发到 worker 中，但单个文件内的测试仍将串行运行。如果你选择在文件内部并行运行测试（使用 `test.describe.parallel`），请注意系统限制：一次启动过多的浏览器上下文可能会迅速耗尽文件描述符或内存。\n\
  \n如果你有一些特别缓慢的 `end-to-end` (`E2E`) 测试，考虑将它们放在单独的文件夹中或用自定义注解标记它们（例如 `@slow` 或 `@e2e`），这样你就可以用较少的\
  \ worker 运行它们：\n\n```bash\n# 单元测试（50 个文件，短时间）\nnpx playwright test tests/unit --workers=8\n\
  # 慢速 E2E 测试（5–10 个文件，较长时间）\nnpx playwright test tests/e2e --workers=2\n```\n\n如果你的测试是\
  \ CPU 密集型的，增加更多 worker 可能帮助不大：你最终只会争抢 CPU 时间。相反，如果你的测试大部分在等待网络或服务器响应（I/O 密集型），通常可以运行更多\
  \ worker 而不会让 CPU 过载。\n\n如果你有一个需要更多运行时间的测试（可能正在处理网络请求、数据库操作或动画），你可以使用 `test.slow()`\
  \ 方法来提供帮助。\n\n调用 `test.slow()` 会告诉测试运行器通过增加倍超时时间给该测试提供额外时间，这样它就不会仅仅因为比平时长而失败。\n\n\
  你可以通过两种方式使用 `test.slow()`：针对单个测试或针对整个测试套件。对于单个测试，只需在测试函数内部调用 `test.slow()`，如下所示：\n\
  \n```javascript\nimport { test, expect } from '@playwright/test';\n// 快速测试\ntest('quick\
  \ test', async ({ page }) => {\n  await page.goto('https://google.com');\n  await\
  \ expect(page).toHaveTitle('Google');\n});\n// 慢速测试\ntest('very slow test', async\
  \ ({ page }) => {\n  test.slow(); // 标记此测试为慢速\n// 模拟长时间运行测试（1 分钟）\n  await page.waitForTimeout(60000);\n\
  });\n```\n\n另一个选项是在 `describe` 块内调用 `test.slow()` 将整个测试套件标记为慢速。这样，该套件中的所有测试都将被自动视为慢速。\n\
  \n你还可以为标记测试为慢速添加自定义原因，例如 `test.slow(true, 'Waiting for long API response')`。这对于调试或保持日志信息丰富很有帮助。\n\
  \n记住，在大型测试套中，如果某些测试运行时间很长，可能会“阻塞”或延迟其他测试的启动，特别是当你并行运行测试时。\n\n\n\n\n## 复用浏览器实例和上下文\n\
  \n提高速度和节省资源的最简单方法之一是避免在每次访问页面时都启动全新的浏览器。相反，你可以启动一次浏览器，然后根据需要在此内部创建新的上下文（contexts）和页面（pages）。\n\
  \n例如，与其编写一个为每个 URL 调用 `chromium.launch()` 的循环，你可以在脚本开始时启动一次浏览器，然后为每次页面访问打开新的上下文。这可以消除每次启动新浏览器进程时带来的延迟和高内存占用。\n\
  \n以下是**不应该**这样做的做法：\n\n```\n// 反模式：\nfor (const url of urls) {\n  const browser\
  \ = await chromium.launch();\n  const context = await browser.newContext();\n  const\
  \ page = await context.newPage();\n  await page.goto(url);\n  // ...\nawait browser.close();\n\
  }\n```\n\n相反，请尝试这种方法：\n\n```\n// 推荐做法：\nconst browser = await chromium.launch();\n\
  for (const url of urls) {\n  const context = await browser.newContext();\n  const\
  \ page = await context.newPage();\n  await page.goto(url);\n  // 执行你的检查...\nawait\
  \ context.close();\n}\nawait browser.close();\n```\n\n虽然每个 `browser.newContext()`\
  \ 方法仍然会使用一些内存（因为它创建了新的配置文件和浏览器状态），但它比每次启动一个完整的浏览器进程要轻得多。此外，在完成后关闭每个上下文有助于快速释放内存和磁盘空间。\n\
  \n## 阻塞或存根必要的网络请求\n\n默认情况下，Playwright 的每个页面都会加载网页引用的所有资源，但你的测试并不总是需要所有内容。Playwright\
  \ 允许你通过其页面路由（page routing）功能来拦截和控制网络流量。这让你能够根据需要阻塞、修改或模拟网络请求。\n\n例如，如果你的测试只是检查文本内容或验证特定的\
  \ API 调用，你可以跳过加载 `.png`、`.jpeg`、`.svg` 等图像格式：\n\n```\nawait page.route('**/*.{png,jpg,jpeg,svg,gif}',\
  \ (route) => route.abort());\n```\n\n或者，如果你想更有针对性，可以阻塞指向特定域名的请求，例如 `ads` 或 `analytics`：\n\
  \n```\nawait page.route('**/ads.googleads.com/**', (route) => route.abort());\n\
  await page.route('**/analytics.googleads.net/**', (route) => route.abort());\n```\n\
  \n像这样阻塞不必要的请求可以减少 CPU 负载，因为浏览器不需要解码大型图像文件，通过不为图像分配纹理来节省内存，并通过消除可能缓慢的第三方请求来加速导航。\n\
  \n你还可以更进一步，模拟网络响应。通过 Playwright 的路由拦截，你可以为 API 调用“伪造”响应，这在你你不希望依赖于实时后端时非常有用。例如，以下是你可以如何存根（stub）`/api/user/profile`\
  \ 调用：\n\n```\nawait page.route('**/api/user/profile', (route) => {\n  route.fulfill({\n\
  \    status: 200,\n    contentType: 'application/json',\n    body: JSON.stringify({\
  \ name: 'Test User', id: 123 }),\n  });\n});\n```\n\n这个技巧对于涉及多个 API 调用的测试特别有用：它有助于确保测试结果的一致性，避免给测试服务器带来额外负载，并可以大幅加快测试运行速度。\n\
  \n要查看 Playwright 中页面路由的全面概述，请查看此处的官方文档：[`playwright.dev/docs/api/class-route`](https://playwright.dev/docs/api/class-route)。\n\
  \n## 限制重量产物：截图、视频和跟踪\n\n截图、视频和性能跟踪对于调试测试失败极其有用，但为每个测试都保存它们会迅速消耗磁盘空间并减慢你的测试。你可以配置\
  \ Playwright 仅在需要时捕获这些产物，例如当测试失败或重试时。\n\n一个很好的起点是这样设置配置：\n\n```\ntest.use({\n  trace:\
  \ 'on-first-retry',\n  screenshot: 'only-on-failure',\n  video: 'retain-on-failure',\n\
  });\n```\n\n通过这种设置，当出现问题时，你仍然会获得所有丰富的调试数据，但你的存储空间不会被通过测试的大文件填满。\n\n如果你想在特定测试中捕获产物（例如一次性截图），仍然可以轻松做到：\n\
  \n```\nawait page.screenshot({ path: `screenshots/test-A-${Date.now()}.png`, fullPage:\
  \ false });\n```\n\n当然，如果你确实需要每个测试的视频（可能出于合规性原因或客户演示），你完全可以这样做。只需注意性能：降低视频分辨率、在具有快速磁盘\
  \ I/O 的容器中运行，或调整录制间隔以保持运行顺畅，即使生成大量的 `.webm` 文件也是如此。\n\n现在，让我们看看监控网页的资源使用如何帮助尽早发现性能问题。\n\
  \n# 测量和监控资源使用\n\n虽然 Playwright 并没有开箱生成资源使用报告，但它为你提供了收集有价值的指标所需的一切，就像你在真实浏览器中执行的那样。你可以利用浏览器性能\
  \ API、为基于 Chromium 的浏览器使用 `Chrome DevTools Protocol` (`CDP`)，并利用 Playwright 的内置工具，如\
  \ `page.evaluate`、CDP 会话、网络事件监听器和跟踪（tracing）。\n\n资源跟踪如何可以提供帮助：\n\n*   如果新更改意外添加了内存泄漏或使你的脚本变成\
  \ CPU 密集型，监控性能的测试会在影响用户之前捕获它。\n*   Playwright 允许你模拟各种场景，例如低端移动设备或慢网络。\n*   你可以设置阈值，例如将\
  \ Largest Contentful Paint 保持在 2 秒内，并编写在超过这些限制时失败的测试。这有助于在应用程序演进时保持性能。\n\n接下来。\n\
  \n## 使用内置浏览器性能 API\n\n现代浏览器为我们提供了一组用的性能 API（例如 `Navigation Timing`、`Resource Timing`、`Paint\
  \ Timing`、`Memory` 和 `Web Vitals`），我们可以直接从 JavaScript 访问它们。通过 Playwright 的 `page.evaluate`\
  \ 方法，你可以直接在浏览器文中运行这些调用，并返回原始性能数据进行分析。\n\n### 导航和资源计时\n\n`Navigation Timing API`\
  \ 提供了页面加载每个阶段的详细时间戳：从 `域名系统` (`DNS`) 查找到 `传输控制协议` (`TCP`) 握手，再到 `文档对象模型` (`DOM`)\
  \ 处理。\n\n你可以这样提取这些数据：\n\n```\nimport { test } from '@playwright/test';\ntest('Measure\
  \ navigation timings', async ({ page }) => {\n  await page.goto('https://playwright.dev/');\n\
  \  // 等待页面完全加载\nawait page.waitForLoadState('load');\n  // 提取导航计时指标\nconst timing\
  \ = await page.evaluate(() => {\n    const navEntry = performance.getEntriesByType('navigation')[0];\n\
  \    return {\n      startTime: navEntry.startTime,\n      connectEnd: navEntry.connectEnd,\n\
  \      domContentLoaded: navEntry.domContentLoadedEventEnd,\n      loadTime: navEntry.loadEventEnd\
  \ - navEntry.startTime,\n    };\n  });\n  // 记录计时情况（如果你想，也可以可以在这里添加断言）\nconsole.log('Navigation\
  \ timings:', timing);\n  // 示例断言：确保 loadTime 小于 5 秒\n// expect(timing.loadTime).toBeLessThan(5000);\n\
  });\n```\n\n这些数字让你清晰地看到页面加载的每个部分花费了多久，这对于识别瓶颈很有帮助：\n\n*   `startTime`: 导航开始的时间\n\
  \n*   `connectEnd`: 连接服务器完成的时间（包括 DNS 和 TCP 握手）\n\n*   `domContentLoaded`: `DOMContentLoaded`\
  \ 事件触发完成的时间（意味着初始 HTML 已完全加载并解析）\n\n\n\n\n\n*   `loadTime`: 页面加载总时间\n\n同样，`Resource\
  \ Timing API` 允许你查看每个资源（图像、脚本、样式表等）开始和完成下载的时间，以及它们的大小：\n\n```\nconst resources =\
  \ await page.evaluate(() => {\n  return performance.getEntriesByType('resource').map(r\
  \ => ({\n    name: r.name,\n    startTime: r.startTime,\n    duration: r.duration,\n\
  \    decodedBodySize: r.decodedBodySize,\n    transferSize: r.transferSize, \n \
  \ }));\n});\nconsole.log('Resource timings:', resources);\n```\n\n这段代码构建并返回了一个包含五个关键指标的对象：\n\
  \n*   `name`: 资源 URL\n*   `startTime`: 资源开始加载的时间\n*   `duration`: 加载耗时\n*   `decodedBodySize`:\
  \ 资源的未压缩大小\n*   `transferSize`: 通过网络传输的实际大小\n\n这可以帮你快速发现可能拖慢加载速度的大型或加载缓慢的资产。\n\n\
  ### 绘制计时与 Web 核心指标 (Paint timing and web vitals)\n\n绘制计时（Paint timing）能让你深入了解网页对用户而言加载的速度和流畅度。两个起始关注的关键指标是“首次绘制”（First\
  \ Paint）和“首次内容绘制”（First Contentful Paint, FCP）。它们告诉你浏览器何时开始在屏幕上绘制任何内容，以及何时显示出第一个实际内容。你可以使用\
  \ `Paint Timing API` 来捕获它们：\n\n```\nimport { test } from '@playwright/test';\ntest('Measure\
  \ paint timings', async ({ page }) => {\n  await page.goto('https://playwright.dev/');\n\
  \  const paintMetrics = await page.evaluate(() => {\n    const paintEntries = performance.getEntriesByType('paint');\n\
  \    return paintEntries.map(e => ({\n      name: e.name,\n      startTime: e.startTime,\n\
  \    }));\n  });\n  console.log('Paint timings:', paintMetrics);\n});\n```\n\n这有助于你理解页面多快开始向用户显示有用内容。\n\
  \n为了获得更深层的洞察，诸如“最大内容绘制”（Largest Contentful Paint, LCP）和“累计布局偏移”（Cumulative Layout\
  \ Shift, CLS）等指标非常有帮助。这些指标超越了初始绘制，告诉你最大的内容何时完成加载，以及在加载过程中是否发生了任何令人恼的布局偏移。\n\n跟踪\
  \ LCP 需要更多的工作：你可以在页面内部使用 `PerformanceObserver` API 来监听 `largest-contentful-paint`\
  \ 事件。观察器会跟踪最新的 LCP 值并将其存储在一个简单的全局函数（`window.__lcp`）中，你稍后导航完成后调用它来获取结果。\n\n这里是一个跟踪\
  \ LCP 的示例：\n\n```\nimport { test, expect } from '@playwright/test';\ntest('measure\
  \ LCP on google.com', async ({ page }) => {\n  // 在导航*之前*注入 LCP 观察器\nawait page.addInitScript(()\
  \ => {\n    let lcp;\n    new PerformanceObserver((entries) => {\n      entries.getEntries().forEach((e)\
  \ => {\n        lcp = e.startTime;\n      });\n    }).observe({ type: 'largest-contentful-paint',\
  \ buffered: true });\n    window.__lcp = () => lcp;\n  });\n  await page.goto('https://www.google.com',\
  \ { waitUntil: 'load' });\n  // 等待一会儿让绘制完成\nawait page.waitForTimeout(3000);\n \
  \ // 读取 LCP 值\nconst lcpValue = await page.evaluate(() => window.__lcp());\n  console.log('Largest\
  \ Contentful Paint:', lcpValue, 'ms');\n  // 良好的 LCP <= 2s\nexpect(lcpValue).toBeLessThanOrEqual(2000);\n\
  });\n```\n\n该脚本的核心是使用 `page.addInitScript`。该命令在页面本身开始加载之前，向页面环境注入 JavaScript 代码段。此注入的脚本设置了\
  \ `PerformanceObserver`，这是一种用于监听性能事件的标准浏览器 API。通过尽早设置它，脚本保证了在页面加载过程中何时发生 `largest-contentful-paint`\
  \ 事件，都能捕获到它。观察器将 LCP 时间存储在全局窗口变量 `window.__lcp` 中，以便稍后访问。\n\n在导航到 Google 并等待几秒让页面完全渲染后，测试获取捕获到的\
  \ LCP 值。关注这些绘制和布局指标是有价值的，因为它们突出了用户体验中真正重要的部分：页面的感觉有多快以及看起来有多稳定。没有人喜欢在尝试阅读时加载缓慢或不断跳动的网站。\n\
  \n如果你测试的页面执行了重定向（例如，`amazon.com` 重定向到区域域名），请指定最终目标 URL 或禁用重定向以确保 LCP 测量准确。\n\n###\
  \ 内存占用\n\n在 Chrome 或基于 Chromium 的浏览器中，你可以通过 `window.performance.memory` 对象检查 JavaScript\
  \ 堆内存统计。这个实用的对象提供了关于 JavaScript 引擎使用了多少内存的详细信息。例如，`usedJSHeapSize` 告诉你有 JavaScript\
  \ 堆当前使用了多少，而 `totalJSHeapSize` 显示了分配的总大小。\n\n如果你想通过程序获取这些信息，这里有一个你可以使用的简单脚本：\n\n\
  ```\nconst memoryUsage = await page.evaluate(() => {\n  return performance.memory\n\
  \    ? {\n        usedJSHeap: performance.memory.usedJSHeapSize,\n        totalJSHeap:\
  \ performance.memory.totalJSHeapSize,\n      }\n    : null;\n});\nconsole.log('Memory\
  \ usage:', memoryUsage);\n```\n\n这段代码检查 `performance.memory` 是否可用。如果是，它返回一个包含当前和总堆大小的对象；如果不是，则简单地返回\
  \ `null`。请记住，`performance.memory` 是非标准 API，通常仅在 Chromium 浏览器（如 Chrome）中工作。\n\n###\
  \ 通过 ChromeTools Protocol (CDP) 采集指标\n\n通过 `ChromeTools Protocol` (`CDP`) 采集性能指标可以让你深入查看浏览器内部，查看页面\
  \ API 无法显示的内容。在基于 Chromium 的浏览器（如 Chrome 或 Edge）中，Playwright 的 `newCDPSession` 对象可以轻松建立直接通信链路。\n\
  \n这让你能够访问详细的性能和网络数据，例如 CPU 限制。\n\n启动非常简单：首先，启动 Chromium 实例并创建浏览器上下文和页面。然后使用 `newCDPSession`\
  \ 创建一个绑定于页面的会话。一旦连接，你可以使用 `Performance.enable` 和 `Network.enable` 启用 `Performance`\
  \ 和 `Network` 域：\n\n```\nimport { test } from '@playwright/test';\ntest('Collect\
  \ performance metrics with throttling', async ({ browser }) => {\n  const context\
  \ = await browser.newContext();\n  const page = await context.newPage();\n  //为此页面创建\
  \ CDP 会话:\nconst session = await context.newCDPSession(page);\n  await session.send('Performance.enable');\n\
  \  await session.send('Network.enable');\n  // 可选限制网络和 CPU:\nawait session.send('Network.emulateNetworkConditions',\
  \ {\n    offline: false,\n    latency: 100,               // ms\n    downloadThroughput:\
  \ 75000,  // 字节/秒\n    uploadThroughput: 25000,\n  });\n  await session.send('Emulation.setCPUThrottlingRate',\
  \ { rate: 4 }); // 模拟慢 4 倍的 CPU\n// 导航并等待加载:\nawait page.goto('https://playwright.dev');\n\
  \  // 获取性能指标:\nconst metricsResponse = await session.send('Performance.getMetrics');\n\
  \  console.log('CDP Performance metrics:', metricsResponse.metrics);\n  await context.close();\n\
  });\n```\n\n这开始了丰富指标的采集，例如 `DOMContentLoaded` 何时触发、`FirstMeaningfulPaint` 何时发生、CPU\
  \ 使用模式等。你甚至可以调整网络条件，以查看网站在慢速连接用户上的表现。\n\n\n\n\n\nCDP 会话最酷的功能之一是能够模拟不同的性能场景。通过 `Network.emulateNetworkConditions`，你可以模拟网络延迟或限制带宽，这非常适合在移动端或低带宽条件下进行测试。同样，`Emulation.setCPUThrottlingRate`\
  \ 允许你人为减慢 CPU 性能以模拟性能较弱的设备（例如，应用 4 倍减速来模拟旧款智能手机）。在好这些条件后，你只需导航到目标 URL 并等待页面加载即可。\n\
  \n一旦页面就绪，你可以使用 `Performance.getMetrics` 获取收集到的性能数据。浏览器返回一个指标数组，每个指标都包含名称和值。这些指标通常包括\
  \ `Timestamp`（当前时间）、`Documents` 和 `Frames`（打开的文档和帧的数量）、`JSEventListeners`（活跃的事件监听器）、`Nodes`（DOM\
  \ 节点计数）、`LayoutCount` 和 `RecalcStyleCount`（布局和样式重新计算次数）、`ScriptDuration`（JavaScript\
  \ 执行时间）、`TaskDuration`（主线程任务时间）以及内存使用详情，如 `JSHeapUsedSize` 和 `JSHeapTotalSize`。\n\
  \n通过深入研究这些数字，你可以获得有关网站性能的宝贵见解，例如：\n\n* 将 `JSHeapUsedSize` 除以 `JSHeapTotalSize` 以估算当前内存占用\n\
  * 查看 `TaskDuration` 以理解主线程有多忙碌\n* 检查 `ScriptDuration` 以查看运行 JavaScript 花费了多少时间\n\
  *set `Nodes` 和 `RecalcStyleCount` 以评估 DOM 复杂度以及触发样式重新计算的频率\n\n因此，CDP 会话为你提供了一种灵活的方法来自动化性能测试和分析。你可以模拟各种现实场景并收集详细指标，这些指标将帮助指导你的优化工作并提供更好的用户体验。\n\
  \n## 监听网络事件以获取资源级数据\n\n在自动化浏览器时监听网络事件是捕捉页面发出的每个网络请求详细数据的极佳方法。如果你想确切知道每个请求耗时多长时间以及响应有多大，可以使用\
  \ `page` 对象提供的 `requestfinished` 事件。每当网络请求完全完成（意味着已接收到整个响应）时，该事件就会触发。\n\n要设置此功能，你可以从一个名为\
  \ `networkRequests` 的简单数组开始，存储每个请求的信息。然后，为 `page.on('requestfinished')` 添加事件监听器。在事件处理程序内部，你可以通过调用\
  \ `await request.response()` 获取完成请求的 `response` 对象。该对象提供了有用细节，例如计时信息和响应标头：\n\n```\n\
  import { test, expect } from '@playwright/test';\ntest('Capture network request\
  \ details', async ({ page }) => {\n  // Store network request data\n  const networkRequests\
  \ = [];\n  // Listen for requestfinished event\n  page.on('requestfinished', async\
  \ (request) => {\n    const response = await request.response();\n    const timing\
  \ = request.timing();\n\n    networkRequests.push({\n      url: request.url(),\n\
  \      method: request.method(),\n      resourceType: request.resourceType(),\n\
  \      status: response?.status(),\n      responseSize: (await response?.body())?.length\
  \ || 0,\n      duration: timing.responseEnd - timing.requestStart,\n      startTime:\
  \ timing.startTime\n    });\n  });\n  // Navigate to the test page\n  await page.goto('https://playwright.dev/');\n\
  \  // Wait for page to load completely\n  await page.waitForLoadState('networkidle');\n\
  \  // Log collected network requests\n  console.log('Network Requests:', networkRequests);\n\
  \  // Basic assertion to verify page loaded\n  await expect(page).toHaveTitle(/Playwright/);\n\
  \  // Example assertions for network requests\n  expect(networkRequests.length).toBeGreaterThan(0);\n\
  \  expect(networkRequests.some(req => req.status === 200)).toBe(true);\n});\n```\n\
  \n一旦页面完全加载（通常在调用 `page.goto()` 之后），你就可以检查 `requests` 数组以查看收集的所有数据。`networkRequests.push({...})`\
  \ 帮助你创建测试运行期间网络上发生的所有事件的详细日志。每当网络请求完成时，其关键细节就会被捕获并以结构整齐的对象添加到 `networkRequests`\
  \ 数组中。\n\n让我们来看看添加到每个对象中的属性：\n\n* `url: request.url()`：获取网络请求的完整 URL。\n* `method:\
  \ request.method()`：获取请求请求使用的 HTTP 方法（例如 `GET`、`POST` 或 `PUT`）。\n* `resourceType:\
  \ request.resourceType()`：识别所请求的资源类型（例如 `document`、`stylesheet`、`image`、`script`\
  \ 或 `fetch`）。\n* `status: response?.status()`：获取响应的 HTTP 状态码（例如表示 OK 的 `200` 和表示未找到的\
  \ `404`）。使用 `?` 字符（可选链）是因为在某些边缘情况下响应可能是 `null`（尽管在 `requestfinished` 中不常见）。\n* `responseSize:\
  \ (await response?.body())?.length || 0`：\n    * `await response?.body()`：异步获取响应的原始正文\n\
  \    * `.length`：获取字节字节响应体的大小\n    * `|| 0`：如果响应体为 `null` 或 `undefined`，则提供默认值 `0`\n\
  * `duration: timing.responseEnd - timing.requestStart`：计算请求从开始到响应结束的持续时间。\n* `startTime:\
  \ timing.startTime`：记录请求开始的精确时间戳。\n\n## 利用 Playwright 追踪进行深度分析\n\nPlaywright 追踪不仅仅是捕捉测试日志或截图：它提供了一个交互式跟踪文件，帮助你真正理解自动化测试期间应用程序发生了什么。追踪记录了一系列快照、跟踪网络活动、捕捉控制台日志、监控\
  \ DOM 变化，并在测试运行期间包含录制。\n\n你通常在测试开始或想要检查的部分启动追踪，并在关键交互完成后停止。这将生成一个 `.zip` 跟踪文件，你可以用\
  \ Playwright 的 Trace Viewer 打开它。查看器提供了一个易于导航的时间轴和每个步骤的视觉回放，让你回溯并探索状态随时间的变化。\n\n\
  在你的 `playwright.config.ts` 文件中配置追踪非常简单：\n\n```\nimport { defineConfig } from '@playwright/test';\n\
  export default defineConfig({\n  use: {\n    trace: 'on-first-retry', //  'on',\
  \ 'off', 'retain-on-failure', 'on-first-retry'\n  },\n});\n```\n\n追踪选项包括：\n\n* `'on'`：为每个测试记录追踪。当你正在调试或开发测试时非常有用，但会产生巨大的跟踪文件。\n\
  * `'off'`：禁用追踪（默认）。不生成跟踪文件。\n* `'retain-on-failure'`：记录所有测试的追踪，但仅为失败的测试保存。在调试信息和存储使用之间取得了良好平衡。\n\
  * `'on-first-retry'`：仅在失败测试的第一次重试时记录追踪。建议在 CI 环境中使用，以减少存储，同时仍为易性测试捕捉有用的调试信息。\n\n\
  \n\n\n你也可以在从命令行运行测试时动态开启追踪（tracing）：\n\n```\nnpx playwright test --trace on\n```\n\
  \n当你想要临时启用追踪而又不想修改配置文件时，这种方法非常有用。\n\n或者，你可以像这样在测试文件中启用追踪录制：\n\n```javascript\nimport\
  \ { test } from '@playwright/test';\ntest.use({ trace: 'on' }); // 或 'retain-on-failure'\
  \ 等\ntest('test', async ({ page }) => {\n  // 在此处编写你的测试步骤\n});\n```\n\n运行测试后，Playwright\
  \ 会生成追踪文件，通常存储在以下位置：\n\n```\n./test-results/<test-name>/trace.zip\n```\n\n你可以通过运行以下命令来打开追踪查看器（Trace\
  \ Viewer）：\n\n```\nnpx playwright show-trace test-results/test-name/trace.zip\n\
  ```\n\n这将在你的浏览器中启动一个交互式的 Trace Viewer。\n\n如果你正在使用 Playwright Test 和 HTML 报告，报告本身将为每个测试提供\
  \ `Show Trace` 链接（如果录制了追踪）。因此，你也可以通过运行以下命令来打开追踪查看器：\n\n```bash\nnpx playwright show-report\n\
  ```\n\n然后，点击目标测试上的 `Show Trace`。\n\n![图 6.1: Playwright Trace Viewer](img/B34148_061.png)\n\
  \n图 6.1: Playwright Trace Viewer\n\n追踪在 CI 环境中特别有用。在 CI 中调试失败的测试可能很棘手，但保存追踪产物（artifact）可以让你在保留所有上下文的情况下在本地复现问题。追踪查看器可以轻松回答这类问题，例如：*哪个\
  \ API 请求失败了？* *按钮实际上可以点击吗？* *在渲染过程中是否发生了什么异常情况？*\n\n请有策略地使用追踪。它会增加一些开销并产生较大的追踪文件，因此最好是针对易失败的测试（flaky\
  \ tests）、重要的用户流程或集中的性能分析会议选择性地启用。许多团队选择仅在测试失败时启用追踪，这样他们就可以捕捉宝贵的调试信息，而不会减慢每次测试运行。\n\
  \n如果你更倾向于更高层次的抽象，`playwright-performance-metrics` ([`github.com/Valiantsin2021/playwright-performance-metrics`](https://github.com/Valiantsin2021/playwright-performance-metrics))\
  \ 自动化了在 Playwright 测试中捕获网页指标（web vitals）、资源计时和 `core web vitals` 的大部分工作。核心网页指标是\
  \ Google 用于衡量网站用户体验优劣的一系列关键指标。它们关注页面加载速度、对用户操作的响应速度，以及在加载期间布局看起来看起来有多稳定。\n\n该插件内部使用\
  \ CDP 的 `Performance` 和 `Resource Timing` 域来收集如下信息：\n\n* FCP\n* LCP\n* `Total Blocking\
  \ Time` (`TBT`)\n* CLS\n* 总下载字节数\n* 详细的每个资源计时\n\n从性能的角度来看，追踪可以帮助你发现应用中的缓慢区域。你可以检查录制的时间轴，准确地看到时间花在了哪里，无论是在等待服务器响应、执行\
  \ `JavaScript` 还是在客户端进行渲染。这种洞察可以指导优化工作，例如懒加载资源或提高脚本性能。\n\n总的来说，追踪是一项无价的工具，它不仅简化了调试，还对你的应用行为和性能提供了深度见解。\n\
  \n# 总结\n\n在本章中，我们探索了 Playwright 内置的并行功能和智能性能优化如何帮助你更快速、更高效地运行测试。我们看了如何管理工作进程（workers）、在文件内部以及之间并行运行测试，以及分片（shard）测试套件以充分利用\
  \ CI 机器。\n\n我们还讨论了避免常见性能陷的实用方法，例如复用浏览器和上下文、阻塞不必要的网络请求，以及控制生成的产物（截图、视频和追踪）数量。最后，我们看到了如何跟踪和测量资源使用情况，以便及早发现性能问题并保持应用运行顺畅。\n\
  \n通过这些技术，你将加快测试运行速度并使其更易维护。Playwright 为你提供了所需的所有工具，以保持测试的快速和反馈循环的紧凑。在下一章中，我们将讨论如何使用\
  \ GitHub Actions 将 Playwright 测试集成到 CI/CD 工作流中。\n\n## 获取本书 PDF 版本和独家额外\n\n扫描二维码（或访问\
  \ [packtpub.com/unlock](https://packtpub.com/unlock)）。按书名搜索本书，确认版本，然后按照页面上的步骤操作。\
  \ | ![](img/Unlock-01.png)![](img/Unlock.png) |\n\n| `Note`: 请留好发票。直接从 Packt 购买不需要发票。\
  \ |\n\n# 7 将工作流集成到 CI/CD 流水线\n\n发布软件可能会带来压力。Bug 会溜入，事情在最后一刻出错，将代码从笔记本电脑传到生产环境就像在玩杂耍。这就是\
  \ CI/CD 的用用场。CI/CD 是持续集成/持续部署（Continuous Integration/Continuous Deployment），有助于通过自动化测试和部署来减轻软件交付的压力。\n\
  \n在本章中，我们将探索 CI/CD 流水线如何极大增强你的工作流，特别是当与 Playwright 等自动化测试工具配合使用时。你将学习如何设置 GitHub\
  \ Actions 以在每次推送代码时运行测试、生成你可以实际使用的的报告，甚至只需点击几次即可将其发布到网上。我们还将涉及使用 `Docker` 创建一致的测试环境，无论你是在笔记本电脑上还是云端，这些环境的工作方式都是相同的。\n\
  \n到结束时，你将拥有构建自动化流水线所需的所有内容，帮助你及早发现 Bug、更快地发布更新，并睡得更安稳。\n\n因此，我们将涵盖以下主要主题：\n\n* 拥抱\
  \ CI/CD 实现更快、更安全的交付\n* 使用 GitHub Actions\n* 处理报告和产物\n* 使用矩阵构建在多个浏览器和操作系统上运行测试\n\
  * 使用 Docker 创建一致的测试环境\n\n## 技术要求\n\n对于本章你需要：\n\n* 一个已启动的 Playwright 项目\n* 基础 `GitHub`\
  \ 知识\n\n本章的源代码位于 [`github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright/tree/Chapter07`](https://github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright/tree/Chapter07)。#\
  \ 拥抱 CI/CD 实现更快、更安全的交付\n\n在本节中，我们将探索为什么 CI/CD 非常重要、自动化测试如何确保发布安全，以及实现这一切的一些流行平台。\n\
  \n## CI/CD 在现代软件开发中的重要性\n\n通过持续集成（`CI`），每当提交代码时，都会自动构建、测试和验证。这意味着 Bug 和集成问题会被及早发现，而不是变成更大的问题。你还会获得即时反馈，从而节省了原本用于手动测试或修复混乱代码冲突的时间。因此，团队可以轻松处理每天几十甚至数百次代码更改，同时保持产品的稳定可靠。\n\
  \n持续部署（`CD`）更进一步，将每次成功的构建自动推送到测试环境甚至生产环境。不需要等待几周或几个月来发布，新功能和修复可以在几小时或几分钟内上线。这种灵活性使团队能够快速响应用户反馈，及时解决紧急\
  \ Bug，并在真实环境中尝试新想法。整个开发过程变得更具活性，帮助你关注真正重要的事情：为用户交付价值。\n\n\n\n\n通过将自动化测试直接构建到您的 CI/CD\
  \ 流线中，每次代码更改（无论多小）都会触发一系列检查。这些检查将确认一切运行符合预期，防止旧 Bug 重新出现，并确保新功能与现有系统良好兼容。\n\n这种持续的反馈有助于在问题发生时立即捕获（此时修复最容易且成本最低），而不是在发布周期的后期，或者更糟糕——在生产环境中发现。\n\
  \n自动化测试还让团队对部署过程拥有真正的信心。当每次合并或拉取请求（pull request）自动通过全套单元测试、集成测试和端到端测试时，开发者可以快速识别出哪些更改导致构建失败，并做出相应的响应（无论是回滚还是应用快速补丁）。这种快速的反馈循环不仅加快了开发速度，还促进了问责文化：每个人都知道自己的代码正面临一致的质量标准。因此，团队可以安全地每天部署多次、尝试新想法并不断改进功能，而无担心担心系统。\n\
  \n## 常见的 CI/CD 平台\n\n让我们来看看一些最流行的 CI/CD 平台，它们帮助自动化软件的构建、测试和部署。\n\n`GitHub Actions`\
  \ 就像是你仓库的扩展：编写一个工作流文件，推送代码，然后大喜，每当你打开拉取请求或推送提交（commit）时，测试和构建就会自动运行。最棒的部分是，你可以访问一个巨大的现成\
  \ `actions`（动作）市场，如果你以后需要更强大的功能，还可以启动你自己的自托管运行器（self-hosted runners）。\n\n如果你已经在用\
  \ `GitLab`，那么 `GitLab CI` 是很自然的选择。在项目中丢入一个 `.gitlab-ci.yml` 文件，你就可以启动构建、测试甚至部署你的应用的流水线。你将获得内置的\
  \ `Docker` 注册表支持、用于复杂工作流的父子流水线，以及在一个处完成的无缝问题跟踪。它对于希望将整个 DevOps 生命周期整合在一个平台内的团队来说是理想之选。\n\
  \n对于追求灵活性的人来说，`Jenkins` 是 CI 的鼻祖。凭借巨大的插件生态系统，你可以自定义几乎任何内容，但你需要自己管理服务器。如果你更倾向于将基础设施交给专业人士，`CircleCI`\
  \ 的云原生方法会在 `Docker 容器` 中启动作业，使用智能缓存加速运行，并提供可重用的 `orbs` 来共享配置片段。如果你处于微软生态系统中，`Azure\
  \ DevOps` 整合了流水线、仓库、看板等，且都对 Azure 服务提供原生级支持。\n\n选择最适合你工作流的工具即可。在本章中，我们将使用 `GitHub\
  \ Actions`，它是开发者中非常流行的选择。\n\n## 使用 GitHub Actions\n\n`GitHub Actions` 允许你直接在 GitHub\
  \ 仓库中 `automate workflows`（自动化工作流）。你可以将其视为一种自动对仓库中的事件（如推送、拉取请求或发布）做出的方式。\n\n通过 GitHub\
  \ Actions，你可以执行以下操作：\n\n*   运行测试并检查代码质量\n*   构建并打包你的应用程序\n*   部署到服务器或云提供商\n*   自动化问题管理\n\
  *   触发通知或与其他服务集成\n\n它非常灵活，适用于几乎任何编程语言或平台。\n\n## 理解核心概念\n\n在深入学习之前，让我们先涵盖一些基本术语：\n\
  \n*   **Workflow (工作流)**：由仓库中的事件（如 push 或 PR）触发的可配置过程。工作流定义在存储于 `.github/workflows/`\
  \ 目录下的 YAML 文件中。\n*   **Job (作业)**：在同一运行器（runner）上一起运行的一组步骤。工作流可以包含多个顺序执行或并行运行的任务。\n\
  *   **Step (步骤)**：作业中的单个任务，例如检出代码或运行 shell 脚本。\n*   **Runner (运行器)**：执行你作业的机器（虚拟机或物理机）。GitHub\
  \ 提供免费的托管运行器，或者你也可以使用自己的自托管机器。\n*   **Action (动作)**：你可以在步骤中使用的重用代码段。Action 可能是社区构建的或你自己创建的自定义脚本。\n\
  \n## 创建 GitHub Actions 工作流文件\n\n首先，让我们创建一个 GitHub Actions 工作流文件。这是一个放置在仓库 `.github/workflows/`\
  \ 目录下的 YAML 文件。你可以将其命名为类似 `playwright.yml` 的名称：\n\n```\n.github/workflows/playwright.yml\n\
  ```\n\n在该文件中定义工作流何时运行，通常是在 `push` 和 `pull_request` 事件时。\n\n如果 `npm init playwright@latest`\
  \ 已经为你创建了 `playwright.yml`，你只需要修改它即可。\n\n添加以下内容。我们将使用 Playwright 文档中的示例代码 ([`playwright.dev/docs/ci-intro`](https://playwright.dev/docs/ci-intro))：\n\
  \n```\nname: Playwright Tests\non:\npush:\n    branches: [ main, master ]\n  pull_request:\n\
  \    branches: [ main, master ]\njobs:\n  test:\n    timeout-minutes: 60\n    runs-on:\
  \ ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n\
  \        with:\n          node-version: lts/*\n      - name: Install dependencies\n\
  \        run: npm ci\n      - name: Install Playwright Browsers\n        run: npx\
  \ playwright install --with-deps\n      - name: Run Playwright tests\n        run:\
  \ npx playwright test\n      - uses: actions/upload-artifact@v4\n        if: ${{\
  \ !cancelled() }}\n        with:\n          name: playwright-report\n          path:\
  \ playwright-report/\n          retention-days: 30\n```\n\n该文件实现了每当更改推送到 main 或\
  \ master 分支，或者当打开拉取请求时，自动运行 Playwright 测试的过程。\n\n让我们拆解每个部分：\n\n*   `name: Playwright\
  \ Tests`：定义你的工作流名称。此名称将出现在仓库的 Actions 标签页中，便于识别工作流的功能。\n*   `on:` 指定触发此工作流的事件。\n\
  \    *   `push: branches: [ main, master ]`：当推送到 main 或 master 分支时运行。\n    *   `pull_request:\
  \ branches: [ main, master ]`：当针对 main 或 master 分支打开拉取请求时也会运行。这对于确保在合并之前测试新代码至关重要。\n\
  *   `jobs`：工作流由一个或多个作业组成。此工作流有一个名为 `test` 的作业：\n    *   `timeout-minutes: 60`：设置作业运行的最长时间。如果作业超过\
  \ 60 分钟，GitHub Actions 将自动取消。这可以防止作业因问题而无限运行。\n    *   `runs-on: ubuntu-latest`：指定执行作业的运行器类型（虚拟机）。`ubuntu-latest`\
  \ 因其速度和对许多工具的兼容性而常用。如果你的测试需要特定的操作系统环境，你也可以选择 `windows-latest` 或 `macos-latest`。\n\
  *   `steps`：作业由一系列步骤组成。每个步骤都可以执行命令或使用预构建的 action：\n    *   `- uses: actions/checkout@v4`：此步骤使用\
  \ checkout action（版本 4）将你的仓库代码下载到运行器上。这对于访问项目文件（包括你的 Playwright 测试）至关重要。@v4` 表示你正在使用该\
  \ action 的版本 4。锁定版本是良好实践，可以确保你的工作流稳定，不会因为 action 新版本的后兼容更改而崩溃。\n    *   `uses: actions/setup-node@v4`：此步骤使用\
  \ setup-node action（版本 4）在运行器上安装 Node.js，这是运行 Playwright 及其依赖项所需的。\n    *   `with:\
  \ node-version: lts/*`：这指定安装最新的 **长期支持** (**LTS**) 版本 Node.js。\n*   `- name: Install\
  \ dependencies`\n\n\n\n\n\n`run: npm ci`: 此步运行 `npm ci` 命令。在 CI/CD 环境中，`npm ci`\
  \ 比 `npm install` 更优。`npm ci` 会删除现有的 `node_modules` 文件夹，并根据 `package-lock.json`\
  \ 中列出的精确版本从头安装所有内容。它确保了安装的包在每台机器或服务器上完全相同，这对于追求可重现性和可靠性的 CI/CD 流水线至关重要。\n\n- `-\
  \ name: Install Playwright Browsers`\n\n`run: npx playwright install --with-deps`:\
  \ 这一步使用 `npx` 执行 Playwright CLI 命令 `install --with-deps`。该命令会下载并安装 Playwright 测试时所需的所有浏览器二进制文件（Chromium,\
  \ Firefox, WebKit）以及它们的系统级依赖。\n\n- `- name: Run Playwright tests`\n\n`run: npx playwright\
  \ test`: 这是核心步骤，在此处执行你的 Playwright 测试。`npx playwright test` 会运行你在 Playwright 项目中找到的所有测试。\n\
  \n- `- uses: actions/upload-artifact@v4`: 这是由 GitHub 提供的官方 action，允许你上传在工作流运行期间生成的制品（文件或目录）。\n\
  \n- `if: ${{ !cancelled() }}`: 此 `if` 条件确保只要工作流没有被手动取消，该步骤就会运行，即使之前的步骤（如 Playwright\
  \ 测试）失败了。当你希望无论测试是否失败都生成或上传测试报告，但希望在整个工作流被刻意停止时跳过该步骤时，这非常有用。\n\n- `with`:\n\n  \
  \  - `name: playwright-report`: 为上传的制品命名。在 GitHub 的 `Actions` 标签页中，你会看到一个名为 `playwright-report`\
  \ 的制品，并可以下载它。\n\n    - `path: playwright-report/`: 指定包含要上传文件的目录。\n\n    - `retention-days:\
  \ 30`: 设置制品在 GitHub 服务器上的保留天数。超过此期后，它将被自动删除。\n\n这是将 Playwright 测试集成到基于 GitHub 的\
  \ CI/CD 流水线的标准设置。保存你的 `playwright.yml` 文件，登录你的 GitHub 账户，并将其提交到仓库。然后，将更改推送到 GitHub：\n\
  \n```\ngit add .github/workflows/playwright.yml\ngit commit -m \"Add Playwright\
  \ tests GitHub Actions workflow\"\ngit push\n```\n\n一旦你推送代码，GitHub Actions 会自动检测到工作流并开始运行。\n\
  \n![](img/B34148_07_1.png)\n\n图 7.1：GitHub Actions \n\n你可以在仓库的 `Actions` 标签页中跟踪其进度：\n\
  \n1. 进入你的 GitHub 仓库。\n2. 点击 `Actions` 标签页。\n3. 你将看到工作流运行。点击最近的一次运行。\n4. 你可以深入 `test`\
  \ 任务并查看每个步骤的输出。\n5. 如果测试失败，你将在 `Run Playwright tests` 步骤中看到错误信息。\n6. 在工作流运行的 `Summary`\
  \ 部分的 `Artifacts` 下，你可以下载 `playwright-report.zip` 文件。解压它并在浏览器中打开 `index.html` 以查看测试结果的详细交互式报告。\n\
  \n![计算机 AI 生成的内容可能不准确。](img/B34148_07_2.png)\n\n图 7.2：GitHub Artifacts 允许访问你的报告\n\
  \n当你从 `playwright-report.zip` 中打开 `index.html` 时，你会看到 Playwright 测试报告界面。\n\n在其中，每个测试都显示了如下详情：\n\
  \n- 状态（通过、失败、跳过）\n- 错误信息 & 堆栈跟踪（如果失败）\n- 附件（截图、视频、追踪文件、日志）\n- 测试步骤：Playwright 所执行操作的逐步拆解，例如点击按钮、填充输入和导航到页面\n\
  \n![图 7.3：Test Steps 章节显示了测试期间执行的操作的详细逐步拆解](img/B34148_07_3.png)\n\n图 7.3：Test Steps\
  \ 章节显示了测试期间执行的操作的详细逐步拆解\n\n对于大型测试套件，你可以通过使用 Playwright 的 `--shard` 标记将测试分片到多个作业或运行器上，从而加速执行。请参阅\
  \ *第 6 章，*测试并行化与性能优化*。\n\n一旦你的 HTML 报告准备就绪，将其存储为制品是一个好主意，这样你可以在工作流运行完成后轻松访问它。\n\n\
  # 处理测试报告和制品\n\n你可以使用 `actions/upload-artifact@v4` action 将 HTML 报告存储为制品，在其中你为制品定义一个名称（例如\
  \ `coverage-report`），并指向存放生成的 HTML 文件的文件夹（例如 `playwright-report/`）。我们在上一节中讨论的 YAML\
  \ 文件已经包含了此 action。\n\n## 通过 GitHub Pages 在线发布你的 HTML 报告\n\n如果你要在网上共享你的 Playwright\
  \ HTML 报告，可以使用 `GitHub Pages` 进行托管。GitHub Pages 是 GitHub 提供的一项免费服务，让你可以将代码仓库转换为可共享的网站。你不仅可以存储代码，还可以利用它直接从仓库中托管项目文档、个人作品集，甚至是完整的网站。\n\
  \n首先，在终端中运行以下命令生成你的 HTML 报告：\n\n```\nnpx playwright test --reporter=html\n```\n\n\
  这将创建一个名为 `playwright-report` 的文件夹，其中包含 `index.html` 文件。接下来，你需要一个 GitHub 仓库来托管。对于报告的位置有两种选择：\n\
  \n- 在主分支上：将 `playwright-report` 文件夹放在根目录或 `docs/` 下。\n- 在独立分支上（如 `gh-pages`）：如果你喜欢保持整洁，可以创建：\n\
  \n```\ngit checkout --orphan gh-pages\n```\n\n此命令告诉 Git 创建并切换到一个名为 `gh-pages` 的新分支，且没有任何之前的历史。这被称为**孤立分支**（orphan\
  \ branch），因为它不共享历史。虽然你现在处于一个新分支，但你的工作目录（项目中的实际文件）仍包含之前分支的所有文件，只是 Git 在此文中将它们全部视为未跟踪文件。\n\
  \n之后，将 `playwright-report` 文件夹复制到此分支，提交更改并推送：\n\n```\ngit add .\ngit commit -m \"\
  Publish Playwright report\"\ngit push origin gh-pages --force\n```\n\n你需要使用 `--force`\
  \ 标记，因为 `gh-pages` 分支通常是孤立创建的。因此，普通的 `git push` 会失败，因为 Git 无法连接这两个历史。使用 `--force`\
  \ 相当于告诉 Git，“用我的本地版本替换远程分支，即使它们不匹配*。请注意 `--force` 具有风险。如果你在共享分支上使用它，可能会覆盖他人的工作或删除提交。\n\
  \n一旦文件到达 GitHub，进入你的仓库设置并找到 Pages 部分。在那里，选择报告所在的分支，并指定文件夹路径，例如根目录或 `docs/`：\n\n\
  ![](img/B34148_07_4.png)\n\n图 7.4：GitHub 设置\n\n保存这些设置后，GitHub Pages 将给你一个 URL，如下：\n\
  \n```\nhttps://<username>.github.io/<repository>/\n```\n\n如果你的报告在子目录中，URL 将包含该路径。例如：\n\
  \n```\nhttps://<username>.github.io/<repository>/playwright-report/\n```\n\n\n\n\
  \n当你打开该链接时，GitHub Pages 将为你提供来自报告的 `index.html` 文件，让任何人都能在浏览器中查看你的交互式 Playwright\
  \ 结果。\n\n由于 `playwright-report/` 包含的是临时测试输出而不是你想要版本控制的代码，因此你应该将其添加到 `.gitignore`\
  \ 中。\n\n## 使用 GitHub Actions 自动化该过程\n\n每次手动推送你的 Playwright HTML 报告可能会非常无聊。幸运的是，你可以使用\
  \ GitHub Actions 自动化整个过程。\n\n你可以设置一个任务，每当你向主分支（main）推送更改时，它会自动将其部署到 `gh-pages` 分支。该工作流使用\
  \ `peaceiris/actions-gh-pages` action 来发布 `playwright-report` 文件夹：\n\n```\n- name:\
  \ Deploy to GitHub Pages\nuses: peaceiris/actions-gh-pages@v4\nwith:\ngithub_token:\
  \ ${{ secrets.GITHUB_TOKEN }}\npublish_dir: ./playwright-report\npublish_branch:\
  \ gh-pages\n```\n\n有了这个自动化流程，你的报告将保持更新，无需任何手动操作。`- name: Deploy to GitHub Pages`\
  \ 这一行只是给该步骤起了一个标签，所以当你查看 GitHub 上的工作流日志时，你知道这部分正在处理部署。\n\n`uses: peaceiris/actions-gh-pages@v4`\
  \ 这一行告诉 GitHub Actions 运行由名为 `peaceiris` 的开发者创建的内置 action `actions-gh-pages`。这个\
  \ action 非常流行，因为它很容易将文件推送到仓库的 GitHub Pages 分支。通过指定 `@v4`，你选择了该 action 的第 4 版本。\n\
  \n在 `with` 部分下，有可以自定义 action 工作方式的输入。第一个输入 `github_token: ${{ secrets.GITHUB_TOKEN\
  \ }}` 为 action 提供了将更改推回仓库的权限。GitHub 为每次工作流运行自动生成此令牌，因此你不需要手动创建。这是允许工作流进行更改（例如更新\
  \ `gh-pages` 分支）的安全方法。\n\n`publish_dir: ./playwright-report` 告诉 action 你想要发布到 GitHub\
  \ Pages 的文件夹。该 action 会获取该文件夹内的所有内容并推送到 GitHub Pages 使用的 `gh-pages` 分支。\n\n现在，你可能会收到错误，说\
  \ GitHub Actions 机器人没有权限推送到你的仓库。默认情况下，除非你在工作流 YAML 中显式授予写入权限，否则 `GITHUB_TOKEN` 对你的仓库只有只读权限。\n\
  \n在你的工作流文件中添加此顶层部分：\n\n```\npermissions:\ncontents: write\n```\n\n所以，我们完整的工作流片段看起来像这样：\n\
  \n```\nname: Deploy Playwright Report to GitHub Pages\non:\npush:\nbranches:\n-\
  \ [ main, master ]\npermissions:\ncontents: write\njobs:\ndeploy:\nruns-on: ubuntu-latest\n\
  steps:\n- name: Checkout repository\nuses: actions/checkout@v4\n- name: Set up Node.js\n\
  uses: actions/setup-node@v4\nwith:\nnode-version: lts/*\n- name: Install dependencies\n\
  run: npm ci\n- name: Install Playwright Browsers\nrun: npx playwright install --with-deps\n\
  - name: Run Playwright tests\nrun: npx playwright test\n- uses: actions/upload-artifact@v4\n\
  if: ${{ !cancelled() }}\nwith:\nname: playwright-report\npath: playwright-report/\n\
  retention-days: 30\n- name: Deploy to GitHub Pages\nuses: peaceiris/actions-gh-pages@v4\n\
  with:\ngithub_token: ${{ secrets.GITHUB_TOKEN }}\npublish_dir: ./playwright-report\n\
  publish_branch: gh-pages\n```\n\n从现在起，每当你推送代码且 Playwright 测试成功运行时，你的 HTML 报告将自动发布到在线，无需任何手动操作。\n\
  \n一旦启用了 GitHub Pages，请访问其提供的 URL 以检查报告是否可以访问。确保 `playwright-report` 文件夹及其内容未列在你的\
  \ `.gitignore` 文件中，否则可能无法被上传。\n\n如果报告没有按预期加载（例如，由于 MIME 类型错误），请双击 GitHub Pages 是否已设置好提供正确的分支和文件夹。如果你在使用私有仓库，请记住你可以通过仓库设置控制谁可以看到你的\
  \ GitHub Pages 站点。\n\n你也可以根据需要将报告上传到 AWS S3 或 Firebase Hosting 等外部服务。\n\n## 在 Job\
  \ 摘要中添加内联 HTML\n\nGitHub 的 `Job Summaries`（作业摘要）是一个非常实用的功能，允许你向 GitHub Actions 工作流运行的摘要部分添加格式化良好的内容。你可以使用\
  \ `GITHUB_STEP_SUMMARY` 环境变量访问此功能，它是使用简单 Markdown 语法共享额外信息（如链接或重要消息）极佳方法。\n\n例如，你可以通过如下步骤添加测试报告的链接：\n\
  \n```\n- name: Add link to report in summary\nrun: |\necho \"## Test Report\" >>\
  \ $GITHUB_STEP_SUMMARY\necho \"[查看测试报告](https://${{ github.actor }}.github.io/test/playwright-report/)\"\
  \ >> $GITHUB_STEP_SUMMARY\n```\n\n虽然 Job Summaries 支持 Markdown，但重要的是，它们不处理大型或复杂的原始\
  \ HTML 内容。Markdown 的设计初衷是轻量级且安全的，因此 GitHub 限制了你可以包含的内容。你完全添加文本、链接、标题和列表，但如果你尝试添加诸如完整的\
  \ HTML 文档、`<div>` 块或脚本，它们将被忽略或以纯文本形式显示而不是渲染为 HTML。\n\n对于更复杂的内容，你可以使用 Markdown 用于摘要本身并链接到外部资源。\n\
  \n确保你的应用程序在不同环境中无缝运行至关重要。实现这一点的有效有效方法是在 CI/CD 流中中使用矩阵构建（matrix builds）。\n\n## 使用矩阵构建在多个浏览器和操作系统上运行测试\n\
  \nGitHub Actions 中的矩阵构建是一种在不同配置（如不同浏览器或操作系统）下运行相同任务的便捷方法，可以并行或顺序执行。\n\n通过矩阵，你可以定义一组变量，GitHub\
  \ Actions 会为每种组合自动创建一个单独的任务。这在跨环境测试时非常强大。\n\n假设你想在 Linux、macOS 和 Windows 上进行测试——并且跨多个浏览器。矩阵构建可以为你生成所有组合，而无需为每个组合编写单独的任务。例如，你可以轻松获得\
  \ Linux 上的 Chromium、macOS 上的 Firefox 等任务。\n\n这是一个简单的示例：\n\n```\nruns-on: ${{ matrix.os\
  \ }}\nstrategy:\nmatrix:\nos: [ubuntu-latest, windows-latest, macos-latest]\n  \
  \  browser: [chromium, firefox]\nsteps:\n- uses: actions/checkout@v4\n- name: Install\
  \ dependencies\nrun: npm install\n- name: Run Playwright tests\nrun: npx playwright\
  \ test --project=${{ matrix.browser }}\n```\n\n此设置确保每个作业仅运行 `matrix.browser` 指定的测试。例如，Firefox\
  \ 作只运行 Firefox 测试，而 Chromium 作只运行 Chromium 测试。\n\n这将创建六个独立的作业（三个操作系统 × 两个浏览器）：\n\
  \n| OS | Browser |\n| :--- | :--- |\n| ubuntu-latest | Chromium |\n| ubuntu-latest\
  \ | firefox |\n| windows-latest | Chromium |\n| windows-latest | firefox |\n| macos-latest\
  \ | Chromium |\n| macos-latest | firefox |\n\n表 7.1：矩阵扩展示例（3 个操作系统 × 2 个浏览器）\n\n\
  总来说，矩阵构建通过处理多环境测试的复杂性，为你节省了大量的时间精力。\n\n例如，如果你正在开发 Playwright 报告部署工作流，你可以使用矩阵构建跨浏览器运行\
  \ Playwright 测试，然后将合并报告或特定浏览器的报告部署到 GitHub Pages。\n\n\n\n\n\n即使使用了集成良好的 Playwright\
  \ 工作流，CI 运行有时也可能出现出现预预测的行为。为了让你的 CI 运行更具韧性，尝试在 Playwright 配置中添加 `retries`: 2。这会告诉\
  \ Playwright 自动重新运行任何失败的测试，最多两次。这在处理由计时或网络不稳定引起的抖动测试（flaky tests）时特别有用。尽管如此，重试机制不应成为救命稻草。如果你发现自己过度依赖它们，这可能意味着更深层次的问题，例如竞态条件或环境配置错误。因此，值得深入挖掘并修复根源，而不是仅仅是修补。\n\
  \n另一个实用的技巧是在 CI 设置中开启 `Playwright traces`（Playwright 追踪）。追踪会记录每个测试的截图、控制台日志和网络活动，因此你实际上可以逐步重放发生的过程。要启用追踪，只需向你的\
  \ `playwright.config.ts` 文件添加以下内容：\n\n```\nuse: {\n  trace: 'on-first-retry',\n\
  }\n```\n\n# 使用 Docker 创建一致的容器化测试环境\n\n`Docker` 是一个可以轻松创建一致、可重复测试环境的工具。它在处理 CI/CD\
  \ 流水线时特别有帮助。通过 Docker，你可以将应用程序及其所需的所有内容（如运行时、依赖和工具）封装到一个整洁的容器中，在任何地方运行方式都是相同的：在你的笔记本上、测试环境或生产环境中。这意味着再也不会有“在我的机器上运行正常”这种令人头疼的问题！\n\
  \n与其手动在机器上安装特定版本的工具，不如在 `Dockerfile` 中定义一次所有内容。\n\n另一个优点是容器是隔离的。这意味着测试之间不会相互干扰，这对于并行运行测试并加速你的工作流非常有。\n\
  \n在 CI/CD 工作流中，Docker 与 GitHub Actions 等工具配合使用时大放异彩。通过在 Docker 镜像中定义测试环境，每次提交都可以进行一致的测试。这对于跨越多个配置的矩阵构建（matrix\
  \ builds）特别有价值。\n\n## 设置\n\n在开始之前，确保你的机器上已安装并运行了 Docker：\n\n* 下载 Windows 或 macOS\
  \ 版 Docker Desktop：[`www.docker.com/products/docker-desktop`](https://www.docker.com/products/docker-desktop)\n\
  * 如果你使用的是 Linux，请使用 `Docker Engine`\n\n## 在 Docker 中运行你的测试\n\n在你的 Playwright 项目的根目录中，创建一个名为\
  \ `Dockerfile` 的文件（无扩展名）。粘贴以下内容：\n\n```\n# 使用官方的 Playwright 基础镜像（带有浏览器和依赖的 Node.js）\n\
  # 建议锁定特定版本以确保可复现性\nFROM mcr.microsoft.com/playwright:v1.54.0-noble\n# 设置容器内部的工作目录\n\
  WORKDIR /app\n# 复制 package.json 和 package-lock.json 以安装依赖\n# 这利用了 Docker 的缓存，只有当这些文件发生变化时才会重新安装依赖\n\
  COPY package*.json ./\n## 安装项目依赖\nRUN npm install\n# 将其余 Playwright 项目文件复制到容器中\n\
  COPY . .\n## 容器启动时运行 Playwright 测试的命令\n# 你可以根据特定需求调整此命令\nCMD [\"npx\", \"playwright\"\
  , \"test\"]\n```\n\n`Dockerfile` 是一个包含构建 Docker 镜像指令的脚本。以下是这里发生的操作：\n\n* `FROM mcr.microsoft.com/playwright:v1.54.0-noble`:\
  \ 我们从官方 Playwright 镜像开始，该镜像已经安装了 Node.js 和所有主流浏览器。始终`锁定版本`以确保构建的一致性。你可以访问 Microsoft\
  \ Artifact Registry 获取可用的官方 Playwright 镜像列表：[`mcr.microsoft.com/en-us/artifact/mar/playwright/tags`](https://mcr.microsoft.com/en-us/artifact/mar/playwright/tags)。\n\
  * `WORKDIR /app`: 设置在容器内执行命令的路径。\n* `COPY package*.json ./`: 优先获取你的 `package.json`\
  \ 文件以缓存安装步骤（这样除非依赖发生变化，否则不会重复执行）。\n* `RUN npm install`: 安装 `package.json` 文件中定义的所有\
  \ Node.js 依赖项。\n* `COPY . .`: 将你本地项目目录中的所有剩余文件复制到容器内的 `/app` 目录。这包括你的 Playwright\
  \ 测试、配置以及任何其他项目特定文件。\n* `RUN npx playwright install --with-deps`: 如果你使用官方的 Playwright\
  \ Docker 镜像，浏览器已经包含在内，你不需要手动安装。然而，如果你使用的是更通用的 Node.js 基础镜像，运行此命令可以确保 Playwright\
  \ 的浏览器及其系统依赖被正确地安装在容器中。\n* `CMD [\"npx\", \"playwright\", \"test\"]`: 定义从该镜像启动容器时执行的默认命令。在这种情况下，它运行你所有的\
  \ Playwright 测试。\n\n## 构建 Docker 镜像\n\n现在你已经有了 `Dockerfile`，让我们来构建 Docker 镜像。从项目的根目录，运行以下命令：\n\
  \n```bash\ndocker build -t playwright-tests .\n```\n\n让我们拆解一下：\n\n* `docker build`:\
  \ 构建 Docker 镜像的命令。\n* `-t playwright-tests`: 为镜像标记上 `playwright-tests` 的名称。你可以选择任何你喜欢的名称。\n\
  * `.`: 指定构建上下文，即当前目录（`Dockerfile` 所在的位置）。\n\n第一次构建可能因为下载所有内容而需要一段时间，但未来的构建将将快得多。\n\
  \n## 在容器中运行 Playwright 测试\n\n镜像构建完成后，你可以使用 `docker run` 命令在隔离容器中运行你的 Playwright\
  \ 测试：\n\n```bash\ndocker run --rm -it --ipc=host playwright-tests\n```\n\n让我们拆解一下：\n\
  \n* `--rm`: 在容器退出后将其清理。\n* `-it`: 允许你与容器交互（用于读取输出）。\n* `--ipc=host`: 建议在使用 Chromium\
  \ 时使用 `--ipc=host`。如果没有此标志，Chromium 可能会因为内存不足而崩溃。\n* `playwright-tests`: 你刚刚构建的镜像名称。\n\
  \n当你运行此命令时，Docker 将从你的 `playwright-tests` 镜像创建一个容器，执行测试并显示结果。\n\n## 查看报告和制品\n\n\
  默认情况下，Playwright 在 `playwright-report` 目录生成 HTML 报告。为了访问容器内生成的报告或其他制品（如截图），你需要挂载卷。\n\
  \n修改你的 `docker run` 命令添加 `-v` 参数：\n\n```bash\ndocker run --rm -v \"$(pwd)/playwright-report:/app/playwright-report\"\
  \ playwright-tests\n```\n\n这将你本地的 `playwright-report` 目录（Linux/macOS 上为 `$(pwd)/playwright-report`，Windows\
  \ 上为 `%cd%/playwright-report`）挂载到容器内的 `/app/playwright-report` 目录。这意味着 Playwright\
  \ 在容器内生成的任何报告将直接保存到你的本地机器上。\n\n测试完成后，你可以在浏览器中打开本地 `playwright-report` 目录下的 `index.html`\
  \ 文件来查看详细报告：\n\n```bash\nnpx show-report\n```\n\n## 与 GitHub Actions 集\n\n现在你已经使用\
  \ Docker 对 Playwright 测试进行了容器化，下一步是将其作为 CI 流水线的一部分自动运行。GitHub Actions 让这一切变得非常简单。\n\
  \n要将容器化的 Playwright 测试集成到你的 *Deploy Playwright Report to GitHub Pages* 工作流中，你主要需要将在运行器上直接设置\
  \ Node.js、安装依赖和运行 Playwright 的步骤，替换为构建和运行你的 Docker 镜像的步骤。\n\n\n\n\n\n首先，你需要确保已“检出”（checkout）了代码，以确保\
  \ `Dockerfile` 和所有项目文件都是可用的。然后，使用 `Dockerfile` 构建 Docker 镜像，并在容器内运行 Playwright 测试：\n\
  \n```\nname: Deploy Playwright Report to GitHub Pages\non:\n  push:\n    branches:\n\
  \      - master \npermissions:\n  contents: write\njobs:\n  deploy:\n    runs-on:\
  \ ubuntu-latest\n    steps:\n      - name: Checkout repository\n        uses: actions/checkout@v4\n\
  \      - name: Build Docker image\n        run: docker build -t playwright-tests\
  \ . \n      - name: Run Playwright tests in Docker\n        run: docker run --rm\
  \ -v \"${{ github.workspace }}/playwright-report:/app/playwright-report\" playwright-tests\n\
  \      - uses: actions/upload-artifact@v4\n        if: ${{ !cancelled() }}\n   \
  \     with:\n          name: playwright-report\n          path: playwright-report/\n\
  \          retention-days: 30\n      - name: Deploy to GitHub Pages\n        uses:\
  \ peaceiris/actions-gh-pages@v4\n        with:\n          github_token: ${{ secrets.GITHUB_TOKEN\
  \ }}\n          publish_dir: ./playwright-report\n          publish_branch: gh-pages\n\
  ```\n\n原始工作流包含如 `Set up Node.js`、`Install dependencies` 和 `Install Playwright Browsers`\
  \ 等步骤。现在这些不再需要，因为你的 Docker 镜像（`playwright-tests`）已经在容器内封装了 Node.js、Playwright 及其所有依赖。\n\
  \n此步骤在新构建的 Docker 容器内执行你的 Playwright 测试：\n\n```\n - name: Run Playwright tests in\
  \ Docker\n      run: docker run --rm -v \"${{ github.workspace }}/playwright-report:/app/playwright-report\"\
  \ playwright-tests\n```\n\n`-v \"${{ github.workspace }}/playwright-report:/app/playwright-report\"\
  ` 部分至关重要。它挂载了一个卷（volume），有效地创建一个共享目录。`${{ github.workspace }}` 是指向你克隆仓库根目录的内置变量。\n\
  \n因此，通过挂载此卷，Playwright 在容器内生成的任何报告、截图或视频都将直接写入 GitHub Actions 运行器空间中的 `playwright-report`\
  \ 目录。这使得后续的 `upload-artifact` 和 `peaceiris/actions-gh-pages` 操作可以访问这些文件。\n\n不需要更改\
  \ `upload-artifact` 和 `peaceiris/actions-gh-pages`。这些步骤保持不变，因为得益于卷挂载，`playwright-report`\
  \ 目录在运行器上可用，就像你直接在运行器上运行测试一样。它们将正确地获取由 Docker 容器生成的报告。\n\n这种集成工作流确保了你的 Playwright\
  \ 测试在一致的容器化环境中执行，并且它们的报告仍然部署到 GitHub Pages。\n\n如果你的 GitHub Actions 工作流使用矩阵构建（matrix\
  \ build）在多个配置或分片上运行 Playwright 测试，每个作业将生成它自己的报告。要发布单一的统一报告，你可以使用 Playwright 的 blob\
  \ 报告功能。每个分片上传其结果，然后由最终作业在部署前对其进行合并。有关详情和示例，请参考 Playwright 文档：\n\n[`playwright.dev/docs/test-sharding#github-actions-example`](https://playwright.dev/docs/test-sharding#github-actions-example)\n\
  \n这带我们来到了本章的结束。\n\n# 总结\n\n将自动化测试集成到你的 CI/CD 流水线中是提高开发速度和增强频繁发布信心的有效方法之一。在本章中，你学习了如何配置\
  \ Playwright 测试以便在代码更改时自动运行，使用 GitHub Pages 发布交互式 HTML 报告，并使用 Docker 确保跨机器的测试环境一致性。通过矩阵构建和产物上传等功能，你的流水线现在可以跨不同系统验证代码并轻松共享结果。现在，你可以花更少的时间去担心基础设施，而花更多的时间去构建出色的功能。\n\
  \n在下一章中，我们将查看如何在无头模式（headless mode）下运行测试以提高效率，并使用 Playwright 的工具调试失败的测试。\n\n## 获取本书的\
  \ PDF 版本和独家额外内容\n\n扫描二维码（或访问 [packtpub.com/unlock](https://packtpub.com/unlock)）。按书名称搜索此书，确认版本，然后按照页面上的步骤操作。\
  \ | ![](img/Unlock-01.png)![](img/Unlock.png) |\n\n| **注意**：请妥善保存发票。直接从 Packt 购买不需要发票。\
  \ |\n\n# 8\n\n# 无头测试与调试\n\n当你构建和运行自动化测试时，了解幕后发生了什么是有帮助的，当事情不符合预期时，这种帮助更加巨大。这正是本章大显身场的地方。我们将探索两个重要的话题：Playwright\
  \ 中的**无头测试（headless testing）**和**调试（debugging）**。当你希望测试在后台快速、安静地运行时，无头模式非常棒。它非常适合持续集成或大型测试套件。但有时，你可能需要实际看到屏幕上发生了什么。这时，有头模式（打开浏览器窗口）就派上用场了。\n\
  \n我们还将介绍 Playwright 提供的某些强大的调试工具，例如 Inspector（检查器）、UI 模式以及捕获测试运行截图和视频的方法。这些工具让你能够更容易查出哪里出了问题并快速修复故障。\n\
  \n到本章结束时，你将知道何时静静高效地运行测试，何时逐步观察测试，并且你将拥有像专家一样调试的工具。\n\n因此，我们将涵盖以下主要主题：\n\n*   配置无头与有头模式\n\
  *   使用 Inspector 进行调试\n*   探索 UI 模式\n*   为失败的测试捕捉截图\n*   录制视频\n\n## 技术要求\n\n为了跟随本章，请确保你使用的是运行无头浏览器的系统。\n\
  \n本章的源代码可在 [`github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright/tree/Chapter08`](https://github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright/tree/Chapter08)\
  \ 获取。\n\n\n\n\n\n```javascript\nimport { defineConfig, devices } from '@playwright/test';\n\
  export default defineConfig({\n  projects: [\n    {\n      name: 'chromium',\n \
  \     use: {\n        ...devices['Desktop Chrome'],\n        headless: false,\n\
  \      },\n    },\n    {\n      name: 'firefox',\n      use: {\n        ...devices['Desktop\
  \ Firefox'],\n        headless: true,\n      },\n    },\n  ],\n});\n```\n\n在无头模式（headless\
  \ mode）下运行可以节省 CPU 和内存。此外，它通常更具一致性，因为它避免了屏幕尺寸或显示设置等影响测试结果的因素。\n\n反之，在无头模式下进行调试可能会有些棘手。由于你看不到浏览器窗口，通常需要依赖截图、录制视频或跟踪工具（trace\
  \ tools）来找出哪里出了问题。这意味着你无法直观地检查 UI 元素的外观，或者动画和过渡效果如何，这在某些情况下是非常重要的。虽然 Playwright\
  \ 可以帮助解决这个问题，但某些网站可能会将无头浏览器标记为机器人，这可能会在测试期间产生问题。\n\n这就是有头模式（headful mode）大显身手的地方：通过设置\
  \ `headless: false`，你可以指令 Playwright 打开真实的浏览器窗口。\n\n## 启用有头模式\n\n在调试不稳定的测试或开发新的自动化脚本时，实时看到页面渲染和操作执行过程是无价之宝。你可以轻松地在\
  \ `playwright.config.ts` 文件中启用有头模式：\n\n```typescript\n// playwright.config.ts\n\
  import { defineConfig, devices } from '@playwright/test';\nexport default defineConfig({\n\
  \  use: {\n    headless: false,\n    // ... 其他配置\n  },\n});\n```\n\n你也可以在 Playwright\
  \ CLI 中使用 `--headed` 标志。如果你在使用多个项目，也可以针对每个项目进行设置。\n\n在有头模式下运行确实有一些权衡。最大的一点是性能：它通常比无头模式慢，因为它必须渲染完整的图形界面。当你运行大量测试时，这种变慢会变得更加明显。\n\
  \n它对系统资源的消耗也大一些。有头模式使用更多的 CPU 和内存，这可能会限制你并行运行测试的数量，这在快速迭代开发工作流中非常重要。\n\n当你在 CI 环境（例如\
  \ GitHub Actions）中运行 Playwright 测试时，通常没有图形环境，因此浏览器必须在无头模式下运行。如果你尝试以有头模式运行，它们将失败，因为没有显示器来渲染\
  \ UI。\n\n一种常见的模式是根据测试是否在 CI 中运行来切换无头模式。这是一个示例：\n\n```javascript\nmodule.exports\
  \ = defineConfig({\n  use: {\n    headless: !!process.env.CI,  // 在 CI 中为 true，本地为\
  \ false\n  },\n});\n```\n\n在 GitHub Actions 中，CI 环境变量会自动设置为 `\"true\"`，因此此逻辑可以完美运行。\n\
  \n因此，在以下情况下请使用无头模式：\n\n*   **运行 CI/CD 流线**：它是持续集成设置中自动化测试的默认选择\n*   **处理大型测试套件**：它对系统资源更快、更高效\n\
  *   **进行网络爬虫**：当你只需要数据而不需要看浏览器中发生了什么时，这是完美选择\n\n在以下情况下请使用有头模式：\n\n*   **在本地进行开发或调试**：编写和排错测试的极佳选择\n\
  *   **测试交互式功能**：当你需要看到应用如何响应用户操作时非常有用\n\n## 在 Node.js 中直接运行你的测试\n\n如果你更喜欢直接在 Node.js\
  \ 中运行测试，Playwright 在 `launch()` 方法中提供了一个切换无头和有头模式选项：\n\n```javascript\nimport {\
  \ chromium } from 'playwright';\n(async () => {\n  // 无头模式\n  const browser = await\
  \ chromium.launch({ headless: true });\n  const page = await browser.newPage();\n\
  \  await page.goto(' https://playwright.dev/');\n  // ...更多操作\nawait browser.close();\n\
  })();\n```\n\n要用 Node.js 运行 TypeScript 测试文件，首先安装必要的包：\n\n```bash\nnpm install typescript\
  \ ts-node @types/node\n```\n\n然后初始化 TypeScript 配置：\n\n```bash\nnpx tsc --init\n\
  ```\n\n现在你可以使用 `ts-node` 运行你的 TypeScript 文件了：\n\n```bash\nnpx ts-node example.spec.ts\n\
  ```\n\n搞定。你已经让 TypeScript 和 Node.js 运行起来了。\n\n在 Node.js 中，你甚至可以启用 `devtools: true`\
  \ 让浏览器开发工具自动弹出，并可以添加 `slowMo` 延迟来将每个操作减慢指定的毫秒数，这为你提供了时间逐步观察并与页面交互：\n\n```javascript\n\
  import { chromium, Browser, BrowserContext, Page } from 'playwright';\n(async ()\
  \ => {\n  const browserHeadful: Browser = await chromium.launch({\n    headless:\
  \ false,       \n    devtools: true,  \n    slowMo: 50, \n  });\n  const context:\
  \ BrowserContext = await browserHeadful.newContext();\n  const page: Page = await\
  \ context.newPage();\n  await page.goto('https://playwright.dev/');\n  await page.screenshot({\
  \ path: 'example.png' });\n  await browserHeadful.close();\n})();\n```\n\n使用此配置可以让你清晰地看到发生了什么，当你尝试发现并修复问题（尤其是\
  \ UI 相关的 bug）时这非常有帮助。它对于检查外观、测试动画以及确保界面行为符合预期也非常棒。\n\n直接在 Node.js 中运行 Playwright\
  \ 测试可以让你在不集成到测试框架的情况下，用于网络爬虫或填写表单等任务与浏览器交互。如果你是熟悉 Node.js 的测试工程师，可以将这种方式作为脚本化的工具，而不是结构化的测试。\n\
  \n如果你想通过调试更好地理解 Playwright 测试在做什么，Playwright Inspector 是一个非常棒的工具，你需要在调试时将其包含在你的工具包中。\n\
  \n## 使用 Playwright 调试器进行调试\n\n`Playwright Inspector` 提供了一个可视化界面，你可以在其中逐步执行测试脚本、与浏览器交互，并检查元素和选择器。\n\
  \n如果测试不稳定，调试器可以帮助你定位到出错的具体步骤，并让你看到那一刻的页面状态。这使得调试变得容易得多。\n\n当你处理选择器时它也非常方便。在将选择器提交到测试脚本之前，你可以使用\
  \ Inspector 的选择器器确保它准确目标你想要的元素。\n\n## 如何启动调试器\n\n启动 Playwright Inspector 有几种主要方法。使用\
  \ `--debug` 标志是最常用的调试方法。当你使用此标志运行测试时，Playwright 会以 `headed` 模式启动浏览器并打开 Inspector：\n\
  \n```bash\nnpx playwright test --debug\n```\n\n要调试特定的测试文件，甚至是文件中的某个特定测试，可以使用：\n\n\
  ```bash\nnpx playwright test example.spec.ts --debug\nnpx playwright test example.spec.ts:10\
  \ --debug \n```\n\n`example.spec.ts` 后的 `:10` 指 `example.spec.ts` 文件的第 10 行。它告诉\
  \ Playwright 只运行在第 10 行定义或开始的测试。这对于包含多个测试的文件运行特定测试非常方便。\n\n另一种方法是通过设置环境变量 `PWDEBUG=1`\
  \ 来启用调试功能来启动测试。例如，运行 `PWDEBUG=1 npx playwright test` 将以调试模式启动你的测试并自动打开 Inspector\
  \ 窗口：\n\n* Bash/Zsh (Linux/macOS):\n\n    ```bash\n    PWDEBUG=1 npx playwright\
  \ test\n    ```\n\n* PowerShell (Windows):\n\n    ```powershell\n    $env:PWDEBUG=1;\
  \ npx playwright test\n    ```\n\n* Batch (Windows):\n\n\n\n\n\n```\nset PWDEBUG=1\
  \ && npx playwright test\n```\n\n当设置 `PWDEBUG=1` 时，Playwright 还会应用一些有助于默认设置：\n\n\
  - 浏览器以有界面模式（headed mode）启动\n- 默认超时时间设置为 `0`（无超时），防止测试在调试期间过早失败\n\n## 使用 Playwright\
  \ Inspector\n\nPlaywright Inspector 由几个部分组成。在主界面，它显示你的测试脚本，并高亮当前的执行行。在顶部，有暂停、恢复和单步执行的控件。此外，你还可以录制用户操作（这些将被转换为代码），并通过直接点击浏览器中的元素来选择选择器。\n\
  \n![图 8.1：Playwright Inspector 界面：控件位于界面左上方](img/B34148_08_1.png)\n\n图 8.1：Playwright\
  \ Inspector 界面：控件位于界面左上方\n\n当 Inspector 打开时，你将看到以下内容：\n\n- **可性日志 (Actionability\
  \ logs)**：提供有关 Playwright 操作的详细信息，包括元素可能无法交互的原因（不可见、未启用、不稳定）。这对于理解操作为何失败至关重要。\n\
  - **单步执行工具栏**：\n    - **Play/Resume（恢复）**：继续执行测试，直到遇到下一个 `page.pause()` 方法或测试结束。\n\
  \    - **Step Over (跳过)**：执行当前的 Playwright 操作并在下一个操作处暂停。这允许你逐步通过测试。\n- **定位器选择器\
  \ (Locator picker)**：\n    - 这是一个非常有用的功能。点击 `Pick Locator` 按钮。然后，悬停在浏览器窗口中的元素上。Playwright\
  \ 将为该元素建议定位器（优先考虑角色 role、文本和测试 ID）。\n    - 点击元素将将其定位器添加到 Inspector 中的 `Locator`\
  \ 标签页中。然后你可以实时编辑此定位器，并在输入时查看浏览器中被高亮的的元素，这有助于你精调选择器。\n    - 你可以直接将生成的定位器复制到你的测试代码中。\n\
  \n## 实际示例：修复失败的登录测试\n\n假设你正在尝试为网站的登录过程自动化。你的测试代码失败了，因为 Playwright 找不到用户名输入框：\n\n\
  ```\nimport { test, expect } from '@playwright/test';\ntest('should log in successfully',\
  \ async ({ page }) => {\n  await page.goto('https://www.saucedemo.com/');\n  //\
  \ --- 问题行 ---\n// 我们假设用户名字段有一个 ID 为 'username-input'\n// 但它是错误的！\nawait page.fill('#username-input',\
  \ 'standard_user');\n  await page.fill('#password', 'secret_sauce');\n  await page.getByRole('button',\
  \ { name: 'Login' }).click();\n  await expect(page).toHaveURL(/inventory.html/);\n\
  \  await expect(page).toHaveTitle('Swag Labs');\n});\n```\n\n在你的 Playwright 项目目录中打开终端，并使用\
  \ `--debug` 标志运行测试：\n\n```\nnpx playwright test tests/login.spec.ts --debug\n```\n\
  \n浏览器窗口将打开并导航到 [`www.saucedemo.com/`](https://www.saucedemo.com/)。Playwright Inspector\
  \ 窗口也会打开。测试将暂停。点击 `Resume` 按钮或键盘上的 `F8` 继续。\n\n`await page.fill('#username-input',\
  \ 'standard_user');` 这一行将在 Inspector 的源代码视图中高亮显示。\n\n现在，让我们看看查找并应用正确定位器的步骤：\n\n\
  1. **使用定位器选择器**：\n    - 在 Playwright Inspector 窗口中，点击 `Pick Locator` 按钮。\n\n![图\
  \ 8.2：Pick Locator 按钮](img/B34148_08_2.png)\n\n图 8.2：Pick Locator 按钮\n\n    - 现在，将鼠标移动到浏览器窗口上。当你悬停在元素上时，Playwright\
  \ 将建议定位器。\n    - 悬停在页面上真实的用户名输入框上。当你悬停时，Inspector 建议使用 `locator('[data-test=\"username\"\
  ]')`。\n\n2. **验证并炼定位器**：\n    - 点击浏览器窗口中的用户名输入框。建议的定位器将出现在 Inspector 中的 `Locator`\
  \ 输入框中：![图 8.3：Inspector 中的 Locator 标签页](img/B34148_08_3.png)\n\n    图 8.3：Inspector\
  \ 中的 Locator 标签页\n\n    - 在 Inspector 的 `Locator` 字段中，输入你新建议的定位器：`locator('[data-test=\"\
  username\"]')`。提个醒：你可能会在该字段中看到不同的定位器。这是因为 Playwright 正在不断进化，它的定位器机制随时间变得越来越高效。随着你的输入，Playwright\
  \ 将在浏览器窗口中高亮匹配的元素。这确认了你的新定位器正确识别了用户名字段。\n\n3. **复制修正后的定位器**：一旦你对定位器满意，点击 Inspector\
  \ 中 `Locator` 字段旁的 `Copy` 按钮。\n4. **更新你的测试代码**：回到你的 `example.spec.ts` 文件并替换错误的定位器：\n\
  \n```\nimport { test, expect } from '@playwright/test';\ntest('should log in successfully',\
  \ async ({ page }) => {\n  await page.goto('https://www.saucedemo.com/');\n  //\
  \ --- 修正后的行 ---\nawait page.fill('[data-test=\"username\"]','standard_user';\n \
  \ await page.fill('#password', 'secret_sauce');\n  await page.getByRole('button',\
  \ { name: 'Login' }).click();\n  await expect(page).toHaveURL(/inventory.html/);\n\
  \  await expect(page).toHaveTitle('Swag Labs');\n});\n```\n\n4. **重新运行**：关闭 Inspector\
  \ 并重新运行测试。这次测试应该通过了。\n\n## 在测试代码中插入 page.pause()\n\n为了针对性调试，你可以在测试的任何地方插入 `await\
  \ page.pause()`：\n\n```\ntest('my debugging test', async ({ page }) => {\n  await\
  \ page.goto('example.com');\n  // ... 一些操作\nawait page.pause(); // 执行在此暂停并打开 Inspector\n\
  // ... 其他操作\n});\n```\n\n当你运行带有 `pause()` 的测试时，无论是否设置了 PWDEBUG，Inspector 都会打开。\n\
  \n假设你正在测试一个登录页面。你可以在导航到网站后插入 `page.pause()` 以检查表单。一旦你确认一切正常，删除 `pause` 语句即可恢复正常。\n\
  \n## 探索 UI Mode 进行调试\n\n虽然 Playwright Inspector 对于交互式执行测试非常有用，但有时你可能需要更视觉化、更直观的方式来了解发生了什么。这就是\
  \ Playwright UI 模式的用场。\n\n使用 **UI Mode** 让 Playwright 的调试变得更加视觉化。你可以逐步查看页面上发生的情况，这有助于你快速定位可能出现问题或异常情况的地方。\n\
  \nUI Mode 与 Playwright Inspector 的最大区别在于时间旅行调试（time-travel debugging）。你可以获得每个操作的完整视觉时间轴，并在每一步都有\
  \ DOM 快照。你可以滚动时间轴查看过去时刻的页面状态，这对于理解 UI 如何演变非常有价值。\n\nUI Mode 还通过其**监听模式**帮助你更快迭代。在监听模式下，每当检测到代码更改时，Playwright\
  \ 会自动重新运行测试。这节省了大量时间：编辑后无需手动重启测试。你只需调整代码并立即查看结果。\n\n最后，所有重要的调试信息（如 DOM、控制台日志、网络请求、错误和源代码）都整合在一个方便的界面中。\n\
  \n## 启动 UI Mode\n\n要启动 UI Mode，请在终端运行以下命令：\n\n```\nnpx playwright test --ui\n```\n\
  \n将在浏览器中打开一个的 Playwright 测试运行窗口，你可以在其中执行以下操作：\n\n\n\n\n\n* 查看你的测试列表\n* 点击运行单个测试或测试组\n\
  * 查看实时日志和执行跟踪\n\n![图 8.4：Playwright 的 UI 模式](img/B34148_084.png)\n\n### 图 8.4：Playwright\
  \ 的 UI 模式\n\n当测试在浏览器中运行时，你可以实时观察每一步的展开。这种实时视图对于发现不稳定的（flaky）行为或可能在无头（headless）模式下被遗漏的复杂计时问题非常有帮助。\n\
  \n你可以使用渲染截图上方的标签页重新查看单个步骤，并检查每个操作之前、执行期间和之后的状态，这让你详细了解底层正在发生的情况。\n\n只需点击每个步骤即可查看问题具体出在何。这对于捕捉其他难以定位的选择器、断言或计时问题非常有用。\n\
  \n使用 UI 模式的一个优势是它可以非常清晰地揭示与依赖项相关的失败。现在，如果项目依赖项出现故障（例如库更新更改了预期的行为），你可以立即看到失败发生的位置和原因。视觉时间线、控制台日志和网络跟踪都会突出显示失败的确切点。\n\
  \n有时，即使是编写得最好的测试，事情也会出错。当这种情况发生时，拥有失败的视觉快照可以改变游戏规则。\n\n## 为失败的测试捕截图\n\n在调试时，对失败的测试进行截图非常有帮助。你不再仅仅是阅读堆栈跟踪（stack\
  \ trace），而是获得程序出错时应用程序外观的视觉快照，这使得追踪问题变得容易得多。\n\n让我们来看看 Playwright 如何实现这一点，以及一些你可以使用的常用设置和最佳实践。\n\
  \n## Playwright 内置的失败时截图功能\n\nPlaywright Test 提供了一种简单的方法来专门为失败的测试配置截图捕捉。这在你的 `playwright.config.ts`\
  \ 文件的 `use` 部分中完成：\n\n```\n// playwright.config.ts\nimport { defineConfig } from\
  \ '@playwright/test';\nexport default defineConfig({\n  use: {\n    // 在每个测试失败后捕捉截图。\n\
  \    screenshot: 'only-on-failure',\n    // 你也可以在这里配置其他录制选项，\n    // 比如视频或跟踪，这些对调试也非常有用。\n\
  \    // video: 'on-first-retry', // 示例：在第一次重试时录制视频\n    // trace: 'on-first-retry',\
  \ // 示例：在第一次重试时记录跟踪\n  },\n});\n```\n\n`screenshot` 属性允许你使用几个选项：\n\n* `'off'`（默认）：不自动拍摄截图。\n\
  * `'on'`：无论成功失败，都会为每个测试拍摄截图。这对于视觉回归测试或详细文档很有用，但它会生成很多文件。\n* `'only-on-failure'`：这是调试失败测试最常用且推荐的选项。Playwright\
  \ 会在测试失败时自动对页面截图。截图将保存在你的 `test-results` 目录（或你配置的任何输出目录）。\n* `'on-first-retry'`（从\
  \ Playwright 1.49 开始）：如果你为测试配置了重试（retries），此选项仅会在测试的第一次失败时捕捉截图，即使设置了多次重试。这有助于避免为同一个失败的每次重试尝试生成冗余截图。\n\
  \n因此，与其尝试从日志中在脑中重构测试失败，不如截图提供的即时的视觉证据，通常能更快地定位根源。\n\n此外，在与开发或其他 QA 团队成员共享测试失败报告时，包含截图会让他们更容易理解和复现问题。\n\
  \n## 截图保存在哪里？\n\n当启用 `screenshot: 'only-on-failure'`（或 `'on'` 或 `'on-first-retry'`）时，Playwright\
  \ 默认将截图保存在 `test-results` 目录中。在 `test-results` 内部，你通常会为每个测试运行找到一个文件夹，并在其中找到单个测试的文件夹。截图将具有描述性命名，通常包含浏览器名称。\n\
  \n这是一个示例路径：\n\n`test-results/example-should-log-in-successfully-chromium/test-finished-1.png`\n\
  \n## 手动截图\n\n虽然 `screenshot: 'only-on-failure'` 选项对于通用测试失败非常好，但你可能处于某些场景，希望获得更细粒度的控制，或者在测试逻辑中的特定点捕捉截图，无论测试最终是否失败。\n\
  \n你可以使用 `page.screenshot()` 或 `locator.screenshot()` 来实现：\n\n```\nimport { test,\
  \ expect } from '@playwright/test';\ntest('我的自定义截图测试', async ({ page }) => {\n \
  \ await page.goto('https://playwright.dev/');\n  try {\n    // 断言某些可能失败的内容\n   \
  \ await expect(page.locator('#undefined!')).toBeVisible();\n  } catch (error) {\n\
  \    // 如果断言失败，拍摄自定义截图\n    await page.screenshot({ path: 'shot.png', fullPage:\
  \ true });\n    console.error('测试失败，已拍摄自定义截图！');\n    // 抛出错误以确保测试被标记为失败\n    throw\
  \ error; \n  }\n});\n```\n\n你可以对 `page.screenshot()` 和 `locator.screenshot()` 使用以下参数：\n\
  \n* `path`（字符串）：保存截图的文件路径。\n* `fullPage`（布尔值）：是否对整个可滚动页面进行截图（默认：`false`，对视口进行截图）。\n\
  * `clip`（对象）：一个定义用于裁剪截图的矩形区域的对象（例如 `{ x, y, width, height }`）。\n* `omitBackground`（布尔值）：隐藏白色背景并允许捕捉透明度截图。\n\
  * `quality`（数字）：图像质量，范围 0-100。不适用于 PNG 。\n* `type`（'jpeg'` 或 `'png'`）：图像格式。\n\n\
  Playwright 的 HTML 报告对于查看测试结果非常出色，它会将失败时拍摄截图直接嵌入报告中，提供无缝的调试体验。\n\n运行以下命令打开报告：\n\n\
  ```\nnpx show-report\n```\n\n# 录制测试运行视频\n\n当测试失败时，即使它通过了但你想视觉验证流程，拥有视频录制也会非常有见解。视频提供了用户交互和应用程序响应的时间线，这更容易定位失败的时刻和原因。\n\
  \n即使对于成功的测试，视频也可以帮助你确认测试执行了预期操作且 UI 行为符合预期。幸运的是，Playwright 提供了一种简单的方法来配置视频录制。\n\n\
  ## 配置视频录制\n\n在 `playwright.config.ts` 中添加以下内容：\n\n```\nimport { defineConfig } from\
  \ '@playwright/test';\nexport default defineConfig({\n  use: {\n    // ... 其他配置\n\
  \    video: {\n      mode: 'on',\n      // 可选：指定视频分辨率\n      size: { width: 1280,\
  \ height: 720 },\n    },\n    // 你还需要为视频指定一个目录\n    contextOptions: {\n      recordVideo:\
  \ {\n        dir: 'test-results/my-videos/', // 输出目录\n      },\n    },\n  },\n \
  \ // ... 其他配置\n});\n```\n\n让我们仔细查看一下参数：\n\n* `mode`：视频的 `mode` 选项可能有以下参数：\n\n  \
  \  * `'off'`（默认）：不录制视频。\n    * `'on'`：无论成功失败，都会为每次测试运行录制视频。这会产生大量的视频文件。\n\n\n\n\n\
  \n- `'retain-on-failure'`: 为每个测试录制视频，但只保留失败测试的视频文件。成功的测试视频将被自动删除。这通常是一个很好的平衡。\n\
  - `'on-first-retry'`: 仅在测试进行首次重试时录制视频。如果你只想获取不稳定性测试（flaky tests）的视频，这非常有用。\n- `size`:\
  \ 你可以指定录制视频的 `width` 和 `height`。如果不指定，Playwright 默认使用视口大小并缩放以适应 800x800。通常将其设置为与你所需的测试视口大小匹配，以便获得更清晰的录制效果。\n\
  - `dir`（在 `contextOptions.recordVideo` 中）：你可以指定 Playwright 保存录制视频文件的目录。Playwright\
  \ 会为每个视频生成唯一名称。请注意，这不是强制要求的，但如果你想在 HTML 测试报告之外查看视频，则这个设置非常有用。如果不设置，视频将根据视频模式选项保存到\
  \ `playwright-report` 文件夹中。\n\n在 Node.js 中，你可以在特定的浏览器上下文中录制操作：\n\n```\nimport {\
  \ chromium } from 'playwright';\n(async () => {\n  const browser = await chromium.launch();\n\
  \  const context = await browser.newContext({\n    recordVideo: {\n      dir: 'test-results/my-videos/',\
  \ \n      size: { width: 1280, height: 720 }, \n    },\n  });\n  const page = await\
  \ context.newPage();\n  // 在此处编写自动化步骤\nawait page.goto('https://playwright.dev/');\n\
  \  await page.getByText('Get started');\n  // ...\n// 重要：视频在浏览器上下文关闭时保存。\n// 请确保关闭上下文和浏览器。\n\
  await context.close();\n  await browser.close();\n})();\n```\n\n此脚本会自动启动浏览器，并将浏览器上下文中执行的所有操作（包括导航、点击等）录制为视频，并在完成后将该视频保存到\
  \ `test-results/my-videos/` 目录。\n\n在这种手动方法中，你需要显式地关闭 `context` 以确保视频文件被保存。如果你的代码没有录制视频，可能是因为自动化脚本中的运行时错误阻止了\
  \ `context.close()` 命令的执行。从检查控制台错误消息开始，以识别无效选择器或网络错误等问题。此外，确保保存视频的目录已存在且可写。\n\n\
  ## 访问录制的视频\n\n在测试运行（或手动执行）后，视频文件将位于你指定的目录（例如 `test-results/videos/`）。Playwright\
  \ 为这些文件分配唯一名称（例如 `128d168173888fb.webm`）。\n\n对于多页面场景或当你需要特定视频的路径时，可以通过 `page.video()`\
  \ 对象访问它：\n\n```\nimport { test } from '@playwright/test';\ntest('my test with video',\
  \ async ({ page }) => {\n  await page.goto('https://playwright.dev/');\n  // ...\
  \ 测试步骤\n// 获取此页面视频文件的路径\nconst videoPath = await page.video()?.path();\n  console.log(`Video\
  \ saved at: ${videoPath}`);\n});\n```\n\n在运行此代码之前，确保已在 `playwright.config.ts` 文件中启视频录制。\n\
  \n在录制测试视频时，留意文件大小很重要。视频可能会占用大量的磁盘空间，特别是对于较长的测试运行或以较高分辨率录制时。为了帮助管理，你可能希望使用 `'retain-on-failure'`\
  \ 或 `'on-first-retry'` 设置，它们只在真正需要时才保存视频。\n\n录制确实会带来微小的性能影响。虽然影响通常很小，但值得注意，特别是当你正在处理大型测试套件时。\n\
  \n此外，记住定期清理你的 `test-results/videos` 目录。如果你使用 `'on'` 模式（录制所有测试运行），该文件夹可能会迅速充满，因此偶尔进行清理大有益。\n\
  \n最后，测试视频通常以 WebM 格式保存。好消息是，大多数现代浏览器和媒体播放器都能轻松处理这种格式，因此你应该轻松地查看录制内容。\n\n# 总结\n\n\
  到目前，你已经看到了无头模式（headless mode）如何提高速度，这在你运行大量测试或在 CI 流水中工作时非常好。但当你需要直观地看到发生了什么时，有头模式（headful\
  \ mode）可以提供支持。Playwright 让你能够轻松在无头和有头模式之间切换，根据你是为了优化速度还是调查测试行为来提供灵活性。\n\n虽然无头模式提供了\
  \ CI 流水和大型测试套件理想的性能优势，但有头模式在开发和故障排除需要视觉反馈时表现优异。诸如 **Playwright Inspector** 和 **UI\
  \ Mode** 等工具提供了对测试执行的深度见解。\n\n此外，Playwright **捕获截图、录制视频并生成详细报告**的能力让你能够更有效地追踪和记录失败情况。\n\
  \n掌握了这些技能，你已经在迈向编写更快、更易调试的测试的道路上了。，我们将深入探讨 Web 无障碍访问测试。\n\n## 获取本书的 PDF 版本和独家额外内容\n\
  \n扫描二维码（或访问 [packtpub.com/unlock](https://packtpub.com/unlock)）。\n\n\n\n\n\n`A11y`\
  \ 是 `accessibility`（无障碍）一词常用的缩写或数字词。`11` 指的是 `accessibility` 中第一个字母 `a` 和最后一个字母\
  \ `y` 之间有 `11` 个字母。你经常会看到技术、设计和 Web 开发领域的人士使用这个词来讨论如何让网站、App 和数字内容对所有人（无论其能力如何）都易使用。\n\
  \n通过在每次代码提交时运行检查，你可以在进入生产环境之前发现并修复无障碍漏洞。这节省了时间和金钱。虽然自动化工具无法发现所有问题（用户体验流程仍需手动测试），但\
  \ `axe-core` 可以检测出 50% 以上的 `WCAG` 问题且不会产生误报。\n\n结果会直接提供在你的测试日志中，并指向失败的具体元素和规则，这使得调试变得非常直观。\n\
  \n## 将 axe-core 集成到 Playwright\n\n在本章中我们将使用的关键工具是 `axe-core` 和 `@axe-core/playwright`：\n\
  \n*   `axe-core`: 这是一个 JavaScript 库，可以注入到任何网页中，根据 `WCAG` 标准的一套全面的无障碍规则分析其内容。\n*\
  \   `@axe-core/playwright`: 这是官方社区包，在 Playwright 的浏览器自动化能力与 `axe-core` 引擎之间提供了一个无缝桥接。它简化了在\
  \ Playwright 测试中注入 `axe` 并获取结果的过程。\n\n将 Playwright 与 `axe-core` 配合使用，可以轻松地在测试内部运行无障碍检查。这样，你就可以掌握诸如\
  \ `WCAG`、`Section 508` 等关键标准。通过尽早运行这些检查，你可以在常见问题进入生产环境之前捕捉它们，例如缺失 alt 、错误的 `Accessible\
  \ Rich Internet Applications` (`ARIA`) 角色或颜色对比度低等。\n\n此外，它的扩展性良好。你可以轻松将 `axe-core`\
  \ 集成到你的 CI/CD 流水线中，使无障碍测试成为发布流程的持续部分，而不是事后补救。\n\n## 编写分析整个页面的测试\n\n开始之前，只需将 `@axe-core/playwright`\
  \ 包作为开发依赖添加到你的项目中即可：\n\n```\nnpm install @axe-core/playwright --save-dev\n```\n\n\
  现在，让我们创建一个创建一个新的测试文件 `tests/accessibility.spec.ts`。我们将编写一个测试，导航到 [wikipedia.org](https://www.wikipedia.org/)\
  \ 并检查其是否有无障碍违反项。此测试将分析整个页面并在发现任何违反项时失败：\n\n```\nimport { test, expect } from '@playwright/test';\n\
  import AxeBuilder from '@axe-core/playwright';\ntest.describe('Accessibility Tests',\
  \ () => {\n  test('should pass accessibility scan', async ({ page }) => {\n    //\
  \ 导航到页面\nawait page.goto('https://www.wikipedia.org/');\n    // 运行 axe-core 无障碍扫描\n\
  const results = await new AxeBuilder({ page })\n      .withTags(['wcag2aa', 'section508'])\
  \ \n      .analyze();\n    // 记录违反项以便调试\nif (results.violations.length > 0) {\n\
  \      console.log('Accessibility violations:', results.violations);\n    }\n  \
  \  // 断言没有违反项\nexpect(results.violations).toEqual([]);\n  });\n});\n```\n\n这个测试能够通过是因为\
  \ [wikipedia.org](https://www.wikipedia.org/) 没有任何无障碍问题。但如果你在一个存在无障碍问题的网站上运行测试，Playwright\
  \ 将直接在你的控制台中列出所有违反项。例如，测试 `sweetshop.netlify.app` 的结果显示了几个无障碍问题：\n\n```\nAccessibility\
  \ violations: [\n  {\n    id: 'color-contrast',\n    impact: 'serious',\n    tags:\
  \ [\n      'cat.color',\n      'wcag2aa',\n      'wcag143',\n      'TTv5',\n   \
  \   'TT13.c',\n      'EN-301-549',\n      'EN-9.1.4.3',\n      'ACT'\n    ],\n \
  \   description: 'Ensure the contrast between foreground and background colors meets\
  \ WCAG 2 AA minimum contrast ratio thresholds',\n    help: 'Elements must meet minimum\
  \ color contrast ratio thresholds',\n...\n```\n\n无障碍扫描过程的核心始于 `AxeBuilder` 构造函数，它为你正在测试的\
  \ Playwright 页面设置了扫描任务。为了关注特定的无障碍标准，你可以使用 `withTags()` 方法来过滤正在检查的规则（我们稍后会讨论无障碍标准）。一旦配置完成，调用\
  \ `analyze()` 就会运行实际扫描并返回一个 `results` 对象。\n\n在该对象内部，你会找到 `results.violations`，它是一个包含发现的任何无障碍问题的数组。每个违反项都包含了实用的细节，如问题的描述、受影响的元素以及修复建议。\n\
  \n如果现在代码还不完全理解，没关系。随着你继续阅读本章节，一切都会变得清晰得多。\n\n# 理解 WCAG 合规性\n\n包容性意味着确保每个人都能访问和使用你的网站，无论他们如何与网站交互。这包括依赖屏幕阅读器的人、仅使用键盘进行导航的人，或依赖其他辅助技术的人。\n\
  \n还有一些重要的法律要求需要考虑。在世界许多地方，例如美国的 `Section 508` 和欧洲的 `EN 301 549`，网站被要求符合 `WCAG` 之类的无障碍标准。保持合规有助于确保你的网站处于法律允许范围内。\n\
  \n`WCAG` 由万维网联盟联盟 (`W3C`) 开发，提供了一个让内容无障碍的框架，主要通过组织在四个原则下的成功准则来实现：`感知、可操作、可理解和健壮`\
  \ (`POUR`)。\n\n除了规定，改进无障碍还能提升整体用户体验。清晰的导航、可读的文本和贴心的设计让所有人受益，而不仅仅是残障人士。它让每个人都更加愉快。\n\
  \n最后，解决无障碍问题有助于保护你的品牌不受潜在的法律问题或负面影响。让内容无障碍不仅是正确的做法，还能避免法律麻烦，并让每个人信任信任你提供的内容。通过优先考虑无障碍，你向观众展示了你的关注。\n\
  \nW3C 是一个国际社区，开发开放标准以支持 Web 的长期增长，并确保其跨平台无缝运行。`WCAG` 是 `W3C` Web 无障碍倡议 (`WAI`) 发布的标准之一。\n\
  \n## WCAG 结构\n\n`WCAG` 按分级结构组织：\n\n*   原则 (Principles)：最高层是四个原则，通常用缩写 `POUR` 记忆：\n\
  \    *   感知 (Perceivable)：信息和界面组件必须以用户可以感知的方式呈现。这意味着为视觉和听觉内容提供替代方案（例如图像的 alt 文本和视频的字幕）。\n\
  \    *   可操作 (Operable)：界面组件和导航应该是可操作的。这确保用户无论使用什么输入方式都能与网站交互（例如键盘导航和语音命令）。\n  \
  \  *   可理解 (Understandable)：信息和用户界面的操作是可以理解的。这关注清晰的语言、可预测的功能和一致的导航。\n    *   健壮\
  \ (Robust)：内容必须足够健壮，以便被各种用户代理（包括辅助技术）可靠地解释。这意味着正确使用 Web 标准，以便内容在技术演进时仍然保持无障碍。\n\
  *   指南 (Guidelines)：在每个原则下都有指南，它们是对无障碍目标的更广泛的陈述。例如，在“感知”下有一个关于“文本替代”的指南。这些指南本身无法直接测试，但为成功准则提供了框架。\n\
  \n\n\n\n\n-   成功标准：这些是具体的、可测试的陈述，定义了为了满足指南需要执行的操作。它们被设计为技术中立，这意味着它们适用于各种网络技术。\n\n\
  ## 合规级别\n\nWCAG 成功标准分为三个合规级别，它们是相互叠加的：\n\n-   **A 级（最低级）**：这是最基础的无障碍级别。它解决了可能导致某些残障用户难以或无法访问网站的主要障碍。满足\
  \ A 级标准对于网站被认为具有无障碍性关重要，但它并没有消除所有障碍。\n    -   **示例**：为非文本内容（如图像）提供替代文本（alt text）（`成功标准\
  \ 1.1.1：非文本内容`）。\n\n-   **AA 级（推荐级）**：这是最常见的目标级别，通常是无障碍法律和法规的要求（美国的 `Section 508`\
  \ 和欧洲的 `EN 301 549`）。AA 级包含所有 A 级标准，以及额外的标准，用于增强更广泛范围用户的无障碍体验并提供更好的用户体验。\n    -\
  \   **示例**：确保文本和带有文本的图像具有最小对比度（`成功标准 1.4.3：对比度（最小）`）；使内容在不需要二维滚动条的情况下进行重流（`成功标准\
  \ 1.4.10：重流`）。\n\n-   **AAA 级（最高级）**：这是最高且最全面的合规级别。达到 AAA 级意味着满足所有 A 级和 AA 级标准，加上提供最高级别无障碍性的额外标准。虽然这非常理想，但对于所有类型的网络内容来说并不总是可行或可实现的，WCAG\
  \ 本身也没有将其作为通用规则推荐。\n    -   **示例**：为预制的音频内容提供手语翻译（`成功标准 1.2.6：手语（预录制）`）；确保文本具有更高的对比度（`成功标准\
  \ 1.4.6：对比度（增强）`）。\n\nWCAG (`https://www.w3.org/TR/WCAG22/`) 随着时间的演进。WCAG 2.0、2.1\
  \ 和 2.2 都是当前标准，新版本增加了额外的成功标准以应对新兴技术和用户需求（例如移动端无障碍和认知障碍）。WCAG 2.2 是目前的最新版本。\n\n##\
  \ 自定义 axe 规则\n\n`AxeBuilder` 中的 `withTags()` 方法允许你通过过滤应用的规则来定制你的无障碍扫描。通过指定标签，你可以将扫描限制为与特定\
  \ WCAG 版本和级别（如 A 级或 AA 级）或其他类别（如最佳实践）相关的规则。当你努力符合特定标准（例如 WCAG 2.1 Level AA）时，这特别有帮助，因为这通常是法律或组织的要求。\n\
  \n与其手动寻找合规要求的正确标签，大多数团队都采用了标准的配置方案（profile）。使用配置文件可以轻松维护一致性，并确保你针对的是正确的无障碍级别：\n\n\
  | 配置文件策略 | 使用的标签 | 适用场景 |\n| :--- | :--- | :--- |\n| 标准基准 | `['wcag21aa']` | 默认选项。这针对\
  \ WCAG 2.1 AA。它是大多数组织的当前法律标准，涵盖了 A 和 AA 规则。 |\n| 增强质量 | `['wcag21aa', 'best-practice']`\
  \ | 推荐。将法律基准与行业认可的最佳实践（如严格的标题层级）相结合，以提高实际用户体验。 |\n| 面向未来 | `['wcag22aa']` | 前瞻性。针对较新的\
  \ WCAG 2.2 AA 标准。如果你想为应用程序即将到来的监管变化做准备，请使用此项。 |\n\n表 9.1：AxeBuilder 无障碍扫描常用标签配置。\n\
  \n如果你需要构建自定义配置文件，以下是各个标签的含义：\n\n-   `wcag2a`：指 WCAG 2.0 或 2.1 的 A 级合规。它代表了最低的无障碍级别，解决了基本需求（例如为非文本内容提供替代文本），但它不能确保所有用户都能完全无障碍访问。\n\
  -   `wcag2aa`：指 WCAG 2.0 或 2.1 的 AA 级规则，包括 A 级要求以及额外的标准（例如足够的颜色对比度）。这通常是许多组织的目标，因为它提供了稳健的无障碍级别，而不会像\
  \ AAA 级那样严格。\n-   `wcag21a`：专门针对 WCAG 2.1 A 级规则。WCAG 2.1 在 WCAG 2.0 的基础上增加了用于处理移动端无障碍、低视和认知障碍的标准。\n\
  -   `wcag21aa`：针对 WCAG 2.1 AA 级规则，将 WCAG 2.1 A 级与额外的 AA 级要求相结合。\n-   `wcag22aa`：针对\
  \ WCAG 2.2 AA 级规则。WCAG 2.2 是一个较新的标准，`axe-core`（4.5 及更高版本）包含了对这些规则的支持，这对于无障碍工作的前瞻性非常有帮助。\n\
  -   `best-practice`：指未严格绑定到 WCAG 成功标准的规则，但代表了提高无障碍性的行业认可实践，例如确保每个页面都有 `h1` 标题。这些对于在满足最小合规要求之外增强用户体验很有帮助。\n\
  \n请记住，WCAG 级别是累积的。如果你目标是 AA 级，则 A 级的规则会自动包含在内。你不需要同时指定两者。\n\n确保网络无障碍对于创建包容性数字体验至关重要。正如我们所看到的，WCAG\
  \ 为实现这一点提供了一个全球认可的标准，但手动检查合规性可能会非常耗时。这就是自动化的优势。\n\n# 编写 WCAG 自动化测试\n\n通过集成 Playwright\
  \ 和 `axe-core`，你可以简化 WCAG 测试。这种组合允许你在测试流水线中自动为网络应用程序扫描各种无障碍问题。\n\n## 利用 axe-core\
  \ 进行 WCAG 2.1 AA 审计\n\n假设你正在测试一个网站并想要确保它符合 WCAG 2.1 AA；可以使用以下代码：\n\n```javascript\n\
  import { test, expect } from '@playwright/test';\nimport AxeBuilder from '@axe-core/playwright';\n\
  test('Check for WCAG 2.1 A and AA compliance', async ({ page }) => {\n  await page.goto('https://amazon.com');\n\
  \  //  axe-core 无障碍扫描\n  const results = await AxeBuilder({ page })\n    .withTags(['wcag21a',\
  \ 'wcag21aa'])\n    .analyze();\n  // 调试违规项\n  if (results.violations.length > 0)\
  \ {\n    console.log('Accessibility violations:', results.violations);\n  }\n  //\
  \ 断言没有违规\n  expect(results.violations).toEqual([]);\n});\n```\n\n在此代码中，`withTags(['wcag21a',\
  \ 'wcag21aa'])` 确保只检查与 WCAG 2.1 A 和 AA 相关的规则，如果没有发现违规，则测试通过。\n\n请记住，如果你检查 `wcag21aa`\
  \ 合规性，也会自动检查 `wcag21a`，因为 AA 级包含了所有的 A 级要求。这意味着你可以在代码的 `withTags()` 方法中省略 `wcag21a`\
  \ 而不会遗漏任何 A 级检查：\n\n```javascript\nimport { test, expect } from '@playwright/test';\n\
  import AxeBuilder from '@axe-core/playwright';\ntest('Check for WCAG 2.1 A and AA\
  \ compliance', async ({ page }) => {\n  await page.goto('https://amazon.com');\n\
  \  const results = await AxeBuilder({ page })\n    .withTags(['wcag21aa'])\n   \
  \ .analyze();\n  if (results.violations.length > 0) {\n    console.log('Accessibility\
  \ violations:', results.violations);\n  }\n  expect(results.violations).toEqual([]);\n\
  });\n```\n\n结果是相同的。\n\n\n\n\n\n需要注意的一点细节是，`wcag2a` 和 `wcag2aa` 等标签可能同时适用于 WCAG 2.0\
  \ 和 2.1，因为 WCAG 2.1 与 2.0 向后兼容。然而，指定 `wcag21a` 或 `wcag21aa`可以确保你关注的是 WCAG 2.1 特有的规则。同样，`wcag22aa`\
  \ 对于目标为 WCAG 2.2 的项目，`axe-core` 在较新版本（4.5 及以上）中已支持该标准。\n\n当你希望超越 WCAG 要求，通过添加额外的建议来提高可访问性（尽管这些建议并非合规性强制）时，`best-practice`\
  \ 标签就非常有用。请记住，使用此标签可能会突出显示并非实际的 WCAG 违规项，但仍可能影响整体用户体验。\n\n如果你在预期看到问题时违规列表为空，请尝试进行几次快速检查：确保标签名称正确，确认页面内容确实与你测试的规则相关，并双击检查使用的\
  \ `axe-core` 版本是否支持你想要的标准。\n\n在测试动态内容时，确保在扫描之前所有内容已完全加载。Playwright 的 `waitForLoadState('networkidle');`\
  \ 方法可以帮助这一点，确保在运行可访问性检查之前所有内容已显示。\n\n## 扫描范围 (Scoping the scan)\n\n限定扫描范围意味着告诉 `axe-core`\
  \ 分析或忽略 HTML 文档的哪些部分。这对于孤立测试特定组件或排除与测试无关的元素（例如，第三方广告）非常有用：\n\n*   `.include(selector)`：此方法将扫描限制在*仅匹配所提供的\
  \ CSS 选择器的元素上*。在以下示例中，`.include('form')` 告诉 `axe-core` 只分析 `<form>` 元素及其子元素。页面的其他部分都会被忽略。\n\
  *   `.exclude(selector)`：此方法扫描整个页面，*排除匹配 CSS 选择器的元素*。在以下示例中，使用 `.exclude('.ad-banner')`\
  \ 来跳过带有 `ad-banner` 类的元素，这些元素可能不在开发团队的控制范围内。\n\n这是一个示例：\n\n```\nimport { test, expect\
  \ } from '@playwright/test';\nimport AxeBuilder from '@axe-core/playwright';\ntest('should\
  \ analyze accessibility of the form and exclude the ad banner', async ({ page })\
  \ => {\n  await page.goto('https://demoqa.com/automation-practice-form');\n  const\
  \ results = await new AxeBuilder({ page })\n    .include('form')        // 只分析 'form'\
  \ 内部的元素\n    .exclude('.Google-Ad')  // 跳过带有 .Google-Ad 类的元素    .analyze();\n//\
  \ 记录违规情况以便调试/报告\nif (results.violations.length > 0) {\n    console.log('Accessibility\
  \ Violations found:');\n    results.violations.forEach(violation => {\n      console.log(`-\
  \ ${violation.id}: ${violation.description}`);\n      console.log(`  Help: ${violation.helpUrl}`);\n\
  \      console.log('  Nodes:', violation.nodes.map(node => node.html).join('\\n'));\n\
  \      console.log('---');\n    });\n  }\n  // 如果发现违规，此测试将失败并列出它们。\nexpect(results.violations).toEqual([]);\n\
  });\n```\n\n通过调用 `.include('form')`，我们告诉 `axe-core` 只关注 `<form>` 元素及其内部的所有内容，而忽略页面的其他部分。然后，通过\
  \ `.exclude('.Google-Ad')`，我们进一步微调了扫描，跳过任何带有 `Google-Ad` 类的元素，即使它们在表单内部。\n\n这对于避免开发者可能无法控制的广告等内容非常有用。`.analyze()`\
  \ 方法根据这些规则运行扫描并给出结果。这样，测试就能保持集中且高效，只检查页面上最重要的部分。\n\n在这个示例中，我们还包含了以下代码，用于检查由 Axe\
  \ 分析返回的 `results` 对象是否包含任何可访问性违规。如果 `violations` 数组不为空（意味着发现了违规），它会将每个违规项的信息打印到控制台上。这对于调试和报告非常有用，因为它清晰地列出了你需要修复的具体问题。\n\
  \n这部分代码提供了你所需的所有细节，例如：\n\n*   问题的 ID：它会告知你违反了哪条特定规则（例如 `color-contrast`）\n*   问题的描述：它提供了对错误的错误的快速概述\n\
  *   更多帮助的链接：`axe-core` 的优秀之处在于它提供了一个可以点击的链接，以学习更多关于违规的信息以及如何修复\n*   特定的 HTML 元素：它向你展示了页面代码中导致问题的精确部分\n\
  \n因此，虽然 `expect(results.violations).toEqual([]);` 这一行是正式导致测试失败的原因，但日志部分提供了你真正去修复问题所需的信息。\n\
  \n你可以使用一个名为 `Playwright Accessibility MCP Server` 的 `npm` 插件，它允许直接在支持聊天的 IDE 中通过\
  \ Playwright + Axe 运行可访问性检查。这对于探索性测试特别有帮助，因为由 MCP 驱动的编辑器和聊天界面让整个过程感觉非常敏捷。但对于持续的自动化覆盖，你仍然需要在代码库中实现脚本化的\
  \ Playwright + Axe 测试，以便它们可以在 CI 中一致运行并提供持续反馈。\n\n## 使用自定义规则 (Using custom rules)\n\
  \n你还可以控制 `axe-core` 使用哪些可访问性规则。这可以让你关注特定的问题或临时禁用不适用的规则：\n\n*   `.withRules(['rule-1',\
  \ 'rule-2'])`：配置扫描器*仅运行指定的规则*。在以下示例中，`.withRules(['color-contrast', 'image-alt'])`\
  \ 将扫描限制为检查对比度和缺失的替代文本。所有其他可访问性检查都被跳过。\n*   `.disableRules(['rule-to-disable'])`：这是\
  \ `.withRules()` 相相反。它运行 `axe-core` 的所有规则，*除了指定的规则*。这对于忽略已知问题或不适用于上下文的规则非常有用。\n\n\
  这是一个示例：\n\n```\nimport { test, expect } from '@playwright/test';\nimport AxeBuilder\
  \ from '@axe-core/playwright';\ntest('should not have violations on the page', async\
  \ ({ page }) => {\n  await page.goto('https://www.google.com');\n  const results\
  \ = await new AxeBuilder({ page })\n    // 仅检查这两个可访问性规则：\n    .withRules(['color-contrast',\
  \ 'image-alt'])\n    .analyze();\n  // 断言没有违规。\n  expect(results.violations).toEqual([]);\n\
  });\n```\n\n为了保持标准一致，可以考虑定义一个用于构建和配置 `AxeBuilder` 的具件 (fixture)。这样，你就可以避免在测试中重复设置，并获得一致的基准（标签、排除的选择器等），同时允许特定的测试调整（如\
  \ `include()`）。你可以在 [`playwright.dev/docs/accessibility-testing#creating-a-fixture`](https://playwright.dev/docs/accessibility-testing#creating-a-fixture)\
  \ 查看如何设置。\n\n构建可访问性网站的真正工作在扫描完成后开始。下一部分将涵盖这些扫描中发现的一些常见问题。\n\n\n\n\n\n像 `axe-core`\
  \ 等自动化工具配合 Playwright 使用时，非常有利于尽早发现无障碍问题。但发现这些问题只是第一步：修复它们才能真正让你的 Web 应用程序对所有人都具有包容性且用户友好。\n\
  \n让我们来看看这些工具指出的最常见无障碍问题，并查看修复它们的实用方法，以确保你的网站符合 WCAG 标准：\n\n### 颜色对比度低\n\n* **问题所在**：与背景融合的文本可能难以阅读，特别是对于视力低或色盲的人来说是如此。WCAG\
  \ 2.1 要求普通文本的对比度至少为 4.5:1，大文本至少为 3:1。![](img/B34148_09_1.png)\n\n图 9.1：低颜色对比度文本示例\n\
  \n* **如何修复**：确保你的文本颜色和背景颜色之间有足够的对比度，以满足无障碍标准。这有助于所有人更容易地阅读你的内容。你可以使用方便的工具，例如 `AccessibleWeb’s\
  \ Contrast Checker` ([`accessibleweb.com/color-contrast-checker/`](https://accessibleweb.com/color-contrast-checker/))\
  \ 进行检查。许多设计平台也内置了对比度检查器，因此在设计过程中要尽早且利用它们。\n\n### 表单字段缺少标签\n\n* **问题所在**：当 `<input>`、`<textarea>`\
  \ 或 `<select>` 等输入字段没有适当标签时，屏幕阅读器用户不知道他们应该输入什么。\n\n* **如何修复**：使用 `for` 属性将 `<label>`\
  \ 与其输入框关联。设置 `for` 使其与输入的 `id` 值匹配，如下所示：\n\n```\n<label for=\"username\">Username:</label>\n\
  <input type=\"text\" id=\"username\">\n```\n\n另一个选项是将输入框包裹在标签标签内部，虽然这种方法较少。这里有一个示例：\n\
  \n```\n<label>Username: <input type=\"text\" id=\"username\"></label>\n```\n\n###\
  \ 图像缺少替代文本\n\n* **问题所在**：当图像没有有意义的 alt 文本，或者在应该描述某些内容时 `alt` 属性为空时，屏幕阅读器用户就会错过重要信息。\n\
  \n* **如何修复**：使用清晰、简洁的 alt 文本来解释图像显示的内容，如示例所示：\n\n```\n<img src=\"puppy.jpg\" alt=\"\
  一只金毛幼犬正在玩球。\">\n```\n\n如果图像纯粹视觉性的且没有添加实际信息，请使用空的 `alt=\"\"` 值让读者跳过它，如示例所示：\n\n```\n\
  <img src=\"spacer.gif\" alt=\"\">\n```\n\n* 对于图表等复杂图像，使用简短的 `alt` 描述，并在附近提供更多细节或链接到它。这有助于屏幕阅读器用户获取完整信息。![](img/B34148_09_2.png)\n\
  \n图 9.2：如果图像未加载，图像的 alt 属性提供了备用文本\n\n### 键盘导航问题\n\n* **问题所在**：并不是每个人都使用鼠标；有些人完全依赖键盘。如果你的网站对键盘不友好，你就在排斥这些用户。\n\
  \n* **如何修复**：让元素可聚焦。使用适当的语义化 HTML，如 `<button>`、`<a>` 或 `<input>`。如果使用非标准元素，添加 `tabindex=\"\
  0\"` 使变得可聚焦。\n\n此外，保持标签顺序的逻辑性。元素应该遵循自然流。避免设置高于 `0` 的 `tabindex` 值，因为它们会破坏导航。\n\n\
  让用户在使用键盘导航时始终能够知道自己所处的位置是非常重要的。如果浏览器的默认焦点样式不明显，添加自定义的焦点样式可以显著提高可见性。这里有一个使用 CSS 的简单示例：\n\
  \n```\n*:focus {\n  outline: 2px solid blue;\n}\n```\n\n接下来的截图展示了实现的效果：![](img/B34148_09_3.png)\n\
  \n图 9.3：自定义焦点样式帮助用户清楚地看到哪个元素当前处于激活或被选中状态\n\n### 标题结构不合理\n\n* **问题所在**：标题（`<h1>`\
  \ 到 `<h6>`）有助于组织内容并使导航更简单，特别是对于使用屏幕阅读器的人来说。如果标题缺失或顺序混乱，在浏览页面时可能会感到困惑和沮丧。\n\n* **如何修复**：从单个\
  \ `<h1>` 标题开始。这通常是页面的主标题。从这里开始，使用 `<h2>`、`<h3>` 等处理子章节。确保保持逻辑顺序：不要跳跃级别，例如不要直接从 `<h1>`\
  \ 跳到 `<h3>`。虽然这不是硬性规定，但为了清晰起见，每个页面只使用一个 `<h1>` 标题是一个好习惯。\n\n### 动态内容未被发布\n\n* **问题所在**：当应用程序在不刷新整个页的情况下更新页面内容（例如在用户提交表单后显示错误消息、显示*加载中*指示器或弹出通知）时，屏幕阅读器用户可能感知不到这些变化。这是因为屏幕阅读器通常只读取页面首次加载或用户导航到特定元素时存在的内容。\n\
  \n* **如何修复**：为了解决这个问题，你可以使用名为 `ARIA` 实时区域的功能。ARIA 是一组可以添加到 HTML 元素中的属性，用于提高无障碍支持能力。实时区域（live\
  \ region）是页面上的一个特殊区域，屏幕阅读器监控该区域的变化。当实时区域内的内容发生变化时，屏幕阅读器知道要发布它。\n\n你可以使用两种主要类型的 `aria-live`\
  \ 设置：\n\n* `aria-live=\"polite\"`：这种设置比较“温和”。它会等待屏幕阅读器用户完成当前活动（例如阅读段落或填写表单）后再发布新内容。它非常适合非紧急更新，例如加载消息。\n\
  \n* `aria-live=\"assertive\"`：这种设置更“紧急”。它会告诉屏幕阅读器中断当前正在的操作以发布新内容。它最适用于用户需要立即获知的关键消息，例如错误信息。\n\
  \n你还可以将 `aria-live` 与特定的 ARIA 角色结合，以为屏幕阅读器提供更多上下文：\n\n* `role=\"alert\"`：该角色通常配合\
  \ `aria-live=\"assertive\"` 使用，指示内容是重要且时间敏感的消息（例如验证错误）。\n\n* `role=\"status\"`：通常配合\
  \ `aria-live=\"polite\"` 使用，该角色信号提示是通用的状态更新，例如更改已保存。\n\n通过正面解决这些常见的无障碍问题，你不仅仅是在勾选选项，而是在所有人构建更好、更具包容性的\
  \ Web 体验。\n\n# 用手动无障碍测试辅助自动化工具\n\n正如我们在本章看到的，自动化工具非常擅长发现直观的问题，如缺失 alt 文本、低颜色对比度或错误的\
  \ HTML 属性（例如缺少 ARIA 标签）。它们的短板在于需要人类判断的领域。例如，链接文本是否具有描述性（**点击此处** 对比 **了解更多我们的服务**）？对于使用辅助技术的人来说，阅读顺序是否合理？交互元素仅使用键盘是否易于操作？\n\
  \n自动化工具可能会忽略动态加载内容（例如 JavaScript 驱动的界面）或更复杂交互中的问题。这就是为什么手动测试如此重要。它填补了自动化无法覆盖的空白，特别是在确保与屏幕阅读器的兼容性方面。\n\
  \n使用以下流行的屏幕阅读器测试你的应用程序：\n\n\n\n\n\n*   **NVDA** (**NonVisual Desktop Access**, Windows\
  \ 免费):[`www.nvaccess.org/`](https://www.nvaccess.org/)\n*   **VoiceOver** (macOS\
  \ 和 iOS 内置):[`support.apple.com/guide/voiceover/welcome/mac`](https://support.apple.com/guide/voiceover/welcome/mac)\n\
  *   **JAWS** (**Job Access With Speech**, Windows 付费选项):[`www.freedomscientific.com/products/software/jaws/`](https://www.freedomscientific.com/products/software/jaws/%20)\n\
  \n测试时，请关注内容传递的清晰度。确保所有文本（包括按钮、链接和表单标签）都能以清晰且有意义的方式被读出。屏幕阅读器应遵循预期的顺序，自然地穿过标题、段落和交互元素，使使用体验与页面设计保持一致。\n\
  \n图片应包含准确的替代文本（alt text），隐藏元素不应引起混淆或在内容中留下空白。\n\n仅使用 `Tab`、`Enter` 和方向键，确保每个交互元素都可以在无需鼠标的情况下触达，以便依赖键盘导航的人员也能访问网站。\n\
  \n你还需要留心管理焦点（focus）。活动元素应该有清晰的、可见的焦点指示器（例如轮廓）。焦点的移动应该是逻辑性的，特别是在网站的动态区域（如模态框或单页应用），否则导航可能会变得混乱。\n\
  \n最后，检查内容本身的清晰度。文本应该简单直白、简洁，且不包含不必要的术语，以便于理解，包括有认知障碍的用户。\n\n此外，还要测试内容在缩放时的表现。根据\
  \ WCAG 指南 `1.4.10`（`Reflow`，重流），你的内容在比例缩放至 400% 时应仍保持可读且功能正常。你可以使用浏览器的缩放工具进行测试。\n\
  \n如果你包含了任何视频等时间媒体，请确保提供准确的字幕，以符合 `1.2.2` 指南。这有助于听障或听力障碍跟随你的内容。\n\n为了使这些具有可操作性，可以使用此“冒烟测试”清单对任何新功能或页面进行快速检查：\n\
  \n*   **键盘导航（无鼠标）**:\n    *   [ ] **Tab 顺序**：是否可以通过 Tab 键遍历每个交互元素（链接、按钮和表单）？顺序是否符合视觉流？\n\
  \    *   [ ] **可见焦点**：是否始终能清晰看到哪个元素拥有焦点（例如圆圈或轮廓）？\n    *   [ ] **无陷阱**：是否仅使用键盘即可进入和退出所有元素（如模态框或视频播放器）？\n\
  \    *   [ ] **交互**：是否可以使用 `Enter` 或空格键激活按钮，并使用方向键与下拉菜单和滑块进行交互？\n*   **视觉与缩放**:\n\
  \    *   [ ] **400% 缩放**：将浏览器缩放设为 400%（或移动端宽度）。内容是否重流为单列而无需水平滚动？\n    *   [ ] **颜色与对比度**：是否存在仅通过颜色传递的错误消息或状态（例如没有文字标签的红色框）？\n\
  *   **屏幕阅读器快速检查 (NVDA/VoiceOver)**:\n    *   [ ] **有意义的序列**：打开屏幕阅读器并按 Tab 键。读出的提示合理吗？\n\
  \    *   [ ] **图片**：有意义的图片是否有描述性文本，装饰性图标是否被忽略了？\n    *   [ ] **动态内容（实时区域）**：如果状态发生更新（例如显示\
  \ `Form Submitted` 消息），屏幕阅读器会自动播放吗？\n*   **媒体**:\n    *   [ ] **字幕**：如果有视频，是否可以开启字幕且字幕是否准确？\n\
  \n最好在开发过程早期就开始运行无障碍测试。不要等等到发布阶段。这可以帮助你在此后节省时间。\n\n# 总结\n\n在本章中，我们探索了将无障碍测试引入开发工作流中具有多大的价值，特别是当将\
  \ Playwright 的自动化能力与 `axe-core` 的审计强度相结合时。这种方法帮助你及早发现无障碍问题，不仅节省了时间和精力的，还确保了你的 Web\
  \ 应用程序供所有人使用。\n\n我们还仔细查看了诸如 WCAG 等无障碍标准，将其从广泛的原则拆解为具体的成功标准，以及不同的合规级别（`A`、`AA` 和\
  \ `AAA`）。理解这一结构将为你提供创建真正包容性数字体验所需的工具。\n\n通过使用 `AxeBuilder` 的实战示例以及如 `withTags()`、`include()`\
  \ 和 `exclude()` 等方法，你已经看到了如何定制无障碍扫描，以关注特定需求，例如满足 WCAG 2.1 AA 级合规。\n\n根结底，将无障碍放在优先位置不仅仅是为了遵守规定。更是为了创造更好的体验。\n\
  \n# 10. 设置视觉回归测试\n\n现代 Web 应用程序不断演进，即使是最微小的代码更改也可能无意中影响用户界面 (**UI**)。传统的测试检查你的应用是否*可用*，而视觉回归测试则检查它的*外观*是否符合预期。这是一项强大的技术，可以在意外的\
  \ UI 变化（如未对齐的按钮或缺失图标）进入生产环境之前捕捉它们。\n\n在本章中，你将学习如何使用 Playwright 捕捉并比较截图，管理视觉差异，并将视觉测试集成到你的工作流中。\n\
  \n因此，本章将涵盖以下主题：\n\n*   视觉测试入门\n*   捕捉和比较截图\n*   管理可接受的视觉差异\n*   自动化视觉回归工作流\n*  \
  \ 如何保持视觉测试的稳定和可预测\n\n## 技术要求\n\n本章的源代码位于 `https://github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright/tree/main/Chapter10`。\n\
  \n## 视觉测试入门\n\n视觉回归测试是一种质量保证流程，用于检查应用程序中非预期的视觉变化。它不仅仅测试功能（例如，*这个按钮有效吗？*），而是验证 UI\
  \ 观是否与之前相同。\n\nPlaywright 拥有强大的内置工具来使这一过程无缝化。核心思想如下：\n\n*   **捕捉截图**：使用 `page.screenshot()`\
  \ 方法为特定元素或整个视口截屏\n*   **与基准进行对比**：Playwright 自动将此新截图与你之前批准的基准图像进行对比\n*   **生成差异图像**：如果两张图片之间存在差异，Playwright\
  \ 会生成一张*差异 (diff)* 图像，这是一种视觉叠加，使得图片之间的差异一目易见\n\n\n\n\n\n- `Report the failure`:\
  \ 测试失败，测试运行器会提供清晰的报告，包括指向新图像、基准图像（baseline）和差异图像的链接。\n\n在检测视觉变化之前，我们首先需要捕捉 UI 的外观。Playwright\
  \ 让这一切变得简单，它允许你对整个页面、特定元素或自定义区域进行截图。这些图像将成为未来测试运行中视觉对比的基础。它可以帮助你确保应用程序看起来仍然如预期所示，特别是在代码更改之后。\n\
  \n让我们探索如何截取高质量的截图、将其与基准进行比较，并理解测试何时以及为何由于视觉差异而失败。\n\n## 简单的截图（用于调试）\n\n有时你只是想截一张图用于手动检查或调试。为此，你可以使用\
  \ `page.screenshot()` 方法。该方法会将当前视口的截图保存到指定的路径。\n\n创建一个名为 `tests/example.spec.ts`\
  \ 的文件并添加以下内容：\n\n```\nimport { test, expect } from '@playwright/test';\ntest('take\
  \ a simple screenshot for debugging', async ({ page }) => {\n  await page.goto('https://playwright.dev/');\n\
  \  // 截屏并将其保存为 'playwright_homepage.png'\nawait page.screenshot({ \n    path: 'test-results/playwright_homepage.png'\
  \ \n  });\n});\n```\n\n这段代码将截取 [`playwright.dev/`](https://playwright.dev/) 的并并保存到你的\
  \ `test-results` 文件夹中。默认情况下，它只截取视口，但你可以设置 `fullPage: true` 来包含完整的滚动内容。\n\n这是一个示例：\n\
  \n```\nimport { test, expect } from '@playwright/test';\ntest('take a simple screenshot\
  \ of header', async ({ page }) => {\n  await page.goto('https://playwright.dev/');\n\
  \  // 截取整个页面的\nawait page.screenshot({ \n    path: 'test-results/playwright_homepage.png',\
  \ \n    fullPage: true \n  });\n});\n```\n\n你也可以对特定元素截图而不是整个页面。这对于测试单个组件非常有用：\n\n\
  ```\nimport { test, expect } from '@playwright/test';\ntest('take a simple screenshot\
  \ of header', async ({ page }) => {\n  await page.goto('https://playwright.dev/');\n\
  \  // 只截取 header 元素\nconst element = page.locator('header');\n  await element.screenshot({\
  \ \n    path: 'test-results/element-screenshot.png' \n  });\n});\n```\n\n这段代码将在\
  \ `test-results` 文件夹中保存一张如下的截图：\n\n![Figure 10.1: A screenshot of just the header\
  \ element from playwright.dev](img/B34148_10_1.png)\n\n图 10.1：来自 playwright.dev\
  \ 的 header 元素截图\n\n当你编写测试时，关注元素级截图是一个好主意，特别是对于较小的、隔离的组件。它们可以帮助你的测试运行得更快，并更容易发现视觉变化发生的具体位置。全页截图在某些情况下仍然有用，但它们通常更脆弱且更难排故障。\n\
  \n简单运行 `page.screenshot()` 会在你的测试报告中生成一张漂亮的图片，但它没有提供任何测试覆盖。如果你希望 Playwright 自动捕获视觉回归（布局偏移、CSS\
  \ 损坏或颜色变化），你必须使用断言方法：\n\n`await expect(page).toHaveScreenshot();`\n\n我们将在本章稍后部分深入探讨\
  \ `toHaveScreenshot()`。\n\n在使用 `page.screenshot()` 时，你有方便的选项来自定义你的截图。\n\n## 自定义截图\n\
  \nPlaywright 提供了多种参数来自定义截图，从文件路径和格式到截取的特定区域均涵盖。\n\n### 核心参数\n\n以下核心参数控制截图的保存位置、格式和基本截取选项：\n\
  \n- `path`: 指定保存截图的文件路径的字符串。文件扩展名（如 `.png` 或 `.jpeg`）将决定图像格式。如果你不提供 `path` 选项，Playwright\
  \ 将返回一个包含图像数据的缓冲区，而不是将其保存到文件。\n- `type`: 指定图像格式。可以是 `'png'` 或 `'jpeg'`。这通常从 `path`\
  \ 扩展中推断，但你也可以显式设置它。\n- `fullPage`: 布尔值。当设置为 `true` 时，Playwright 将截取整个滚动页面，而不仅仅是可见的视口。默认值为\
  \ `false`，仅截取当前显示的内容。\n- `quality`: 0 到 100 之间的整数。此选项仅适用于 `jpeg` 截图，并控制压缩质量。数字越高，图像质量越高，但文件越大。\n\
  \n### 裁剪与遮罩\n\n这些选项允许你截取页面的特定部分，或在截图过程中隐藏敏感或动态内容：\n\n- `clip`: 一个指定要截取的页面矩形区域的对象。它必须包含以下属性：\n\
  \    - `x`: 裁剪区域左上角的 `x` 坐标\n    - `y`: 裁剪区域左上角的 `y` 坐标\n    - `width`: 裁剪区域的宽度\n\
  \    - `height`: 裁剪区域的高度\n\n例如，你可以使用 `clip` 选项像所示截取页面的左上角：\n\n![Figure 10.1: A screenshot\
  \ of just the header element from playwright.dev](img/B34148_10_1.png)\n\n图 10.1：来自\
  \ playwright.dev 的 header 元素截图\n\n- `mask`: `Locator` 对象的数组。匹配这些定位器的任何元素在截图时将被粉色遮罩层覆盖。\n\
  \n### 高级自定义\n\n为了更深入的控制，这些参数允许你调整背景、缩放时间和行为：\n\n- `omitBackground`: 布尔值。当设置为 `true`\
  \ 时，Playwright 将隐藏默认白色背景，允许截取透明背景的截图。这仅支持 `png` 图像。\n- `scale`: 此参数控制截图的缩放：\n  \
  \  - `'css'`: 截图每个页面 CSS 像素一个像素。这对于在高分辨率显示上保持较小的字体有用。\n    - `'device'`: 截图每个物理设备像素一个像素。这在高\
  \ DPI 屏幕上产生更高分辨率的图像。默认值为 `'device'`。\n- `timeout`: 毫秒数。设置 Playwright 在截图之前等待页面就绪的最长时间。默认为\
  \ `30` 秒。\n- `animations`: 此参数可以设置为 `'disabled'`，在截图之前停止 CSS 动画、CSS 过渡和网络动画。默认值为\
  \ `'allow'`。\n- `caret`: 可以设置为 `'hide'` 以隐藏输入字段中的文本光标。\n\n\n\n\n\n## 比较截图（视觉回归测试）\n\
  \n比较截图是捕捉视觉变化的极佳方法。让我们逐步通过一个简单的示例。在这里，我们将使用 [`practicesoftwaretesting.com/`](https://practicesoftwaretesting.com/)\
  \ 并与其带有 Bug 版本进行比较：[`with-bugs.practicesoftwaretesting.com/#/`](https://with-bugs.practicesoftwaretesting.com/#/)。\n\
  \n### 第一步：首次运行（创建黄金快照）\n\n创建一个名为 `tests/example.spec.ts` 文件并添加以下内容：\n\n```\nimport\
  \ { test, expect } from '@playwright/test';\ntest('Homepage should look the same',\
  \ async ({ page }) => {\n  await page.goto('https://practicesoftwaretesting.com/contact');\n\
  \  // 这就是魔法所在行！\nawait expect(page).toHaveScreenshot('homepage.png');\n});\n```\n\
  \n`toHaveScreenshot()` 断言几乎不需要任何设置即可轻松实现截图比较。以下是第一次运行它时发生的情况（因为还没有基准图像）：\n\n1. Playwright\
  \ 拍摄一张截图。\n2. 将其保存在特殊的快照文件夹中。\n3. 测试失败（这是故之意的，因为还没有可以用来比较的内容）。\n\n现在，你可以使用以下命令运行测试：\n\
  \n```\nnpx playwright test\n```\n\n你会在输出中看到类似的内容：\n\n```\nRunning 1 test using 1\
  \ worker \n✓ tests/example.spec.ts:4 ' Homepage should look the same (5s) \n> Error:\
  \ A snapshot doesn't exist at tests\\example.spec.ts-snapshots\\homepage-chromium-win32.png,\
  \ writing actual.\n```\n\n文件名包含了浏览器（`chromium`）和你的操作系统（在这种情况下 Windows 为 `win32`）。这样，你的快照始终与正确的环境进行比较。\n\
  \n为你的快照使用清晰且具描述性的名称。不要使用模糊的名称（如 `test1.png`），而是使用像 `checkout-summary-error.png`。这让你更容易理解每个快照代表什么，特别是当你与团队一起审查测试结果或报告时。\n\
  \n### 第二步：后续运行（比较）\n\n现在你已经有了黄金快照，再次运行测试：\n\n```\nnpx playwright test\n```\n\n从现在起，每次运行都会执行以下操作：\n\
  \n* 在内存中拍摄新截图\n* 与磁盘上对应的黄金快照进行逐像素比对\n* 如果它们匹配（或差异足够小以符合你设置的阈值），则测试通过\n\n### 第三步：处理失败（当\
  \ UI 发生变化时）\n\n如果你的 UI 与基准不同，测试将失败，Playwright 会准确告诉你发生了什么变化。\n\n例如，你可能会看到这样的消息：\n\
  \n```\n9301 pixels (ratio 0.02 of all image pixels) are different.\n```\n\n让我们更新测试以使用\
  \ Bug 站点，这样就可以看到实际效果。在 `tests/example.spec.ts` 中，将其更改为：\n\n```\nimport { test, expect\
  \ } from '@playwright/test';\ntest('Homepage should look the same', async ({ page\
  \ }) => {\n  await page.goto('https://with-bugs.practicesoftwaretesting.com/#/contact');\n\
  \  await expect(page).toHaveScreenshot('homepage.png');\n});\n```\n\n现在，运行 `report`\
  \ 命令：\n\n```\nnpx playwright show-report\n```\n\nHTML 报告将并排显示三张图像：\n\n* **预期** 图像（你的黄金快照）\n\
  * **实际** 图像（新截图）\n* **差异**图像，高亮了不同部分\n\n尝试使用报告中的视觉滑块在 **预期（Expected）** 和 **实际（Actual）**\
  \ 之间滑动。这让你直观地感受到 Playwright 是如何发现变化的：\n\n![Figure 10.3: The visual slider lets you\
  \ drag between the “expected” and “actual” versions](img/B34148_10_3.png)\n\n图 10.3：视觉滑块让你可以在“预期”和“实际”版本之间进行切换\n\
  \n由于视觉快照是你测试基准的一部分，你应该将它们提交到版本控制系统（如 Git）。这允许你的团队跟踪有意的 UI 变化，并在代码更改的同时审查视觉差异。\n\n\
  ### 第四步：更新黄金快照\n\n如果 UI 变化是有意的（例如，你更改了按钮的颜色），你需要更新黄金快照。你可以通过带有 `--update-snapshots`\
  \ 标志的 `test` 命令来实现：\n\n```\nnpx playwright test --update-snapshots\n```\n\n此命令告诉\
  \ Playwright 用新版本覆盖旧的黄金快照。运行此命令后，你应该将更新后的快照提交到 Git 仓库。\n\n如果你需要更多控制，或者你没有使用 Playwright\
  \ Test，可以使用如 `pixelmatch` 等库 ([`github.com/mapbox/pixelmatch`](https://github.com/mapbox/pixelmatch))\
  \ 手动比较截图。\n\n有时，截图中的微小差异（例如字体字体渲染变化或抗锯齿问题）可能会导致测试失败，尽管实际上并没有损坏。这就是管理可接受的视觉差异。\n\n\
  # 管理可接受的视觉差异\n\nPlaywright 提供了灵活的工具来控制视觉比较的严格程度。你可以设置阈值允许微小的像素变化，或掩盖时间戳等动态元素，以使测试在不同环境中更加可靠。在本节中，你将学习如何微调这些设置。\n\
  \n## 配置阈值\n\n像素级的比较有时过于严格，特别是由于抗锯齿引起的。你可以使用以下选项放宽比较规则：\n\n* `maxDiffPixels`：允许差异的最大像素数。\n\
  * `threshold`：`0` 到 `1` 之间的数值。这是像素比例。`0.2` 意味着像素可以差异 20%。\n\n由于机器间的抗锯齿差异，像素级比较有时可能过于严格。\n\
  \n你可以为特定截图的断言设置这些选项。假设我们在测试 Bug 站点时设置一个高值的 `maxDiffPixels` 以忽略噪声：\n\n```\nimport\
  \ { test, expect } from '@playwright/test';\ntest('Homepage should look the same',\
  \ async ({ page }) => {\n  await page.goto('https://with-bugs.practicesoftwaretesting.com/#/contact');\n\
  \  await expect(page).toHaveScreenshot('homepage.png', {\n    maxDiffPixels: 10000,\
  \  // 允许 10000 个像素差异\n  });\n});\n```\n\n你也可以全局配置 (`playwright.config.ts`) 来减少重复：\n\
  \n```\nimport { defineConfig } from '@playwright/test';\nexport default defineConfig({\n\
  \  expect: {\n    toHaveScreenshot: {\n      threshold: 0.2,         // 允许 20% 的像素比例\n\
  \      maxDiffPixels: 100      // 允许 100 个像素\n    },\n  },\n  // 其他选项 ...\n});\n\
  ```\n\n此全局配置适用于所有断言，除非在单个断言中被覆盖。\n\n不要忘记将快照包含在版本控制中。通过将其与代码一起提交，你可以创建一个清晰的项目历史，显示何时以及为什么发生了视觉变化。这使得回滚和审查变得简单，并有助于随时间保持\
  \ UI 的稳定和预测。\n\n## 掩盖动态元素\n\n页面可能包含动态内容，例如广告、时间戳或动画，这些会导致截图测试失败。你可以掩盖这些元素，告诉 Playwright\
  \ 在比较时忽略它们。\n\n以下是一个示例：\n\n```\nawait expect(page).toHaveScreenshot('homepage.png',\
  \ {\n  // 传递要掩码的定位器数组\n  mask: [page.locator('.dynamic-timestamp'), \n         \
  \ page.locator('.user-avatar')]\n});\n```\n\n`{ mask: [...] }` 选项对象自定义了截图方式。在 `mask`\
  \ 数组中，你可以包含想要在截图期间隐藏的元素。Playwright 将“掩盖”这些元素，因此在捕获或比较截图时不会显示它们。\n\n\n\n\n请记住，页面上的其他所有内容仍需与参考图像（`homepage.png`）匹配才能通过测试。\n\
  \n一旦你掌握了截图捕捉和对比，下一步是将视觉测试成为你日常开发流程的一部分。手动测试在开发期间很有帮助，但自动化才能真正释放视觉回归测试的力量。\n\n# 自动化视觉回归工作流\n\
  \n当视觉回归测试无缝集成到你的开发和部署工作流时，它的威力最强。自动化这些测试可以确保尽早发现任何意外的 UI 变化，理想是在它们进入生产环境之前。\n\n\
  核心思想是将视觉测试变成标准的自动化检查，就像单元测试或集成测试一样。\n\n## 自动化工作流概述\n\n以下是自动化工作流在 Git 和 CI/CD 环境中典型的运行方式：\n\
  \n1. **基准截图**：你的项目仓库包含一组 `golden`（黄金）或基准截图。这些是应用程序 UI 组件或页面经过批准的、正确的版本。\n2. **开发者进行更改**：开发者修改代码（例如，更改\
  \ CSS 样式或重构组件）并推送到新分支，创建一个拉取请求（pull request）。\n3. **触发 CI 流水线**：推送会自动触发 CI 流水线。该流水线执行一系列作业，包括你的\
  \ Playwright 测试。\n4. **Playwright 执行测试**：在 CI 环境内部，Playwright 为每个视觉测试执行以下步骤：\n \
  \   * 它导航到指定的页面或组件\n    * 拍摄一张新截图\n    * 将此新截图与存储在仓库中相应的基准截图进行像素级对比\n5. **结果与反馈**：\n\
  \    * **未发现差异**：如果新截图与基准完全匹配，则测试通过。CI 检查显示绿色对钩，这表示 UI 在视觉上没有变化，且从视觉角度来看该拉取请求是安全的可以合并。\n\
  \    * **发现差异**：如果 Playwright 检测到任何视觉不匹配，测试将失败。CI 检查显示红色 X。流水线会生成一份报告，包含 `baseline`\
  \ 图像、`new (actual)` 图像以及一张突出显示精确差异的 `diff` 图像。这会立即提醒开发者他们的更改产生了意外的视觉副作用。\n6. **审核与更新**：\n\
  \    * **如果是 Bug**，你修复代码并再次推送，重新运行工作流。\n    * **如果更改是有意的**（例如计划中的按钮颜色更改），你在本地运行命令\
  \ `npx playwright test --update-snapshots` 来更新基准截图，将这些新基准提交到你的分支并推送。CI 将再次运行，这次测试将通过，因为新基准与新的\
  \ UI 匹配了。\n\n## 使用 GitHub Actions 的示例\n\n将此集成到 CI/CD 流水线是非常简单的。这是一个简单的 GitHub Actions\
  \ 工作流文件示例，它自动化的了这一过程：\n\n```\n# .github/workflows/playwright.yml\nname: Playwright\
  \ Tests\non:\n  push:\n    branches: [ main, master ]\n  pull_request:\n    branches:\
  \ [ main, master ]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n   \
  \   - uses: actions/checkout@v4\n      - name: Install Node.js\n        uses: actions/setup-node@v4\n\
  \        with:\n          node-version: lts/*\n      - name: Install dependencies\n\
  \        run: npm ci\n      - name: Install Playwright Browsers\n        run: npx\
  \ playwright install --with-deps\n      - name: Run Playwright tests\n        run:\
  \ npx playwright test\n      - name: Upload test report\n        # This step runs\
  \ only if tests fail to upload the diffs\n        if: failure()\n        uses: actions/upload-artifact@v4\n\
  \        with:\n          name: playwright-report\n          path: playwright-report/\n\
  \          retention-days: 30\n```\n\n我们之前 *第 7 章，*Integrating Workflows with CI/CD\
  \ Pipelines* 中提到过将 Playwright 测试集成到 CI/CD 工作流，但这里快速回顾一下自动化脚本涉及的关键步骤。\n\n首先是 `actions/checkout@v4`\
  \ 步骤。它检出你的代码，包括任何基准截图，因此测试所需的所有内容在 CI 环境中可用。\n\n接下来是 `npm ci`，它以清洁且可靠的方式安装项目依赖项。这确保了每次运行工作流时测试环境都是一致的。\n\
  \n然后，`npx playwright install --with-deps` 命令在 CI 运行器中安装所有必要的浏览器和操作系统级依赖项。这一步骤对于确保你的本地机器和\
  \ CI 系统之间没有渲染差异至关重要。\n\n之后，是 `npx playwright test`。它运行你的 Playwright 测试并自动进入对比模式。如果发现任何不匹配，测试将失败，这有助于你尽早发现视觉回归。\n\
  \n最后，如果测试失败，`actions/upload-artifact@v4` 将派上用场。它将 Playwright 报告（包括基准、实际和差异图像）作为制品上传。这样，你可以直接从\
  \ GitHub 拉取请求下载并查看视觉差异。\n\n尽早且频繁地运行视觉测试（理想情况下每个拉取请求一次）。这有助于你在视觉 Bug 进入主分支之前捕捉它们，并确保你的\
  \ UI 在整个开发过程中保持一致。\n\n现代应用通常支持多个主题。视觉测试应该验证激活的主题，因为颜色/对比度的差异可能会隐藏或暴露布局问题。你可以通过以下方式测试主题：\n\
  \n* 切换 UI 控制\n* 设置应用程序读取的 cookies 或 `localStorage` 键\n* 使用 `storageState`\n* 在页面加载前注入属性/CSS\n\
  \n每方法将由你正在测试的系统决定，并会有不同的权衡。最现实的方法是切换 UI，而 `storageState` 通常对于 CI 来说最稳定。\n\n视觉测试对于捕捉\
  \ UI 问题非常棒，但它们可能异常地脆弱。为了充分利用其作用并避免追逐误报，创建一个稳定、一致的设置至关重要。\n\n# 如何保持视觉测试的稳定可预测\n\n\
  视觉测试可能有点挑剔。当设置发生细微变化时，它们往往会崩溃。操作系统版本、屏幕分辨率或浏览器引擎等因素可能会导致测试失败，即使你的应用程序运行正常。\n\n这些不可预测的失败通常被称为\
  \ `flaky`（不稳定），因为它们是不一致的且难以重现。避免不稳定测试的最佳方法之一是标准化你的测试环境。例如，在所有测试中使用始终相同的浏览器（如特定版本的\
  \ Chromium），可以防止由于浏览器渲染方式的差异引起的问题。即使是微小的变化（如 Chrome 更新）也会改变字体、颜色或布局的显示方式，这可能会干扰你的测试。\n\
  \n如果你在本地 Windows 或 Mac 上生成基准截图（那些黄金参考图像），它们通常包含特定操作系统的细节或微妙的渲染特性，这些与 CI 环境（如运行在\
  \ Ubuntu 上的 GitHub Actions）不匹配。\n\n这会导致不匹配，即测试在本地通过但在 CI 中失败，反之亦然，即使在不同浏览器类型之间也是如此。为了避免这个问题，明智的做法是直接在模拟\
  \ CI 设置的 Docker 容器中生成或更新基准，确保从操作系统到浏览器的所有行为完全一致（我们在 *第 7 章，*Integrating Workflows\
  \ with CI/CD Pipelines* 中更详细地讨论过 Docker）。\n\n\n\n\n\n你可以通过在官方 Playwright Docker\
  \ 镜像中运行测试来实现这一目标。首先拉取一个基于 Ubuntu 的镜像，例如标准配置使用的 `mcr.microsoft.com/playwright:v1.56.1-noble`，或者针对\
  \ M1 Mac 的 ARM64 变体（你可以在 [`mcr.microsoft.com/en-us/artifact/mar/playwright/`](https://mcr.microsoft.com/en-us/artifact/mar/playwright/)\
  \ 找到镜像列表）。\n\n然后，使用如下命令挂载你的项目、安装依赖并更新快照：\n\n```\ndocker run --ipc=host --shm-size=1gb\
  \ --rm --network host -v $(pwd):/work/ -w /work/ -it mcr.microsoft.com/playwright:v1.56.1-noble\
  \ /bin/bash\n```\n\n进入容器后，运行以下命令：\n\n```\nnpm ci && npx playwright install --with-deps\
  \ && npx playwright test --update-snapshots\n```\n\n这种设置在与 CI 匹配的 Linux 环境中获取快照，因此你不需要担心那些烦人的操作系统差异：你的视觉测试将保持一致性。如果你正在处理特定的浏览器或不同的架构，只需根据需要调整\
  \ Docker 镜像即可。前期的一小点努力可以避免以后很多麻烦。\n\n另一个实用的提示是在测试期间关闭动画和过渡。诸如淡入或滑动菜单等内容可能会导致你的截图不一致，特别是当测试恰好捕捉到动画中间时。通过添加如下所示的\
  \ CSS 规则，你可以确保在截图时所有内容保持静止并完全渲染：\n\n```\n* {\n  transition: none !important;\n \
  \ animation: none !important;\n}\n```\n\n这将带来更稳定、更可靠的测试结果。你让测试环境和应用行为表现得越可预测，视觉测试得到的误报就越少。\n\
  \n在处理如多语言应用等动态内容时，文本长度的变化（例如德语与英语的差异）可能会触发视觉测试中的误报。与其掩盖这些区域（这可能会隐藏真正的 bug），最佳方法是在你的\
  \ `playwright.config.ts` 文件中使用 Playwright 项目对测试进行分段。通过为每个语言区域创建一个特定项目，你可以为每种语言生成独立的、稳定的基准。\n\
  \n# 总结\n\n视觉回归测试是质量保证的重要环节，它有助于确保即使代码不断演进，应用程序的 UI 也能保持一致和可靠。通过 Playwright 的内置工具，无论测试整个页面还是单个元素，捕捉和比较截图都变成了一个简单的过程。\n\
  \n在本章中，你学习了如何拍摄和比较截图、管理可接受的视觉差异，以及在 CI/CD 流水中自动化这些测试。通过将这些实践与深思熟虑的测试设计以及稳定的环境相结合，你可以心地在用户之前之前捕捉到意外的\
  \ UI 变化。\n\n当你继续构建现代且视觉丰富的应用程序时，视觉测试将成为你工具箱中的关键部分，帮助你更快地发布更改并减少惊喜。\n\n在下一章中，我们将专注于通过模拟设备和处理响应式设计来测试移动\
  \ Web 体验。\n\n## 获取本书 PDF 版本和独家额外\n\n扫描二维码（或访问 [packtpub.com/unlock](https://packtpub.com/unlock)）。按名称搜索此书，确认版本，然后按照页面上的步骤操作。\
  \ | ![](img/Unlock-01.png)![](img/Unlock.png) |\n\n| **注意**：留好你的发票。直接从 Packt 购买的不需要发票。\
  \ |\n\n# 11 测试移动 Web 体验\n\n随着越来越多的人在手机和平板电脑上浏览网页，移动测试已成为测试策略的重要组成部分。无论有人是在 iPhone\
  \ 上滚动、在 Android 上点击，还是手里拿着平板电脑放松，你的应用在每种屏幕上都应该看起来良好且运行流畅。这正是移动测试所帮助实现的。。\n\n在本章中，我们将探索\
  \ Playwright 如何让在移动设备上测试你的网站变得如此简单，即使你手边没有任何真实的手机或平板电脑。你将学习如何使用内置的设备预设、创建自定义设置，并模拟真实世界的条件，如低网络速度、不同的位置和屏幕旋转。\n\
  \n我们还将涵盖如何测试移动特定的交互（如点击），并展示当情况不符合预期时如何进行调试。到结束时，你将完全能够确保你的应用为每个用户提供完美运行，无论他们使用什么设备。\n\
  \n因此，我们将在本章涵盖以下主题：\n\n*   理解仿真与真实设备的区别\n*   为移动仿真配置 Playwright\n*   使用 Playwright\
  \ 仿真模拟真实场景\n*   调试移动特定问题\n*   常见的移动特定问题及解决方案\n\n## 技术要求\n\n本章的源代码可在此处获取：\n\n[`github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright/tree/main/Chapter11`](https://github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright/tree/main/Chapter11)。\n\
  \n# 理解仿真与真实设备的区别\n\n在深入本章之前，理解你正在测试的环境是非常重要的。使用 Playwright 测试移动体验主要有两种方式：\n\n* \
  \  **移动仿真 (Mobile emulation)**：这是 Playwright 默认且最常用的方法。它使用桌面版的 Chrome、Firefox 和\
  \ WebKit 来模拟移动设备的属性，包括其视口。\n*   **真实设备 (Real devices)**：对于与特定硬件、操作系统集成或运营商网络相关的问题，在真实设备上进行测试是必要的。Playwright\
  \ 可以通过 Android 调试桥 (`ADB`) 连接到 Android 设备上的 Chrome 浏览器，或者在云端浏览器场中运行测试。然而，对于大多数应用的行为调试，仿真是你的第一防线。\n\
  \n在本章中，我们关注在 Playwright 的仿真环境中进行调试，因为这是你花费大部分时间的地方。\n\n# 为移动仿真配置 Playwright\n\n\
  Playwright 的优点之一是它让移动测试变得极其简单。它自带了一个设备描述符库，这些描述符本质上是流行设备的即插即用配置，包括 iPhone、Android\
  \ 手机、iPad 等。\n\n这些配置预设了模拟真实移动设备所需的所有细节：屏幕尺寸、用户代理、触摸支持，甚至是设备的缩放因子。这是一种在不需要物理硬件的情况下查看你的网站在设备上显示和行为的快捷方法。\n\
  \n## 使用内置设备描述符\n\n要使用这些设备配置，你只需从 Playwright 库导入 `devices` 对象即可。当你创建一个新的浏览器上下文时，可以展开\
  \ `devices` 对象中特定设备描述符的属性。这将为新上下文配置该设备所需的所有设置。\n\n让我们通过使用 `iPhone 15 Pro Max` 描述符的示例，来测试你的布局在该设备上的显示效果：\n\
  \n\n\n\n\n```\nimport { test, expect, devices } from '@playwright/test';\ntest.describe('Responsive\
  \ layout on mobile', () => {\n  test('should display the mobile navigation menu\
  \ on iPhone 15 Pro Max', async ({ browser }) => {\n    const iPhone15PM = devices['iPhone\
  \ 15 Pro Max'];\n    // Create a new browser context with iPhone 15 Pro Max settings\n\
  const context = await browser.newContext({\n      ... iPhone15PM ,\n    });\n  \
  \  const page = await context.newPage();\n    await page.goto('https://github.com');\n\
  \    const mobileMenuButton = page.getByRole('button', { name: 'Toggle navigation'\
  \ });\n    await expect(mobileMenuButton).toBeVisible();\n    // Clean up the context\n\
  await context.close();\n  });\n});\n```\n\n在这个示例中，我们从 playwright 库导入了 `devices`\
  \ 对象。然后，我们访问 `'iPhone 15 Pro Max'` 描述符，并将其属性展开到 `newContext()` 方法中。这一行代码配置了浏览器上下文，使其行为像\
  \ iPhone，并包含了正确的用户代理（user agent）和视口设置：\n\n![](img/B34148_11_1.png)\n\n图 11.1：在 iPhone\
  \ 移动视图下验证导航菜单的可见性\n\n你也可以选择其他设备（例如 Pixel 5、Galaxy S9+、iPad Pro 11 等）。要查看内置模拟设备的列表，你可以使用以下代码：\n\
  \n```\nimport { devices } from 'playwright';\nconsole.log(Object.keys(devices));\n\
  ```\n\n这将打印出所有内置设备描述符的数组：\n\n```\n[\n  'iPhone 15',\n  'iPhone SE',\n  'Pixel 5',\n\
  \  'Galaxy S9+',\n  ...\n]\n```\n\n## 使用 Playwright 配置文件\n\n你也可以在 Playwright 配置文件\
  \ (`playwright.config.ts`) 中使用 `projects` 部分指定设备。这会为该设备创建一个专用的测试项目。例如，要在 Pixel 5\
  \ 和 iPhone 12 上运行测试，你的配置看起来像如下：\n\n```javascript\nimport { defineConfig, devices\
  \ } from '@playwright/test';\nexport default defineConfig({\n  projects: [\n   \
  \ {\n      name: 'Mobile Chrome',\n      use: {\n        ...devices['Pixel 5'],\n\
  \      },\n    },\n    {\n      name: 'Mobile Safari',\n      use: {\n        ...devices['iPhone\
  \ 12'],\n      },\n    },\n  ],\n});\n```\n\n在第一个项目中，`use: { ...devices['Pixel 5']\
  \ }` 从 `devices` 对象中提取了 Pixel 5 的预定义设置。展开运算符 (`...`) 解包了所有设备特有的设置，例如视口大小（Pixel 5\
  \ 为 393 x 851）和浏览器用户代理，以便 Playwright 能够精确地模拟该设备。\n\n同样，第二个项目使用了 iPhone 12 的设置，其中包含了其较小的视口（390\
  \ x 844）和 Mobile Safari 的用户代理等细节。\n\n## 自定义视口和设备属性\n\n虽然设备描述符非常方便，但你可能需要测试特定的屏幕尺寸或未包含在\
  \ Playwright 默认列表中的设备配置。在这种情况下，你可以手动配置视口和其他设备属性。\n\n通过 `newContext()` 方法，你有多种选项来精调模拟设置。对于移动测试，最常用的属性包括以下内容：\n\
  \n*   `viewport`: 一个指定以像素为单位的浏览器视口宽度和高度的对象。\n*   `deviceScaleFactor`: 设备的像素密度。例如，Retina\
  \ 显示屏的 `deviceScaleFactor` 为 `2`。\n*   `isMobile`: 一个布尔值，当设置为 `true` 时，将启用触摸事件并确保\
  \ meta-viewport 标签生效。\n*   `userAgent`: 一个向 Web 服务器标识浏览器和设备的字符串。\n\n你已经在*第 3 章*——*跨\
  \ Chromium、Firefox 和 WebKit 的浏览器无关测试*中看到过这些属性的应用了。为了快速复习，这里有一个如何设置自定义移动设备配置的示例：\n\
  \n```javascript\nimport { test } from '@playwright/test';\ntest('Custom mobile emulation\
  \ test', async ({ browser }) => {\n  const context = await browser.newContext({\n\
  \    viewport: { width: 375, height: 667 },\n    deviceScaleFactor: 2,\n    isMobile:\
  \ true,\n    userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 13_5 like Mac OS X)\
  \ AppleWebKit/605.1.15 (KHTML, like Gecko) Version/13.1.1 Mobile/15E148 Safari/604.1',\n\
  \  });\n  const page = await context.newPage();\n  // 此测试的目的仅是使用自定义的移动模拟设置\n// 生成一张截图。\n\
  await page.goto('https://www.whatsmybrowser.org');\n  await page.screenshot({ path:\
  \ 'custom-mobile-emulation.png' });\n  await context.close(); // 同时关闭所有页面\n});\n\
  ```\n\n该脚本通过使用特定的移动端类设置自定义浏览器上下文，模拟了从 iPhone 进行浏览的行为。它设置了视口大小、设备像素比例和用户代理字符串。\n\n\
  \n\n\n\n```typescript\n// playwright.config.ts\nexport default defineConfig({\n\
  \  // ... other global config options ...\nprojects: [\n    // 标准功能项目\n    {\n \
  \     name: 'chromium',\n      use: {\n        ...devices['Desktop Chrome'],\n \
  \     },\n      // IMPORTANT: 设置标准项目以忽略视觉测试\ngrepInvert: /@visual/,\n    },\n  \
  \  // 视觉回归项目\n// 这些项目仅存在用于运行带有 @visual 标签的测试\n    {\n      name: 'visual-mobile',\n\
  \      use: {\n        viewport: { width: 390, height: 844 },\n      },\n      //\
  \ 运行匹配此标签的测试\ngrep: /@visual/,\n    },\n    {\n      name: 'visual-tablet',\n  \
  \    use: {\n        viewport: { width: 768, height: 1024 },\n      },\n      grep:\
  \ /@visual/,\n    },\n    {\n      name: 'visual-desktop',\n      use: {\n     \
  \   viewport: { width: 1920, height: 1080 },\n      },\n      grep: /@visual/,\n\
  \    },\n  ],\n});\n```\n\n三个 `visual-*` 项目将只会执行标题或描述中包含字符串 `@visual` 的测试。`grepInvert:\
  \ /@visual/` 属性告诉我们的默认 `chromium` 项目跳过任何标记为视觉测试的测试。这防止了重复测试，并让你的快速功能测试与较慢的视觉测试分开来来。\n\
  \n既然配置已经处理了*位置*和*大小*，测试文件本身可以非常简单：\n\n```typescript\n// tests/visual.spec.ts\nimport\
  \ { test, expect } from '@playwright/test';\n// @visual 标签将此块与配置中的项目连接起来。\ntest.describe('Visual\
  \ regression @visual', () => {\n  test('homepage should look correct', async ({\
  \ page }) => {\n    await page.goto('https://www.whatsmybrowser.org/');\n    await\
  \ expect(page).toHaveScreenshot({ fullPage: true });\n  });\n});\n```\n\n通过在 `test.describe()`\
  \ 块中添加 `@visual`，内部的每个测试都会继承该标签。当这个单独的测试运行时，Playwright 本质上将其克隆了三次。它伪装成手机运行一次，作为平板电脑运行一次，最后作为\
  \ 1080p 桌面浏览器运行一次，并为每个创建一个全屏截图。\n\n现代用户并不是完美的实验室条件下浏览网页：他们可能处于不稳定的咖啡馆 Wi-Fi 下，跨时区旅行，并在设备之间快速切换。测试这种混沌的情况正是\
  \ Playwright 仿真工具大放异彩的地方\n\n# 使用 Playwright 仿真模拟真实场景\n\n在测试 Web 应用时，你希望确保它们在混乱、不可预测的真实世界中依然可用。幸运的是，Playwright\
  \ 的仿真功能允许你无需离开座位即可重建这些场景。\n\n在本节中，我们将深入研究如何使用 Playwright 模拟网络条件、地理位置和设备方向，以确保你的应用在任何情况下都能提供无缝体验。\n\
  \n## 仿真网络条件\n\nPlaywright 允许你仿真不同的网络条件。以下脚本将使用 `Chrome DevTools Protocol` (`CDP`)\
  \ 来限制网络。这种方法提供了细粒度的控制，但它仅适用于基于 Chromium 的浏览器，如 Google Chrome 和 Microsoft Edge。Safari\
  \ (WebKit) 或 Firefox 等浏览器不支持 CDP，因此如果你在这些地方尝试，它将不起作用。\n\n在使用 CDP 时，在测试中添加 `skip`\
  \ 条件是一个好主意。这样，不兼容的测试将被自动跳过。这是一个示例：\n\n```typescript\nimport { test, expect } from\
  \ '@playwright/test';\n// 定义慢 3G 连接的网络条件\nconst slow3G = {\n  downloadThroughput:\
  \ 500 * 1024 / 8, // 500 kbps\nuploadThroughput: 500 * 1024 / 8,   // 500 kbps\n\
  latency: 400, // 400ms\noffline: false,\n};\ntest.describe('Emulate Slow Network\
  \ Conditions', () => {\n  // 此测试专门针对 Chromium，因为它使用了 CDP 会话。\n// 你也可以在配置中定义一个自定义项目，使测试\
  \ \n// 仅在 Chromium 中运行。\n  test.skip(\n    ({ browserName }) => browserName !==\
  \ 'chromium',\n    'This feature is currently only supported on Chromium.'\n  );\n\
  \  test('should emulate a slow 3G connection', async ({ page }) => {\n    const\
  \ client = await page.context().newCDPSession(page);\n    await client.send('Network.emulateNetworkConditions',\
  \ slow3G);\n    console.log('Slow 3G network conditions have been enabled.');\n\
  \    // 导航到网站。由于仿真的网络条件，\n// 加载时间将明显变长。\nconst startTime = Date.now();\n    await\
  \ page.goto('https://playwright.dev');\n    const loadTime = Date.now() - startTime;\n\
  \    console.log(`Page loaded in ${loadTime}ms under slow 3G conditions.`);\n  \
  \  // 现在你可以像 usual 一样进行测试了。\n// 此页面上的后续网络请求将被限制。\nawait expect(page).toHaveTitle(/Playwright/);\n\
  \    // 如果需要，你也可以通过将值设回默认\n//（或设置为 0 以不限制）来禁用仿真。\nawait client.send('Network.emulateNetworkConditions',\
  \ {\n      offline: false,\n      latency: 0,\n      downloadThroughput: 0,\n  \
  \    uploadThroughput: 0,\n    });\n    console.log('Slow 3G network conditions\
  \ have been enabled.');\n  });\n});\n```\n\n## 仿真地理位置\n\n在开发依赖位置数据的应用时，测试它们在不同地理场景下的表现是非常用的。Playwright\
  \ 允许在浏览器上下文中仿真地理位置，这使得模拟世界各地变得简单。\n\n这是一个示例：\n\n```typescript\n// tests/geolocation.spec.ts\n\
  import { test, expect, devices } from '@playwright/test';\ntest.use({\n  ...devices['Pixel\
  \ 5'],  // 模拟 Pixel 5 设备\ngeolocation: {\n    latitude: 41.889938,  // 模拟纬度（意大利罗马）\n\
  longitude: 12.492507 // 模拟经度（意大利罗马）\n  },\n  permissions: ['geolocation'],\n});\n\
  test('should mock @geolocation to Rome on Pixel 5', async ({ page }) => {\n  await\
  \ page.goto('https://www.openstreetmap.org/');\n  // 点击定位按钮\nawait page.getByRole('button',\
  \ { name: /Show My Location/i }).click();\n  // 等待 URL 包含罗马坐标\nawait expect(page).toHaveURL(/41\\\
  .88/);\n});\n```\n\n## 仿真设备方向\n\n这对于测试你的网站或应用如何响应不同的屏幕方向有用。例如，当用户旋转手机时，布局会正确调整吗？\n\
  \n通常，你像这样在竖屏模式下仿真设备：\n\n```typescript\nconst context = await browser.newContext({\n\
  \  ...devices['iPhone 12'],\n  screen: {\n    width: 390, // 竖屏宽度\nheight: 844 //\
  \ 竖屏高度\n  }\n});\n```\n\n\n\n\n\n如果你想模拟横屏模式，交换宽度和高度：\n\n```\nconst context = await\
  \ browser.newContext({\n  ...devices['iPhone 12'],\n  screen: {\n    width: 844,\
  \  // 横屏宽度\nheight: 390 // 横屏高度\n  }\n});\n```\n\n通过结合这些工具，Playwright 能够让你更早地发现问题并交付完善的体验。\n\
  \n## 模拟轻触手势\n\n你的大部分用户会在触摸屏上与你的应用程序交互。这意味着你的测试策略必须超越简单的点击和键盘输入。你需要验证基于触摸的交互可能会触发与传统鼠标事件不同的代码路径。如果测试不当，你可能会面临让部分观众感到沮败的风险。\n\
  \n最基本的触摸手势是 `tap`，它是移动端相当于点击。虽然 `page.click()` 在移动模拟页面上通常有效，但专用的 `page.tap()` 方法在模拟真实的触摸交互时更加明确且可靠。它会找到一个元素并在其中心进行点击。\n\
  \n这里是一个示例：\n\n```\nimport { test, expect, devices } from '@playwright/test';\n//\
  \ 使用内置移动设备\nconst iPhone15 = devices['iPhone 15'];\ntest.use({\n  ...iPhone15,\n\
  \  viewport: iPhone15.viewport,\n  userAgent: iPhone15.userAgent,\n});\ntest('Wikipedia\
  \ search field interaction on mobile', async ({ page }) => {\n  // 导航到维基百科\n  await\
  \ page.goto('https://www.wikipedia.org/');\n  // 点击搜索输入框\n  await page.tap('input[name=\"\
  search\"]');\n  // 输入内容\n  await page.fill('input[name=\"search\"]', 'Playwright');\n\
  \  // 点击搜索按钮\n  await page.tap('button[type=\"submit\"]');\n  // 断言新页面已加载\n  await\
  \ expect(page).toHaveURL(/.*Playwright.*/);\n});\n```\n\n此测试确保了搜索框在移动环境中正常工作。它设置了视口和用户代理以匹配\
  \ iPhone 15，导航到维基百科首页，点击搜索输入，输入 `Playwright` 查询词，点击提交按钮，然后验证浏览器是否导航到 URL 包含搜索词的结果页面。通过点击元素而非鼠标点击，测试更好地反映了人们实际使用触摸屏的方式。\n\
  \n即使是编写得最仔细的移动测试也可能遇到意想不到的障碍。如果没有正确的方法，这些怪癖可能很难复现和诊断。接下来，我们将深入探讨如何处理棘手的移动端特定 Bug。\n\
  \n# 探索调试移动特定问题的工具\n\n调试是测试自动化中不可或缺的一部分。在针对移动设备时，该过程引入了独特的挑战，从多变的视口和触摸交互到网络的不一致性。幸运的是，Playwright\
  \ 备有许多强大的工具，旨在让移动 Web 应用的调试变得更易管理。\n\n我们已经在之前的章节中提到过其中一些工具，但让我们花时间再次回顾一下，以便你确切工具箱里有什么。\n\
  \n## Trace Viewer（追踪查看器）\n\n`Trace Viewer` 是 Playwright 最有用的调试工具之一，在处理移动测试时特别方便。它为你提供了整个测试运行过程的详细快照，有助于追踪在无头模式或\
  \ CI/CD 流水线上出现的问题。\n\n要使用它，你需要在 `playwright.config.ts` 文件中启用跟踪。一个好的建议是仅在失败测试的第一次重试时开启它。这样，你就可以获得所需的调试信息，而不会弄乱成功运行的日志：\n\
  \n```\n// playwright.config.ts\nimport { defineConfig } from '@playwright/test';\n\
  export default defineConfig({\n  // ... 其他配置\nuse: {\n    trace: 'on-first-retry',\
  \ // 'on', 'off', 'retain-on-failure'\n  },\n});\n```\n\n在测试失败并重试后，一个 `trace.zip`\
  \ 文件将保存在你的测试输出目录。要查看它，只需运行以下命令：\n\n```\nnpx playwright show-trace path\\to\\trace.zip\n\
  ```\n\n这会打开一个丰富的 Web 应用程序，让你能够回溯测试的时间线。对于每个操作，你将获得：\n\n* **操作详情**：每个步骤的精确定位器（locator）、计时和日志。\n\
  * **DOM 快照**：每个操作对应的 DOM 的“之前”和“之后”快照。你可以完全检查该特定时刻存在的 HTML 和 CSS。这对于理解为什么元素不可见或不可点击非常有帮助。\n\
  * **控制台日志**：任何记录到浏览器控制台的消息。\n* **网络请求**：所有网络活动的完整日志，这对于调试移动端加载失败的资源或返回错误的的 API 调用至关重要。\n\
  * **源代码**：测试脚本中对应的行会被高亮。\n\n`Trace Viewer` 的可视化时间线让你非常容易发现移动端布局何时发生意外偏移，或者动画何时隐藏了你试图交互的元素。\n\
  \n你可以在 *第 6 章* *测试并行与性能优化* 中更深入地了解 Trace Viewer。\n\n## Playwright Inspector（检查器）\n\
  \n`Inspector` 是一个 GUI 工具，允许你逐行执行测试操作。当测试行为不符合预期时，它是实时调试的最佳工具。你可以通过带有 `--debug` 标志运行\
  \ `test` 命令来启动它，如下：\n\n```\nnpx playwright test --debug\n```\n\n当你运行此命令时，Playwright\
  \ 会打开浏览器窗口和一个 `Inspector` 窗口。你可以执行操作：\n\n* **逐跳 (Step over)**：执行当前行并移动到下一行。\n* **恢复\
  \ (Resume)**：继续测试直到下一个断点。\n* **探索选择器 (Explore selectors)**：使用 **Pick Locator** 工具悬停在浏览器元素上，查看推荐的\
  \ Playwright 定位器。这对于修复或不可靠的选择器非常有价值。\n* **查看 DOM 运行**：我们在 *第 8 章* *无头测试与调试* 中详细介绍过\
  \ Playwright Inspector。\n\n## page.pause() 方法\n\n对于快速的*现场*调试，你可以直接在测试脚本中插入 `await\
  \ page.pause()`。\n\n这是一个示例：\n\n```\nimport { test, expect, devices } from '@playwright/test';\n\
  test('Google autocomplete shows suggestions', async ({ browser }) => {\n  const\
  \ iPhone15PM = devices['iPhone 15 Max'];\n  const context = await browser.newContext({\n\
  \    ...iPhone15PM,\n  });\n  const page = await context.newPage();\n\n  await page.goto('https://www.google.com');\n\
  \  // 在搜索框中输入查询\nconst searchBox = await page.getByRole('textbox');\n  await searchBox.fill('playwright');\n\
  \  // 在此处暂停执行以检查页面状态\n  await page.pause();\n  const suggestions = page.locator('ul[role=\"\
  listbox\"] li');\n  await expect(suggestions.first()).toBeVisible();\n  // 检查至少有一个建议包含\
  \ \"playwright\"\nconst suggestionTexts = await suggestions.allTextContents();\n\
  \  expect(suggestionTexts.some(text => text.toLowerCase().includes('playwright'))).toBeTruthy();\n\
  \n  // 清理上下文\nawait context.close();\n});\n```\n\n当 Playwright 遇到 `page.pause()`\
  \ 时，它会暂停脚本并弹出一个交互窗口，让你可以在其中查看浏览器。在你准备好点击 **Resume** 让它继续运行之前，脚本将保持挂起状态。\n\n![Figure\
  \ 11.3: 暂停脚本以检查页面元素](img/B34148_11_3.png)\n\nFigure 11.3: 暂停脚本以检查页面元素\n\n\n\n\n\
  当你从桌面测试转向移动端模拟时，情况会发生一些变化。移动设备有其独特的特性：极小的屏幕、仅限触摸的交互、更严格的性能预算，以及并不总是遵循桌面端规则的浏览器。Playwright\
  \ 可以很好地处理这些挑战，但预知可能会遇到什么（以及如何修复）将帮助你避免许多“为什么这不起作用？”的困惑。\n\n## 处理触摸事件\n\n移动设备依赖于点击、滑动或缩放等手势，这些手势在桌面测试中是不存在的。正如我们在本章中学到的，Playwright\
  \ 通过 `page.touchscreen.tap()` 等方法支持触摸事件，但你可能会发现，在移动测试中点击（click）并没有触发与触摸（tap）相同的行为。\n\
  \n如果 Web 应用专门绑定了触摸事件（如 `touchstart` 和 `touchend`）的事件监听器，而这些对鼠标事件没有响应，或者应用程序逻辑区分了触摸和点击处理器，就会发生这种情况。例如，一个按钮可能为移动用户设有\
  \ `touchstart` 监听器，但为桌面用户依赖 `click` 监听器，触发其中一个可能不会触发另一个。这是跨设备测试中的一个真实问题。\n\n如果触摸失败，请在浏览器开发工具中检查元素的事件监听器，以确认它已连接到触摸事件。有时，你可能需要使用\
  \ `page.evaluate()` 方法手动发送一系列触摸事件（如 `touchstart` 和 `touchend`）来模拟更复杂的手势。\n\n对于滑动，Playwright\
  \ 没有直接的滑动 API，但你可以通过组合 `touchstart`、`touchmove` 和 `touchend` 来模拟它。这可能会很复杂，因此请进行彻底测试，并考虑使用\
  \ Playwright 的 `dragTo` 等库来处理更简单的拖拽式交互（参见 [`playwright.dev/docs/input#drag-and-drop`](https://playwright.dev/docs/input#drag-and-drop)）。\n\
  \n在与怀疑在屏幕之外的元素交互之前，你可以使用 `scrollIntoViewIfNeeded()` 方法显式将其滚动到视图。这是一个示例：\n\n```\n\
  await page.locator('#my-element').scrollIntoViewIfNeeded();\n```\n\n请注意，该方法对浏览的支持有限，并且在未来可能会更改或删除（参见\
  \ [`mdn.io/scrollIntoViewIfNeeded`](http://mdn.io/scrollIntoViewIfNeeded)）。如果元素始终在屏幕外，那么依靠广泛支持的\
  \ `scrollIntoView()` 方法会更安全。\n\n## 管理视口（viewport）和方向问题\n\n移动浏览器在处理视口大小和方向变化方面可能有些复杂。一个常见问题是元素可能会出现在屏幕外，或者在竖屏模式和横屏模式下的表现不同。虽然\
  \ Playwright 的设备模拟有助于设置视口大小，但你仍然需要在需要时手动测试方向变化。\n\n你可以通过更新页面来切换方向：\n\n```\n// iPhone\
  \ 15 横屏\nawait page.setViewportSize({ width: 852, height: 393 }); \n```\n\n如果你发现元素没有响应，请尝试使用\
  \ `page.locator()` 配合 `waitFor()`，以确保它们在交互之前是可见的且已就绪的。\n\n这是一个示例：\n\n```\nawait\
  \ page.locator('#submit-button').waitFor({ state: 'visible' });\nawait page.locator('#submit-button').tap();\n\
  ```\n\n这有助于防止在元素加载缓慢或初始在屏幕外时出现测试不稳定（flaky tests）。\n\n此外，还要注意移动端特有的 CSS，如 `position:\
  \ fixed` 或 `overflow: hidden`，因为它们可能会干扰滚动。要测试滚动行为，你可以使用 `mouse.wheel()` 或通过 `page.evaluate()`\
  \ 模拟触摸滚动。\n\n开启 `isMobile` 还会让网站加载与桌面版本不同的布局、元素，甚至是完全不同的内容。这意味着你的测试可能会以意想不到的方式运行。因此，请双检页面显示的方式是否符合你的预期。\n\
  \n## 处理移动端弹窗和对话框\n\n在移动端，弹窗可能会以几种不同的方式出现。最简单的是内置的浏览器对话框，例如 JavaScript 的 `alert()`、`confirm()`\
  \ 或 `prompt()`。这些通常看起来像原生系统弹窗，样式与手机的操作系统相匹配，因此在 iOS 和 Android 上的看起来可能略有不同。\n\n然后是使用\
  \ HTML、CSS 和 JavaScript 制作的自定义弹窗。这些通常用于 Cookie 同意通知、登录表单或促销横幅。在移动端，它们通常依赖于触摸手势，例如点击对话框外部或滑动来关闭它们。\n\
  \n此外，某些 Web 应用会触发系统级权限弹窗，例如请求位置或发送通知时。这些看起来和行为也随浏览器和移动操作系统而异。移动端屏幕较小，因此如果视口没有管理得当，弹窗很容易覆盖重要内容或表现出不可预测的行为。虽然\
  \ Playwright 的移动端模拟很有帮助，但记住这些差异以避免测试不稳定仍然很重要。\n\nPlaywright 使用 `page.on('dialog',\
  \ ...)` 事件监听器使处理浏览器原生对话框（如 alerts、confirms 和 prompts）变得非常简单。当这些 JavaScript 对话框之一出现时，Playwright\
  \ 可以为你捕获它。从那里，你可以检查对话框的类型、消息或默认值等，并程序化地接受或关闭它。\n\n![图 11.4: 你可以像这样处理 Confirm 对话框](img/B34148_11_4.png)\n\
  \n图 11.4: 你可以像这样处理 Confirm 对话框\n\n```\npage.on('dialog', dialog => dialog.accept())\n\
  ```\n\n关于与浏览器原生对话框交互的实用示例，请参见第 2 章。\n\n现在，当你处理自定义弹窗时，情况变得有些复杂。许多移动网站使用 HTML 和 CSS\
  \ 构建的模态（modals）而不是原生对话框。这些模态可能需要点击 `关闭` 按钮、向下滑动，甚至点击模态外部来消除它们。由于这些不是对话框，Playwright\
  \ 的对话框事件无法捕捉它们——它们是普通的 DOM 元素。这意味着如果你的脚本尝试与模态后面的元素交互，可能会失败。\n\n为了处理这个问题，你需要检查模态的\
  \ DOM 结构，并使用 Playwright 的 `page.locator()` 和触摸特定操作与其交互。例如，如果网站显示一个带有 **接受** 按钮的\
  \ Cookie 同意 banner，你可以这样点击它：\n\n```\nawait page.locator('#cookie-consent-accept').waitFor({\
  \ state: 'visible' });\nawait page.touchscreen.tap('#cookie-consent-accept');\n\
  ```\n\n使用 `waitFor()` 可以确保在尝试点击之前模态完全可见。这在移动端尤为重要，因为由于网络速度或渲染时间，加载可能会缓慢。\n\n如果模态没有专门的关闭按钮（例如点击外部时会关闭），你可以通过点击模态外部的地方来模拟操作，如下：\n\
  \n```\nawait page.touchscreen.tap(10, 10); // 点击左上角附近\n```\n\n这假设左上角没有被模态覆盖，因此请先双检页面布局。\n\
  \n## 系统级权限对话框\n\n移动端 Web 应用经常会触发系统级权限对话框，例如地理位置、摄像头访问或通知请求。这些是特定于浏览器的，并在移动操作系统之间不同。Playwright\
  \ 允许你在上下文（或在 Playwright 配置）中预定义权限，以完全避免这些对话框：\n\n```\nconst context = await browser.newContext({\n\
  \  ...devices['iPhone 13'],\n  permissions: { 'geolocation': 'grant', 'notifications':\
  \ 'deny' },\n});\n```\n\n\n\n\n这授予了地理位置访问权限并拒绝了通知，因此在测试期间不会出现对话框。如果你需要测试对话框本身，可以允许它出现，并将其作为原生对话框（如果是这样实现的话）或自定义模态框进行处理。虽然本章中的示例使用了内置权限（例如允许访问地理位置）来保持简单易用，但最好记住，并不是所有的浏览器都会以原生系统对话框的形式显示权限提示。有些浏览器则会直接将它们显示在页面上。在真实测试中，你并不希望跳过这些自定义流程。用户会遇到这些流程，你的自动化测试也应该准备好识别并处理它们。\n\
  \n## 应对移动端性能挑战\n\n移动设备的性能并不像桌面电脑那样的强大：处理器更慢、内存更少，且网络连接不稳定。这可能导致各种问题，例如页面加载时间过长，或者动画出现卡顿和抖动。\n\
  \nPlaywright 有了一些实用的工具来帮助你。例如，你可以使用 `context.setOffline()` 或 `context.route()` 来模拟诸如慢速\
  \ 3G 连接甚至完全没有网络的情况。这对于观察应用在网络状况不佳时的表现非常有帮助。但问题在于：这些模拟并不总是能反映全部情况。页面在你的测试中可能看起来良好，但在真实的手机上，可能会因为内存限制或其他模拟器无法模拟的设备特定奇怪性而导致运行卡顿。\n\
  \n为了获得更准确的性能感知，Playwright 的 trace viewer（跟踪查看器）是你的救星。你可以发现诸如大图像拖慢加载速度，或某些重量级 JavaScript\
  \ 占用资源等问题。\n\n说实话，如果可以的话，没有什么比在实际设备上进行测试更好的。真手机会向你展示热节流或内存限制等问题，而模拟器可能会忽略这些。通过结合\
  \ Playwright 的模拟工具、Trace Viewer 的洞察以及真实设备测试，你将能够更好地确保你的应用在移动用户端运行顺畅，无论条件变得多么严劣。\n\
  \n# 总结\n\n在本章中，我们基于已经掌握的跨浏览器测试知识，并见证了 Playwright 如何让模拟移动设备变得如此简单。你学习了如何设置这些模拟，无论是直接编写代码还是使用配置文件，甚至学习了如何针对特定设备调整设置。\n\
  \n我们还深入了模拟真实世界的情况，例如伪造慢速、伪装在不同的位置，甚至翻转你的手机。此外，我们涵盖了处理点击等移动端手势的重要性，以确保你的测试真正像人类用户一样操作。\n\
  \n当出现出现问题时（因为问题总会发生），我们查看了 Playwright 出色的调试工具，例如 Trace Viewer 和 Inspector（检查器），以及\
  \ `page.pause()` 如何成为快速检查的救星。最后，我们查看了常见的移动端头疼问题，例如奇怪的触摸事件、缓慢的性能、屏幕布局问题以及烦人的弹出窗口，并提供了一些实用的修复方案。\n\
  \n到此时，你应该对使用 Playwright 编写稳健、可靠的移动端测试非常有信心。这意味着你的 Web 应用无论你的用户处于何种设备或何种情况下，其外观和体验都将非常出色。\n\
  \n在下一章中，我们将探索表单交互测试，包括输入、验证和特殊字段，以确保对用户输入的健壮处理。\n\n## 获取本书的 PDF 版本及额外内容\n\n获取本书的\
  \ PDF 版本及额外内容\n\n扫描二维码[获取 PDF 版本及额外内容](https://github.com/PacktPublishing/Hands-On-Testing-with-Playwright)（或访问）。\n\
  \n# 测试表单\n\n测试表单\n\n表单是用户交互的核心，从简单的输入到复杂的字段。\n\n在这一章中，你将学习如何使用 Playwright 测试表单交互，包括输入、验证和特殊字段，以确保对用户输入的健壮处理。\n\
  \n## 技术要求\n\n技术要求\n\n在开始之前，请确保你已经安装了 Node.js 和 Playwright。\n\n表单交互的核心\n\n在这一章中，你将学习如何使用\
  \ Playwright 测试表单交互。\n\n以下是章节的结构：\n\n# 交互文本输入框和下拉框\n\n交互文本输入框和下拉框\n\n在 Playwright\
  \ 中处理文本输入框和下拉框非常简单。要输入文本，你主要使用 `fill()` 或 `pressSequentially()`，当涉及到标准下拉框时，`selectOption()`\
  \ 会起作用。\n\n## 交互文本输入框\n\n交互文本输入框\n\n在 Playwright 中处理文本输入框和下拉框有两种主要方法，用于向 `<input\
  \ type=\"text\">` 或 `<textarea>` 字段输入文本：\n\n* `locator.fill()`\n* `locator.pressSequentially()`\n\
  \n使用 `locator.fill()` 时，Playwright 首先找到目标元素并等待其处于可操作状态（这意味着它是可见的、启用的且准备好输入的）。它会自动清除字段中存在的任何文本，然后输入你提供的字符串。这整个过程有助于确保你的文本是干净且可靠的。\n\
  \n在处理输入元素时，你首先需要在页面上定位它。你可以使用如 `page.getByLabel()` 的定位器，这对于通常关联 `<label>` 元素的输入特别有用。\n\
  \n以下是填充用户名和密码字段的示例：\n\n```\n// 填充输入\nawait page.getByLabel('Username').fill('my_user');\n\
  // 带有占位符的填充\nawait page.getByPlaceholder('Enter password').fill('S3cr3P@rd!');\n\
  ```\n\n`locator.pressSequentially()` 方法则模拟了键盘按键。该方法通过定位元素、等待其变为可操作，然后将焦点放在上面。与 `fill()`\
  \ 不同，它不会清除现有内容。相反，它通过为字符串中的每个字符发送单独的按键事件来模拟用户输入。\n\n这更好地模拟了人类输入，对于测试对按键响应的交互功能（例如搜索建议或自动输入格式）特别有用。\n\
  \n以下是在 Wikipedia 搜索框中输入内容的示例：\n\n```javascript\nimport { test, expect } from '@playwright/test';\n\
  test('should search for \"Playwright testing\"', async ({ page }) => {\n  // 跳转到\
  \ Wikipedia\n  await page.goto('https://en.wikipedia.org');\n  // 定位搜索框\n  const\
  \ searchBox = page.getByRole('searchbox', { name: /Search Wikipedia/i });\n  //\
  \ 如果需要，清除输入\n  await searchBox.clear();\n  // 逐字输入\n  await searchBox.pressSequentially('Playwright\
  \ testing');\n  // 按回提交提交\n  await searchBox.press('Enter');\n  // 验证页面标题包含搜索词\n\
  \  await expect(page).toHaveTitle(/.*Playwright testing.*/);\n});\n```\n\n\n\n\n\
  \n此脚本执行了几个关键操作。首先，它访问维基百科的英文首页，并根据角色（role）和名称（name）找到搜索框。然后，它会清除框内可能存在的任何内容，并像真人一样逐字母地输入\
  \ `Playwright testing`。接着，它按下 `Enter` 键执行搜索。最后，为了确保所有操作符合预期，它会检查新页面的标题是否包含搜索术语。\n\
  \n## 与下拉列表交互 (`<select>`)\n\nPlaywright 的 `selectOption()` 方法是处理下拉元素的首选工具，它的设计非常灵活，允许你通过多种方式（通过值、标签或索引）来选择选项，同时支持单选和多选下拉列表：\n\
  \n*   **按值 (By value)**：这针对 `<option>` 标签的 `value` 属性，例如 `<option value=\"US\">United\
  \ States</option>`。你可以调用 `await countryDropdown.selectOption('US')` 来选择它。当你知道确切的值时，这种方法非常理想，因为它精确且不受显示文本变化的影响（例如，如果\
  \ `United States` 之后显示为 `USA`）。\n\n*   **按标签 (By label)**：这根据可见的文本选择选项，例如 `await\
  \ countryDropdown.selectOption({ label: 'United Kingdom' })`。它对于模拟用户行为的脚本非常有用，因为用户通常通过显示的文本来查看并选择选项。然而，请注意，文本可能会因为本地化或更新而发生。\n\
  \n*   **按索引 (By index)**：这根据选项在下拉列表中的位置进行选择，第一个选项的索引为 `0`。例如，`await countryDropdown.selectOption({\
  \ index: 2 })` 会选择第三个选项。当值或标签是动态或不可预测时，这种方法很有用，但它是脆弱的，因为下拉列表的顺序可能会改变。\n\n以下是从下拉列表中选择一个的示例：\n\
  \n```\nconst countryDropdown = page.getByLabel('Country');\n// 按值选择（德国为 'DE'）\n\
  await countryDropdown.selectOption('DE');\n// 按标签选择（可见文本）\nawait countryDropdown.selectOption({\
  \ label: 'United Kingdom' });\n// 按索引选择\nawait countryDropdown.selectOption({ index:\
  \ 2 });\n```\n\n现在，具有 `multiple` 属性的多选下拉列表（例如 `<select multiple>`）该如何处理？这些允许用户选择多个选项，就像为披萨选择多种配料一样。通过\
  \ `selectOption()`，你可以传递一个值、标签的数组，甚至是两者的混合，来一次性选择多个选项。\n\n参考以下示例：\n\n```\nconst\
  \ toppingsDropdown = page.getByLabel('Toppings');\n// 按值选择多个配料\nawait toppingsDropdown.selectOption([\n\
  \  'pepperoni',\n  'mushrooms',\n  'onions'\n]);\n// 或按标签选择\nawait toppingsDropdown.selectOption([\n\
  \  { label: 'Pepperoni' },\n  { label: 'Mushrooms' },\n  { label: 'Onions' }\n]);\n\
  ```\n\n注意，你需要确保 `<select>` 元素实际上支持多选。如果不支持，传递数组将抛出错误，因为单选下拉列表只接受一个选项。\n\n## 处理自定义下拉列表（非\
  \ `<select>`）\n\n许多现代网站使用由 `<div>`、`<ul>` 和其他元素构建的自定义下拉列表。你无法对这些元素使用 `selectOption()`。相反，你必须模拟用户的动作：\n\
  \n1. 点击打开下拉菜单的元素。\n\n2. 从出现的列表中点击所需的选项。\n\n这里是一个示例：\n\n```\nimport { test, expect\
  \ } from '@playwright/test';\ntest('State dropdown functionality', async ({ page\
  \ }) => {\n  // 导航到表单页面\nawait page.goto('https://demoqa.com/automation-practice-form');\n\
  \  // 定位状态下拉列表\nconst stateDropdown = page.locator('#state');\n  // 点击状态下拉列表以打开它\n\
  await stateDropdown.click();\n  // 选择一个州 (\"Haryana\")\nconst stateOption = page.getByText('Haryana');\n\
  \  await expect(stateOption).toBeVisible();\n  await stateOption.click();\n});\n\
  ```\n\n这段代码首先点击状态下拉列表以打开它。然后从现在可见的列表中选择一个州。\n\n![图 12.1: 从下拉列表中选择一个州](img/B34148_12_1.png)\n\
  \n图 12.1：从下拉列表中选择一个州\n\n自定义下拉列表在打开有时会有延迟或动画。在这种情况下，最好添加一个短时间的等待（例如 `await page.toBeVisible()`），以便选项在你点击之前有时间出现。\n\
  \n如果下拉列表正在动态加载其选项（例如通过 API 调用），你可能还想等待网络活动完成；`page.waitForResponse()` 可以帮助确保在交互之前一切都已就绪。\n\
  \n## 理解 `.fill()`、`.press()` 和 `.pressSequentially()` 之间的区别\n\n`page.press()` 方法允许你模拟在特定元素上按下键盘上的单个键或组合键。它是一个精确的工具，模拟用户物理击击按键，并触发\
  \ `keydown`、`keypress` 和 `keyup` 事件。这对于测试特定的键盘交互特别别用，例如按下 `Enter` 键提交表单或使用方向键进行导航。例如，你可以使用\
  \ `page.press('input[name=\"search\"]', 'Enter')` 来模拟在搜索字段中按下 `Enter` 键以触发搜索。\n\n\
  与 `page.fill()` 不同，`page.press()` 不直接设置或修改输入字段的值：它只发送按键事件，输入值的任何变化取决于 Web 应用程序如何处理该按键。\n\
  \n如果你要在文本字段中填充一个长字符串，`page.fill()` 是首选，因为它更快且更直接。然而，如果你需要模拟增量输入（例如，在每次按键后触发自动完成建议），可能会使用\
  \ `page.pressSequentially()`，它会逐字符模拟输入。\n\n此外，`page.press()` 支持特殊键（如 `Tab`、`Esc`\
  \ 或 `Ctrl` + `A`），而 `page.fill()` 无法处理，因为它不是为按键事件设计的。\n\nPlaywright 还提供了 `.type()`\
  \ 方法，它是一个更高层的方法，只需按字符将文本插入元素中并带有可选延迟，而 `.pressSequentially()` 则是真的按顺序按下每个键，触发所有相应的\
  \ `keydown`、`keypress` 和 `keyup` 事件，就像真人在打字一样。\n\n\n\n\n\n单选按钮（Radio buttons）略有不同，因为它们属于一组，在该组内只能选择一个选项，这通过在\
  \ HTML 中共享相同的 `name` 属性来定义。让我们来看看如何处理这些元素。\n\n## 操作复选框（Checkboxes）\n\n假设你有一个用于类似“接受条款和条件”的复选框。要勾选它（就像用户点击同意一样），你可以使用\
  \ `check()` 方法：\n\n```javascript\n// 勾选复选框\nawait page.get_by_label(\"I agree to\
  \ the terms\").check();\n```\n\n`check()` 的优点在于它是幂等性的（idempotent），这意味着如果复选框已经被选中，它将不会尝试点击。这使其成为确保复选框被选中的一种安全且可靠的方法。\n\
  \n如果你需要确保复选框未被选中，可以使用 `uncheck()` 代替：\n\n```javascript\n// 取消勾选复选框\nawait page.uncheck('#accept-terms');\n\
  ```\n\n该方法只有在复选框当前处于选中状态时才会点击它，从而确保其最终状态为未选中。在这种情况下，我们直接在 `page` 对象上使用 `uncheck()`\
  \ 方法，并传递一个选择器（`'#accept-terms'`）作为参数。这只是定位元素的另一种方式。\n\n`check()` 和 `uncheck()` 都会智能地等待元素就绪（可见且可用）后再进行交互。这有助于让你的测试更加稳定并减少波动（flaky）。\n\
  \n## 测试单选按钮\n\n你同样使用 `page.check()` 来选择单选按钮，但没有对应的 `uncheck()` 方法，因为当选择同一组中的另一个单选按钮时，取消当前按钮的操作会自动发生。\n\
  \n例如，如果你有一个名称为 `color`、值为 `red` 和 `blue` 的单选按钮组，你可以这样选择 `red` 选项：\n\n```javascript\n\
  await page.check('input[value=\"red\"]')\n```\n\nPlaywright 会确保选中正确的单选按钮，并自动为你处理取消组内任何其他选项的选中。在测试单选按钮时，请记住它们的设计是互斥的：一个一个被选中，其他的就会被取消。测试这种行为是一个好主意，可以确保你的应用程序按预期工作。\n\
  \n以下是如何测试单选按钮组的示例：\n\n1. 勾选一个单选按钮。\n2. 断言它已被选中。\n3. 勾选同一组中的另一个单选按钮。\n4. 断言新的单选按钮已被选中。\n\
  5. 断言之前的单选按钮现在已未被选中。\n\n## 断言复选框和单选按钮的状态\n\n现在，断言这些元素的状态就需要 `toBeChecked()` 发派用场了。这是\
  \ Playwright `expect` API 的一部分，用于验证复选框或单选按钮是否处于选中状态。\n\n例如，在用 `await check()` 勾选复选框后，你可以使用\
  \ `toBeChecked()` 断言其状态：\n\n```javascript\nconst termsCheckbox = page.locator('#accept-terms');\n\
  await termsCheckbox.check();\nawait expect(termsCheckbox).toBeChecked();\n```\n\n\
  如果复选框被勾选则通过，否则失败。如果你需要验证复选框或单选按钮未被选中，可以使用这个：\n\n```javascript\nawait expect(page.locator('#accept-terms')).not.toBeChecked();\
  \ \n```\n\n这对于确保在调用 `page.uncheck()` 后复选框未被选中，或者确认选中组之外的单选按钮未被选中特别有用。\n\n如果你正在测试复杂的表单，可能会遇到元素动态加载或隐藏的情况。Playwright\
  \ 的自动等待行为在此很有帮助，但你也可以使用 `page.toBeVisible()` 来确保元素在交互之前已存在。对于断言，`toBeChecked()`\
  \ 是健壮的，但如果你需要验证其他属性（例如元素是否可用），可以将其与其他 expect 匹配器（如 `toBeEnabled()`）结合使用。\n\n## 实际示例\n\
  \n让我们考虑一个实际示例将这些内容联系起来。想象有一个表单，你可以通过勾选框框来选择爱好，并从一组单选按钮中选择性别。\n\n你的测试可能像这样：\n\n```javascript\n\
  import { test, expect } from '@playwright/test';\ntest.describe('DemoQA Automation\
  \ Practice Form', () => {\n  test.beforeEach(async ({ page }) => {\n    await page.goto(\n\
  \      'https://demoqa.com/automation-practice-form', \n      { waitUntil: 'domcontentloaded'\
  \ }\n    );\n  });\n  test('should interact with gender radio buttons', async ({\
  \ page }) => {\n    const maleRadio = page.locator('#gender-radio-1');\n    const\
  \ femaleRadio = page.locator('#gender-radio-2');\n    const otherRadio = page.locator('#gender-radio-3');\n\
  \    await expect(maleRadio).not.toBeChecked();\n    await expect(femaleRadio).not.toBeChecked();\n\
  \    await expect(otherRadio).not.toBeChecked();\n    await maleRadio.check({ force:\
  \ true });\n    await expect(maleRadio).toBeChecked();\n    await expect(femaleRadio).not.toBeChecked();\n\
  \    await expect(otherRadio).not.toBeChecked();\n    await femaleRadio.check({\
  \ force: true });\n    await expect(maleRadio).not.toBeChecked();\n    await expect(femaleRadio).toBeChecked();\n\
  \    await expect(otherRadio).not.toBeChecked();\n  });\n  test('should interact\
  \ with hobbies checkboxes', async ({ page }) => {\n    const sportsCheckbox = page.locator('#hobbies-checkbox-1');\n\
  \    const readingCheckbox = page.locator('#hobbies-checkbox-2');\n    const musicCheckbox\
  \ = page.locator('#hobbies-checkbox-3');\n    await expect(sportsCheckbox).not.toBeChecked();\n\
  \    await expect(readingCheckbox).not.toBeChecked();\n    await expect(musicCheckbox).not.toBeChecked();\n\
  \    await sportsCheckbox.check({ force: true });\n    await expect(sportsCheckbox).toBeChecked();\n\
  \    await expect(readingCheckbox).not.toBeChecked();\n    await expect(musicCheckbox).not.toBeChecked();\n\
  \    await readingCheckbox.check({ force: true });\n    await expect(sportsCheckbox).toBeChecked();\n\
  \    await expect(readingCheckbox).toBeChecked();\n    await expect(musicCheckbox).not.toBeChecked();\n\
  \    await sportsCheckbox.uncheck({ force: true });\n    await expect(sportsCheckbox).not.toBeChecked();\n\
  \    await expect(readingCheckbox).toBeChecked();\n    await expect(musicCheckbox).not.toBeChecked();\n\
  \  });\n});\n```\n\n\n\n\n\n注意我们传递给 `check()` 方法的 `{ force: true }` 参数。有时，使用 `{\
  \ force: true }` 很有用，它可以告诉 Playwright 跳过其正常的操作检查，即使元素隐藏、被遮挡或禁用也执行操作。这可能会平滑测试过程中不稳定的时间问题，但请记住，这也意味着测试不再反映真实用户能够执行的操作。如果\
  \ Google 广告或任何覆盖层覆盖了单选按钮，强制检查仍会成功，尽管人类无法点击它。这会让测试看起来很健康，而实际上却隐藏着真实的 UI 问题。通常情况下，等待控件变为可操作状态或直接处理覆盖层，比强制交互更安全。\n\
  \n如果 `page.check()` 或 `page.uncheck()` 元素不是复选框或单选按钮，或者元素被禁用或未找到，将抛出错误。\n\n并不是所有的表单元素都是平等的。有些运行良好，而另一些则不然。日期选择器和自定义输入字段通常属于后者。它们在表面上可能看起来简单，但在背后，可能是使用复杂的标记构建的。\n\
  \n# 处理日期选择器和自定义字段\n\n在 Playwright 中处理日期选择器和自定义字段感觉有点像在解谜，因为每个 Web 应用似乎都有构建这些组件的独特方式。幸运的是，Playwright\
  \ 为你提供了实用的工具来应对它们，只要掌握技巧，你就可以像专业人士一样处理它们。让我们来看看处理这些元素的实用提示和技巧。\n\n## 处理日期选择器\n\n\
  日期选择器在 Web 表单中很常见，但它们的结构可能差异很大：有些是简单的输入字段，而另一些是带有日历、下拉列表或自定义格式的复杂组件。关键是检查日期选择器的\
  \ HTML 结构以确定交互的最佳方式。\n\n如果日期选择器是基础文本输入（例如 `<input type=\"date\">` 或文本字段），你通常可以使用\
  \ Playwright 的 `fill` 方法直接设置值。例如，如果输入特定格式（如 `YYYY-MM-DD`），你可以将日期作为字符串传递：\n\n```\n\
  await page.fill('input[type=\"date\"]', '2025-08-08');\n```\n\n这对于原生 HTML 日期输入或不触发额外\
  \ JavaScript 事件的文本字段效果良好。但你应该通过检查输入字段来验证预期格式，因为某些字段可能需要 `MM/DD/YYYY` 或 `DD-MM-YYYY`\
  \ 等格式。\n\n当你处理 `calendar` 元素时，可能会发现它们的类或 ID 会发生很大变化。为了保持操作顺畅，尝试将选择器聚焦于 `data-date`\
  \ 或 `aria-label` 等稳定属性。它们要可靠得多。\n\n许多日期选择器在设计时考虑了可访问性，因此它们通常带有实用的 `ARIA`（Accessible\
  \ Rich Internet Applications 的缩写）属性。你可以使用这些属性让你的自动化稳如磐石，例如通过 `page.click('[aria-label=\"\
  Next month\"]')` 点击某个。\n\n某些日期选择器在点击时会弹出一个日历，通常由 jQuery UI、Bootstrap 或 Material\
  \ UI 等库驱动。通常流程很简单：点击输入框，浏览到正确的日期并选择。在 Playwright 中，你可以使用 `click()` 和 `selectOption()`\
  \ 配合 `toBeVisible()` 来确保在继续之前一切已就绪。\n\n这里是一个示例：\n\n1. 使用 `locator.click('selector')`\
  \ 激活日期选择器。\n2. 然后，通过识别日历元素（日、月、年的下拉列表或按钮）导航到目标日期。你可能需要点击箭头来更改月份或选择特定的一天。\n\n这是一个关于选择年、月、日的日历选择器的假设性示例：\n\
  \n```\n// 定义定位器\nconst datePickerInput = page.locator('#date-picker-input');\nconst\
  \ calendar = page.locator('.calendar');\nconst yearDropdown = page.locator('.year-dropdown');\n\
  const monthSelectorAugust = page.locator('.month-selector[data-month=\"August\"\
  ]');\nconst daySelector8 = page.locator('.day-selector[data-day=\"8\"]');\n// 激活日期选择器\n\
  await datePickerInput.click();\n\n// 等待日历出现\nawait calendar.waitFor({ state: 'visible'\
  \ });\n// 选择年份（下拉列表）\nawait yearDropdown.selectOption('2025');\n\n// 选择月份（点击月份按钮）\n\
  await monthSelectorAugust.click();\n\n// 选择日期\nawait daySelector8.click();\n```\n\
  \n你所需的精确选择器取决于日历的 HTML 是如何设置的。打开浏览器的开发者工具，寻找如 ID、类或数据属性等稳定钩子。\n\n记住，如果日历动态加载内容，`waitFor({\
  \ state: 'visible' })` 是你的朋友：它确保在尝试交互之前元素已就绪。\n\n## 处理自定义字段\n\n在 React、Vue 或 Angular\
  \ 等现代框架中，日期选择器的自动化可能有些棘。它们通常带有华丽的动画、自定义事件监听器和动态 DOM 更新，这些并不总是与 Playwright 常用的点击和输入方法兼容。一种简单的方法是完全跳过\
  \ UI，直接使用 JavaScript 设置输入的值。这速度更快且可以节省你很多麻烦。\n\n参考这个示例：\n\n```\nawait page.evaluate((date)\
  \ => {\n  document.querySelector('#date-picker-input').value = date;\n  // 触发变化事件\n\
  const event = new Event('change', { bubbles: true });\n  document.querySelector('#date-picker-input').dispatchEvent(event);\n\
  }, '2025-08-08');\n```\n\n首先，在 JavaScript 中直接设置 `value` 属性可以让你立即将输入更新为所需的日期，因此不需要在\
  \ UI 中点击。\n\n接下来，触发变化事件（如示例所示）可能很重要。许多现代框架（例如 React 的受控组件）依赖 `change` 或 `input`\
  \ 事件来更新应用状态。如果你跳过了这一步，应用可能检测不到新日期，即使它在字段中看起来是正确的。\n\n代码使用了 `{ bubbles: true }`，因此事件会向上\
  \ DOM 冒泡，就像真实用户进行更改一样。根据你的日期选择器，你可能还需要发送 `input` 事件甚至 `blur` 事件来完全模拟实际用户的行为。\n\n\
  这里是一个示例：\n\n```\nawait page.evaluate((date) => {\n  const input = document.querySelector('#date-picker-input');\n\
  \  input.value = date;\n  input.dispatchEvent(new Event('input', { bubbles: true\
  \ }));\n  input.dispatchEvent(new Event('change', { bubbles: true }));\n}, '2025-08-08');\n\
  ```\n\n有几点需要记住。并不是每个日期选择器都是使用标准的 `<input>` 元素构建的。有些使用 `<div>` 或非输入元素来显示所选日期，因此在尝试更新它之前，要确保你针对的是正确的元素。\n\
  \n此外，请记住跳过 UI 有时会跳过内置的验证。例如，如果日期选择器通常会阻止你选择某些日期或要求特定格式，直接设置值可能会忽略这些规则，这意味着你的测试可能无法反映用户的真实体验。为了避免这种情况，最好在之后双检应用的行为：查找错误消息，或确保\
  \ UI 按照预期方式进行更新。\n\n如果你想让你的测试变得格外可靠，可以将这种方法与 Playwright 的内置检查项结合使用。这里是一个示例：\n\n\
  ```\nawait page.evaluate((date) => {\n  const input = document.querySelector('#date-picker-input');\n\
  \  input.value = date;\n  input.dispatchEvent(new Event('change', { bubbles: true\
  \ }));\n}, '2025-08-08');\nawait expect(page.locator('#date-picker-input')).toHaveValue('2025-08-08');\n\
  ```\n\n在这里，设置值后，我们验证输入的值是否正确，或者确认应用状态是否如预期发生了变化。\n\n\n\n\n\n如果自定义字段位于 shadow DOM\
  \ 中（在 Web 组件中很常见），请使用 `page.locator('>> css=selector')` 来穿透影子根。请参见 第 2 章，*高级选择器与动态内容处理*。\n\
  \n现在，即使表单看起来再漂亮，如果它接受错误数据或在出现问题时静默失败，也无用处。你的表单应该同时保护数据完整性和用户体验。\n\n# 测试表单验证逻辑\n\n\
  无论是简单的登录页面还是复杂的注册流程，确保表单验证能够正常工作对于创建流畅的用户体验至关重要。在测试表单验证时，目标是模拟真实用户的行为。这意味着填写表单字段、提交表单并检查诸如错误消息、字段高亮或成功提交等情况。\n\
  \n## 测试表单提交失败\n\n假设你有一个包含用户名和密码字段的登录表单。编写一个测试来用无效数据填充表单，并检查是否出现了预期的错误消息。Playwright\
  \ 的 `page` 对象是你这里的主要工具。你可以使用 `locator.fill()` 等方法向字段输入文本，使用 `locator.click()` 提交表单，使用\
  \ `locator.locator()` 定位特定元素并检查它们的状态：\n\n```javascript\nimport { test, expect }\
  \ from '@playwright/test';\ntest('Login with invalid credentials shows error message',\
  \ async ({ page }) => {\n  await page.goto('https://www.saucedemo.com/');\n  //\
  \ 等等待定位器\nconst usernameField = page.getByPlaceholder('Username');\n  const passwordField\
  \ = page.getByPlaceholder('Password');\n  const loginButton = page.getByRole('button',\
  \ { name: 'Login' });\n  const errorContainer = page.locator('[data-test=\"error\"\
  ]');\n  // 填充 + 提交\nawait usernameField.fill('invalid_user');\n  await passwordField.fill('wrong_password');\n\
  \  await loginButton.click();\n  // 断言错误可见且文本完全匹配\nawait expect(errorContainer).toBeVisible();\n\
  \  await expect(errorContainer).toContainText(\n    'Epic sadface: Username and\
  \ password do not match any user in this service'\n  );\n});\n```\n\n提交后，你需要检查是否出现了诸如\
  \ `Please enter a valid email` 的错误消息。你可以通过 `data-test` 属性定位错误消息元素，然后使用 `expect(locator).toBeVisible()`\
  \ 或 `expect(locator).toHaveText()` 来断言错误显示。\n\n![图 12.3：Swag Labs 错误消息](img/B34148_12_3.png)\n\
  \n图 12.3：Swag Labs 错误消息\n\n如果你的表单使用客户端验证，你还可以使用以下代码检查邮箱输入是否有红色边框或特定的类（例如 `is-invalid`）：\n\
  \n```javascript\npage.locator('input#email').getAttribute('class').\n```\n\n需要注意的是处理动态内容。表单通常异步显示错误消息或更新\
  \ UI，因此你需要确保 Playwright 等待这些变化。`page.toBeVisible()` 或 `page.waitForTimeout()` 等方法可以帮助，但\
  \ Playwright 的自动等待功能通常会在交互前等待元素变为可操作状态。\n\n在测试表单时，不要忘记可访问性。表单是人们与你的网站交互的主要方式，因此你希望确保验证消息等内容与屏幕阅读器良好配合。通过\
  \ Playwright，你可以检查 ARIA 属性或引入如 `@axe-core/playwright` 等工具，在运行验证测试的同时进行可访问性审计。请参见\
  \ 第 9 章，*使用 Playwright 和 axe-core 进行可访问性测试*。\n\n## 测试表单提交成功\n\n到为止，我们测试了失败的情况，但用户提供有效数据时怎么办？让我们写一个测试来确保表单成功提交，并例如重定向到确认页面：\n\
  \n```javascript\nimport { test, expect } from '@playwright/test';\ntest('valid form\
  \ submission redirects to confirmation', async ({ page }) => {\n  await page.goto('https://www.saucedemo.com/');\n\
  \  const usernameField = page.getByPlaceholder('Username');\n  const passwordField\
  \ = page.getByPlaceholder('Password');\n  const loginButton = page.getByRole('button',\
  \ { name: 'Login' });\n  await usernameField.fill('standard_user');\n  await passwordField.fill('secret_sauce');\n\
  \  await loginButton.click();\n  // 验证重定向到确认页面\nawait expect(page).toHaveURL('https://www.saucedemo.com/inventory.html');\n\
  });\n```\n\n在此测试中，我们为所有字段填充有效数据，提交表单并检查浏览器是否重定向到预期的 URL。如果你的表单没有重定向而是在同一页面显示成功消息，你可以使用\
  \ `expect(page.locator('.success-message')).toBeVisible()` 来检查该消息。\n\n如果交互失败，使用\
  \ `page.screenshot()` 或 `page.pause()` 来调试页面状态。\n\n为了可维护性组织测试对于较大的项目很重要。你可以使用 `test.describe()`\
  \ 将相关测试分组，并使用 `beforeEach()` 设置共同的前提，例如导航到表单页面。\n\n# 总结\n\n测试表单不仅仅是点击按钮和填充字段。它关乎于确保每个部分都能正常工作。\n\
  \n\n\n\n\n上传文件是 Web 应用中最常见的交互操作之一。在手动测试中，这通常意味着点击 `Choose File`（选择文件）按钮，浏览系统的文件选择器并选择正确的文件。然而，在自动化中，我们可以完全跳过这些操作系统级别的对话框，直接与底层的\
  \ `<input type=\"file\">` 元素交互。\n\n# 在测试中自动化文件上传\n\n在大多数 Web 应用中，文件上传是通过 HTML `<input\
  \ type=\"file\">` 元素处理的：你点击按钮，弹出文件选择器，然后从你的电脑中选择一个文件。\n\n当你使用 Playwright 自动化此过程时，你不需要模拟人类去点击那个对话框。相反，Playwright\
  \ 的 `setInputFiles()` 方法允许你直接将文件附加到输入元素上，从而跳过整个弹出过程。这种方式更快、更可靠，并且让你免于去与那些难以自动化的原生操作系统对话框斗斗。\n\
  \n要使用 Playwright 上传文件，首先通过定位器（locator）在页面上找到 `<input type=\"file\">` 元素。即使输入框是隐藏的，Playwright\
  \ 仍然可以对其操作，这非常方便。一旦获取了元素，就可以使用 `setInputFiles()` 方法来模拟用户从系统中选择文件。\n\n如果你上传一个文件，只需将文件路径作为字符串传递；如果你处理多个文件，则传递一个路径数组。例如，如果你在项目的\
  \ `tests` 文件夹中有一个名为 `document.pdf` 的文件，只需指向该路径，Playwright 就会处理其余工作：\n\n```javascript\n\
  import { test, expect } from '@playwright/test';\nimport path from 'node:path';\n\
  test('should upload a single file', async ({ page }) => {\n  // 导航到带有文件输入的页面\nawait\
  \ page.goto('https://demoqa.com/automation-practice-form');\n  // 构建要上传文件的绝对路径\n\
  const filePath = path.join(__dirname, 'document.pdf');\n  // 定位输入元素并设置文件\nawait\
  \ page.locator('input[type=\"file\"]').setInputFiles(filePath);\n  // 确认文件输入反映了所选的文件\n\
  await expect(page.locator('#uploadPicture')).toHaveValue(/document\\.pdf$/);\n \
  \ // 你也可以点击提交按钮并\n// 添加断言来验证上传是否成功\n});\n```\n\n此脚本定义了要上传的文件路径。它使用 `path.join(__dirname,\
  \ 'document.pdf')` 以一种无论你在什么操作系统上都能运行的方式构建该路径。`__dirname` 变量返回当前脚本所在目录的绝对路径`path.join`\
  \ 将其与文件名组合，同时自动为每个操作系统使用正确的斜杠类型（Linux/Mac 使用正斜杠，Windows 使用反斜杠）。这非常重要，因为 Playwright\
  \ 需要确切的绝对文件路径才能成功定位并上传文件。在这种情况下，代码假设脚本旁边紧挨着一个 `document.pdf` 的文件。\n\n此处的核心事件是文件上传。脚本通过使用\
  \ `page.locator('input[type=\"file\"]')` 查找带有 `type=\"file\"` 的 `<input>` 标签来找到页面上的文件输入框。一旦获取了它，就会调用\
  \ `setInputFiles` 并传递我们刚刚构建的文件路径。这基本上是代码模拟用户从文件选择器挑选文件的方式。\n\n你可以在此基础上扩展，例如点击提交按钮并使用\
  \ `expect` 检查上传是否真实生效（我们稍后会介绍），但该部分在这里尚未实现。\n\n# 清空文件选择\n\n在测试文件上传时，有时你可能想检查如果没有选择文件会发生什么，或者如果你需要将文件输入重置为空状态。这对于捕捉边缘情况很有帮助，例如确保在缺少必需文件时表单抛出正确的错误，或者确认当文件是可选运行时一切运行正常。\n\
  \n你只需通过对该输入的定位器调用 `setInputFiles()` 方法并传递一个空数组，即可清空文件输入。\n\n例如，如果你的文件输入 ID 为 `upload`，你可以像这样重置它：\n\
  \n```javascript\nawait page.locator('#upload').setInputFiles([]);\n```\n\n这一行代码会抹除文件选择，就像用户从未选过任何内容一样。\n\
  \n# 处理多个文件上传\n\n目标是自动化通过 Web 表单选择和上传多个文件的过程，这在提交带附件的表单等测试场景中是一项常见任务。\n\n在典型的 Web\
  \ 表单中，通过 `<input type=\"file\" multiple>` 元素启用多个文件上传，允许用户一次选择多个文件。坦率地说，`setInputFiles()`\
  \ 方法非常多能，可以处理单文件和多文件上传，取决于你传递给它的内容。\n\n对于多个文件，你向 `setInputFiles()` 方法传递文件路径数组或类文件对象数组。文件必须存在于你的本地文件系统中，因为\
  \ Playwright 将读取它们并模拟将它们的内容上传到浏览器。\n\n你编写的代码看起来像这样：\n\n```javascript\nimport { test,\
  \ expect } from '@playwright/test';\ntest('should upload multiple files successfully',\
  \ async ({ page }) => {\n  // 导航到文件上传页面。\nawait page.goto('https://filebin.net/');\n\
  \  // 定位文件输入元素\nconst fileInput = page.locator('input[type=\"file\"]');\n  // 设置多个文件进行上传。\n\
  // 确保这些文件存在于你的目录中。\nawait fileInput.setInputFiles([\n    'tests/sample1.jpg',\n\
  \    'tests/sample2.jpg',\n    'tests/sample3.jpg'\n  ]);\n  // 等待下载链接出现，\n// 表示上传已完成\n\
  await expect(page.getByRole('link', { name: 'Download files' })).toBeVisible();\n\
  \  // 验证文件名已显示\n  await expect(page.getByRole('link', { name: 'sample1.jpg' })first().toBeVisible();\n\
  \  await expect(page.getByRole('link', { name: 'sample2.jpg' })).first().toBeVisible();\n\
  \  await expect(page.getByRole('link', { name: 'sample3.jpg' })).first().toBeVisible();\n\
  });\n```\n\n## 在内存中创建类文件对象\n\n当你使用 Playwright 测试文件上传时，有时你可能不想在电脑上处理实际文件。也许你只是想为测试动态创建一些文件。这就是在内存中创建类文件对象很有用的地方。你可以让\
  \ Playwright 认为你正在上传真实文件，而无需向磁盘保存任何内容。\n\n\n\n\n你可以通过创建一个类似于文件的对象数组来实现此操作。每个对象都需要一个名称、一个\
  \ `mime type`（用于告诉浏览器文件类型，例如文本文件的 `text/plain`）以及一个 `buffer`（文件的实际内容，使用 Node.js\
  \ 的 `Buffer.from` 方法创建）。\n\n以下是一个如何创建并上传几个文本文件的快速示例：\n\n```\nawait page.locator('input[type=\"\
  file\"]').setInputFiles([\n  {\n    name: 'file1.txt',\n    mimeType: 'text/plain',\n\
  \    buffer: Buffer.from('Hey, this is the first file's content!')\n  },\n  {\n\
  \    name: 'file2.txt',\n    mimeType: 'text/plain',\n    buffer: Buffer.from('Yo,\
  \ this is the second file's content!')\n  }\n]);\n```\n\n在这段代码中，你直接在内存中创建了两个文本文件。`mimeType`\
  \ 表明它们是纯文本文件，而 `buffer` 将你的字符串转换为 Playwright 可以用作文件内容的二进制数据。当你将其传递给 `setInputFiles`\
  \ 时，就像是你从电脑上选择了这些文件一样。\n\n这个技巧非常棒，因为你可以创建任何类型的文件内容，如 CSV、JSON 甚至图像，而不会用测试文件弄乱你的系统。当你需要尝试不同的文件大小、格式或数据以确保你的应用程序能够正确处理上传时，它是非常完美的。此外，你不需要在之后删除文件。\n\
  \n## 处理多种文件类型（例如 PDF 和 CSV）\n\n由于 Playwright 的 `setInputFiles()` 方法并不真正关乎文件类型（它只是将文件路径交给浏览器），你的任务是确保测试逻辑考虑了应用程序应该如何处理、验证和处理每种格式。\n\
  \n在实际应用中，PDF 上传可能会弹出一个预览，而 CSV 上传可能会被解析为表格。这些是完全不同的行为，你希望测试能够检查每种行为是否符合预期。这意味着你不仅要模拟上传，还要确保应用程序的响应符合你的预期。\n\
  \n假设你的应用程序有一个 `<input type=\"file\">` 元素，它允许同时上传 `.pdf` 和 `.csv` 文件，可能带有 `accept=\"\
  .pdf,.csv\"` 属性。正如我们所见的，通过调用带有文件路径的 `setInputFiles()` 来上传它们非常简单：\n\n```\nawait page.locator('#upload').setInputFiles([\n\
  \  'path/to/document.pdf',\n  'path/to/data.csv'\n]);\n```\n\n你可以在项目中包含示例 PDF 和\
  \ CSV 文件，也可以动态生成它们。动态创建测试文件通常是更好的方法，特别是对于 CSV，它们很容易通过程序生成。PDF 比较复杂，但你可以使用 Node.js\
  \ 中的库（如 `pdfkit`）来创建创建简单的 PDF（[`www.npmjs.com/package/pdfkit`](https://www.npmjs.com/package/pdfkit)）。\n\
  \n一旦文件被上传，你将可能想要验证应用程序是否正确处理了它们。这取决于你的应用程序对 PDF 和 CSV 做了什么。例如，如果应用程序显示 PDF 预览或将\
  \ CSV 渲染为表格，可以使用 Playwright 的断言来验证 UI，如下：\n\n```\nexpect(page.locator('selector')).toBeVisible();\n\
  // 或者 \nexpect(page.locator('selector')).toContainText('Expected Text');\n```\n\n\
  处理不同的文件类型还意味着测试边界情况。例如，如果在只允许 CSV 的情况下上传 DOCX 会发生什么？或者上传一个损坏的 CSV？你可以通过创建无效文件或格式非预期的文件并检查错误消息来测试这些场景。\n\
  \n如果你的应用程序有特定的验证逻辑（例如检查 CSV 表头或 PDF 元数据），你需要定制你的测试文件以触发这些情况。例如，创建一个缺少表头的 CSV 或带有特定元数据的\
  \ PDF，并检查应用程序的行为。Playwright 本身无法解析这些文件，但你可以使用 Node.js 库（用于 CSV 的 `csv-parse` 或用于\
  \ PDF 的 `pdf-parse`）在测试设置或断言中验证文件内容。\n\n如果你的应用程序使用拖放进行上传，原理同样适用。如果投放区域是由 `<input\
  \ type=\"file\">` 元素支持的，请使用带有 PDF 和 CSV 路径的 `setInputFiles`。如果是自定义投放区域，你可能需要模拟拖拽事件，但如果存在输入元素，这种情况很少见且通常没有必要。\n\
  \n在当今 Web 应用中，下载和上传同样重要。你的用户希望下载能够快速启动、顺利完成，并交付他们切想要的内容。这引出了我们的下一个章节。\n\n# 在测试中处理文件下载\n\
  \n在 Web 应用中下载文件可以像点击链接一样简单，也可以像动态创建并发送自定义报告一样复杂。在测试时，挑战不仅在于启动下载，还在于确保正确的文件确实以正确的格式出现并包含你预期的内容。\n\
  \n幸运的是，Playwright 让这一切变得非常简单，你可以捕获下载事件，获取所有文件详情，并检查从文件名到文件大小的一切。\n\n## 触发并验证下载\n\
  \n如果你的 Web 应用允许用户下载文件（例如生成报告或获取已上传的内容），在 Playwright 中自动化并验证这些下载是一项实用的技能。Playwright\
  \ 让这变得简单。你可以启动下载，在事件发生时捕获它，然后检查文件是否完全符合你的预期。\n\n在实际应用中，PDF 上传可能会弹出预览，而 CSV 上传可能会解析为表格。这些是完全不同的行为，你希望测试能够检查每种行为是否符合预期。这意味着不仅要模拟上传，还要确保应用程序的响应符合你的预期。\n\
  \n（注：原文后半部分存在大量重复段落，已根据初始章节提供的唯一内容进行处理。）\n\n\n\n一旦下载开始，承诺（`downloadPromise`）就会解析，并返回一个包含文件详情的\
  \ `download` 对象。我们通过 `download.suggestedFilename()` 获取建议的文件，并并以下代码检查它是否与预期的图片名称匹配：\n\
  \n```\nexpect(fileName).toMatch(/self-portrait_1998.74.5.jpg/);\n```\n\n有时，你可能将下载的文件保存到特定位置以便进一步检查，或者在测试后将其保留。你可以使用\
  \ `download.saveAs()` 将文件复制到所需的路径：\n\n```javascript\nimport { test, expect } from\
  \ '@playwright/test';\ntest('Trigger and verify CSV download', async ({ page })\
  \ => {\n  // 导航到著名的艺术下载页面\nawait page.goto('https://www.nga.gov/artworks/106382-self-portrait');\n\
  \  // 等待下载事件\nconst downloadPromise = page.waitForEvent('download', { timeout: 30000\
  \ });\n  // 定位并点击主下载按钮\nawait page.getByRole('link', { name: 'Download', exact:\
  \ true }).click();\n  // 等待下载开始\nconst download = await downloadPromise;\n  // 验证下载文件\n\
  const fileName = download.suggestedFilename();\n  // 匹配预期的下载文件名\nexpect(fileName).toMatch(/self-portrait_1998.74.5.jpg/);\n\
  \n  // 保存下载的文件以便稍后验证（用于 CI 环境）\nawait download.saveAs(`./downloads/${fileName}`);\n\
  \  // 验证下载路径是否存在\nconst downloadPath = await download.path();\n  expect(downloadPath).not.toBeNull();\n\
  \  console.log(`Downloaded file: ${fileName} at ${downloadPath}`);\n});\n```\n\n\
  如果你想让测试更具健壮性，特别是在你可能稍后要查看文件的 CI 环境中，可以使用以下代码将下载的文件保存到 `downloads` 文件夹中：\n\n```javascript\n\
  \ await download.saveAs(`./downloads/${fileName}`);\n```\n\n这对于验证来说并不是严格要求的，但对于调试或之后运行额外检查很有帮助。只需记住目标文件夹（例如\
  \ `downloads/`）必须预先存在，否则 Playwright 将抛出错误。\n\n解决好后，我们通过检查 `download.path()` 检查路径来确保下载确实发生。断言确认\
  \ Playwright 成功跟踪了该文件且它存在于你的系统上：\n\n```\nexpect(downloadPath).not.toBeNull()\n```\n\
  \n为了更加清晰起见，我们还将文件名和路径记录到控制台。\n\n## 验证下载的内容\n\n如果你想检查下载文件内部的内容，可以从 `download.path()`\
  \ 返回的路径读取它。由于 Playwright 直接将文件保存到磁盘，Node.js 的 `fs` 模块可以让你轻松地查看内容。\n\n首先，如下所示导入 `fs`\
  \ 模块：\n\n```javascript\nconst fs = require('fs').promises;\n```\n\n然后，你可以读取文件并检查内容：\n\
  \n```javascript\nconst content = await fs.readFile(filePath, 'utf8');\nawait expect(content).toContain('Expected\
  \ text in file');\n```\n\n这对于基于文本的文件（如 CSV、JSON 或纯文本）非常有效，你可以直接搜索某些字符串。对于二进制文件（如\
  \ PDF 或图像），你可能需要检查文件大小等，或者使用能够解析它们的库。\n\n例如，要检查我们图片示例中的文件大小，我们可以使用以下代码：\n\n```javascript\n\
  import { test, expect } from '@playwright/test';\nconst fs = require('node:fs').promises;\n\
  test('Trigger and verify CSV download', async ({ page }) => {\n  // 导航到著名的艺术下载页面\n\
  await page.goto('https://www.nga.gov/artworks/106382-self-portrait');\n  // 等待下载事件\n\
  const downloadPromise = page.waitForEvent('download', { timeout: 30000 });\n  //\
  \ 定位并点击主下载按钮\nawait page.getByRole('link', { name: 'Download', exact: true }).click();\n\
  \  // 等待下载开始\nconst download = await downloadPromise;\n  // 验证下载文件\nconst fileName\
  \ = download.suggestedFilename();\n  // 匹配预期的下载文件名\nexpect(fileName).toMatch(/self-portrait_1998.74.5.jpg/);\n\
  \n  // 保存下载的文件以便稍后验证（用于 CI 环境）\nawait download.saveAs(`./downloads/${fileName}`);\n\
  \  // 验证下载路径是否存在\nconst downloadPath = await download.path();\n  expect(downloadPath).not.toBeNull();\n\
  \  // 验证文件大小\nconst stats = await fs.stat(downloadPath);\n  // 将字节转换为 MB\nconst\
  \ fileSizeInMB = stats.size / (1024 * 1024);\n  // 确保文件大小合理 (>100KB)\nexpect(fileSizeInMB).toBeGreaterThan(0.1);\n\
  \  // 确保文件大小不是不实际的大 (<100MB)\nexpect(fileSizeInMB).toBeLessThan(100);\n  console.log(`Downloaded\
  \ file: ${fileName} at ${downloadPath}, Size: ${fileSizeInMB.toFixed(2)} MB`);\n\
  });\n```\n\n这段代码将在控制台中输出类似所示的内容：\n\n```\nDownloaded file: self-portrait_1998.74.5.jpg\
  \ at C:\\Users\\farright\n```\n\n\n\n\n默认情况下，当下载完成时，Playwright 的 `download.path()`\
  \ 会提供一个指向临时位置的文件路径。这些临时文件通常会由 Playwright 自动清理，因此你不需要担心它们在后台堆积。\n\n但有一个陷阱：如果你使用 `saveAs()`\
  \ 方法将文件保存到特定位置，它将不再被视为临时文件，Playwright 也不会替你删除它。在这种情况下，就需要由你来清理了。\n\n实现此操作的一种简单方法是使用\
  \ Node.js 的 `fs.unlink()` 函数，它可以在测试结束后删除文件：\n\n```\nawait fs.unlink(downloadedFilePath);\n\
  ```\n\n你可以将其放在 `afterAll` 钩子中，以确保每次测试运行都从洁净的状态开始：\n\n```\nlet downloadedFilePath;\n\
  afterAll(async () => {\n  if (downloadedFilePath) {\n    await fs.unlink(downloadedFilePath);\n\
  \  }\n});\n```\n\n这样一来，任何通过 `saveAs()` 显式保存的文件在套件结束后都会被删除。在 CI/CD 环境中这通常不是问题，因为容器在运行后会被清空。但对于本地测试，删除这些产物是一个良好习惯，可以防止你的硬盘被数千份测试报告填满。\n\
  \n# 总结\n\n文件上传和下载初看起来可能简单，但在实践中，它们涉及许多微妙的细微差别，特别是当你需要跨不同的浏览器、文件类型和环境进行可靠的测试时。通过\
  \ Playwright 强大的 API（如 `setInputFiles()`）以及其内置的下载处理功能，你可以跳过操作系统级别的对话框，直接控制文件的生命周期，并验证从选择到清理的每一个步骤。\n\
  \n我们已经涵盖了如何上传单个文件和多个文件、在内存中生成测试文件、验证下载完整性、优雅地处理失败以及保持环境整洁。通过自动化这些任务，我们不仅加快了测试进程，还确信我们的应用程序可以处理现实世界的场景，无论用户是上传多页\
  \ PDF、下载生成的报告，还是不小心选择了错误的文件。\n\n根结底，健壮的文件处理测试不仅仅关乎“它能工作吗？”。它们更关乎于确保每个用户在每个浏览器中都能获得流畅、可预测的体验。\n\
  \n在下一章中，我们将介绍如何使用 Playwright 自动化身份验证场景。\n\n## 获取此书的 PDF 版本和独家额外内容\n\n扫描二维码（或访问 [packtpub.com/unlock](https://packtpub.com/unlock)）。按名称搜索此书，确认版本，然后按照页面上的步骤操作。\
  \ | ![](img/Unlock-01.png)![](img/Unlock.png) |\n\n| `Note`: 请妥善保存发票。直接从 Packt 购买的不需要发票。\
  \ |\n\n# 14\n\n# 安全与身份验证\n\n身份验证是大多数 Web 应用程序的门面，对其进行彻底测试对于确保安全性和可用性至关重要。无论用户是在登录、注销、切换角色还是通过第三方提供程序进行验证，过程中的每一步都需要完美运行。即使是一个微小的疏忽也可能导致从糟糕的用户体验到严重的安全漏洞的任何问题。\n\
  \n在本章中，我们将介绍如何使用 Playwright 自动化身份验证场景。我们将从测试几乎每个应用都依赖的核心登录和注销流程开始。然后，我们将深入保存并重用身份验证状态，以加快测试速度并减少重复步骤。\n\
  \n你将看到如何在不反复登录的情况下管理多个用户角色，以及如何在测试设置中保持凭据安全。最后我们将处理更棘手的情况，如 `OAuth` 和单点登录 (`SSO`)，向你展示如何在自动化测试中流畅地处理它们。结束时，你将拥有一套完整的身份验证测试工具包。\n\
  \n本章分为以下部分：\n\n* 测试登录和注销流程\n* 管理会话持久化和效率\n* 在测试中管理多个用户角色\n* 安全和处理复杂的身份验证方法\n\n##\
  \ 技术要求\n\n本章的源代码可在此处获取：\n\n[`github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright/tree/main/Chapter14`](https://github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright/tree/main/Chapter14)。\n\
  \n## 测试登录和注销流程\n\n登录和注销几乎每个 Web 应用的关键部分。测试这些流程有助于发现如重定向错误、会话持久化和 UI 故障等错误。通过 Playwright，你可以自动化这些测试以一致的方式运行并尽早发现问题。\n\
  \n我们已经在 *第 12 章《测试表单》* 中涵盖了如何正确处理登录，现在让我们关注如何正确地注销。当用户注销时，你希望确认他们的会话确实结束，并且他们无法在不重新登录的情况下回到受保护区域。\n\
  \n由于注销需要活跃的会话，我们将首先从登录开始。完成后，我们将通过模拟点击 `Logout` 按钮或链接来触发注销。注销后，我们将通过检查用户是否被重定向到登录页面且无法访问任何受保护的路由来验证会话已结束。\n\
  \n考虑这段代码：\n\n```\nimport { test, expect } from'@playwright/test';\ntest('should\
  \ successfully log out from Swag Labs', async ({ page }) => {\n  // 导航到登录页面\n  await\
  \ page.goto('https://www.saucedemo.com/');\n  // 使用有效凭据登录\n  await page.getByPlaceholder('Username').fill('standard_user');\n\
  \  await page.getByPlaceholder('Password').fill('secret_sauce');\n  await page.getByRole('button',\
  \ { name: 'Login' }).click();\n  // 验证登录成功\n  await expect(page).toHaveURL('https://www.saucedemo.com/inventory.html');\n\
  \  await expect(page.locator('.inventory_list')).toBeVisible();\n  // 打开菜单并注销\n\
  \  await page.getByRole('button', { name: 'Open Menu' }).click();\n  await page.getByRole('link',\
  \ { name: 'Logout' }).click();\n  // 验证重定向到登录页面\n  await expect(page).toHaveURL('https://www.saucedemo.com/');\n\
  \  await expect(page.getByRole('button', { name: 'Login' })).toBeVisible();\n  //\
  \ 验证会话 Cookie session-username 不存在\n  await expect.poll(async () =>\n    (await\
  \ page.context().cookies()).some(\n      cookie => cookie.name === 'session-username'\n\
  \    )\n  ).toBeFalsy();\n  // 访问受保护路由以确认注销\n  await page.goto('https://www.saucedemo.com/inventory.html');\n\
  \  await expect(page).toHaveURL('https://www.saucedemo.com/');\n  await expect(page.getByRole('button',\
  \ { name: 'Login' })).toBeVisible();\n});\n```\n\n为了登录时，我们使用 Playwright 的 `getByPlaceholder()`\
  \ 方法来找到 `username` 和 `password` 字段并填入测试帐户。然后，我们使用 `getByRole('button', { name: 'Login'\
  \ })` 定位 **登录** 按钮并点击。`getByRole()` 方法在这里非常好，因为它寻找的是可访问名称为 `Login` 的按钮，这比依赖脆弱的 CSS\
  \ 选择器更具健壮性。\n\n登录后，我们需要在测试注销之前确认登录是否成功。我们将检查两点：\n\n* 首先，我们确保浏览器的 URL 现在已是 [`www.saucedemo.com/inventory.html`](https://www.saucedemo.com/inventory.html)，这是你成功登录后看到的商品列表页。我们使用\
  \ `expect(page).toHaveURL()` 来实现这一点。\n\n\n\n\n\n-   其次，我们使用 `expect(page.locator('.inventory_list')).toBeVisible()`\
  \ 来验证库存列表（产品网格）在页面上是否可见。这确保了我们确实登录并处于正确的页面。在这里我们必须使用 CSS 选择器（`.inventory_list`），因为没有没有与该元素属性匹配的明确的\
  \ `getBy*` 方法，但由于它是页面结构的关键部分，因此这是一个稳定的选择。\n\n现在是注销部分。Swag Labs 有一个汉堡菜单（右上角的三个条横线），你需要打开它才能访问退出选项：\n\
  \n![图 4.1: 用于访问退出选项的 Swag Labs 汉堡菜单](img/B34148_14_1.png)\n\n图 14.1：用于访问退出选项的 Swag\
  \ Labs 汉堡菜单\n\n我们使用 `getByRole('button', { name: 'Open Menu' })` 找到汉堡菜单按钮并点击。这会打开侧边栏。然后，我们使用\
  \ `page.getByRole('link', { name: 'Logout' })` 找到并点击退出链接。\n\n为了确保注销成功，我们再次检查两件事：\n\
  \n-   首先，我们确认应用清除了用户的身份验证数据。有时注销逻辑是异步运行的，或者 UI 更新快于 Cookie 实际删除的速度，这可能导致测试不稳定（flaky）。但验证\
  \ Cookie 是否被删除只能告诉你客户端会话数据已清除：它不能确认服务器或应用程序正确阻止了未经授权的访问。\n-   其次，我们想要确保会话确实结束，因此我们通过导航到\
  \ [`www.saucedemo.com/inventory.html`](https://www.saucedemo.com/inventory.html)\
  \ 直接访问受保护的路由（库存页）。如果注销成功，网站将把我们重定向回登录页面。我们通过确认 URL 为 [`www.saucedemo.com/`](https://www.saucedemo.com/)\
  \ 且登录按钮仍然可见来检查这一点。\n\n这种双重检查了用户无法在不重新登录的情况下溜回受保护区域。\n\n请记住，如果注销功能失效了另一个测试依赖的保存存储或用户状态，你将感到沮丧，因为你的测试运行将会变得不稳定。\n\
  \n最佳实践是确保你注销的用户是一个专用的测试用户，而不是你保存的用户，这样就不会影响其他测试运行。清除 Cookie 也是同的。\n\n在建立登录和注销的基础之后，下一步是让这些过程更快速、更高效。\n\
  \n# 管理会话持久化与效率\n\n在测试之间保持身份验证会话活跃可以节省大量时间并减少重复步骤。与其在每个场景之前登录，你只需简单地捕获并重用会话数据，以便你的测试在已登录的状态下启动。这包括\
  \ Cookie、本地存储，以及从 1.51 版本开始的 `IndexedDB` 快照（当启用 `indexedDB: true` 时）。参见 [`playwright.dev/docs/release-notes#storagestate-for-indexeddb.`](https://playwright.dev/docs/release-notes#storagestate-for-indexeddb.)。\n\
  \n这不仅加快了整个测试套件的速度，还有防止与登录相关的问题渗透到不涉及登录的测试中。在本节中，我们将介绍如何保存认证数据、在多次运行中重用它，并保持你的会话管理长期稳如磐。\n\
  \n有一个边缘情况需要注意：如果你的身份验证存储在会话存储（session storage）中，`storageState()` 将无法捕获它。在这种情况下，你需要添加一个小的辅助脚本来自己保存和重新加载这些数据。这需要额外的工作，但你可以将逻辑抽象成一个整洁的辅助函数，使其不会弄乱你的测试。Playwright\
  \ 的文档显示了这种方法的良好示例：\n\n[`playwright.dev/docs/auth#session-storage`](https://playwright.dev/docs/auth#session-storage)。\n\
  \n## 保存认证数据\n\n当你的测试涉及多次登录时，Playwright 通过允许你使用存储状态（storage states）保存并重用认证数据让事情变得简单。与其为每个测试登录，你可以登录一次，将会话详情（如\
  \ Cookie 和本地存储）存储文件中，然后在测试之间重用该状态。\n\n遵循 Playwright 的最佳实践，我们将使用专用的设置项目（setup project）来处理身份验证并将会话数据存储在\
  \ `.auth/` 文件夹中，该文件夹应该添加到 `.gitignore` 文件中，以防止提交敏感数据。\n\n### 创建认证设置测试\n\n创建一个名为\
  \ `tests/auth.setup.ts` 的文件来处理登录过程并保存会话存储。此文件将作为一个在其他测试之前运行的设置测试：\n\n```\n// tests/auth.setup.ts\n\
  import { test as setup, expect } from '@playwright/test';\nsetup('authenticate as\
  \ standard_user', async ({ page }) => {\n  // 导航到登录页\nawait page.goto('https://www.saucedemo.com/');\n\
  \  // 使用有效凭据登录\nawait page.getByPlaceholder('Username').fill('standard_user');\n\
  \  await page.getByPlaceholder('Password').fill('secret_sauce');\n  await page.getByRole('button',\
  \ { name: 'Login' }).click();\n  // 验证登录成功\nawait expect(page).toHaveURL('https://www.saucedemo.com/inventory.html');\n\
  \  await expect(page.locator('.inventory_list')).toBeVisible();\n  // 保存状态\nawait\
  \ page.context().storageState({ path: '.auth/user_user.json' });\n});\n```\n\n这里，`setup`\
  \ 别名（`test as setup`）用于定义认证。使用 `standard_user` 凭据登录后，`storageState` 方法将浏览器上下文的状态保存到\
  \ `.auth/`。\n\n### 配置设置项目\n\n更新 `playwright.config.ts` 以包含一个在其他测试之前运行 `auth.setup.ts`\
  \ 的设置项目：\n\n```\n// playwright.config.ts\nimport { defineConfig } from '@playwright/test';\n\
  export default defineConfig({\n  projects: [\n    {\n      name: 'setup',\n    \
  \  testMatch: /.*\\.setup\\.ts/,\n    },\n    {\n      name: 'e2e-tests',\n    \
  \  dependencies: ['setup'],\n      use: {\n        storageState: '.auth/user_user.json',\n\
  \      },\n    },\n  ],\n});\n```\n\n这里，`setup` 项目使用 `testMatch: /.*\\.setup\\.ts/`\
  \ 来包含所有以 `.setup.ts` 结尾的文件，包括 `tests/auth.setup.ts`。`e2e-tests` 项目列出了 `setup` 作为依赖项，确保\
  \ `setup` 项目在执行先运行并通过。`e2e-tests` 项目中的 `use` 选项应用了保存的 `.auth/user_user.json` 状态。\n\
  \n### 使用认证状态编写测试\n\n有了 `setup` 项目，你的测试就可以重用认证状态了：\n\n```\n// tests/inventory.test.ts\n\
  import { test, expect } from '@playwright/test';\ntest('should access inventory\
  \ page with authenticated state', async ({ page }) => {\n  // 不需要登录，\n// 状态从 .auth/user_user.json\
  \ 应用\nawait page.goto('https://www.saucedemo.com/inventory.html');\n  // 验证库存页可访问\n\
  await expect(page).toHaveURL('https://www.saucedemo.com/inventory.html');\n  await\
  \ expect(page.locator('.inventory_list')).toBeVisible();\n  // 在库存页上执行操作\nawait\
  \ expect(page.locator('.inventory_item').first()).toBeVisible();\n  await page.getByText('Add\
  \ to cart').first().click();\n  await expect(page.locator('.shopping_cart_badge')).toHaveText('1');\n\
  \ });\n```\n\n这里，浏览器上下文就像用户已经登录一样开始。测试检查库存页是否加载流畅并显示将商品添加到购物车，这样我们就可以看到登录后一切正常。\n\
  \n### 将 .auth/ 添加到 .gitignore\n\n\n\n\n\n为了防止敏感身份验证数据被提交，请在项目根目录（或你保存存储状态文件的任何地方）创建一个\
  \ `.auth/` 文件夹，并将其添加到 `.gitignore` 文件中：\n\n```\n.auth/\n```\n\n这确保了诸如 `.auth/standard_user.json`\
  \ 等文件不会被 Git 跟踪。\n\n现在，`.auth/standard_user.json` 文件可以在多个测试套件之间复用，从而减少登录开销。你可以在单独\
  \ `.setup.ts` 文件中为不同的用户角色创建额外的设置测试，每个文件保存它自己的存储状态，例如 `.auth/admin_user.json`。\n\n\
  ## 复用身份验证数据的方法\n\n你可以在 Playwright 配置（`playwright.config.ts`）中全局应用存储状态，也可以在测试中使用\
  \ `test.use()` 方法或 `browser.newContext()` 单独应用。当应用存储状态时，浏览器上下文将从已验证的会话启动，因此你可以直接导航到受保护的路由而无需重新登录。\n\
  \n在接下来的示例中，你将看到如何使用 `test.use()` 方法加载我们在上一节中保存的 `standard_user.json` 文件：\n\n```\n\
  import { test, expect } from '@playwright/test';\n// 使用保存的存储状态绕过登录\ntest.use({ storageState:\
  \ './.auth/standard_user.json' });\ntest('should access inventory page with saved\
  \ storage state', async ({ page }) => {\n  // 直接导航到库存页\nawait page.goto('https://www.saucedemo.com/inventory.html');\n\
  \  // 验证库存页无需重定向即可可访问\nawait expect(page).toHaveURL('https://www.saucedemo.com/inventory.html');\n\
  \  await expect(page.locator('.inventory_list')).toBeVisible();\n  // 示例：在库存页执行操作\n\
  await expect(page.locator('.inventory_item').first()).toBeVisible();\n  await page.getByText('Add\
  \ to cart').first().click();\n  await expect(page.locator('.shopping_cart_badge')).toHaveText('1');\n\
  });\n```\n\n`test.use({ storageState: './.auth/standard_user.json' })` 这一行告诉 Playwright\
  \ 将保存的存储状态应用到测试中，因此浏览器上下文启动时就像用户已经登录了一样。\n\n你也可以在 `playwright.config.ts` 文件中进行配置：\n\
  \n```\nconst config = {\n  projects: [\n    {\n      name: 'authenticated',\n  \
  \    use: {\n        storageState: './.auth/standard_user.json',\n      },\n   \
  \ },\n  ],\n  // 其他设置\n};\nexport default config;\n```\n\n通过这种设置，你可以通过指定项目来运行带有身份验证状态的测试：\n\
  \n```\nnpx playwright test --project=authenticated\n```\n\n有时会话可能会超时，或者你的登录方式可能会发生，因此偶尔刷新你的存储状态是一个明智之举，这可以保持一切运行顺畅。\n\
  \n你可以为不同的角色保存多个存储状态。这使得使得使用不同的已登录用户进行测试变得更加容易。查看 Playwright 文档获取示例：[`playwright.dev/docs/auth#multiple-signed-in-roles`](https://playwright.dev/docs/auth#multiple-signed-in-roles)。\n\
  \n当应用程序使用**基于角色的访问控制** (**RBRBAC**) 时，仅使用单个用户账户进行测试是不够的。这引导我们进入下一节。\n\n# 在测试中管理多个用户角色\n\
  \n当你运行 Playwright 测试时，有时你需要从不同类型用户的视角来测试应用程序，例如管理员、编辑者、查看者等。这在使用 RBAC 的应用程序中经常出现。\n\
  \n在现实世界的应用中，不同的用户不仅具有不同的权限：他们通常会看到完全不同的 UI 部分，遵循不同的工作流，并且可以执行（或不执行）某些操作。管理员可能删除记录，而普通用户只能查看。为了确保你的测试涵盖了所有这些场景，你需要一种在不不断登录和注销的情况下切换角色的方法。\n\
  \n这里的主要技巧是浏览器上下文（browser contexts）。你可以为管理员启动一个上下文，为普通用户启动另一个，并让它们并行运行而不会产生任何冲突。每个上下文都使用自己的凭据保持登录状态，它们不会互相干扰。\n\
  \n要进行此设置，你通常从创建一个浏览器实例开始，然后从中派生多个上下文。这里有一个示例说明：\n\n```\nimport { test, expect, BrowserContext\
  \ } from \"@playwright/test\";\nlet standardContext: BrowserContext;\nlet lockedoutContext:\
  \ BrowserContext;\ntest.afterAll(async () => {\n  await standardContext.close();\n\
  \  await lockedoutContext.close();\n});\ntest(\"Standard vs Locked Out Permissions\"\
  , async ({ browser }) => {\n  // 为标准用户和封锁用户创建独立的上下文\n  standardContext = await browser.newContext();\n\
  \  lockedoutContext = await browser.newContext();\n  const standardPage = await\
  \ standardContext.newPage();\n  const lockedoutPage = await lockedoutContext.newPage();\n\
  \  // 标准登录\nawait standardPage.goto(\"https://www.saucedemo.com/\");\n  await standardPage.getByPlaceholder(\"\
  Username\").fill(\"standard_user\");\n  await standardPage.getByPlaceholder(\"Password\"\
  ).fill(\"secret_sauce\");\n  await standardPage.getByRole(\"button\", { name: \"\
  Login\" }).click();\n  // 验证标准用户可以访问库存页\nawait expect(standardPage).toHaveURL(\n\
  \    \"https://www.saucedemo.com/inventory.html\"\n  );\n  await expect(standardPage.locator(\"\
  .title\")).toHaveText(\"Products\");\n  // 封锁用户\nawait lockedoutPage.goto(\"https://www.saucedemo.com/\"\
  );\n  await lockedoutPage.getByPlaceholder(\"Username\").fill(\"locked_out\");\n\
  \  await lockedoutPage.getByPlaceholder(\"Password\").fill(\"secret_sauce\");\n\
  \  await lockedoutPage.getByRole(\"button\", { name: \"Login\" }).click();\n  //\
  \ 验证封锁用户获取错误信息\nconst errorMessage = lockedoutPage.locator('[data-test=\"error\"\
  ]');\n  await expect(errorMessage).toBeVisible();\n  await expect(errorMessage).toHaveText(\n\
  \    \"Epic sadface: Sorry, this user has been locked out.\"\n  );\n});\n```\n\n\
  在这个示例中，创建了两个上下文：一个用于标准用户，另一个用于封锁用户。每个上下文都有自己的页面，你使用不同的凭据登录。测试随后验证标准用户可以访问库存页，而封锁用户不能。由于上下文是隔离的，它们的会话不会互相干扰。\n\
  \n你需要注意的是资源管理。每个上下文都会消耗内存，因此在测试运行中派生过多的上下文可能会增加系统负担，特别是在 CI 环境中。为了优化，请在不再需要时关闭上下文和页面。\n\
  \n\n\n\n在 Playwright 中存储凭据的一种简单且安全的方法是使用环境变量。虽然 Playwright 没有自带内置的密钥管理器，但环境变量是保持敏感信息安全的极选择。环境变量本质上是存储在代码库之外的小键值对。它们通常由你的操作系统或在运行时管理。\n\
  \n目标是将密码、令牌和其他私有细节排除在脚本之外，而而仅在测试运行时才加载它们。由于 Playwright 运行在 Node.js 环境中，你可以使用 `process.env`\
  \ 轻松地获取这些值。\n\n要开始使用，你可以根据你的设置通过几种方式设置环境变量。如果你在本地运行测试，可以在执行 Playwright 脚本之前在终端中定义它们。\n\
  \n在 Linux 或 macOS 上，在终端中运行以下命令：\n\n```bash\nexport USERNAME=\"standard_user\"\n\
  export PASSWORD=\"secret_sauce\"\n```\n\n在 Windows 上，使用以下命令：\n\n```bash\nset USERNAME=standard_user\n\
  set PASSWORD=secret_sauce\n```\n\n设置完成后，你就可以在 Playwright 脚本中使用它们，而无需硬编码任何密钥。\n\n\
  在你的 Playwright 脚本中，你可以这样访问这些变量：\n\n```javascript\nimport { test, expect } from '@playwright/test';\n\
  const username = process.env.USERNAME;\nconst password = process.env.PASSWORD;\n\
  test.beforeAll(() => {\n  if (!username || !password) {\n    throw new Error('ERROR:\
  \ USERNAME or PASSWORD not defined in environment variables.');\n  }\n});\ntest('should\
  \ successfully log out from Swag Labs', async ({ page }) => {\n  // 导航到登录页面\nawait\
  \ page.goto('https://www.saucedemo.com/');\n  // 使用有效凭据登录\nawait page.getByPlaceholder('Username').fill(username);\n\
  \  await page.getByPlaceholder('Password').fill(password);\n  await page.getByRole('button',\
  \ { name: 'Login' }).click();\n});\n```\n\n在这里，凭据是在运行时从环境变量中提取的，因此它们永远不会硬编码在脚本中。这是一种保持安全的简单而有效的方法，特别是对于小型项目或本地开发而言。\n\
  \n如果你正在处理一个较大的项目或与团队协作，使用 `.env` 文件来管理环境变量将是一个良好的组织主意。在 Node.js 中，`dotenv` 包让这变得简单。\n\
  \n首先，使用以下命令安装它：\n\n```bash\nnpm install dotenv\n```\n\n然后，在项目的根目录下创建一个 `.env` 文件并添加以下内容：\n\
  \n```bash\nUSERNAME=standard_user\nPASSWORD=secret_sauce\n```\n\n这样，你的敏感信息就不会留在代码中。现在，在你的\
  \ Playwright 脚本中，通过在顶部添加 `import dotenv from 'dotenv';` 来加载 `.env` 文件：\n\n```javascript\n\
  import { test, expect } from '@playwright/test';\nimport dotenv from 'dotenv';\n\
  dotenv.config();\ntest('login to example.com', async ({ page }) => {\n  const username\
  \ = process.env.USERNAME;\n  const password = process.env.PASSWORD;\n  // 去到登录页面\n\
  await page.goto('https://www.saucedemo.com/');\n  // 使用有效凭据登录\nawait page.getByPlaceholder('Username').fill(username);\n\
  \  await page.getByPlaceholder('Password').fill(password);\n  await page.getByRole('button',\
  \ { name: 'Login' }).click();\n  await expect(page).toHaveURL('https://www.saucedemo.com/inventory.html');\n\
  });\n```\n\n为了防止你的 `.env` 文件泄入版本控制，只需将其添加到 `.gitignore` 文件中。这样，敏感数据就会保留在本地，或者以安全的方式进行单独管理。\n\
  \n如果你在 CI/CD 环境（如 GitHub Actions 或 Jenkins）中工作，可以直接在 CI 平台的设置中配置环境变量，这样存储库中就完全不需要\
  \ `.env` 文件了。\n\n通常最好的做法是从 Playwright 配置文件提取变量，这样它们只会加载一次，而不是在每个测试中都获取一次。我们将在*Real-World\
  \ Project – Testing an E-commerce Website* 项目中详细介绍这一点。\n\n为了进一步提升安全性（特别是在云环境中），使用密钥管理工具是值得的。如\
  \ AWS Secrets Manager、HashiCorp Vault 或 Azure Key Vault 等服务可以安全地存储凭据，并让你通过 API 或\
  \ SDK 访问它们。在 Playwright 中，你只需要在测试运行之前通过编程方式获取这些密钥。对于小型项目来说这可能有些过度，但对于有严格安全需求的企业级配置来说，这是一个明智之举。\n\
  \n如果你在寻找更多示例，一个很好的例子是在 Sauce Demo 上使用实际 API 调用来保存存储状态，供你的设置文件使用。这是一个实用的示例：[`github.com/playwrightsolutions/playwright-practicesoftwaretesting.com/blob/main/lib/datafactory/login.ts`](https://github.com/playwrightsolutions/playwright-practicesoftwaretesting.com/blob/main/lib/datafactory/login.ts)。\n\
  \n## 处理 OAuth 和 SSO 场景\n\n在 Playwright 中处理 OAuth 和 SSO 场景可能会有点棘，因为这些身份验证流通常涉及复杂的重定向、外部身份提供者\
  \ (`IdPs`) 和会话管理。\n\nOAuth 让你登录一个账户（如 Google 或 Facebook），然后授予另一个应用权限。SSO 是一种方便的方法，只需登录一次即可访问多个应用，而无需反复切换密码。例如，当你使用账户登录\
  \ Google 时，可以直接进入 YouTube 而无需再次登录。\n\n在 Playwright 中处理 SSO 可能会很棘，因为通常意味着要处理登录页面、弹出窗口或动态变化的令牌。要在\
  \ Playwright 中自动化 OAuth 和 SSO，你可以模拟用户的操作：填写表单、点击按钮以及处理通过 IdP 的重定向。然而，CAPTCHA 或多因素身份验证\
  \ (`MFA`)（例如基于时间的一次性密码 `TOTP`）可能会增加自动化的难度。\n\n以下是处理这些情况的一些实用方法：\n\n- 手动登录并保存会话：\n\
  \  - 使用持久上下文启动 Playwright 浏览器以保存会话。\n  - 导航到登录页面，手动完成 SSO 流程（例如登录 Google），并将 Cookie\
  \ 和本地存储保存到项目文件夹的文件。\n  - 在后续测试中重用保存的状态以跳过登录过程。\n\n这种方法对于复杂或稳定的 SSO 流非常有效，这样你就无需处理编写复杂的身份验证脚本。\n\
  \n- 绕过 CAPTCHA：在测试环境中，通常可以通过配置测试环境禁用它们或使用模拟响应来绕过 CAPTCHA。请参考 IdP 的文档获取特定的测试配置，例如为测试账户禁用\
  \ CAPTCHA。\n\n- 处理基于 TOTP 的 MFA：对于使用 TOTP 的 MFA，如果你拥有 TOTP 密钥，自动化是可能的。通过存储密钥，你可以在登录期间通过编程方式生成有效的\
  \ TOTP 代码。Playwright 可以与 Node.js 中的 `OTPAuth` 等库集成以生成这些代码。\n\n\n\n\n\n*   **自动化基于电子邮件或短信的\
  \ MFA**：对于通过电子邮件或短信发送的 MFA 代码，可以使用如 Mailosaur ([`mailosaur.com/`](https://mailosaur.com/))\
  \ 等工具提供的 API，从测试邮箱账户或电话号码编程地获取代码。\n*   **直接注入令牌或 Cookie**：如果你的应用程序支持 OAuth 令牌验证或直接设置\
  \ Cookie，你可以跳过基于浏览器的 SSO 流程。对于具有 API 权限或测试用户的测试环境，可以将 OAuth 访问令牌注入到浏览器的本地存储中或直接设置\
  \ Cookie，以便无需通过整个登录流程即可进行身份验证。\n\n追求务实的混合方案：快速、稳定且覆盖日常行为的测试，再加上少数几个范围严密的全流程测试，以验证真实的\
  \ OAuth/SSO 集成。这种平衡既让你充满信心，又不会让你的测试套件成为维护负担。\n\n# 总结\n\n身份验证是应用安全的核心，对其进行彻底测试是不可忽视的。在本章中，我们学习了如何验证登录和注销流程、保存并重用身份验证状态以加速测试执行，以及在无需不断重新验证的情况下管理多个用户角色。我们还探索了管理凭据的安全方法，以及自动化处理\
  \ OAuth 和 SSO 等较复杂设置的技巧。\n\n这里的技术不仅仅是为了让测试通过：更是为了让身份验证测试随着时间的推移变得更快、更易维护。随着你自动化覆盖范围的扩大，请在此过程中不断优化你的方法。定期刷新存储的会话，适应不断演变的身份验证流程，并保持敏感数据的安全。\n\
  \n有了这些实践，你的身份验证测试将准备好应对应用程序或其安全需求带来的任何变化。\n\n下一章将关于编写简洁、可维护的测试代码，以补充本章。\n\n# 获取本书的\
  \ PDF 版本和独家额外内容\n\n| 扫描二维码（或访问 [packtpub.com/unlock](https://packtpub.com/unlock)）。按名称搜索此书，确认版本，然后按照页面上的步骤操作。\
  \ | ![](img/Unlock-01.png)![](img/Unlock.png) |\n| **注意**：请妥善保管发票。直接从 Packt 购买不需要发票。\
  \ |\n\n# 测试可维护性的 15 最佳实践\n\n测试 Web 应用程序可能会令人沮丧，因为现代应用程序是复杂的、瞬息万变且充满惊喜的。在*第 14 章**安全与身份验证*\
  \ 中，我们深入研究了编写 Playwright 测试的艺术，这些测试不仅具有功能性，而且简洁、易读且易于维护。本章是你构建测试套件的指南，使其看起来不像一团乱乱的代码，而更像一个组织良好的故事，有清晰的开头、中间和结尾。\n\
  \n我们将探索如何构建你的测试，利用**页面对象模型** (**POM**) 来保持整洁，并管理测试数据以防止那些令人沮丧的随机性失败。无论你是在测试简单的登录页面还是庞大的电子商务平台，这些最佳实践将帮助你编写出可扩展且易于操作的测试。\n\
  \n本章分为以下几个部分：\n\n*   编写简洁易读的测试代码\n*   实现页面对象以改进测试组织\n*   有效管理测试数据以减少维护\n\n## 技术要求\n\
  \n本章的源代码可用：\n\n[`github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright/tree/main/Chapter15`](https://github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright/tree/main/Chapter15)。\n\
  \n# 编写简洁易读的测试代码\n\n当测试杂乱或结构不佳时，调试就会变成一项苦差，维护它们感觉就像在解绳结。这一部分完全关于保持你的代码易于理解。\n\n##\
  \ 使用 `describe()` 块组织测试\n\n让我们先考虑测试的结构。一个组织良好的测试套件就像一个写得好的故事：它有清晰的开头、逻辑性的进展和满意的结局。Playwright\
  \ 通过使用 `describe()` 块来鼓励这种做法，该块可以用于为单个场景分组相关的测试函数。不要将所有内容都挤在一个巨大的文件中，而是将其拆分为专注于集中的文件或套件。\n\
  \n例如，如果你正在测试登录功能，你可能会有一个 `login.spec.ts` 文件，在描述性标签下对测试分组。这不仅使导航更加容易，而且在测试失败时很有帮助，因为你可以快速定位上下文。\n\
  \n考虑这个测试登录页面的简单示例：\n\n```\nimport { test, expect } from '@playwright/test';\ntest.describe('Login\
  \ Functionality', () => {\n  test('should allow valid user to log in', async ({\
  \ page }) => {\n    await page.goto('https://www.saucedemo.com/');\n    await page.getByPlaceholder('Username').fill('standard_user');\n\
  \    await page.getByPlaceholder('Password').fill('secret_sauce');\n    await page.getByRole('button',\
  \ { name: 'Login' }).click();\n    await expect(page).toHaveURL('https://www.saucedemo.com/inventory.html');\n\
  \  });\n  test('should show error for invalid credentials', async ({ page }) =>\
  \ {\n    await page.goto('https://www.saucedemo.com/');\n    await page.getByPlaceholder('Username').fill('locked_out_user');\n\
  \    await page.getByPlaceholder('Password').fill('secret_sauce');\n    await page.getByRole('button',\
  \ { name: 'Login' }).click();\n    await expect(page.getByText('Epic sadface: Sorry,\
  \ this user has been locked out.')).toBeVisible();\n  });\n});\n```\n\n在这里，`describe`\
  \ 块设定了场景，每个测试读起来像一个句子：`'should allow valid user to log in'`。这种对话式的命名让意图一目了然。对比一下\
  \ `test1` 或 `loginTest` 等模糊名称。\n\nPlaywright 的文档有一页关于编写可靠且健壮测试的实用技巧。你可以在这里查看[`playwright.dev/docs/best-practices`](https://playwright.dev/docs/best-practices)。\n\
  \n## 使用 fixture 进行设置和清理\n\n**Fixture（固件）** 是 Playwright 中用于设置和清理的另一个宝。框架提供了开箱用的\
  \ fixture，如 `page`、`browser` 和 `context`，它们会自动处理浏览器管理。对于自定义需求，你可以定义自己的 fixture。\n\
  \n我们在*第 6 章**测试并行与性能优化* 中已经探索过如何定义自定义 fixture。但为了保持记忆，让我们再次快速回顾一下。\n\n假设你在多个测试中需要登录状态：你可以创建一个在每个测试开始时调用并登录的\
  \ fixture。这是一个示例：\n\n```\nimport { test as base } from '@playwright/test';\nexport\
  \ const test = base.extend({\n  login: async ({ page }, use) => {\n    await page.goto('https://www.saucedemo.com/');\n\
  \    const login = async (username, password) => {\n      await page.getByPlaceholder('Username').fill(username);\n\
  \      await page.getByPlaceholder('Password').fill(password);\n      await page.getByRole('button',\
  \ { name: 'Login' }).click();\n    };\n    await use(login);\n  },\n});\n```\n\n\
  fixture 将负责导航到登录页面并登录。测试现在使用此 fixture 来处理登录操作，从而保持代码的整洁。\n\n\n\n\n\n```javascript\n\
  import { test, expect } from './loginFixture';\nimport { expect } from '@playwright/test';\n\
  test.describe('Login Functionality', () => {\n  test('should allow valid user to\
  \ log in', async ({ login, page }) => {\n    await login('standard_user', 'secret_sauce');\n\
  \    await expect(page).toHaveURL('https://www.saucedemo.com/inventory.html');\n\
  \  });\n  test('should show error for invalid credentials', async ({ login, page\
  \ }) => {\n    await login('locked_out_user', 'secret_sauce');\n    await expect(page.getByText('Epic\
  \ sadface: Sorry, this user has been locked out.')).toBeVisible();\n  });\n});\n\
  ```\n\n通过这种方式，每个测试都可以集中关注真正重要的事情：检查有效凭据是否成功登录，或者在无效凭据时是否显示错误信息，而无需重复所有的导航和输入步骤。这让你的测试保持了\
  \ `DRY（Don’t Repeat Yourself，不要重复自己）`。\n\nPlaywright 处理了大部分清理工作，但你可以使用 `afterEach()`\
  \ 或 `afterAll()` 钩子进行任何手动释放，例如关闭模态框或重置数据（参见 [`playwright.dev/docs/api/class-test`](https://playwright.dev/docs/api/class-test)）。\n\
  \n请记住，这个 fixture（Fixture）会在使用它的每个测试开始时运行登录步骤。如果你想避免每个测试都重新登录，可以使用 Playwright 的 `storageState`。我们将在\
  \ *第 16 章*，实战项目 – 测试电子商务网站* 中介绍这一点。\n\n不要忽略可追溯性：在配置中开启追踪以便调试（`trace: 'on-failure'`）。\n\
  \n另一种为你的代码提供清晰结构的方法是使用 `POM`（页面对象模型），这就是我们接下来要介绍的内容。\n\n# 实现页面对象以更好地测试组织结构\n\nPOM\
  \ 是关键模式之一，它可以将你的代码库从选择器和操作的混乱杂麻变为整洁且易于维护的状态。\n\n让我们看看它们解决的问题，然后介绍如何有效地实现 POM 以创建更有组织性的测试。\n\
  \n## 测试重复的痛苦\n\n如果你曾为了更新一个简单的 CSS 选择器而翻遍数百行测试代码，那么你已经知道 POM 为什么重要了。这个理念很简单：你将每个页面或\
  \ Web 应用的任何主要部分视为它自己的类。该类持有关于页面结构的所有信息（例如元素定位器）以及你可以在其上执行的操作（例如点击按钮或填写表单）。这种模式并不新：它在\
  \ Selenium 等工具中已经存在很久，但 Playwright 现代 API 使其操作起来更加简单。\n\n如果没有页面对象，你的测试可能看起来是一系列与浏览器的直接交互：导航到\
  \ URL、通过选择器定位元素并执行操作。这对于快速脚本没有问题，但随着测试套件的增长，重复就会出现。假设你正在测试一个包含登录、产品搜索和结账流程的电子商务。相同的登录步骤会在多个测试中重复，如果\
  \ UI 发生了变化（可能按钮的类名被更新了），你需要在几十个地方修复它。\n\n页面对象通过集中这些知识来解决这个问题。每个页面类都了解自己的元素和方法，因此你的测试变得更具可读性，就像读故事一样：*进入登录页面，输入凭据，提交*。此外，它还促进了重用性：你可以通过链式页面方法来组合复杂的流程。\n\
  \n## 实现 POM\n\n假设你正在测试一个简单的 todo 应用程序，例如 [`demo.playwright.dev/todomvc`](https://demo.playwright.dev/todomvc)\
  \ 中的那个，它有一个用于添加和管理待办事项的首页。要实现页面对象，首先为页面创建一个类。将其从类似 `pages/TodoPage.ts` 的文件中导出。\n\
  \n这是我们 `TodoPage` 类的基础示例：\n\n```javascript\nimport { type Page, type Locator } from\
  \ '@playwright/test';\nexport class TodoPage {\n  readonly page: Page;\n  readonly\
  \ newTodoInput: Locator;\n  readonly todoItems: Locator;\n  readonly clearCompletedButton:\
  \ Locator;\n  constructor(page: Page) {\n    this.page = page;\n    this.newTodoInput\
  \ = page.locator('input.new-todo');\n    this.todoItems = page.locator('ul.todo-list\
  \ li');\n    this.clearCompletedButton = page.locator('button.clear-completed');\n\
  \  }\n  async goto() {\n    await this.page.goto('https://demo.playwright.dev/todomvc');\n\
  \  }\n  async addTodo(text: string) {\n    await this.newTodoInput.fill(text);\n\
  \    await this.newTodoInput.press('Enter');\n  }\n  async toggleTodo(index: number)\
  \ {\n    await this.todoItems.nth(index).locator('input.toggle').check();\n  }\n\
  \  async clearCompleted() {\n    await this.clearCompletedButton.click();\n  }\n\
  }\n```\n\n在类内部，你有一个构造函数，接收来自 Playwright 的 `Page` 实例。这是你操作浏览器页面的句柄。然后，将 `page.getBy*`\
  \ 或 `page.locator()` 方法定义为类属性。这些方法是懒性的：在你在使用它们之前不会查询 DOM，这非常高效。对于操作，你可以添加执行序列操作的异步方法。\n\
  \n`await` 关键字对于 Playwright 执行的任何操作都是必要的。对于定位器本身，你不需要 `await`。但当你的函数内部调用操作时，你需要。\n\
  \n现在，在你的测试文件中（例如 `tests/todo.spec.ts`）中，导入此页面对象并像这样使用：\n\n```javascript\nimport\
  \ { test, expect } from '@playwright/test';\nimport { TodoPage } from '../pages/TodoPage';\n\
  test('should add and complete a todo', async ({ page }) => {\n  const todoPage =\
  \ new TodoPage(page);\n  await todoPage.goto();\n  await todoPage.addTodo('Buy groceries');\n\
  \  await expect(todoPage.todoItems).toHaveCount(1);\n  await todoPage.toggleTodo(0);\n\
  \  await todoPage.clearCompleted();\n  await expect(todoPage.todoItems).toHaveCount(0);\n\
  });\n```\n\n这个测试读起来就像普通的英语。你没有被底层细节干扰，而是关注正在验证的行为。这就是 POM 的魅力：分离关注点，使测试更易理解。\n\n\
  让我们通过重构本章之前的测试来使用页面对象，来看另一个示例：\n\n```javascript\nimport { Page, Locator } from '@playwright/test';\n\
  export class LoginPage {\n  private page: Page;\n  private usernameInput: Locator;\n\
  \  private passwordInput: Locator;\n  private submitButton: Locator;\n  private\
  \ errorMessage: Locator;\n  constructor(page: Page) {\n    this.page = page;\n \
  \   this.usernameInput = page.getByPlaceholder('Username');\n    this.passwordInput\
  \ = page.getByPlaceholder('Password');\n    this.submitButton = page.getByRole('button',\
  \ { name: 'Login' });\n    this.errorMessage = page.locator('[data-test=\"error\"\
  ]');\n  }\n  async navigate() {\n    await this.page.goto('https://www.saucedemo.com/');\n\
  \  }\n  async login(username: string, password: string) {\n    await this.usernameInput.fill(username);\n\
  \    await this.passwordInput.fill(password);\n    await this.submitButton.click();\n\
  \  }\n  async getErrorMessage() {\n    return this.errorMessage.textContent();\n\
  \  }\n}\n```\n\n这种 POM 模式将我们的测试代码组织到一个可重用的类中。该类声明了私有属性来存储登录页面关键元素的定位器：用户名密码字段、提交按钮以及错误消息元素。\n\
  \n在函数上方添加 JSDoc 注释可以让它们在 VS Code 等编辑器中更易理解和使用。例如，这里是你可以为 `LoginPage` 类中的 `login`\
  \ 函数编写文档：\n\n\n\n\n\n```javascript\n/** \n* 使用指定的用户名和密码进行登录。 \n * @param {string}\
  \ username - 用于登录的用户名。 \n * @param {string} password - 用于登录的密码。 \n * 使用提供的凭据登录网站。\
  \ \n */\n```\n\n通过将这些内容存储为类属性，所有的元素引用都集中在一个地方。因此，如果 UI 发生变化（例如用户名字段的 ID 更新了），你只需要在一个地方进行修改即可。\n\
  \n现在，在你的测试文件中，你可以这样导入这个页面对象（page object）：\n\n```javascript\nimport { test, expect\
  \ } from '@playwright/test';\nimport { LoginPage } from '../pages/LoginPage';\n\
  test.describe('登录功能测试', () => {\n  test('应该允许有效用户登录', async ({ page }) => {\n  \
  \  const loginPage = new LoginPage(page);\n    await loginPage.navigate();\n   \
  \ await loginPage.login('standard_user', 'secret_sauce');\n    await expect(page).toHaveURL('https://www.saucedemo.com/inventory.html');\n\
  \  });\n  test('应该在凭据无效时显示错误', async ({ page }) => {\n    const loginPage = new\
  \ LoginPage(page);\n    await loginPage.navigate();\n    await loginPage.login('locked_out_user',\
  \ 'secret_sauce');\n    const error = await loginPage.getErrorMessage();\n    expect(error).toBe('Epic\
  \ sadface: Sorry, this user has been locked out.');\n  });\n});\n```\n\n现在的测试读起来就像用户故事一样，而页面对象隐藏了底细节。这种模式对于具有多个页面的大型应用程序具有极的可扩展性。\n\
  \n你可能注意到，这两个 Playwright 测试在声明类属性的方式有所不同：`TodoPage` 类对其属性使用了 `readonly`（例如页面实例和定位器），这是合理的，因为这标志着这些内容在构造函数中设置一次后之后就不会再改变。这与页面对象非常契合，因为它们通常持有对网页及其元素的固定引用，而\
  \ `readonly` 让 TypeScript 强制执行这种不可变性，并捕获任何意外的重新赋值。\n\n相反，`LoginPage` 对其属性使用了 `private`，这更多是为了将内容封装起来，而不是确保它们永远不会改变。通过\
  \ `private`，类在表达：“这些属性是我的，只有我能操作它们。”这侧重于封装，确保没有外部代码可以直接干扰页面或定位器。\n\n与 `readonly`\
  \ 不同，`private` 不会阻止你在类内部重新赋值这些属性，尽管 `LoginPage` 实际上并没有这样做。这种区别在于风格或团队偏好：`readonly`\
  \ 强调不可变性，而 `private` 优先考虑访问控制。这两种方法都是有效的，并且符合 POM（页面对象模型）原则，但它们针对的是略不同的需求。\n\n最佳实践是不在你的页面对象文件中包含任何断言（assertions）。断言应该放在测试文件中。\n\
  \n先从小规模开始尝试 POM，然后逐步扩大。当你将此应用到项目中时，你可能会发现你的测试变得更加健壮，调试时间也变得更短了。\n\n在你构建 Playwright\
  \ 测试套件时，你会很快注意到，处理测试数据的方式会决定它的可维护性。硬编码用户名或电子邮件等值似乎是一个快速见效的方法，但它往往会导致测试变得脆弱，当环境变化或需求演变时就会失败。下一节将探讨如何有效地管理测试数据。\n\
  \n# 有效管理测试数据以减少维护\n\n当我们深入研究使用 Playwright 构建健壮的端到端测试时，一个让即使经验丰富的开发者经常感到困扰的问题是如何处理测试数据。测试数据包括驱动测试的输入、配置和预期输出，如果不进行用心管理，可能会迅速变成脆弱性的源头。\n\
  \n## 硬编码测试数据的风险\n\n假设你正在测试 Web 应用中的一个用户注册表单。你直接将如 `testuser@example.com` 的用户名硬编码在测试脚本中。在应用程序的验证规则发生变化，或者你需要在另一个该邮箱已被占用的环境中运行测试之前，它运行得良好。突然之间，你正在调试与实际功能完全无关的失败。这就是糟糕的测试数据管理显现出来，导致了不稳定的测试（flaky\
  \ tests）、代码重复以及在更新上浪费的数小时。\n\n直接将数据硬编码在测试文件中启动很快，但随着你测试套件的增长，在几十个测试中更新硬编码的值将变成一场噩梦。由于动态数据（如时间戳或应用程序生成的\
  \ ID）也难以处理。如果你的测试期望精确匹配且不允许这种自然变异性，你可能会遇到莫名其妙的失败。\n\n环境依赖是另一个罪魁祸首。测试在开发环境中可能正常，但在测试环境中可能会崩溃，因为数据库种子（seed）不同，或者\
  \ API 返回了意料之外的内容。如果你过度依赖类生产环境的数据，就会面临暴露敏感信息或违反合规规则的风险。这些问题不仅让测试更难维护，还可能损害你对整个测试套件的信任。\n\
  \n良好的管理意味着将你的测试逻辑与其运行的数据分离，这样在事情发生变化时更容易调整。一些智能的策略可以帮助你避免所有这些。\n\n## 通过配置文件集中化数据\n\
  \n提升测试水平的一种简单且出乎意料有效的方法，是将测试数据从代码中移出到外部配置文件中。这些可以是 JSON、YAML，甚至是使用 `dotenv` 等工具加载的环境变量（正如我们在第\
  \ 14 章 安全与身份验证中看到的）。这为你提供了一个单一的、易于更新的真相来源。\n\n例如，如果你正在测试登录流程，跳过在脚本中硬编码这些凭据。相反，将它们放在配置文件中并让你的测试从那里加载。\n\
  \n首先，创建一个 `config.json` 文件：\n\n```json\n{\n\"baseUrl\": \"https://www.saucedemo.com/\"\
  ,\n\"users\": {\n\"standard\": {\n\"username\": \"standard_user\",\n\"password\"\
  : \"secret_sauce\"\n},\n\"admin\": {\n\"username\": \"problem_user\",\n\"password\"\
  : \"secret_sauce\"\n}\n}\n}\n```\n\n然后，在你的测试文件（例如 `login.test.ts`）导入并使用它：\n\n```javascript\n\
  import { test, expect } from '@playwright/test';\nimport config from '../config.json';\n\
  test('标准用户登录成功', async ({ page }) => {\n  await page.goto(config.baseUrl);\n  await\
  \ page.getByPlaceholder('Username').fill(config.users.standard.username);\n  await\
  \ page.getByPlaceholder('Password').fill(config.users.standard.password);\n  await\
  \ page.getByRole('button', { name: 'Login' }).click();\n  await expect(page).toHaveURL('https://www.saucedemo.com/inventory.html');\n\
  \  await expect(page.locator('.inventory_list')).toBeVisible();\n});\n```\n\n这种设置意味着，如果凭据发生变化或你需要添加新的用户类型，你只需要编辑一个文件，而不是每个测试。这对于环境特定的数据特别有用：你可以拥有\
  \ `config.dev.json` 和 `config.prod.json`，并根据 `process.env.NODE_ENV` 加载正确的一个。维护工作减少了，因为更改是本地化的，并且确保了测试的一致性。\n\
  \n在 Playwright 中加载外部数据的另一种方法是在 `tsconfig.json` 中设置 `\"compilerOptions\": { \"resolveJsonModule\"\
  : true }` 以启用 TypeScript 的 `resolveJsonModule`。这允许你直接通过 `import data from './data.json'`\
  \ 导入 JSON 文件，并让 TypeScript 编译器推断该 JSON 的类型，从而获得补全和更安全的代码。\n\n让我们通过构建一个可以为我们登录的具件（fixture）并返回一个准备好测试的已登录页面，来扩展登录示例。\n\
  \n在你的 fixture 中，你可能会这样定义：\n\n\n\n\n\n```typescript\nimport { expect, test as baseTest,\
  \ Page } from '@playwright/test';\nimport config from '../config.json';\n// 为我们的自定义固件定义一个新类型。\n\
  // 这可以提供更好的自动补全和类型安全。\ntype MyFixtures = {\n  loggedInPage: Page;\n};\n// 使用我们的自定义固件扩展基础测试。\n\
  export const test = baseTest.extend<MyFixtures>({\n  loggedInPage: async ({ page\
  \ }, use) => {\n    // 这是固件的设置代码。\nawait page.goto(config.baseUrl);\n    await page.getByPlaceholder('Username')\n\
  \      .fill(config.users.standard.username);\n    await page.getByPlaceholder('Password')\n\
  \      .fill(config.users.standard.password);\n    await page.getByRole('button',\
  \ { name: 'Login' }).click();\n    // 使用固件。这是测试代码运行的地方。\nawait use(page);\n    //\
  \ 这是固件的拆清理代码（如果有的话）。\n// 在这种情况下，不需要特定的清理工作。\n  },\n});\n```\n\n`type MyFixtures\
  \ = { loggedInPage: any; };` 部分对于良好的实践很有用，但对于代码运行并非严格必须。它定义了一个 TypeScript 类型，告诉\
  \ Playwright 的 `test.extend` 函数可以使用哪些自定义固件。\n\n它有助于 TypeScript 在编译时捕获错误。例如，如果你在测试中不小心将\
  \ `loggedInPage` 错写为 `loggeddInPage`，TypeScript 会提示你该错误。大多数现代代码编辑器都会使用此类型定义在你编写测试时提供自动补全建议。这使得开发更快。\n\
  \n现在，在你的测试文件中，你可以编写以下内容：\n\n```typescript\nimport { test } from '../fixtures/test-setup';\n\
  import { expect } from '@playwright/test';\ntest('access cart after login', async\
  \ ({ loggedInPage }) => {\n  await loggedInPage.goto('https://www.saucedemo.com/cart.html');\n\
  \n  // 确保 Checkout 按钮可见\nawait expect(loggedInPage.getByRole('button', { name: 'Checkout'\
  \ })).toBeVisible();\n});\n```\n\n由于我们的固件在后台处理了数据管理，你的测试将保持简洁简单。如果登录过程发生变化，你只需要更新一次固件即可完成。通过将所有可变性包含在一个点中，这保持了低维护成本。保持代码组织整洁并将所有固件放在\
  \ `/fixtures/` 目录下始终是一件好事。\n\n## 使用库生成动态数据\n\n在编写涉及唯一或随机输入的自动化测试（例如用户注册、表单提交或订单创建）时，硬编码这些值会迅速变成一个问题。这不仅会导致冲突（例如尝试两次注册相同的电子邮件），而且无法模拟真实世界数据那种混乱、不可预测的本质。\n\
  \n一种解决办法是使用数据生成库，如 `Faker.js` ([`www.npmjs.com/package/@faker-js/faker`](https://www.npmjs.com/package/@faker-js/faker))。该库可以动态生成真实的测试数据（名称、地址、密码等），使你的测试能够模拟用户实际与应用程序交互的方式。这使得它们不那么脆弱，并且能够捕捉边缘情况。\n\
  \n你可以使用 `npm` 这样安装 Faker：\n\n```bash\nnpm install @faker-js/faker --save-dev\n```\n\
  \n安装后，你可以按照如下方式导入它：\n\n```typescript\nimport { faker } from '@faker-js/faker';\n\
  ```\n\n这是一个使用 Faker 的假设性示例：\n\n```typescript\nimport { test, expect } from '@playwright/test';\n\
  import { faker } from '@faker-js/faker';\ntest('register new user', async ({ page\
  \ }) => {\n  const username = faker.internet.userName();\n  const email = faker.internet.email();\n\
  \  const password = faker.internet.password();\n  await page.goto('/login');\n \
  \ await page.getByPlaceholder('Username').fill(username);\n  await page.getByPlaceholder('Email').fill(email);\n\
  \  await page.getByPlaceholder('Password').fill(password);\n  await page.getByRole('button',\
  \ { name: 'Submit' }).click();\n  await expect(page.locator('#success-message')).toHaveText(`Account\
  \ created for ${username}`);\n});\n```\n\n在这里，每次运行测试都会生成完全全新的数据，因此没有重复使用之前运行的用户名或电子邮件的风险。如果你的应用程序需求发生了变化（例如，密码必须包含符号或满足特定长度），你可以在地方调整\
  \ Faker 调用，并立即更新所有依赖的测试。\n\n`${username}` 只是模板字符串面量中的占位符。模板字符串面量是用反引号封装的字符串，允许你使用\
  \ `${}` 在字符串内部插入变量或表达式。在这种情况下，`${username}` 动态将用户名插入到文本中。\n\n这种方法也让大型数据密集测试套件更容易维护，因为你的测试会自动适应。\n\
  \n## 通过 Mock API 以控制外部数据\n\n让我们聊聊现代 Web 应用如何从 API 获取数据，以及为什么在 Playwright 中进行这类测试如果没有一些高明的技巧会变得困难。假设你正在构建一个像在线书店这样的电子商务网站。你的应用程序从\
  \ API 端点获取书籍推荐，例如 `/api/recommendations`，它从后端服务器提取实时数据。\n\n在现实世界中，该 API 可能根据用户行为、时间甚至服务器故障返回不同的结果。也许某天它很慢，或者它会抛出错误。这种不可预测性会导致你的测试变得不稳定：一次通过，下一次失败。\n\
  \n这就是 Playwright 路由 Mock（route mocking）大显身场的地方。它允许你在浏览器中拦截这些 API 调用并伪造你预期的响应。\n\n\
  以下测试通过 Mock `JSONPlaceholder`（一个流行的测试 API）来验证页面是否正确显示博客文章：\n\n```typescript\nimport\
  \ { test, expect } from '@playwright/test';\ntest('displays mocked posts from JSONPlaceholder',\
  \ async ({ page }) => {\n  // Mock 特定端点\nawait page.route('https://jsonplaceholder.typicode.com/posts',\
  \ async (route) => {\n    await route.fulfill({\n      status: 200,\n      contentType:\
  \ 'application/json',\n      body: JSON.stringify([\n        {\n          userId:\
  \ 1,\n          id: 1,\n          title: 'Mocked Post Title One',\n          body:\
  \ '这是第一个 Mock 帖子的正文。它有助于在没有真实数据的情况下进行测试。\n        },\n        {\n          userId:\
  \ 1,\n          id: 2,\n          title: 'Mocked Post Title Two',\n          body:\
  \ '这是第二个帖子正文，保持一致以进行可靠测试。'\n        }\n      ])\n    });\n  });\n  const data =\
  \ await page.evaluate(() =>\nfetch('https://jsonplaceholder.typicode.com/posts')\n\
  \      .then(r => r.json())\n  );\n  await expect(data[0].title).toBe('Mocked Post\
  \ Title One');\n  await expect(data[1].title).toBe('Mocked Post Title Two');\n});\n\
  ```\n\n\n\n\n接下来，我们将使用 `page.evaluate()` 直接在浏览器中运行 `fetch()` 调用。这模拟了实际 Web 应用程序可能的操作：从\
  \ `/posts` 端点请求数据。由于我们已经拦截了该 URL 模式，浏览器将接收到我们定义的模拟（mock）数据。模拟响应返回的 JSON 被存储在 `data`\
  \ 变量中，允许我们能够在测试环境中对其进行检查。\n\n最后，我们使用 `expect()` 来断言模拟数据包含正确的值。这种方法的优妙之处在于它既可靠又快速。你的测试将不再受限于网络波动性的影响。不再需要等待缓慢的响应，也不需要处理速率限制问题。如果真实的\
  \ API 发生了变化，例如添加了诸如 `'jobTitle'` 的新字段，你只需要更新测试文件中的 mock 载负载（payload），一切就会保持同步，而无需重新部署任何内容。为了让大型项目更具灵活性，你可以从单独的\
  \ JSON 配置文件中提取 mock 数据。\n\n例如，创建一个 `mocks/profile.json` 文件，其中包含不同测试用例的变体：一个用于标准用户，一个用于错误状态（如状态\
  \ `404`），甚至可以有一个空的简介以检查边界情况。然后，在测试中动态加载该文件。这样，如果你的团队有多个开发者在开发新功能，每个人都可以调整 mock 而不会互不干扰，而且你的测试套件可以处理各种场景，而完全不需要依赖实时后端。\n\
  \n# 总结\n\n显而易见，周全的组织和战略性的设计可以将你的测试套件从维护负担转变为可靠的资产。通过使用 `describe` 块和描述性名称来构建测试，你创建了一个易于遵循和调试的叙述结构。POM（页面对象模型）更进一步，将选择器和操作的杂乱细节封装在可重用的类中，使得你的测试读起来像用户故事，并且对\
  \ UI 变化具有韧性。\n\n智能地管理测试数据，无论是通过集中式配置文件、自定义固件（fixtures）、使用 `Faker.js` 等工具进行动态数据生成，还是\
  \ API 模拟，都能确保你的测试在任何环境或场景下都稳健。它还能节省你的时间，并让你对应用程序的质量更有信心。\n\n在你尝试这些技术时，不要害怕实验和调整它们，让它们最适合你的团队。为了获得更深层次的见解，Playwright\
  \ 文档 [`playwright.dev/docs/best-practices`](https://playwright.dev/docs/best-practices)是一个持续探索的绝佳资源。\n\
  \n在下一章也是最后一章中，我们将通过构建一个实践项目将一切付诸实践。\n\n## 获取本书的 PDF 版本和专属额外\n\n扫描二维码（或访问 [packtpub.com/unlock](https://packtpub.com/unlock)）。按名称搜索本书，确认版本，然后按照页面上的步骤操作。\
  \ | ![](img/Unlock-01.png)![](img/Unlock.png) |\n\n| **注意**：请保留好发票。直接从 Packt 购买的物品不需要发票。\
  \ |\n\n# 16\n\n# 实战项目 – 测试电子商务网站\n\n到为止，我们已经学习了 Playwright 的核心内容：从设置项目和编写简单脚本，到处理动态内容和\
  \ API 调用等更高级的话。现在是时候在一个实战项目中将所有内容整合在一起了。\n\n我们将测试一个电子商务网站，这对于练习端到端（`E2E`）测试非常完美。它涵盖了各种常见的工作流，例如用户注册、浏览产品、将商品加入购物车，甚至处理用于负载测试的批量用户注册。\n\
  \n对于这个项目，我们将使用 **Practice Software Testing Toolshop**（可在 [practicesoftwaretesting.com](https://practicesoftwaretesting.com/)\
  \ 获得）。这是一个专门为软件测试训练设计的演示应用程序。它以在线工具店的形式模拟了一个电子商务网站，售卖锤子、钻头和螺丝刀等工具，并将其组织成如“手动工具”和“电动工具”等不同的类别。\n\
  \n我们将使用 TypeScript 编写测试以增加类型安全，尽管我们涵盖的所有内容也适用于 JavaScript。到本章结束时，你将拥有一个组织良好的 Playwright\
  \ 项目，使用最佳实践（如页面对象模型 `POM`、辅助函数、数据工厂以及带有存储状态（storage states）的智能身份验证）来测试真实的电子商务流程。\n\
  \n在完成本章结束时，你将对如何为电子商务网站创建一个稳健的端到端测试框架有深入理解。\n\n本章由以下部分组成：\n\n* 初始化项目\n* 组织项目结构\n\
  * 使用存储状态管理身份验证\n* 使用数据工厂\n* 用于负载测试的批量用户注册\n\n## 技术要求\n\n本章的源代码可在 [`github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright/tree/main/Chapter16`](https://github.com/PacktPublishing/Hands-On-Automated-Testing-with-Playwright/tree/main/Chapter16)\
  \ 获取。\n\n## 初始化项目\n\n在本节中，我们将通过初始化项目并管理存储状态来奠定测试基础。\n\n第一步是为项目创建一个目录并初始化 Playwright\
  \ 项目：\n\n```bash\nmkdir ecom-test-project\ncd ecom-test-project\nnpm init@latest\n\
  ```\n\n该命令创建一个名为 `ecom-test-project` 的文件夹并在其中初始化一个新的 Playwright 项目。在运行 `npm init@latest`\
  \ 命令时，你将面临一系列用于构建脚手架的问题。选择 `TypeScript` 作为语言，将 `tests` 设置为端到端文件夹，暂时不添加 GitHub Actions\
  \ 文件。你还将有机会安装 Playwright 浏览器。\n\n通过运行 `--version` 标志来验证安装：\n\n```bash\nnpx playwright\
  \ --version\n```\n\n此时，你可以通过运行以下命令执行默认测试：\n\n```bash\nnpx playwright test\n```\n\
  \n该命令将在三个浏览器上执行测试。\n\n由于我们将使用 TypeScript，让我们安装必要的依赖项。这将为你提供类型安全和更流畅的支持：\n\n```bash\n\
  npm install -D typescript ts-node @types/node dotenv\n```\n\n`ts-node` 包允许你直接运行\
  \ TypeScript 文件而无需先编译。这对于快速脚本或测试非常有用。`@types/node` 包提供了 Node.js 的类型定义，以便 TypeScript\
  \ 运行良好。最后，我们将安装 `dotenv`，它允许我们使用 `.env` 环境变量。通过添加 `-D` 标志，你将它们作为开发依赖安装，因为它们只在开发和测试期间需要。\n\
  \n现在，在项目根目录下创建一个 `tsconfig.json` 文件来配置 TypeScript：\n\n```json\n{\n  \"compilerOptions\"\
  : {\n    \"target\": \"ESNext\",\n    \"module\": \"commonjs\",\n    \"strict\"\
  : true,\n    \"esModuleInterop\": true\n  }\n}\n```\n\n\n\n一旦完成设置，下一步是配置你的 `playwright.config.ts`\
  \ 文件：\n\n```\n// ./playwright.config.ts\nimport { defineConfig, devices } from \"\
  @playwright/test\";\nimport * as dotenv from \"dotenv\";\ndotenv.config({ path:\
  \ \".env\", quiet: true });\nexport default defineConfig({\n  testDir: \"./tests\"\
  ,\n  fullyParallel: true,\n  forbidOnly: !!process.env.CI, // 防止在 CI 中使用 test.only\n\
  \  retries: process.env.CI ? 2 : 0, // 在 CI 中重试失败的测试\n  workers: process.env.CI\
  \ ? 1 : undefined, // 控制并行工作线程\n  reporter: [[\"html\"], [\"list\"]], // 生成 HTML\
  \ 和列表报告\n  use: {\n    trace: \"on\", // 目前始终捕获轨迹\n    baseURL: process.env.BASE_URL\
  \ || \"https://practicesoftwaretesting.com\", // 导航的基础 URL\n    testIdAttribute:\
  \ \"data-test\", // 自定义测试 ID 属性\n    headless: true,\n    video: \"retain-on-failure\"\
  ,\n    screenshot: \"only-on-failure\",\n  },\n  projects: [\n    {\n      name:\
  \ \"setup\", // 认证设置项目\n      testMatch: /.*\\.setup\\.ts/,\n    },\n    {\n   \
  \   name: \"customer1-chromium\",\n      dependencies: [\"setup\"], // 先运行 setup\n\
  \      use: {\n        ...devices[\"Desktop Chrome\"],\n        storageState: \"\
  .auth/customer1StorageState.json\", // 加载认证状态\n      },\n    },\n    // 这里可以添加针对\
  \ Firefox 和 WebKit 的项目\n  ],\n});\n```\n\n我们在之前的章节中已经见过这些大部分属性，`forbidOnly` 除外。Playwright\
  \ 有一个名为 `test.only` 的方便快捷方式，开发者在调试时经常使用它。它告诉 Playwright 忽略所有其他测试，只运行你标记的那一个。这在本地工作时非常方便，因为它可以让你快速关注某个失败或棘手的测试，而无需等待整个测试套件运行。\n\
  \n问题是，如果不小心在代码中留下 `test.only` 并将其推送到主分支将是一个大问题。在应该运行完整测试套件的 CI 环境中，Playwright 最终只会运行那一个测试。\n\
  \n这就是 `forbidOnly` 发挥作用的地方。当此设置为为 `true` 时，如果 Playwright 发现 `test.only` 或 `describe.only`，将会导致测试运行失败。它基本上是一个护栏，确保没有人意外地在需要全覆盖的地方限制测试运行范围。\n\
  \n`!!process.env.CI` 部分只是一个小小的 JavaScript 技巧，用于将 `CI` 环境变量转换为 `true`/`false` 值。大多数\
  \ CI 系统会自动将 `CI` 设置为 `true`，因此当你在 CI 中时，`!!process.env.CI` 变为 `true`；而在本地运行测试时，它为\
  \ `false`。\n\n大多数流行的 CI 工具（GitHub, GitLab, Azure DevOps）都会将 CI 环境变量设置为 `true`。如果使用不设置该变量的\
  \ CI 工具（例如 Google Cloud Build），请务必在 CI 脚本中手动设置：`'CI=true'`。\n\n保持项目组织良好是团队协作时使其具有可扩展性的关键。这引导我们进入下一个章节。\n\
  \n# 组织项目结构\n\n当我刚开始测试时，我很快就学到，一个组织良好的项目是顺畅且可维护测试的骨干。在本节中，我们将探索如何深思熟虑地构建电子商务测试项目。\n\
  \n## 项目结构\n\n对于我们的电子商务测试，我们将采用模块化设置，将所有内容整齐分离：\n\n```\necom-test-project/\n├── .auth/\n\
  │   └── customer1StorageState.json  # 生成的认证状态\n├── data/\n│   └── factory.ts   \
  \               # 数据创建方法\n├── fixtures/\n│   └── adminAuth.fixture.ts        # 自定义固件\n\
  ├── pages/\n│   ├── base.page.ts                # 所有页面的基类\n│   ├── login.page.ts\
  \               # 登录页面对象模型\n│   ├── registration.page.ts        # 注册页面对象模型\n│  \
  \ └── product.page.ts             # 产品页面对象模型\n├── tests/\n│   ├── auth.setup.ts\
  \               # 认证设置脚本\n│   ├── registration.spec.ts        # 用户注册测试\n│   ├──\
  \ product.spec.ts             # 产品浏览测试\n│   └── bulk.spec.ts                # 负载/性能测试\n\
  ├── playwright-report/              # 生成的测试报告\n├── test-results/               \
  \    # 测试执行结果\n├── node_modules/                   # 依赖 (git 忽略)\n├── playwright.config.ts\
  \            # Playwright 测试配置\n├── package.json                    # 项目依赖和脚本\n\
  ├── package-lock.json               # 锁定依赖版本\n├── tsconfig.json                \
  \   # TypeScript 配置\n├── .env                            # 环境变量\n├── .gitignore\
  \                      # Git 忽略规则\n└── README.md                       # 项目文档\n\
  ```\n\n你已经在之前的章节中遇到过这些文件。这里是对项目结构中重要部分的快速回顾：\n\n* `.auth/`: 存储会话状态\n* `data/`: 存放用于生成测试数据的数据工厂\n\
  * `fixtures/`: 存放自定义 Playwright 固件（例如参数化的 `auth`）\n* `pages/`: POM 实现\n* `tests/`:\
  \ 实际的测试规格文件，按功能分组\n\n现在你已经熟悉了项目结构，让我们开始编写页面对象吧。\n\n## 实现 POM\n\nPOM 对于构建可维护的 E2E\
  \ 自动化非常有用。它通过将复杂的网页交互分解为清晰、可重用的模块来简化代码。与其在测试脚本中散布原始选择器（如 `page.locator('#email')`），POM\
  \ 将它们集中在特定的页面对象中。例如，如果你更改了加入购物车按钮，否则你需要更新所有使用它的测试。\n\nPOM 还支持单一职责原则。每个页面对象管理 UI\
  \ 的特定部分。这让测试人员专注于编写有意义的测试场景。\n\n基类类是避免在应用内所有或大部分页面中重复代码的方法。\n\n这是我们的 `base.page.ts`\
  \ 文件：\n\n```typescript\n// ./pages/base.page.ts\nimport { Page, Locator } from \"\
  @playwright/test\";\nexport class BasePage {\n  readonly page: Page;\n  readonly\
  \ navMenu: Locator;\n  readonly navMenuHome: Locator;\n  readonly navMenuCategories:\
  \ Locator;\n  readonly navCategoryList: Locator;\n  readonly navMenuContact: Locator;\n\
  \  readonly navMenuSignIn: Locator;\n  readonly navMenuLanguageSelect: Locator;\n\
  \  readonly navCart: Locator;\n  readonly navCartQuantity: Locator;\n\n  constructor(page:\
  \ Page) {\n    this.page = page;\n    this.navMenu = page.getByTestId(\"nav-menu\"\
  );\n    this.navMenuHome = page.getByTestId(\"nav-home\");\n    this.navMenuCategories\
  \ = page.getByTestId(\"nav-categories\");\n    this.navCategoryList = page.getByLabel(\"\
  nav-categories\");\n    this.navMenuContact = page.getByTestId(\"nav-contact\");\n\
  \    this.navMenuSignIn = page.getByTestId(\"nav-sign-in\");\n    this.navMenuLanguageSelect\
  \ = page.getByTestId(\"language-select\");\n    this.navCart = page.getByTestId(\"\
  nav-cart\");\n    this.navCartQuantity = page.getByTestId(\"cart-quantity\");\n\
  \  }\n\n  async gotoHome() {\n    await this.page.goto(\"/\");\n  }\n\n  async selectCategory(category:\
  \ string) {\n    await this.navMenuCategories.click();\n    await this.navCategoryList.getByText(`${category}`).click();\n\
  \  }\n\n  async clearStorage(page: Page) {\n    await page.evaluate(() => {\n  \
  \    localStorage.clear();\n      sessionStorage.clear();\n    });\n    await page.reload();\n\
  \  }\n}\n```\n\n\n\n我们首先从 Playwright 的测试模块导入必要的组件：`Page` 和 `Locator`。然后，我们定义了 `BasePage`\
  \ 类并带有只读属性：`'page'` 用于存储 Playwright 的 `Page` 实例，以及 `'nav…'`（我们在基类中定义的元素定位器）。\n\n\
  构造函数接收一个必需的 `Page` 对象。它简单地将这些对象赋值给类属性，为任何扩展此类的 `Page` 对象奠定了基础。这样，每个 `Page` 对象都可以访问相同的浏览器上下文，而无需每次都重新创建它。\n\
  \n我们还在构造函数内部定义了所有的定位器。通过这样做，我们创建了友好的名称，在规范文件（spec files）中与定位器交互时可以使用这些名称。\n\n对于添加到基类页面中的定位器，我们专注于添加\
  \ Web 应用程序中大多数（如果不是所有）页面共享的元素。正如你将在接下来添加的 `Page` 对象中看到的，该页面将由我们创建的其他 `Page` 对象扩展。\n\
  \n在构造函数之后，我们包含了三个额外的异步函数，可以从类中调用它们。\n\n在 `gotoHome()` 函数中，我们创建了一种简单的方法，可以从测试中的任何位置或测试开始时导航到主页。\n\
  \n我们还包含了一个 `selectCategory()` 函数，它在调用时接受一个名为 `category` 的字符串参数。该函数首先点击分类链接，打开下拉列表，然后选择你传递的名称的分类：\n\
  \n```javascript\nasync selectCategory(category: string) {\n    await this.navMenuCategories.click();\n\
  \    await this.navCategoryList.getByText(`${category}`).click();\n  }\n```\n\n\
  在 `Page` 对象中创建函数是抽象测试中反复的常用操作的有用方法，也可以用于可能具有动态性质的定位器。\n\n我们编写的第三个函数提供了一种将浏览器状态重置为未认证状态的方法。在编写第一个测试时并不需要这个函数，但当我们意识到想要完成一次新的注册时，我们需要一种方法让测试在注销状态下启动，同时不会丢失\
  \ `storageState` 认证：\n\n```javascript\nasync clearStorage(page: Page) {\n    await\
  \ page.evaluate(() => {\n      localStorage.clear();\n      sessionStorage.clear();\n\
  \    });\n    await page.context().clearCookies();\n    await page.reload();\n \
  \ }\n```\n\n`clearStorage()` 函数使用 `page.evaluate()` 在浏览器中执行 JavaScript，清除本地存储（local\
  \ storage）会话存储（session storage）。在 `page.evaluate()` 方法之外，我们使用 `page.context().clearCookies()`\
  \ 函数，它可以清除当前页面的 cookie。该函数随后刷新页面以确保网站以全新的状态加载。\n\n因此，通过这个基类，我们将 UI 交互抽象到类中。通过在特定页面中继承\
  \ `BasePage`（例如 `LoginPage` 类），你将自动继承这些方法，这允许你在使用共享定位器的同时，添加页面特定的定位器和操作。\n\n###\
  \ 开发页面特定的类\n\n页面特定的类是 POM 模式的核心。每个类都代表一个单一页面或应用程序 UI 的一个重要组件。每个页面特定的类通常从 `BasePage`\
  \ 类继承通用功能（例如与 `navMenu` 交互或清除浏览器存储）。\n\n让我们为测试登录功能创建一个 `LoginPage` 类：\n\n```typescript\n\
  // ./pages/login.page.ts\nimport { type Locator, type Page } from \"@playwright/test\"\
  ;\nimport { BasePage } from \"./base.page\";\nexport class LoginPage extends BasePage\
  \ {\n  readonly emailInput: Locator;\n  readonly passwordInput: Locator;\n  readonly\
  \ loginButton: Locator;\n  constructor(page: Page) {\n    super(page);\n    this.emailInput\
  \ = page.getByTestId(\"email\");\n    this.passwordInput = page.getByTestId(\"password\"\
  );\n    this.loginButton = page.getByTestId(\"login-submit\");\n  }\n  async goto()\
  \ {\n    await this.page.goto(\"/auth/login\");\n  }\n  async login(email: string,\
  \ password: string) {\n    await this.emailInput.fill(email);\n    await this.passwordInput.fill(password);\n\
  \    await this.loginButton.click();\n  }\n}\n```\n\n`goto()` 函数可以在调用时直接导航到登录页面。在测试中，这看起来像是\
  \ `loginPage.goto()`，易于阅读和遵循。我们通常喜欢为创建的每个页面对象包含一个 `goto()` 函数，原因有两个：第一，它作为从测试内部导航到该页面的简单方法；其次，它作为类中的定位器在被测试网站中所在位置的文档。\n\
  \n`login` 函数结合了多个步骤：导航到登录页面（使用继承的 `navigate` 方法）、填写电子邮件和密码字段，以及点击提交按钮。此方法将整个登录过程抽象为单一的、可重用的调用，因此你的测试只需调用\
  \ `await loginPage.login('user@example.com', 'password')`，而无需担心底层的选择器或步骤顺序。\n\n\
  同样，`ProductPage` 类（`./pages/product.page.ts`）专门用于处理 Toolshop 网站上的产品浏览体验：\n\n```typescript\n\
  // ./pages/product.page.ts\nimport { Locator, Page } from \"@playwright/test\";\n\
  import { BasePage } from \"./base.page\";\nexport class ProductPage extends BasePage\
  \ {\n  readonly productCards: Locator;\n  readonly addedCartMessage: Locator;\n\
  \  readonly productName: Locator;\n  readonly addToCartButton: Locator;\n  constructor(page:\
  \ Page) {\n    super(page);\n    this.productCards = page.locator(\".card\");\n\
  \    this.addedCartMessage = page.getByLabel(\"Product added to cart.\");\n    this.productName\
  \ = page.getByTestId(\"product-name\");\n    this.addToCartButton = page.getByTestId(\"\
  add-to-cart\");\n  }\n  async goto(productId?: string) {\n    await this.page.goto(`/product/${productId}`);\n\
  \  }\n  async clickProductByIndex(index: number) {\n    const product = this.productCards.nth(index);\n\
  \    await product.click();\n  }\n}\n```\n\n`clickProductByIndex()` 方法通过简单指向索引来点击特定的卡片。\n\
  \n我们还暴露了 `productName` 和 `addToCartButton` 定位器。与其创建操作函数，当元素易于交互时，我们倾向于在规范文件中为交互和断言添加更多的详细描述。\n\
  \n避免过度抽象。不要为简单的页面或单次组件创建页面对象。对于 Toolshop，一个只有一个表单的**联系我们**页面可能不需要完整的页面对象。\n\n###\
  \ 在测试中应用 POM\n\n现在我们已经创建了需要的页面对象，让我们看看如何在测试中使用它们，并检查产品是否成功添加到了购物车：\n\n```typescript\n\
  // ./tests/product.spec.ts\nimport { test, expect } from \"@playwright/test\";\n\
  import { ProductPage } from \"../pages/product.page\";\ntest(\"Add product to cart\"\
  , async ({ page }) {\n  const productPage = new ProductPage(page);\n  await productPage.gotoHome();\n\
  \  await productPage.selectCategory(\"Hand Tools\");\n  await productPage.clickProductByIndex(0);\n\
  \  await expect(productPage.productName).toHaveText(\"Combination Pliers\");\n \
  \ await productPage.addToCartButton.click();\n  await expect(productPage.addedCartMessage).toHaveText(\n\
  \    \"Product added to shopping cart.\"\n  );\n  // 等待消息消失（最长 10 秒）\n  await expect(productPage.addedCartMessage).not.toBeVisible({\n\
  \    timeout: 10000,\n  });\n  await expect(productPage.navCartQuantity).toHaveText(\"\
  1\");\n});\n```\n\n\n\n测试访问了首页，该首页包含一个工具列表。我们使用 `selectCategory` 函数缩小列表范围，仅查看“Hand\
  \ Tools（手动工具）”类别。接着，我们点击列表中的第一个产品（索引为 0）。进入产品页面后，我们断言产品名称为“Combination Pliers（鳄字钳）”，并点击将项目添加到购物车。\n\
  \n![图 16.1：测试断言弹出消息显示了正确的文本](img/B34148_16_1.png)\n\n图 16.1：测试断言弹出消息显示了正确的文本\n\n\
  随后，在执行了添加到购物车的操作后，我们又进行了三个断言。第一个是确保弹出消息显示正确的文本。然后，我们等待最多 10 秒直到“已添加到购物车”的消息消失。我们通过使用\
  \ `not.toBeVisible({ timeout: 10000 })` 进行断言来实现这一点。我们之所以这样做是因为在 Web 应用程序中，弹出消息会遮住下一个断言中的购物车按钮，而且我们希望测试尽可能贴近用户的真实旅程。最后一步通过使用\
  \ Web 优先断言和位于 `base.page.ts` 文件中的 `navCartQuality` 定位器，确认购物车更新正确。此快速断言确保了产品已成功添加，无需切换到专门的\
  \ `CartPage` 对象。\n\n此测试具有良好的可读性和可维护性。如果**添加到购物车**按钮的选择器发生变化，你只需要更新 `ProductPage`\
  \ 类。通过将 Toolshop 网站页面（登录、产品、基础等）封装进类，你可以在测试逻辑和 UI 交互之间创建清晰的隔离。\n\n因此，通过 POM 模式，我们把测试代码组织成了可复用的类。现在，让我们来看看如何利用存储状态功能让我们的测试更高效。\n\
  \n# 使用存储状态管理身份验证\n\n在电子商务应用程序中，许多测试场景（如将项目添加到购物车、结账或查看订单历史）都需要登录用户。为每个测试运行完整的登录并不是最高效的方法：它会减慢测试运行速度，甚至可能触发速率限制或\
  \ CAPTCHA 挑战等问题。\n\nPlaywright 通过其 **storage state（存储状态）**功能让这变得更容易。你不需要每次登录，只需登录一次，保存会话数据（如\
  \ cookies 和本地存储），然后在测试中复用它。\n\n## 使用 Playwright 测试项目进行身份验证\n\n为了实现此功能，我们在 `playwright.config.ts`\
  \ 中创建一个设置项目，并在测试文件夹中创建一个 `auth.setup.ts` 测试，由它为我们处理登录并保存会话状态。首先，我们启动 Chromium 浏览器并打开新页面。然后，跳转到\
  \ Toolshop 的登录页面（`auth/login`），输入测试凭据（`customer@practicesoftwaretesting.com` 和 `welcome01`，这些信息存储在我们的\
  \ `.env` 文件中），并登录表单。设置脚本利用 `loginPage` 页面对象的定位器和登录函数：\n\n```\n// ./tests/auth.setup.ts\n\
  import { test as setup, expect } from \"@playwright/test\";\nimport { LoginPage\
  \ } from \"../pages/login.page\";\nsetup(\"Create Customer 1 Authentication\", async\
  \ ({ page, context }) => {\n  const email = process.env.CUSTOMER_1_EMAIL || \"\"\
  ;\n  const password = process.env.CUSTOMER_1_PASSWORD || \"\";\n  const customer1AuthFile\
  \ = \".auth/customer1StorageState.json\";\n  const loginPage = new LoginPage(page);\n\
  \  await loginPage.gotoHome();\n  await loginPage.navMenuSignIn.click();\n  await\
  \ loginPage.login(email, password);\n  // 登录是否成功\nawait expect(loginPage.navMenu).toContainText(\"\
  Jane Doe\");\n  // 将存储状态保存到文件中\nawait context.storageState({ path: customer1AuthFile\
  \ });\n});\n```\n\n脚本的最后一步调用 `page.context().storageState({ path: customer1AuthFile\
  \ })` 将浏览器上下文的会话数据（包括 cookies、本地存储和其他会话相关信息）保存到 JSON 文件中。\n\n应将 `storageState.json`\
  \ 文件添加到 `.gitignore`，以防止将可能敏感的会话数据提交到版本控制。\n\n此存储状态通过专用的 `setup` 项目构建到我们的 Playwright\
  \ 配置（`playwright.config.ts`）中。该项目会在任何测试开始之前运行 `auth.setup.ts` 脚本。运行主测试套件的 `customer1-chromium`\
  \ 项目依赖 `['setup']` 以确保先运行设置。然后它使用 `storageState: 'storageState.json.auth/customer1StorageState.json'`\
  \ 来加载已保存的会话数据。得益于此设置，`customer1-chromium` 项目中的每个测试在启动时都已登录特定用户，因此每次测试运行之前不再需要登录步骤。\n\
  \n如果网站的身份验证会话在一段时间后超时，或者注销测试清除了已保存的身份验证，你将需要不同的解决方案。一种方法是创建一个不依赖 `setup` 项目的独立项目。\n\
  \n对于更高级的情况，例如测试不同的用户角色（客户与管理员），你可以在设置文件中创建额外的步骤来保存不同的存储状态，或者利用自定义 fixtures（固定件）在测试期间生成相应的存储状态。\n\
  \n## 使用 playwright 测试 fixtures 进行身份验证\n\nFixture（固定件）有很多自定义选项。在 `adminAuth.fixture.ts`\
  \ 中，我们创建了一个名为 `adminAuthPage` 的 fixture，可以在测试中使用它来利用已保存存储状态的页面：\n\n```\n// ./fixtures/adminAuth.fixture.ts\n\
  import { test as base, expect, Page } from \"@playwright/test\";\nimport { LoginPage\
  \ } from \"../pages/login.page\";\n// 提供已登录面的简单 fixture\nexport const test = base.extend<{\
  \ adminAuthPage: Page }>({\n  adminAuthPage: async ({ browser }, use) => {\n   \
  \ const storageStatePath = \".auth/adminStorageState.json\";\n    const setupContext\
  \ = await browser.newContext();\n    const setupPage = await setupContext.newPage();\n\
  \    const loginPage = new LoginPage(setupPage);\n    await loginPage.goto();\n\
  \    await loginPage.login(\n      process.env.ADMIN_EMAIL!,\n      process.env.ADMIN_PASSWORD!\n\
  \    );\n     await expect(loginPage.navMenu).toContainText(\"John Doe\");\n   \
  \ await setupContext.storageState({ path: storageStatePath });\n    await setupContext.close();\n\
  \    // 使用保存的认证状态创建新上下文\nconst context = await browser.newContext({\n      storageState:\
  \ storageStatePath,\n    });\n    const page = await context.newPage();\n    await\
  \ use(page);\n    await context.close();\n  },\n});\nexport { expect } from \"@playwright/test\"\
  ;\n```\n\n该 fixture 通过扩展基础测试框架创建自定义的 `adminAuthPage` fixture。该 fixture 使用环境变量凭据执行登录过程，将身份验证状态保存到\
  \ JSON 文件（`adminStorageState.json`）中，然后为每个测试提供全新的、预认证的页面上下文。这种模式与我们的设置项目一样，在测试中集中了登录操作，并通过为每个测试提供自己的会话来确保了良好的隔离。当你的身份验证有效期很短且希望在每次使用\
  \ fixture 时都创建一个新的身份验证时，这种方法非常有用。\n\n要在测试中使用此 fixture，我们将使用 `product.spec.ts` 测试并复制该测试，但从管理员用户的角度进行：\n\
  \n\n\n\n```typescript\n// ./tests/product.spec.ts\nimport { ProductPage } from \"\
  ../pages/product.page\";\nimport { test, expect } from \"../fixtures/adminAuth.fixture\"\
  ;\ntest(\"Add product to cart with admin auth fixture\", async ({ adminAuthPage\
  \ }) => {\n  // Use the authenticated page created by fixture for all interactions\n\
  const productPage = new ProductPage(adminAuthPage);\n  await productPage.gotoHome();\n\
  \  await productPage.selectCategory(\"Hand Tools\");\n  await productPage.clickProductByIndex(0);\n\
  \  await expect(productPage.productName).toHaveText(\"Combination Pliers\");\n \
  \ await productPage.addToCartButton.click();\n  await expect(productPage.addedToCartMessage).toHaveText(\n\
  \    \"Product added to shopping cart.\"\n  );\n  // wait for the message to disappear\
  \ (up to 10 seconds)\nawait expect(productPage.addedToCartMessage).not.toBeVisible({\n\
  \    timeout: 10000,\n  });\n  await expect(productPage.navCartQuantity).toHaveText(\"\
  1\");\n});\n```\n\n你会注意到我们是从我们创建的 fixture 中导入了 `test` 和 `expect`。由于我们扩展了基础 `test`\
  \ 类并导出了 `expect`，因此 `test` 上可用的所有默认函数都可以在此 fixture 中使用。这与我们在页面对象中扩展 `base.page.ts`\
  \ 文件的方式类似。接下来的操作是使用 `adminAuthPage` 代替我们通常使用 `page` 的地方。这就是魔法发生的地方，因为 `adminAuthPage`\
  \ 已经保存了 fixture 文件中代码保存的 `adminStorageState`，这为你提供了一个已经以管理员身份登录的页面和浏览器上下文。\n\n敏感数据（如凭据）绝不应在生产环境中硬编码。虽然\
  \ Toolshop 为此演示提供了测试凭据，但真实项目应该使用环境变量（例如 `process.env.CUSTOMER_1_EMAIL`）或密钥管理器来保护凭据。请参阅*第\
  \ 14 章，*安全与身份验证*。\n\n现在，为了让我们的测试过程更加顺畅高效，拥有一套测试工具是非常用的。\n\n## 使用数据工厂\n\n在处理像电子商务网站这样迭代极快的项目时，挑战之一是避免在测试脚本中硬编码数据。反复使用同一个电子邮件地址或密码看起来可能无害，但它往往会导致不可预料的失败，例如重复账户错误或与不断变化的验证规则发生冲突。\n\
  \n这就是数据创建方法（通常称为 `data factories`）用用场。数据工厂本质上是一组可重用的函数，根据需要生成新鲜、真实的测试数据。这使得你的测试更加可靠，为你提供了更广泛的覆盖（包括带有异常字符或长度的边界情况），并确保每次测试运行都是独立的，且更接近真实世界的使用。\n\
  \n对于我们的 Playwright 项目，我们将使用一个名为 `Faker.js` 的知名库。它专门为生成跨广泛类别的可信虚假数据而构建。它轻量级、易于集成，你可能记得我们在*第\
  \ 15 章中了解过它，*测试可维护性的最佳实践*。\n\n## 设置 Faker.js\n\n首先通过此命令将其作为开发依赖项安装：\n\n```\nnpm\
  \ install -D @faker-js/faker\n```\n\n完成后，你可以创建一个专门的文件，例如 `/data/factory.ts`，如项目结构所示。这就是你定义工厂函数的地方：\n\
  \n```typescript\n// ./data/factory.ts\nimport { faker } from \"@faker-js/faker\"\
  ;\nexport function createUser(_overrides = {}) {\n  return {\n    firstName: faker.person.firstName(),\n\
  \    lastName: faker.person.lastName(),\n    email: faker.internet.email(),\n  \
  \  password: faker.internet.password({ length: 10, prefix: \"#1Aa\" }),\n    streetAddress:\
  \ faker.location.streetAddress(),\n    city: faker.location.city(),\n    state:\
  \ faker.location.state(),\n    zip: faker.location.zipCode(\"#####\"),\n    country:\
  \ \"United States of America (the)\", // Toolshop 需要特定的国家\nphone: faker.string.numeric(10),\n\
  \    dob: createDOB({ min: 18, max: 80 }),\n  };\n}\n/**\n * 创建用户对象数组。\n * @param\
  \ {number} count - 生成的用户数量\n * @returns {Array<object>} 用户对象数组\n */\nexport function\
  \ createUsers(count: number): Array<object>\n {\n  return Array.from({ length: count\
  \ }, () => createUser());\n}\nexport function createInvalidUser() {\n  return {\n\
  \    firstName: \"\", // 空姓名\ndob: \"1900\", // 格式无效\npassword: \"123\", // 过短\n\
  \  };\n}\nexport function createDOB(ageRange: { min: number; max: number }) {\n\
  \  return faker.date\n    .birthdate({ min: ageRange.min, max: ageRange.max, mode:\
  \ \"age\" })\n    .toISOString()\n    .split(\"T\")[0];\n}\n```\n\n如果你想自己设置某些值，`_overrides`\
  \ 参数允许你这样做。例如，`createUser({ email: 'specific@example.com' })`。\n\n\n\n\n\n- 一个用于测试成功注册的有效用户\n\
  - 一个用于测试错误处理的无效用户\n\n将存储状态设置为 `undefined` 可以确保每个测试都运行在未登录的浏览器上下文中。\n\n```\ntest.describe(\"\
  Practice Software Testing Site Tests\", async () => {\n  let user: any;\n  let invalidUser:\
  \ any;\n  test.use({ storageState: undefined });\n  test.beforeEach(async () =>\
  \ {\n    invalidUser = createInvalidUser();\n    user = createUser();\n  });\n```\n\
  \n这第一个测试验证了新用户可以成功注册，并在之后被重定向到登录页面：\n\n```\ntest(\"Successful user registration\"\
  , async ({ page }) => {\n    const registrationPage = new RegistrationPage(page);\n\
  \    await registrationPage.goto();\n    await registrationPage.clearStorage(page);\n\
  \    await registrationPage.firstNameInput.fill(user.firstName);\n    await registrationPage.lastNameInput.fill(user.lastName);\n\
  \    await registrationPage.dobInput.fill(user.dob);\n    await registrationPage.streetInput.fill(user.streetAddress);\n\
  \    await registrationPage.postalCodeInput.fill(user.zip);\n    await registrationPage.cityInput.fill(user.city);\n\
  \    await registrationPage.stateInput.fill(user.state);\n    await registrationPage.countrySelect.selectOption({\
  \ label: user.country });\n    await registrationPage.phoneInput.fill(user.phone);\n\
  \    await registrationPage.emailInput.fill(user.email);\n    await registrationPage.passwordInput.fill(user.password);\n\
  \    const responsePromise = page.waitForResponse(\n      (response) =>\n      \
  \  response.url().includes(\"/users/register\") && response.status() === 201\n \
  \   );\n    await registrationPage.registerSubmitButton.click();\n    await responsePromise;\n\
  \    await expect(page).toHaveURL(/auth\\/login/);\n  });\n```\n\n在这里，我们进入注册页面，清除任何旧数据，并使用有效的\
  \ `user` 对象填充所有必填字段。然后，我们等待网络响应，以确认 `/users/register` API 调用成功执行。完成后，我们检查页面是否重定向到登录屏幕，这确认了注册流程按预期完成。\n\
  \n在我们的示例中，我们同时调用了 `test.use({ storageState: undefined })` 和自定义的 `.clearStorage(page)`\
  \ 辅助函数。这是冗余的；我们完全是为了演示。当你想要在创建浏览器上下文之前获取新鲜上下文时，请使用 `test.use()`；当需要在测试过程中重置已运行的上下文时，使用\
  \ `.clearStorage(page)`。根据你的需求选择一种方法。\n\n第二个测试检查网站如何处理无效或不完整的用户数据，并显示适当的验证消息：\n\n\
  ```\ntest(\"Negative registration with invalid data\", async ({ page }) => {\n \
  \   const registrationPage = new RegistrationPage(page);\n    await registrationPage.goto();\n\
  \    await registrationPage.clearStorage(page);\n    await registrationPage.firstNameInput.fill(invalidUser.firstName);\n\
  \    await registrationPage.dobInput.fill(invalidUser.dob);\n    await registrationPage.passwordInput.fill(invalidUser.password);\n\
  \    await registrationPage.submitRegistration();\n    await expect(page.getByText(\"\
  First name is required\")).toBeVisible();\n    await expect(page.getByText(\"Please\
  \ enter a valid date\")).toBeVisible();\n    await expect(\n      page.getByText(\"\
  Password must be minimal 6 characters long.\")\n    ).toBeVisible();\n  });\n});\n\
  ```\n\n我们刻意从 `invalidUser` 对象提交了不完整或无效的数据。然后，我们确认页面上出现了正确的验证消息。\n\n通过这种方法，每当我们创建一个新测试时，都会自动为它提供新的新鲜用户数据。\n\
  \n如果你测试的 Web 应用程序具有 i18n（国际化），通常最好的做法是抽象你的测试字符串以便于维护，甚至更好，为断言的文本字符串利用相同的数据源。\n\n\
  ## 覆盖边缘情况\n\n不要忘记边缘情况：你可以添加方法来覆盖边界条件，例如最大长度的名称或极端价格值。这是一个示例：\n\n```javascript\n\
  export function createEdgeCaseUser() {\n  return {\n    ...createUser(),\n    firstName:\
  \ faker.string.alpha({ length: 50 }),\n    email: `test+${faker.string.alphanumeric(100)}@test.com`,\n\
  \  };\n}\n```\n\n`createEdgeCaseUser()` 函数位于我们的 `factory.ts` 脚本中，并基于 `createUser()`\
  \ 构建，但专门修改了某些字段以推向这些限制，从而测试应用程序如何处理棘手或异常的输入。这些输入处于系统允许范围的边界，例如达到最大字符限制的名称、具有异常格式的电子邮件或包含特殊字符的条目。\n\
  \n对于像 Toolshop 这样的电子商务网站，测试这些场景尤为重要。用户输入在注册或结账等任务期间频繁发生，如果没有经过妥当验证，可能会导致错误、安全风险甚至数据库问题。\n\
  \n邮箱字段可能允许长地址，但应该拒绝超过长度限制或包含无效符号的地址。通过使用此类输入进行测试，应用程序可以优雅地响应：显示帮助的错误消息，而不是崩溃或接受错误数据。\n\
  \n正如我们所看到的，可以使用 Faker 的随机化来保持数据多样化，但要确保在需要更多控制时允许覆盖。\n\n需要记住的一几点是本地化：Faker 支持多个语言区域，因此如果你的电子商务网站是多语言的，你可以在工厂文件顶部设置\
  \ `faker.locale = 'de';` 以生成德语特定的数据。此外，虽然 Faker 功能强大，但它不是用于生产环境数据的。请将其严格限制在测试环境中。\n\
  \n随着时间的推移，随着项目的不断增长，你可能会添加更多用于创建产品或客户评价的工厂方法，将其变为所有测试数据生成的枢纽。\n\n将所有数据生成放在 `/data/`\
  \ 目录中以避免重复并确保一致性。这也使得当应用程序更改需要新字段时，你的数据创建方法易于维护。\n\n在为网站应对真实流量做准备时，测试多个用户同时与其交互时的性能是非常重要的（特别是在注册等常见操作期间）。这就是负载测试。以下测试使用\
  \ `registrationPage` 对象和新的数据工厂函数 `createUsers(3)` 为三个用户创建测试数据，在多个浏览器页面上同时填写注册表单并提交，然后通过确认重定向到登录页面来检查结果。\n\
  \n这对于发现潜在的性能瓶颈很有用：\n\n\n\n\n\n```typescript\n// ./tests/bulk.spec.ts\nimport { test,\
  \ expect } from \"@playwright/test\";\nimport { createUsers } from \"../data/factory\"\
  ;\nimport { RegistrationPage } from \"../pages/registration.page\";\ntest.describe(\"\
  Load test\", () => {\n  test(\"bulk user registration\", async ({ browser }) =>\
  \ {\n    // Generate 3 users for simulation. Adjust as needed.\nconst users = createUsers(3);\n\
  \    const registrations = users.map(async (user) => {\n      let context;\n   \
  \   try {\n        context = await browser.newContext();\n        const page = await\
  \ context.newPage();\n        const registrationPage = new RegistrationPage(page);\n\
  \        await registrationPage.goto();\n        await registrationPage.firstNameInput.fill(user.firstName);\n\
  \        await registrationPage.lastNameInput.fill(user.lastName);\n        await\
  \ registrationPage.dobInput.fill(user.dob);\n        await registrationPage.streetInput.fill(user.streetAddress);\n\
  \        await registrationPage.postalCodeInput.fill(user.zip);\n        await registrationPage.cityInput.fill(user.city);\n\
  \        await registrationPage.stateInput.fill(user.state);\n        await registrationPage.countrySelect.selectOption({\n\
  \          label: user.country,\n        });\n        await registrationPage.phoneInput.fill(user.phone);\n\
  \        await registrationPage.emailInput.fill(user.email);\n        await registrationPage.passwordInput.fill(user.password);\n\
  \        await registrationPage.submitRegistration();\n        console.log(\n  \
  \        `Registering ${user.firstName} ${user.lastName} concurrently...`\n    \
  \    );\n        // Expect success\nawait expect(page).toHaveURL(/auth\\/login/);\n\
  \      } finally {\n        await context.close();\n      }\n    });\n    await\
  \ Promise.all(registrations);\n  });\n});\n```\n\n不过，对于真实的负载测试，你可能希望将该数字增加到更大的值。\n\
  \n如果你想测试具有数千名用户的高流量，可以使用专的负载测试工具，例如 `Locust`、`K6`、`Artillery` 或 `JMeter`。\n\n从这里开始，脚本模拟了很多人同时注册。它循环遍历每个用户，为他们启动一个异步任务，并使用\
  \ `await context.newPage()` 打开一个全新的浏览器页面。每个页面然后导航到注册表单并填写内容，一旦用户通过验证，页面就会关闭以节省资源。\n\
  \n所有这些注册任务都通过 `Promise.all()` 方法并行运行，因此脚本会等待直到所有操作完成。通过这种方式，你实际上模拟了一小群用户同时注册，并测试系统是否能够跟上并妥善处理每个注册。\n\
  \n这种方法让你能够窥见网站如何处理并发活动，例如 API 调用和数据库写入。它对于发现潜在问题（如速率限制或性能下降）也很有用。\n\n# 总结\n\n本章带你你学习了如何为电子商务网站创建一个稳健且灵活的端到端测试框架。我们以\
  \ `Toolshop` 为例，深入探讨了测试用户注册、产品浏览、购物车功能等功能的实用方法。通过应用`页面对象模型`（`POM`），我们保持了测试代码的整洁和易于更新，即使在网站设计发生变化也是如此。\n\
  \n使用存储状态（storage states）通过重用登录会话帮助加速测试，而带有 `Faker.js` 的数据工厂确保了我们的测试使用新鲜、真实的数据以获得更好的可靠性。辅助函数简化了重复性任务，清晰的项目结构使得一切都变得可扩展且对团队友好。这些技术共同创建了一个测试设置，能够随着你的应用程序增长而成长，并帮助你有信心地维护一个高质量的网站。\n\
  \n## 作者的话\n\n感谢你花时间与我们在一起，并通过 `Playwright` 探索测试的世界。我们希望分享的课程、示例和实践能帮助你对测试更有信心，并为你的开发过程带来更多便利。\n\
