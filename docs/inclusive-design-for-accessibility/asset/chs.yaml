- "# 无障碍包容性设计\n\n\n献给我的父母 Paul 和 Geraldine，他们曾大声且毫无歉意地教我，残障人士就是人，仅仅如此。你们的坚定清晰成为了我的指南针。献给我的妻子\
  \ Heather Humble —— 我最坚定的信徒，我最真诚的伙伴。整本书都留下了你的痕迹，无论可见与否。你是我最爱的。\n\n*- Dale Cruse*\n\
  \n献给那些患有隐性残障或神经多样性思维的人。献给那些觉得必须隐藏真实自我以保持安全、融入或被视为“足够”的人。献给那些掌握了“伪装”艺术的人，不是因为他们想，而是因为他们不得不。这本书是给你们的。愿世界早日成为一个我们不再为了归属而必须伪装的世界。\n\
  \n*- Denis Boudreau*\n\n# 前言\n\n当十二位无障碍领域最深思、最有经验的大脑汇聚在一起写一本书时，会发生什么？你将得到比技术手册强大得多的东西——你得到了一个真正为所有人服务的数字世界蓝图。\n\
  \n这本书呼吁我们转变思维——从为残障设计转变为为人类多样性设计。它挑战了“无障碍是一项狭门专业领域”的观点。相反，它将无障碍视为创新、公平以及所有人更好用户体验的基石。\n\
  \n有一句话让我记忆犹新：\n\n“当我们遇到一个无法无障碍使用的网站时，我们现在看到的是设计的缺陷，而不是一个‘残障’用户。”\n\n这种思维的转变是改变规则的。\n\
  \n这些作者——教育者、从业者、研究人员和倡导者——邀请我们进入一种更广阔、以人为中心的工作方式。他们展示了能力是流动的，而非固定的。展示了交叉性如何使假设变得复杂。以及与残障用户的共同创作不仅是锦上添花，更是必不可少的。\n\
  \n这里的概念植根于经验，并具有创造性的前瞻性。你将发现坚实的框架，如`通用设计七大原则`，同时还有新鲜、充满活力的方法，例如“共同创作狂欢节”，以及关于如何解决复杂无障碍难题的深度实用建议。\n\
  \n读完这本书后，你会变得更明智。但更重要的是，你将更有能力帮助构建我们所有人都配得的那种数字世界。\n\n致十二位才华横溢的作者：感谢你们成为我的缪斯。我有幸与你们中的许多人并肩工作——一起学习，互相指导并被指导，最重要的是，分享对数字平等的坚定承诺。你们激励我向着更远的地方迈进。特别是你，Boudreau！\n\
  \n致你——是的，就是你，正在阅读这本书的你：让这本书引导你、挑战你，并为你的下一步注入能量。我们在一起，就是改变者。\n\n为了无障碍，以及更远方！\n\n\
  *Glenda Sims (a11y 的好女巫)*\n*Deque 信息无障碍官 (CIAO)*\n\n# 贡献者\n\n# 关于作者\n\nDale Cruse\
  \ 是一位高度敏感的共情者，受其对平等机会终身承诺的驱动，灵感源于他的残障父母。他在 `Twitch` 和 `McGraw-Hill Education` 创建了无障碍计划，并在\
  \ `Microsoft` 和 `Deque` 领导了包容性设计倡议，在其中他还帮助发布了行业标准的 `axe DevTools` 无障碍测试插件。Dale 在《Accessibility\
  \ for Everyone》一书和《The Web Ahead》播客中分享了他的专业知识，并是 Packt 出《HTML5 Multimedia Development\
  \ Cookbook》的作者。\n\nDenis Boudreau 是数字无障碍和包容性领导领域的国际专家，在该领域拥有 25 年经验，他与那些不再愿意忽视残障包容、并希望将其领导方式从“部分包容”转变为真正包容的领导者和高管合作。他专门支持希望采用更具包容性的领导力和沟通实践的组织，特别是针对那些生活有残障、随年龄增长或被技术边缘化的员工和客户。他为思想领袖和传播者提供了将其信息扩展到更广泛受众的手段，他也是亚马逊畅销书《The\
  \ Inclusive Speaker》（2023 年）的作者。\n\n# 关于贡献作者\n\nDr Angela Young (they/them) 是一位大胆的数字无障碍倡导者。他们通过教育、战略和故事讲述，推动科技领域中酷儿、聋障和神经多样性人士的变革。作为一名资深演讲者和\
  \ 18 年教育者，Angela 曾领导过大规模无障碍倡议，赋能数千人构建包容性的数字体验。他们为每一次对话带来了幽默、情感和深厚的专业知识。Angela 拥有教育博士学位以及无障碍和领导力认证。\n\
  \nMaya Sellon 是一位包容性设计和无障碍领导者，在北美、亚洲和欧洲拥有超过 20 年的经验。她目前正在 `CSUN` 完成辅助技术和人类服务的研究生学位。Maya\
  \ 为全球性组织开发并实施了无障碍实践，将包容性置于设计和技术的核心。她的职业生涯跨越土木工程、用户体验和数字无障碍，带来了多元且全面的视角。作为一名科技爱好者，Maya\
  \ 认为无障碍关乎人——而不仅仅是规则或技术。在空闲时间，她喜欢打鼓，并正在成为认证单人跳伞。\n\nJulianna Rowsell (she/her) 是一位慢性病、神经多样性且残障的产品领导者，患有\
  \ `ADHD`、强直性脊炎和贫血。他们在无障碍、残障正义和公平方面拥有 20 多年的专业知识，挑战榨取性系统以共同创造包容且公正的未来。他们拥有 `OCAD\
  \ University` 的包容性设计硕士学位。Julianna 曾帮助包括加拿大政府和领先科技公司在公司内部做出重大决策，重点关注无障碍的结果和公平的未来。2022\
  \ 年，他们与伴侣共同创立了一个无障碍、可持续且再生的花场。\n\n\n\n\n\nNandita Gupta 是思科公司的高级无障碍产品经理，致力于为所有人创造无障碍且易于使用的产品。她荣获\
  \ `ADCOLOR in Tech 2024`，并曾在 `NASDAQ`、`Forbes`、`Times of India` 等媒体上登登。作为一名 TEDx\
  \ 演讲者，她曾在多次国际会议上发声，工作于产品与无障碍的交叉领域。她是社区内多个委员会的成员，包括 `Lime Connect` 和 `残障碍领导力委员会 (Accessibility\
  \ Leadership Council for Disability: IN)`。过去，她积极参与了各种导师组织，并入选 `Susan M. Daniels\
  \ 残障碍导师名人堂`。\n\nJennifer Chadwick 是一位屡获殊荣的高级数字无障碍策略师和教练，工作遍布加拿大、英国、欧洲和美国。她教授组织理解残障用户的需求，并为产品设计、客户服务、营销、`HR`\
  \ 和采购制定行动计划。Jennifer 曾在 `CSUN`、`AccessU`、`多伦多大学`以及 `联合国 COSP` 进行过演讲。她担任 `W3C 无障碍角色与职责映射\
  \ (ARRM)` 社区小组的共同主席，并对标准 `WCAG Silver 3.0` 和 `无障碍符合性测试规则 (ACT 1.0)` 做出了贡献。\n\nCrystal\
  \ Scott 是一位基督徒妻子、三个优秀孩子的母亲，也是一名`网络无障碍认证专家 (CPWA)`。她拥有十年的前端开发经验和近六年的无障碍专长经验，她投入时间精通\
  \ `Webflow` 并构建无障碍网站，计划在 2025 年推出 `Graceful Web Studio`。她还是一位设计标注专家，以及 `Accessibility\
  \ Book Club`（一个活跃的 LinkedIn 社区）的创始人。Crystal 正在于 `SNHU` 攻读平面设计与媒体艺术的 `B.A.` 学位，并对终身学习、技术和以用户中心的设计充满热情。她与家人以及两只蓝鼻比特犬一起住在`华盛顿州雅基马`。\n\
  \nChris McMeeking 是一位关注无障碍的工程师，`MobA11y` 的创始人/首席技术官，在那里他领导团队重新构 AI 如何支持残障人士。凭借十余年的经验，Chris\
  \ 曾在 `CVS Health` 和 `Deque Systems` 等公司塑造移动端无障碍体验，构建了帮助开发者创建更具包容性应用的工具。他早期对 `Switch\
  \ Control` 的工作（现在 `iOS` 和 `Android` 的核心功能）源于 `密歇根大学`的一个项目，他后来在那里担任了长期导师。Chris 为他触及的每一个产品带来了深厚的技术洞察力和以人为中心的领导力。\n\
  \nKeith Newton 博士是数字无障碍、`AI` 和以用户中心的设计领域的高级技术专家和领导。作为 `W3C 无障碍平台架构与成熟度`工作组的受邀专家，Keith\
  \ 博士通过集成 AI 和机器学习来改进无障碍测试、组织成熟度和治理，领导了企业级的转型。他曾与 `eBay`、`华纳兄弟探索`、`Salesforce` 和`美国运通`等品牌合作，开发了可扩展的\
  \ UX/UI 解决方案，建立了培训计划并推广包容性设计。他在 `WCAG` 合规性、辅助技术测试和数字转型方面的深厚专业知识使他成为备受青的权威，其创新贡献持续塑造着无障碍技术的未来。\n\
  \nCharlie Triplett 是一位 UX 工程无障碍教练，致力于包容性 UX 设计和无障碍 UI 工程。他在 `SEO` 和转化优化方面拥有二十年的经验，他很早就学到，最好的数字产品是那些每个人都能使用的产品。现在，他帮助企业超越合规性，将无障碍性与创新交织，以创建可感知、可操作、可理解且健壮的体验，从而驱动可用性和业务成功。Charlie\
  \ 还撰写了《无障碍书籍》(The Book on Accessibility)，这是一本操作指南，旨在帮助任何规模的组织将包容性整合到其流程中。Charlie\
  \ 住在`纽约`，他喜欢徒步、峡谷运动和美味的贝果包。\n\nKai Wong (她/他们) 是科技行业数字无障碍领域充满激情的变革者。他们是一位发明家（`美国专利申请中`）、`2021\
  \ 年 DC FemTech 奖`获得者，并培训了超过 `2,500` 名专业人士。Kai 被称为“能让枯燥的面包变得有趣”的演讲者，他们的策略非常简单：让它有趣，并激发行动。他们拥有`马里兰大学`的社区健康\
  \ `B.S.` 学位，并拥有无障碍、健康教育和质量保证的认证。\n\n# 关于评审员\n\nDaryl Suttie 是一位网络无障碍专业人士，在 `HTML`、`CSS`\
  \ 和 `JavaScript` 方面拥有 25 年以上的经验，在 `UX/UI` 和产品管理方面拥有 10 多年的经验，前端测试方面也有 10 多年的经验。过去\
  \ 4 年，他专注于利用这些经验专门支持无障碍工作。他曾在大型国家零售商 `Canadian Tire`、国际咨询公司 `Accenture` 工作过，目前在人员平台公司\
  \ `Dayforce`（前 `Ceridian`）工作。他相信教育和导师指导对于转变网络无障碍的态度和做法至关重要。重要的是，他相信“工作就是老师”（即通过解决实际、相关的问题可以获得最好的学习）。\n\
  \nRicky Osman 是全球数字无障碍公司 `TPG Interactive` `Knowledge Center` 的首席技术作家。在该职位上，他负责为\
  \ `TPGi` 员工和进行手动无障碍审计的客户编写指南，并帮助为 `TPGi` 的自动化测试工具构建规则引擎，开发培训课程并撰写博客文章。他在澳大利亚东海岸的家中远程工作，测试他个人设备实验室中的一切，以确保自己不是在胡造。Ricky\
  \ 在 `1994` 年创建了他的第一个网站，当时人们还认为无障碍是理所当然的，从那时起他一直作为自由网页设计师和前端开发者工作，随后担任 `AccessIQ`、`Simply\
  \ Accessible`、`AccessibilityOz`、`Intopia`、`Tenon` 以及现在的 `TPGi` 等组织的无障碍专家。Ricky 在职业生涯中一直磨练写作，他在\
  \ `UX Australia`、`SitePoint`、`Web Directions` 和 `Smashing Magazine` 等媒体担任高级编辑。\n\
  \n# 前言\n\n在一个日益数字化的世界里，在线访问信息、和服务的机会并非奢侈，而是一项人权。然而，对于数百万残障人士，日常数字体验仍然存在阻碍全面参与的障碍。无论是无法使用屏幕阅读器导航的移动应用、将关键内容隐藏在无障碍模态框后的网站，还是误解用户声音或意图的\
  \ AI 工具，数字排斥仍然是一个持续且可以解决的问题。《包容性设计无障碍》(Inclusive Design for Accessibility) 是任何想要缩小这一差距的人的实用指南——包括设计师、开发者、内容创作者、质量测试人员和组织领导。\n\
  \n本书汇集了无障碍社区各界的声音，为你提供了一个构建包容性数字体验的全面路线图。它从让你理解包容性设计原则和真实用户的多样化需求开始。随后，它探索了实现的细节：如何设计无障碍的用户界面、编写包容性内容、构建无障碍网站和移动应用，并结合自动化工具和人类洞察进行测试。随着技术的演进，我们的方法也必须进化。因此，我们还探讨了\
  \ VR、AR 和 AI 等新兴领域的无障碍问题，并研究了可持续扩展这些努力所需的组织策略。\n\n\n\n\n在本书中，你将遇到现实世界的工具和技术——从如\
  \ `VoiceOver` 和 `NVDA` 等屏幕阅读器，到 `SwiftUI`、`Compose` 和 `React Native` 等开发框架。但重要的是，你将获得一个以人为中心的无障碍视角：这种视角不将包容性视为一项清单，而是一项创意、伦理且对业务至关重要的实践。无论你是初学者，还是希望提升所在组织的无障碍成熟度，本书都能帮助你同理心进行设计，以意图进行构建，并创造适用于所有人的数字产品。\n\
  \n# 本本书的读者\n\n这本书非常适合致力于包容性设计的数字设计师、开发者、UX 专业人员、产品经理以及业务领导者。它提供了创建可访问/无障碍数字产品的实用技能，还涵盖了法律和伦理方面、用户研究以及在团队内部建立无障碍文化。\n\
  \n你不需要成为专家也能从这本书中获得价值。每一章都提供了独立可见的可操作见解——无论是 UX 设计、产品管理、开发还是无障碍领导力。\n\n# 本书涵盖的内容\n\
  \n在`第 1 章`(#01.xhtml__idTextAnchor014)《定义数字时代的包容性设计》中，Dale Cruse 规划了无障碍从被动式插件变为主动的、以用户为设计的演变过程。本章介绍了通用设计、残障社会模型和包容性研究方法等基础概念，让你能够设计出适用于所有人的数字体验。\n\
  \n在`第 2 章`(#02.xhtml__idTextAnchor033)《理解多样化的用户需求：障碍类型与辅助技术》中，Angela Young 博士（CPACC）探讨了具有各种永久性、临时性和情境性障碍的人如何与数字技术交互。本章深入介绍了辅助技术，分类了不同的障碍类型，并将用户需求映射到包容性设计策略中，为你创建真正无障碍且赋能所有人的数字产品提供实用指导。\n\
  \n在`第 3 章`(#03.xhtml__idTextAnchor062)《无障碍设计中的法律与伦理考量》中，Maya Sellon 解释了数字无障碍既是法律要求，也是伦理必然要求。本章概述了如\
  \ `ADA` 和 `CRPD` 等全球法律，探讨了仅合合规方法的局限性，并强调了从开始进行包容性设计的重要性。\n\n在`第 4 章`(#04.xhtml__idTextAnchor083)《包容性产品的用户研究与测试》中，Julianna\
  \ Rowsell 指导你建立以残障、神经多样化和边缘参与者为中心的包容性研究实践。本章提供了公平招聘、无障碍方法论和意义分析的策略，强调包容性研究是一种关联性的、持续的实践——而不是清单。\n\
  \n在`第 5 章`(#05.xhtml__idTextAnchor10)《设计无障碍用户界面：视觉与交互设计》中，Nandita Gupta 探讨了如何构建在视觉、认知和输入相关维度上都具有包容性的界面。本章就负责任使用颜色、支持认知无障碍、启用多种输入方法以及扩展设计系统提供了可操作的指导。\n\
  \n在`第 6 章`(#06.xhtml__idTextAnchor132)《创建无障碍内容：写作、图像与多媒体》中，Jennifer Chadwick 赋能内容创作者，让他们通过使用简单语言、无障碍格式和替代格式进行包容性沟通。本章为编写清晰文本、标记交互式元素、描述图像和多媒体提供了实用指导，并以实操练习结束，帮助评估和改进各种内容类型的无障碍性。\n\
  \n在`第 7 章`(#07.xhtml__idTextAnchor173)《开发无障碍网站：HTML、CSS 和 ARIA 最佳实践》中，Crystal Scott\
  \ 为开发者提供了构建包容性、无障碍网站的基础技能。本章涵盖了语义化 `HTML`、无障碍 `CSS`、`ARIA` 属性的正确使用以及测试策略——鼓励无障碍优先的思维，将包容性整合到每一个编码决策中。\n\
  \n在`第 8 章`(#08.xhtml__idTextAnchor194)《移动无障碍：针对触摸和语音界面的设计》中，Chris McMeeking 探讨了构建无障碍移动应用的独特挑战与机遇。本章为优化触摸目标、支持多样化输入方法、设计语音交互以及确保响应式布局提供了实用指导，赋能团队跨平台和设备交付包容性体验。\n\
  \n在`第 9 章`(#09.xhtml__idTextAnchor220)《新兴技术中的无障碍：VR、AR 和 AI》中，Keith Newton 博士探讨了如何在沉浸式和智能系统中设计包容性体验。本章提供了为具有不同需求的用户调整虚拟和增强现实的实用策略，并强调了\
  \ `AI` 如何根据实现方式同时增强和复杂化无障碍性。\n\n在`第 10 章`(#10.xhtml__idTextAnchor240)《无障碍设计系统的基础》中，Charlie\
  \ Triplett 阐述了一个从零开始在设计系统中构建无障碍性的全面框架。本章强调从常见用户需求开始——例如低视力、色彩感知和认知无障碍——然后再分层引入复杂的辅助技术支持，引导团队创建默认减少障碍的包容性、可扩展的系统。\n\
  \n在`第 11 章`(#11.xhtml__idTextAnchor287)《无障碍评估与优先级排序的工具与技术》，Kai Wong（CPACC, CHES®）指导你完成网站和移动应用无障碍测试的实际操作步骤。本章涵盖了如何将自动化工具与人工审计相结合、优先排序并修复问题，以及将无障碍嵌入开发工作流中——帮助团队从零开始构建更具包容性的数字产品。\n\
  \n在`第 12 章`(#12.xhtml__idTextAnchor307)《建立包容性设计文化：组织策略》中，Denis Boudreau（CPWA）展示了如何将无障碍融入组织的日常运营、文化和思维中。本章概述了培养同理心、将无障碍整合到工作流、衡量进展以及维持持续学习的策略——赋能团队从合规转向有意义的、以人为中心的包容性设计实践。\n\
