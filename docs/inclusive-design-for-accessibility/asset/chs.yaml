  \n# 4 包容性产品的用户研究与测试\n\n*作者 Julianna Rowsell*\n\n包容性研究是一种用户研究方法，它刻意地将那些经常被排除在外的群体纳入其中，特别是残障人士、神经多样性群体以及其他面临系统性障碍的人们。它确保我们构建的产品能够反映更广泛的需求、能力和生活现实。包容性研究不仅关乎可访问性，更关乎公平。它质疑了：谁有权塑造我们所有人依赖的工具和系统，而当我们不询问时，谁又被遗落在外面？但包容性并不是自动产生的。它要求我们从一开始就重新思考我们如何设计研究、邀请谁参与、如何触达他们，以及我们愿意根据所学到的知识做出哪些改变。\n\
  \n包容性研究以不同的方式对不同的人具有可访问性，但其核心始于一种心态——一种不再预设为资源匮乏、太困难、太慢或成本太高的心态。它看到了接触并让多样化参与者参与其中的带来的丰富性。当我们把招募（即邀请人们加入我们研究的过程）视为障碍时，我们限制的不仅仅是范围，还有我们的想象力。但当我们把招募视为关怀的行为时，我们开始转变方法。它变成了以公平为中心的研究中具有创造力且必要的一部分，是一个建立信任和关系的机会，而非交易。\n\
  \n作为一名神经多样性研究人员，我处理研究的方式不同。对于那些接受过线性方法或传统 UX 流程训练的人来说，这可能会让他们困惑并感到陌生，但这种差异正是我洞察的来源。我不只是工作方式不同，我的感知也不同。我的大脑会循环、停留和跳跃。它首先注意到边缘：摩擦、重置、压力过载。多年来，我被告知这些特质是分心，是需要被平滑或隐藏的东西。但它们已成为我的指南针。它们塑造了我如何营造空间、如何在言语之下进行倾听，以及我如何与不契合的事物待在一起。\n\
  \n我的方法论不是线性的，因为我的思维不是。我以螺旋方式移动。我会停顿。我在呼吸中留白。我让沉默说话。当事情看起来不明时，我不会急于解决它，而是倾听。困惑不是失败。它是一个信号，标志着表面下有更深层的东西在移动。这并非低效。这是一种更慢的精确。当研究过早要求清晰度时，我们面临失去那些仍在展开的事物的风险。我学会了信任混乱、非线性和未曾言说的话，因为那里往往是真理所在。\n\
  \n可访问性是包容性研究的起点。它不仅关乎某人是否能加入研究。它关乎感到安全、被看见以及留下来需要什么。它是关系性的。它受到权力、历史和背景的影响。在我们要求某人分享之前，我们必须问自己，我们是否付出了努力来好好迎接他们。从这个角度来看，可访问性变成了脚手架。可访问性是它的生活体验，并包含了以下内容：\n\
  \n*   物理和数字可访问性\n*   心理安全感\n*   文化和语言尊重\n*   经济和时间上的可用性\n*   感官和认知上的舒适度\n\n这在实践中的意味着理解“可访问性是一种关系”。它会根据房间里有什么人、询问了什么以及权力如何在空间中流动而改变。我们的工作是塑造研究空间，让人们能够以感到可行、安全且有意义的方式出现。这并非偶然发生的。它在我们要求某人分享见解之前，需要准备、灵活性以及建立信任的意愿。当我们以此为导向时，可访问性就不再是一个复选框或功能，它成了其他一切赖以的基础。\n\
  \n在数字空间中，我们已经了解到可访问性不仅关乎某物是否运行，更关乎它是否感到好用、尊重且安全。研究也是如此。当实践变成榨取时，即使出于好意，我们也在复制我们正试图解决的伤害。\n\
  \n让我们从一件简单但并不容易的事情开始。\n\n\n\n\n如果你以前参与过研究，请回想一下过去的招募工作。谁出现了？谁没有出现？为什么会发生这种情况？这是一次反思的邀请，而非评判。你应该诚实地面对我们所继承的模式和重复的习惯。系统性障碍塑造了排斥，但这些障碍也由我们日常的决策所维持——我们认为谁是“易触达的”，以及我们如何邀请、如何补偿，以及在人们到达后如何做出回应。\n\
  \n很多时候，包容性招募被斥为太难、太小众或太慢。但这些信念不仅限制了我们能触及的人，也限制了我们对可能性的认知。\n\n包容性研究要求我们停下来，关注，并带着意去做。问问自己以下问题：\n\
  \n* 即使时间表要求更高，你是否能够支持按照“信任的速度”行动？\n* 在快速节奏的现实中，你可以在哪里为更深层次的参与留空间？\n\n无障碍性（Accessibility）并非从环节开始，而是始于第一次请求之前。作为致力于包容性的研究人员和设计师，我们必须调整自己的方法。传统的招募往往反映了我们声称要挑战的同样的系统性不平等，过滤掉了那些见解可能改变我们构建什么、如何构建以及为谁构建的人群。如果我们想做得更好，我们需要重新思考如何邀请人们加入，不要将其视为事后补救，而是将其视为工作的开始。我们必须调整研究方法，以尊重参与者的生活现实、偏好和需求，而不是要求他们去适应为非残障常态设计的传统研究方案。\n\
  \n## 重新将招募视为一种关系性实践\n\n如果我们认真对待研究中的公平性，我们需要停止将招募视为一项待勾选的任务，而开始将其视为一种关系性实践。其核心并非招募，而是建立关系——这种关系植根于尊重，受关怀引导，由信任驱动。残障参与者往往认为研究是榨取的、不可触及的或表演性的。转向关系性实践不仅是最佳实践，更是赢得信任并将公平性融入我们互动方式的至关重要。\n\
  \n在我们构建招募实践时，不断问自己以下问题会有帮助：\n\n* 我们的材料无障碍化吗？\n* 我们是否对时间、能量和情感劳动提供了公平的补偿？\n* 我们是否在研究过程中建立了关怀和安全体系？\n\
  * 我们在寻求见解之前是否已经建立了关系？\n* 我们是在使用信赖的社区渠道，还是仅仅使用那些易触达的渠道？\n* 我们是否完成了闭环，并展示了反馈是如何影响结果的？\n\
  * 我们是否在研究结束*后*建立了问责机制？\n\n这些不是额外负担。它们是基于互惠、共同和协作而非榨取的研究文化的基石。\n\n补偿也是我们表达尊重的方式之一。当我们要求人们分享他们的时间、能量或生活经历时（特别是当这些经历受到伤害或排斥的影响时），我们需要意识到这对他们意味着什么。公平、灵活的支付不是形式主义；它是我们证明他们的贡献至关重要的方式之一。\n\
  \n## 超越代表性：从边缘设计\n\n代表性（Representation）是指根据人们在世界中行的完整复杂性进行设计。特别是那些被推离“快乐路径”（happy\
  \ path）的人——即那种假设访问稳定、行为常态且极少变数的理想化、简化用户流。\n\n被忽视为“边缘案例”的参与者（那些需求或经历不符合假设常态的人），往往能揭示系统在何处崩溃。他们的经历显露了他人看不见的摩擦。从边缘设计加深而非狭窄了我们所构建的内容。他们是信号的携带者。当我们认真对待这些信号时，我们并不是在缩小体验，而是在深化它。\n\
  \n神经多样性参与者可能遇到障碍，不是因为流程不清晰，而是因为这要求他们不具备的能量。这不仅仅是布局的问题，更是过载、感官输入和模式复杂性的问题。当我们倾听时，我们开始理解不仅哪里出了问题，以及为什么。\n\
  \n研究倾向于过度关注那些最易触达的人：拥有稳定网络、高数字素养并适应研究规范的人。但它过滤掉了那些视角可能改变我们构建方式的人群。包容性研究要求我们保持复杂性而非将其扁平化，尤其在研究残障和访问需求时。很多时候，残障研究被视为补充性的、轶事的，或在广泛的研究中简化为统计片段。这错过了生活经历的细微差别，并抹去了差异、模式和文化背景。\n\
  \n我们必须建立反映真实、变化且多层次生活的系统，其结果要足够灵活以容纳人们的现实——这些现实是非线性的、动态的且充满人性的。\n\n包容性招募没有通用的检查清单，也没有能保证关怀、互惠或信任的步骤公式。但有我们可以不断提问的问题、我们可以注意的模式，以及我们可以反复实践的活动。不要将此视为处方，而是一个起点——一个在你的背景下反复审视、重塑并在此基础上建立。考虑这些问题：\n\
  \n* 我是否让社区成员参与了研究过程的塑造？\n* 我的招募材料是否无障碍化（语言、格式、交付方式）？\n* 我是否使用了信赖的、文化相关的渠道来分享机会？\n\
  * 我的补偿是否反映了参与者的时间、心水和生活经历？\n* 我是否提供了多种参与方式（同步/异步，口头/非口头）？\n* 我是否通过与参与者分享结果或更新来完成闭环？\n\
  * 我是否尊重了种族、阶级、性别、语言或地理交织的访问需求？\n* 我是否在时间、能量和参与边界上留了灵活性？\n* 我是否在环节中为停顿、情绪或非线性的表达留了空间？\n\
  * 参与者是否在塑造所问的问题，而不仅仅是回答问题？\n* 如果这个过程反过来，我是否会感到安全、受尊重并被重视？\n\n重要的是在具体语境中审慎地应用这些方法，并保持适应的灵活性。当我们与受影响最大的人*一起*设计，而不仅仅是为他们设计时，我们创造了更公正、更具适应性且更有活力的系统。这不是关于表面的修复，而是关于拒绝默认。这是关于在他们所在的地方，接纳他们所承受的一切，并让其塑造我们的构建方式。这是关于尊重数据背后的人性。\n\
  \n## 通过互惠招募使残障生活核心\n\n招募残障参与者不仅仅是为了包容，更是为了改变互动规则。当我们把残障生活置招募中心时，我们开始挑战在如何、何时以及何处引入人们的隐含假设。招募通常是交易性的：时间换礼品卡，见解换交付物。但如果研究仅步于此，它就有变成剥削的风险。这会让人们感到被利用，而不是被重视。\n\
  \n\n\n\n互惠招聘（Reciprocal recruitment）对我们的要求更高。它要求我们慢下来，在提出请求之前建立信任，并创造让人们能够完全投入的空间——不仅是为了回答问题，更是为了塑造问题本身。这意味着邀请人们加入不是作为研究对象，而是作为合作者。它意味着承认知识不仅存在于转录稿中，也存在于宁静、呼吸、图画以及那种相互理解的瞬间中。例如，一个与聋障社区合作的团队，与当地的聋障权利倡导小组共同设计了研究计划，聘请了由参与者挑选的翻译人员，并允许在多次会议中灵活参与。结果不仅是获得了更好的数据，更是一种尊重且可持续的参与模式。\n\
  \n虽然招聘总是涉及某种交换，但它并不必须是剥夺性的。当它根于信任和互惠时，它就从单向交易转变为共同投资。它是关系性的。它将我们的目标从“参与”转向“伙伴关系”，从“收集见解”转向“构建能够回馈的东西”。\n\
  \n为了支持这种转变，这里是指导包容性招聘实践的基本原则：\n\n- 在招募之前建立关系。从信任开始，而不是从外联开始。\n- 公平且灵活地补偿。以反映人们现实情况的方式尊重他们的时间、能量和情感劳动。\n\
  - 尊重交叉性（Intersectionality）。理解残障、种族、性别、阶级和语言等重叠因素如何塑造人们的经历，并影响他们感到安全和获得支持的需要。例如，一个在城市中心出行的白人轮椅使用者，其所面临的障碍可能与一个居住在农村地区的有种族背景自闭症人士完全不同。交叉性提醒我们，可及性绝不是一成不变的；它受到叠加的权力、歧视和特权体系的影响。包容性研究必须考虑这些层次分明的现实，否则可能会加剧我们试图弥合的鸿沟。\n\
  - 共同设计过程，而不只是产出。从一开始就分享权力。\n- 避免剥夺性动态。这意味着要超越脚本化的问题和一次性的互动。当我们把参与者视为数据源而非人时，我们就面临将他们的生活经历商品化的风险。\n\
  \n不要期待人们来找我们，而要去寻找他们。倾听、反馈、并以诚信的态度出现，不仅是一次，而是长久地坚持。我们无法在距离之外共同创造。这就是为什么一些最接地气、最尊重的研究是通过与已经拥有信任的社区、倡导小组、文化组织和基层网络建立伙伴关系实现的。\n\
  \n一个有力的例子是，在我一次与残障和神经多样性参与者社区的研究中，我与一个草根倡导小组合作，从一开始就共同设计招募流程。我们没有使用正式的同意表或标准的筛选脚本，而是共同开发了通俗易懂的材料。参与者不仅识别了无障碍需求，还决定了他们希望互动的方式，例如语音留言、图画、异步参与或感官友好格式。我们根据他们偏好的方法和能量水平进行补偿，且中途退出没有任何处罚。翻译和支持人员是根据参与者的要求邀请的，而不是我们的要求。结果不仅是获得了更诚实的见解——更是一种基于信任的深层关系，参与者可以影响研究本身，而不仅仅是对研究做出回应。\n\
  \n这种方法展示了以下几点：\n\n- 周全且协作的规划\n- 灵活性与自主权\n- 拒绝一刀切的参与方式\n- 将相互尊重和可及性作为起点，而非附加项\n\n\
  这种互惠性不是理论上的；它正在真实的项目中得到实践，这些项目与残障参与者分享权力，并重视他们的认知方式。\n\n这个例子不仅仅是我记得的一个时刻，而是那些重塑了我工作方式的时刻。我在这里分享它们不是为了给出标准处方，而是为了帮助他人在自己的生活中识别这些时刻。包容性研究的工作存在于这些转变之中——体现在我们如何倾听、注意到什么，以及我们如何将其推行。\n\
  \n在下一节中，我们将探索如何调整研究方法以适应无障碍需求，这不仅塑造我们触达的对象，还塑造我们如何倾听、互动，以及建立尊重复杂性、支持参与并以信任速度运行的环境。\n\
  \n# 为无障碍需求调整研究方法\n\n调整研究方法不仅是一个技术挑战；更是一个深刻的人文关怀。如果我们认真对待以残障生活为中心，我们就不能只安排一次会议并期待最好的结果。我们需要在提出请求之前做好工作，确保我们的方法、工具、时间表和结构是可用的、灵活且安全的。\n\
  \n参与绝不是中立的。对于许多残障参与者来说，出现是一种脆弱的表现，这种表现受到长期被排除、被误解或被要求在没有支持的情况下适应的历史影响。研究领域有一个长期的传统，即榨取、简化或遗忘。人们慷慨分享的经历往往只得到沉默。\n\
  \n我记得职业生涯中的一次经历，我当时处于一个大部分由残障人士组成的团队。我的三位同事是盲人或视力低下的者，每个人都以完全不同的方式导航数字世界：\n\n- 其中一人使用高对比度模式，并将所有内容放大\
  \ 800%，依赖屏幕放大器和视觉线索，而不是屏幕阅读器。\n- 另一个人从出生起就盲了，使用屏幕阅读器配合盲文显示器，以线性的、精确的方式处理内容，几乎不需要空间定向。\n\
  - 第三个人在 30 多岁时失明，他们也使用屏幕阅读器，但仍然将其对数字布局的理解锚定在视觉隐喻中——基于肌肉记忆和残余视觉，他们*预期*事物应该出现在屏幕上的位置。\n\
  \n这不是一个理论上的见解。我亲眼见证了：三个盲人同事，一个团队，以及导航同一空间的三种完全不同的方式——同样的残障标签，但不同的时间线、工具和真相。\n\n\
  它改变了我对可及性的理解。它让我明确了没有所谓的“通用用户”，也没有正确的互动方式，它提醒我“调整”不是可选的，而是基础性的。这就是为什么我们不能仓促研究，为什么“最佳实践”并不总是最好的，以及为什么信任不是建立在签字环节，而是在微小的决策中：我们如何出现，如何提问，以及如何营造空间。\n\
  \n## 创建更安全、更赋权的研究空间\n\n心理安全不是加分项，而是伦理研究的基础。当我们邀请人们分享生活经历（特别是那些受到排斥、伤害或边缘化影响的经历）时，我们是在要求一种脆弱感。如果没有相互尊重，这种分享就无法发生。\n\
  \n建立这种信任不是偶然发生的。它需要意图。这意味着确保人们感到被听到、被尊重，并能够安全表达他们的真相，而不担心被评判或忽视。这不仅是因为这是良好的做法，更是因为这是尊重所提供内容的唯一方式。\n\
  \n\n\n\n\n这看起来是在我们知道某个主题可能会引发痛苦回忆时，提供内容警告。这看起来是给予参与者完全的许可，让他们跳过问题、休息或完全离开。这看起来是指明其中涉及的情绪劳动，并以开放的态度做出回应。\n\
  \n后续工作至关重要。有时，这意味着分享资源，例如当地心理健康服务列表、残障人士同伴小组或用通俗易语言编写的后续材料。有时，这意味着以问候信息的形式提供支持、回应参与者的反思，或确保在会议之外有一个值得信赖的联系人。\n\
  \n作为研究人员，我们必须放下紧迫感，或者至少质疑哪些紧迫感是自我施加的，是真正不可忽视的。我们可能无法放慢每一个截止日期，但我们可以选择在我们能够控制的决策和我们寻求分享的叙述中将关怀置于中心。\n\
  \n按需求的速度移动意味着适应人们的生活节奏。这意味着意味着能量是波动的——痛苦、疲劳、照顾、脑雾或职业倦怠并不遵循我们的研究日历。这不仅仅关乎提供灵活的时间表或在幻灯片中添加替代文本（alt\
  \ text），更在于意识到可及性并非固定不变。它是会移动的，我们也必须如此。\n\n以一个非常简单的文本线框图（wireframe）为例。对于仪表板来说，这可能像是一个描述屏幕内容的线性叙述：“顶部是一个搜索栏。下方是两个并排的面板：左侧显示最近的文件，右侧显示项目合作伙伴。”没有视觉效果。没有图层。只有一张由文字组成的地图。这是为那些处理方式不同、使用屏幕阅读器或只需要更多清晰度的人留出空间。情况并非总是如此，文字可能会变得复杂，但在正确的语境下，这是一条有帮助的路。它也可以作为在低保真（lo-fi）或原型阶段将残障人士纳入研究的方法。\n\
  \n这就是“按信任的速度移动”的样子。不华丽。不快速。但深具意图。当人们感到自己是被预料之中的而非例外时，可及性就不是我们提供的某种东西，而是我们从一开始就构建其中的东西。信任不是在单次会议中建立的。它在安静的细节中成长：在邀请函的格式中，在流程节奏中，在那些说着*“在你到达之前我们就考虑过你；你在这里不仅仅是一个数据点”*的工具中。\n\
  \n## 拥抱生活经验\n研究中的可及性不仅仅是确保工具可用或会议准时进行。它关乎观察、调整状态以关注当下的显现情况，并以关怀做出回应。它关乎提供选择而非通牒——以尊重生活现实的方式进行设计，而不是要求人们为了适应方法而表现或缩小自己来迎合它。\n\
  \n真正的可及性要求的不仅仅是合规。它促使我们进入一种更具关系性的实践——一种适应差异、欢迎摩擦并对变化保持开放的实践。转向迎合每位参与者的身体、心理、节奏和知识的研究将不再仅仅是一种方法——它变成了一种建立信任的形式，而那正是真实洞察产生的地方。\n\
  \n可用性测试应该反映人们真实的生活方式，而不仅仅是我们想象的生存方式。这意味着邀请参与者在他们每天出行的空间中使用他们自己的设备和辅助技术，而不是在陌生的实验室或无菌的设置中，这些设置会剥离语境、舒适感以及塑造可及性真实运作方式的小细节。\n\
  \n当人们植根于自己的工具、环境和自己的节奏，并且他们不再需要扭曲自己去迎合一个并非为他们设计的流程时，真正的清晰感就会显现。情境调查（观察某人在日常生活中如何使用产品）揭示了受控环境无法提供的内容。光线。背景噪音。干扰。这些不是干扰项。它们是故事的一部分。对于感官敏感或存在注意力差异的人来说来说，这些往往是决定是*可用*还是*不可用*的决定性因素。\n\
  \n这就是为什么包容性工作坊在设计时考虑了灵活性。它们为多种表达模式留了空间，无论是打字、说话、素描、录音，还是异步加入。它们设置了休息时间。它们欢迎人们按照自己的节奏进入。它们提供的是柔和，而非压力。\n\
  \n记住，共同创造绝不应该以任何人的身体、能力或健康为代价。很多时候，工作坊要求人们连续几小时保持“在线状态”，假设他们有体力、安静性、结构感和持续的专注。但这种模式排除了许多人。事实并非于此。\n\
  \n当我们消除参与的障碍时，我们不仅创造了更多空间，还创造了让人们感到被看到的条件。当人们感到被看到和被支持时，他们会更充分地投入其中。\n\n这提出了更深层的问题：\n\
  * 当某人的网络不稳定，或他们的时区使得“标准时间”无法实现时会发生什么？\n* 感官敏感如何影响一个人的参与能力？\n* 需要什么样的环境才能让人们感到心理安全并分享他们的真相，不仅仅是这一次，而是贯穿始终？\n\
  \n当我们为灵活性进行设计时，我们转移了可及性的权重。我们不再要求参与者伸展自己来适应僵化的系统。相反，我们作为研究人员、协调者和设计师承担责任，向他们移动。\n\
  \n这就是提供可及性与实践公平之间的区别。前者让门保持未锁；后者则重塑房间。\n\n## 实践中的包容性研究，即使在资源紧张\n并非每个团队都有资源、资金、时间或人力来一次性实施所有的包容性研究建议。但包容性研究并非全有全无；它是通过持续的、有意的选择来构建的。包容性研究不需要等待许可、完美时机或下一个财政周期。有很多小方法可以让你从现状开始，利用你现有的资源。让工作保持完美并处于进行中。以下是一些可以推动你的实践的微小转变，即使在受限的环境中：\n\
  \n首先，从小处开始：\n* 在招聘材料中使用通俗语言。这不产生成本且能提高可及性。\n* 提供异步参与（例如电子邮件、语音备忘录）——非常适合神经多样或时间受限的参与者。\n\
  * 从一个投入不足的群体中选取 1-2 名参与者进行试点。不理想，但比完全缺失好。\n* 在筛选表或介绍邮件中创建一个“信任提示”。询问：“你需要什么才能感到舒适？”\n\
  * 准备 50 美元的互助预算。为某人买交通卡、午餐或保姆，以让参与成为可能。\n* 分享发现。一封简短的感谢邮件和一个所学知识列表可以完成闭环并建立信任。\n\
  * 将同意书转化为对话。即使在开始之前进行 30 秒的口头确认，感觉也与正式的声明不同。\n\n此外，利用已有的资源：\n* 重新分配现有时间的 5-10%。用它来改进入职、反馈循环或方案的可及性。\n\
  * 查看现有工具。你能将包容性构建到已使用的工具或流程中吗（例如带有替代文本的 Miro 面板）？\n* 邀请社区伙伴审查你的计划。来自受信赖声音的一次快速异步评审可以重构假设。\n\
  \n当你无法做所有事情时，你必须问自己，为了减少你所在环境中的排斥，你所做的最小改变是什么？即使是一个单一的选择，也能累积信任。\n\n\n\n并不是每个人都能随时听命出现。患有慢性疾病、神经多样性、残障，或仅仅承受着生活压力的人，其轨迹并不总是线性的。能量会此起彼伏。注意力会消散又回归。疼痛会发作。照顾责任会发生变化。这些并没有一个整齐的时间表。\n\
  \n然而，研究环节往往被构建得像小型表演：紧凑的时间块、固定的格式，以及要求保持在线、保持连贯和实用的无形压力。是的，时间、能力和预算是真实的限制。但排斥、低质量数据、错配的解决方案或整个社区被忽视的代价同样巨大。更具包容性的实践并不总是意味着更高的成本，有时它们只需要我们去注意到哪些可能性。\n\
  \n包容性方法从放弃这种僵化开始。让人们在没有内疚的情况下重新安排时间。将较长的环节拆分为较小的部分。允许人们慢下来稍后回来，选择休息而不是硬撑。此外，请记住，人们的参与方式并不总是符合我们的预期，而这并不是问题。这正是其意义所在。\n\
  \n对某些人来说，出现意味着写作而不是发言，特别是当即时对话很困难，或者语言本身感觉像一种障碍时。另一些人可能更多时间，并不是因为他们心不在焉，而是因为他们的能量像波浪一样波动。疲劳、疼痛、职业倦怠和脑雾——这些没有一个遵循研究日历。出现并不是线性的。\n\
  \n这就是为什么包容性研究不能只提供一种进入路径。它需要提供选项。真实的选项。这可能意味着：\n\n*   提前发送几个书面提示，而不是直接进入对话\n*  \
  \ 邀请更倾向于说话而非打字的人士提供语音备忘\n*   使用异步工具，如共享文档或消息线程\n*   为需要与其生活节奏相匹配节奏的人提供更长的时间跨度\n\
  *   让人们选择电话而非视频通话，特别是在技术支持或精力有限的情况下\n*   如果这有助于减轻过载感，则使用 1:1 对话代替群聊\n*   将说明说明或原型保持为纯文本格式，而不仅仅是图像或幻灯片\n\
  *   在现场环节中留出处理、停顿或休息的空间\n\n这些并不是“无障碍功能”。它们是尊重的基本表现。当我们停止强迫每个人通过同一条窄门时，我们开始听到更真实的反映——这些反映不需要为了浮出水面而强忍不适。无障碍不仅关乎某人能否到场，更关乎他们是否以一种不会让他们付出超出承受范围的方式被欢迎。\n\
  \n## 与参与者建立闭环\n\n建立反馈循环对于维持包容性研究中的问责制至关重要。参与者需要看到他们的经历如何影响产品开发，以信任研究过程。\n\n在法律或实际可行的情况下，定期的研究后更新和持续总结有助于完成闭环。即使无法分享完整的产品更新，一封简单的跟进邮件，总结参与者贡献了什么以及团队学到了什么，仍然可以证明他们的声音是至关重要的。\n\
  \n包容性研究不仅关乎谁被邀请参与；它关乎确保他们的贡献带来真正的改变，强化关系的完整性，并培养研究人员与参与者之间的长期关系。\n\n包容性招聘不仅关乎我们邀请了谁，更关乎我们在整个过程中如何与参与者互动。残障参与者和边缘社区往往会将情感劳动和脆弱性带入研究空间。他们分享被排斥和伤害的个人经历，我们的责任是确保他们离开时感到被看到、被倾听和被重视。\n\
  \n以下是将关怀和安全系统嵌入到你的研究实践的方法：\n\n*   在环节开始前、中、后提供情感检查（check-ins）\n*   提供心理健康支持或社区服务的资源\n\
  *   确保无障碍的沟通渠道以持续建立信任\n\n确保参与者可以在环节结束后跟进以提问、提供反馈或表达疑虑。提供包含研究结果总结和后续步骤的跟进邮件有助于参与者看到他们的贡献如何产生影响。残障参与者在参与研究时往往会重温被排除的经历，这在情感上可能是耗能的。\n\
  \n## 研究作为一种动态且以人为中心的实践\n\n正如你所见，包容性研究不仅关乎改进我们的方法；它关乎重新思考我们的拓展方式。它是从“提取”转向“协作”。从索取意见变为“根据意见*构建东西*”。目标不是收集故事并将其归档，而是确保这些故事能带来真实的东西——有意义的东西。\n\
  \n共同设计测试意味着让参与者不仅评估产品，还参与塑造研究方法本身，例如决定探索哪些问题、为哪些无障碍需求做计划，或者从他们的角度来看，成功意味着什么。\n\n\
  当我们通过灵活的参与、共同设计测试、创伤知情实践和情感安全空间将无障碍嵌入到研究过程中时，我们不仅仅是在增加严谨性。我们是在让工作更具人性化。我们正在消除那些人们经常被要求为了被听见而硬扛的摩擦。\n\
  \n但那并不是终点。\n\n一旦获得洞察，我们必须将同样的能量、同样的问责制带入到我们如何*解读*所听到的内容中。包容性研究并不结束于参与。它存在于我们如何解释、如何处理复杂性，以及我们如何在不过度简化的情况下发现模式。\n\
  \n它存在于我们如何反击主导叙事，这些叙事长期以来塑造了什么是“有效的”、“有价值的”或“客观的”。关怀开始的研究应该以问责结束。那里是意义产生的地方，也是改变扎根的地方。\n\
  \n在下一节中，我们将通过通过尊重完整背景、以生活经验为中心的方式分析定性数据，并为在良好倾听时真正出现的内容进行更真实、更公平的理解留出空间。\n\n# 分析来自不同用户群的定性数据\n\
  \n数据不是中性的。每一份研究数据都承载着其背景的重量、收集方法的偏见以及提供者的生活现实。我们必须超越表面，触及数据中的人性的故事。我们包含在数据集或代码中的内容会直接影响我们得出的结论和采取的行动。\n\
  \n在分析来自边缘社区的数据时，要理解自己的偏见可能如何影响解释。为了帮助平衡这一点，我们需要优先考虑参与者的声音而非我们的假设或信念：\n\n*   我们会直接询问身份（种族、残障、性别或收入），因为这是我们招聘目标或伦理义务的一部分。\n\
  *   其他时候，参与者选择分享的内容，我们并不总是拥有全貌。\n*   这两种现实都塑造了我们的分析方式。当身份被标记时，我们为解释提供了更多背景。当身份未被标记时，我们必须小心不要陷入单一视角。\n\
  *   生活经验是分层的。一段关于屏幕阅读器挫败的引用可能也承载着经济不稳定、文化不信任或系统性忽视的重量。\n\n\n\n\n\n*   交叉性（Intersectionality）并不意味着我们必须解码一切；它意味着我们要时刻意识到，人们呈现出的并非单一的故事。例如，一个有视觉相关残障的人可能同时也是单亲家长，或者是\
  \ 2SLGBTQ+ 社区的一员（“2S”一词承认了原住民对性别和性向的理解，这些理解在主流框架中往往被抹杀）。所有这些因素共同塑造了他们的经历，以及他们应对世界的方式。\n\
  *   研究中的反思性（Reflexivity）意味着为我们`see` 的复杂性以及我们`don’t` 看到的复杂性留出空间。\n\n当我们为投入不足的社区收集数据时，我们不仅仅是在收集信息；我们是在收集由他们复杂的身份所塑造的集体经验。这些交织的身份塑造了他们的经历，而这些经历无法被整齐地归类到某个人口统计框中。然而，很多时候，研究结果会通过将这些经历挤入整齐的形状而忽略细微差别，将它们简化为几个快照。\n\
  \n## 神经多样性作为一种方法：生活经验如何重写规则\n\n我曾认为研究必须是某种特定的样子：从容、准备充分且结构完美。但那个那个版本的研究往往会抛下我的身体。作为一名有\
  \ `ADHD` 的人，我的大脑并不是线性运动的。它的运作方式有点像星座，随心所欲地放大和缩小。它会过度关注他人忽略的模式，又会在感官输入过载时陷入崩溃。这在过去感觉像是一种负担。而现在，它是我最信任的指南针。\n\
  \n这就是为什么我在主持引导时会刻意留出长长的停顿。这就是为什么我提供异步的选项。我会提前发送问题，不仅是为了参与者，还因为我知道按照自己的节奏参与对我`me`来说有多大的帮助。我已经摒弃了“好的研究是快速、整洁或中立的”这种观念。那些在我记忆中留存最久、刻在骨子里的研究，是那些为慢节奏、为不知所措、为迷失留出空间，并依然保持倾听的研究。\n\
  \n研究结束后，有一个节奏往往会加快的时刻。综合。报告。行动。但如果我们在这里匆忙，就会错过真正重要的东西：我们如何接住人们带给我们的东西。\n\n这部分——阐释，不仅仅关乎主题或编码。它关乎意义。而意义不是纯洁的。它是多面的。它是自相矛盾的。它伴随着扰动、犹豫，以及并不总是体现在转录稿中的情感重量。\n\
  \n在许多研究领域，主题分析变成了一个压缩的过程，一个对混乱的内容进行整理，以便它对别人来说“有意义”。但在包容性研究中，我们无法负担起把一切都抹平的代价。我们需要为矛盾、为多重真理、为那些无法轻易贴在墙上便利贴上的东西留出空间。\n\
  \n特别是当我们倾听残障人士或正在应对多层身份的人士时，他们分享的内容并非廉价。它是由多年来的摩擦、适应和被误解所塑造的。因此，当我们分析这些数据时，我们必须自问：我们是在创造意义，还是在抹除意义？\n\
  \n我们知道其中的权衡：有限的时间、紧张的预算、制度性的障碍。并不是每个项目都允许彻底的改变。但每个项目都允许某些事情发生。而这些事情积少成多。\n\n## 创造意义的责任\n\
  \n仅仅见证他人提供的东西是不够的，我们必须考虑我们如何解读这些东西。很多时候，洞察在分析中被扁平化，被简化为剥离了背景、情感和细微差别引言。但包容性研究对我们有更多要求。它要求我们：我们如何承载意义？对于人们信任我们去承担的真理，我们做了什么？这种阐释不能仓促，也不能中立。它必须是关联的、反思的，并且对权力有深的意识。\n\
  \n因此，我回到了引导我工作工作的几个核心问题：\n\n### 我们的解读方式是否反映了所分享内容的分量？\n\n有一次，一位参与者分享说，他们停止使用我们产品的一项核心功能，因为它与他们的屏幕阅读器不兼容。之前的版本对他们来说是可以无障碍使用的，但他们觉得（这种不兼容让他们很困扰——*注：原文此处似乎有不完整，根据语境译为*）。……（注：此处原文文本出现了大量重复和逻辑混乱，以下根据指令进行逻辑翻译）\n\
  \n由于您提供的英文文本在后半部分出现了大量重复且逻辑混乱的断句（例如“It's why...” 类似的段落多次出现），我将严格遵循文档工程师的原则，在保持翻译准确性的基础上，对您提供的特定文本进行逐行翻译，确保不漏译。\n\
  \n*(注：由于您提供的原文从“It’s why I build...”开始出现了严重的重复和文本错乱，以下是基于您提供的原文片段的翻译：)*\n\n[content]\n\
  这就是为什么我在主持引导时会刻意留出长长的停顿。这就是为什么我提供异步的选项。我会提前发送问题，不仅是为了参与者，还因为我知道按照自己的节奏参与对我`me`来说有多大的帮助。我已经摒弃了“好的研究是快速、整洁或中立的”这种观念。那些在我记忆中留存最久、刻在骨子里的研究，是那些为慢节奏、为不知所措、为迷失留出空间，并依然保持倾听的研究。\n\
  \n研究结束后，有一个节奏往往会加快的时刻。综合。报告。行动。但如果我们在这里匆忙，就会错过真正重要的东西：我们如何接住人们带给我们的东西。\n\n这部分——阐释，不仅仅关乎主题或编码。它关乎意义。而意义不是纯洁的。它是多面的。它是自相矛盾的。它伴随着扰动、犹豫，以及并不总是体现在转录稿中的情感重量。\n\
  \n主题分析，在许多研究领域，变成了一个压缩的过程，一个对混乱的内容进行整理，以便它对别人来说“有意义”。但在包容性研究中，我们无法负担起把一切都抹平的代价。我们需要为矛盾、为多重真理、为那些无法轻易贴在墙上便利贴上的东西留出空间。\n\
  \n特别是当我们倾听残障人士或正在应对多层身份的人士时，他们分享的内容并非廉价。它是由多年来的摩擦、适应和被误解所塑造的。因此，当我们分析这些数据时，我们必须自问：我们是在创造意义，还是在抹除意义？\n\
  \n我们知道其中的权衡：有限的时间、紧张的预算、制度性的障碍。并不是每个项目都允许彻底的改变。但每个项目都允许某些事情发生。而这些事情积少成多。\n\n## 创造意义的责任\n\
  \n仅仅见证他人提供的东西是不够的，我们必须考虑我们如何解读这些东西。很多时候，洞察在分析中被扁平化，被简化为剥离了背景、情感和细微差别引言。但包容性研究对我们有更多要求。它要求我们：我们如何承载意义？对于人们信任我们去承担的真理，我们做了什么？这种阐释不能仓促，也不能中立。它必须是关联的、反思的，并且对权力有深的意识。\n\
  \n因此，我回到了引导我工作工作的几个核心问题：\n\n### 我们的解读方式是否反映了所分享内容的分量？\n\n（后续内容因原文高度重复且逻辑破碎，已按原文行逐对应翻译）\n\
  \n\n\n\n# 我们是否为那些不符合我们假设的故事留下了空间？\n\n有时候，人们会留下空白。这并不是因为他们不在乎，而是因为他们在乎。因为再次解释起来太贴近、信息太多，或者太疲惫了。我开始将其也视为数据。模糊性并不是失败。那些矛盾或抵制整洁叙述的披露，往往是我最信任的。它们提醒我：这关乎的不是清晰度，而是复杂性。如果我们的系统无法承载这些，也许是系统需要改变了。\n\
  \n负责任的解读不是被动的。它是一种作者身份的形式。它塑造了被构建、被相信和被支持的内容。我们不仅尊重这些故事，还参与了重塑最初导致这些故事难以讲述的条件。\n\
  \n如果你在好奇这在实践中意味着什么样子的，这正是重点所在。这项工作要求我们留在那些没有简单答案的问题上。但这并不意味着它们是不可操作的。在本章的后半部分，我将提供具体的方法、招募方案、无障碍提示以及综合策略，帮助我们包纳复杂性而不让其崩溃。\n\
  \n当我们分析定性数据时，我们不仅要关注说了了什么，还要关注它是如何分享的。有人犹豫了吗？跳过了某个问题吗？沉默了？这些不是空白，而是信号。标记它们。跟进。利用它们来抵抗平滑那些往往围绕着残障、创伤或排除的复杂性。\n\
  \n有时候，洞察力并不是以清晰的方式呈现。它是带着重量的。我们的工作不是提取它，而是承载它。带着某人交付给我们的东西，即使他们没有大声说。当这种情况发生时，不要急于定义或解决它。标记它。回到它这里。让它停留足够的时间，以揭示它对你要求什么。并不是所有事情都用清晰的线条或整洁的引用来表达。有些真理是静静到达的，要求我们在决定它们的含义之前，多和它们一起待一会儿。\n\
  \n## 流动世界中的动态数据\n\n包容性不仅关乎谁坐在桌旁；它关乎意义是如何产生的，以及谁的真理被允许塑造系统。在研究中，我们持有数据的方式绝非中立。我们优先考虑、丢弃、聚合或解读的内容不仅反映了我们学到了什么，也反映了我们关注了谁以及忽视了谁。\n\
  \n正如关注全球南方的数字人类学家 Payal Arora 所提醒的那样，全球数字叙事往往忽视了大多数世界非正式的、适应性的且混乱的真实生活。包容性设计的先驱\
  \ Jutta Treviranus 敦促我们把包容性视为有意义创新的根源，而非异常处理。两者都挑战了“平均值的暴政”，并呼吁我们把差异视为起点，而不是事后补救。\n\
  \n尽管如此，研究往往会掉入熟悉的分析陷阱中：\n\n*   **洞察力不是静态的**：这里的陷阱是时间。一次会议就变成了一个故事。一个瞬间被误认为是固定的真理。但需求不是静态的，特别是对于残障、神经多样性或被系统性排除的参与者来说。它们受到变化的能量、演进的工具和不断的环境的影响。当我们把学到的东西冻结时，我们是在为过去设计，而不是为正在出现的设计。\n\
  *   **从边缘案例到系统信号**：这里的陷阱是丢弃。离群值被框架化为噪音、对“规范”的偏差，而它们往往是系统何处崩溃的最清晰的信号。对少数人来说像摩擦的东西，往往是深层设计缺陷的信号灯。\n\
  *   **当洞察变成伤害**：这里的陷阱是过度。群体层趋势被应用到个人身上。细微差别坍塌为概括。统计歧视将差异转化为刻板印象。这就是系统在客观性的掩护下悄悄复制伤害的方式。\n\
  *   **过度依赖主导趋势**：这里的陷阱是过度代表。统计学上常见的现象往往反映了最容易接触的参与者，而不是最被排除的群体。当我们把平均值视为真理时，我们就边缘化了那些可能驱动有意义改变的视角和生活知识。\n\
  *   **将细微差别平庸化为类别**：这里的陷阱是强制的一致性。主题分析可以整理矛盾和紧张，但生活经验（尤其是边缘地带的）很少能整齐地契合。与其强迫一致，我们我们可以让复杂性独立存在，将沉默视为存在。停顿、犹豫、跳过的问题——这些通常是信号，而不是空白。它们可能包含了疲劳、不信任或不符合我们框架的真理。良好的倾听意味着听懂字里行间。\n\
  \n这些不是技术性的疏忽——它们是关于我们将什么视为知识的决策。这些是方法论和解释上的选择，塑造了在过程中被重视、验证或驳回的内容。它们揭示了我们允许什么作为有效知识，以及我们仍然愿意忽视什么。为了穿过这些问题，我们需要改变我们持有分享内容的方式——不再将其视为要提取、还原或解决的东西，而是将其视为要与之保持关系的东西。意义存在于摩擦、矛盾和拒绝被框化之中。\n\
  \n包容性分析拒绝过快地解决复杂性。它停留。它提出更好的问题。它为多种真理留出空间。要穿过这些分析陷阱，我们需要的不仅仅是意识；我们需要容纳矛盾的方法、不强迫共识的工具，以及在我们直觉想要简化时减慢速度的实践模式。实现这些目标的方法包括：\n\
  \n*   随着时间的推移重新回顾发现，特别是来自历史上被排除群体的参与者\n*   创建包含参与者检查和社区意义构建的反馈循环\n*   设计分析框架，为异常情况留出空间而不是让其坍塌\n\
  *   在数据集中让沉默可见，不是作为一种空白，而是作为一种缺失\n\n\n\n\n\n以针对神经多样性用户（neurodivergent users）——如自闭症、ADHD、阅读障碍或其他群体——进行研究为例。这种阻力往往不仅仅在于复杂的导航。它关乎认知负载、能量管理，以及我们大脑处理结构、顺序和流程的方式。一个快速的解决方案可能是减少点击次数或简化标签。这可能有帮助，但并没有触及根源。\n\
  \n更深的回应要求我们退后一步，重新思考整个架构：\n\n* 我们组织内容的方式是否直观、灵活，并对多样化的处理方式做出响应？\n* 我们是否尊重了人们扫描、停顿、过度专注、回溯查看或关闭状态的方式？\n\
  * 我们是否仍然在为一种主导的思维方式进行设计？\n\n当我们为神经多样性进行设计时，我们并不是在收窄体验，而是在扩展它。我们减轻了摩擦。我们开启了可能性。神经多样性用户的反馈通常指向更深层的设计模式——内容如何排序、选项如何呈现，以及如何管理选择与过载感。这不仅仅是包容性，这是优秀的设计。\n\
  \n但为未来设计意味着放弃那些扭曲人们本性的旧工具。用户画像（Personas），那些整洁的小档案，通常看起来用。但它们坍塌了复杂性。它们将生活经验萎缩为静态特征，将充满活力的现实变成刻板印象。\n\
  \n与其问*“这个人是谁？”*，我们不如问*“他们是如何应对这一刻的？”* 他们是感到不从心吗？正处于深度专注中吗？移动缓慢还是冲动？原型（Archetypes）和心态（mindsets）提供了更大的灵活性。它们并不定义人，但赋予了我们识别存在模式的方法，例如`导航者`（Navigators）、`即兴者`（Improvisers）和`扫描者`（Scanners），而不会将任何人锁定在单一身份中。\n\
  \n当我们离开固定的画像转向分层的、情化的洞察时，我们开始为*存在的方式*进行设计，而不仅仅是静态的描述。这才是包容性设计的力量所在——它不是来自完美地了解某人，而是来自为他们的变化留出空间。\n\
  \n到目前为止分享的故事并不是旁白；它们就是工作本身。它们展示了保持不适感、阅读言外之意以及让洞察重塑我们运营的系统究竟是什么样子。如果我们只收集数据而不让数据改变我们，那么我们不是在实践包容，而是在表演包容。为现有和未来的用户设计需要灵活性。为现在*以及*下一个进行进行设计。\n\
  \n## 洞察力即关系，而非输出\n\n建立一种让研究发现与参与者共享的反馈闭环，可以建立连续性和长期参与。我们可能会经历这种情况：一个考虑到盲人用户设计的的产品，在技术上可能通过了\
  \ `WCAG` 合规检查，但如果真实用户在它的结构或交互模型上感到挣扎，那么它仍然是不可访问的。\n\n当有人告诉我们系统在何方面让他们失望时，那不是反馈，而是一座灯塔。它是一个信号，在说：“这对我不起，但我仍然在这里，努力帮助你们做得更好。”*\
  \ 我们接下来的做法至关重要。\n\n如果不用心，即使是包容性产品也可能复制伤害。我见过工具通过了所有的合规检查，却仍然感觉无法使用。我看到过团队庆祝选择性（完成一项任务有五种方法），但完全错过了重点，因为没有一种方法能真正触及人们所处的状态。那不是灵活性，那是噪音。这是增加功能与建立对齐之间的区别。\n\
  \n但那种连接不是偶然发生的。它需要一个系统，让洞察力跨越研究、设计和实施，而不丢失其形状或灵魂。这就是我引入一个我在公共和私营部门工作中都使用的框架的地方。我称之为*根源、路径、避难所与现实*（roots,\
  \ routes, refuge, and realities）：\n\n* **根（Roots）**：让我们植根于社区、历史、这项工作的来源，以及它旨在服务的对象。\n\
  * **路径（Routes）**：描绘洞察力穿过冲刺计划、设计审核和决策日志的路径，确保它不会在翻译中消失。\n* **避难所（Refuge）**：为关怀创造空间，让研究人员、参与者和设计师不被推向崩溃。\n\
  * **现实（Realities）**：将我们锚定在真实之中，而非方便或整洁，而是真实的经历。\n\n我使用这个模型来对洞察进行堆肥——不是为了丢弃它，而是让它分解、被吸收，并为下一阶段的工作提供营养。当团队冒着将包容性洞察视为交易的风险，或者最重要的反馈太不方便无法快速采取行动时，这种情况就会发生。这并非万能药，但是一种节奏。\n\
  \n记住，当有人分享系统如何让他们失望时，请将其视为一个转折点，而不仅仅是一个数据点。你如何处理这些反馈将决定他们是否会再次信任你，或信任其他人。\n\n##\
  \ 从残疾出发，而非为残疾设计\n\n包容性设计并非起始于在故障的系统上修补；它起始于从一开始就让残障人士处于中心。例如，语音输入最初是为了无障碍而构建的，现在驱动着\
  \ `Siri` 和 `Alexa` 等主流工具。从残疾出发的设计往往能带来及于人的创新。\n\n我发现的一种很有用方法是建立根于生活经验的原型和心态——这些工具反映了人们如何处理复杂性，而不仅仅是我们想象他们是如何处理的。这些框架喂养了设计模式、可用性启发法以及响应交叉需求的决策。\n\
  \n洞察力只有在它传递时才具有力量。我们所听到的内容必须影响决策、影响投资，并挑战长期以来排除残障用户的默认设置。\n\n通常，研究识别障碍，设计开始构建解决方案，产品随着交付向前推进，但这些线索并不总能织成一个整体。错位会发生。当这种情况发生时，包容性就变成了表演性的，而不是转型性的。\n\
  \n为了弥补这一差距，我们需要采用新的方法——我们我们所有人。研究人员需要以一种可操作且跨团队可见的方式来组织观察。设计师需要将无障碍设计带到上游，将其嵌入系统而不仅仅是屏幕。产品团队需要在他们的流程、优先级中留出空间，让无障碍性成为核心构建的一部分，而不是积压任务。\n\
  \n这意味着要做以下工作：\n\n* 从开始将无障碍设计集成到设计系统、模式库和组件中，这样在每次发布新功能时就不需要修补。\n* 确保研究洞察影响产品路线图、成功指标和冲刺计划。\n\
  \n但这不是我们独立完成的工作。包容性研究是一项集体实践——有意的、持续的、相关的。它需要跨团队协作：研究人员、设计师、工程师、产品负责人以及我们正在共同设计的社区。\n\
  \n## 通过可操作的发现支持设计师\n\n设计师在研究与执行的交汇点工作。为了支持他们，我们需要将意图转化为行动的工具。许多人在流程后期才收到研究主题和模式，这使得实施基础性的无障碍改进变得困难。其他人缺乏清晰的无障碍和可用性指南来将研究转化为具体的设计决策。即使他们以包容的方式构建，也很少验证他们的设计在多样用户的真实用例中是否有效。\n\
  \n为了更好地支持设计师将研究转化为行动，产品团队可以为他们提供实用的、基于证据的工具，连接意图与执行：\n\n* 针对产品需求的包容性设计指南\n* 将参与者的学习转化为可重复模式的设计系统建议\n\
  * 反映真实用户行为而非仅仅是人口统计数据的体验程地图\n* 无障碍用户故事和验收标准，用于在发布前对设计进行压力测试\n\n\n\n\n例如，仅仅说“行动不便的用户难以操作较小的触摸目标”是不够的。这虽然可能是事实，但它并没有为团队提供差异化设计所需的支持。相反，研究人员可以通过建议最小点击尺寸、共享展示特定场景下无障碍交互的带标注草图，或提供经过真实工具、切换控制、语音导航和自适应输入测试的方案，让这些建议变为现实。\n\
  \n这种具体性赋予了力量。它邀请团队参与解决方案。它帮助设计师从意识到转向行动，赋予他们清晰的思路和信心，以为更多人提供更好实用性的方式进行构建。在这个过程中，设计师是我们最紧密的合作者之一。研究不仅为设计提供信息，还帮助重塑产品系统的底层默认。包容性意图通过我们协作的方式得以具体化。这是我们从“要求更好”转向“构建更好”的过程，也是包容性扎根的方式。\n\
  \n# 总结\n本章遵循了包容性研究从意图到实施的全过程，了基于关怀的招募、由无障碍需求塑造的方法、尊重复杂性的分析，以及响应真实听取的设计。\n\n请记住，我们倾听的方式决定了我们构建的内容。当我们从提取式的习惯转向包容性的实践时，我们就能发现最需要关注的摩擦点，即那些从中心位置无法看到的问题。工作不会总是完美或完整的。重要的是，我们要一次又一次出现，即使在限制条件下也保持适应的意愿。\n\
  \n在下一章中，我们将从研究转向界面，将无障碍设计嵌入布局、对比度、导航和交互中，使包容性意图体现在每一个像素中，而不仅仅停留在原则上。\n\n# 第二部分：为无障碍而设计\n\
  在这一部分，你将从基础理论转向实际应用，使你构建无障碍数字产品所需的工具和技术。这些章节将探索包容性设计原则如何转化为用户界面设计、内容创作、网页开发和移动体验。\n\
  \n你将学习如何跨视觉设计、交互设计、语义 `HTML`、`CSS`、`ARIA`、多媒体内容以及 `iOS` 和 `Android` 等移动特定平台应用无障碍最佳实践。\n\
  \n无论你是使用颜色进行设计、构建 `HTML`、编写替代文本，还是为触摸和语音输入进行构建，这部分都展示了如何创建让残障人士无缝运行——并让所有人都变得更好的数字环境。\n\
  \n此部分包含以下章节：\n* `第 5 章`：设计无障碍用户界面：视觉与交互设计\n* `第 6 章`：创建无障碍内容：写作、图像与多媒体\n* `第 7 章`：开发无障碍网站：`HTML`、`CSS`\
  \ 和 `ARIA`最佳实践\n* `第 8 章`：移动无障碍：为触摸和语音界面设计\n\n# 5. 设计无障碍用户界面：视觉与交互设计\n*作者：Nandita\
  \ Gupta*\n\n无障碍用户界面是创建让所有人都有良好体验的关键，无论他们的能力如何或如何与技术交互。在本章中，我们将涵盖在考虑无障碍的情况下进行设计的重要方面，例如有效使用颜色、针对认知进行设计、支持多种输入方法，以及在不同设备和平台之间扩展无障碍性。目标是帮助你构建不仅无障碍，而且对所有用户来说都直观且吸引人的界面。\n\
  \n这些信息非常有价值，因为无障碍对于包容性和可用性至关重要。当你深思熟虑地设计时，你消除了障碍，创造了更具意义、更灵活的体验，触达更广泛的观众。本章为你提供了实用的见解和策略，使你的设计真正具有包容性并适应真实的用户需求，并涵盖了这些策略对残障用户的益。\n\
  \n在本章中，我们将深入探讨以下主题：\n* 在视觉设计中使用颜色\n* 考虑到认知障碍进行设计\n* 针对多种替代输入方法进行设计\n* 扩展设计以提高无障碍性\n\
  \n# 在视觉设计中使用颜色\n颜色是视觉设计中一种强大的元素。它可以唤起情感、引导用户交互并创造令人记忆的体验。然而，力量越大，责任越大。设计师必须意识到，颜色感知在不同的人、文化和背景之间存在显著差异。对于一组用户来说可能看起来直观或通用易懂的东西，对另一组用户来说可能是困惑或排斥的。\n\
  \n本节将探索如何有效使用颜色，以确保所有用户的无障碍性。我们将深入探讨色彩对比、图案、形状和图标的替代方案，并讨论在安全警示系统中如何进行文化考量。目标是创建出能够服务更广泛、更多样化受众的设计，其中包括全球估计\
  \ 3 亿患有色觉的人群（根据世界卫生组织）。\n\n## 用于时间敏感决策和安全的颜色\n交通信号灯是利用颜色快速、直观地传递信息的熟悉例子。但对于红绿色盲（一种常见的色觉障碍）人士来说，这些灯光之间的区别可能并不清晰，从而产生潜在的安全风险。这种挑战在制造业等高风险环境中尤为突出，在那里，分秒级的决策不仅影响生产力，还会影响工人安全。在这种环境下，仅依赖颜色来传递紧急性、状态或系统状况会引入不必要的风险。\n\
  \n`RealPars` 公司写的一篇文章，展示了在系统中无差别地使用颜色会对制造系统产生巨大影响，这不仅会造成认知负荷，还会成为潜在的安全危害：`https://www.realpars.com/blog/high-performance-hmi`\n\
  \n另一个重要的考虑是颜色的意义并不是固定的；它随文化和背景而异。例如，红色在北美和欧洲广泛用于信号危险或“停止”，但在亚洲地区，它也可以代表庆祝或繁荣。同样，白色在西方文化中可能代表清洁或安全，而在其他文化中，它与哀悼和死亡密切相关。这些差异在全球产品中至关重要，误读信号可能会导致困惑或延迟。\n\
  \n相反，将颜色与额外的指示器（如形状、图案、文本标签或声音信号）相结合，以确保信息对所有用户（包括色觉障碍者）都是可用的。例如，可以通过补充不依赖颜色感知的额外线索，使红绿灯的行人信号灯更具无障碍性。不要仅仅依赖颜色，应该这样做：\n\
  \n* 使用文本标签，例如在灯光下方或内部显示“停止”和“通行”。这有助于色觉障碍用户，也能帮助他们在陌生环境中的理解。音频提示（如语音指令或音调模式）可以进一步增强无障碍性。\n\
  * 将颜色与形状配对——例如红色圆形代表“停止”，绿色正方形代表“通行”。这种基于形状的区分在颜色难以分辨的情况下也能强化含义。\n\n\n\n\n\n*  \
  \ 结合符号，例如一个静止的红色人物和一个正在行走的绿色人物。这些符号提供了直观的视觉参考，对于识字率低或存在语言障碍的用户特别有用。\n\n全球范围内无障碍颜色使用的另一个示例来自`国际标准化组织`（`ISO`）开发的国际标准。`ISO`\
  \ 提供了一套统一的图形符号，旨在克服语言障碍并支持跨区域的一致解释。这些符号将颜色与图案、图标和文本结合，清晰、高效地传达关键信息。通过使用多个冗余线索——而不是仅仅依赖颜色——`ISO`\
  \ 标准为设计适用于不同语言、文化和能力的包容性标识和界面元素提供了实用模型。\n\n对某些人来说可能是无障碍的解决方案，对其他人可能会引起触发。例如，闪烁的红灯配合加粗的警告图标和警报声可以立即吸引注意力并促采取采取行动。然而，闪烁的光线对于患有光敏感性障碍的用户可能是触发性的。\n\
  \n## 使用色彩对比确保可读性和清晰度\n\n色彩对比对于确保您的内容对视力低或色盲用户可读且无障碍至关重要。对比度确保文本在背景上清晰突出，使阅读变得更容易。如果没有足够的对比度，用户可能会发现难以区分文本和背景，导致挫败感并增加认知负载。\n\
  \n浅色背景上的深灰色或黑色文本（反之亦然）对于阅读性非常理想，但验证对比度是否符合无障碍要求非常重要。根据`网页内容无障碍指南`（`WCAG`）2.1，标准正文文本与其背景的对比度至少必须达到\
  \ `4.5:1` 才能视为可用。对于较大的文本——通常是 18pt 常规或 14pt 加粗——最小对比要求略低，为 `3:1`。这些指南有助于确保视力障碍或色觉缺陷的用户能够舒适地阅读内容而不感到费劳。\n\
  \n以下是一个表示不同色彩对比级别以及它们是否符合 `WCAG` 指南的示例：\n\n![img](img/B32080_05_1.png)\n\n图 5.1：色彩对比与\
  \ `WCAG` 指南\n\n为了支持可读性，设计师必须尽早并频繁地使用测试对比度与障碍标准的工具来评估颜色组合。如 WebAIM `Color Contrast\
  \ Checker` 等工具让这一切变得简单，它允许设计师输入特定的前景和背景颜色值，并获得关于组合是否符合 `WCAG` 要求的实时反馈。将此类测试集成到设计工作流中，可以确保内容不仅在理想条件下清晰，而且在各种视觉能力和设备设置下都能保持清晰。\n\
  \n`加州州立大学里奇分校`（`CSUN`）提供了一篇关于色彩对比优很好的文章，以及一个非常有用的对比表：[`www.csun.edu/universal-design-center/web-accessibility-criteria-color-contrast`](https://www.csun.edu/universal-design-center/web-accessibility-criteria-color-contrast)\n\
  \n## 在图表和图形中使用颜色\n\n界面和网页中使用的图表是另一个数据驱动设计使用颜色来区分类别或突出趋势的示例。然而，仅仅依赖颜色来表示不同的数据点是不够的，在颜色之外使用图案或纹理对感知非常有价值。\n\
  \n例如，在饼图中，每个扇区不仅可以通过颜色区分，还可以通过使用实色、条纹、圆点或其他图案来区分。这些变化帮助用户即使他们无法准确感知颜色，也能区分数据集。在使用图例时，将颜色颜色与清晰的文本标签以及该数据点代表含义的简要描述配对。这确保了表无论视觉能力如何都是易理解的。此外，所有图表和图形应包含描述性的替代文本——可以是说明、摘要或无障碍数据表——以支持依赖屏幕阅读器的用户或从文字背景中受益的认知障碍用户。\n\
  \n查看下面的饼图，我们可以看到使用了不同的颜色来区分扇区，同时对每个切片进行了纹理处理，并为每个部分标记特定数值：\n\n![img](img/B32080_05_2.png)\n\
  \n图 5.2：具有不同颜色和清晰标签的饼图（尽管为了更好的无障碍性还可以进一步改进！）\n\n为了改进它，`Burgers`和`Sushi`标签使用的颜色非常相似，我们可以更改其中一个标签的颜色。我们也可以为每个切片使用不同的纹理；然而，许多不同且冲突的纹理会让消费者感到不知所措，因此应该谨慎使用。\n\
  \n## 使用颜色传达错误\n\n在网页设计中，颜色经常用于指示错误；例如，在填写表单时，绿色表示成功，红色表示失败。然而，色觉缺陷的用户可能无法轻易区分两者，不能假设所有人都有通用的颜色感知。\n\
  \n全球范围内约 8%的男性和 0.5%的女性经历某种形式的色盲，这可能导致依赖颜色的信息不可用。色盲从难以区分某些色调（如红色和绿色）到完全无法感知任何颜色（全色盲）不等。\n\
  \n为了确保视觉设计和颜色的无障碍表单验证流程，请执行以下操作：\n\n*   在彩色文本旁边添加图标，注明成功或失败。例如，绿色勾号和红色叉提供了关于状态的清晰视觉线索，无论用户的感知能力如何。\n\
  *   使用描述性文本标签清晰地通信验证状态。诸如`您的电子邮件地址有效`或`表单提交成功`等文本有助于确认成功操作，而如`请输入有效的电子邮件地址`或`提交不完整`——`请完成上方所有必字段`等错误消息则引导用户解决。这些文本标签也支持屏幕阅读器用户。\n\
  *   使用形状或布局，例如用虚线或粗边框突出显示处于错误的表单字段边框，有助于无法感知颜色差异的用户。\n\n![img](img/B32080_05_3.png)\n\
  \n图 5.3：利用符号、文本和边框的字段验证\n\n*   为依赖辅助技术的用户提供音频报警或触觉反馈，以指示错误而无需视觉线索。\n\n## 使用颜色表示操作和交互\n\
  \n示能是一种强大的设计原则，向用户指示哪些操作是可能的，点击按钮、拖动滑块或切换开关。这些视觉和交互线索帮助用户直观地理解如何与界面交互，通常不需要说明。当示能与颜色巧妙结合时，它会创建增强含义的视觉模式，鼓励积极、可预测的交互。设计强大的示能减少猜测，引导用户行为，并为认知或运动障碍用户提供帮助，使界面更加直观且易于导航。\n\
  \n\n\n\n\n在移动端和网页平台上，按钮和链接通常使用颜色来指示操作或交互。然而，如果按钮文本与背景的对比度不足，视力低的用户可能无法与网站进行有效交互。因此，确保按钮与其背景具有高对比度至关重要。白字蓝底提供了极佳的对比度，确保了在不同设备以及不同视力能力的用户面前清晰可见。此外，使用悬停效果（hover\
  \ effects）来指示交互性，并使用清晰、具描述性的标签来解释点击按钮后将执行的操作（例如，`Submit form`）。\n\n因此，设计师可以利用可负担性（affordance）来实现无障碍的具体方法包括：在按钮上使用清晰的标签、为触摸设备引入触感或动画反馈、确保交互元素具有明显的边框或阴影以脱颖而出，以及使用用户可以学习和识别的一致图标。将这些视觉线索与对屏幕阅读器友好的属性相结合可以确保依赖辅助技术的用户能够通过音频或触觉反馈接收相同的信息，从而为所有人提供包容性的体验。\n\
  \n颜色不仅仅是一个设计元素；它传达着意义。从交通灯到网站，颜色经常被用来传达紧急性、状态或分类。但颜色感知并非普适的，理解人类感知颜色的关键差异至关重要。在无障碍设计中使用颜色包括多种考虑因素，如对比度、文本的使用和上下文。除了其他因素，这些元素必须的应用以创建清晰度，特别是在为认知进行设计时。\n\
  \n# 考虑到认知障碍进行设计\n\n针对认知能力和认知障碍设计用户界面，可以确保所有用户都能平等访问信息和功能。认知障碍（如阅读障碍、ADHD 和学习障碍）差异很大，设计的复杂性可能会让这些用户无所适从。支持所有用户的关键在于降低复杂性：使内容清晰、逻辑化、可预测且易于导航。\n\
  \n通过将这些融入设计过程中，我们创建了直观、可预测且适应性强的界面，赋予用户力量。这些设计必须在大规模范围内有效，以构建一个支持多样认知能力的包容性数字生态系统。\n\
  \n## 用户界面的一致性\n\n一致性和可预测性对于支持认知障碍用户至关重要。当界面以预期的方式运行时，用户可以建立心理模型、识别模式并预测结果，从而更容易学习和导航数字环境。这与本·舍尼德曼（Ben\
  \ Shneiderman）的`界面设计八大法则`之一相一致：“追求一致性”。\n\n这与 WCAG 2.2 `指南 3.2: 可理解原则下的可预测性` 密相关。在该指南中，`成功标准\
  \ 3.2.3: 一致导航（AA 级）`和`3.2.4: 一致识别（AA 级）`侧重于确保导航机制和具有相同功能的元素在各个页面上保持一致，帮助用户预测如何与界面交互。这种一致性减少了困惑和认知负担，对于障碍用户尤为重要。\n\
  \n设计的统一性对于所有用户（包括障碍用户）的通用可用性至关重要，可以通过以下指南实施：\n\n*   **可预测的模式**：当模式和行为是可以预测的时，用户可以对工作原理建立熟悉感，从而更容易在复杂系统或任务中导航。\n\
  *   **布局**：通过在各个页面中一致地放置导航元素、按钮和交互组件，帮助用户快速学习在哪里找到关键功能。这一原则在 WCAG 2.2 中得到了加强，它引入了对跨页面一致帮助机制的要求（`https://www.w3.org/WAI/WCAG22/Understanding/consistent-help.html`）。\n\
  *   **视觉一致性**：在整个过程中使用相同的图标、按钮和颜色，使用户能够轻松将操作与其视觉线索联系起来。\n*   **交互**：可预测的交互至关重要；遵循通用约定（例如使用垃圾桶图标进行删除）可以防止困惑，并创造更流畅、更直观的体验。\n\
  \n举一个具体的例子，提供相似功能的按钮应该保持一致，以提醒用户可点击的元素和行为。下图展示了按钮一致性的正例和反例：\n\n![img](img/B32080_05_4.png)\n\
  \n图 5.4：良好的与糟糕的按钮一致性\n\n一旦将这些基础 UX 原付诸实践，下一步是确保这些设计模式适用于所有用户，包括有无障碍需求的用户。无障碍背后的原则并非一成不变的；相反，设计模式应该是灵活且自适应的。以下是三个支持无障碍设计的建议：\n\
  \n*   许多认知障碍用户依赖键盘快捷键。确保所有交互元素（如按钮、链接和表单）都可以通过键盘命令访问，并且焦点顺序是逻辑性的（请参阅章节末尾*无障碍信息架构*部分查看良好与糟糕焦点顺序的示例）。确保这些键盘快捷键在整个体验中一致也很重要。\n\
  *   对于需要额外信息的复杂交互，提供上下文帮助或工具提示。这些应该是易于访问且易于理解的，引导用户而不让信息淹没他们。但记住，工具提示不应该是糟糕设计的替代品；设计应该是易于理解的，而工具提示提供额外信息。\n\
  *   表单字段、按钮和其他交互元素应始终使用清晰、描述性的标签。避免使用模糊或通用的术语（如“提交”），而是使用特定特定的语言，如 `Submit Order`\
  \ 或 `Save Your Work`，帮助用户准确理解下一步将发生什么。在适当的情况下，用简单的引导补充这些标签，例如输入示例 `MM/DD/YYYY` 或字段要求\
  \ `Password must be at least 8 characters` 以减少不确定性并防止错误。\n\n## 渐进式披露与内容抽象\n\n构建渐进式披露和抽象的关键不在于向用户界面增加了什么，而在于你延迟了什么。在交互的每一步中只呈现必要的信息，避免让用户记忆之前步骤的细节。将此与烹饪复杂的菜肴相比：长长的食材列表后面是一系列杂乱无章的指令列表。虽然提供所有必要信息（如食材、步骤和所需材料）很重要，但按逻辑顺序呈现这些信息可以简化烹饪过程。\n\
  \n同样，对于用户界面而言，保持任务简单并将复杂过程分解为更小、更易管理的步骤可以减轻认知负担。以下是一些可操作的方法：\n\n*   对于需要更多思考或操作的任务（例如表单提交），将它们拆分为更小的步骤。这有助于用户保持专注，并避免让他们被长的一系列操作所淹没。\n\
  *   避免用过多的选择、过多的文本或过多的视觉杂乱干扰用户。选择整洁、组织良好的布局，并配以清晰的标题和标签。\n\n\n\n\n\n*   向用户指示其在界面/任务中的完成进度。例如，如果用户正在填写一份长表单，显示进度条或步骤指示可以帮助他们直观地看到流程中的位置，使整个任务感觉不那么压力山大。在创建进度条时，请结合颜色和清晰的文本（如数字百分比），并确保屏幕阅读器等辅助技术能够正确播报进度。\n\
  \n    需要注意的是，除了支持具有认知障碍的用户外，前述技术还支持了更大比例的用户群体，包括具有交叉身份和残疾的人士。在用户体验（UX）设计中抽象信息并构建清晰度，可以支持从听觉到视觉的各种处理风格的用户，从而支持更大比例的用户。\n\
  \n## 易于撤销的操作\n\n让用户感到处于控制之中，并且不会因为错误而受到惩罚是非常重要的。这对于认知障碍的用户尤为重要，他们可能需要更多时间来完成任务，并且出错频率可能更高，这符合施尼德曼（Shneiderman）*十大黄金法则*中的之一：“支持内部控制，并允许易于撤销的操作。”当用户知道他们可以在无后果的情况下撤销或修改操作时，会减轻焦虑，鼓励探索，并让数字环境感到更安全、更有支持。\n\
  \n例如，在每个页面上提供`Back”（返回）或`Cancel”（取消）选项允许用户纠正错误而不必担心造成永久性问题。这在涉及数据敏感和关键决策（如删除重要信息）时特别重要，提示用户确认并确保继续操作的后果是清晰的。\n\
  \n另一个例子是在签署关键任务，例如授权银行账户变更或在线完成大额资金转账。在这种情况下，提供一种简单的方法来检查和撤销操作，并带有清晰的`Cancel”（取消）或`Edit”（编辑）选项，不仅可以减少所有用户的焦虑和错误，对于可能需要额外时间或多次尝试确认选择的认知障碍人士来说也为重要。\n\
  \n或者，清晰的`Undo”（撤销）或`Reset”（重置）选项也可以确保用户感到可以进行实验而无产生不可逆转错误的风险。这不仅是认知设计的良好实践，也是良好的\
  \ UX 实践。允许从错误中恢复的设计不太可能让用户感到沮丧，而可能帮助他们在交互中感到胜任。\n\n此外，通过提供易于理解的错误信息和简单的恢复选项，支持错误预防和操作撤销（恢复）至关重要。例如，与其说`Invalid\
  \ entry`无效输入），不如说“请输入格式为 (xxx) xxx-xxxx 的有效电话号码”。预期格式应在指令中清楚说明，理想情况下应提前向用户传达这些预期。\n\
  \n所有这些考虑都支持认知设计，从而提升了产品的整体可用性。在多种输入设备上应用这些考虑对于确保可访问性和用户自定义至关重要。在下一节中，让我们深入探讨针对多种替代输入方法的设计。\n\
  \n# 多种替代输入方法的设计\n\n随着技术的演进，用户依赖的与数字界面交互的输入方法多样性也在不断增加。如今的用户使用大量的技术输入设备，从键盘或鼠标到语音命令、手势，或者使用开关或眼动追踪设备等辅助技术来导航界面。为了确保您的设计真正实现无障碍，创建支持各种输入方法的包容性交互模式至关重要，从而为所有用户提供无缝且可访问的体验。\n\
  \n交互设计需要支持多种输入方法，确保对于肢体障碍、视力障碍和其他独特需求的人士具有可用性。除了多种技术外，用户还有自己的偏好，因此始终需要持续的用户反馈和迭代测试，以随着时间的推移完善这些交互。\n\
  \n构建支持多种输入的无障碍用户界面的关键在于使用各种辅助技术（包括眼动追踪和替代输入设备）进行测试，以确保您的平台完全包容性。用户应该能够完成从浏览页面到完成购买的每一个任务，而不需要传统的鼠标或键盘，而这是通过确保内容和功能在程序上对辅助技术可用来实现的。\n\
  \n## 实现免手操作的语音命令\n\n语音命令已成为肢体障碍用户或偏好基于语音的导航的用户日益重要的交互方法。为语音命令设计涉及支持支持基础导航（例如打开菜单和选择选项）以及更复杂的任务（例如填写表单和控制多媒体内容）。\n\
  \n在语音命令中，当用户可能使用诸如 Dragon 或操作系统内置的 Dictation（听写）功能等辅助技术时，会涉及到多个考虑因素。重要的是构建针对语音交互和可访问性优化的界面，将语音导航整合到所有关键的用户旅程和交互中，以提供完全包容的体验。\n\
  \n为了有效地实现这一点，设计人员应记住以下考虑因素：\n\n*   **清晰且一致的语音命令**：\n    *   定义一组用户易于学习和使用的自然、简单的命令\n\
  \    *   确保语音命令在整个界面中保持一致且直观\n    *   命令结构与类似产品或平台中常用的模式保持一致\n    *   对关键操作使用熟悉的短语（例如“Open\
  \ menu”打开菜单、“Go home”返回首页或“Read aloud”朗读）\n    *   允许措辞微调（例如“Go home”、“Go to Home”或只说“Home”）以适应不同的用户偏好和语音风格\n\
  \n*   **反馈与确认**：\n    *   在尽可能将基于语音的反馈与视觉或触觉线索相结合\n    *   在执行命令后提供视觉确认——例如高亮按钮或更改其状态\n\
  \    *   通过多感官反馈增强交互，帮助用户验证其操作已成功执行\n    *   使用确认提示使语音交互更具可访问性、可预测性和安全性\n\n一个真实世界的例子是使用\
  \ Amazon Alexa (`https://www.alexa.com/`)，它支持跨越从智能家居系统到流媒体等各种设备的语音控制导航。通过提供诸如“Play\
  \ music”（播放音乐）或“Stop”（停止）这样清晰简单的命令，用户可以轻松地免手控制其设备。此外，通过屏幕通知或设备反馈（例如 `Music is playing`）提供的视觉反馈可以确保清晰度。可以设置个性化的语音命令，以控制不需要键盘或点击按钮的设备。\n\
  \n## 增强免触控导航的手势控制\n\n手势控制已成为肢体活动或灵活性受限的用户的一种强大输入方法。通过摄像头、传感器或触摸屏，手势识别允许用户通过滑动、缩放或简单的手势与界面交互。为手势控制设计需要确保手势是直观的、一致的，并提供反馈以引导用户完成任务：\n\
  \n\n\n\n\n* 保持手势简单、熟悉且易于学习非常重要，以避免导致认知过载。复杂或非标准的手势会让肢功能障碍的用户感到沮丧；因此，请坚持常用的手势，如向左/右滑动、双指缩放或长按手势进行激活。\n\
  * 当识别出手势时，界面和系统还必须提供视觉或触觉反馈。例如，滑动手势可能会更改屏幕内容或触发页面转换，并通过清晰的动画来确认手势执行成功。\n* 在许多情况下，添加个性化非常有价值，因为某些用户可能觉得某些手势在身体上很困难或不舒服。允许用户自定义手势映射，或用替代输入（如屏幕按钮或语音命令）替换手势，可以确保界面适应他们的需求，而不是强行采用一律的解决方案。\n\
  \n一个真实世界的例子是集成 Cephable ([https://cephable.com/])，这是一个允许用户使用现有的输入启用基于语音和手势的交互的服务。用户可以使用简单的手势控制设备，例如通过举手暂停会议或滑动切换频道。通过将直观的手势与清晰的视觉反馈（如屏幕动画或颜色变化）相结合，为灵活性受限的人群提供了无障碍体验。\n\
  \n## 辅助技术，包括支持开关、眼动追踪等\n\n自适应开关、眼动追踪设备和吹吸式系统（sip-and-puff systems）等辅助技术对于严重肢功能障碍的用户至关重要。当传统的输入方法不可行时，这些技术提供了与数字系统交互的手段。\n\
  \n确保您的平台兼容这些设备至关重要，让用户能够有效地导航您的网站或应用。除了之前关于语音控制和手势的信息外，允许用户将操作映射到特定的开关输入或眼动移动也很重要。例如，手部活动受限的用户可以使用开关执行鼠标点击或键盘按键。所有交互元素都必须能够通过辅助设备访问并激活，包括逻辑清晰的标签\
  \ 顺序。设计必须确保焦点指示器可见且易于导航，并允许通过单次或多次输入触发操作。\n\nApple 的 `Switch Control`（辅助控制）是一个允许用户通过各种外部开关控制其\
  \ iPhone、iPad 或 Mac 的系统 ([`support.apple.com/en-us/118667`](https://support.apple.com/en-us/118667))。用户可以通过按下映射到特定操作的开关来选择并与屏幕项目进行交互。这让严重肢体障碍的人士能够有效地使用\
  \ Apple 产品。\n\n针对多模态输入（如语音、手势、键盘和辅助设备）进行设计，对于创建无障碍体验至关重要。然而，仅仅在孤立的情况下应用这些技术是不够的。要真正支持多样化的用户，能够在规模上部署和维护所有这些技术至关重要，这就是我们接下来要看到的。\n\
  \n# 规模化设计以改进无障碍性\n\n大规模地进行无障碍设计需要创建一个灵活且包容性的设计系统，该系统能够适用于各种用户需求和设备。这种方法确保了您的平台在增长过程中保持可用性和可访问性。一个设计良好的系统超越了视觉元素，考虑了易用性、认知清晰度以及所有交互的一致性。它包含了可重用组件、字体可读性、用户自定义和键盘导航等元素，确保所有人无论能力如何，都能使用该平台。\n\
  \n## 构建模块化、无障碍的设计系统\n\n可扩展的设计系统对于无障碍性至关重要。它涉及创建可重用的组件（例如按钮、表单和模态框），并对这些组件进行彻底的无障碍测试。这些组件应该足够灵活，可以组装成更复杂的设计而不牺牲无障碍性，这为无障碍平台奠定了可持续的\
  \ de。\n\n实现规模的一种方法是使用符合无障碍标准（如最小对比度和与屏幕阅读器的兼容性）的可重用组件，以及关于如何实现这些组件的指南。设计系统还必须提供如何实现这些组件的清晰文档，包括如何添加替代文本（alt\
  \ text）、如何为屏幕阅读器构建内容，以及如何遵循肢功能障碍的触摸目标尺寸。\n\n这些部分确保了随着平台的演进，新功能将以对简单性、一致性和认知支持的相同关注进行集成。这适用于符合无障碍标准的组件（例如适当的对比度和屏幕阅读器标签）并在整个平台中持续重用的按钮，也适用于为整个平台设置的交互和导航模式。\n\
  \n## 应在规模上实现无障碍的元素\n\n可读性、清晰的语言和易于使用的导航等关键 UX 元素构成了无障碍设计的骨干。这些元素支持规模化的方式是确保在设计系统和\
  \ UI 工具包中仅进行一次更改。因此，每个使用这些元素的设计师或开发者都会自动将无障碍性融入他们的设计中。\n\n以下是元素的一些关键设计考量：\n\n* \
  \  **字体可读性**：优先使用大、清晰且对比度足够的字体，以增强跨设备和用户情况的易读性。避免阻碍可读性的装饰或过度风格化的字体。相反，选择简单、干净的无衬线字体——例如\
  \ `Arial` 或 `Helvetica`——这些字体在各种屏幕尺寸和分辨率上缩放良好并保持清晰。\n*   **颜色的使用**：为了确保规模化的清晰度和包容性，始终用额外的视觉提示补充颜色，如图标、图案、下划线或文本标签。\n\
  *   **引导焦点**：使用一致的视觉提示——例如，在按钮或输入字段等活动元素周围清晰可见焦点环——帮助用户在导航时保持方向。遵循 `WCAG AAA` 建议，此焦点指示器应该是高对比且持久的，确保它在所有页面和组件中可见。\n\
  *   **清晰的语言**：使用简单、直接的措辞，避免可能困扰用户的术语（特别是具有认知挑战的用户）。建立清晰的语言指南，处理语气和可读性水平，以确保内容在整个平台上保持一致且易于理解。\n\
  *   **基于时间的交互**：为用户（特别是有认知障碍的用户）提供调整或禁用任务或交互限制的选项，使他们按照自己的节奏处理信息。为了在规模上支持无障碍，请在平台的所有相关区域一致地实施这些控制，确保用户在何种情况下都能获得可预测且适应的体验。\n\
  \n## 通过用户自定义赋能个性化\n\n允许用户自定义他们的界面可以显著提高无障碍性。模块化的设计系统为个性化体验创建基础，用户可以根据自己的独特需求调整平台，例如更改字体大小、颜色或布局。个性化的关键在于构建响应式和动态的用户界面，让用户根据其偏好或需求控制字体大小和颜色对比度。\n\
  \n\n\n\n\n灵活的设计必须适用于从桌面电脑到移动手机等不同设备。它应该支持缩放和文本大小调整，且不会丢失功能或破坏界面。跨操作系统的一致性对于构建包容性体验至关重要。这包括跨设备和跨缩放级别的清晰、一致的导航。这一概念涉及\
  \ `WCAG 2.2 成功准则 1.4.10: 重流 (Level AA)`，它指的是网页或应用程序上的内容能够动态适应的能力，通过调整布局、文本大小和位置，使用户在显示尺寸发生变化（例如在移动设备上或放大时）无需水平滚动或过度缩放即可查看并与之交互。\n\
  \n布局是一个至关重要的考虑因素。设计系统应允许客户重新排列区块，并确保内容能够无缝适应各种屏幕尺寸和方向。一个真实的例子是 Webex，它允许用户在会议体验中自定义布局，能够固定他们的手语翻译师、更改舞台视图、隐藏不带视频的参与者等。这让用户能够自定义自己的会议体验，以实现包容性体验（[`blog.webex.com/collaboration/fostering-inclusive-and-accessible-communication-with-webex-suite/`](https://blog.webex.com/collaboration/fostering-inclusive-and-accessible-communication-with-webex-suite/)）。\n\
  \n个性化也延伸到语言和本地化。在全球范围内扩展时，支持语言自定义和本地化至关重要，这可能会影响布局、内容结构和焦点行为。某些语言（例如阿拉伯语）是从右向左阅读的，布局必须相应进行调整。其他语言（如德语）由于单词较长，可能需要更多空间。此外，在本地化内容时保持清晰和一致性非常重要，特别是对于认知障碍用户而言。\n\
  \n## 辅助无障碍的信息架构\n\n在考虑信息架构的同时，也要考虑多模态输入，包括键盘友好的导航系统。对于肢体障碍用户或偏好使用键盘导航的用户，在使用 `Tab`\
  \ 和 `arrow` 键时，请确保所有交互式元素都可以通过键盘访问。这包括修复标签顺序（tab orders）和视觉焦点指示器，为使用键盘和其他输入设备的用户提供无缝体验。\n\
  \n组织标签顺序是有价值的，使其按照逻辑流排列，从上到下或从左到右。页面上所有活动元素（例如按钮和表单字段）都应该清晰地突出，以便用户能够轻松追踪焦点，并在适当的情况下包含键盘快捷键，确保它们有良好的文档说明且可自定义。\n\
  \n查看下图，虽然视觉阅读者能够辨别按钮和信息的层级，并自然地将注意力转向 `Apply Now!`（立即申请！）部分，但对于那些仅使用键盘或依赖屏幕阅读器的人来说，标签焦点顺序将创建一个混乱的体验：\n\
  \n![img](img/Image3897.png)\n\n图 5.5：糟糕的标签焦点顺序示例\n\n然而，在接下来的图中，标签焦点顺序已修复，创建了一个更自然、更易于遵循的模式：\n\
  \n![img](img/Image3905.png)\n\n图 5.6：良好的标签焦点顺序示例\n\n# 总结\n\n在本章中，我们学习了如何通过关注关键的视觉和交互原则来设计无障碍的用户界面。涵盖的主题包括在视觉设计中深思熟虑地使用颜色以确保清晰包容性，以及无障碍设计。\n\
  \n# 6 创建无障碍内容：写作、图像和多媒体\n\n作者：Jennifer Chadwick\n\n人们说内容为王，事实确实如此。信息必须清晰地传达。在本章中，我们将介绍如何创建无障碍内容，特别关注图像和多媒体。\n\
  \n## “媒介即信息”\n\n这是加拿大哲学家马歇尔·麦卢汉（Marshall McLuhan）的一句名言。1964 年，他在书籍《理解媒体：人的延伸》的第一章中提出了这一短语。他的意思是信息的传递方式（媒介）对社会的影响比实际内容（信息）本身更大。那么，残障人士是社会的一部分。如果信息的传递方式排斥了某些人的信息的接收，那么这种“对社会的更大影响”将是负面的。简单来说，如果媒介阻碍了信息，你就有了问题。\n\
  \n麦卢汉的观察在不断发展的数字时代中已经保持了 60 多年的相关性。可以说，这是一种捕捉了包容性内容设计重要性的哲学。我们希望让残障人士成为信息触达的受众。他们的残障不应成为接收的障碍。相反，可以改变媒介，或我们所说的内容格式，来消除这些障碍。\n\
  \n要创建包容性内容，请问自己以下问题：\n\n1.  **内容中传达了什么信息——信息内容是什么？**\n2.  **我选择了什么内容格式来分享这些信息？**\n\
  3.  **我选择的内容格式是否触及了最广泛的受众和/或排除了任何人？**\n\n本章涵盖了以下主要主题：\n\n*   “媒介即信息”\n*   回顾构建包容性内容的关键操作\n\
  *   使不同类型的内容无障碍化\n*   进行需求演练（Needs Walkthrough）练习\n\n\n\n\n接下来，我将建立一些你在日常工作中可以采取的关键行动。这些行动将帮助你通过在内容写作和格式选择中保持**包容性心态**来增强你的技能。\n\
  \n# 回顾构建包容性方法的关键行动\n\n让我们来看一些充实且可操作性的方法，以建立包容性的写作实践。在这里我们将介绍一些更通用的观点，随后我们将介绍针对特定内容的方法。\n\
  \n## 熟悉用户需求\n\n为残障人士创建无障碍的内容，你需要熟悉他们的体验方式。W3C 的 `Web Accessibility Initiative`（`WAI`）网站上有一个名为“多样化能力与障碍”的页面（[www.w3.org/WAI/people-use-web/abilities-barriers](https://www.w3.org/WAI/people-use-web/abilities-barriers)）。\n\
  \n这是一个理解不同残障相关的个人需求和偏好的极佳资源。它提供了人们在工作、学习和购物期间的生动用户故事。\n\n它概述了五类残障类型的数字内容和设计障碍：\n\
  \n*   听觉（例如：聋症、盲聋、听力障碍等）\n*   认知与学习（例如：自闭症、ADHD、记忆丧失、学习障碍等）\n*   身体（例如：行动不便、四肢瘫痪、截肢、癫痫等）\n\
  *   言语（例如：口吃、失语、构音障碍——发音和声音不一致，等）\n*   视觉（例如：盲症、视力有限或低视、盲聋、色觉异常等）\n\n## 记住多种用户体验\n\
  \n内容和用户界面设计师必须记住，他们并不是最终用户。你的个人需求、感知和能力可能与你产品或服务的广泛用户群体有所不同。\n\n主要以自己自己进行设计（特别是如果你没有残障），将不可避免地排除掉一些人的体验。相反，请从万维网联盟（`W3C`）内部\
  \ `WAI` 发布的资源开始。它们是实用且有效的，并直接对应《网页内容无障碍指南》（`WCAG`），该指南是作为全球无障碍法律、法案和法规的基础。\n\n##\
  \ 尽可能从真实用户身上学习\n\n最好的学习方法来自真实的人和他们的生活经验。邀请残障人士与你在项目上进行协作和共同设计。通过采访、问卷、原型演示和小组讨论不断收集终端用户的体验。这种做法是令人兴奋、有效的，并且对每个人都有益的。你将通过观察并询问人们如何做事情、他们如何使用辅助技术和自适应策略来完成任务，来验证你的新知识。直接从人们身上学习也能防止你对“所有盲人用户”或“所有\
  \ ADHD 用户”做出主假设。\n\n如果预算或时间限制无法咨询具有生活经验的人士，请使用 `W3C` 的五类残障类型创建一个清单，并为每种类型创建 1-2\
  \ 个用户场景或任务。\n\n然后，体验与你的内容样本或设计原型交互的体验。用户是否能够在没有困惑或困难的情况下完成任务或体验内容及设计？如果没有，请记录下笔记以改进体验或消除障碍。\n\
  \n## 使用通白语言编写所有内容\n\n国际通用语言联盟表示，“如果内容的用词、结构和设计足够清晰，使得预期的读者可以轻松找到他们需要的、理解他们发现的内容并使用这些信息，那么沟通就是通白语言”（[`www.iplfederation.org/plain-language/`](https://www.iplfederation.org/plain-language/)）。无论你的主题是复杂的（医学术语、技术指令或法律术语）还是简单的（博客文章中的信息）都不重要。使用通白语言写作支持所有水平的阅读理解，以覆盖最广泛的读者。\n\
  \nNielsen Norman Group 是一家领先的用户体验研究和设计专业公司，他们在 2017 年与科学、技术和医学领域的专家进行了一项可用性研究。提出的问题是：通白语言会让高度技术化或学术的内容浅化吗？研究发现，“即使是受过高等教育的在线读者也渴望简洁易于扫描的信息”（[`www.nngroup.com/articles/plain-language-experts/`](https://www.nngroup.com/articles/plain-language-experts/)）。\n\
  \n英国政府也进行了一项研究，发现 80% 的人更倾向于阅读通白语言的内容。Mark Morris 曾是英国卫生部的清晰英语负责人，也是卫生部长之前的撰稿人。在\
  \ 2014 年的一博客中，他创造了一个短语，反映了内容作者接受通白语言写作的演变。“清晰就是王道。”\n\n1994 年，微软联合创始人比尔·盖斯看到了万维网上在线内容创作接触广泛观众的力量。他说：“内容为王道。”现在，最重要的是清晰度。\n\
  \n但你不必成为复杂医学期刊的作者、卫生部的撰稿人，甚至成为比尔·盖斯，也能知道通白语言对所有用户都是有用的。\n\n在章节后后部分，名为 `Text` 的部分，我们将涵盖编写段落、标签和指令的具体通白语言技巧。\n\
  \n## 熟悉障碍和替代方案\n\n你现在掌握了关于残障需求的知识，并准备好应用通白语言原则。但让我们面对现实，某些数字内容媒体（格式）对于具有各种残障和需求的人来说并不天生无障碍。例如，你可能选择用视频呈现新闻故事，但某些视觉障碍人士无法感知屏幕，或完全无法感知。\n\
  \n这意味着你不能再使用视频来传递信息了吗，因为一些人无法体验它？当然不是。使用视频格式，但要确保它配有媒体替代方案，例如转录稿。转录提供了标题、角色描述、口头对话、屏幕上的声音和动作。它是相同的信息，只是获取方式不同。\n\
  \n在本节中，我们了解到如果你选择使用你已知对某些用户无效的内容格式，你必须将其与替代格式相结合，以触达你的其他观众。接下来，我们将深入每种内容类型以及最好的替代方案。\n\
  \n# 让不同类型的内容更具无障碍\n\n`WCAG` 标准围绕四个原则构建，以支持满足终端用户的需求。前三个是：\n\n1.  感知（Perception）：“我可以访问内容，识别它是什么、是什么意思以及对它做什么——而没有任何障碍。”\n\
  2.  理解（Understanding）：“清楚地理解内容的目的、信息或指令，足以采取行动。”\n3.  操作（Operability）：“我可以根据内容中提供的标签或指令完成操作。”\n\
  \n对于好奇的人，第四个原则是健壮性（Robust）：“该网站或应用程序可以被各种用户代理解释，包括人们使用的辅助技术，如屏幕阅读器、键盘、切换控制、语音命令等。”然而，这主要与代码和实现有关，我们在这里不考虑这些。\n\
  \n在接下来的章节中，我们将查看不同类型的内容，并研究哪些替代方案效果最好。\n\n\n\n\n文本是一种通用的内容媒介，且通常是最易获取的。视觉障碍、学习困难、记忆丧失和/或注意力缺陷障碍的用户使用屏幕阅读器软件来读取页面上的内容。文本可以被屏幕阅读器（如\
  \ `JAWS`、`NVDA`、`VoiceOver` 和 `Narrator`）以及软件内置的其他阅读工具解析，不会出现问题。当 PDF 保存得当时，内部的文本也可以被相同的工具解析。\n\
  \n文本具有告知、指示和识别的功能。文本属于“感知”原则，因为用户可以通过视觉或使用屏幕阅读器软件来访问并感知文本。\n\n在接下来的章节中，我们将介绍如何通过“扫描性”使文本更具无障碍性，以及提供通俗语言的其他原则。\n\
  \n## 让页面易于扫描\n\n2008 年，尼尔森诺曼集团（NN/g）对网页进行了一项眼动用户研究（[`www.nngroup.com/articles/how-little-do-users-read/`](https://www.nngroup.com/articles/how-little-do-users-read/)）。他们发现，在平均一个网页上，用户在平均访问期间最多只有时间阅读\
  \ 28%的单词；20%的情况更为常见。\n\n在 NN/g  2010 年关于移动端的另一项研究（[`nngroup.com/articles/mobile-content-is-twice-as-difficult-2011`](https://nngroup.com/articles/mobile-content-is-twice-as-difficult-2011)）中，阿尔伯塔大学的研究人员发现，当内容显示在移动屏幕而非较大的电脑屏幕上时，阅读理解能力会下降。对这一结果的简单解释是：由于屏幕较小，用户在任何给定时间内看到的文本较少，因此他们必须更多依赖记忆来获取阅读所需的上下文信息。换句话之，较小的屏幕导致了更高的工作记忆负载。人们无法维持这种高负载，因此他们的理解力受到了影响。\n\
  \n正如此，你可以通过提供精确且简洁的内容为所有人优化体验。为了帮助你的内容更易扫描，特别是对于有认知需求、学习障碍或视力低的人，请考虑以下关于文本格式的建议。\n\
  \n### 标题\n\n标题的目的是介绍其下方的相关内容。\n\n对于你的网页，请创建一个带有标题的嵌套结构，以介绍每个内容区域。定义主标题的主题，然后使用与你的观点相关的子标题将其“嵌套”在下方。前端开发人员将使用\
  \ HTML 标题标签来创建你的嵌套结构。\n\n例如，你的主标题将是 `heading Level 1`。从那里开始，文档或页面可以有多个 Level 2 的子标题，在每个这些标题下方，是\
  \ Level 3 的子标题，依此类推。\n\n将内容分成定义清晰的部分使其更易扫描。\n\n屏幕阅读器用户可以按快捷键跳转到内容（标题、链接、图形、表格等）。在这种情况下，按下\
  \ `H` 键会宣布每个标题。\n\n记住不要过度使用标题。视觉障碍或学习困难的用户可能使用语音转语音软件（屏幕阅读器）来解析屏幕上的内容并理解页面的结构。过度使用标题会导致困惑，因此请确保只在相关时才包含它们。\n\
  \n### 段落\n\n在编写段落内容时，使用清晰、简洁的语言至关重要。同时，考虑将段落长度保持在四五个句子。\n\n将文本拆分成短段落被称为“块化”（chunking）。这使得用户在视线向下移动页面或使用屏幕阅读器时（因为语音输出会在每个段落后停顿）更易于扫描文本。它避免了可怕的“文本墙”，后者会让人无从从心。它减少了眼部疲劳以及认知过载。它改善了认知障碍人士、记忆障碍人士或任何处理多任务的人的语言处理能力。\n\
  \n避免使用 `ALL CAPS`。对于视觉用户来说，使用全大写字母写文本看起来就像在大喊叫。屏幕阅读器无法识别文本的强调，因此对非视觉用户来说，这种影响也消失了。此外，全大写文本减少了单词的独特形状，使得阅读症患者更难快速识别和处理它们。\n\
  \n### 无序列表和有序列表\n\n无序列表和有序列表通过使内容更易阅读和导航来提高无障碍性，特别是对于使用屏幕阅读器的人（因为它会宣布内容是一个列表）、有认知障碍的人以及从结构化信息中获益的个人。\n\
  \n使用列表有助于将复杂的想法分解为易理解的要点——然而，当项目不需要特定顺序时，使用无序列表；在提供序列（如指令）时，使用有序列表。\n\n### 导航菜单和按钮标签\n\
  \n导航菜单通常是结构化的链接集。因此，你的链接文本应该是目标页面的清晰描述，例如“关于我们”、“我们的服务”或“[产品]如何工作”。但有时，导航菜单也会使用按钮。\n\
  \n保持这些菜单链接和按钮标签清晰简洁。这对于所有用户理解网站、移动应用或文档的结构至关重要。\n\n模糊或过度复杂的标签可能会让所有用户感到困惑，特别是对于有认知障碍的用户和依赖屏幕阅读器输出的非视觉用户。按钮上的标签和链接文本应该立即告诉用户控件的作用、工作原理以及预期的结果。\n\
  \n为了提供帮助，请使用通俗易懂的描述性标签，并避免专业术语。例如，虽然“获取联系”很常见，但请用“联系我们”。这将优化理解并消除对该链接或按钮将他们带向何处产生疑问。\n\
  \n### 导航地标和菜单链接\n\n理想情况下，页面使用地标（或区域）构建以定义其结构。地标包括 `header`、`footer`、`main body`\
  \ 以及导航菜单所在的 `navigation`。\n\n开发人员实现代码，让屏幕阅读器宣布地标类型。然而，如果一个页面有两个导航菜单，你的职责是写一个简短描述来区分它们。例如，“全局导航菜单”和“北美服务菜单”。\n\
  \n### 链接\n\n你可能会在段落的句子中使用链接。这为用户提供了快速访问另一个页面并获取更多信息的方法。在这种情况下，不要使用“点击此处”或“了解更多”作为句子中的链接文本。\n\
  \n首先，并非所有用户都用鼠标点击。而且，屏幕阅读器用户可能会使用快捷功能提取页面上所有链接的列表。这使他们离开了句子的语境，因此如果你在页面到处使用“了解更多”等通用术语，用户只会听到一长串“了解更多”链接，而无法区分它们之间的区别。相反，通过使用描述句子或段落主题的词来创建链接。例如，在句子“了解更多关于我们的无障碍功能”中，将“无障碍功能”一词设置为链接，或将整个句子设为链接。\n\
  \n\n\n\n根据链接指南，如果可能，请避免使用“点击此处”或“了解更多”作为按钮标签。如果必须这样做，你必须为屏幕阅读器用户提供一个扩展但简洁的描述——例如，使用\
  \ `aria-label` “了解更多关于一级牙科计划”。或使用 `aria-labelledby`，它使用屏幕上现有的内容（如标题）。\n\n## 表单字段标签和说明\n\
  \n在创建表单时，你希望确保表单本身具有描述，并且表单字段标签和说明尽可能具有访问性。以下是创建标签的一些最佳实践：\n\n- 表单本身应该有一个名称或描述，例如“2025\
  \ 年演员试镜表”。开发者将通过使用 `aria-label` 或 `aria-labelledby` 为屏幕阅读器用户包含此内容。\n- 表单字段标签应该是简洁、具体的，并放置在输入字段附近。\n\
  - 使用章节和标题逻辑清晰地组织信息。作为作者，你可以与 UX/UI 设计师合作确定结构。\n- 使用星号（`*`）清晰指示必填字段，并确保开发者使用 `aria-required`\
  \ 对表单字段进行编码，以便屏幕阅读器用户能听到“必填”一词。相反，如果大多数表单字段都是必填的，过多的星号会让人崩溃。在这种情况下，写一条说明：“除非标记为可选，否则所有字段均为必填”。\n\
  - 在相关字段旁边显示清晰、具体的错误信息。在用户继续填写表单之前，描述需要纠正和执行的具体操作。\n- 理想情况下，将预期的输入格式放在你的标签中（例如，日期使用\
  \ MM/DD/YYYY）。屏幕阅读器会同时读取标签和格式说明。这有助于低视力用户使用屏幕放大镜进行放大——他们可以一眼看到所有内容。\n- 导入格式（MM/DD/YYYY）也可以作为辅助文本放置在字段下方，并通过\
  \ `aria-describedby` 向屏幕阅读器用户读取。\n- 不要将重要的说明放在占位符文本（placeholder text）中。确保说明和格式提示（例如\
  \ MM/DD/YYYY）是标签的一部分。\n\n以下是关于说明性文本的一些最佳实践：\n\n- 使用简单、熟悉的语言，避免术语和复杂的措辞。\n- 说明应用主动语态书写，清晰地指导需要采取的行动以及这些行动的顺序。\n\
  - 确保基本用户信息放在表单开始之前，例如，“您必须满 18 岁才能申请此信用卡”。\n\n## 使用标题将相关表单输入分组\n\n在视觉和程序上对在主题上相关的字段进行分组，例如将姓名字段与地址字段区分开。这有助于将长表单拆分为更易理解的部分。\n\
  \n## 数据表格\n\n使用数据表格时，请考虑以下最佳实践：\n\n- 确保表格用于表格化数据，而不仅仅是为了构建页面布局。\n- 提供列头和行头以提高清晰度。\n\
  - 避免合并或拆分单元格，这可能会干扰屏幕阅读器。\n- 提供 CSV 或 Excel 下载作为替代访问方式。\n- 提供替代文本（alt text）来描述表格中的任何说明性图像或\
  \ SVG 文件。如果图像或 SVG 仅起装饰作用且并非数据必要的一部分，则它们不应有替代文本。`alt` 属性保持为空，中间没有空格，即 `alt=\"\"\
  `。\n- 对按钮、切换、菜单、列表和信息图标等交互式控件使用标签，就像在表格之外使用这些项目一样。\n\n还有一些你不需要负责的代码和视觉设计实践，但它们可以支持数据表格中的内容。在与开发者和设计师合作时，提醒他们执行以下操作：\n\
  \n- 对表格进行编码，以确保表格可以通过键盘导航并兼容屏幕阅读器。\n- 创建具有交替行颜色的视觉样式以提高可读性。\n\n这些最佳实践支持盲障人士，因为屏幕阅读器软件会在用户移动到新列的每个单元格时，通过宣布列头来解析表格。这确保了用户不会迷失，并且数据关系是完整的。\n\
  \n一些低视力用户使用放大软件缩放屏幕，最高可达 800%。一个包含所有信息的简洁表格是有益的。他们不需要翻遍页面来寻找信息。对于学习困难的用户，有时识别表格中的关系可能比阅读文本段落更容易。\n\
  \n如前所述，某些最佳实践涉及表格本身的设计和编码，这是视觉 UI 设计师和开发者的责任。然而，作为内容创作者，你完全可以选择格式（在这种情况下为表格）。因此，熟悉最佳实践以及视觉呈现、样式和代码实现如何影响某些残障的用户是非常重要的。\n\
  \n## 文本的通俗语言原则\n\n到目前为止，我们讨论了页面或屏幕上文本的格式，以便于扫描。现在让我们讨论你如何编写文本本身并传递信息。\n\n### 在句子开头使用主语\n\
  \n从新闻业早期开始，新闻报道的第一句应该回答核心的 5 个 W——谁（who）、什么（what）、什么时候（when）、在哪里（where）和为什么（why）。首先介绍你的主体和话题，并在句末得出观点。这样，从一开始背景就很清晰。\n\
  \n### 保持简洁\n\nSteve Krug 在 2001 年的《不要让我思考》（*Don’t Make Me Think*）中强调了在写作以及说明和标签中使用简单语言的重要性。这样，用户就不必思考——花费精神精力去破解你的标签或内容的含义。\n\
  \n他的另一个关键指导是“删掉每页一半的词，然后再删掉一半。”通过切中要点的句子和简洁性，你可以用最少的词表达你想说的所有内容。\n\n### 使用主动语态书写\n\
  \n在写作时，使用主动动词而非被动动词：\n\n- 被动动词是指句子的主语被执行动作。例如：“自从 10 年前进入市场以来，几个慈善机构一直受到公司的支持。”\n\
  - 主动动词是指句子的主语执行动作。例如：“公司支持几个慈善机构。它从 10 年前开始支持，并继续帮助儿童。”\n\n如你所见，主动语态对读者来说更清晰、更有吸引力。\n\
  \n### 使用简单的词汇\n\n根据 2023 年的一项调查，51%的加拿大人人处于阅读 3 级及以上——即通用识字水平。然而，19%的加拿大人人得分在 1\
  \ 级或以下。\n\n\n\n\n\n根据这些统计数据，当可以使用更简单的词时，请不要使用复杂的词。在你的语言中使用最简单的术语将让你的内容触及更广泛的受众。\n\
  \n## 使用可读性工具\n\n在写作时，可以使用在线工具，例如 Hemingway App ([`hemingwayapp.com`](https://hemingwayapp.com))。它会根据学术年级对你的文本进行可读性扫描。目标是达到小学\
  \ 6 年级的阅读理解水平或更低（基于北美学校体系）。此外，Grammarly ([`www.grammarly.com/`](https://www.grammarly.com/))\
  \ 是一款著名的基于 AI 的工具，它可以插件到 MS Word 等其他程序中，扫描并为通俗语言提供语法修正和建议。\n\n## 文本的格式组合\n\n切记组合内容格式，以确保不同需求的用户都能获取内容。例如，如果你使用数据表格，请在通俗语言的段落中包含相同的信息，并解释数据之间的关系——这是理解相同内容的两种方式。\n\
  \n在接在本章的后续内容中，你将看到文本如何与图像、视频和音频相结合。\n\n让我们通过提醒马歇尔·麦卢汉的话来结束关于文本的讨论：“媒介即信息”。保持你传达的信息在文本上平实简单。这样，它就能被感知、理解和操作。\n\
  \n## 图像\n\n让我们看看设计师可能使用的、你可能与他们合作的不同类型的图像。某些图像类型包含文字和图形，以传达意义。\n\n在此之前，了解为什么、何时以及如何为视觉内容（如图像和图标）使用替代文本至关重要。\n\
  \n### 图像类型\n\n涉及到图像时，我们可以将其分为四类：\n\n*   **装饰性图像**：仅起纯粹的美学作用，不添加任何有意义的内容，例如网站上的花卉背景图案。这些图像不需要替代文本。开发者会保留\
  \ `alt` 属性，但它必须为空且不含空格，像这样（`alt=\"\"`）。这意味着屏幕阅读器会忽略它们，防止对视觉受障用户产生不必要的干扰。\n*   **信息性图像**：指内部包含有意义的内容或信息的图像。常见的例子是食谱网站上的分步骤照片或插图，展示如何从零开始制作蛋糕。这些图像的目的是以视觉形式传递信息。它们需要替代文本来为视盲用户描述。页面或屏幕上可能存在与图像相关的文本，但\
  \ alt 文本仍应准确描述图像中的内容。此外，alt 文本不应简单重复周围表达相同含义的文本。\n*   **功能性图像**：用于触发操作而非传递信息的图像。它们被用于按钮、链接、图标和其他交互元素。因此，alt\
  \ 文本应该描述功能，而不是图像本身——例如，打印按钮只使用打印图标来在视觉上传达其目的。它的 alt 文本应该是“打印”而不是“打印机”。同样，搜索图标是按钮的功能性图像，标签为“搜索”而不是“放大镜”。\n\
  *   **复杂性图像**：提供大量详细且有时是相互关联的信息或数据点的信息性图像。这些图像绝对不仅仅是装饰性的。数据通常以高度视觉化的形式显示，如饼图、柱状图、图表或信息图。文本中可能混合了颜色编码的线条、符号和形状。在这种情况下，信息是以非线性方式呈现的，这使得屏幕阅读器难以导航并以有意义的顺序向视觉受障用户分享信息。\n\
  \n让我们仔细看看 alt 文本以及它为什么很重要。我们还将查看为什么我们应该避免在图像中使用文字。\n\n### 利用 alt 文本\n\n与设计师合作时，你可以选择图像、照片或插图来配你的写作作品。但如果你确实使用了它们，作为内容创作者，你的职责是转化它们的主题、目的情感，以支持盲人、视力有限以及/或可能使用屏幕阅读器向他们传达图像意义的人士。\n\
  \n替代文本，简称为“alt 文本”，是网页、移动应用程序和文档中非文本内容的文本替代。有效的 alt 文本应该是有意义的，并描述图像、动画或视频及其主题和动作。\n\
  \n如果你没有在 `HTML` 中为 `alt` 标签提供内容，屏幕阅读器将宣布图像文件名（可能是一串残酷的数字和字母！）或者什么都不说——只说“图像”。这只会告诉用户他们在屏幕上遇到了图像。\n\
  \n关于 alt 文本，这里有一些考虑因素：\n\n*   使用替代文本简洁地描述有意义的图像。\n*   通过说明文字或链接文本为复杂图像提供详细描述。\n\
  *   确保文本替代传达与图像相同的信息。\n*   要求开发者妥善标记装饰性图像，以避免对屏幕阅读器用户产生不必要的干扰。这意味着你不会添加替代文本，因为没有必要。\n\
  *   如果页面上的文本提供了图像足够的信息，请将图像标记为装饰性。但如果图像有自己的意义，请添加 alt 文本。\n\n有一种误解认为所有图像都需要描述，但内容作者的优势在于判断何时需要以及何时不需要。装饰性图像如果为了演示风格提供视觉效果，就不需要\
  \ alt 文本。W alt 决策树（WAI alt Decision Tree）是内容作者常用的流行工具。它提供了一系列是否问题，帮助你决定图像是否需要 alt\
  \ 文本：[`www.w3.org/WAI/images/decision-tree/`](https://www.w3.org/WAI/images/decision-tree/)。\n\
  \n### 图表\n\n图形和图表属于复杂图像，因此需要 alt 文本。这里有一些具体的考虑因素：\n\n*   提供关键洞察和数据关系的文本摘要。这有助于无法仅通过图表进行解读和分析的屏幕阅读器用户。\n\
  *   标记轴和数据点，以便清楚图表显示的内容。最终，这对所有人都有益！\n*   提供替代的数据视图——例如，以表格形式呈现相同的信息。正如所讨论的，有认知需求的人有时更倾向于关系清晰的数据表格。这比图表上的多线条和颜色编码视觉效果更容易理解。\n\
  \n### 图标\n\n图标具有独特的视觉性，如果使用通用图标，可以让你的目标观众立即识别你选择的主题。例如，帮助图标通常是一个问号，而搜索图标通常是一个放大镜。\n\
  \n有趣的是，图标通常没有可见的文本标签。设计设计如此的，但最具包容性的方法是将图标与供屏幕阅读器读取的文本标签相结合。\n\n现在，请记住标签应该描述图标的功能，而不是对图标本身的描述。正如提到的，如果你使用放大镜图标，alt\
  \ 应该是“搜索”（而不是“放大镜”）。\n\n这里是一些通用的图标以及建议的 alt 文本：\n\n*   放大镜图标：搜索输入框的“搜索”\n*   购物车图标：交易流程中的“购物车”或“查看购物车”\n\
  *   房屋图标：返回主页的链接或按钮的“首页”\n\n\n\n\n\n*   信封图标：“电子邮件地址”或“联系我们”，用于链接或按钮，可打开电子邮件客户端或将用户引导至带有联系表单的网页。\n\
  *   电话图标：“拨打我们”，位于电话号码链接旁，点击可拨起移动电话通话。\n*   打印机图标：“打印此页”，位于按钮上，点击可启动浏览器的原生打印功能。\n\
  *   下载箭头图标：“下载 [file name]”，作为按钮使用或位于链接旁，用于在桌面端或移动设备上启动下载。\n*   垃圾桶图标：“删除”或“移除”，位于按钮上或链接旁，点击可启动此功能。\n\
  *   用户资料图标：“个人资料”或“账户设置”，位于按钮上或链接旁，用于打开包含个人信息和/或账户设置的新页面或弹出窗口。\n*   齿轮或扳手图标：“设置”，位于按钮上或链接旁，点击可启动页面或弹出窗口以更改网站或\
  \ Web 应用程序内的设置，或调用原生应用设置。\n\n尽可能在图标旁边添加文本标签，并鼓励视觉设计师在页面或屏幕上留出此空间。这种做法支持所有用户，特别是视力低、有学习困难和神经多样性的人群。\n\
  \n有时，设计师会将图标放在文本链接前面，使其在页面上更醒目，或提供清晰的视觉指示。一个很好的例子是在电子邮件链接旁边放置电子邮件图标。只要链接文本具有描述性，并对其目的或目的地有明确意义，就无需为图标添加替代文本（alt\
  \ text）。可以仅将其定义为装饰性。\n\n例外情况是设计师放在链接之前或之后的图标，用于指示该链接将在新的浏览器窗口或标签页中打开页面。这种图标是信息性图像，而不是装饰性的。图标需要替代文本，以便视障用户感知到链接打开了新窗口。使用\
  \ `alt=\"opens new window\"` 来实现此操作。或者，图像可以是装饰性的，而链接本身可以带有 `aria-label` 属性，并包含可见的文本。例如，如果可见标签为“了解更多”，代码可以是\
  \ `aria-label=\"Learn more about Mortgages. Opens new window.\"`。\n\n## 避免在图像中使用文字\n\
  \n我们已经讨论了替代文本的重要性，但让我们考虑另一个图像-文本问题：图像中的文字无法被屏幕阅读器软件解析，因此对于视障用户来说它完全丢失了。\n\n例如，横幅广告是糟糕的设计。它们包含大量文字，这些文字通常被挤在有限的布局中，导致字体较小且难以阅读，尤其是对于视力低的人群来说。对于页面、移动屏幕或文档上的所有内容，请与\
  \ UI 设计师合作，告知他们避免使用嵌入文字的图像。\n\n相反，请在页面上使用真实文本，并与 UI 设计师合作在下方创建一张背景图。对于文本，要求他们使用\
  \ Arial 或 Verdana 等系统字体，以获得最佳的可读性。\n\n## 图像的格式组合\n\n如果你使用图像，请确保已准备好相应的替代方案以提高可访问性：\n\
  \n*   如果你使用图像，请确保也提供了替代文本，或确保装饰性图像被辅助技术妥善隐藏。\n*   如果你使用图标，请确保其配有替代文本或可见标签。如果你使用非装饰性的独立图标，请确保它有适当的替代文本。或者使用相邻的可见标签（如链接）并将图标视为装饰性。\n\
  *   如果你使用复杂的图像（饼图、柱状图、流程图或带有文字和图像的信息图），请提取文本并以纯语言描述进行格式化。将此文本放置在信息图旁边。\n*   如果你使用数据表格，考虑以纯语言段落的形式共享相同的信息。\n\
  \n总结一下，请记住，只要图像与为视障人士提供的描述相结合，它们就是强大的工具。混合使用图像和文本也有利于有学习障碍或神经多样性的人群。他们不会被成堆的文字墙或缺乏清晰文本信息的过多视觉图像所轰炸。\n\
  \n## 视频和音频\n\n涉及视频和音频内容——本质上任何主要的、捕捉故事的视觉动态图像内容——这里有一些通用最佳实践：\n\n*   为口语内容提供字幕和转录稿\n\
  *   为视觉元素提供音频描述\n*   使用清晰的音频并避免背景噪音\n*   确保视觉效果的高对比度\n*   确保多媒体控制控件可以通过键盘访问\n\n\
  这些做法支持听力障碍或聋哑、盲、、视力低、记忆丧失、学习困难或具有神经多样性（ADHD、自闭症）的用户。\n\n为了深入研究，让我们关注提到的两个点——字幕和转录稿。\n\
  \n### 字式字幕 (Closed captions)\n\n字幕是视频上的文本叠加，显示由音频传达的内容——例如口语对话以及屏幕内外的重要声音。它们是视频内容最关键的媒体替代，因为它们是音频的替代。\n\
  \n字幕有两种类型：开放式（open）和关闭式（closed）。开放式字幕在视频上始终可见，而关闭式字幕可以由观众在视频播放器中开启或关闭。由于这个原因，出于访问性最好使用关闭式字幕，并且你应该始终准备好。然而，在视频中使用文本标题很重要，特别是在开始时介绍主题，并让演讲者的姓名和标题出现在屏幕上。\n\
  \n以下是优化字幕对聋人或听力障碍人士影响的最佳实践。同样，暂时无法听到声音的人也将从中获益：\n\n*   字幕应精确匹配口语对话和音效。\n*   字幕应明确指示是谁在说话，特别是在小组对话中。首次出现时使用全名，如果屏幕空间有限，则通过名字引用这些人。\n\
  *   字幕应包含相关的非语言音频（例如`[掌声]、[门吱呀声]`）。\n*   保持字幕简洁，限制每行文字（最好最多 32 个字符），并在自然停顿处断行。\n\
  *   如有需要提供翻译以提高可访问性。\n*   如果你使用软件平台或 YouTube Studio 管理你的视频内容和字幕，你将控制这些。确保字幕与语音同步，并为阅读留出足够的时长。\n\
  *   软件平台可以为你自动生成字幕，YouTube Studio 也拥有这项免费功能。然而，其准确率认为在 70% 到 80%。始终进行校对和编辑以确保清晰准确。\n\
  \n### 转录稿 (Text transcripts)\n\n字幕出现在视频屏幕上，而转录稿是作为独立文本文档提供的文字版本。文字包含了字幕中的内容——音频描述、口语对话和重要声音——但还应包括从开始到结束屏幕上发生的情况，以便视频中视觉传达的任何信息都不会遗漏。\n\
  \n\n\n\n\n*   请确保你详细描述开场场景、标题和出现的文本，然后对发言者、物体和动作进行描述。如果需要，请包含对故事至关重要的幕外动作或声音。\n\
  *   与字幕一样，在对话开始前加上说话者的全名。如果需要，在转录稿的其余部分你可以仅提他们的首名。\n*   包含相关的音效、音乐提示和重要的背景噪音（例如：`[laughter]`、`[phone\
  \ ringing]`）。\n*   将文本分段段落，在需要时使用时间戳（如果需要），并保持可读性。\n*   在发布之前，确保语法正确、标点符号规范且表达清晰。\n\
  *   提供基于文本的格式（例如 `.txt`、`.doc` 或 `HTML`），以便索引和无障碍访问。\n*   提供可下载的版本（例如纯文本、`PDF`）以增加灵活性。\n\
  \n## 手语\n\n根据加州大学的某分校的研究（[`mayberrylab.ucsd.edu/papers/Chamberlain%26Mayberry08.pdf`](https://mayberrylab.ucsd.edu/papers/Chamberlain%26Mayberry08.pdf)），手语而非文字英语，是许多听障用户的母语言。阅读字幕意味着瞬间切换到一种具有不同语法和语序的第二语言。在\
  \ Yoon & Kim 于 2011 年进行的针对 62 名以手语为母语成年人的在线实验中（[`www.researchgate.net/publication/51669191`](https://www.researchgate.net/publication/51669191)），字幕提高了理解力，但并没有减轻心理负担。手语视频仍然更受青。\n\
  \n因此，如果可能，请考虑在你的预录视频中提供手语。在你所在的地区寻找提供手语翻译的机构（全球有 300 多种手语）。他们会录制手语片段并将其嵌入视频输出中。\n\
  \n## 视频和音频的格式组合\n\n如果你选择视频、动画或电影格式，请确保你已经准备好了替代方案：\n\n*   如果你使用视频，请包含可以在视频播放器中开启、关闭并控制的闭式字幕。包含一份带有音频描述的文本转录稿。\n\
  *   创建一个带有嵌入音频描述的独立视频。\n*   如果你使用音频片段，请包含一份文本转录稿。\n*   如果你使用播放时间超过三秒的动画，请包含一份描述目的、动作和任何声音的文本转录稿。反复闪烁超过\
  \ 3 秒的闪烁元素可能会导致光敏感性癫痫。\n*   如果你使用动画 `GIF`，与静态图像一样，请包含有意义的替代文本（alt text）。\n\n总结，视频和音频是内容的强大格式，但这些格式排除了具有特定需求和残障的人。因此，请始终以字幕、转录稿以及视频音频文件标题的形式提供文本替代。\n\
  \n## 社交媒体\n\n社交媒体是指人们在线通信和创建社区使用的音频、视频、文本、图像、图标、插图和其他任何媒体格式。其意图是分享观点或想法，或推广你的故事、信息或消息。发布内容的社交媒体平台包括\
  \ `YouTube`、`TikTok`、`Facebook`、`X`（原 Twitter）、`LinkedIn`、`Snapchat` 和 `Reddit`。\n\
  \n作为内容创作者，这里是准备社交媒体内容的一些无障碍最佳实践：\n\n*   在编写文本帖子时，将多单词标签的每个单词字母大写（例如，使用 `#AccessibleDesign`\
  \ 而不是 `#accessibledesign`）。\n*   尽可能为非文本内容（如图像和 `GIFs`）提供描述性的替代文本。某些 `CMS` 平台没有内置此功能——与人员讨论更新此项内容。\n\
  *   在编写帖子时，避免过度使用表情符号或特殊字符。这是因为表情符号附带替代文本，这可能会导致不准确。例如，两手合十的表情通常用于表示感谢，但实际上是在描绘祈祷——这可能会导致你的文字语境在说“谢谢”，但表情符号的替代文本却写着“祈祷”。此外，表情符号的替代文本可能非常字面。例如，茄子表情的替代文本将是“茄子”，但这个表情被用来表示完全不同的东西。\n\
  *   保持你发布的消息简洁且有结构化。\n*   提供视频字幕和转录稿。\n\n再次，应用为不同用户提供内容替代的原则。这些最佳实践支持盲人、低视者、学习困难和神经多样性（`ADHD`、自闭症）人士，以及听障和听力障碍人士。\n\
  \n作为总结，在设计在线内容发布时，应用考虑多个用户的原则。记住不同的用户将如何体验你的信息。提供多样化的内容格式显示了你对他们需求的考虑。\n\n接下来，让我们两个两个最佳内容实践的案例研究。\n\
  \n## 快速案例研究\n\n这里有两个关于处理文本和图像的场景示例。这两者都探索了内容作者的视角，但也提供了用户在体验内容时的视角。\n\n### 案例研究\
  \ 1：制作信息图的内容作者 Sarah\n\n#### 内容作者的视角\n\nSarah 是一位内容创作者，她正在设计一张关于气候变化影响的信息图。与她合作的\
  \ `UI` 设计师提供了一些图形（人物和云的图标、饼图和统计数据，以及显示天气降水循环的箭头）。Sarah 想要确保非视力用户可以获取与视力用户相同的信息。\n\
  \n以下是她可能面临的一些挑战：\n\n*   信息图具有高度的视觉化特征，依赖于图表、图像和图标\n*   盲人依赖屏幕阅读器，它无法解释视觉元素\n*  \
  \ 如果没有适当的无障碍措施，重要数据可能会丢失\n\n现在让我们看看 Sarah 如何让信息图更具无障碍性：\n\n*   Sarah 可以编写详细的替代文本，来总结信息图的要点——例如：“这张信息图解释了气候变化的五个主要影响：温度升高、冰川融化、极端天气、水位上升和生物多样性丢失。每个部分都包含一个数据和一个相关的图标。”\n\
  *   在信息图下方，Sarah 还可以提供所有内容的文本版本。在这种情况下，她可以写道：“标题：气候变化影响。1. 温度升高——自工业化以来全球温度上升了 1.2℃。2.\
  \ 冰川融化——北极冰每缩小了 13%。3. 极端天气——飓风、干旱和火灾更加频繁。4. 海平面上升——沿海城市面临水位上升的风险。5. 生物多样性丢失——许多物种因栖息地破坏而面临灭绝。”\n\
  *   Sarah 还可以为信息图提供可下载的纯文本或结构化 PDF 版本，以供偏好替代格式的用户使用。\n\n#### 用户视角\n\n在这种情况下，用户是盲人，并使用屏幕阅读器导航网页。当他们带有屏幕阅读器语音输出导航页面时，他们按下方向键并落到信息图（一个\
  \ `.png` 文件）上。\n\n首先，屏幕阅读器会宣布“图像”，然后读取 Sarah 创建并编码到图像中的简短详细替代文本。这让盲人用户了解他们遇到了什么（图像）以及该内容目的简要摘要。接下来，用户按下方向键继续导航页面。他们落在一个可折叠的内容部分（手风琴）上，该部分有一个\
  \ Sarah 提供的标题（“气候变化影响”），并通过用于展开和折叠的按钮运行。屏幕阅读器宣布：“按钮。气候变化影响。已折叠。”\n\n\n\n\n\n通过遵循这些步骤，Sarah\
  \ 确保了盲障用户也能访问信息图的内容。这提高了包容性、用户体验以及对无障碍标准的遵循情况。\n\n## 案例 2：Kavana，网站上的按钮标签\n\n###\
  \ 内容作者视角\nKavana 是一家零售公司网站的内容作者。该公司有几个职位空缺，因此他们想在首页上添加一个呼吁行动（CTA）按钮，引导用户进入招聘网站的落地页。Kavana\
  \ 一直读 Steve Krug 写的《别让我思考》（Don’t Make Me Think）。书中有一个包含三个按钮示例的插图，每个按钮都有不同的标签。顶部有一个从“直观”（Obvious）到“需要思考”（Requires\
  \ Thought）的刻度。一个代表网站用户的男人正看着每个按钮，试图决定选择哪一个。\n\n在刻度的“直观”端，按钮标签显示为“工作”（Jobs）。第二个按钮标签位于中间，“就业机会”（Employment\
  \ Opportunities）。第三个按钮标签位于刻度的“需要思考”一端，写着“工作大观”（Job-o-rama）。Kavana 想在标签的措辞上做一个包容性的选择。最终，她选择了“工作”。\n\
  \n### 用户视角\nKavana 开始思考用户将如何理解和解释她选择的标签。\n\n“工作”是对按钮/链接及其目的地最简单、最清晰的描述性标签。“就业机会”这个标签对于按钮标签设计来说有点长，而且在这个特定页面上占据了空间。用户需要花费更多毫秒来计算含义，并得出这个按钮也必然引导他们进入工作页面的结论。\n\
  \n使用“工作大观”标签，用户被迫找出按钮的目的或目的地。它可能是工作，也可能是其他什么。什么是“-o-rama”？这指的是什么？非英语母语者可能无法理解。用户会问自己：这个按钮是带我带往一个职位列表网页，还是一个叫“Job-o-rama”的活动？在用户采取行动之前，会花费太多时间。\n\
  \n这两个例子让我们洞察了内容作者和终端用户的决策过程。在最后部分，我将分享一个你可以做的练习，用以收集案例研究和场景。这将加强你一致性且具包容性的写作实践。\n\
  \n# 开展“需求走演”练习\n\n“需求走演”（Needs Walkthrough）练习是一项你可以随时进行的活动，用于针对五种不同类型的残障需求测试你的内容想法或原型。目标是深入思考残障用户的需求，并确保你的内容满足了这些需求。这让你对自己的工作具有无障碍性和包容性更有认知和信心。\n\
  \n练习本身完全是低保真的（low-fi），通常不需要任何费用，除了时间。你可以独自进行，也可以与团队一起进行，只需共同审查内容并询问：这符合人们的需求吗？如果你想直接接触真实用户，任何相关费用将用于补偿残障人士在初步用户访谈中花费的时间。\n\
  \n让我们看看如何准备和完成这项练习。\n\n## 步骤 1：收集障碍需求列表\n如果可能，直接从残障人士那里收集用户体验和障碍需求。使用 `Google Forms`\
  \ 发送调查问，或让他们在 `Word` 文档中回答问题。或者，通过 `Zoom`、`Google Meet` 或 `Microsoft Teams` 等无障碍视频平台安排一对一或小组访谈。这些平台内置了实时字幕，可以为听力障碍的人士显示。\n\
  \n如果选择采访方法，你有两个选项：\n\n* **选项 1 – 仅收集通用用户需求**：保持采访的开放性和对话式形式。通过询问某人使用什么类型的辅助技术、如何以及何时使用它们、哪些设计对他们最有效以及哪些设计造成了障碍来主持采访。`Fable\
  \ Tech Labs` 将企业与使用辅助技术的社区连接起来，并为他们测试产品。Fable 提供了两个非常有帮助的文章：规划你的用户访谈) 和 你在采访中应该问的\
  \ 5 个问题)。视频结束后结束后你可以回顾会议录像和文本记录以供后参考。\n\n* **选项 2 – 利用采访进行走演练习**：第二个选项是在视频访谈期间从人们那里收集通用用户需求，同时也利用这段时间让他们和你一起走一遍用户旅程/原型。对优缺点获得即时反馈。在\
  \ `步骤 2 到 4` 中查看练习的完整细节。\n\n如果你无法联系到真实用户，`W3C 多样障碍与能力`网页（[`www.w3.org/WAI/people-use-web/abilities-barriers/`](https://www.w3.org/WAI/people-use-web/abilities-barriers/))\
  \ 是一个很好的替代方案。它提供了五种残障类型及其在使用数字产品时的需求和偏好列表。\n\n在回顾这些之后，阅读网络用户的故事) 并以此作为练习的起点。创建一个电子表格或清单。复制并粘贴该人的基本简介，列出对用户有效的设计，然后记录出造成障碍的设计。\n\
  \n## 步骤 2：识别标准和结果\n你现在对用户体验——即哪些设计有效，哪些设计无效——有了了解。现在是时候运行走演练习时收集想要测试的标准了。可用性是至关重要的，但测试你的设计原型以确保其符合法律标准也是很有的。\n\
  \n### 使用 WCAG 走演你的内容\nWeb 内容无障碍指南（WCAG）是数字无障碍的全球标准，并被许多法律引用。如前所述，WCAG 分四类：感知（Perceivable）、可操作（Operable）、可理解（Understandable）和健壮（Robust）。你可以在快速参考指南)查看指南列表。在该页面，你可以根据内容过滤列表。这将显示与你的工作相关的指南（成功标准）。\n\
  \n`W3C` 还创建了两个非常有用的补充指南，用于满足认知和学习障碍的 `WCAG` 成功标准（[`www.w3.org/WAI/WCAG22/supplemental/#cognitiveaccessibilityguidance`](https://www.w3.org/WAI/WCAG22/supplemental/#cognitiveaccessibilityguidance)）和低视觉（[`www.w3.org/WAI/WCAG22/supplemental/#-low-vision-accessibility-guidance`](https://www.w3.org/WAI/WCAG22/supplemental/#-low-vision-accessibility-guidance)）。\n\
  \n### 根据功能需求进行测试\n`EN 301 549` 是欧洲的一项无障碍标准。它的功能需求列表是满足障碍需求的简单用户陈述，强烈建议你将其添加到清单/电子表格中。只需剪并粘贴到你的电子表格中。功能需求要求对于任何信息通信技术，以下点都是可能的：\n\
  \n* 无视觉使用\n* 视力受限使用\n* 无听力使用\n* 听力受限使用\n* 发头能力有限\n* 操作有限\n* 触及范围有限\n* 减少光敏性痫触发\n\
  \n\n\n\n\n- 针对认知、语言或学习能力有限的用户用法\n\n加拿大政府网站列出了此处的功能性需求，以及与产品设计（物理和数字）相关的其他需求（ [`accessible.canada.ca/en-301-549-accessibility-requirements-ict-products-and-services-1`](https://accessible.canada.ca/en-301-549-accessibility-requirements-ict-products-and-services-1)）。\n\
  \n## 第 3 步：规划你的演练活动\n\n现在你已经有了可用性和无障碍测试衡量标准来测试你的设计想法或原型，现在是时候策划活动了，你的“需求走演练习”（Needs\
  \ Walkthrough Exercise）。\n\n理想情况下，你会召集 UI 设计师、UX 设计师和开发者，共同审查设计原型，不仅从文字内容的角度，还从整个用户界面体验设计的角度进行审查。你可以审查用户故事，然后一起查看标准指南和功能性需求。\n\
  \n然而，如果你想自己运行需求走演练习，也可以这样做，并学习许多关于残障人士如何与你的内容交互的知识。也许你只在文档中了自己的想法，即正文文本、标签、说明和替代文本（alt\
  \ text）的选择。\n\n## 第 4 步：执行走演练习\n\n现在是执行练习的时候。让我们看看需要采取哪些行动。\n\n### 行动 1：审查用户故事和标准\n\
  \n在团队中或独自，进入你的检查清单/表格，熟悉代表最多五种残障类型的用户故事，这些故事收集自用户访谈或 WAI 资源。记住他们提到的哪些内容是有效的，哪些是无效的。\n\
  \n接下来，审查你创建的任何检查清单，并将它们作为支持用户故事的指南记在心上。\n\n记住在用户旅程中使用了哪些辅助技术（如果有的话）。例如，如果你作为一个使用键盘和屏幕阅读器软件的盲人来体验这一过程，请思考语音输出听起来是什么样的，特别是当页面上的标题顺序混乱或使用链接时。\n\
  \n### 行动 2：复现五种用户旅程中的每一种\n\n按照如下方式复现这五种残障类型：\n\n1. 考虑第一种残障类型，使用你的原型走你的内容想法或设计稿，从头到尾捕捉用户旅程或任务。\n\
  2. 对其他四种残障类型重复此练习。\n3. 如果你有时间，考虑结合残障类型（例如，想象你是一个患有 ADHD（注意力缺陷障碍）和视力障碍的人在使用你的原型）。\n\
  4. 结合需求和标准指南，根据你的研究和计划评估用户旅程。你是否为用户遇到了障碍？如果是，请进入 `Action 3`。\n\n### 行动 3：记录你遇到的任何障碍\n\
  \n作为用户，如果某些地方不对劲，或者你被设计完全阻碍而无法继续。问问自己这些问题并在表格中记录：\n\n- 障碍的性质是什么？内容是不清晰，还是在某种内容格式类型上缺少替代方案？\n\
  - **关键（Critical）**：患此类残障的用户无法使用系统、网站、App、社交媒体帖子等的任何部分\n- **高（High）**：患此类残障的用户会发现使用系统、网站、App、社交媒体帖子等具有挑战性\n\
  - **中（Medium）**：用户可以使用有限的功能继续\n- 障碍是否违反了 WCAG 成功标准？如果是，是哪一个？\n- 障碍是否违反了 301 549\
  \ 功能性需求？如果是，是哪一个？\n- 你的建议修复方案是什么？\n- （如果相关）你会保留该内容格式但确保有替代方案吗？\n- （如果相关）以最简单的方式传递信息是否更易于管理，且对终端用户更好？\n\
  \n### 行动 4：记录你的解决方案\n\n你现在已经通过原型捕捉了低、中或严重的无障碍和可用性障碍，你可以在此阶段对其进行修复或移除。利用从用户故事或访谈以及标准中收集的知识，利用这些资源对内容更改提出建议。将它们记录在你的表格中。\n\
  \n## 第 5 步：分享你的所所得\n\n现在你已经完成了针对最多五种残障类型的练习，可能还有几种组合类型，这里是分享你的所得的一些方法：\n\n- 记录因走原型而产生的额外用户旅程，这些可能特定于你公司的产品或任务。按照\
  \ W3C *Stories of Web Users*（网页用户故事）的方式编写它们，包括姓名、残障、使用的辅助技术、设计和体验偏好以及需要避免的障碍。\n\
  - 从你的原始表格中提取所有笔记，以及任何用户访谈录音、视频和转录——并将它们共享在中心枢纽中供团队查看。定期查看它们以保持知识的新鲜。\n- 在现场网站或移动\
  \ App 上复现用户旅程。拔掉键盘并/或在网页或文档上运行屏幕阅读器亲身体验一下！\n\n## 第 6 步：确定由谁解决问题\n\n之后，额外的步骤是确定谁负责修复你发现的问题和障碍。你可能已经意识到由内容引起的障碍是你需要解决的问题；然而，有时你可能与设计师或开发者合作来完全消除障碍。\n\
  \nW3C 还发布了一份非常有用的《无障碍角色与责任模型》（`ARRM`）资源，名为*无障碍涉及的任务》（*Tasks Involved in Accessibility*），以补充`成功标准`。每个标准都有一个主要、次要和贡献者所有者——负责确保符合标准的人。有针对内容作者、UX\
  \ 设计师、UI/视觉设计师和前端开发者的标准。\n\n这是另一个很棒团队练习，用于审查需要修复什么、如何修复以及由谁修复。访问 ARRM 网站查看哪些 WCAG\
  \ 标准主要由内容作者所有：[`www.w3.org/WAI/planning/arrm/tasks/`](https://www.w3.org/WAI/planning/arrm/tasks/)。\n\
  \n如所示，需求走演练习作为一种实践是高度定制的，其目标是让你作为每种残障类型的人从头到尾体验一次用户体验。这样做让你能够快速识别障碍，以便重写内容、重新考虑所选格式或在需要时添加替代方案。\n\
  \n# 总结\n\n在本章中，你学习了在创建内容时考虑到多个用户是关重要的。你学习了通过包容性沟通的力量，并使用通俗、简单的语言让你的信息触达尽可能多的终端用户。无论是在网页还是移动屏幕上，在文档中还是在社交媒体平台上都是如此。你学习了按钮和控件的易于理解的标签和说明的重要性。事实上，内容为王道，但现在我们了解了不同人的需求，你就知道为什么清晰度也是王道了。\n\
  \n在应用内容策略时，你学习了要选择符合大多数残障人士需要的、包容性的内容格式。如果你选择了会排除某些用户的格式（例如图像、视频和音频剪辑），这也是可以的。你只需要为视障和听力障碍人士提供文本替代方案即可。\n\
  \n\n\n\n你在创建内容时已经培养了包容性思维。然而，你仍希望确保自己能够持续关注并满足受障人群的需求。为了做到这一点，你学习了如何进行一项免费且有效的练习，通过这项练习你可以测试你的文字内容和格式选择是否符合不同人的需求。你可以独立完成这项练习，也可以与团队中的设计师和开发人员协作完成。人是你策略的核心。你正在为改变数字世界贡献自己的力量。\n\
  \n在下一章中，你将学习如何开发无障碍网站，特别关注语义化 `HTML`、`CSS` 和 `ARIA`。\n\n# 第 7 章 开发无障碍网站：HTML、CSS\
  \ 和 ARIA 最佳实践\n\n*作者：Crystal Scott, CPWA*\n\n你成为 Web 开发者有一段时间了，但对无障碍（accessibility）还是个新手——或者相对新手？如果是这样，我希望你停下来思考一个问题：为什么你现在才开始学习无障碍？为什么在你最初接触\
  \ Web 开发时没有涵盖这一点呢？这是一个发人深省的问题，不是吗？\n\n无障碍性正成为现代网页开发的基石，但它在训练营、学位课程甚至在职培训中往往没有得到全面的教学。想看：你的课程是否教过你对比度对于创建视觉效果的设计至关重要？为什么他们在教其他内容时，没有教你\
  \ `WCAG` 对比率指南呢？他们本可以这样做，也应该这样做，但它被排在外了。\n\n为什么呢？原因各不相同：课程设置紧凑、侧重“胜任工作的技能”，甚至是对忽视无障碍性可能带来的法律和伦理影响缺乏认知。或者，教职员工并不具备包含无障碍内容所需的知识。遗憾的是，这导致许多开发者在职业生涯之初就存在着明显的知识空白。\n\
  \n这种遗漏说明了一切。不包含无障碍性不仅会伤害用户，还可能导致法律和财务后果。2023 年，州法院和联邦法院共受理了约 4,500 起针对公司的网页无障碍诉讼，指控其未能达到无障碍标准。网络不是可选的资源——它是必需品。将无障碍性视为事后考虑的问题是一个巨大的设计缺陷。\n\
  \n现在想象一下，如果无障碍原则在你学习 `HTML`、`CSS` 或 `JavaScript` 的第一节课时就被教授了，你今天对网页及其用户的理解会有多不同？本章的目标是帮助你建立无障碍优先的思维，这种思维方式将无障碍性整合到你做的每一个决策中。\n\
  \n在本章中，我们将涵盖以下主题：\n\n*   使用语义化 `HTML` 构建内容结构\n*   使用 `CSS` 进行无障碍样式设计\n*   使用 `ARIA`\
  \ 增强动态效果\n*   开发者的测试责任\n\n我衷心希望在本章结束时，你将永远无法忘记所学到的无障碍知识。你可能仍然遇到你构建的内容并非 100%无障碍的时刻，但我希望你能意识到这一点。我希望这会让你感到困扰，不是出于愧疚，而是因为你理解这对于尝试使用你作品的人意味着什么。网络属于所有人，所以让我们像那样编写代码吧。\n\
  \n无障碍优先的思维意味着将包容性置于每个决策的核心。它将焦点从为假设的“默认用户”设计转变为为所有人设计。\n\n问问自己：我在为谁创建这个？预期的目的和结果是什么？我是否考虑过这个功能对于依赖屏幕阅读器、键盘或语音控制的用户将如何运作？这些问题会引导出更好、更周全的设计，从而服务所有用户。\n\
  \n忽视无障碍性不仅是一个错失的机会——它还把人们排除在改变生活的产品和服务之外。通过将包容性作为优先事项，你正在构建一个公平、平等且欢迎的网络。\n\n# 使用语义化\
  \ HTML 构建内容结构\n\n你还记得你创建的第一个 `Hypertext Markup Language` (`HTML`）项目吗？我打赌是那个臭名昭著的“Hello\
  \ World（你好世界）”项目。啊，初级编码者的日子——学习使用强大的 `<` 和 `>` 符号来编写开启和闭合标签，并弄清楚一个简单的 `/` 如何将开启标签变为闭合标签。那些发现发现的瞬间是魔幻的。\n\
  \n我仍然记得通过 The Last Mile 参加的第一门*编程导论*课程中中学到的东西，多年来一直令我记忆。老师用人体类比解释了 `HTML`、`CSS`\
  \ 和 `JavaScript`。`HTML` 是骨骼结构——基础。`CSS` 是皮肤、头发和眼睛颜色，在骨架之上提供样式。而 `JavaScript` 呢？那是大脑——为整个身体带来功能的中心。正如身体需要强壮的骨骼一样，网站也需要结构良好的\
  \ `HTML` 来保持稳定。\n\n理解 `HTML` 如何提供结构只是开始。要真正构建无障碍、有意义的网站，我们需要深入研究，从非语义化和语义化 `HTML`\
  \ 之间的区别开始。\n\n## 定义非语义 HTML\n\n为了理解语义化 `HTML`，首先理解它的对立面——非语义 HTML（non-semantic HTML）非常重要。这指的是通用元素，如\
  \ `<div>` 和 `<span>`，它们构建了网页结构但不传达任何意义或上下文。\n\n正如开发者兼作者 Manuel Matuzović 所说：“div\
  \ 不是按钮。” `<div>` 元素是一个“纯”容器。根据 `MDN Web Docs` 的说法：“作为一个纯’容器，`<<div>>` 元素本身不代表任何内容。相反，它被用于组合内容，以便使用\
  \ `class` 或 `id` 属性轻松地进行样式处理，标记文档的某部分为使用不同的语言编写（使用 `lang` 属性），等等。”\n\n![img](img/B3208_07_1.png)\n\
  \n图 7.1：提醒：`<div>` 不是 `<button>`！#A11y (A11y = 无障碍)\n\n非语义 `HTML` 的问题在于它提供了结构但没有意义。这就像把内容放在一个隐形的盒子里——屏幕阅读器和搜索引擎不知道它是干什么用的，有时甚至不知道它在那里。例如，`<div>`\
  \ 和 `<span>` 元素没有传达其内容的目的，使得辅助技术和搜索引擎爬虫难以正确理解或解释页面。\n\n## 定义语义化 HTML\n\n语义化 HTML\
  \ 使用固有描述其目的的元素来构建网页，使内容更有意义且无障碍。诸如 `<header>`、`<article>` 和 `<section>` 等标签提供了角色的清晰定义，允许浏览器和辅助技术能够有效地解释和导航页面。这提高了可读性，增强了无障碍性，并通过赋予内容逻辑层次结构加强了搜索引擎优化。\n\
  \n通过根据预期角色使用元素，而不是对非语义元素进行视觉样式化，开发人员可以创建结构良好且直观的网页体验。例如，`<footer>` 自然地表示结束信息，而 `<nav>`\
  \ 明确定义了一组导航链接。这些区别提供了清晰度，确保用户（特别是依赖辅助技术的用户）能够以意义的方式与网页内容交互。\n\n让我们来看这个代码块：\n\n```\n\
  <!-- 语义化 HTML：原生按钮 -->\n<button type=\"submit\">提交</button>\n<!-- 非语义模拟：使用 <div>\
  \ 重创建按钮 -->\n<div\n    role=\"button\"\n    tabindex=\"0\"\n    onclick=\"submitForm()\"\
  \n    onkeydown=\"if (\n        event.key === 'Enter' || event.key === ' ') submitForm();\"\
  \n>\n    提交\n</div>\n```\n\n\n\n\n第一个示例使用了语义化的 `<button>` 元素，它默认支持可访问，并且无需额外代码即可支持键盘交互、屏幕阅读器和表单提交。第二个示例显示了一个\
  \ `<div>`，并添加了 `role=\"button\"`、`tabindex=\"0\"` 以及 JavaScript 事件处理程序来模拟按钮行为。这种方法增加了复杂性，并存在遗漏关键可访问功能的风险。\n\
  \n### 为什么语义化 HTML 非常重要？\n\n语义化 HTML 通过以下方式增强您的网站：\n\n*   **有意义的标记**：内置角色（例如将 `<header>`\
  \ 作为“横幅”）以及如 `<nav>` 和 `<main>` 等元素为屏幕阅读器提供了有意义的结构，使用导航更加方便。通过使用语义化 HTML，开发者可以创建一个网页体验，让依赖辅助技术的用户能够有效地定位内容、跳过重复部分，并像使用鼠标或触摸的用户一样无缝地导航页面。\n\
  *   **逻辑分级**：正确使用语义化标题（`<h1>` 到 `<h6>`）可确保内容结构直观，改进所有用户（包括使用辅助技术的用户）的导航。除了辅助屏幕阅读器外，良好的标题结构还增强了视觉层级，引导用户的视线自然地通过内容。由于大多数人是扫描网页而非逐字阅读，清晰的标题使得快速定位关键信息变得更加容易。\n\
  *   **SEO**：诸如 `<article>` 和 `<h1>` 等标签可以提高内容的可发现性和搜索排名。就像辅助技术一样，搜索引擎也依赖语义化 HTML\
  \ 来理解内容的结构和相关性，帮助它们更准确地索引页面并对其进行有效排名。\n*   **对辅助技术支持**：如 `<form>` 和 `<label>` 等元素共同工作，创建可访问的工作流，确保依赖辅助技术的用户能够有效地导航表单。`<label>`\
  \ 元素为表单字段提供了清晰的文本描述，而 `<fieldset>` 和 `<legend>`为成组输入提供了上下文。正确的语义化标记确保用户可以使用键盘或语音命令顺畅地完成表单，使交互更具包容性和可访问性。\n\
  *   **键盘导航**：如 `<button>` 等交互元素支持键盘使用并能有效通信状态。与需要额外脚本才能实现交互的 `<div>` 或 `<span>`\
  \ 不同，`<button>`、`<a>` 和 `<input>` 等原生 HTML 元素自动是可以聚焦的，并能响应键盘事件（如 `Tab`、`Enter` 和\
  \ `Space`）。使用语义化元素确保了交互组件开箱即用且可访问，无需为事件处理程序或键盘焦点编写修复脚本。\n\n使用正确的语义化标记为辅助技术创建了路线图，让残障用户能够更有效地导航。除了可访问性之外，语义化\
  \ HTML 还改进了协作和 SEO。开发者可以更容易地理解您的代码，搜索引擎可以更好地分类您的网站。精通语义化 HTML 意味着编写具有共情心、逻辑的代码，这对开发者、用户和机器都受益。\n\
  \n语义化 HTML 通过赋予内容意义和清晰度为可访问性奠定了结构基础。但仅有结构是不够的；我们如何设置内容的样式对可用性和包容性也起着至关作用。让我们关注 CSS，探索深思样式选择如何为所有用户提供更具可访问性的体验。\n\
  \n# 使用 CSS 进行包容性设计\n\n`级联样式表` (`CSS`) 是现代网页设计的设计师，将基础 HTML 结构转换为具有视觉吸引力和响应式的体验。但您实现\
  \ CSS 的方式可能会决定可访问性的成败。\n\nCSS 中的可访问性不仅仅是为了好看——它要为了为所有人服务。考虑不周的样式会为视力障碍、认知挑战或对运动敏感的用户制造障碍。一个高对比度的按钮可能意味着完成购买与沮丧地离开网站之间的区别。键盘用户依赖可见的焦点样式进行导航，而对运动敏感的人可能需要关闭动画。\n\
  \n好消息是？通过采用深思熟虑的最佳实践，您可以确保经过 CSS 增强的设计是包容的、实用的且依然美观。\n\n### 确保足够的色彩对比度\n\n如果用户无法阅读您的内容，无论多精妙的设计都无法救它。`网页内容可访问性指南`\
  \ (`WCAG`) 设定了最小对比率以确保可读性：\n\n*   **普通文本**（如正文内容）与背景相比的对比率必须达到 4.5:1。\n*   **大号文本**（18pt\
  \ 常规或 14pt 粗体）所需的最低比例较低为 3:1，因为其尺寸使其更容易阅读。\n*   **有意义的用户界面组件**（如表单字段边框或焦点指示器）和图形对象（如图标或图表）也需要与背景保持\
  \ 3:1 的对比率，以保持清晰和可区分。\n\n让我们来看这个示例：\n\n![带有白色文字的紫色背景，AI 生成的内容可能不正确](img/B32080_07_2.png)\n\
  \n图 7.2：装饰性文本的糟糕与足够的色彩对比度对比\n\n上面的示例显示在浅紫色背景上使用白色草体文字，这不符合 WCAG 对比度要求，并且对许多用户来说难以阅读。下面的示例在相同背景上使用深紫色文本，通过了对比检查，并在保持视觉风格的同时提高了可读性。\n\
  \n未能满足这些标准可能会导致低视力用户、色盲或受眩光和不良光线条件影响的用户难以或无法感知内容。现在想象一个使用低对比度草体文本的网页，虽然它看起来可能很“时尚”，但如果用户无法阅读您的内容，那意义何在？通过确保正确的色彩对比度，你是在给用户提供了一只明亮的手电筒，而不是让他们在黑暗中摸索。\n\
  \n### 避免用 CSS 添加重要内容\n\nCSS 伪元素（`::before` 和 `::after`）对于装饰目的很有用，但不应用于插入关键内容。屏幕阅读器可能无法一致地解释伪元素的内容；它可能会被忽略、重复或在脱离上下文的情况下读取。\n\
  \n如果您使用伪元素来添加标签、说明或必填字段指示，那么依赖辅助技术的用户极有可能会漏掉它们。`::before` 和 `::after` 等伪元素不存在于 DOM\
  \ 中，因此您无法直接对它们应用 ARIA 属性。例如，如果您使用 `::before` 使用装饰性图标，屏幕阅读器可能仍会报告生成的内容——除非父元素通过某种方式封装或样式，并在实际\
  \ DOM 元素上设置了 `aria-hidden=\"true\"`。\n\n更具可访问性的方法是在元素内部添加装饰性内容，如下：\n\n```html\n\
  <button>\n    可见文本\n    <span aria-hidden=\"true\" class=\"icon\"></span>\n</button>\n\
  ```\n```css\nicon::before {\n    content: \"✶\"; /* 替换为实际图标或使用背景图像 */\n    display:\
  \ inline-block;\n    margin-left: 0.5rem;\n    font-size: 1rem;\n    color: #666;\n\
  }\n```\n\n始终将核心内容直接包含在 HTML 和 DOM 中，并使用有意义的语义化元素（如 `<label>`、`<p>` 或其他传递结构和意图的标签）。避免使用\
  \ CSS 伪元素生成有意义的内容，因为它们的可访问性支持不稳定。如果内容需要被屏幕阅读器读取或与用户交互，它应该是 DOM 的一部分，以便可靠地对其进行播报和样式设置。\n\
  \n### 尊重用户偏好\n\n\n\n\n\n一些用户依赖操作系统或浏览器设置来减轻视觉疲劳、缓解动症或对光线敏感。这些偏好可能包括减少动画、深色模式、增加对比度或更大的默认字体。当开发者尊重这些设置时，他们就能创建出能够优雅适应个人需求的体验，而无需用户采取额外的操作步骤。\n\
  \n例如，`prefers-reduced-motion` 媒体查询允许你检测用户何时请求了最小动画，并据此调整动画或过渡效果：\n\n```CSS\n@media\
  \ (prefers-reduced-motion: reduce) {\n    * {\n        animation: none;\n      \
  \  transition: none;\n    }\n}\n```\n\n另一个常见的偏好是深色模式，它可以帮助减轻眼睛疲劳，提高低光环境下的可读性，并支持对亮屏幕敏感或患有光敏感的用户。你可以使用\
  \ `prefers-color-scheme` 媒体查询来检测并响应此设置：\n\n```CSS\n@media (prefers-color-scheme:\
  \ dark) {\n    body {\n        background-color: #121212;\n        color: #f5f5f5;\n\
  \    }\n}\n```\n\n通过尊重这些系统级偏好，你赋予了用户控制内容消费方式的权利，支持舒适度、清晰度和可访问性的同时，而不会强加可能导致不适的视觉体验。尊重用户偏好只是构建自适应界面的一部分。开发者还需要确保设计在各种屏幕尺寸、缩放级别和设备配置下保持良好的可用性和可访问性。\n\
  \n## 为灵活性和扩展性进行设计\n\n响应式设计不仅仅关乎屏幕尺寸。它还确保了跨设备、缩放级别和用户设置的可访问性。根据 WCAG 2.2 成功准则 1.4.10：重流（Reflow），内容必须保持可用，而不需要要求用户同时向两个方向滚动。具体而言，当视口宽度宽度缩小到\
  \ 320 CSS 像素或高度为 256 CSS 像素时，用户不应该需要水平滚动。测试此点的常用方法是在 1280 像素宽的屏幕上将页面缩放大 400%，并/或使用浏览器开发者工具中的\
  \ `Device Mode`（设备模式）。这确保了内容能够正确重流，并为依赖屏幕放大或小型显示器的用户保持功能性。\n\n为了满足这些需求，请使用相对单位和能够优雅适应的灵活布局：\n\
  \n*   使用 `rem` 设置字体大小，它相对于根元素（`<html>`）进行缩放，并尊重用户定义的偏好。\n*   在组件内部间距中使用 `em`，允许内边距和外边距根据文本大小进行调整。\n\
  *   对文本和布局避免使用固定像素（`px`）值，因为它们不会响应浏览器缩放或操作级缩放。\n*   确保布局在窄视口下能够重流，且不会截断或隐藏内容。使用\
  \ `flex-wrap`、媒体查询或 CSS grid 等技术来允许元素自然地堆叠或移动：\n    *   `flex-wrap`：允许弹性布局项目换行到多行，防止它们缩小得过小或溢出容器。\n\
  \    *   `Media queries`（媒体查询）：在不同的断点处应用不同的样式，使布局能够跨屏幕尺寸进行响应式自适应。\n    *   `CSS\
  \ grid`：一种强大的布局系统，允许你创建二维布局，调整列和行以适应不同的屏幕尺寸。\n*   测试所有交互元素——包括表单、按钮和链接——以确认在高缩放比例和小屏幕上的功能和可见性。\n\
  \n通过将灵活的 CSS 与相对单位相结合，你可以创建一个响应式的、可访问的体验，这种体验对所有人都适用，包括视觉障碍用户或在移动设备上导航的用户。\n\n##\
  \ 提供高可见性的焦点样式\n\n焦点指示（Focus indicators）是视觉线索，用于突出当前获得焦点的交互元素，例如按钮、链接或表单字段。这些指示通常在用户使用键盘导航页面（例如使用\
  \ `Tab` 键）时出现，帮助他们跟踪自己在页面上的位置。\n\n为了有效应用焦点样式，理解 `focus` 与 `focus-visible` 之间的区别关重要：\n\
  \n*   `*:focus`：每当元素获得焦点时都会应用焦点样式，包括用鼠标点击或通过键盘导航时。\n*   `*:focus-visible`：它专门针对键盘用户（或依赖焦点导航的输入法），并且在用鼠标点击元素时不应用样式。\n\
  \n一些开发者会完全移除焦点样式，因为它们与他们的视觉设计相冲突，而他们往往没有意识到这些指示对于可访问性有多么重要。没有了它们，键盘用户只能猜测自己在页面上的焦点在哪里，导致导航变得混乱且令人沮丧。\n\
  \n以下是一个不应该做法的示例：\n\n```css\n*:focus {\n    outline: none;\n}\n```\n\n这完全移除了浏览器的默认焦点样式，导致键盘用户没有任何关于自己在页面上位置的视觉指示。\n\
  \n相反，应该增强焦点指示以符合你网站的设计风格，同时保持其清晰可见：\n\n```css\n*:focus-visible {\n    outline-color:\
  \ #212121;\n    outline-style: auto;\n    outline-width: 2px;\n    outline-offset:\
  \ 2px;\n}\n```\n\n`outline-style: auto` 关键字允许浏览器应用其默认的轮廓外观，这可能会根据平台或用户代理而异。虽然这有助于保持与原生焦点样式的一致性，但确保你的轮廓相对于网站背景具有足够的对比度和可见性是非常重要的。\n\
  \n`outline-offset: 2px` CSS 属性将轮廓稍微移动到元素边缘之外，防止其在视觉上被边框压缩或与阴影重叠；这提高了清晰度，并帮助轮廓在亮色和深色背景上均保持\
  \ 3:1 的可见对比度。\n\n确保焦点可见只是 CSS 支持可访问性的方法之一。接下来，让我们看看为什么包容性设计选择对真实用户很重要。\n\n## CSS\
  \ 如何支持包容性设计\n\n包容性设计确保视觉样式适用于所有人，而不仅仅是使用鼠标、默认字体大小或亮屏幕的用户。在用心实施时，CSS 有助于消除障碍、强化内容结构，并允许界面适应各种用户需求、设备和偏好。以下是包容性设计支持的一些结果：\n\
  \n*   **更好的可读性**：高对比度文本和可见的焦点样式有助于视觉障碍或色觉异常的用户舒适地感知和交互内容。\n*   **内容与装饰的清晰分离**：将意义内容留在\
  \ HTML 中并仅将 CSS 用于样式，可以确保屏幕阅读器正确解释内容。\n*   **减少运动敏感**：尊重用户减少动画的偏好，可以防止运动触发条件的用户感到不适或分心。\n\
  *   **响应式缩放**：使用 `rem` 和 `em` 等相对单位允许布局和文本自然缩放，支持缩放和自定义字体大小。\n*   **灵活布局**：响应式 CSS\
  \ 跨屏幕尺寸和缩放级别调整设计，确保内容在 400% 缩放或窄视口下保持功能性。\n\n即使有结构良好的 HTML 和可访问的 CSS，在某些情况下，原生元素无法提供所需的所有信息或交互。这就是\
  \ ARIA 发挥用场的地方。在正确使用时，ARIA 可以填补空白并让动态内容和自定义组件更容易被辅助技术理解，从而增强可访问性。\n\n# 使用 ARIA 增强动态效果\n\
  \n\n\n\n\n`Accessible Rich Internet Applications (ARIA)` 是开发者在原生 HTML 无法满足需求时会采用的工具\
  \ set。ARIA 由 `World Wide Web Consortium` (`W3C`) 引入，它桥接了动态 Web 组件（如模态框、手风琴组件和滑块）与可访问性之间的差距。通过程序化地使用\
  \ ARIA 属性，开发者可以帮助辅助技术在原生 HTML 单独无法满足的情况下解释上下文和行为。\n\n在 ARIA 出现之前，开发者在构建能够被辅助技术理解的交互式组件时非常困难。坦诚地说，许多人仍然面临这种困难\
  \ – 这正是为什么此类指南存在。ARIA 属性为开发者提供了一种在原生 HTML 不足时，通过程序化通信自定义组件的用途、状态和关系的方法：\n\n- `aria-expanded`\
  \ 可以告诉辅助技术某个元素（如下拉面板、手风琴部分或菜单）当前是展开状态还是折叠状态。\n- `aria-labelledby` 通常用于通过引用触发它们的按钮或标签页，为手风琴面板或标签页面板等元素标记。这确保了辅助技术能够根据可见内容宣布清晰且具有描述性的标签。\n\
  \n但重要的是，要记住 ARIA 就像盐一样。在适当的时间使用适当的用量，它可以让食物变得非常美味。但是，如果在错误的时间或使用错误的用量，它可能会破坏体验。\n\
  \n## ARIA 的五条规则\n\nW3C 概述了有效使用 ARIA 的这些核心原则：\n\n1. **优先使用原生 HTML 元素**：如果你可以使用已经内置了你所需的语义和行为的原生\
  \ HTML 元素或属性（而不是重新利用一个元素并添加 ARIA 角色、状态或属性来使其可访问），那么请这样做。\n2. **除非真的必要，否则不要更改原生语义**：不要通过更改它们的角色（role）来覆盖\
  \ HTML 元素的含义。例如，不要直接给像 `<h2>` 这样的标题分配 `role=\"tab\"` – 而是对其进行恰当的封装。\n3. **所有交互式\
  \ ARIA 控件必须可以使用键盘使用**：ARIA 不提供键盘功能。如果你使用 ARIA 角色构建了自定义小部件（如 `role=\"button\"`），你必须手动编写键盘行为\
  \ – 包括焦点、回车键和空格键的逻辑。\n4. **不要在可聚焦的元素上使用 `role=\"presentation\"` 或 `aria-hidden=\"\
  true\"`**：这些属性会将元素从可访问树中移除。如果该元素仍然可以聚焦，它可能会让焦点落在“无”，从而让屏幕阅读器用户感到困惑。\n5. **所有交互元素必须具有一个可访问名称**：任何交互元素（如按钮、链接、表单输入或自定义小部件）都必须向辅助技术暴露可访问名称。这有助于用户理解控件的用途。\n\
  \n*第一条规则至关重要：优先使用原生 HTML 元素。* 在求助于 ARIA 之前，仔细观察语义化 HTML 已经能做到什么。它是 Web 可访问性中默默的优秀者\
  \ – 内置元素带有有意义的角色、行为和键盘支持，这些支持有时是 ARIA 也无法复制的。\n\n如果存在原生元素，请使用它。ARIA 是一个强大的工具，但它应该是你的最后选择\
  \ – 而不是第一直觉。没有什么比在明明可以使用 `<button>` 的时候却在 `<div>` 上强贴上 `role=\"button\"` 更能说明“我没做功课”了。\n\
  \n在应用 ARIA 定制化之前，请始终参考最新规范，以确保你正确使用了角色、状态和属性。猜测或误用 ARIA 可能会导致辅助技术的困惑，最终损害而非帮助可访问性。例如，在\
  \ `<button>` 上添加 `role=\"navigation\"` 而不是使用正确的 `<nav>` 元素，可能会因误表元素的功能和目的而让屏幕阅读器用户困惑。\n\
  \n最新的 ARIA 规范 WAI-ARIA 1.2 已于 2023 年 6 月 6 日成为 W3C 推荐。它为有效使用角色、状态和属性提供了详细指导：[`www.w3.org/TR/wai-aria-1.2/`](https://www.w3.org/TR/wai-aria-1.2/)。欲需更多最佳实践，请参阅于\
  \ 2018 年 9 月 27 日作为 W3C 工作草案发布的《使用 ARIA》指南：[`www.w3.org/TR/using-aria/`](https://www.w3.org/TR/using-aria/)。\n\
  \n现在，让我们仔细查看一下我们在在本节开头提到的两个 ARIA 功能：`aria-expanded` 和 `aria-labelledby`。\n\n## aria-expanded\n\
  \n`aria-expanded` 属性告知与元素关联的内容当前是显示（`true`）还是隐藏（`false`）。下拉列表、手风琴和披露面板是该属性的常见用例。视盲屏幕阅读器用户特别从中获益，因为他们无法依靠箭头图标或滑动动画等视觉线索来理解内容是否已显示。\n\
  \n考虑一个常见的 FAQ 交互，用户点击问题来显示答案。在视觉上，这种变化是显而易见的。但对于屏幕阅读器用户，我们需要告知关联的内容是展开还是折叠。`aria-expanded`\
  \ 属性使得这一切成为可能。\n\n```HTML\n<button aria-expanded=\"false\" class=\"faq-toggle\"\
  >\n    您的退货政策是什么?</button>\n<div class=\"faq-answer hidden\">\n    <p>您可以在购买后 30\
  \ 天内退货并获得全额退款。</p>\n</div>\nCSS\nhidden {\n    display: none;\n}\nJavaScript\nconst\
  \ button = document.querySelector('.faq-toggle');\nconst answer = button.nextElementSibling;\n\
  button.addEventListener('click', () => {\n    const expanded = button.getAttribute('aria-expanded')\
  \ === 'true';\n    button.setAttribute('aria-expanded', String(!expanded));\n  \
  \  answer.classList.toggle('hidden');\n});\n```\n\n这种设置使用 `aria-expanded` 来告知内容的状态，为屏幕阅读器用户提供了视觉用户通过视觉线索获得的上下文。`.hidden`\
  \ 类确保内容在视觉上隐藏，而不是依赖 HTML `hidden` 属性（后者在处理切换时可能会有问题）。\n\n## aria-labelledby\n\n\
  `aria-labelledby` 用于程序化地将可见标签与页面上的另一个元素关联。当文本标签没有嵌套在被标记元素内部但在视觉上与其关联时，这特别有用。一个常见的例子是使用描述用途的标题为表单部分标记。\n\
  \n想象一个结算页面，支付表单由标题引入。为了确保屏幕阅读器以有意义的名称宣布表单，开发者可以使用 `aria-labelledby` 将表单容器与标题关联：\n\
  \n```html\n<h2 id=\"payment-heading\">支付信息</h2>\n<form aria-labelledby=\"payment-heading\"\
  >\n    <!-- 此处为表单字段 -->\n</form>\n```\n\n这些只是应用 ARIA 增强可访问性的许多方法中的两个。当深思熟虑地使用时，`aria-expanded`\
  \ 和 `aria-labelledby` 等属性可以帮助通信结构、关系和行为。\n\n## 应用 ARIA 增强动态和自定义组件\n\n掌握 ARIA 意味着了解它的用途和局限性。ARIA\
  \ 不是语义 HTML 的替代品 – 它是原生元素不足时的补充。以下是利用 ARIA 的方法：\n\n- **明确何时使用**：遵循 ARIA 的五条规则，确保你是在增强而非阻碍可访问性。\n\
  - **检查规范**：始终参考最新的 ARIA 指南，以正确应用角色、状态和属性。\n- **通信变化**：使用 `aria-expanded` 和 `aria-labelledby`\
  \ 等 ARIA 属性来通信元素的状态和关系。\n\n\n\n\n\n*   `兼容性测试`：使用辅助技术验证 ARIA 实现，以确保它们在不同设备和浏览器上正常工作。\n\
  \n通过深思熟应用 `ARIA`，你可以确保自定义组件对于所有用户来说都是可访问、直观且包容的。然而，编写无障碍代码只是流程中的一部分；你还需要验证它是否按预期工作。下一步是测试你的代码以尽早发现无障碍问题，并确保你的实现在真实场景中经得起考验。\n\
  \n# 测试你的代码是否符合无障碍标准\n\n开发无障碍网站的最基本的最佳实践之一是学习如何测试自己的代码。本章关注了 `HTML`、`CSS` 和 `ARIA`，但即使是编写得最仔细的代码，如果不测试，也无法带来无障碍体验。无障碍不仅关乎编写完美的代码，还关乎符合\
  \ `WCAG` 标准，并为最广泛的受众提供最佳用户体验。这从了解如何在真实条件下测试你的工作开始。\n\n开发者必须理解他们进行设计和编码时所遵循的指南。测试不应完全留给审计员或质量保证专家。如果你正在构建数字产品，无障碍符合性测试应该从一开始就成为你开发工作流的一部分，而不是最后一步。这意味着要理解如何识别常见的障碍、解释\
  \ `WCAG` 要求，并识别某些看起来正常但可能对所有人都无法使用的情况。\n\n基础的无障碍测试流程应该同时包含自动化工具和手动测试技术。自动化工具有助于发现明显的错误，例如缺少替代文本（alt\
  \ text）或颜色对比不足。然而，许多无障碍问题（例如错误的焦点行为、仅限鼠标的交互或误导性的链接文本）只能通过手动测试发现。\n\n手动流程必须包括对屏幕阅读器技术的\
  \ Basic 使用。你不需要成为屏幕阅读器专家，但你应该熟悉屏幕阅读器的工作原理、如何使用它导航网站，以及你的内容是如何向屏幕阅读器用户播报的。无论你是在 Windows\
  \ 上使用 `NVDA`、在 macOS 或 iOS 上使用 `VoiceOver`，还是使用其他工具，这些知识都能帮助你发现自动化扫描会遗漏的关键可用性问题。\n\
  \n在多个设备上测试你的网站和组件同样重要。用户体验在不同的操作系统、浏览器、屏幕尺寸和输入方法之间存在差异。在桌面浏览器上运行良好的设计，在移动屏幕上缩放或在平板电脑的高对比度模式下查看时可能会失效或变得不可用。跨真实环境的测试确保了你的工作是设计上的包容性，而不是仅仅是假设。\n\
  \n浏览器开发工具在此过程中起着关键作用。`Chrome DevTools` 和 `Firefox` 中的无障碍树、焦点顺序检查以及角色和名称检查，对于理解辅助技术如何解释你的代码是不可或缺的。\n\
  \n总之，你应该建立一个无障碍测试工具箱——这不仅是工具的集合，更是作为开发者工作的核心部分。目标不是使用所有可用工具，而是持续使用与你的工作流一致、支持你的职责并帮助你为真实用户构建产品的工具。\n\
  \n每个开发者都应该维护一个包含自动化和手动测试方法的工具箱。这意味着要检查无障碍树的问题、验证语义化结构、检查颜色对比度，并使用辅助技术模拟用户体验。测试应该是开发的组成部分，而不是最后的任务或交给他人的工作。\n\
  \n以下是我在关注无障碍的开发工作中最常用的工具：\n\n*   `Chrome DevTools`，特别是 `Accessibility` 面板和无障碍树检查\n\
  \n*   `Webflow`，特别是 `Accessibility` 面板和无障碍树检查\n\n*   `WAVE`，特别是 `Accessibility`\
  \ 面板和无障碍树检查\n\n*   `TPGi Color Contrast`，特别是 `Accessibility` 面板和无障碍树检查\n\n*   `ARC\
  \ Toolkit`，特别是 `Accessibility` 面板和无障碍树检查\n\n*   `WebAIM`，特别是 `Accessibility` 面板和无障碍树检查\n\
  \n*   `NVDA`，特别是 `Accessibility` 面板和无障碍树检查\n\n*   `VoiceOver`，特别是 `Accessibility`\
  \ 面板和无障碍树检查\n\n*   `TalkBack`，特别是 `Accessibility` 面板和无障碍树检查\n\n 总结\n\n本章探讨了无障碍开发的实用基础，涵盖了语义化\
  \ `HTML`、`CSS` 的包容性使用、`ARIA` 以及无障碍测试的重要性。你学习了 `HTML` 如何提供结构和含义、`CSS` 如何在不引入障碍的情况下支持可用性，以及当原生\
  \ `HTML` 不够时 `ARIA` 如何扩展无障碍性。你还看到了为什么对工作进行无障碍测试应该是开发的一部分，以及深思熟的测试工具箱如何帮助你尽早识别并修复障碍。\n\
  \n在当今的开发环境中，这些技能至关重要，因为数字体验必须服务于具有多样需求的广泛用户。无论你是在构建落地页、Web 应用程序还是复杂的交互组件，无障碍都不是“锦上添花”，而是高质量代码中不可或缺的一部分。采用无障碍优先的思维使使你能够创建出对所有人都更易用、符合法律规定且设计以人为本的产品。\n\
  \n在下一章中，你将探索如何将包容性设计原则扩展到移动环境，在那里，触摸手势、屏幕尺寸和语音交互引入了一系列独特的无障碍挑战和机会。\n\n# 延伸阅读\n\n\
  无障碍不是一次性的修复。它是一项需要持续学习和适应的承诺。随着标准、工具和技术的演进，保持更新有助于确保你的工作保持有效、包容并符合真实用户的需求。花时间查看\
  \ `WCAG` 和 `WAI-ARIA` 的更新，参与 `WebAIM` 和 `W3C` 等无障碍社区，并关注可靠的博客、时通讯和网络研讨会以保持知识敏锐。除了实现之外，倡导也起着关键作用。无论你是在指导同事、发布见解，还是在团队内部引导对话，你的影响力都能帮助在整个组织和更广泛的行业中嵌入包容性实践。\n\
  \n这里是一些支持你持续成的可靠资源：\n\n\n\n\n*   **W3C Web Accessibility Initiative** ([`www.w3.org/WAI/`](https://www.w3.org/WAI/)):\
  \ W3C 的无障碍标准官方中心，涵盖 `WCAG` 和 `WAI-ARIA`。这是获取数字无障碍技术规范、指南和工作组更新的权威来源。\n\n*   **WebAIM**\
  \ ([`webaim.org/`](https://webaim.org/)): 一个备受尊敬的组织，提供实用的无障碍文章、研究和培训。WebAIM 对于想要建立基础知识的初学者和团队非常有帮助。\n\
  \n*   **Deque University** ([`dequeuniversity.com/`](https://dequeuniversity.com/)):\
  \ 一个强大的在线培训平台，提供关于无障碍测试、屏幕阅读器使用和 `ARIA` 的课程。Deque 的资源在企业和教育环境中被广泛使用。\n\n*   **Accessibility\
  \ Book Club** ([`www.a11ybookclub.com/`](https://www.a11ybookclub.com/)): 由我创立的一个免费社区驱动小组，旨在让开发者、设计师和无障碍倡导者通过每月阅读、讨论和直播活动共同学习。\n\
  \n通过与这些资源的联系，你将作为一个具有无障碍意识的开发者不断成长，并为更具包容性的网络做出贡献。因为如果你的网站不能为所有人服务，那么它就没有真正运作。\n\
  \n# 8\n\n# 移动无障碍：针对触摸和语音界面进行设计\n\n*作者 Chris McMeeking*\n\n你使用手机时在做什么？你在工作吗？坐在汽车副座上吗？使用轮椅？在跑步吗？移动设备被各种各人在各种背景下使用。在所有这些背景下为用户带来移动应用的便利性，正是无障碍移动应用设计与开发的核心所在。然而，如果你的网站不能为所有人服务，那么它就没有真正运作。\n\
  \n## 移动无障碍：针对触摸和语音界面进行设计\n\n移动无障碍中最关键的区别之一是通过移动浏览器访问的 Web 内容与原生移动应用之间的区别。虽然它们在表面上看起来相似，但底层技术、功能和无障碍框架存在显著差异。\n\
  \n识别这些区别与理解 iOS 和 Android 之间的差异同样重要，它是在移动端做出明智、无障碍设计决策的基础。\n\n\n\n强制移动应用程序表现得像其网页端程序一样，会给用户带来问题，并导致应用程序偏离\
  \ Google 和 Apple 预期的行为和实现。当 Android 或 iOS 发布新版本时（这种情况频繁发生）——现有的控件可能无法立即支持更新中引入的新型辅助技术功能。无障碍专家应该理解控件在不断演变的平台框架内的预期行为，以确保兼容性和无障碍性。\n\
  \n在瞬息万变的生态系统中，这可能是一个挑战。应对这一点的方法包括：\n\n*   将你的应用程序与 Google 或 Apple 的应用程序进行比较，同时接受它们可能不符合你来自\
  \ Web 应用程序的预期。\n*   在分享关于你偏好的测试方案的意见之前，彻底熟悉多个平台的辅助技术。\n*   与工程师讨论时保持开放心态，特别是当他们说某些功能无法实现时。\n\
  \n这些策略可以帮助你应对移动无障碍辅助的复杂性，但必须记住，移动应用程序的底层架构带来了独特的挑战。与 Web 开发不同，移动 App 使用编译型语言构建，这些语言在应用程序的不同组件之间执行了严格的隐私规则。在进行无障碍改进时，记住这一点至关重要。\n\
  \n移动应用程序构建在编译型语言之上。编译型语言在各个实现部分之间有严格的隐私预期。每当我们要求开发者添加自定义功能来改进无障碍体验时，我们实际上是在要求他们违反这种约定。虽然在某些情况下可能是可能的，但它会导致可维护性问题，并且实际上可能会偏离控件的预期行为。\n\
  \n让平台按照其设计方式运行，即使其行为与你在 Web 生态系统中习惯的有所不同。iOS 和 Android 都提供了强大的内置无障碍支持，但覆盖默认行为的自定义实现可能会抑制这种支持。要求开发者绕过感知到的平台缺陷通常会导致应用程序随着时间的推移变得更难维护且无障碍性更差。当平台最终解决这些缺陷时，自定义解决方案可能会与新的预期行为冲突，无意中削弱了无障碍性而不是增强它。\n\
  \n纳入平台规范对于构建无障碍、可维护的应用程序至关重要。通过尊重原生行为并避免不必要的自定义，你可以确保与不断演变的无障碍标准兼容。在建立坚实基础的基础上，下一步是优化触摸目标，以适应各种用户能力。\n\
  \n# 为各种能力优化触摸目标\n\n移动设备带来了独特的无障碍挑战，因为用户通常在移动时与它们交互，使用手指点击、滑动和缩放。这在以下情况下可能特别为困难：\n\
  \n*   **控件太小**：如果控件比指尖还小，用户可能难以准确点击它，尤其是在移动或单手持握设备时。\n*   **控件过于拥挤**：当多个控件靠得太近时，很难确定激活了哪一个控件，导致错误和挫败感。\n\
  \n这些挑战对于有活动障碍的用户（如灵活性受限、震抖或其他运动障碍的人士）来说可能更加明显。设计具有足够尺寸、间距和触摸响应的控件对于创建更具包容性的移动体验至关重要。\n\
  \n那么，我们如何在不让交互控件主用户界面的情况下考虑到触摸目标的大小？虽然不仅限于移动端，WCAG 2.5.8 目标尺寸（最小）（（ [`www.w3.org/WAI/WCAG22/Understanding/target-size-minimum`](https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum)\
  \ ）通过为交互式控件建议最小目标尺寸，解决了所有触摸界面的问题——包括平板电脑、笔记本电脑和灵活性受限的人使用的辅助技术。目前的建议是符合 AA 标准的最小尺寸为\
  \ 24 x 24 CSS 像素，建议的 AAA 阈值为 44 x 44 CSS 像素。让我们来看看一些更有帮助的概念。\n\n## 卡片模式 (The card\
  \ pattern)\n\n卡片模式是一种设计方法，将信息组织在独特的、交互式的容器或“卡片”中。这些卡片通常足够大，易于点击或触摸，对于移动用户（包括有运动障碍或灵活性受限的用户）来说特别易于访问。\n\
  \n![img](img/B32080_08_1.jpg)\n\n图 8.1：卡片模式\n\n通过在清晰定义的卡片中对相关内容和交互元素分组，你可以增强易用性和无障碍性。在展示项目列表（如产品、文章或\
  \ App 列表）时，这些方法尤为有效。它们允许提供宽敞的触摸目标和不同内容之间的视觉分离，减少了意外交互的风险。\n\n有关卡片模式的实际示例，请访问 Google\
  \ Play Store 或 Apple App Store。注意应用程序、游戏和其他内容是如何作为不同的卡片呈现的，每张卡片都占据了足够的空间以便于点击。这种设计确保了清晰度、一致性和无障碍性。\n\
  \n然而，不要向卡片中加载过多的信息，或以冲突的方式嵌套多个交互元素。例如，将整个卡片分配用于导航到用户个人资料，同时在内部放置一个可点击的电子邮件地址或按钮，可能会导致混乱或意外交互。为了确保清晰且无障碍的体验，请保持每张卡片的聚焦，避免交互区域重叠，并尽可能每张卡片优先考虑单一、可预测的操作。\n\
  \n因此，卡片模式是在空间高效的布局中结合信息和交互的有效方法之一。它将关键内容推向前沿，同时最大化了交互的触摸区域。虽然卡片特别适合移动端，但它们不是组织相关元素的唯一方法。重要的是无论你使用什么视觉模式，都要确保清晰、聚焦和宽敞的触摸目标。\n\
  \n## 二维滚动 (Two-dimensional scrolling)\n\n二维滚动是一种设计技术，用户可以在同一个界面内沿水平和垂直方向上导航内容。这种模式通常用于移动设备，允许高效地浏览大量内容而不会让用户感到不知所措。例如，用户可以垂直滚动馈或列表，并水平滚动类别或图库。\n\
  \n臭名昭著的轮播模式（carousel pattern，一种水平滚动的形式，通常实现为一系列可滑动的卡片或图像）在网页设计中因以下原因经常被批评：\n\n*\
  \   **无障碍性差**：轮播通常依赖动画或手势，这对于有运动障碍或使用键盘/屏幕阅读器导航的用户来说可能非常困难。\n*   **内容可见性**：重要内容可能隐藏在屏幕之外，使其更难被发现。许多用户从未与轮播控件交互，导致信息丢失。\n\
  *   **过度使用和误用**：轮播通常是为了美学目的而采用，而忽略了可用性和无障碍性，导致了糟糕的用户体验。\n\n然而，在移动设备上，二维滚动和轮播是至关重要的。它们允许用户快速导航大型数据集或类别，特别是在\
  \ Netflix 或在线商店等内容被组织成水平卡片行的应用程序中。如果没有轮播，寻找特定的电影或产品将需要无休止的垂直滚动。\n\n\n\n二维滚动与卡片布局非常契合，这使设计师能够最大化控制控件的可点击区域，同时以视觉组织化且易于访问的方式呈现内容。然而，务必确保水平滚动仅用于离散的内容组——而不是用于阅读或核心导航——以符合\
  \ WCAG 2.1 成功准则 1.4.10 重流（Reflow），该准则要求内容在调整大小或缩放时能够在不丢失信息或功能的情况下呈现。\n\n虽然二维滚动可以增强导航和效率，但它并不总是最佳选择。如果有太多可滚动区域竞争注意力，或者用户丢失位置，可能会引入认知过载。设计师应避免嵌套多个可滚动区域，并确保水平滚动有明确指示且易于操作。如果过度使用或实施不当，这种模式会阻碍可发现性并让用户感到沮丧，特别是对于依赖屏幕阅读器或切换访问（Switch\
  \ Access）的用户。请审慎使用它，并始终对真实用户进行测试。\n\n## 悬浮按钮\n\n移动端无障碍的一个挑战是在大触摸目标与有限的显示内容空间之间取得平衡。为了最大化可用空间，开发者通常使用固定位置的悬浮按钮——一种悬浮在其他\
  \ UI 元素之上的交互控件。这种技术允许下方的内容独立滚动，在不牺牲信息可见性的前提下，提供了更大、更易访问的触摸目标。\n\n![img](img/B32080_08_2.png)\n\
  \n图 8.2：悬浮按钮\n\n在网页设计中，悬浮按钮经常因可发现性差和焦点顺序混淆而受到批评。当用户使用键盘或辅助技术进行导航时，很难确定悬浮按钮在交互元素序列中的位置。这可能会损害对\
  \ WCAG 2.4.3 焦点顺序（Focus Order）和 1.3.2 有意义顺序（Meaningful Sequence）的符合性，这两项准则都要求逻辑且可预测的导航路径。此外，悬浮按钮可能会遮挡重要内容，导致可用性和无障碍问题，特别是对于依赖屏幕阅读器或切换访问的用户。\n\
  \n然而，在移动端设计中，悬浮按钮由于以下原因被广泛接受并证明有效：\n\n*   **平台标准**：iOS 和 Android 都提供了实现悬浮按钮的既有模式。这些指南包含了对尺寸、位置、交互和无障碍的建议。遵循平台规范可确保一致的用户体验。\n\
  *   **布局简单性**：移动端界面包含的交互元素通常比网页少，减少了焦点顺序出现混乱的可能性。此外，开发者可以利用平台内置工具，例如 Android 的 `ViewGroup`\
  \ 属性（`android:nextFocusForward` 等）和 iOS 的 `UIAccessibilityContainer` 协议，以无障碍的方式管理和自定义焦点顺序。\n\
  *   **用户预期**：由于广泛使用，许多用户已经习惯在移动应用中通过悬浮按钮执行主要操作——如撰写消息或添加新项目。然而，这种熟悉的模式对所有人来说可能并不直观或易于访问，特别是对于依赖屏幕阅读器、切换访问或键盘导航的用户。在考虑示能性（affordance）时，重要的是问问：谁能从这种模式中获益，谁可能被排除在外？有意图地设计意味着确保常用模式也能支持不同能力的用户。\n\
  \n在实现悬浮按钮时，请考虑这些最佳实践：\n\n*   **位置**：悬浮按钮通常放置在右下角（Android）或底部居中（iOS），以便在保持可访问的同时不阻塞关键内容。这种一致的放置也有助于视障用户，因为它允许辅助技术（如屏幕阅读器或切换访问）能够可靠地定位并描述按钮功能，减少猜测并支持高效导航。\n\
  *   **无障碍考量**：确保悬浮按钮为屏幕阅读器标记了适当的标签，并集成到焦点顺序中。通常，这意味着将它们放置在导航序列的末尾（主内容之后），这样它们就不会中断用户的阅读或任务流。除非上下文需要，否则动态重新定位其焦点（例如在模态框或基于步骤的工作流中）。iOS\
  \ 和 Android 都提供了无障碍 API，帮助开发者以可预测、用户友的方式进行管理。\n*   **一致使用**：仅对高优先级操作使用悬浮按钮，避免过多的悬浮控件填充界面。\n\
  \n## 扩展点击区域\n\n通常，交互控件（如按钮、复选框或输入字段）放在较大的布局容器内，特别是在列表或表单中。提高可用无无性的简单方法是将点击区域扩展到控件本身之外，包含周围布局。例如，与其只让小的复选框可点击，你还可以让关联的文本标签具有交互性，这样用户就可以点击该行的任何位置来激活复选框。这对于灵活性有限或使用单手触摸手势的用户特别有用。通过这种方式扩展触摸目标可以在不使界面混乱的情况下改善体验，是无障碍设计中的轻而易得。\n\
  \n## 利用工作流\n\n设计师经常因为尝试在单个屏幕内挤入过多内容或功能而受限于有限的空间困扰。更好的方法是将用户体验分解为可管理的工作流——即较小的、集中的交互，引导用户完成一系列步骤，而不是用杂乱的界面让他们崩溃。\n\
  \n考虑一个允许用户执行以下操作的移动银行应用：\n\n*   检查余额\n*   在账户之间转账\n*   支付账单\n*   存入支票\n\n如果所有任务都呈现在单个屏幕上，结果将是一个混乱、拥挤的界面，具有微小的触摸目标和糟糕的可用性。相反，工作流可以被拆分为独立的、流线化的屏幕（在这种情况下为四个屏幕），每个屏幕同时关注一个任务：\n\
  \n1.  **首页**：显示账户概述，并提供导航到特定任务的选项。\n2.  **转账工作流**：引导用户选择账户、输入金额并确认转账。\n3.  **账单支付工作流**：将过程分解为选择收款人、输入支付金额和设置计划。\n\
  4.  **支票存入工作流**：利用分步指导来拍摄支票、确认金额并提交存款。\n\n通过将复杂任务分解为专门的工作流，你可以提高可用性、无障碍性和可发现性。用户更不容易感到无所措从或出错，而且每个屏幕都可以针对更大、更易访问的触摸目标进行优化。\n\
  \n\n\n\n你知道可以使用鼠标与 Android 手机进行交互吗？或者有用户只使用键盘？你甚至可以插入摇杆，并开启 `Switch Control`（切换控制）或\
  \ `Switch Access`（切换访问）等辅助技术！\n\n幸运的是，在测试时，你通常可以将精力缩小到两类技术：\n\n1. 依赖无障碍层文本信息的输入技术（例如\
  \ iOS 上的 `VoiceOver` 或 Android 上的 `TalkBack`）\n2. 依赖于检测与控件交互的预期方式的输入方法（例如键盘或 `Switch\
  \ Access`）\n\n支持所有这些输入方法可能具有挑战性，特别是在构建自定义控件时。你可能并不总是能够访问复制某些行为所需的 API，即使存在这些 API，它们通常也是不完整的，或者难以以一致的方式实现。\n\
  \niOS 和 Android 都提供了稳健的无障碍层——如 `VoiceOver` 和 `TalkBack`——这些层与内置组件交互良好。这些平台还支持外部输入设备，如蓝牙键盘、切换器和自适应控制器。如\
  \ `Switch Control`（iOS）和 `Switch Access`（Android）等辅助技术可以桥接软件与硬件之间的差距，允许用户通过扫描界面或外部切换器与核心功能交互。\n\
  \n然而，不继承平台原生组件的自定义控件可能会破坏这种兼容性，导致令人沮丧或无法访问的体验。只要可能，请依赖内置功能并从原生组件进行扩展，以确保在多样化的输入生态系统中获得完全支持。\n\
  \n## 一个简单的设计规则：平台控件或自定义解决方案\n\n为了创建无障碍的多输入内容，遵循一个简单的直接设计规则至关重要：\n\n*    尽可能使用原生平台控件：依赖于\
  \ iOS 和 Android 提供的内置按钮、滑块、文本字段和其他 UI 元素。你可以直接使用它们，将它们组合以创建更复杂的组件，或者在保持其原始行为完整的基础上在其之上进行构建。这有助于确保你的应用程序能够与屏幕阅读器和\
  \ `Switch Access` 等辅助技术流畅地运行。\n*   如果需要自定义控件，请确保它们与辅助技术和输入设备的交互方式符合平台预期。\n\n其核心思想是利用内置平台控件（如按钮、滑块或文本输入），或使用平台自身的无障碍框架对其进行扩展。当你使用原生控件或在其基础上进行构建时，无障碍功能（如键盘支持、屏幕阅读器兼容性和触摸交互）将由操作系统处理。\n\
  \n当你偏离使用平台原生控件并依赖自定义实现（例如自定义手势识别器）时，就会面临破坏与辅助技术兼容性的风险。这些自定义手势可能无法被屏幕阅读器、键盘或其他输入设备检测到，导致依赖这些工具的用户体验糟糕。\n\
  \n开发者随后必须投入大量精力来复制操作系统本会自动提供的无障碍行为。这会导致不一致性增加，并随着时间的推移导致无障碍性下降，特别是在平台演进时。\n\n* \
  \    《网页内容无障碍指南 (WCAG)》考虑到某些应用程序可能需要自定义交互。例如：\n    *   标准类应用（例如银行类 App）：应尽可能遵循原生控件，以确保在所有输入模态下的无障碍性。\n\
  \    *   游戏或创意类应用：通常需要典型平台控件未涵盖的自定义手势和交互。可能仍提供无障碍支持，但预期会有自定义解决方案。\n\n现在，为了成功支持用户与移动操作系统交互的所有不同方式，你必须坚持生态系统所提供的能力。这在不同的操作系统之间可能有所不同。让我们来看看\
  \ Android 和 iOS。\n\n## Android 键盘支持\n\n与 iOS 不同，Android 键盘与操作系统的交互更像传统的桌面键盘，具有可管理的焦点导航和制表符（tabbing）行为。这可以追溯到\
  \ Android 早期，当时设备包含物理滚轮和方向键。滚轮导航、键盘支持和摇杆式输入都是原始设计思维的一部分，这些基础直到今天仍影响着 Android 的无障碍支持。\n\
  \n例如，考虑一个带有两个文本字段和一个按钮的简单登录界面：在 Android 上，连接的键盘（通过 `USB-C` 或蓝牙）允许用户使用 `Tab` 键在字段之间导航，并使用\
  \ `Enter` 键激活按钮——这些行为都是操作系统原生支持的。在 iOS 上，蓝牙或 Lightning 连接的键盘工作方式不同：键盘导航需要用户启用如 `Full\
  \ Keyboard Access`（全键盘访问）、`Voice Control`（语音控制）或 `Switch Control` 等辅助技术才能元素之间移动。即使如此，开发者也必须确保无障碍\
  \ API 正确暴露可聚焦元素，以使这种导航变得可靠。\n\n## iOS 键盘支持\n\niOS 和 Android 支持硬件键盘的方式有所不同，因为它们对键盘的底层处理方式完全不同。对于\
  \ iOS 硬件，键盘接受输入并将其转换为与软件键盘类似的信号。\n\niOS 的不同之处在于，它默认不支持像 Android 那样的全键盘焦点导航。你可以连接并使用外部键盘（通过蓝牙\
  \ `Bluetooth` 或 `Lightning`）到 iPhone 或 iPad 上输入并执行某些基本操作，无需启用任何辅助技术。然而，要使用方向键或制表式导航更全面地导航界面元素，用户必须启用如\
  \ `Full Keyboard Access`、`Switch Control` 或 `Voice Control` 等辅助技术。特别是 `Full Keyboard\
  \ Access` 释放了更广泛的导航和交互模式，但它也改变了屏幕键盘的行为——例如，在连接外部键盘时禁用它。\n\n许多应用程序受益于开箱即用的良好键盘支持，因为\
  \ iOS 和 Android 都使用深度优先树遍历确定默认焦点顺序。这意味着系统根据代码中元素的结构，从上到下、从左到右（在某些语言区域为从右到左）检查用户界面层级。当开发者使用原生组件并保持逻辑视图层级时，焦点顺序通常“开箱即用”。但对于自定义界面或不常见的导航需求，开发者可能需要干预并定义一个更直观的焦点路径。\n\
  \n## 理解移动无障碍中的焦点顺序\n\n\n\n\n当用户使用屏幕阅读器或键盘等辅助技术导航应用程序时，焦点顺序决定了访问交互式元素的序列。确保逻辑清晰的焦点顺序对于无障碍性至关重要。\n\
  \n移动操作系统通过对界面层级进行深度优先的树遍历来计算焦点顺序。这意味着系统从最顶层的父控件开始，在移动到下一个兄弟控件之前，检查每个子控件。在在此遍历过程中遇到项目的顺序定义了默认的焦点顺序。\n\
  \n与基于网页的屏幕阅读器（或 macOS 上的 VoiceOver，它们可能将嵌套控件视为单个分组元素）不同，像 iOS 和 Android 等移动操作系统通常将嵌套控件视为独立的、分离的元素。例如，如果你在一个卡片组件（card\
  \ component）内部有一个按钮，在移动设备上，每个元素将独立地接收焦点，这允许了更细粒度的导航，但需要结构良好的焦点顺序以防止混淆：\n\n*   **Web\
  \ 环境（macOS 上的 VoiceOver）：** 取决于 HTML 和 ARIA 角色的实现方式，可能会将卡片视为单个分组控件。如果容器使用了适当的地标（landmarks）或角色，且按钮有正确的标签，VoiceOver\
  \ 可能会独立地导航到按钮，但在没有清晰结构的情况下，它可能仅被描述为组的一部分。\n*   **移动环境：** 卡片和按钮都被视为不同的元素，每个元素独立地接收焦点。\n\
  \n这种差异对无障碍性有益，但只有在焦点顺序规划正确时才如此。定义不当的焦点顺序可能会导致依赖辅助技术的用户产生困惑和沮丧的体验。\n\n作为一名工程师，你需要关注的事情有：\n\
  \n*   确保你的视图层级（view hierarchy）结构良好，并以合理的方式布局（即：避免使用绝对布局和重新定位项目）。\n*   用户可以交互的控件是否被识别为可操作的（actionable）。\n\
  \n虽然默认遍历对于许多应用程序效果良好，但经过熟熟的设计和结构良好的 UI 层级通常可以消除对手动自定义的需求。在需要自定义焦点顺序的情况下，开发者应该确保它能为所有用户提供逻辑化、直观的体验。以下是有效管理焦点顺序的一些常用技术：\n\
  \n*   **使用 API 显式设置焦点顺序：** 当默认焦点遍历与预期的用户体验不符时，开发者可以使用特定平台的 API 来定义所需的焦点路径。Android\
  \ 提供了如 `focusNext()`、`focusPrevious()`、`focusUp()`、`focusDown()`、`focusLeft()` 和\
  \ `focusRight()` 等方法来显式引导焦点移动。iOS 通过 `UIAccessibility` 框架提供了类似的控制。\n*   **定义无障碍性容器\
  \ (iOS)：**在 iOS 上，开发者可以使用 `accessibilityContainer` 属性将相关元素分组。这允许他们控制 VoiceOver 如何遍历复杂的\
  \ UI 层级，确保用户按逻辑顺序遇到内容。\n*   **设置无障碍性焦点顺序 (Android)：** Android 的 View 层级允许开发者使用 `android:nextFocusForward`、`android:nextFocusLeft`、`android:nextFocusRight`\
  \ 和 `android:nextFocusUp` 等属性指定可聚焦元素及其遍历顺序。这在构建自定义控件或修改默认导航模式时特别有用。\n*   **程序化控制焦点：**\
  \ 开发者可以使用 `requestFocus()` (Android) 或 `becomeFirstResponder()` (iOS) 等函数程序化地请求特定元素的焦点。这种技术对于引导用户通过特定工作流或突出重要内容很有帮助，但应节节使用。\n\
  *   **利用焦点管理库：** 在复杂的应用程序中，使用提供焦点管理工具的第三方库可以简化过程。这些工具通常提供更高层次的抽象来控制焦点顺序，从而更容易确保整个应用程序的无障碍性一致性。\n\
  *   **测试并优化焦点顺序：** 使用各种辅助技术（例如屏幕阅读器、键盘、切换控制 Switch Control）测试焦点顺序对于确认导航是否逻辑且直观至关重要。根据用户反馈优化焦点顺序可以显著增强应用程序的无障碍性。\n\
  \n# 针对所有用户的易可用性\n\n正如我们在书中所涵盖的，有时为了无障碍性而做的事情仅仅就是把事情做对。我们可以考虑几点，这些点对所有用户都有益，同时能为那些使用替代输入设备的用户节省大量时间。\n\
  \n两个平台都提供了一个经常被忽略的功能：自定义提交按钮上显示的文本的能力。例如，在移动设备上，通常显示“确定”或“前往”的按钮可以更改为特定的内容，如“搜索”或“发送”，取决于所需的的操作。当用户完成\
  \ `Text` 字段的填写后，有很多种合理的操作可以进行：移动到下一个字段、提交表单、“前往”某个网页等。思考用户在按下 `Enter` 键时期望会发生什么，并为他们提供这种上下文提示。\n\
  \n此外，作为 Android 用户，返回键操作非常重要。每部 Android 手机都有自己的交互返回操作的方式——在某些设备上，它是一个专用硬件按钮；在另一些设备上，它是具有预留位置的软件按钮（除非在全屏应用中）；甚至可以是从屏幕左边缘执行的手势。无论如何，考虑在每种情况下返回操作应该做什么是非常重要的。通常，默认行为是良好的，但你经常也会想要对其进行自定义。\n\
  \n良好的行为通常意味着返回操作符合用户预期，例如导航到上一个屏幕或退出模态。糟糕的行为可能涉及意外退出应用、丢失未保存的数据，或者由于在导航栈中返回过远而破坏了用户流。\n\
  \n自定义返回操作可能：\n\n*   在离开关键流程之前通过提示用户防止意外退出（例如丢弃未保存的更改）。\n*   将用户重定向到特定屏幕而不是上一个屏幕，这对于引导工作流或保持导航结构很有帮助。\n\
  *   触发应用程序内的特定操作，例如关闭菜单或折叠 UI 元素，而不是完全退出。\n\n定制返回操作可以确保用户获得无缝且直观的体验，特别是当默认行为不符合应用设计或用户流时。\n\
  \n# 为无障碍性设计语音界面\n\nApple 和 Android 倾向于镜像彼此操作系统的功能。当新功能出现在其中一个系统中时，你可以确定另一个也意识到了，并且不久后，它通常会以自己的方式出现在另一个系统中。同样的逻辑也适用于无障碍性领域。\n\
  \n\n\n\n例如，两个生态系统都支持用户开启语音激活的辅助技术。在 Android 中，它被称为 `Voice Access`，在 iOS 中，它被称为 `Voice\
  \ Control`。`Voice Access` 和 `Voice Control` 的工作原理从根本上来说是相同的。激活后，用户可以通过结构化的语音命令与设备进行交互，例如：\n\
  \n*   “点击 {Control Identifier}”：此命令允许用户通过引用其可访问标签（accessible label）来激活特定的交互元素（例如“点击提交”或“点击加入购物车”）。为了确保此功能可靠地运行，控件必须具有清晰、唯一且具描述性的\
  \ `accessibilityLabel` (iOS) 或 `contentDescription` (Android)。避免使用模糊或重复的标签，因为这可能会混淆语音交互系统，并导致操作失败或选择错误。\n\
  \n*   “显示名称”：此命令提示语音控制系统显示屏幕上所有交互元素的可访问名称。它允许用户看到哪些元素已标记标签并可以使用语音命令进行直接交互（例如使用“点击发送”）。如果一个元素没有可访问名称，它将不会显示，这可能导致关键操作被忽略。为了支持此功能，请确保所有可操作元素都具有清晰、简洁的\
  \ `accessibilityLabel` (iOS) 或 `contentDescription` (Android) 值。\n\n*   “显示数字”：此命令在所有识别出的交互元素上覆盖数字，允许用户通过说“点击\
  \ 5”等进行交互。这在元素没有明显或可见标签时特别有用。然而，未识别的或编码不当的元素可能不会被编号，从而产生障碍。确保每个交互控件都暴露在辅助功能层，以便在需要时可以检测到并编号。\n\
  \n*   “向上/向下滚动”：此命令允许用户垂直导航可滚动的内容，如列表或馈送。这对于具有动态内容或长页面的界面尤为重要。确保滚动区域在辅助功能树中被正确标记，以便辅助技术可以检测到。代码不良好的容器或隐藏的溢出可能会导致此命令无法按预期工作。\n\
  \n*   “增加/减小 {Control Identifier}”：此命令调整调节器（steppers）、滑块或数字字段等控件的值（例如“增加数量”或“减少音量”）。为了语音交互成功，控件必须正确标记，并使用平台原生组件或暴露其角色和操作的可访问自定义控件来实现。如果没有这些，用户可能无法通过语音更改值，从而限制了运动障碍人士的访问性。\n\
  \n设计与语音激活辅助技术无缝协作的内容，需要确保您的界面具有良好的可访问性并对语音命令做出响应。可以通过以下方式实现：\n\n*   使用语义化 HTML：具有清晰标题、标签、按钮和链接的结构化\
  \ HTML 使得语音技术能够更准确地解释内容。\n\n*   提供描述性标签和 alt 文本：确保所有交互元素（如按钮和表单字段）具有描述性标签，且该标签与可见的文本标签完全匹配——或至少包含它。这种对齐有助于用户发布准确的语音命令（例如“点击提交”），并确保辅助技术能够正确将语音命令与目标元素关联起来。对于图像，使用描述性的\
  \ alt 文本或将其标记为装饰性，以确保屏幕阅读器和其他语音激活工具的访问性。\n\n*   确保导航一致性：可预测且清晰的导航结构有助于语音命令顺利运行。用户应该能够使用简单一致的语音命令到达界面的每个部分。\n\
  \n*   使用语音激活工具进行测试：定期使用 `Google Assistant`、`Siri`、`Alexa` 或 `Dragon NaturallySpeaking`\
  \ 等流行工具测试您的设计，以确保兼容性和可用性。\n\n*   提供键盘可访问性：由于许多语音激活工具通过模拟键盘命令与内容交互，确保完全的键盘可访问性至关重要。\n\
  \n虽然用户有时可以绕过设计糟糕的内容，但确保您的网站遵循这些原则会让他们的体验更快、更流畅、更直观。\n\n## 识别控件\n\n语音激活辅助技术的一个共同需求是识别用户想要交互的控件。这在两个生态系统中的工作方式不同：\n\
  \n*   iOS：`Voice Control` 期望非常结构化的准确命令，并带有精确标识控件的标签。\n\n*   Android：`Voice Access`\
  \ 接受不那么精确的命令，并在没有精确标签时会尝试猜测用户想要的是哪个控件。\n\n由于如此，iOS 对控件标记有更严格的预期。然而，它也为开发者提供了管理这些问题的工具，例如可以将\
  \ `accessibilityLabel`（用于识别控件）与 `accessibilityValue`（用于传递其当前状态或内容）分开。例如，一个应用折扣码的按钮可能有一个\
  \ `accessibilityLabel` 为“应用折扣”，而 `accessibilityValue` 为“已输入代码 SAVE20”。这允许语音控制用户说“点击应用折扣”的同时，获得关于当前代码的反馈而不产生混乱。确保\
  \ `accessibilityLabel` 简洁并以操作为导向，作为一个可靠的标识符。\n\n## 避免嵌套控件\n\n`Voice Access` 和 `Voice\
  \ Control` 都通过向控件中心发送虚拟点击来激活元素。这通常运行得良好，但在某些情况下，控件的中心实际上并不是正确的目标。如果另一个控件嵌套在正在激活的控件之上，并且恰好位于中心点，可能会导致用户无法激活包含性控件。\n\
  \n嵌套交互目标的替代方案是使用自定义操作。通过为组件内的操作命名，可以避免拥有多个交互目标，同时允许用户使用类似“显示 {Control Identifier}\
  \ 的操作”的语法。这允许您为一个控件关联多个操作，同时避免嵌套控件问题。\n\n除了自定义操作外，设计可访问语音界面的有效方法还包括：\n\n*   分组相关控件：不要将每个控件视为独立目标，而是将相关项目分组到一个单一的、标识的控件下。这减少了所需的交互次数并简化了导航。\n\
  \n*   提供上下文反馈：确保用户在发布命令时收到即时且相关的反馈。这有助于确认他们的操作，并在需要重新尝试时引导他们。\n\n*   确保术语一致性：在整个界面中使用一致的措辞和命名规范。这可以最大限地减少认知负担并使交互更加直观。\n\
  \n*   支持错误恢复：当发布未识别的命令时，提供清晰的指令或提示。允许用户询问可用操作（例如“我在这里可以做什么？”）可以显著提高体验。\n\n这些方法有助于为依赖交互的用户创建更流畅、更直观的体验。\n\
  \n\n\n\n\n移动开发人员面临的最大挑战之一，是针对极其多样的设备进行设计，从紧凑型手机到平板电脑、手表以及连接的外部显示器。更复杂的是还需要支持动态显示缩放和用户可调节的文本大小，这两者对于无障碍（accessibility）至关重要。\n\
  \n支持广泛的设备不仅仅是技术要求，它是创建包容性体验的关键。例如，`WCAG` 准则 `1.4.10`（重流/Reflow）要求内容在放大至 `400%` 时，可以在不丢失信息或功能的情况下进行查看，这对应于竖屏模式下\
  \ `320px` 宽视口。同样，`WCAG` SC `1.4.4`（调整文本/Resize Text）要求用户在不使用辅助技术的情况下，可以将文本大小调整至\
  \ `200%` 且不破坏布局或可用性。\n\n根据 `Test Sigma` 的数据，2023 年常见的移动屏幕分辨率是 `360×800`（市场份额占 `11.02%`），其次是\
  \ `390×844`（`7.93%`）和 `414×896`（`5.56%`）。但成功的设计不在于命中特定的分辨率，而在于支持灵活、响应式的布局，这些布局能够优雅地适应任何屏幕尺寸或缩放级别。\n\
  \n尽管如此，用户期望在他们的所有设备上获得支持，而你几乎无法控制应用程序将运行在哪些设备上。这种复杂性在 `Android` 上被放大了，因为像 `Samsung`\
  \ 等制造商通常会自带浏览器和默认屏幕阅读器，这可能会影响无障碍行为。在 Apple 设备上，`iOS` 和 `iPadOS` 之间的区别虽然较少，但仍可能对辅助技术和布局行为产生性影响。\n\
  \n## 信息密度\n\n我们可以通过简单地将设备尺寸和显示缩放视为不同的信息密度配置，将这两个概念联系起来。例如，考虑一个显示缩放最小的 `4”` 寸设备和一个显示缩放最大的\
  \ `6”` 寸设备。这两种配置可能具有相同的信息密度，即使在 `4”` 屏幕上内容看起来更小——无论如何，屏幕上容纳的内容是相同的。\n\n基于这种机制，我们可以将生态系统分为三类信息密度：\n\
  \n*   **高**：显示缩放设置为默认或更高的小型 `4”-5”` 寸设备。\n*   **中**：`5”-7”` 寸设备、大手机，显示缩放低于默认值。\n\
  *   **低**：具有较低显示缩放设置的 `7”` 寸设备以及更大的平板电脑形态。\n\n为了在不覆盖所有屏幕分辨率的情况下简化测试，开发者可以根据常见的屏幕特征对设备进行分组。典型类别包括小手机（如旧款\
  \ `Android` 机型或紧凑型 `iPhone`）、标准手机（现代 `iPhone` 和 `Android`）、大手机或大平板手机（`Galaxy Note`\
  \ 系列、`iPhone Plus/Pro Max`）、平板电脑（`Pads`、`Galaxy Tabs`）以及折叠屏（`Galaxy Z Fold`、`Surface\
  \ Duo`）。\n\n开发者应该为每个类别中的代表性设备进行设计，而不是单独测试每一个设备。例如，`iPhone 14 Pro Max` 可以代表大手机，而\
  \ `iPad Air` 可以代表平板电脑。这种方法确保了高效覆盖，而避免了过度测试。\n\n应用响应式设计原则——如灵活的布局、可缩放的字体和自适应的 UI\
  \ 元素——有助于适应不同的屏幕尺寸和密度。`CSS` 媒体查询、`viewport units` 和相对大小计算支持了这种适应性。\n\n测试应该包含模拟器和真机，以验证你的设计是否能对不同的屏幕尺寸、分辨率和缩放设置做出适当响应。虽然模拟器可以加快早期测试，但它们并不总是能捕捉辅助技术在物理设备上的行为细微差别，因此真机测试仍然至关重要，特别是对于无障碍设计。为了满足\
  \ `WCAG` 合规性，在各种输入方法、屏幕尺寸和设备类型上进行彻底测试至关重要。虽然基于代表类别的测试可以帮助简化流程，但它绝不能取代确保包容性、符合标准的体验所需的所需的严谨工作。\n\
  \n## 自适应布局\n\n当你开始在不同的信息密度下测试应用程序时，你无疑会遇到应用程序在某种密度下运行不佳的情况。在这些情况下，允许应用程序根据其的设备以不同的方式使用空间可能会有所帮助。这里有几种常用技术：\n\
  \n*   在多列布局中添加一列或更改列数。\n*   让应用程序的某个永久可见，例如左侧的菜单。\n*   将应用程序拆分为多个窗格，例如在主详情工作流（master\
  \ detail workflow）中。\n\n你你也可以考虑带有自适应布局的自定义设计解决方案，但重要的是，你的开发者需要考虑上述方法中从平台布局容器中免费获得的内容。这可能会导致\
  \ UI 代码出现不一致和 Bug，且难以完全纠正。在利用平台工具与实现设计目标之间取得平衡，在设计过程早期就予以考虑很重要。\n\n## 利用标准工具\n\n\
  最后的建议是利用平台创造者的经验。`Apple` 和 `Google` 主导了这一生态系统，是因为他们做好了充分的研究，并了解自己的平台和用户。他们对自己平台的未来方向拥有很大的控制权，并尽力提供后兼容，特别是对于它们各自设计指南中记录的生态系统方面：\n\
  \n*   **Apple**：用户界面指南 (`https://developer.apple.com/design/human-interface-guidelines`)\n\
  *   **Android**：Material 设计指南 (`https://m3.material.io/`)\n\n通过利用这些文档中的知识和组件，你可以通过使用系统组件并设计符合平台现有功能的应用程序，从而节省时间并减少维护痛苦。过度超出这个圈子将让你在致力于为用户提供新体验的生态系统中苦苦挣扎。\n\
  \n\n\n\n\n本书的最后一个章节探讨了如何将无障碍性从单个界面扩展到组织实践、团队文化以及新兴技术中。这四个章节将帮助你通过关注包容性移动设计、测试与修复策略，以及培养全公司对无障碍性的承诺，深化你的影响力。\n\
  \n你将学习如何针对移动端触摸和语音交互进行设计，如何使用自动化工具和人工审计来评估无障碍性，以及构建服务广泛用户需求的包容性设计系统。最后，本节以创建一个可持续无障碍文化的路线图作为结束——这种文化基于同理心、共同责任、可衡量的进展和持续学习。这些章节共同助力，使团队能够从被动修复转向主动的包容性设计领导力。\n\
  \n此部分包含以下章节：\n\n*   `第 9 章, `新兴技术中的无障碍性：VR、AR 和 AI`]`\n*   `第 10 章, `无障碍设计系统模式的基础`]`\n\
  *   `第 11 章, `无障碍评估与优先排序工具与技术`]`\n*   `第 12 章, `构建包容性设计文化：组织策略`]`\n\n# 9\n## 新兴技术中的无障碍性：VR、AR\
  \ 和 AI\n\n*Keith Newton 博士*\n\n在我写这一章时，我发现了历史上最有趣、免费、在线且浪费时间的工具之一！我登录了 [labs.google.com](https://www.labs.google.com)\
  \ 并点击了 `Viola the Bird`。这个 AI 实验让任何人（无论是否有音乐知识）都能演奏一种大提琴灵发的乐器。Viola 用一条腿支撑乐器，另一条腿保持平衡，并用喙子夹住弓。用户可以使用鼠标控制这只非常有热情的鸟来演奏《欢乐颂歌》、《霍斯特《行星组》中的《木星》、圣诞歌曲等曲目。音乐会根据弓的速度、位置，以及音符的时机和配乐安排进行实时调整。它超级酷且有趣，但遗憾的是，由于实现方式的原因，它错失了大部分潜在用户。\n\
  \n别误会，我非常`爱` `Viola the Bird`。我完全想象在办公室的某处，创造者坐在办公椅上，笔记本电脑打开着开发了数月的尖端 AI 原型，团队的每个人都对下一个“革命性的个性化内容平台”感到兴奋，投资者也急于看到它上线。尽管如此，残酷的事实是，该原型只能通过鼠标进行导航和操作。使用屏幕读取器的用户没有提供文本替代方案，且产品动画不符合用户运动准则。\n\
  \n如果 `Viola the Bird` 采用更具包容性的思维来实现，会怎样？团队是否可以实现键盘导航、在鼠标外增加使用方向键实现运动控制，并为内容标记文本替代方案？这样，同时患有视觉和运动残障的用户就能以公平的方式导航和操作\
  \ Viola，让他们能够享受演奏这些曲目并分享这款产品的喜悦。这个系统不会是完美的，但它将对所有人都是`欢迎的`。\n\n本章探讨了由诸如`虚拟现实 (VR)`、`增强现实\
  \ (AR)` 和`人工智能 (AI)` 等新兴技术带来的无障碍挑战与机遇，讨论了在让具有各种残障的用户获得沉浸式 VR 体验的无障碍化方面的独特考虑。本章重点关注信息呈现和交互，同时研究了\
  \ AI 在增强无障碍性方面的作用以及潜在偏见。\n\n在本章中，我们将涵盖以下主题：\n\n*   针对各种感官能力调整 VR 体验\n*   通过定制增强\
  \ AR 无障碍性\n*   利用 AI 自动化无障碍实践的纳入\n*   减轻 AI 驱动界面中的算法偏见\n\n# 针对各种感官能力调整 VR 体验\n\n\
  `虚拟现实 (VR)` 是一种模拟三维计算机生成环境并通过专用头戴设备或装置让用户沉浸其中的技术。通过跟踪头部动作（通常还带有手部控制器），VR 允许人们查看内容、导航景观甚至实时操作虚拟物体。\n\
  \nVR 已被各行业采用：从游戏、娱乐到教育和专业培训，在这些领域中，对环境的沉浸式模拟包括限于医学、航空和工业安全。\n\n然而，正是这些让 VR 如此引入胜的元素——如全\
  \ 3D 环境、动态运动和真实的音频——也可能为残障用户带来障碍。例如，视觉受损的用户如果没有提供强有力的音频提示或触觉反馈，可能难以识别游戏内元素。聋人或听力受损的用户可能会错过仅通过对话或音效传递的关键剧情点或谜题提示，而行动受限的人可能会发现握持或操作控制器的物理要求难以或无法管理，或者发现剧烈运动会引发其他前庭系统疾病的眩晕或恶心。\n\
  \n由于每种设计选择（从界面元素到导航方法）都可能启用或排除某些用户，因此在深入开发之前承认潜在用户的各种能力和需求是有帮助的。此外，反思如何系统地评估和完善\
  \ VR 体验以更好地服务更广泛的参与者也是有用的。\n\n## 提高 VR 无障碍性的便利措施\n\nVR 为用户提供了一系列可定制的体验，但也可能给残障人士带来挑战。以下列表列出了优势、挑战和便利措施，以及提高所有用户感知、可操作性和理解的策略示例，同时为那些具有行动、视觉、听力、认知和运动相关残障的用户提供了特定的适配方案：\n\
  \n*   **行动能力便利措施：**\n    *   **挑战：** 运动控制通常需要特定的身体姿势，精确的交互可能会产生障碍。\n    *   **解决方案：**\
  \ 为所有操作提供替代输入方法（语音命令、眼动追踪），启用控制重映射，允许调整输入敏感性，并包含个性化行动支持的专用工具。\n*   **视觉便利措施：**\n\
  \    *   **挑战：** 阅读文本可能很困难，颜色区分可能具有挑战性，眼镜可能会引起不适，屏幕读取器的兼容性有限。\n    *   **解决方案：**\
  \ 提供可调整的字体大小和对比度、事件触觉反馈、所有内容的视觉和非视觉标签，以及环境的音频描述。\n*   **听力便利措施：**\n    *   **挑战：**\
  \ 空间音频设计可能不一致，方向性声音可能难以定位，对语音聊天的依赖会限制无障碍性。\n    *   **解决方案：** 结合单声道选项，提供自定义字幕和视觉提示，包含手语头像，并提供可调整的左右音频平衡。\n\
  *   **认知便利措施：**\n    *   **挑战：** 用户可能会经历感官过载、迷失方向、时间管理不当以及界面过于复杂。\n    *   **解决方案：**\
  \ 利用瞬间传门按钮，提供易于重新定位的选项和可缩放的 UI/HUD，提供分步教程，并包含引导式交互。\n*   **晕症缓解：**\n    *   **挑战：**\
  \ 虚拟运动与现实运动之间的感官不匹配会导致不适。\n\n\n\n\n\n### 解决方案\n采用更高的帧率、使用瞬移移动代替平移动、允许用户限制摄像移动、利用散热扇、集成触觉反馈以及允许逐渐曝光。\n\
  \n### 其他考虑\n\n#### 挑战\n闪烁图像可能触发发作，`XR` 技术可能导致眩晕，用户在使用后可能面临重新调整的困难。\n\n#### 解决方案\n\
  限制闪烁图像、使用淡入过渡进行瞬移，并允许在环境中进行分步适应。\n\n## 虚构案例研究：虚拟逃脱室\n\n考虑一家跨国公司决定为所有员工设计的虚拟逃脱室中举办季度团队建设活动。其主要目标是通过让参与者协作解谜、分享见解并实时庆祝小胜利，来促进跨部门关系的发展。通过参与这一共同挑战，同事们应该建立信任和和谐关系，离开时带着更强的同谊感，并对每位参与者的独特技能产生新的赞赏。\n\
  \n然而，让我们想象某些用户患有前庭功能障碍——这些影响平衡和空间定位的疾病通常会导致头晕、眩晕和方向感缺失。以下调整措施强调了开发者可以使用的关键策略，以减少方向感缺失、稳定用户视角，并确保\
  \ `VR` 项目变得更具包容性，最终对前庭障碍患者更具吸引力：\n\n#### 瞬移或舒适移动：\n* **定义：** 用户不是通过平滑、连续的行走或飞行穿越环境，而是“跳转”到目标位置或进入“低速”模式。\n\
  * **重要性：** `VR` 中突然或持续的运动可能会引发强烈的不适感或动症。瞬移/舒适模式减少了视觉运动与物理运动之间的差异。\n\n#### 稳定的参考系：\n\
  * **定义：** 虚拟地平线、驾驶舱或其他在用户移动时保持固定的静态元素。\n* **重要性：** 一致的参考点有助于对抗方向感缺失，锚定用户的平衡并减轻前庭压力。\n\
  \n#### 可调视野 (FOV)：\n* **定义：** 允许用户收窄视野或开启暗角效果（vignette），通过在移动期间消除分散注意力的背景细节将注意力集中在主体上。\n\
  * **重要性：** 周围视觉会放大动症。在移动期间调整或减少 `FOV` 可以减轻视觉输入的强度。\n\n#### 轻松访问暂停和休息：\n* **定义：**\
  \ 清晰的暂停或退出 `VR` 环境的选项，以及活动中的自然断顿点。\n* **重要性：** 在出现不适时快速退出的能力有助于用户在症状恶化之前进行管理，从而鼓励持续参与。\n\
  \n#### 迭代用户测试与反馈：\n* **定义：** 邀请已知对运动敏感的参与者测试早期原型，并在最终体验中提供反馈机制。\n* **重要性：** 患有前庭疾病的用户比通用指南更可靠地识别出隐藏的触发因素或问题，为更具针对性的改进提供参考。\n\
  \n这种包容性方法最终使所有人受益。这些调整让前庭不适的人员能够公平地参与到环境中，并让他们像往一样加强跨部门关系，并参与到支持性、创新且凝聚的组织文化中。\n\
  \n通过优先考虑包容性，组织营造了一个让所有员工都能充分参与并蓬勃发展的环境。在此基础上，让我们探索如何通过定制 `AR` 来进一步增强可访问性。\n\n# 通过定制增强\
  \ AR 可访问性\n\n增强现实 (AR) 通过直接在周围环境中叠加虚拟元素（如文本、图像和交互功能），改变了人们接触数字内容的方式。与将个人沉浸在完全数字世界中的\
  \ `VR` 不同，`AR` 利用手机、平板电脑或头戴式设备上的摄像头、传感器和专用软件来增强而非取代物理环境。\n\n这种方法已被许多领域采用：在零售领域，客户可以虚拟“试穿”产品；在现场培训中，工人可以看到叠加在机器设备上的实时指令；在教育环境中，学生可以更深入地探索历史文物或科学过程的分层视图。\n\
  \n`AR` 潜力的一个引人注目的说明是“智慧城市”概念，游客使用 `AR` 应用访问附近位置的增强细节。用户可以将手机指向建筑以查看其修复的 3D 时间线，或扫描街牌以获取该地区的更多细节。这些功能有助于将被动访问转变为互动叙述体验。\n\
  \n`AR` 与 `VR` 类似，可能会为残障用户带来障碍。视力障碍者可能难以看到小字或低对比度的文本；聋哑或听力受损的游客需要音频叙述的字幕或手语替代方案；行动能力受限的人可能会发现长时间举持设备或执行精确手势非常疲劳。此外，认知能力受限的人可能会被屏幕上多个图层的杂乱信息困扰。\n\
  \n这些挑战强调了以用户为中心的设计的重要性。每一个界面决策——无论是字体大小、颜色对比度，还是数字叠加如何以及何时出现——都会促进或阻碍可访问性。通过与多样化的用户组进行测试、收集迭代反馈并相应优化\
  \ `AR` 实现，开发者和机构能够创建更具包容性和公平性的体验。\n\n## 设计包容性的 AR 体验\n\n`AR` 与 `VR` 类似，为残障带来了带来了挑战。以下列表列出了提高\
  \ `AR` 环境感知、操作和理解挑战及解决方案，解决了与移动、视觉清晰度、音频提示和认知负载相关的问题：\n\n#### 行动调整：\n* **挑战：** 与\
  \ `AR` 元素的交互可能需要精确的手势或特定的物理位置，这在动态现实环境中可能是挑战性的。\n* **解决方案：** 提供替代输入方法（语音命令、固定位置的单触虚拟按钮），开启手势敏感度调整，并提供自定义的控制方案以支持更平畅的交互。\n\
  \n#### 视觉调整：\n* **挑战：** 由于光线变化、背景干扰以及虚拟元素与物理环境之间的对比度不足，`AR` 内容可能难以阅读或解释。\n* **解决方案：**\
  \ 提供可调的字体大小、对比度和亮度设置；实施高对比度模式；并允许用户重新定位或调整 `AR` 叠加的大小以增强清晰度和可读性。\n\n#### 音频调整：\n\
  * **挑战：** `AR` 对音频提示的依赖对听力受损的用户可能是个问题，环境噪音可能会进一步干扰音频清晰度。\n* **解决方案：** 集成可自定义的字幕和说明，提供视觉音频报警，并提供单声道或可调音频平衡的选项。\n\
  \n#### 认知调整：\n* **挑战：** 同时呈现数字和物理信息可能会导致认知过载、困惑或分心。\n\n\n\n\n\n## 解决方案\n简化用户界面，提供清晰的步骤级指导，使用一致且直观的设计模式，并允许用户自定义显示信息的密集程度。\n\
  \n## 虚拟案例研究：博物馆中的可定制 AR 叠加层\n\n考虑一家著名的博物馆，它推出了一款 AR 手机应用程序，以丰富所有游客的体验，特别是听障人士。其主要目标是为每个展品提供深度背景，让观众扫描绘画或雕塑以获取补充信息、历史背景和策展见解。通过参与这些数字叠加层，游客可以探索作品背后的隐藏故事，并对博物馆收藏产生更深欣赏。\n\
  \n然而，某些用户可能在视觉信息方面遇到困难。以下策略强调了设计 AR 界面的最佳实践，为用户提供等效的替代方案：\n\n### 可定制文本和视觉元素\n- **定义**：提供增加字体大小、更改颜色或对比度、以及开启/关闭某些叠加层的选项。\n\
  - **重要性**：视力水平或色彩感知能力不同水平的用户可以根据自己的偏好定制界面，确保关键信息可见且易读。\n\n### 多模态反馈\n- **定义**：通过音频提示、触觉震动或手语视频嵌入来增强视觉线索以提供上下文。\n\
  - **重要性**：聋哑或听力障碍的用户受益于文本或手语替代方案，而视障用户则可能依赖语音指导或独特的触觉警报。\n\n### 图层切换和简化视图\n- **定义**：允许用户根据个人需求启用或禁用特定的内容“层”（例如：位置标记、字幕、手语叠加层）。\n\
  - **重要性**：减少屏幕上的杂乱和认知负荷，让所有游客都能专注于与他们最相关或最易获取的细节。\n\n### 一致且清晰的标记\n- **定义**：确保每个交互元素（按钮、AR\
  \ 触发器、弹出窗口）都使用描述性标签、文本替代方案或语音注释。\n- **重要性**：使用屏幕阅读器或手语功能的人可以快速理解每个叠加层的语境，促进更顺畅的导航和理解。\n\
  \n### 自适应的交互方法\n- **定义**：支持替代输入方式——如语音命令、触摸手势或眼动追踪，而不是仅仅依赖于捏指、点击或滑动。\n- **重要性**：行动不便的用户或无法执行某些手势的用户仍然可以与\
  \ AR 元素进行有意义的交互。\n\n在 AR 应用中整合这些定制策略，创作者可以扩大并增强他们的参与度，为游客提供更具包容性的体验。\n\nAR 中的适配和定制只是创建更具无障碍数字体验的方法之一。现在，让我们来看看这项工作中的另一个强大工具——AI，它正在彻底改变大规模实施无障碍功能的方式。\n\
  \n# 利用 AI 实现无障碍实践的自动化\n\n**人工智能 (AI)** 无处不在。我们在社交媒体的个性化广告、解锁手机的人脸识别、读取日程的语音助手以及帮助我们标记照片的图像识别中看到它。它还在重塑我们的日常任务，从筛选海量邮件和整理混乱的文件，到生成创意建议甚至自动处理常规文档工作。\n\
  \nAI 正在通过比传统自动化更大的活性来识别常见（但并非所有）障碍，从而彻底改变无障碍。当与智能体框架（agentic frameworks）结合时，AI 可以检测未标记按钮、错误的标题结构和低对比度文本等常见问题，同时生成带有可操作修复步骤的标准报告。开发过程中的实时反馈和自动建议使工程师能够在软件生命周更早阶段集成无障碍功能，减少后期昂贵的修复。虽然\
  \ AI 无法替代人类监督，但其持续监控和数据驱动的洞察使无障碍工作变得更加主动、可扩展且有效。\n\n集成 AI 以支持无障碍实践为应用创作者和其中内容的用户带来了一系列独特的挑战。例如，旨在帮助视障用户的\
  \ AI 驱动应用必须具有前瞻性，又要确保与现有的辅助技术兼容指南（例如屏幕阅读器）兼容。同样，最佳实践是让界面（即使是大量整合 AI 的界面）尽可能简单，避免过度复杂。\n\
  \n在设计和开发 AI 驱动的无障碍功能期间做出的决策——从用户界面元素的选择到数据处理方法——可能会促进或阻碍包容性。从一开始就识别并理解潜在用户的各种能力和需求至关重要。\n\
  \n## 构建包容性 AI：预测文本、算法偏见和公平设计\n\nAI 技术虽然具有变革性，但如果设计和开发排除了残障人士，则面临边缘化这些用户的风险。让我们来看看三个关键领域——预测文本、语音识别中的算法偏见以及公平\
  \ AI 设计，包括它们的挑战和可能的解决方案。\n\n### 预测文本\n预测文本算法经常会“纠正”阅读障碍者的非标准拼写，导致产生可能扭曲关键信息的错误。例如，考虑一位患有阅读障碍的专业人士，其电子邮件被自动纠错误读，导致意外之外的替换损害了沟通。一个潜在的解决方案是扩大训练数据集，以包含更多多样化的语言模式，并启用可自定义的自动纠错设置。\n\
  \n### 语音识别中的算法偏见\n语音助手经常会误解言语障碍用户的非标准语音模式，这会导致此类工具在实际操作中出现问题。如果一个有言语障碍的用户在手机助手的识别中反复失败，最终可能导致现实中的日程安排问题。解决这一挑战涉及在训练数据中加入更广泛的语音样本并精炼识别算法，同时提供更新以提高对异常语音模式的准确性。\n\
  \n### 公平 AI 设计\n严重依赖视觉线索的 AI 系统可能会排除视障用户，这是在早期导航应用中观察到的一个缺陷。例如，当一个导航应用不提供非视觉界面时，它对视障用户来说几乎无法使用。解决方案在于整合通用设计原则，例如听觉反馈、触觉响应和可定制界面。\n\
  \n## 虚拟案例研究：为行动不便用户提供的 AI 驱动预测文本\n\n想象一家领先的软件公司推出了一套 AI 驱动的预测文本系统，旨在包容行动不便人士。该系统利用机器学习算法根据用户的打字模式和上下文使用预测并建议下一个单词或短语。\n\
  \n通过分析用户输入并检查对话上下文，AI 的引入能够显著减少所需的击键次数，并使用户更高效、更少体力负担地进行交流。\n\n\n\n\n\n此外，AI 驱动的预测文本系统可以适应每个用户的独特打字习惯，根据用户既定的模式提供个性化建议。这种实现有望为用户提供更顺畅的沟通。\n\
  \n以下措施强调了开发者可以用于增强 AI 实现中可访问性、包容性和用户友好性的关键策略：\n\n- **简化的交互模型：**\n    - **定义：** 设计具有简单直观的交互路径的\
  \ AI 接口，最大限度地降低复杂性。\n    - **重要性：** 简化的交互模型让认知障碍用户或容易被过度复杂的界面困扰的用户更容易使用 AI 系统，确保更具可访问性和用户友好的体验。\n\
  - **多语言和多模态支持：**\n    - **定义：** 为多种语言和交互模式（如语音、文本和手势）提供支持。\n    - **重要性：** 满足不同语言背景和偏好交互方法，使\
  \ AI 技术适用于更广泛的群体，包括非母语者和有不同沟通偏好的用户。\n- **语境辅助：**\n    - **定义：** 实现根据用户当前任务和环境调整的\
  \ AI 驱动语境帮助和引导。\n    - **重要性：** 语境辅助提供及时且相关的支持，让残障用户更容易有效导航和利用 AI 系统，而不会感到不知所措或迷茫，从而提升整体用户体验。\n\
  - **错误预防与恢复：**\n    - **定义：** 实现能够预测潜在用户错误并提供易于恢复选项的 AI 系统。\n    - **重要性：** 主动预防错误并提供简单的恢复机制有助于用户（特别是残障用户）更有自信地操作\
  \ AI 系统，减少挫败感，从而提高整体易用性。\n- **持续的用户反馈与迭代：**\n    - **定义：** 实施让用户提供持续反馈的机制，并利用这些输入来精炼\
  \ AI 特性。\n    - **重要性：** 来自残障用户的定期反馈确保了 AI 可访问性功能保持有效且相关，允许根据真实世界的使用和不断变化的需求进行持续改进。\n\
  \n当特定的措施被嵌入到 AI 驱动的系统中时，残障人士可能会参与技术使用，而不会遇到因缺乏适应策略而导致的额外障碍。\n\n接下来，让我们探索如何减轻 AI\
  \ 驱动接口中的算法偏见。\n\n# 减轻 AI 驱动接口中的算法偏见\n\n算法偏见产生于 AI 系统由于机器学习过程中嵌入的偏见假设，导致产生倾斜或不公平的结果。这些偏见通常反映了训练数据中存在的社会不公，导致歧视性结果，不成比例地影响有色人社区和其他用户群体。\n\
  \n例如，一个 AI 驱动的语音识别工具如果主要针对限于特定人口统计特征的数据进行训练，对于语音障碍用户或来自数据集中反映的语言背景的用户可能表现不佳。\n\n\
  减轻偏见需要全面的策略，包括多样化的数据获取、透明的算法开发、持续监控以及包容性测试实践，以增强技术的公平性，并在社区内培养信任和包容性。\n\n 数据偏见与代表性\n\
  \n在偏偏数据上训练的 AI 模型可能会无意中延续现有的不平等，导致不同用户群体之间的性能不均。2018 年，据发现，几个执法机构（包括圣地亚大都会交通系统）使用的人脸识别技术对深色皮肤人士存在显著偏见（https://techxplore.com/news/2023-09-skin-color-bias-facial-recognition.html）。结果是该技术在所有用户群体中的表现不公平。\n\
  \n如果 AI 系统继承了训练数据集中的这些偏见，可能会导致它们在某些人口统计特征上的表现糟糕。这种代表性的缺乏会导致排除性结果，使得特定用户群的需求无法得到充分满足。更广泛地说，这还会导致用户接收不准确的信息，并损害用户有效且独立地与数字内容交互的能力。以下是解决数据偏见的一些策略：\n\
  \n- **定期偏见审计：** 使用公平性指标、异常检测和人口统计分析进行评估，以识别不同用户群体之间模型性能的差异。\n- **多样化训练数据集：** 整合反映用户多样性的数据——这可能包括但不限于各种残障、文化背景和语言变体。\n\
  - **包容性开发团队：** 在开发和测试阶段引入残障社区的人士，以确保解决方案解决用户面临的现实世界挑战。\n\n## 健全能力主义和对工具实现的过度依赖的风险\n\
  \n开发团队中的健全能力主义和无意识偏见可能会影响 AI 工具的设计和功能，导致解决方案优先考虑效率而非真正的包容性。这可能体现在对残障人士需求的假设上，可能忽略了需要更细致处理的可访问性的关键方面。\n\
  \n企业日益依赖自动化可访问性工具、覆盖层和 AI 驱动的解决方案来实现合规，但过度依赖这些技术引入了巨大风险。自动检查器和覆盖层通常提供一种虚假的可访问性感，错过了影响残障人士的关键易用性问题，并因开发、修复和实施服务方面的额外成本给企业带来影响。\n\
  \n例如，可访问性覆盖层（accessibility overlays）虽然初衷是好的，但批评者认为它通过提供表面修复实现了健全能力主义行为，这些修复没有解决底层的可访问性问题，有时还会干扰现有的辅助技术。覆盖层可能会遮挡重要内容，破坏键盘导航，并无法为屏幕阅读器用户提供有意义的改进。\n\
  \n此类实施可能会导致感到独特挑战未被承认或解决的用户之间产生挫败感、信任下降和被排除感。\n\n以下是解决偏见思维和健全能力主义的一些策略：\n\n- **文化胜任培训：**\
  \ 为开发团队提供有关文化胜力和残障人士多样经验的培训。这培养了更具同理心和信息的工具设计方法。\n- **以用户为中心的参与：** 采用以用户为中心的设计哲学，与来自各种残障社区的用户进行持续互动。\n\
  - **包容性政策制定：** 制定并执行明确应对并反组织内部健全能力主义的政策。这包括为包容性语言、设计实践和对所有用户的公平对待设定标准。\n- **定期多样性评估：**\
  \ 进行评估以衡量开发团队及其实践的多样性和包容性。引入多样化的劳动力是减轻健全能力主义假设风险并促进更广泛视角的基础。\n\n## 减轻算法偏见的最佳实践\n\
  \n\n\n\n\n以下策略概述了开发者可以实施的核心方法，以评估并减少 AI 驱动辅助技术中潜在的偏差。\n\n### 多样化且具代表性的数据收集\n- **定义：**\
  \ 收集能够准确反映目标用户群体多样性的训练数据，包括种族、性别、年龄、残障类型和语言背景的差异。\n- **重要性：** 确保数据集涵盖广泛的人口统计特征有助于防止\
  \ AI 模型产生偏斜或有偏见的模式，并在不同用户群体之间建立更公平的性能。\n\n### 偏差检测与审计\n- **定义：** 实施系统化程序来识别和衡量 AI\
  \ 模型中的偏差，使用专为偏差检测设计的工具和框架。\n- **重要性：** 定期对 AI 系统进行偏差审计，使开发者能够在影响用户之前定位并解决不公平的模式，并维护技术的完整性和公平性。\n\
  \n### 透明的算法设计\n- **定义：** 开发结构清晰、易于理解的 AI 算法，并提供解释决策如何产生的文档。\n- **重要性：** 算法设计中的透明度可以实现更高的问责制，并有助于识别潜在偏差，使利益相关者能够信任并验证\
  \ AI 驱动界面的公平性。\n\n### 包容性测试与验证\n- **定义：** 与多样化的用户组进行全面测试（包括各种残障的人士），以确保 AI 系统的运行公平。\n\
  - **重要性：** 包容性测试有助于发现隐藏的偏差和可用性问题，允许开发者完善 AI 模型，以更好地服务所有用户群体。\n\n### 持续监控与反馈循环\n\
  - **定义：** 建立持续的监控流程和反馈机制，随时间跟踪 AI 性能和用户体验。\n- **重要性：** 持续监控确保任何新出现的偏差或性能差异都能得到及时处理，维持\
  \ AI 驱动辅助技术的长期公平性和有效性。\n\n当这些策略应用于 AI 驱动的界面时，残障人士就可以以公平且无偏见的方式与技术交互。\n\n## 使用真实数据集的虚构案例：FairFace\
  \ – 减少辅助应用中脸部识别的种族偏差\n\n一家为无障碍目的开发 AI 驱动脸部识别系统的公司发现，其初始模型存在显著的种族偏差，该模型经常误判少数族背景的个人。\n\
  \n为了对抗偏差，公司整合了一个名为 `FairFace` 的包容性数据集，该数据集代表了更平衡的各种种族群体。。通过对多样化用户组进行广泛测试并结合受影响社区的反馈，该公司成功提升了系统的准确性和公平性。这一倡措不仅提高了所有用户对脸部识别技术的可靠性，还证明了公司对追求公平的\
  \ AI 实践的承诺。\n\n为了进一步减轻偏差，公司实施了多步方法，包括对训练样本进行重新加权以确保比例上的代表性、采用对抗性去偏（adversarial debiasing）技术以减少模型预测中的歧视性模式，并利用\
  \ `explainable AI (XAI)` 方法来分析决策的透明度。此外，公司还实施了通过人类反馈提供的系统检查，将用户的纠正和标注整合到模型训练中。这种迭代精炼过程确保了在现实场景中可以识别并解决更多偏差，并可以将来自受影响社区的直接投入，以引导系统向更公平的方向演进。\n\
  \n结果是，该系统在所有人口统计特征中都实现了更高的准确性，显著降低了误判率。随着透明度和响应能力的提高，用户信任也随之增加，而人类反馈机制确保了持续的改进，使模型随着时间的推移变得更具适应性和公平性。\n\
  \n通过整合公平、透明和持续增强，公司可以完善 AI 系统以获得更高的准确性和公平性，为技术进步建立一个负责任的框架，从而实现创新与包容的双重目标。\n\n#\
  \ 总结\n\n在本章中，我们探索了新兴技术——VR、AR 和 AI——中的无障碍挑战与机遇，分析了深思熟虑的设计选择如何让这些体验更具包容性。从根据感官和移动需求调整\
  \ VR 环境，到为了清晰度和可用性定制 AR 叠加层，我们研究了增强数字公平的真实世界策略。我们还探讨了 AI 在自动化无障碍化、减轻偏差以及确保辅助技术公平性方面的作用。\n\
  \n在下一章中，我们将把重点转向探索公司和开发者如何成功实施这些无障碍原则，以构建真正包容性的产品。\n\n现在，如果可以原谅的话，我去指挥我的大提琴鸟了。\n\
  \n# 10\n\n# 无障碍设计系统模式基础\n\n*作者：Charlie Triplett*\n\n结构的基础必须为构建在其之上的一切提供一个稳健的平台。设计系统文档通常依赖于此类比喻概念，当我们把物理理念应用于无障碍设计时，会发现一种更深层的意义，它将影响我们的技术方案和优先级。\n\
  \n任何物理结构必须在理解施加在其上的力量的情况下进行设计和建造——而不只是美学。如果一个结构建在地震带，自然必须优先考虑地质应力——但它仍然必须抵抗雨、雪、冰和风等其他自然事件。一个能抵抗地震但在雨暴中被侵蚀的地基并不是成功的。\n\
  \n同样，一个浅浅的设计系统如果只考虑一种辅助技术，而不先深入挖掘支持所有周围及交叉的残障，其结果将是失败的——本章将帮助你避开这个陷阱。\n\n屏幕阅读器是无障碍专家经常演示的最密集的、最令人惊目的辅助技术之一，这是有有原因的。许多人尚未意识到盲人甚至可以使用电脑或智能手机，而这一发现产生了巨大影响。然而，屏幕读器的强大导致了人们过度依赖它作为实现无障碍实践的主要原因，导致了过度强调支持屏幕读器本身等同于“无障碍”，而不是考虑到残障人士本身。\n\
  \n![img](img/B32080_10_1.png)\n\n图 10.1：仅接触过屏幕阅读器的团队认为他们需要投入精力的方式\n\n但是，当然，还有除了盲之外的其他残障人士需要我们需要去消除障碍，而且他们甚至没有使用任何屏幕阅读器之类的辅助技术，或依赖于键盘之类的设备：\n\
  \n- 那些自认为甚至没有残障的人士，当文字太小无法阅读或文字与背景的对比度太低时，每天都会遇到障碍，特别是当增加默认字体大小无效时\n- 色觉异常的人士，当仅通过颜色（如红色和绿色）指示含义时，会遇到障碍\n\
  - 全屏视频接管可能会导致前庭功能障碍人士产生动症\n- 聋或听力障碍人士可能更倾向于视频的转文字稿，而不是观看整个视频并看同步字幕\n\n\n\n\n\n#\
  \ 无障碍概览\n* 不流利使用另一种语言的人在完成复杂表单时可能会遇到困难\n* 言语障碍人士可能会寻求在线聊天功能，而不是拨打客户服务\n\n要真正创建一个无障碍的设计系统，它必须消除所有人的障碍，为那些使用屏幕阅读器的人以及具有交叉障碍的人士奠定更广泛、更周全的用户体验（UX）基础。\n\
  \n![img](img/B32080_10_2.png) \n\n图 10.2：更有效的设计系统方法，优先考虑人，而不仅仅是技术\n\n本章从以人为中心的视角，分析了日常设计模式和组件中的无障碍挑战。它涵盖了关于如何构建设计系统的实用指导，以引导使用系统的团队以默认无障碍的方式进行设计和构建，而不是在后期才去修补无障碍功能。\n\
  \n首先，我们将考虑如何为不使用辅助设备或仅使用设备辅助设置的人进行设计：\n\n* 低视力\n* 色彩感知\n* 聋或听力受损\n* 认知障碍\n* 运动：针对不精确运动进行设计\n\
  * 运动敏感\n* 光敏感\n* 言语障碍\n\n然后，在完成这些考虑后，我们将研究为使用辅助技术的人进行设计：\n\n* 运动：针对辅助设备和软件进行设计\n\
  * 极低视力或盲\n* 障碍的交叉性\n\n在本章结束时，你将识别残障人士面临的潜在障碍，掌握一个评估人们需求以及如何规划健壮设计系统的框架——这一切都遵循正确的顺序，以最大地提高包容性。\n\
  \n# 低视力\n当考虑到所有人（从低视力开始），显而易见，我们实际上在为超过一半的人口消除无障碍障碍。\n\n根据视觉协会（The Vision Council）的数据，63.7%\
  \ 的美国人佩戴处方眼镜；2018 年，92.4% 65 岁及以上的美国医疗保险受益人报告他们使用了眼镜。这些人并不会说自己有障碍或需要无障碍帮助，因为眼镜或隐形眼镜（辅助技术的形式）矫正了他们的视力。\n\
  \n随着年龄增长，我们的视力也会发生变化。大约一半的人使用动态文本来增大移动设备上的字体大小。这些人可能没有在使用阅读镜，而且绝不会认为自己有障碍。\n\n荷兰\
  \ Appt 基金调查（ [`appt.org/en/stats`](https://appt.org/en/stats) ）发现了以下情况：\n\n* 45%\
  \ 受调查的荷兰 iOS 用户在手机上开启了一个或多个无障碍设置（如增大字体大小）\n* 15% 的在 iOS 上使用两个或多个无障碍功能\n* 61% 受调查的荷兰\
  \ Android 用户在手机上开启了一个或多个无障碍设置，25% 的使用两个或多个无障碍功能\n\n通过优先考虑低视力，价值的设计支持（affordances）会扩展到其他障碍人士的设计系统的范围内。设计系统必须足够健壮，以适应动态调整的排版，定义颜色和字体资产的意图，足够灵活以根据浏览器设置进行重流，并识别人们体验\
  \ UI 的替代方式。\n\n## 动态排版的规划\n人们必须能够在网页上将文本的默认大小更改为 200%，或根据特定平台、浏览器或操作系统的设置进行更改。请注意，这与使用\
  \ `Cmd+` 或 `Ctrl+` 键进行浏览器缩放并不相同。\n\n如果字体无法增大或布局无法容纳更大的文本，不仅界面会变得不可读甚至显示损坏，而且任何将\
  \ UI 翻译成另一种语言的人也会遇到布局错乱（例如，从英语翻译成法语）。\n\n文本必须能够增大大小而不会破坏其容器，或不会被部分或完全隐藏，且这不依赖于是否存在特定的任意布局高度或宽度。系统中的所有对象都必须适应健壮的各种排版条件（包括更改默认字体族本身）。在创建设计模式时，请演示该功能如何适应更大的文本。\n\
  \n## 启用网页浏览器缩放\n低视力的人通常依赖浏览器缩放（使用如 `Cmd+` 或 `Ctrl+` 等键盘快捷键）来放大页面上的所有内容。\n\n适应这种需求的最佳方法是记录并引导使用设计系统的团队采用响应式、移动优先的设计和开发实践。与其将缩放视为一个独立的功能，不如理解为缩放本质上是重新调整整个视口的大小，就像在较小的屏幕上查看内容一样。\n\
  \n具体而言，`WCAG SC 1.4.10: 重流（Reflow）` 指南通常要求 UI 在 320 CSS px 的视口（对于垂直滚动页面）中无需两个方向滚动即可工作，或者在\
  \ 256 CSS px 的高度（对于水平滚动内容）中工作。例如，这意味着当你的响应式移动优先设计从 320 px 的最小视口开始时，你的 UI 无需额外努力即可符合要求。\n\
  \n## 交付有意的排版模式，而不仅仅是资产\n虽然设计系统应为使用团队提供可能的创作自由，但如果不加约束，这种自由将会产生不可访问的模式。没有比字体使用使用更重要的指导建议了，而且由于其细微差和技术性，设计系统必须对其预期的使用方法做出规定。\n\
  \n### 字体缩放与字号：理解两者的区别\n在规划排版模式时，理解字体缩放和字号之间的差异至关重要，以及为什么这对于无障碍非常重要：\n\n* **字号（Font\
  \ size）** 指分配给文本的数值值，例如 16 px 或 1 rem。这是一个代码级指令，告诉浏览器或设备文本应该有多大。\n* **字体缩放（Font\
  \ scaling）** 另一方面，是指字体本身在该尺寸下的视觉渲染情况。`x` 高（x-height）、笔画重量和字母比例等因素会影响字体实际看起来有多大或多小。分配相同字号的两种字体可能因为这些特征而看起来显著不同。\n\
  \n设计系统必须同时考虑字号和字体缩放，以确保文本保持可读性并符合无障碍标准。如果品牌字体在相同尺寸下比标准字体渲染更小，则可能需要分配更大的字号来补偿其视觉比例。\n\
  \n例如，常用的 Arial 渲染缩放比例与其分配的行高相符。16 px 的 Arial 从最高字母的顶部到最低下降字母（descender）的底部在光学上测量为\
  \ 16 px 的高度（这可能根据浏览器的渲染引擎略有不同）。然而，不同的字体即使分配了相同的字号，在光学上可能渲染更小。在以下示例中，尽管代码规定了字号为 16\
  \ px，但缩放调整不当的自定义品牌字体渲染明显更小。\n\n![img](img/B32080_10_3.png) \n\n图 10.3：缩放不匹配影响字号渲染\n\
  \n### 文本对比度\n所有使用手持设备的人都会经历可见性差的情况。例如，当在室外阳光下使用手机时，屏幕相对较暗且难以阅读。同样，当屏幕变暗以节省电量时，低对比度的文本和图形会成为所有人的障碍。\n\
  \n此表列出了公认的文本颜色对比度要求。正如之前提到的，由于不同的字体以不同的比例进行渲染，因此 CSS 像素必须从光学角度进行解释，而不是仅仅通过其定义的像素大小。\n\
  \n| **光学 CSS 像素** | **字重** | **比例** |\n\n\n\n\n\n| <24 px | 常规 | 4.5:1 |\n| :---\
  \ | :--- | :--- |\n| >=18 px | 粗体 | 3:1 |\n| >=24 px | 常规 | 3:1 |\n\n图 10.4: 通用文本大小与对比度指南\n\
  \n对于低视人士来说，文本与其背景之间足够的对比度对于消除内容消费障碍至关重要。在一种语境下符合对比度要求的文本，在其他语境下可能会成为障碍，例如所示：\n\n\
  ![img](img/B32080_10_5.png)\n\n图 10.5: 对比度与尺寸示例\n\n### 信息性图表的对比度与描边宽度\n\n信息性图表（例如图标或控件的状态指示器）在标识\
  \ UI 组件的名称、角色或状态时，也必须兼顾低视人士的需求。实心粗形状（如警报图标）只需满足 `3:1` 的对比度，但使用 `1 px` 描边的极简主义汉堡菜单图标必须满足\
  \ `4.5:1` 的对比度：\n\n| 描边宽度 | 比例 |\n| :--- | :--- |\n| 1 px | 4.5:1 |\n| >=2 px |\
  \ 3:1 |\n\n图 10.6: 通用图表描边宽度与对比度比例\n\n### 引导颜色选择，而非仅仅提供色板\n\n在使用设计系统进行产品设计和开发的团队，应当获得符合对比度标准的文本颜色与背景组合。虽然有多种工具可以对颜色组合进行数学分析并生成可用组合表格，但并非每种组合在视觉上都是理想的。提供可用模式的示例和品味的用法，以便使用团队能够做出良好的选择。\n\
  \n![一张调色板的截图 AI 生成的内容可能错误。](img/B32080_10_7.png)\n\n图 10.7: 可以使用 `toolness.github.io/accessible-color-matrix`\
  \ 等自动化工具来识别无障碍颜色组合表格。\n\n我们必须避免使用 `100% 白色` 配配 `100% 黑色`。对于散光患者来说，这种强烈的对比会导致文本看起来产生不舒适的眩感，尤其是黑色背景上的白色文本。\n\
  \n# 放大工具的示能\n\n视力极低的人士可能还会使用放大软件，允许他们放大屏幕的非常小部分。在手持设备上，这通常意味着双指缩放/放大。\n\n每次只能看到屏幕的一小部分，意味着低视人士将难以寻找散落在页面各处的内容和控件。\n\
  \n虽然某些控件无疑会与其标签分组在一起（例如复选框或单选按钮），但切换开关（toggle switches）和折叠器（expanders）往往被分在内容的对侧，为低视人士制造障碍。\n\
  \n![一张黑白标签 AI 生成的内容可能错误。](img/B32080_10_8.png)\n\n图 10.8: 复选框和单选按钮几乎普遍都排列为控件与标签紧密相邻\n\
  \n此同时，这些切换开关和折叠器被允许填充可用空间，这无疑让设计经理感到满意，但对低视人士来说存在问题：\n\n![一个带有黑色框的白色矩形物体 AI 生成的内容可能错误。](img/B32080_10_9A.png)\
  \ ![img](img/B32080_10_9B.png)\n\n图 10.9: 这些切换开关和折叠器都为低视人士制造了障碍\n\n使用放大镜查看屏幕的人将难以理解这些标签与控件之间的关系。\n\
  \n将所有控件和指示器直接放在文本标签旁边对所有人都有帮助。如果你必须将控件指示器放在标签右右侧，请为该组件设置最大宽度。\n\n![一个黑白 Logo AI\
  \ 生成的内容可能错误。](img/B32080_10_10.png)\n\n图 10.10: 将切换开关和折叠器控件指示器放置在其标签附近对所有人都有帮助\n\
  \n当消除了这些对于可能使用放大、浏览器缩放或仅更改默认字体大小的低视人士的障碍，设计系统将成为为所有人创造更好体验的基础。\n\n# 颜色感知\n\n色盲人士（也称为色觉视觉障碍）难以或无法区分某些颜色。这影响了大约每\
  \ 12 名男性中的 1 人和每 200 名女性中的 1 人（人口的 8%），意味着涉及颜色感知的任务（如识别交通灯或分类衣物）可能会很麻烦。\n\n在设计方面，使用绿色和红色来指示过程的成功或失败，对于无法感知这些颜色差异的人来说是一种障碍。\n\
  \n![一张电脑的截图 AI 生成的内容可能错误。](img/B32080_10_11.png)\n\n图 10.11: 在没有颜色辅助的情况下，无法区分这两个错误消息之间的差异\n\
  \n相反，应包含文本来传达成功、警报或警告等状态。在内容策略上花费的时间应至少与选择完美警报图标一样多。虽然可以使用直观上有意义的图标，但它们很少比实际单词更有用。\n\
  \n![一张电话号码的截图 AI 生成的内容可能错误。](img/B32080_10_12.png)\n\n图 10.12: 这些成功和错误消息并不单独依赖图标或颜色来传达意义，而是使用实际单词来帮助区分错误消息之间的差异\n\
  \n再次，通过确保设计系统不依赖颜色而是使用文本来传达意义，它为认知障碍人士增加了示能。\n\n# 听障或听力障碍\n\n设计系统的音频和视频功能必须通过两个关键功能提供无障碍支持：\n\
  \n*   内置字幕\n*   转录文本\n\n这两个功能不仅让听障或听力障碍人士受益，也惠及了如非母语者和神经多样性人士。\n\n## 内置字幕\n\n内置字幕是视频中语音、音效和重要音频提示的同步文本表示。它们让无法听到音频或在某些环境中难以处理音频的人能够跟随内容。内置字幕对于听障和听力障碍人士至关重要，也被广泛使用。\n\
  \n设计系统应当：\n\n*   使字幕可切换。用户应能够轻松开启和关闭。\n*   确保字幕同步。它们必须实时出现，准确反映语音内容和声音。\n*   使用易读的样式。高对比度文本、可调整的字体大小和良好的布局提高了跨设备和屏幕的可读性。\n\
  \n## 转录文本\n\n转录文本是音频或视频内容的全文版本。与字幕不同，它们并不与媒体同步，但提供了可以独立阅读的完整文本。\n\n转录文本有利于广泛的用户：\n\
  \n*   屏幕阅读器用户导航转录比滚动音频要快得多。\n*   非母语者可以参考转录中的不熟悉的单词或短语。\n*   带宽低的人无需等待视频加载即可阅读内容。\n\
  \n设计系统应当：\n\n*   提供一个清晰标记的链接或按钮用于下载或查看转录文本。\n*   将转录文本放在视频播放器附近或专门的易于找到标签页中（不要隐藏在晦涩的菜单中）。\n\
  \n\n\n\n如你所见，字幕和转录不仅仅是技术功能——它们是通往包容、连接以及内容公平获取的桥梁。通过合理的布局和直观的开关将这些功能性支持嵌入到设计系统中，团队可以创建出满足真实场景下真实需求的产品。\n\
  \n# 认知障碍\n\n认知障碍是指影响个体处理、学习、记忆和解决问题能力的一系列差异。\n\n## 在显眼位置使用通俗语言\n\n首先，你应该意识到，人们并不总是有充足的时间、注意力和精力来消费、搜索、理解并有效使用你的产品。任何人都可能受到繁忙的日程、嘈杂的环境或服用感冒药导致的昏昏欲睡的影响。同样，具有认知差异的人可能需要额外的时间来完成任务或回想信息。\n\
  \n如果人们无法找到、消费和理解内容，他们就无法使用你的产品。通过样式指南和设计模式示例，鼓励团队避免使用术语、成语、营销辞令和特殊词汇。\n\n不鼓励消费团队将重要信息隐藏在工具提示（tooltips）、对话框或折叠组件（expanders）之后。隐藏的信息不会像放置在关键\
  \ UI 特性视觉附近的有用信息那样被轻易消费。\n\n## 文本输入的功能性支持\n\n当所有文本字段的大小都相同时，所有人的认知负载都会增加。相反，应根据预期的输入定义文本字段大小的规则。\n\
  \n例如，如果一个字段要求填写出生，该字段应足够宽容纳四个字符，但不能更多。这让所有人都能一眼直觉地判断控制控件和输入字段的功能，在提高每个人填写表单数据速度的同时减少了错误。\n\
  \n## 鼓励自动补全\n\n人类发明计算机是为了完成重复性工作，而使用 `autocomplete` 属性的输入正可以做到。当表单不使用或不允许 `autocomplete`\
  \ 时，所有人正确填写表单的摩擦力都会增加。对于使用切换设备或替代导航的运动障碍人士来说，这可能是一个尤为乏味且沮丧的障碍。\n\n## 减少干扰\n\n难以集中注意力的人需要无干扰的界面。对于他们来说，无法快速暂停的自动播放视频或背景动画可能意味着\
  \ UI 无法使用。同时，在交易过程中尝试推销的弹出窗口会引起感（即使对那些注意力没有问题的人也是），并将用户推向其他地方。解决这个问题很简单：如果它是令人恼的，它就不符合无障碍标准。针对对话框、模态框和警报的使用设置严格的指导原则。\n\
  \n通过优先考虑通俗语言、合理的输入设计和最少的干扰，设计系统可以培养更具包容性的体验，赋予认知障碍人士充分参与的能力。\n\n# 运动障碍：为不精确的操作进行设计\n\
  \n设计可以兼顾那些只是难以与 UI 进行精确交互、但没有使用其他辅助技术的运动障碍人士。\n\n理解更大的按钮对所有人来说更容易点击并不困难。对于难以使用鼠标或精确点击屏幕的人来说，当按钮太小或排列过于密集时，就会遇到障碍。\n\
  \n为了提供帮助，请鼓励具有大尺寸控件的移动优先设计。虽然消费团队通常感到制作功能密集的界面的压力，但设计系统的示例和文档必须提供支持无障碍目标尺寸的示例。\n\
  \n为了满足最小的 WCAG AA 目标尺寸要求，对象必须为 `24x24 px`，并有 `4 px` 的边距。更宽松的 `44x44 px` 尺寸符合 WCAG\
  \ AAA 和 HIG 要求，Android Material Design 则要求最小尺寸为 `48x48 dp`。\n\n![一个黑白方块 AI 生成的内容可能错误。](img/B32080_10_13.png)\n\
  \n图 10.13：WCAG AA 最小目标尺寸和 AAA 目标尺寸\n\n对于 HTML 控件（如复选框、单选按钮、折叠组件和开关），整个标签也必须是可以点击的，而控件本身。\n\
  \n![一只手指向图片 AI 生成的内容可能错误。](img/B32080_10_14.png)\n\n图 10.14：Web 控件（如开关）在点击标签和控件本身时必须激活\n\
  \n通过设计宽敞的触摸目标并确保整个标签可点击，团队可以消除运动障碍人士的障碍——创建对所有人来说都直观且易用的界面。推崇这些功能支持的设计系统不仅符合无障碍标准，还提供了更具包容性的体验。\n\
  \n# 运动敏感\n\n患有前庭系统障碍的人可能会因扫描动画或视频感到不适。使用视差滚动或自动播放全屏视频的设计真的可能让人生病几小时，导致头晕、恶心或迷失方向。\n\
  \n## 尊重减少运动设置\n\n首先记录自动播放视频和动画如何尊重设备的 `Prefers Reduced Motion` 设置。此系统设置在大多数操作系统中均可用，可以在浏览器和原生移动应用中被检测到，表示对较少运动或动画的偏好。例如，当用户启用此设置时，设计系统应禁用视差效果，减慢或移除过渡动画，除非用户触发，否则暂停自动动画。\n\
  \n## 为运动变化做好计划\n\n设计系统必须记录视频或动画在关闭时如何反应。例如，如果主横幅包含一个循环的背景视频，请提供一个具有相似品牌视觉或信息的静态备用图像。对于微动画，请将其替换为微妙的淡入或高亮，这些在传达相同含义的同时，不会引起动症。\n\
  \n## 提供易于寻找的控件\n\n任何自动播放视频都必须包含直观、易于寻找的暂停或停止控件。避免将这些控件隐藏在嵌套菜单中——理想情况下，将它们放置在视频附近，并带有如\
  \ `暂停动画` 或 `停止运动` 等清晰标签。对于背景动画（例如移动渐变或背景效果），提供切换或开关，以便用户在需要时轻松禁用它们。\n\n尊重运动敏感的设计系统通过优先考虑舒适和健康来赢得用户的信任。通过提供灵活的运动设置、备用视觉和易于寻找的控件，团队创建了让前庭障碍人士能够安全、自信参与的界面。\n\
  \n# 光敏感\n\n光敏感人士会仔细管理他们与数字环境接触，以减少发作或疾病的风险。触发因素包括闪光（如闪烁效果）或某些高对比视觉图案，如条纹、网格和棋盘。对于某些人来说，即使是细微的闪烁也会导致头晕、头痛或迷方向。\n\
  \n## 设置清晰指南\n\n设计系统必须为所有动画和视频建立清晰指南，确保任何符合闪烁内容的每秒不超过三次。这符合 `WCAG 2.2 成功标准 2.3.1`\
  \ 并有助于保护光敏感性痫患者。\n\n## 提供警告和选项\n\n视频或动画功能必须考虑在存在光敏感内容时如何在界面中直观地放置警告。位置会根据平台（网页、手机、平板电脑或电视）自然变化，但应始终保持一致且易于寻找。\n\
  \n此外，你还：\n\n- 包含清晰易读的标签，例如 `警告：闪烁内容可能会影响光敏感用户` 。\n\n- 提供开启或关闭高运动效果的开关。例如，允许用户禁用视差滚动、背景视频或动态渐变。\n\
  \n\n\n\n## 安全测试\n\n设计系统应当记录如何使用自动化工具对内容进行测试，例如使用马里兰大学 Trace Center 提供的光敏感性痫分析工具（`PEAT`）软件（[`trace.umd.edu/peat/`](https://trace.umd.edu/peat/)）。此外，应考虑与无障碍专家或具有光敏感性的用户研究参与者合作，以确保获得真实的真实体验视角。与具有光敏感性的用户合作，了解他们的体验和需求，并验证解决方案。\n\
  \n### 额外建议\n\n除了上述信息外，请考虑以下建议：\n\n- 避免明色与深色之间的高对比度闪烁\n- 不仅测试孤立的功能，还要测试复杂的交互，例如结合多种视觉效果的过渡动画\n\
  - 在所有设计模式中（包括营销、新手引导和交互式功能）采用一致的方法\n\n通过将这些这些实践纳入设计系统，各团队可以确保具有光敏感性的人群能够安全、有信心地浏览数字体验，而不会面临触发症状的风险。\n\
  \n# 言语障碍\n\n当我们以包容性思维思考时，可以理解许多没有残障的人并不喜欢语音通话。这需要时间，可能会变成一种繁琐的社交互动；如果对话困难或不愉快（例如取消服务或涉及敏感的个人问题），电话可能会可能会成为一种应避免的不适且焦虑的体验。\n\
  \n语音对话和使用语音识别的系统通常为言语障碍人士制造障碍。如果下订单或获取客户支持的唯一方式是通过语音通道，这便构成了一种障碍。在设计过程早期与言语障碍人士接触，有助于识别这些障碍并共同创建备选解决方案。\n\
  \n虽然 WCAG 规则没有列出涵盖言语或语音障碍的特定成功标准，但我们可以推导出一种提供一致替代方案的方法：\n\n- 如果团队正在使用设计系统添加如语音助手、支持语音的应用等产品功能，或者将依赖`交互式语音响应`（`IVR`）电话系统（例如，“请说您要转接的部门名称”），设计系统必须引导团队在每一步都提供非语音替代方案。\n\
  - 添加清晰的视觉和基于文本的替代方案——例如聊天界面、短信选项或电子邮件支持——以便用户可以选择他们偏好的通信方式。\n- 优先考虑异步选项，以免让用户被迫进行可能导致压力或焦虑的实时交互。提供无障碍的替代方案也让处于嘈杂环境、信号不佳或单纯倾向于打字的用户受益。\n\
  - 提供一致且易于发现的选项，在语音和非语音通道之间切换。例如，在`IVR`电话通话期间，允许用户按数字键连接到基于文本的支持通道或请求转录文本。\n- 在语音支持产品中包含关于字幕或转录文本作用的明确指导。例如，语音助手应该能够显示文本确认信息和结果。这让言语障碍人士能够在不完全依赖语音的情况下理解并导航系统。\n\
  \n到此时，在消除了针对低视、认知、运动和光敏感等不同残障人士的障碍后，我们的设计系统现在已准备好为使用键盘、切换设备和屏幕阅读器等辅助技术的人提供功能（affordances）。\n\
  \n# 运动障碍：为辅助设备和软件进行设计\n\n严重的运动障碍人士使用的辅助技术范围广泛，从键盘到更复杂且通常是定制的切换设备。设计系统鼓励开发团队考虑此类辅助技术至关重要，因为这是屏幕阅读器无障碍的前提。\n\
  \n理解使用鼠标导航 UI 与使用键盘等辅助技术导航 UI 之间的根本区别至关重要。使用鼠标的人处于控制之下，就像在城市里开车：可以按照任何顺序在屏幕上移动。使用键盘更像是在乘坐火车，在一种线性的引导旅程中体验内容和控制控件。路线上的每一站都是强制性的。\n\
  \n## 单点激活\n\n我们都会遇到这样的情况：由于环境限制（如在繁忙的街道上行走）或分心（如带着一只调闹的动物），无法在触摸设备上进行复杂操作。但是，使用键盘或切换设备的人也无法精确执行滑动或拖动等复杂手势。\n\
  \n在这种情况下，通过单点执行操作的能力可以提高每个人完成任务的能力。对于复合功能，如导航可拖动的控件或（如果无法从系统中移除）轮播图，提供单点操作方法。\n\n\
  ## 适配横屏、竖屏和倒置方向\n\n每个人都有在手持设备上多方向消费内容的需求。例如，你可能在飞机上使用座椅背后的弹出托盘浏览内容。然而，运动障碍人士可能使用永久固定且无法旋转的手持设备。如果\
  \ UI 在所有方向下都无法使用，这将成为一种障碍。\n\n因此，确保所有内容在每种方向下都是可消费的。任何覆盖屏幕内容（如弹出窗口、固定悬浮广告或菜单）都不能为在任何方向下消费内容创建障碍。\n\
  \n## 焦点样式定义\n\n焦点不仅是为了使用键盘导航设备的人。文本输入必须对所有人都有一个焦点状态，即使是那些点击屏幕或使用鼠标的人。这种焦点状态让所有人理解该字段正处于焦点状态并可以接收输入。遗憾的是，许多开发者被教导隐藏焦点样式，这降低了所有人的体验。\n\
  \n![电脑屏幕截图，AI 生成的内容可能不准确。](img/B32080_10_15.png) \n\n图 10.15：文本字段轮廓突出输入本身，即使对于使用鼠标的人也是如此\n\
  \n使用键盘、切换设备或替代导航的人依赖界面视觉上指示哪个控件当前处于焦点状态并准备好交互。只有交互式控件应该是键盘聚焦的。标题、章节或地标不能是键盘聚焦的。\n\
  \n设计系统必须引导团队采用统一的焦点模式。如果设计系统忽略焦点样式或简单地交给默认设置，焦点不仅经常缺失，而且是不可预测的。\n\n虽然创建品牌自定义样式可能是理想的，但依赖浏览器默认颜色并主动对控件应用浏览器默认样式可以实现较高的一致性，特别是当产品依赖第三方插件时。\n\
  \n原生手机应用程序几乎总是应该使用默认样式，因为它们与操作系统深度绑定，并且可以根据低视对比度设置进行修改。\n\n定义焦点样式包括在哪里放置焦点轮廓。例如，遵循默认\
  \ HTML 焦点模式，此组复选框将焦点放在样式化的复选框本身上：\n\n![](img/B32080_10_16.png) \n\n图 10.16：这些符合\
  \ WCAG 标准的复选框在样式化的复选框周围添加轮廓\n\n此复选框组将焦点放在整个标签周围：\n\n![img](img/B32080_10_17.png)\
  \ \n\n图 10.17：这些符合 WCAG 标准的复选框在复选框标签周围添加轮廓\n\n\n\n\n\n但不要过度设计。记住，焦点指示（focus indication）的目的是让用户知道哪个控件已准备好交互。例如，不要将文本输入框、标签和辅助文本封装在焦点轮廓中。周围文本不是控件，因此它们不应显示为可聚焦状态。\n\
  \n![带有矩形的调查问卷，AI 生成的内容可能不准确](img/B32080_10_18.png) \n\n图 10.18：标签和描述性文本在获得焦点时不得显示轮廓\n\
  \n简而言之，只需让浏览器执行它已经会的事情：在交互式的可聚焦元素上显示焦点，而不是周围的文本、卡片或区域。\n\n## 适应替代导航\n\n某些人依赖于完全不同的方式来导航数字界面，例如语音控制、眼动追踪或切换扫描系统。这些替代方法供行动能力受限、有言语障碍或仅仅偏好无手操作的人士使用。\n\
  \n使用语音控制（如 `Dragon NaturallySpeaking` 或移动操作系统内置命令）的人需要能够以一种可预测的、口头的方式引用他们在屏幕上看到的内容。\n\
  \n因此，UI 控件和文本必须有清晰且唯一的标签。你可以将单词看作是由具有意义字母组成的图片。例如，与其使用垃圾桶图标按钮来取消订单，可以使用 `Cancel`（取消）单词。与其使用纸飞机图标按钮发送消息，可以使用\
  \ `Send`（发送）单词。这两个示例都允许使用语音控制的人通过单个命令执行此操作。\n\n因此，网站和应用程序的设计系统不能跳过键盘可访问性的适配，不仅是因为这是使用屏幕阅读器的人的先决条件，还因为键盘用户可能面临某些在用屏幕阅读器时并不存在的的障碍。接下来，让我们看看设计系统如何为盲人或视力极低的人士消除障碍。\n\
  \n# 视力极低或盲\n\n之前的章节已经消除了为使用屏幕阅读器的人设计时的许多挑战，他们将受益于已经讨论的所有功能（affordances）：\n\n*  \
  \ 适应所有设备、方向和视口大小的灵活布局对于使用屏幕阅读器的人非常有用，因为他们可能正在使用手持设备，或者不知道桌面屏幕的分辨率或窗口大小。事实上，他们可能根本没有桌面显示器——如果看不见，何必在意呢？\n\
  *   有意义的标题结构允许屏幕阅读器快速浏览内容，呈现有用信息。\n*   转录文本（Transcripts）让音频内容更容易消费，音频描述（audio descriptions）使得包含重要视觉信息的视频变得可以消费。\n\
  *   不依赖颜色来传达含义的内容将使用单词来表达含义。\n*   不依赖细微营销术语或行话的语言可以被屏幕阅读器正确发音。\n*   自动完成（Autocomplete）有助于所有人减少错误，同时加快表单填写速度。\n\
  *   在有意义顺序中的可聚焦控件将引导使用屏幕阅读器的人在 UI 中进行引导的线性旅程。\n\n这些考虑为创建设计系统奠定了基础，这些系统不仅符合可访问性要求，而且真正赋能盲人或视力极低的人士。现在我们将探索设计系统如何通过处理标题、焦点管理、替代文本（alternative\
  \ text）和辅助技术考虑来进一步支持这些用户。\n\n## 选择非语义的字体命名规范\n\n设计系统必须采用一种不依赖数字标识符来指示尺寸和粗重的命名规范，而应关注文本的意图用途和样式。这些简单的示例允许将任何样式应用到任何标题级别。通过这种方式，`h1`\
  \ 在视觉上可以是最小的字体，但对使用屏幕阅读器的人来说保持其意义。\n\n以下样式可以应用于任何标题，无论其标题级别如何：\n\n![计算机代码截图，AI 生成的内容可能不准确](img/B32080_10_19.png)\
  \ \n\n图 10.19：语义无关样式\n\n## 提供标注工具（但不要过度）\n\n必须为设计师提供某种程度标准化且有意义的可访问性注释，以便他们通信 UI\
  \ 组件不清晰的名称、角色或状态。将可访问性传递给工程团队的方式不能事后考虑。\n\n在缺乏显式注释的情况下，开发者将从设计样式和令牌名称中寻找标记线索。如果一个标题使用名为\
  \ `heading-1` 的样式，他们通常会将内容封装在 `h1` 标签中，即使该标题并非作为页面的主标题。\n\n![img](img/B32080_10_20.png)\
  \ \n\n图 10.20：标题和按钮的简单注释\n\n无论是贴纸组件库、特定的软件插件还是详细的行内指令，为所有人添加有意义注释的能力都是必须。\n\n与你的开发者直接合作，并对注释及其用法建立可持续的预期。让他们在设计稿的行内、旁边或上方查看这些注释有帮助吗？他们是否更倾向于一个独立的标注视图？\n\
  \n识别出哪里是必需的，哪里是不需要的。如果 UI 设计师直接嵌入在跨功能工程团队中，并每天与 Android、iOS 和 Web 开发人员直接沟通，标注需求可能很小。在另一个极端，如果\
  \ UI 设计团队是孤立的，仅仅将产物投放到瀑布式生产环境中，则需要更详细的注释。\n\n一个极简的标注库应该包含以下选项：\n\n*   地标（Landmarks）（头部/横幅、导航、主体、页脚/内容信息）\n\
  *   标题级别（`h1`, `h2`, `h3` 等）\n*   图片的替代文本名称\n*   控件角色（复选框、单选按钮、开关等）\n*   自动完成属性（`name`,\
  \ `address-line1`, `address-level1` 等）\n*   ARIA 标签（命名区域、表单或导航）\n\n虽然注释很有用，但不能是多余的。例如，在一个小屏移动布局和大屏桌面布局并排的设计稿中，可能对移动布局进行标注才有帮助，只需注明桌面布局的差异或额外功能。\n\
  \n## 信息性与装饰性图片的替代文本\n\n为了让屏幕阅读器用户获得良好的体验，设计系统必须鼓励消费团队为信息性图片添加替代文本描述，并反对对装饰性图片添加描述。\n\
  \n消费团队需要明确的指导什么是装饰性或信息性图片，以及如何描述。如果设计系统没有为替代文本设定模式，消费团队要么忽略替代文本，导致丢失照片和图形中的关键视觉内容，或者对性图标过度使用替代文本，导致重复或无意义的体验。\n\
  \n\n\n\n\n图 10.21：为此图标分配单一的替代文本值是不可能的\n\n## 视频音频描述\n\n带有音频描述的视频包含一条额外的音频轨道，用于描述理解视频内容所必需非口语内容。对于需要音频轨的视频内容，请加入音频描述功能。\n\
  \n理想情况下，为用户提供一种简单直观的方法开启或关闭音频描述——例如视频播放器内标签清晰的按钮或菜单选项。不要将此功能埋藏在难以找到的设置菜单中。\n\n有效整合音频描述不仅能让更多人能够访问视频内容，而且符合包容性设计的最佳实践。\n\
  \n通过通过整合有意义的标题、可访问的字体、注释、替代文本和音频描述，设计系统可以使盲人或视力极低的人能够充分参与数字体验。周全且包容性的设计能让所有人受益，使信息更容易被发现、理解和导航。\n\
  \n# 残疾的交叉性\n\n出于实用考虑，设计中的无障碍访问通常是在单一残疾或辅助技术性的背景下讨论的，但当考虑到患有多种残疾的人群时，残疾的情况要复杂得多。\n\
  \n一个能够适应动态文本缩放和一致焦点样式的设计系统，可以兼顾视力低和有严重运动障碍的人。认为动画或运动会分心的人可能会使用放大工具来集中注意力，从而过滤掉分心的特征。有认知障碍的人可能会使用屏幕阅读器或闭路字幕来帮助阅读理解或理解音频内容。现实世界中的场景很少有如此整齐的划分。让具有交叉需求的用户（例如既使用屏幕阅读器又对运动敏感的人）参与，有助于团队理解并为复杂的、重叠的挑战进行设计。\n\
  \n当设计系统通过灵活性、清晰度和替代交互方式进行构建时，它们可以更好地适应这种复杂性，而不需要特殊例外或额外的自定义。重要的是，许多人会同时经历多种残疾，例如视力低和运动障碍，或听力损失结合认知挑战。一个预见了这些重叠需求的设计系统——例如确保高对比度字体、一致的焦点样式、清晰的标签和单点激活——将为所有人创建一个更加公平、一致的体验。\n\
  \n## 所有残障人士应省略的特征\n\n设计系统的无障碍访问并不意味着让一切都变得可访问；它意味着决定省略哪些组件和模式。一些常见的 UI 组件可以留在设计系统之外，以鼓励消费团队寻求更好的解决方案。与用户协作以理解为什么某些组件会产生障碍至关重要——这有助于设计系统进化以支持包容性体验，而不是简单地移除功能。\n\
  \n### 工具提示 (Tooltips)\n\n理解 UI 所需的重要内容应对所有人显示，而不应隐藏。工具提示是糟糕 UX 设计的，因为它要求人们执行额外的认知任务来理解\
  \ UI。工具提示是屏幕阅读器特别常见的障碍，因为没有通用的规范来定义它们的名称、角色、状态或键盘操作。\n\n相反，应鼓励消费团队编写直观且自解释其义的 UI。\n\
  \n### 自定义样式的选择框（又称 listbox/combobox/下拉列表）\n\n在表单中替换原生 HTML `select` 元素没有任何合理的理由。HTML\
  \ 原生 `select` 元素是可以访问的，并提供了提供弹出列表所需的所有功能。\n\n自定义下拉菜单无法在每个平台（macOS、Windows、iOS、Android\
  \ 和 ChromeOS）上复制原生 `select` 元素的健壮功能，因为每个平台的键盘操作、触摸屏手势和语义略有不同。\n\n此外，正确构建这些元素的成本很高，而且如果没有持续的维护，它们将不可避免地对残障人士失效。\n\
  \n![img](img/B32080_10_22.png)\n图 10.22：Angular Material 自定义下拉菜单\n\n原生 HTML `select`\
  \ 元素可以在折叠状态下完全样式，而未来的 CSS 提案允许更多操作。\n\n![img](img/B32080_10_23.png)\n图 10.23：macOS\
  \ 中的原生 HTML select\n\n### 轮播图 (Carousels)\n\n轮播幻灯片通常是无法决定内容优先内容的利益相关者之间的妥协，这导致用户体验在第一张灯片之外很少获得互动。未来的浏览器功能可能包含对无障碍轮播的类原生支持，但这意味着它是传递内容的最佳方式。即使是无障碍的轮播图也会为必须学习导航其独特内容的人带来额外的认知负担。它是滑动的吗？方向键可以操作它吗？有多少张灯片？\n\
  \n如果轮播图是设计系统中不可避免的组件，请帮助团队明智地使用无障碍轮播图以消除障碍、减轻认知负担并为体验增加价值：\n\n- 避免使用自动播放。这会给认知障碍和前庭系统障碍的人带来障碍。如果使用该功能，自动播放必须默认关闭并允许用户控制。\n\
  - 引导团队倾向于可预测的信息。当人们可以猜到后续内容时（例如鞋子颜色和产品变化），轮播的效果更好。避免在灯片之间出现惊喜或脱节的内容。\n- 提前设定预期。为视力低和使用屏幕阅读器的人清晰地展示灯片数量、导航控件和当前间隔位置。\n\
  - 仔细考虑用户在与轮播图交互后屏幕阅读器播的内容。例如，宣布发生了什么变化很有用（灯片标题和间隔位置），但如果灯片包含大量信息，则不要播放整个灯片。\n- 键盘和屏幕阅读器用户必须能够在不与每张灯片交互的情况下跳过轮播图。\n\
  \n# 总结\n\n本章研究了无障碍设计系统如何提供比基础组件更多的内容。你学习了专注于按正确顺序为残障人士消除障碍的设计系统，如何为可扩展且无障碍的设计系统奠定强大且可持续的基础。\n\
  \n这意味着从最常见的需求开始，如视力低、色彩感知和认知障碍——并向对辅助技术（如切换设备和屏幕阅读器）更复杂的适配发展。\n\n\n\n\n此外，设计系统必须是一份供消费产品团队使用的指南，帮助他们做出符合系统意图的良好决策。设计系统中不可或缺的是关于排版、交互模式以及**不应包含哪些功能**（例如工具提示和自定义选择器）的偏见性指导，以确保消费团队无需盲目猜测。将你的系统视为供消费团队使用的直观产品，并将针对残障人士的包容性视为一项需求而非加分项。\n\
  \n接下来是无障碍测试指南——涵盖 Web 和移动端，哪些方法有效、哪些会失效以及哪些是真正重要的。你将学习如何将自动化检查与手动测试相结合，如何筛选哪些问题最值得修复，以及如何将其整合到真实的开发工作流中。\n\
  \n# 11 用于无障碍评估与排序的工具与技术\n\n*作者：Kai Wong, CPACC, CHES* ^®\n\n无障碍是为了创建让所有人都能使用的数字体验。即使一个设计看起来符合无障碍标准，许多问题可能也隐藏在底层——代码之中。\n\
  \n无障碍测试桥接了设计意图与实际用户体验之间的差距。它是`质量保证`（`QA`）的重要部分。就像任何其他质量检查一样，评估产品的无障碍性涉及测试。\n\n《Web\
  \ 内容无障碍指南》（`WCAG`）是一项被广泛接受的技术标准，可以指导数字无障碍测试。你可以在万维网联盟会（`W3C`）网站（[www.w3.org](https://www.w3.org)）上找到指南的最新版本。\n\
  \n本章概述了数字无障碍测试工具和技术，重点关注 Web 和移动应用无障碍测试、面临的挑战以及需要注意的常见问题。你将学习如何结合自动化和手动测试方法、优先考虑修复事项，并将无障碍引入开发工作流。目标是什么？帮助你和你的团队进行更智能的测试，构建更具包容性的产品。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n*   选择合适的自动化测试工具\n*   执行有效的无无障碍审计\n*   解释并优先处理无障碍测试结果\n*\
  \   将无障碍测试集成到开发工作流中\n\n# 选择合适的自动化测试工具\n\n谁不喜欢好用的捷径呢？我很喜欢，所以让我们聊聊自动化测试工具。使用自动化工具是进行无障碍检查的一种简单、快速的方法，生成结果的速度比烤面包还快。在几秒钟内它们就能发现无障碍问题，例如缺少替代文本、颜色对比度差、表单元素缺少无障碍名称以及文档语言缺失。\n\
  \n目前市场上已有多种自动化工具可用。在选择无障碍自动化测试工具时，请考虑以下关键因素：\n\n*   `用户界面`：工具是否直观且易于导航？它本身符合无障碍标准吗？\n\
  *   `可靠性`：测试结果是否一致且可重复？\n*   `易用性`：它需要培训吗，还是新手也能上手？\n*   `浏览器和设备支持`：它是否在你需要的浏览器和设备上运行？\n\
  *   `维护`：工具是否定期更新？\n*   `成本`：工具是免费的还是收费的？如果你发现一个需要订阅或付费的工具，请先用免费试用进行测试。探索你的选项，找到符合你需求和预算的。在大多数情况下，免费版就足够。\n\
  *   `标准`：该工具是否根据你的目标合规级别进行检查（例如 `WCAG 2.2 Level AA`）？\n\n大多数自动化无障碍工具可以直接在开发者工具中、作为移动应用或浏览器扩展程序免费提供。下表比较了常用的免费自动化工具：\n\
  \n| `工具` | `平台` | `功能` | `缺点` |\n| --- | --- | --- | --- |\n| `WAVE by WebAim` ([www.wave.webaim.org](https://www.wave.webaim.org))\
  \ | Web | <<ul>><li>浏览器扩展程序</li><li>>在侧边栏中打开</li><li>>在加载状态下扫描完整页面</li><li>>显示页面结构（如标题），并使用页面图标突出显示结果</li></ul>\
  \ | <<ul>><li>页面可能会因为图标过多而变得混乱</li><li>>未指示所发现问题的影响级别</li></ul> |\n| `axe DevTools\
  \ by Deque` ([www.deque.com/axe/devtools](https://www.deque.com/axe/devtools)) |\
  \ Web | <<ul>><li>浏览器扩展程序</li><li>>在浏览器开发者工具内部打开</li><li>>在加载状态下扫描完整页面</li><li>>可以逐个突出显示问题</li><li>>每个标记的问题都列出了相关需求和影响级别</li><li>>高级升级选项包括部分页面扫描、用户流扫描、报告导出和引导式手动测试功能</li></ul>\
  \ | <<ul>><li>初次使用该工具具有一定的学习曲线</li><li>许多功能需要升级到付费版本</li></ul> |\n| `Lighthouse\
  \ by Google Chrome` | Web | <<ul>><li>由于在 Chrome 开发者工具中，无需下载</li><li>易用的用户界面</li><li>使用与\
  \ axe DevTools 相同的库，这是一个无障碍测试领域受信赖的框架和广受尊敬的资源</li><li>提供 100 分的评分，对页面的整体无障碍状态进行快速、高层级的评估</li><li>还可以检查性能、SEO\
  \ 和最佳实践</li></ul> | <<ul>><li>高分可能会误导人们认为网页完全无障碍</li><li>有时它会比 axe DevTools 的最新版本后一个版本</li></ul>\
  \ |\n| `Accessibility Inspector by Apple` | iOS 和 macOS 移动应用 | <<ul>><li>Xcode 中可用的开发者工具</li><li>提供有关特定元素的原始无障碍信息</li><li>提供检查功能、VoiceOver\
  \ 模拟和屏幕级审计</li></ul> | <<ul>><li>由于它是 Xcode 的一部分，该工具主要供开发人员在开发阶段使用。对非开发人员或测试人员来说不太方便。</li><li>涵盖的测试项目有限</li></ul>\
  \ |\n| `Accessibility Scanner by Google` | Android 移动应用 | <<ul>><li>可以从 Google Play\
  \ 商店下载的应用</li><li>可以扫描单个屏幕或一系列屏幕</li></ul> | <<ul>><<li>涵盖的测试项目有限</li></ul> |\n\n\
  图 11.1: 免费自动化工具选项\n\n11.1 中的工具是根据预计用户数和个人经验选择的。还有许多其他选项（特别是 Web 工具）。\n\nW3C 的 `Web\
  \ 无障碍评估工具列表`（[www.w3.org/WAI/test-evaluate/tools/list](https://www.w3.org/WAI/test-evaluate/tools/list)）提供了超过\
  \ 65 种自动化测试工具的信息。你可以根据目的、成本、操作系统、语言和标准来筛选工具。\n\n由于许多工具是免费的，同时使用多个并没有坏处。像在冰淇淋店一样“双份”吧！随心使用多少个。比较结果并交叉检查准确性。\n\
  \n这些工具好得令人不可置信吗？是的，某种程度上确实是。自动化工具只能涵盖标准无障碍测试需求的 30% 到 50%。以下是一些逃过了自动化工具但后来被手动测试人员或最终用户发现的例子：\n\
  \n*   表单元素（如单选按钮）的无障碍名称中包含 `null` 或 `object`，但在可见按钮标签中没有\n*   在不运行屏幕阅读器的情况下，无法仅通过键盘激活的链接\n\
  *   当网站主页缩放至 400% 时，有几行重要的文本发生重叠\n\n这意味着即使一个屏幕通过了所有自动化工具检查，可能仍然存在无障碍问题。这就是手动测试和用户反馈发挥用场的地方。\n\
  \n\n\n\n\n许多数字无障碍问题取决于上下文，并需要人工审核。自动化工具是一个可靠的起点，但它们仅仅是开始。请务必通过手动检查以及来自真实用户（尤其是残障人士）的见解来支持它们。彻底的手动测试和多样化的用户反馈是创建无障碍、易用体验的关键。接下来让我们来看看有效的手动测试方法。\n\
  \n关于自动化工具和手动测试的更深层次分析，请查看 Adrian Roselli 的博客文章：`Comparing Manual and Free Automated\
  \ WCAG Reviews` ([`adrianroselli.com/2023/01/comparing-manual-and-free-automated-wcag-reviews.html`](https://adrianroselli.com/2023/01/comparing-manual-and-free-automated-wcag-reviews.html))。\n\
  \n# 执行有效的无无障碍审计\n\n诚然，自动化测试工具可以帮助你快速发现无障碍漏洞，但如果你仅步于此，你就错过了最棒的部分：手动测试。没错，是时候卷起袖子进行手动测试了。\n\
  \n手动测试方法将发现自动化工具无法发现的问题。这就像清理宠物毛发：吸一次吸尘无法清理干净；你可能需要使用粘毛器来确保完全没有毛发。这就是为什么使用多种工具和多种测试方法对于确保无障碍性至关重要。\n\
  \n在本章中，我们将交替使用“问题（issues）”和“漏洞（bugs）”。此外，除非特别说明，以下信息适用于 Web 端和移动端。\n\n为了保持易于理解，我在本章中不会深入探讨\
  \ WCAG，但讨论的大多数测试策略都与 WCAG 标准有关。如需特定标准或深入研究每个测试领域，请参考官方 WCAG 文档。\n\n## 键盘导航是关键\n\n\
  某些视觉或行动障碍的人士可能使用替代输入方法（如键盘）来导航数字内容。网站和移动应用程序应该在不触摸屏幕或不点击鼠标的情况下完全可用。因此，焦点顺序（即使用替代输入方法导航时接收焦点的元素顺序）和键盘导航是必须测试的。\n\
  \n如果你有鼠标，在你完成手动测试时，尽管让你的猫玩玩它吧。与此同时，你可以测试焦点顺序，并确保所有元素仅使用键盘即可到达。\n\n你可以使用无线键盘（如蓝牙键盘）在移动设备上测试键盘导航。\n\
  \n从网页顶部开始，使用 `Tab` 键从交互元素移动到另一个交互元素。交互元素的示例包括按钮、链接、下拉菜单、滑块、开关、复选框和文本字段。按 Tab 应该带你穿过页面，并在焦点元素上显示可见的焦点指示器（即轮廓）。\n\
  \n确保焦点顺序是逻辑性的（通常意味着键盘向前移动与页面的顺序和含义一致）并且具有相当的可预测性。它不应该像在热炉上烤大蒜一样在页面上乱跳。在大多数情况下，焦点应该从上到下、从左到右。如果你在按\
  \ Tab 键时焦点突然消失了……恭喜你，你发现了一个漏洞！\n\n你可以参考下表来测试常见 Web 元素上的键盘导航：\n\n| 元素类型 | 键 |\n|\
  \ :--- | :--- |\n| 按钮 | `Enter` 或 `Spacebar` 激活 |\n| 链接 | `Enter` 激活 |\n| 选择下拉列表或组合框\
  \ | `Enter` 或 `Spacebar` 展开 |\n| 复选框 | `Spacebar` 选中 |\n| 单选按钮 | `Spacebar` 选中 |\n\
  | 开关 (Toggle) | `Spacebar` 开启/关闭 |\n| 滑块 | `Arrows` 增加或减少 |\n\n## 网站常见的键盘交互\n\n\
  移动设备有自己的键盘命令。常见的有 `Tab`（向前移动）、`arrow`（向某个方向移动）和 `spacebar`（激活）。\n\n## 熟悉屏幕阅读器\n\n\
  使用常用的屏幕阅读器（如 `NVDA` (Windows)、`JAWS` (Windows)、`VoiceOver` (macOS 和 iOS) 以及 `TalkBack`\
  \ (Android））进行测试是至关重要的一部分。\n\n在使用屏幕阅读器进行测试时，它们通常有两种工作模式：浏览模式（browse mode）和焦点模式（focus\
  \ mode）。浏览模式用于阅读内容（如段落和标题），焦点模式用于与控件交互。\n\n这是你第一次使用屏幕阅读器，你可能会发现它说话很快。大多数日常用户以全速使用，但如果你不常用，请调慢速度。刚开始慢一点并不丢。\n\
  \n对于交互元素（如按钮或链接），屏幕阅读器应该先宣布标签，然后元素类型（称为其“角色”role）。例如，一个文本标签为“加入购物车”的按钮应该读作“加入购物车，按钮”。如果视觉标签显示“加入购物车”但屏幕阅读器读作“立即购买，复选框”，那就是大忌，会困扰或误导用户。\n\
  \n此外，如果无障碍名称（accessibility name）与元素的文本标签不匹配，可能会给通过语音导航的用户带来麻烦。语音导航时，用户通过说可见标签来选择元素。如果视觉标签与无障碍名称不同，辅助技术可能无法识别该元素或对语音命令做出响应。不过，技术进步可能会改进这一点，请关注最新的操作系统和软件更新。\n\
  \n注意其他常见的屏幕阅读器问题，例如：\n\n- 缺少角色或元素类型（例如没有说明按钮是按钮）。\n- 装饰性未未忽略。\n- 标题使用不当（例如顺序不逻辑或缺乏描述性）。\n\
  - 行内错误消息未被宣布。\n- 表单字段缺少必或可选指示。\n- 状态消息未被宣布。例如，如果提交了表单，应该有一个成功消息指示已提交或保存。\n- 影响用户体验的焦点管理问题。\n\
  \n### 移动设备特定的屏幕阅读器技巧\n\n在设备的无障碍设置中开启屏幕阅读器（或询问默认语音助手），然后使用手势测试移动应用程序。手势是使用屏幕阅读器导航移动设备的常用方式。\n\
  \n常见手势包括：\n\n- **向右滑动**：向移动移动焦点\n- **向左滑动**：向后移动焦点\n\n\n\n\n\n* **单击**：选择项目\n* **双击**：激活焦点处的交互式元素\n\
  * **三指滑动**：按手指滑动方向滚动页面（仅限 iOS）\n* **双指滑动**：与上述操作相同，但适用于 Android\n\n通过屏幕阅读器和手势操作，检查焦点顺序、屏幕阅读器公告和核心功能行为是否符合预期。\n\
  \n## 检查图像描述\n\n自动化工具非常擅标记缺失的图像描述（通常称为 `alternative text` 或 `alt text`），但它们无法判断文本是否有帮助或准确。这正是手动测试用用场。\n\
  \n辅助技术应该以传达目的的方式描述有意义的图像。测试 `alt text` 的一种方法是导航图像并观察屏幕阅读器或盲文输出。听（或读））公告的内容，并问问自己：这听得通吗？它在不变得过于复杂的情况下增加了价值吗？\n\
  \n注意图像描述的长度——它应该详细且简洁（没有人需要小说）。如果图像包含重要文本，请确保这些文本包含在 `alt description` 中。如果图像仅是装饰性的，屏幕阅读器甚至不应该提到它。\n\
  \n想双重检查网站上的 `alt text` 吗？打开浏览器的开发者工具，检查元素，并在 HTML 代码中查找 `alt=\"\"` 属性。`alt text`\
  \ 就是引号之间的内容。如果图像纯属装饰性，代码中仍应有 `alt=\"\"` 但引号之间没有文本。这告诉辅助技术：“嘿，朋友，你可以忽略我。我只是在这里营造视觉氛围的——仅此而已，不多也不少！”\n\
  \n## 测试各种状态下的页面\n\n不要停于此。还有更多内容可以探索！错误消息、加载指示和内容变化（例如展开手风琴面板以显示文本）被公告了吗？如果没有，这种体验将不尽人意，并让许多终端用户感到迷茫或沮丧。\n\
  \n手动检查动态内容的行为是非常重要的，因为大多数自动化工具只测试页面加载时的状态。例如，它可能不会测试菜单或手风琴在展开时、在存在内联错误消息时，或在选择预约时间后出现日期选择器的情况。\n\
  \n在使用屏幕阅读器和键盘导航时，探索这些额外状态。当你遇到菜单时，确认你可以在不使用鼠标的情况下到达菜单中的所有选项，并且屏幕阅读器准确地播了所有选项。\n\n\
  ## 关注重点：你的产品\n\n视力低或其他残障人士可能会使用放大数字文本或内容的功能。这就是为什么在不同的缩放级别和字体大小下测试你的体验非常重要。在移动设备上双指缩放或增加网络浏览器的缩放级别，以确保所有内容重新排列，而不出现重叠、截断或功能减弱。\n\
  \n然后，使用大字体进行测试。在设备或浏览器设置中调整字体大小，然后验证所有文本是否按比例调整、无内容重叠且无功能丢失。\n\n## 颜色至关重要\n\n色盲非常常见。因此，确保不要仅使用颜色来提供指令或传达含义。例如，字段中的错误不应仅用红色标记；它们还应该由屏幕阅读器公告内联错误消息。这并不意味着你不能使用颜色，你不应该仅用颜色指示含义。\n\
  \n此外，确保你的数字体验具有足够的色彩对比度。大多数情况下，自动化工具可以发现色彩对比问题；但可能会遗漏。你可以对页面进行快速视觉扫描，寻找任何低对比度的文本和非文本元素。如果你页面上的任何内容看起来像洗了很多次（即褪色了），是时候和你的设计师聊聊了。\n\
  \n## 更多核心检查\n\n还有其他几点需要手动检查：\n\n* 简单且正确的标题结构\n* 无快速闪烁的内容\n* 致一致的导航\n* 动画和视频具有暂停和播放的方法\n\
  * 视频带有字幕\n* 音频带有转录文本\n* 会话超时警告，允许用户延长会话\n\n最后来看一些针对移动端的考虑因素：\n\n* **方向支持**：设备可以在竖屏或横屏模式下使用。这涉及到可访问性，因为有些人的手机或平板电脑处于固定位置，例如安装在轮椅上。在各种方向下测试你的数字产品以确保支持。当你水平旋转手机时，你的\
  \ App 或移动网站的视图应无缝切换到横屏视图。同样，当你将移动设备换回垂直位置时，内容应切换回竖屏视图。在两种位置下，内容都不应重叠、截断或丢失功能。\n\n\
  * **内置辅助功能**：移动设备上有许多辅助功能，因此测试它们在你的 App 或移动网站中的工作情况非常重要。这些功能通常位于`设备设置`或`辅助设置`下。\n\
  \n某些功能在 iOS 和 Android 上的名称略不同。请参考下表中的若干示例。\n\n| 功能 | Android 名称 | iOS 名称 |\n| ---\
  \ | --- | --- |\n| **语音导航** | Voice Access | Voice Control |\n| **文本转语音** | Select\
  \ to Speak | Spoken Content |\n| **屏幕阅读器** | TalkBack | VoiceOver |\n| **增大字体大小**\
  \ | Font Size | Larger Text |\n| **高对比度** | High Contrast Text | Increase Contrast\
  \ |\n| **减少动画** | Remove Animations | Reduce Motion |\n| **替代输入** | Switch Access\
  \ | Switch Control |\n| **放大屏幕内容** | Magnification | Zoom |\n\n\n\n\n\n一旦识别并优先处理了阻塞问题（blockers），请将注意力转移到严重问题（serious\
  \ issues）。严重问题会显著干扰或加重用户体验。这些问题会让你的产品变得非常难以使用，但它们并不一定会阻止核心功能的实现。\n\n严重问题的示例包括：\n\
  \n* 包含公司愿景声明的图像缺少替代文本（alternative text）\n* 预录视频缺少字幕；如果视频内容对于完成某任务至关重要，则它可能被视为阻塞性问题\n\
  * 文本密集的网页没有标题\n\n### 中等问题 (Moderate issues)\n\n在处理完阻塞性问题和严重问题之后，你可以转向中等问题。中等问题可能会让终端用户感到不便或引起注意，但并不会显著影响用户体验。\n\
  \n中等问题的示例包括：\n\n* 屏幕阅读器朗读了一个或两个装饰性图像\n* 几处文本的颜色对比度中等偏低\n* 一个简单的短页面缺少标题\n* 屏幕阅读器在必填表单字段上朗读了两次“需要”（Required）\n\
  \n### 其他需要考虑的因素\n\n其他因素会影响解决某个问题的紧急程度。请考虑问题存在的广泛背景：\n\n* **频率**：此问题影响了多少页面？在页面上发生了多少次？例如，如果一个页面朗读了\
  \ 1 个装饰性图像，其影响比一个页面朗读 10 个装饰性图像要小。\n* **用户反馈**：客户是否报告过由于无障碍问题导致的糟糕体验？这些问题的严重程度如何？高还是低？\n\
  * **位置**：问题是否出现在你访问量最大的页面上？它是否影响了业务关键的用户流程？还是它发生在一个流量极小的过旧活动页面上？\n* **范围**：问题是出现在可复用组件中还是局限于局部？全局性问题——影响多个页面相同组件的问题——应该在修复工作早期优先考虑。一个常见的例子是共享导航菜单中的无障碍问题。如果首页导航菜单没有焦点指示器，那么相同的问题可能在所有使用该菜单的其他页面上都会。解决全局性问题有助于在你的数字产品中创建更一致、无障碍的体验。\n\
  \n缺乏无障碍经验的团队通常选择先修复容易的“低挂果实”（low-hanging fruit）。这可能是由于几个因素造成的：对处理更复杂的问题缺乏信心、未完全理解某些漏洞对用户的影响，或者由于优先级排序工作的缺失而缺乏方向。\n\
  \n虽然这种方法可能有助于快速减少漏洞数量，但对终端用户的影响通常微乎其微。然而，低成本的修复有时可以推动意义的改变。虽然小投入的修复有时能带来重大变化，但在衡量投入水平的同时权衡潜在影响至关重要。你的优先级排序工作将对此帮助。\n\
  \n通过优先处理更严重的问题，你可以通过消除障碍和改进用户体验为终端用户带来巨大改变。这还能帮助你避免客户因严重的无障碍缺陷或更糟糕的问题而无法使用你的产品（例如处理索函和法律纠纷）。\n\
  \n## 仪表板 (Dashboards)\n\n还记得那一大堆无障碍漏洞吗？考虑创建一个仪表板来帮助理清这一切。仪表板可以帮助你解读测试结果、跟踪修复进度并为你的策略提供参考。仪表板中常见的跟踪变量可能包括：\n\
  \n* 问题类型/类别（例如：屏幕阅读器问题、颜色对比度或键盘导航）\n* 优先级级别（通常是影响严重程度的功能）\n* 受影响的用户群体\n* 修复状态（例如：未开始、进行中或已解决）\n\
  * 用户流程\n* WCAG 成功标准\n* 辅助技术\n\n规划修复工作需要时间和精力，但它能为你的公司、团队或业务提供巨大的指导。一个经过排序的待办列表和一个组织良好的仪表板可以帮助你的团队从“我们从哪里开始？”变为“嘿，我们搞定了”。这还将帮助你设定项目里程碑并优先交付影响最大的更改。\n\
  \n深思熟虑的排序和策略性的修复不仅对业务有利，对残障人士来说也是赢。\n\n有了这些见解指导你的测试和修复工作，你正处于正确的道路上。现在，让我们从被动转为主动。是时候领先一步，将无障碍测试直接织入到你的开发工作流中了。\n\
  \n# 将无障碍测试集成到开发工作流\n\n你知道什么比发现并修复无障碍漏洞更好吗？从源头上防止它们的产生！要做到这一点，你必须将无障碍融入你的**软件开发生命周期**（**SDLC**）过程中，并使其成为文化的一部分。将无障碍可持续地集成到开发工作流中需要周全策略、工具以及一些尝试，以找到适合团队的方法。\n\
  \n从定义大家都会努力实现的标准开始，例如 WCAG 2.2 AA。获得领导层的支持并记录你的决定。考虑创建一项执行以下内容的政策：\n\n* 规定无障碍要求\n\
  * 分配职责\n* 概述监控和执行的方法\n* 识别相关的工具和技术\n\n政策和标准是坚实的基础，但它们本身不会改变行为。这就像拥有一份组装家具的说明书。诚然，说明书很有用，但如果没有正确的工具、投入和努力，结果可能并不如意。你需要将无障碍集成到你的开发工作流和团队文化的每个部分：\n\
  \n* **培训**：频繁且有针对性的培训可以建立意识，并赋予人们执行无障碍任务所需的技能。高度参与感且有效的培训计划还可以驱动文化变革。\n\n你可以与你的学习与开发团队合作，将无障碍小知识融入现有的培训计划中。\n\
  \n* **工具与测试**：正如本章前面提到的，开发者和 QA 团队应该在使用其他代码功能检查的同时，同时使用自动化和手动测试方法。开发者还可以使用无障碍检查工具（linters）在\
  \ QA 阶段之前捕捉问题。\n\n为了使操作具有可执行性，请具体。不要只说“需要 WCAG 2.2 AA”，要指明使用哪些工具、测试哪些内容以及常见问题。QA\
  \ 工程师声称他们“做过无障碍测试”但只运行了自动化工具，这种情况并不罕见。通常，他们并没有意识到预期是什么。清晰的指令有助于弥补这一差距并确保测试的彻底。\n\
  \n* **需求**：将无障碍标记为一项需求，例如将其添加到全局**完成定义**（**DoD**）中，或作为**验收标准**（**AC**）的一部分。DoD 是敏捷团队内部的共识，定义了产品增量必须满足的被认为完成的标准。AC\
  \ 概述了用户故事必须满足的被认为完成并按预期运行的标准。与你的发布训练工程师、产品和工程负责人以及 Scrum Master 合作来实现这一目标。\n\n\n\
  \n\n\n- **文档**：在测试计划和错误报告模板中记录可访问性工具选择、特定的测试预期以及贵公司或团队的技术标准（例如 `WCAG 2.2 AA`）。创建易于操作的检查清单，帮助开发人员和质量保证（QA）工程师进行可访问性测试。指定工具名称、设计考虑或关键测试步骤的基于角的可访问性清单非常有帮助。将指南和清单存储在开发人员和\
  \ QA 经常访问的地方，例如内部错误跟踪系统、内网或知识库。\n\n良好的检查清单可以帮助人们独立学习，并从一开始构建更具包容性的产品。但在开始创建之前，请花些时间思考目的和受众。\n\
  \n创建清单时，请注意以下几点：\n\n1. **定义受众和目的**：这份清单是给谁用的？他们需要完成什么？\n2. **确保可操作性**：每个项目都应该是具体的任务（例如，`确保所有表单字段都有关联标签`，而不是\
  \ `检查表单可访问性`）。\n3. **赋予结构**：将相关任务分组，使清单易于使用。\n4. **包含实用资源**：链接到相关工具、浏览器扩展或测试说明，帮助人们完成每项要求。\n\
  5. **迭代与更新**：根据反馈不断改进清单。随着最佳实践的演进进行更改，并使用版本控制标记更新时间。\n\n大多数人并不是可访问性专家。使用通俗语言编写清单和资源，并以多种格式（例如截图、视频、文字）演示测试方法。帮助人们感到自信，而不是困惑。\n\
  \n然而，请记住，清单只是一个有用的起点。正如[第 2 章](#02.xhtml__idTextAnchor033）提到的，可访问性本身不仅仅是一份清单。它是对质量、可用性和人的承诺。毕竟，数字可访问性同时影响着构建技术的人和使用技术的人。\n\
  \n如果你正处于将可访问性整合到开发工作流中的过程中，请记住改变并非易事。本章中的内容对组织和客户都有实质性的影响。我们讨论了优先考虑客户反馈的重要性，但不要忽略你的同事设计师、开发人员和\
  \ QA 的声音。他们对工具、清单和流程的反馈可以带来定制化的改进。此外，倾听他意见可以建立关系、信任和更好的工作环境。\n\n努力让预期变得可操作且可管理。你可以通过为开发人员和\
  \ QA 工程师提供正确的工具和信息，使可访问性任务成为他们日常工作的一部分来实现。\n\n将可访问性嵌入现有的开发工作流中，不仅能够创建更具包容性和用户友好的产品，有助于塑造一种可访问性优先的思维文化。最终，最终目标是防止新的可访问性障碍到达终端用户。找到适合团队的方法，在此过程中收集反馈，并进行迭代改进。\n\
  \n# 总结\n\n本章介绍了确保你的网站或移动 App 对于残障人士可用的基础知识，重点关注测试工具和技术。我们探索了自动化和手动测试方法的“双剑客”、优先级排序的重要性，以及如何将可访问性引入开发工作流中。\n\
  \n这里涵盖的主题是构建成功的数字可访问性计划的基础，特别是在质量保证领域。有效的测试和修复确保了包容性设计转化为高质量的用户体验。可访问性是一场旅程，需要所有团队的持续监控、努力和协作。无论是一行代码、一个测试用例还是一个错误\
  \ —— 每一个微小的行动都会汇聚成多。\n\n在下一章也是最后一章中，你将学习如何将可访问性策略嵌入到组织中。\n\n# 12\n\n# 构建包容性设计文化：组织策略\n\
  \n*作者 Denis Boudreau, CPWA*\n\n我们来到了最后一章。让我先重复一个贯穿本书讨论过的教训：只有当可访问性嵌入组织的文化中时，包容性设计才能蓬勃发展，而不是将其视为事后诸葛或最后一刻的补救。将可访问性构建到工作流中、跟踪有意义的进展并投资于持续学习的组织能够更好地满足所有用户（包括患有各种残障的人）的需求。将可访问性视为共同责任而非限制性义务的团队，最终为所有人创造了更强大、更具包容性的数字体验。此此。\n\
  \n作为对本书的总结，本章将探索实用策略，使可访问性成为组织工作的持久的一部分。这种转型始于通过沉浸式体验建立同理心，并帮助跨职团队理解可访问性障碍对其预期服务的受众产生的真实影响。\n\
  \n在最后一章中，我们将重点关注构建包容性设计文化的四个主要策略：\n\n- 通过沉浸式体验培养同理心\n- 将可访问性整合到设计和开发工作流中\n- 衡量并报告可访问性进展\n\
  - 将持续学习织入包容性设计\n\n无论你是领导一个组织、管理团队，还是直接参与数字产品或服务的设计和开发阶段，本章介绍策略都将帮助你超越意识阶段，直接采取行动。将可访问性嵌入日常决策的团队是那些成功创造出适合所有人的体验的团队。\n\
  \n毕竟，正如已故的 John Slatin 曾说过的：“良好的设计就是可访问性的设计。”\n\n# 通过沉浸式体验培养同理心\n\n我想先分享一些关于同理心的见解，因为同理心是包容性设计最强大的驱动力之一。不是那种“让我们互相友好相处”的自我良好的版本，而是通过目睹真实的人在挣扎而获得的原始的、平视的理解。\n\
  \n当设计团队目睹终端用户遇到可访问性障碍时，残障包容会迅速从一组限制性的理论要求转变为一种大开眼界的、有意义的共同责任。\n\n大多数专家都会同意，积极拥抱包容性设计的组织最终会接触更多客户，降低法律风险，并在不断变化的用户需求和预期面前保持领先。这确实是我多年来的观察结果。\n\
  \n虽然可访问性培训课程、治理政策和基于角色的清单确实具有长远影响的潜力，但真正的变革并非通过可访问性审计来实现的。它是通过与具有相关生活经验并以不同方式感知世界的人直接互动。\n\
  \n## 亲身体验可访问性障碍\n\n大多数设计、开发和领导岗位的专业人士可能永远不会使用屏幕阅读器。很少有人甚至可能在某天不使用鼠标导航网站，或仅使用语音填写表单。\n\
  \n由于缺乏对数字空间替代性但有效方式的亲身体验，对于大多数人来说，可访问性与设计脱节，这并不意外。\n\n能够以残障人士的方式与数字产品交互的创意团队可以更清楚地看到由于缺乏数字包容性而带来的差距和挑战。这种意识到会导致更深思、更具包容性的设计决策，从而带来更具包容性的在线体验。\n\
  \n\n\n\n几年前，我指导了一家大型软件公司的 UX 团队，他们需要提高平台的可访问性（accessibility），但不知道从何处入手。作为我们合作的一部分，我引导他们参加了一场工作坊，他们花费了几个小时的时间，仅使用键盘和屏幕阅读器在平台上进行导航，并在过程中记录了观察结果。\n\
  \n作为一种实验，我们还为他们提供了眼罩，以便他们能够发现此前从未被察觉的重大可用性问题。困惑的按钮标签、缺失的替代文本（alt text）、键盘导航陷阱以及几十种其他可访问问题突然变得触目易见。\n\
  \n这些问题不仅仅是细微的不便，而是阻碍真实用户独立使用平台的真正障碍。尽管 UX 团队在在此之前没有注意到这些问题，但这些问题已经困扰了残障人士的用户体验几个月，甚至多年。\n\
  \n对于该团队来说，这无疑是一次大开眼界的经历，但我很清楚情况，所以我为他们准备了另一个惊喜。当他们完成对网站替代导航方式的实验后，我向他们介绍了 Tim，我的一位盲同事。\n\
  \n我的同事使用了完全相同的工具（去掉了眼罩，我知道那是个误导性的主意），发现了一系列团队未能识别的额外问题，例如 ARIA 标点的使用不当、对动态交互缺乏反馈、过度使用模糊的链接文本、不清晰的行动召唤（call\
  \ to action）状态，以及缺少纯视觉线索的文本替代方案。\n\n让所有人印象最深的是 Tim 发现的问题性质与他们发现的问题有何不同。戴着眼罩的团队发现了许多浅层障碍，而\
  \ Tim 的洞察要深入得多。他注意到了系统性的导航问题、反馈的缺失以及结构元素的缺失，而这些只有有相关生活经验的人才会知道去寻找。他多年使用辅助技术所塑造的肌肉记忆、心理映射和直觉预期，使他能够触及模拟实验无法复制的问题。\n\
  \n我知道这是一节该团队只有通过亲身实践才能理解的课程。模拟练习有时可以提高意识，是的，但它们无法带来可持续的、现实世界的解决方案。它们可能开启对话，但无法替代来自生活经验的洞察，因为真正的可访问性源于对残障人士的倾听（并直接向他们学习），这毫无疑问地证明了当你“伪装成残障”时，你的程度是有限的。\n\
  \n## 为什么残障模拟是不够的\n\n出于迫切希望为残障包容性提供有力支持，用意良好的品牌尝试通过我们所谓的“残障模拟”来提高意识和同情心，这并不罕见。正如我们刚刚观察到的，这通常不是好主意，因为虽然残障模拟练习在理论上听起来很好，但在涉及到它们对患有这些疾病人士经历的隐含暗示时，它们却力不从心。\n\
  \n有些团队会要求员工戴上眼罩来体验盲，，就像我做的那样。其他团队会使用手套来模拟活动受限。我个人最反感的是企业让员工坐在轮椅移动，仿佛这样就能让某人理解活动受限的生活是什么样子。初看之下，这些用意良好的举措听起来是极佳的主意。但我多年前就学到了它们并非如此，我知道该团队唯一的理解方式就是将他们戴眼罩的经历与\
  \ Tim 的经历进行对比。\n\n事实上，所有这些练习通常达到的只是强化了关于“残障生活该有多糟糕”的误解，而不是对在残障情况下使用网页可能是什么样的建立真正的理解。这并不完全帮助，甚至是适得其反。\n\
  \n我还曾与一个营销团队合作，他们组织了实验室，让员工戴上降噪耳机和模糊目镜来模拟聋或盲。当被询问学到了什么时，回答在预料之中：“这太让人沮丧和压抑了。我只能想象变成聋或盲该有多困难！”\n\
  \n这正是残障模拟完全错误的地方：因为这些练习通常关注人们**不能**做什么，而不是关注他们如何与周围的世界互动，它们给参与者留下了怜情的感觉，而不是对真实解决方案更深层次的理解。\n\
  \n模拟所做的只能触及残障人士现实的表面，大多数盲人或聋人都会告诉你，这并不是他们体验世界（无论是数字世界还是其他）的方式。聋人不仅仅是在听力上有困难；他们使用字幕、转录或手语进行交流。盲人不仅仅是经历视觉受损；他们通过屏幕阅读器技术、触觉标记和空间意识进行导航。他们拥有工具并发展出了应对机制。他们拥有技术，这些技术通常经过多年生活经验的磨练。\n\
  \n组织不应该关注残障模拟，而应该专注于直接与那些拥有这些相关生活经验的人接触。通过让辅助技术用户测试他们的产品和服务，并并将可访问性整合到设计和开发的每一个阶段，品牌可以对障碍是什么以及如何修复它们建立真正的理解和观点。\n\
  \n但，是的，这起始于同情心。\n\n## 通过真实互动建立同情心\n\n团队培养同情心的最佳方式是向具有这些疾病相关生活经验的人倾听并学习。我记得几年前与一家金融科技公司进行过教练会议，当时\
  \ UX 团队正努力在移动应用程序中做好可访问性。\n\n尽管符合大多数 W3C Web 内容可访问性指南 (`WCAG`）的要求，他们仍然收到可用性投诉。因此，他们一些最关键的银行功能（如转账和查询\
  \ PDF 单）在屏幕阅读器技术下完全无法使用。他们的应用在技术上通过了大多数合规检查，但真实用户仍由于不可预见的挑战在关键时刻被卡。\n\n承认他们缺乏第一手视角，而不是猜测可能还有什么问题，他们选择与盲人和低视力客户一起进行可用性测试。这是一个明智的决定。\n\
  \n他们通过这个过程学到的知识比任何清单能提供的都要价值得多。遵循关于章节标题的可访问性指南是一回事，但观察使用屏幕阅读器的盲人如何从一个章节标题导航到另一个标题的各种方式，或者神经多样性个体与我们的用户界面交互时的认知负荷实际上是什么感觉，完全是另一回事。\n\
  \n在整合了从这些可用性会议中收集的反馈后，团队不仅修复了那些问题，还承诺在未来的所有产品测试中让残障人士参与。这种思维方式的转变最终为患有残障的客户带来了更好的体验。\n\
  \n这些变化在过程中也改进了其他所有人的体验，这证明了可访问性的最佳实践不仅增加了残障用户的体验，也增加了受益于真正以最终用户为中心的包容性体验的人的体验。\n\
  \n## 植入同情心并推动全公司范围的承诺\n\n\n\n\n共情是包容性设计最强大的动力之一，但它不应局限于一次性的研讨会，或仅限于设计和开发团队。如果我们想要真正转型组织文化，共情必须成为人们工作、协作和应对挑战的一部分。\n\
  \n建立这种共情的最有效方法之一是通过诸如“无障碍沉浸周”的活动，在活动中，员工和高管花时间仅使用键盘或基础辅助技术来操作自己的数字工具。这些体验并不是为了模拟残疾，而是为了暴露无法被忽视的障碍。当高层领导亲身体验这些障碍时，无障碍就不再是一个合规问题，而成为了领导力的优先事项。\n\
  \n但团队并不需要等待正式的活动或倡议就可以开始！即使是微小的日常时刻，例如尝试在不使用鼠标的情况下完成任务，或从无障碍的角度评审设计，都能激发洞察力并转变思维。关键在于通过经常接触和对话来建立动力，而不仅仅是单次活动。\n\
  \n那种认可的时刻往往是变革的开始。理解无障碍设计对现实生活影响的领导者更有可能支持有意义的行动，并赋能他人同样这样做。这时，无障碍倡者开始出现，包容性成为团队日常工作方式的一部分。\n\
  \n通过将无障碍融入设计评审来保持对无障碍关注的组织，也鼓励了残障用户提供反馈。他们意识到包容性的成功为持续的进步创造了空间，不再将无障碍视为额外工作，而是将其视为质量和创新的标志。\n\
  \n包容不再是他们仅仅为了避免诉讼而做的事，而是他们想要做的事，因为他们理解这为所有人带来的价值。\n\n## 将共情转化为行动\n\n共情可以发挥很大作用，但有人认为，只有当它导致真正的改变而非同情的情时才有价值。那些最成功地将无障碍和包容融入文化的组织并不仅仅步于提高意识；他们采取具体且可衡量的步骤，确保对客户群体的生活产生产生长期影响。\n\
  \n多年来，我领导了无数成功的无障碍培训计划，让员工感到深受启发，想要成为残障包容解决方案的一部分。我毫不疑问地将数百名设计师和开发者变成了无障碍的信者。但对于大多数参与者来说，一旦日常工作回到正轨，培训课程的魔力消失，他们的动力也会随之消失。为什么？因为如果无障碍从未真正成为优先事项，且实践没有建立在工作流中，那么其他考虑因素就会优先。\n\
  \n经验告诉我，为了确保无障碍仍然是流程的永久部分，组织必须引入政策，规定每个新产品在发布之前必须通过辅助技术用户的可用性测试。忘掉“仅仅符合 `WCAG`”吧。让残障用户参与是创造真正问责制并真正引导全范围内产生更具无障碍产品的唯一决策。\n\
  \n我目前支持另一个组织，他们建立了一项无障碍大使计划，以在跨团队和业务部门中维护无障碍工作。来自不同部门的员工自愿担任内部倡导，引导讨论、提出疑虑、保持对无障碍的关注……并在过程中学习。随着时间的推移，这种方法正在缓慢但坚定地引导整个组织的变革。这在很大程度上不是因为领导层的强制要求（他们确实要求了），而是因为看到价值的员工选择自己承担起无障碍的责任。\n\
  \n这些文化转变至关重要，但它们只有在结构的支持下才能持久。一旦共情打开了大门，将是系统、流程和日常决策让大门保持开启。这正是包容性设计和开发工作流大显身之地，也是无障碍从意图转向实施的最佳机会。\n\
  \n## 将无障碍集成到工作流中\n\n另一个需要记住的重要概念是，无障碍在构建到设计和开发的每个阶段效果最好，而不是作为事后补救或最后一刻的修补。\n\n当团队将无障碍视为政策、可用性或安全性——即必不可少而非可选的时，他们减少了昂贵的重复工作，做了更明智的决定，并为创造了更好的体验。\n\
  \n在这个领域取得成功的组织不会等到产品几乎完成才考虑无障碍。相反，他们从开始就将其嵌入工作流中，使其成为所有团队的共同责任。\n\n## 让无障碍成为团队责任\n\
  \n无障碍面临的最大且常见的障碍之一是假设它是他人的工作。设计师通常期望开发者来处理。开发者认为这是 `QA` 团队的责任。`QA` 团队觉得，如果其他人能多承担一点责任，他们的工作会轻松得多。当组织中确定了一位无障碍倡者时，情况变得更糟，因为那时其他人都可以推卸这部分责任。有一点肯定的：无障碍是一项团队努力，每个人都有可以发挥的角色。如果没有明确定义的责任，无障碍很快就会被遗漏。\n\
  \n更糟糕的情况是，一个小规模、资源不足的无障碍团队被要求“修复”源于流程中更早阶段决策的问题。这些团队通常发现自己被困在设计、开发、业务和 `QA` 之间，在努力倡导无障碍的同时，被要求批准尚未准备好的产品。他们花时间“灭火”并解释为什么存在障碍，而组织的其他部分则指责他们拖慢了速度或没有提供快速解决方案。\n\
  \n这是一个无法处理的境地，几乎会导致职业倦怠、挫败感和进展停滞。问问任何经历过那里的人。\n\n想象一家正挣扎于这一问题的软件公司。他们的无障碍修复总是来得晚，减慢了发布速度，让开发者感到沮丧，并导致了补丁式的解决方案而非持久的改进。通过重构他们的设计和开发工作流，使无障碍不再被视为事后补救，他们就可以停止依赖指定的无障碍倡者，而是开始将无障碍任务嵌入到每个角色中以提高成功率。\n\
  \n设计师可以负责确保色彩对比度符合 `WCAG` 标准**确保明显的焦点指示支持键盘导航，并确保图像包含相关的文本替代方案。正如我们在第 10 章（#10.xhtml__idTextAnchor240）中所看到的，在讨论包容性设计模式和组件时，利用语义化\
  \ HTML、构建无缝键盘导航系统并从一开始就使用自动化测试工具和辅助技术测试页面的开发者，可以真正推动无障碍的发展。`QA` 测试人员可以在他们的标准测试计划中包含自动和手动无障碍检查，并建立清晰的反馈循环，以便及时解决问题。\n\
  \n## 左移：从开始就将流程中构建无障碍\n\n\n\n\n\n“左移”的概念非常简单：数字无障碍越早地作为流程的一部分被考虑，就越容易集成到最终产品中。当团队从项目开始阶段就定义无障碍需求时，就能避免后期出现严重的无障碍障碍。\n\
  \n想象一家公司正受困于产品之间无障碍不一致的问题。有些团队优先考虑这一点，而另一些团队将其视为事后才。为了解决这个问题，他们决定构建一个无障碍设计系统。他们没有要求每个团队重复发明轮子，而是创建了共享组件：无障碍小部件、可用的色板、易读的字体以及经过良好测试的交互元素。通过将无障碍融入系统，团队不再需要盲目推测。个人设计师和开发人员的负担减轻了。无障碍变成了默认设置。\n\
  \n另一家机构可能会采取不同的路径。他们将无障碍审查纳入冲刺周期（s cycles）中，每两周检查一次新功能，而不是等到最后。这样做有助于团队在问题易于修复时尽早发现。随着时间的推移，这减少了最后时刻的手忙脚乱，并使产品的无障碍性更加一致。\n\
  \n采用任何一种方法的团队，如果能在每一步中都建立测试机制，就是最成功的。这意味着在每次代码提交中加入自动化扫描，以便在问题出现时立即捕捉诸如缺少 alt 文本、未标记表单字段或对比度问题等常见问题。但他们并止于此。在重大发布之前，他们还会使用辅助技术的真实用户进行可用性测试，从而发现自动化工具无法检测的深层问题，例如令人困惑的键盘焦点顺序或损坏的屏幕阅读器交互。\n\
  \n通过早期且频繁的测试，团队可以在问题上线前捕捉到更多障碍，从长远来看节省了时间和精力。这种测试方法帮助他们超越了技术合规性，从而能够成功地为残障人士创造出包容性的体验。\n\
  \n这两种策略——无障碍设计系统和基于冲刺的无障碍审查——都是“左移”的有效方式。真正重要的是，将无障碍实践有意识地、持续地融入流程之中。无论你是在基础阶段一次性构建，还是通过敏捷周期定期重新审视，关键在于让成为你工作方式的一部分，而不是日后手忙脚乱去修复的东西。\n\
  \n## 减少无障碍债\n\n忽视无障碍问题对终端用户的影响也会为组织带来“包容性债”。这会导致待办事项列表不断堆积，且随着时间的推移，修复成本变得越来越困难和昂贵。就像技术债一样，这些问题被忽视的时间越久，解决它们就越昂贵、越耗时。\n\
  \n尽管他从未参与过这一学科，但这位美国建筑师、设计师、作家和教育家弗兰克·劳德·赖特（Frank Lloyd Wright）最能捕捉数字无障碍的精髓。他在评价建筑设计时提前规划的好处时留下了名言：“你可以在图纸上使用皮擦，也可以在施工现场使用大锤。随你选择。”\n\
  \n让我想起我以前合作的一家媒体公司，他们多年来一直在积累无障碍债。每一个新版本的发布都会引入更多障碍，他们的无障碍修复待办列表不断增长。他们知道需要一个长期的解决方案，但他们能想出的只有临时补丁。为了打破这种循环，他们成立了一个无障碍突击小组：一个由设计师、开发人员和\
  \ QA 测试人员组成的专门小组，职责是在功能发布前进行审查。在一年内，他们将待办事项减少了近 60%，并终于了从第一天起就更加无障碍的产品。\n\n组建无障碍突击小组只是组织领先于无障碍债的众多方法之一。其他选择包括在待办事项清理（backlog\
  \ grooming）中优先考虑无障碍修复，将它们像任何其他关键问题一样对待，而不是推到以后。其他团队可能会选择在设计审查中增加无障碍检查点，以便在开发开始之前捕捉到潜在的障碍。\n\
  \n最具前瞻性的团队甚至会投资培训设计师和开发人员学习无障碍编码和设计模式，以从源上减少引入无障碍问题的概率。在这些每一个场景中，主动性都是关键。\n\n无论采取什么策略，最大的区别在于在过程中建立可见性和问责制，以防止这些问题再次出现。如果不跟踪已经修复了哪些、哪些仍然需要关注，无障碍债很容易再次开始堆积。减轻这种风险的最佳方法是将无障碍问题视为任何其他业务优先事项：通过对它们进行跟踪和报告。\n\
  \n# 衡量和报告无障碍进展\n\n现实是，如果你的组织无法跟踪进度，你的无障碍努力将毫无意义。这是因为如果没有清晰的基准和报告，无障碍往往会只是一个抽象目标，而不是可衡量的结果。取得真正进展的团队是那些将无障碍视为任何其他业务优先事项的团队。他们设定目标，建立问责机制，并定期审查结果。\n\
  \n尽管如此，直到今天，大多数组织仍然认为无障碍要么“已完成”，要么“未完成”。但这种心态阻碍了真正的进步……无障碍是一项包含许多（我的意思是，非常多！）环节的持续实践。只要团队拥有正确的数据来指导决策，它就可以并且随着时间的推移不断改进。有效地衡量无障碍意味着理解\
  \ `W3C` 指南，是的。但更重要的是，它意味着理解残障用户的实际体验，并跟踪贡献和反馈的长期影响。\n\n## 定义超越合规的成功\n\n许多组织开始通过合规标准来衡量无障碍，例如\
  \ `WCAG`、《美国残疾人法案》（`ADA`）、《加拿大无障碍法》（`ACA`）、《欧洲无障碍法案》（`EAA`）或其他当地法律要求。虽然合规性很重要，但它并不是终点。事实上，合规性仅仅是一个良好的起点。一个产品或服务在纸面上完全可以符合技术标准，但对于残障人士来说，可能仍然令人感到沮丧，甚至无法导航。\n\
  \n此时，问一个问题是公平的：如果满足 `WCAG` 并不能保证良好的体验，那么最初建立这些标准的意义何在？\n\n现在，不要误会我。`WCAG` 仍然发挥着关键作用，它提供了一份技术基准，帮助团队对齐工作并捕捉常见问题，但它并没有声称（也从未为此设计过）能捕捉用户体验或可用性的所有方面。`WCAG`\
  \ 定义的是下限，而不是天花板。这就是为什么那些止于无障碍合规的团队往往事与人意。真正的无障碍需要超越清单，积极倾听人们在现实世界中如何与你的产品交互。\n\n\
  在过去的 25 年里，我曾在无数客户身上经历过这种情况。当我写这些话时，我想起一家大型电子商务公司，他们亲身验了这一点。他们有一套内部无障碍审计流程，并确信符合\
  \ `WCAG` 标准。但当他们邀请盲人客户使用各种屏幕阅读器测试他们的网站时，他们惊讶地发现许多用户难以完成购买。\n\n\n\n\n\n他们的导航结构在技术上是合规的，但在功能上不可用。虽然他们页面中使用的大多数组件在孤立的情况下都符合无障碍指南，但整个界面严重依赖视觉线索来将所有元素连接在一起。由于其中许多视觉线索未能正确传达给辅助技术，导致了严重的理解鸿沟。视障用户无法追踪正在发生的情况，体验也随之崩溃了。\n\
  \n意识到这一点后，他们开始将重点从合规性转向易用性，并根据收到的反馈重新设计了关键交互。结果是，所有客户都获得了整体更好的体验，而且潜在转化率有了可衡量的增长。\n\
  \n根据我的经验，那些超越了合规性并对无障碍性采取更全局视角的组织是取得最大进展的。他们不再问“我们合规吗？我们符合指南吗？”，而是开始提出更好的问题：\n\n\
  *   残障用户是否可以轻松地导航、交互并完成任务？\n*   体验在包括移动应用、网站和文档在所有平台上是否保持一致？\n*   员工是否每天都在采用无障碍实践，还是仍然将其视为事后才考虑的负担？\n\
  \n心态的简单转变——从合规性转向易用性——可以产生深远的影响。\n\n## 选择正确的无障碍指标\n\n组织可以通过追踪技术、易用性和流程相关指标的混合，来可靠地衡量无障碍成功。最成功的组织并不依赖单一的数字或关键性能指标（`KPI`）来讲述完整故事，例如他们的产品恰好符合多少条\
  \ `WCAG` 成功标准；他们结合不同的数据点，以清晰地了解他们在哪些方面正在改进，以及下一步需要关注哪里。\n\n诸如通过自动化扫描的页面百分比、每个页面平均标记的问题数量，以及积压任务中已解决与未解决的无障碍漏洞比例，都是有用指标的示例。团队可能还会跟踪用户提交的无障碍相关工单数量、解决这些问题的平均时间，或者无障碍阻碍因素延迟产品发布的频率。在流程方面，他们可能会查看完成无障碍培训的团队成员百分比、集成到设计和开发工作流中的无障碍检查点数量，或者辅助技术用户参与可用性测试的频率。\n\
  \n想象一家想要更系统地跟踪其无障碍进展的医疗公司。为了做到这一点，他们可能会引入季度无障碍评分卡，仔细审查自动化测试结果，捕获并跟踪用户报告的问题，并从辅助技术用户收集反馈。\n\
  \n在他们的情况下，这可能包括跟踪数字预约工具的无障碍性、患者和医疗提供者电子病历的易用性，或者他们的移动应用在处方补充期间对屏幕阅读器的支持情况。随着时间的推移，他们可能会发现某些模式，例如某些团队在持续改进，而另一些团队却在不断重复相同的无障碍错误。\n\
  \n我找不到更好的方法来让组织识别并修复其数字资产中的无障碍问题了，那就是针对特定区域进行培训和改进。如果没有这种跟踪，任何团队又如何识别自己的薄弱环节在哪里呢？\n\
  \n但要让任何无障碍指标产生意义，团队需要既有技术洞察又具有人类驱动的洞察。常见的障碍可以通过自动化测试可靠地跟踪，但只有真实用户能够根据生活经验来揭示一个产品或服务真正有多无障碍。为了更深入地理解他们的无障碍进展，将两者结合对组织来说是最有利的。\n\
  \n## 将无障碍嵌入报告中\n\n此外，许多领导团队在保持对无障碍的关注方面遇到困难并不罕见。这种错误通常导致无障碍修复被不断推后优先级，特别是当团队被要求专注于交付新功能或赶上截止日期时。\n\
  \n我多年来学到的关键教训之一是，无障碍绝不应该被视为并行工作或作为一项独立的倡议，而应该直接构建在组织衡量成功的方式中。当无障碍报告被织入现有的业务审查中，当无障碍考虑直接植入现有的流程中时，每个人就变得越难以忽视它们了。无障碍要求保持可见，并且它们得到了应得的关注。\n\
  \n这可以通过将无障碍数据集成到执行仪表板中来实现，与安全、性能和用户满意度等其他重要业务指标并列。这样做可以确保无障碍问题成功地从专门会议中的模糊讨论转变为领导层审查中的常规话题。\n\
  \n采取这种方法的另一个益处是设定了明确的无障碍性能目标。某些团队可能会通过目标是在六个月内减少特定百分比的无障碍错误来跟踪进展，而另一些团队则更倾向于提高残障人士满意度评分。无论指标如何，具有特定、可衡量目标的团队更有可能在日常工作中优先考虑无障碍性。\n\
  \n## 构建透明度和问责制\n\n但并不止于此。为了让无障碍工作长期成功，进展必须经常可见并受到庆祝。当组织保持无障碍结果透明时，团队会更加认真对待，领导层会保持参与，进展也更容易维持。\n\
  \n这样做的一种不错方法是引入每月无障碍排行榜，每个团队可以根据其无障碍改进进行排名。不过，这并不是为了竞争，尽管在很多情况下竞争是一个强有力的动力。这关乎可见性。做出无障碍改进的团队会在内部获得认可，而落后的团队可以看到他们需要在哪里以及如何改进。在领导层的正确引导下，这种友好的问责制可以鼓励团队更快修复问题并对无障碍承担责任。\n\
  \n一些组织选择通过公开共享他们的无障碍承诺来构建透明度。我非常喜欢这种方法，因为我认为它强化了承诺和问责。虽然有些组织被迫在年度报告中发布无障碍进展更新，但有些组织可能会自发地这样做，而另一些可能更喜欢在其网站上发布声明，概述他们改进了什么以及仍在努力什么。\n\
  \n当然，构建透明度的方法不止一种，但所有开放的方法最终都有助于建立信任。不仅是对客户，对公司内部员工也是如此。当员工看到组织也在对自己负责时，他们对无障碍性会变得认真得多。\n\
  \n## 随时间持续进展\n\n虽然大多数组织的目标是数字包容和法律合规，但衡量无障碍不应仅仅是为了证明工作已经完成。衡量应该是扩大品牌范围更大承诺的一部分，因为组织意识到通过对数字属性的持续长期改进来更好地服务目标受众，是一个明智的商业决策。\n\
  \n\n\n\n现在，一个合理的问题是：如果无障碍是法律强制要求的，且通常是围绕 `WCAG` 等标准制定的，那么为什么要做得比标准更好？如果技术上只需要达到最低法律门槛，为什么组织还应该追求更高的目标呢？毕竟，在其他领域，从未有人要求公司要做得超出法律规定……\n\
  \n区别在于，无障碍不仅仅关乎规则和条例，它关乎**人**。无障碍合规可以让你免受法律纠纷，但仅靠合规无法帮助你赢得残障群体的信任或忠诚，也绝无法让你充分挖掘他们的社区潜力。\n\
  \n有一点是可以肯定的：那些理解无障碍如何带来所追求的价值（例如更好的客户体验、更广泛的覆盖范围和更强的品牌完整性）的组织，自然地开始将无障碍视为一个人文问题而非法律问题。\n\
  \n你会听到许多专家说，无障碍不仅关乎终点，更关乎过程。这意味着，成功的组织不仅仅是为自己设定一次性的无障碍目标；他们将无障碍视为一项持续的承诺，并将其纳入持续的审查流程中，以便团队能够年复一年地改进。\n\
  \n那些超越了“勾选式合规”、追踪有意义的可用性指标，并将无障碍成为业务报告中可见组成部分的团队，才是真正转变文化的人。他们优先考虑人，并因此交付了更好的客户体验。朋友们，这对公司的底线也有好处。\n\
  \n因此，除了跟踪进度或将其嵌入报告之外，维持无障碍化的首要问题是建立一种学习永无止境的文化。标准在演变，工具在变化，用户预期在增长。保持领先的组织是那些不将无障碍视为固定的终点，而是将其视为一种需要发展的技能、需要培养的心态，以及一种通过持续学习而不断加强的共同责任的组织。\n\
  \n# 将持续学习织入包容性设计\n\n这真是不言而喻的。无障碍不是一次性的修复，也不是具有特定开始和结束日期的项目；它是一个与技术、用户需求、业务目标和行业标准同步演变的持续、不断的实践。\n\
  \n事实证明一切：致力于持续无障碍学习的组织，也是构建了更强大团队并开发出更具包容性产品服务的组织。但只有当无障碍教育具有实践性、参与性并织入每位利益相关者的日常工作时，它才是有效的。\n\
  \n太多的团队将无障碍培训视为单次活动，或充满指南和合规要求的临时课程。在担任企业无障碍培训师的过去 15 多年职业生涯中，我可以向你保证，我是凭之。遗憾的是，仅仅依靠信息无法改变根深蒂固的行为。\n\
  \n最成功的组织总是那些将无障碍成为其文化的一部分并确保学习永无止境的组织！\n\n## 让无障碍培训产生意义\n\n在我看来，组织所犯的最大错误之一是以与真实、切实际工作脱节的方式进行无障碍培训。充斥着法规、技术规则和最佳实践演讲的长篇演示往往无法深入人心，在产生参与感和留存方面收效甚微。无障碍只有在锚定于参与者可以共鸣的具体概念，并针对生命周期中的特定角色进行定制，让团队有许多机会立即应用所学知识时，才能发挥最大的影响力。\n\
  \n尽管举办了年度培训，但仍面临无障碍问题的公司案例比比皆是。员工（尤其是那些资深员工）会理解无障碍的重要性，但当截止日期紧迫时，无障碍就会被忽视。\n\n为了解决这个问题，组织最好将强制性的年度培训替换为每月一次的无障碍挑战。与其进行枯燥乏味的讲座式课程，团队可以处理项目中的真实无障碍障碍或问题，例如审查糟糕的色彩对比度、改进键盘导航或修复屏幕阅读器问题。\n\
  \n使用这种实操方法可以显著促进改进，并减少新版本中的无障碍漏洞。它还引导利益相关者主动思考无障碍，而不是等到在审计期间才发现问题。这种从被动培训到实践学习的转变，将使无障碍成为他们工作流的自然部分，而不是偶尔的合规任务。\n\
  \n## 鼓励同伴学习和知识共享\n\n虽然正式培训非常有价值，但一些最好的学习机会发生在日常对话和共同经验中，而不是在教室（虚拟或其他线下）被动地倾听理论讲座。当无障碍知识均匀地分布在团队成员中，并且生命周期中的每个角色都有明确定义的职责分配给其时，每个人在在提问、分享解决方案和应用所学知识时都会感到更有信心。而这一切都通向了成功。\n\
  \n这种策略的一个例子可以是启动内部无障碍导师计划。组织内部经验无障碍倡导者可以与希望在该领域提高技能的团队成员配对。导师的影响力可以超出典型的设计和开发小组，创造更广泛的专家范围。内部无障碍支持者可以自然地演变为品牌大使，推广无障碍最佳实践，并确保关于无障碍的讨论在公司所有部门变得普遍。\n\
  \n其他小组可能会选择为无障碍对话创建内部“安全空间”，无论是通过的 Slack 频道、讨论组还是团队会议检查。当从设计师、开发人员、测试人员和其他其他利益相关者在内的所有参与者都有机会协作解决无障碍挑战时，他们建立的是对最佳实践的共同理解。他们随后可以从彼此的经验中学习，再次，这导致了更多的无障碍成功。\n\
  \n## 跟上不断发展的标准和工具\n\n无障碍总是在变化。新的技术、指南和行业趋势不断涌现。未能及时获取信息的团队面临落后的风险。最有效的组织将持续的无障碍教育作为优先事项，以确保他们的团队保持同步。\n\
  \n我最近合作的一个客户很早就意识到了这一挑战。为了保持公司内部无障碍知识的更新，我们启动了季度无障碍简报，以解读晦涩的指南，突出行业更新，展示内部成功案例并引入可用工具。通过持续的方式分享无障碍见解，他们确保团队不会失去动力，不会退回到过时的做法，并确保无障碍始终处于脑中。\n\
  \n其他组织可能会采取更有结构化的方法，例如通过激励员工获得无障碍认证，或鼓励参加无障碍会议和网络研讨会。`AccessU`、`Inclusive Design\
  \ 24`、`CSUN`、`a11yToronto` 和 `Axe-Con` 等活动提供了几乎免费的宝贵学习机会，同时让团队接触到来自顶尖专家的新兴最佳实践和创新。\n\
  \n## 将无障碍融入职业成长\n\n\n\n\n\n持续推进无障碍工作的最佳方法之一，是将无障碍性与职业发展挂钩。当高层高管和领导层将无障碍性视为一种有价值的技能时，员工更有可能在工作中优先考虑它。想象一下一个决定启动“无障碍卓越奖”的组织，以表彰在无障碍项目上做出重大贡献的员工。这种做法强化了无障碍性是职业发展关键部分的理念。\n\
  \n其他组织可能会选择将无障碍性作为职位描述的一部分，确保新员工在入职时就重视这一理念。结果，无障碍性不再仅仅是一个需要勾选的清单项，而是变成了一项共同的责任。有些公司甚至可能刻意地将其纳入年度绩效考核中。当员工看到无障碍专业知识通向更多职业增长的机会时，他们投入并应用这些技能的可能性就会呈指数级增长。\n\
  \n## 创建持续学习的文化\n\n我遇到的最具包容性的组织是那些从不停止学习、始终渴望探索无障碍领域新知识的组织。他们停止了将无障碍视为一个项目或一个需要完成的清单项，而是将其使其持续且不断新的部分。随着时间的推移，我看到那些关注实操培训、鼓励同伴学习并为无障碍增长留出空间的团队，创造了更强大、更具包容性的团队。\n\
  \n那些主动让残障用户参与流程的公司，在差距出现之前就解决了它们。显然，如果没有问责制，任何努力都难以持久。能够成长的团队是那些追踪自己的进度、公开分享结果并让数据指导下一步行动的团队。他们不仅仅是遵循规则，而是提出启发性的问题，例如“这有益吗？”并密切关注人们的反馈。\n\
  \n## 总结\n\n如果你希望从这一章中获得一个核心信息，那就是：构建包容性设计文化不仅仅是为了勾选框或达到合规目标。当然，这些都很重要，但真正的价值远于此。它是关于将无障碍性带入团队工作的\
  \ DNA 中，贯穿每一个职位和每一个层面。当这种转变发生时，你的文化也会随之改变。正如我们在最后一章中所探讨的，一切始于建立同理心。真正的无障碍性来自于真正的倾听、学习以及与使用辅助技术的人建立联系。当无障碍被集成到从项目规划到设计、开发和测试的整个工作流中时，道路变得更加清晰。它不再是终点线前的仓促应付，而是团队从开始就可以关注的事情。\n\
  \n因为事实是，包容性设计不是一个终点，而是一种习惯。一种心态。一种随着你的每一次行动而变得日益强大的共同承诺。你做得越多，它就变得越自然。投入其中，很快你就会亲眼看到不同——不仅是在你的产品和服务中，更是在你的人才、流程和目标中。\n\
  \n现在，去行动吧。迈出第一步，看着你未来的用户为此感谢你。诚实地说？你的团队也会如此。因为归结底，我们都关注创造卓越、有意义的产品和服务。伟大的设计绝不仅仅关于*什么*有效，它还应该是为*谁*服务。\n\
  \n如果你问我，这正是包容性设计魔法真正发生的地方。\n\n![img](img/Packt_Logo_New1.png)\n\n[packtpub.com](https://www.packtpub.com)\n\
