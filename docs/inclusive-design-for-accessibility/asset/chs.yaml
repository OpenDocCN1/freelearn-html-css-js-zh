  本开篇章节为设计可访问且包容的数字体验奠定了基础。在四个章节中，你将介绍塑造今日数字世界包容性设计的核心原则、法律框架和实践方法。从理解可访问性的演变和用户需求的频谱，到应对全球立法和嵌入伦理责任，这些章节将可访问性重新定义为一项并非清单，而是一项以人为本的设计承诺。\n\
  \n你还将学习如何开展包容性用户研究，尊重生活经验，挑战榨性实践，并将洞察转化为可操作的设计决策。\n\n到本部分结束，你将具备开始构建不仅合规而且真正包容的数字产品所需的知识、心态和基础实践。\n\
  \n本部分包含以下章节：\n\n*   *第一章*,数字时代的包容性设计定义 \n*   *第二章*,理解多样化的用户需求：残障类型与辅助技术*\n*   *第三章*,可访问设计中的法律与伦理考量*\n\
  *   *第四章*,包容性产品的用户研究与测试\n\n# 1. 数字时代的包容性设计定义\n\n*作者：Dale Cruse*\n\n设计中可访问性的历程揭示了我们在理解人类多样性以及技术影响方面发生的深远意义的变革。我们已经超越了狭隘、指令性的方法，转而拥抱全局视角，赞颂人类能力和经验丰富且复杂的频谱。这种转变代表了设计的演进；是对技术如何连接并赋能不同能力和背景的人进行了根本性的重新想象。\n\
  \n理解包容性设计在当今的数字世界至关重要：它对于创作者来说是专业性的要求，通过扩大市场和创新带来业务优势，确保法律合规，并在技术日益成为日常生活核心时帮助建立一个更公平的社会。\n\
  \n我们的整体方法是提供包容性设计的全面基础，将可访问性从一种事后考虑转变为一种惠及所有用户的基本设计原则。\n\n在本章中，你将探索数字可访问性的演变、通用设计原则以及以用户为中心的方法。你将学习如何创建赋能所有能力用户的包容产品，将可访问性从事后考虑转变为嵌入核心原则。\n\
  \n目标是为包容性设计提供实用的基础，展示它是如何驱动创新和连接的。你将获得重新思考你的方法的工具，确保你的工作反映所有用户的多样化需求。\n\n因此，在本章中我们将涵盖以下主题：\n\
  \n*   理解数字可访问性的历史背景和演变\n*   探索通用设计的七原则\n*   实施以用户为中心的设计方法\n*   认识包容性的商业价值\n\n\n\n\
  \n过去，无障碍设计往往是设计中的事后补充，在现有产品上拼凑临时解决方案。沮丧的用户不得不与屏幕阅读器作斗争，阅读器无法解释图形、经常读错词汇、频繁崩溃，并且每个新软件版本都需要手动更新。文本转语音系统因其机械的声音和糟糕的理解能力带来了额外的挑战。基础的键盘控制在不同应用程序中无法稳定工作。许多放大工具在显著减慢电脑速度的同时，还会扭曲文本和图像。独立的屏幕阅读器尤为麻烦——这些软件笨拙，难以与主流应用程序兼容。所有这些局限性导致了糟糕的体验，强化了将残障视为某种“异类”或脱常的观念。幸运的是，这些解决方案与如今无缝集成的系统相比相差甚。\n\
  \n随着我们对残障和人类多样性的理解加深，设计方法也随之演变。1989 年万维网的诞生带来了全新的无障碍挑战与机遇。1999 年，《网页内容无障碍指南》（WCAG）的发布标志着里程碑，为标准的网页无障碍实践铺平了道路。这些指南引入了关键标准，如键盘导航、图像替代文本（alt\
  \ text）和正确的标题结构——这些功能现在是网页设计的基础。它们的影响是革命性的：全球开发者第一次有了一个创建无障碍网站的共享框架，从而极大改善了残障人士获取互联网的途径。\n\
  \n## 从为残障设计转向为人类多样性设计的转变\n\n在拥抱更广泛的包容性设计观点之前，该领域最初专注于通过针对性的解决方案解决残障问题。设计师创建了专门的功能，如为盲人提供的屏幕阅读器、为聋人提供的闭字幕，以及为肢体障碍障碍人士提供的替代输入设备。这些针对特定残障的适应是至关重要的第一步，帮助许多人访问数字内容并为无障碍标准奠定了基础。然而，这种狭隘的方法往往导致隔离的解决方案，将残障用户标记为异类，而对特定障碍的关注意味着错过了创建更具普适性功能的机会。\n\
  \n设计师们意识到，为无障碍设计的特征正在帮助每一个人。想想闭字幕——它们最初是为聋人或听力障碍者、学习新语言或在嘈杂环境中导航的人准备的工具，但哇，它们太火了！现在你会看到语言学习者痴迷于此，学习新词汇，还有在热闹的咖啡馆或健身房里静静跟随他们喜欢的节目。这就像他们发现了一个全新的观众。\n\
  \n语音控制功能讲述了类似的故事——它们最初是为肢体障碍人士设计的，现在已成为任何手忙脚乱的人、多任务处理的父母或需要免手操作的驾驶员日常便利工具。这些曾经的专业功能现在如此常见，以至于许多人甚至不认为是无障碍工具。这种洞察引发了设计思维的革命。\n\
  \n包容性设计承认，我们都处于能力的滑动的光谱上，会随着时间和情况而变化。即使是视力为 20/20 的人，在烈日下也可能眯眼看手机上的微小文字。接受这些化的化的使我们能够创造让所有人都脱颖出的产品。\n\
  \n这种新心态认为残障是流动的，而不是固定的。历史上，残障通常被定义为一种永久性的、致能力的状况——一种让一个人在根本上不同于常态的标签。但这种观点已经演变。今天，我们更广泛地将残障理解为个人能力与环境之间的不匹配，这种不匹配是由永久性、临时性或情境性的障碍所塑造的。折断的手、抱着宝宝的父母、或在颠簸公交上的通勤者——所有人都面临着限制与数字系统交互的临时性障碍。包容性设计应对了这些日常挑战，让每个人的生活更加顺畅，并反映了对人类能力更细致的理解。\n\
  \n## 残障社会模型\n\n包容性设计的的核心在于一个革命性的概念：残障社会模型。该模型诞生于残障人士的经历，它颠覆了传统思维。\n\n想象这样一个世界：残障不是个人的缺陷，而是人与环境之间的不匹配。这正是残障社会模型的精髓。它与早期的医学模型形成对比，医学模型将残障定义为个体身上的“问题”——一种需要被修复或治愈的缺陷或缺失。社会模型反转了这种思维，认为社会的障碍——物理的、态度的和沟通的——才是真正的致残因素，而不是个体差异。\n\
  \n轮椅使用者并不是因为他们的轮子而残障，而是因为没有没有道道的阶梯。聋人并不是受限于沉默，而是受限于一个不使用手语的世界。这种视角反转了剧本，将适应责任放在社会身上，而不是让个人去迎从。\n\
  \n这不仅仅是纸面上的奇特想法——这是一个警钟！它正促使我们将无障碍设计织入我们世界的基因之中，从建筑的底层开始到网站的细节。不再像在断掉的手膊上贴胶布一样，把无障碍功能当作事后补救。我们谈论的是从第一天起就将其做到真正到位。\n\
  \n在数字领域，这种思维是改变游戏规则的。当我们遇到一个不可无障碍的网站时，我们现在看到的是一个缺陷的设计，而不是一个“残障”用户。这种转变引发了创新，推动我们创造出欢迎所有人的数字空间，无论能力如何。\n\
  \n## 识别用户需求和能力的多样化光谱\n\n包容性设计的一项关键技能是理解用户需求和能力的多样化光谱，这包括：\n\n*   **残障类型**：意识到残障可以是永久性的、临时性的或情境性的，例如永久性视障或临时性手臂受伤。例如，情境性残障可能包括一位父母在抱着宝宝的同时尝试单手操作网站。\n\
  *   **无障碍光谱**：承认无障碍需求差异巨大，因此需要灵活的设计来适应不同的能力水平。例如，某些用户可能依赖屏幕阅读器，而另一些用户可能需要调整字体大小或颜色对比选项。这包括心理健康状况，它们会影响注意力、记忆或压力水平——例如，限时互动会引发焦虑或排斥感。\n\
  *   **交叉性**：考虑多个因素如何加剧无障碍挑战。例如，一位肢体活动受限的聋人用户可能会面临独特的障碍，需要定制的解决方案。\n*   **不断的需求**：理解用户需求会随时间演变，特别是当人口老龄化并面临年龄相关的障碍时。例如，老年人可能受益于更大的点击目标和简化的导航，以适应运动和视力的下降。\n\
  *   **文化多样性**：考虑到用户体验中的文化和语言差异。例如，支持从右向左的语言设计或确保图标和图像具有文化包容性，可以使产品在全球范围内更具无障碍。\n\
  \n提高这项技能使设计师能够创造更具包容性的产品，吸引更广泛的观众。这种方法增加了市场范围、推动创新、提升品牌声誉并降低法律风险。\n\n## 识别现有设计中的无障碍障碍\n\
  \n\n\n\n\n包容性设计的另一项关键技能是发现当前设计中无障碍障碍。这些障碍有多种形式：\n\n*   **视觉**：低对比度文本、依赖颜色的信息或缺少替代文本（alt\
  \ text）的图像。\n*   **听觉**：没有字幕或转录的视频、没有文本备份的音频内容。\n*   **运动**：微小的触摸目标或键盘导航死胡同。\n*\
  \   **认知**：充满术语的语言或没有意义的标题。诸如快速计时提示或复杂的导航等设计选择可能会增加认知负荷或引发焦虑，特别是对于心理健康状况的用户而言。\n\
  *   **语音**：没有文本替代的纯语音界面，或难以处理多种口音和语音模式的语音识别技术。\n\n识别这些路障就像同时兼任侦探、技术专家和同理心者于一身。你必须亲自动手操作辅助技术，跟上最新的无障碍指南，而且——最关键的一点是——让具有各种能力的真实用户进入你的设计游乐场。这不仅仅是勾选框；它涉及到深入理解不同的人如何导航数字世界。\n\
  \n虽然自动化无障碍检查工具可以发现某些问题，但许多障碍只有通过实际测试和用户反馈才能显现。例如，机器人可能会为所有图像的替代文本点赞，但它无法判断这些文本是否描绘了一幅有意义的画面。\n\
  \n设计师和开发者可以从第一天起构建包容性的数字体验，而不是在日后才追赶无障碍功能。\n\n包容性设计关乎创建跨越整个人类多样性光谱产生共鸣的体验。它是前瞻性的，涉及到每个人所拥有的多种能力、语境和偏好。这意味着要引入历史背景，接受残障社会模型，并提高识别和消除障碍的技能，以确保数字世界为所有人服务。\n\
  \n为了将这些原则付诸实践，让我们探索包容性设计影响影响力的框架之一：通用设计七原则，它们为创建真正的无障碍体验提供了具体的指南。\n\n# 探索通用设计七原则\n\
  \n1997 年，罗纳德·梅斯及其北卡罗纳州立大学的团队发布了一个改变规则的框架：`通用设计七原则`。这些原则最初是为物理空间设计的，现在我们的数字世界中找到了新的使命，重塑了我们创建包容性在线体验的方式。\n\
  \n以下是七大原则：\n\n1.  **公平使用**：这是数字世界的欢迎垫。一个允许所有人根据需要调整字体大小和色彩对比度的网站就是公平使用的生动实例。\n2.\
  \  **使用的灵活性**：无论你是点击、说话还是打字，真正灵活的设计都能适应用户。它是一个在你的指尖或语音指令下都感觉如自家一般的应用程序。\n3.  **简单且直观的使用**：一个设计良好的电子商务网站引导你顺畅地从浏览到结账？这就是简单和直观在发挥作用，让每个人的在线购物都轻而易举。\n\
  4.  **可感知信息**：提供字幕、音频描述和转录的视频播放器？这就是可感知信息的应用，确保没有人遗漏内容。\n5.  **容错性**：想象一个能轻微指出错误并显示如何修复它们的表单。这确保了手指滑滑不会变成一场令人沮丧的痛苦。\n\
  6.  **低体力消耗**：具有批量操作和键盘快捷键的内容管理系统体现了这一原则，使数字任务变得简单。\n7.  **接近和使用的尺寸与空间**：这转化为能够与所有屏幕和手指良好协作的设计。让我们创建易于点击的触摸目标，以及无论在手机还是桌面电脑上效果良好的布局。\n\
  \n拥抱这些原则超越了设计数字产品；它允许我们创建欢迎所有人的体验。正此时我们意识到，源于无障碍考虑的功能往往会成为通用的心爱，从而使我们的数字世界对所有人都变得更美好。\n\
  \n在数字世界中赋予通用设计原则生命，意味着重新构建我们整个处理数字体验的方法，确保每一次交互对于具有各种能力的人来说都是直观、公平且赋能的。通过从开始优先考虑包容性，我们创建的数字环境不仅满足多样化需求，还促进每个人的创新和连接。\n\
  \n接下来的示例说明了包容性设计原则如何在实践中应用，展示了从一开始就优先考虑无障碍和适应性如何带来对所有人都有益的、创新型且易于友好的解决方案。\n\n* \
  \  **从一开始就具有包容性**：将多样化的用户需求视为你的设计灵感，而不是事后补救。苹果的 `VoiceOver` 从早期版本就开始内置在 `iOS` 中，而不是后来添加的。微软的\
  \ `Xbox Adaptive Controller` 是通过与残障游戏玩家持续合作设计的，从一开始就塑造了其核心功能。\n*   **灵活布局**：创建在任何设备（从智能手机到桌面显示器）上看起来都很良好的适应界面。`BBC\
  \ News` 网站会跨设备自动调整布局和图像大小，同时保持可读性。`Guardian` 的响应式设计从桌面的多列布局无缝切换到移动端的单列布局，而不丢失内容或功能。\n\
  \n![img](img/B32080_01_1.png)\n\n图 1.1 《卫报》在网页端和移动端的首页\n\n*   **多感官魔力**：自助式的交互方法包括视觉、听觉和触觉。让用户自己选择口味。`Google\
  \ Maps` 提供视觉导航、语音引导和转弯时的触觉反馈。`Netflix` 提供音频描述、字幕和视觉控制，让用户混合组合他们偏好的消费内容的方式。\n*  \
  \ **保持清晰清晰可见**：拥抱语言和导航的简单化。这不是降低智水平，而是开放。`Gov.uk` 用通俗语言取代了复杂的政府术语，增加了用户的理解。`Duolingo`\
  \ 使用简单、一致的导航模式和清晰的图标，帮助用户专注于学习而不是琢磨界面。\n\n![img](img/B32080_01_2.png)\n\n图 1.2：Duolingo\
  \ 清晰的按钮和界面\n\n*   **成为辅助技术的“好玩家”**：确保你的产品能与屏幕阅读器、语音识别等良好协作。`Twitter` 的图像描述功能与屏幕阅读器配合良好，使盲人及低视力用户能够访问视觉内容，尽管他们的需求可能不同——例如，低视用户可能更多地依赖缩放工具和对比度调整。`Microsoft\
  \ Word` 提供了强大的无障碍功能，包括标记正确的表单字段和导航辅助，使文档对屏幕阅读器用户更具可用性。\n*   **测试的多样性**：从整个能力光谱的用户中收集反馈。他们的见解是设计的金子。`Airbnb`\
  \ 与色盲用户进行可用性测试，以改进他们的地图界面和房源照片。`Facebook` 的无障碍团队包括残障工程师，他们在发布前会测试新功能。\n*   **保持认知**：跟上无障碍指南的动态。`WCAG`\
  \ 不仅仅是一个缩写；它是你的设计指南针。采用这些无障碍要求导致 `WordPress` 更新了编辑器以实现更好的键盘导航。Bank of America 定期更新其移动应用程序，以满足不断变化的\
  \ `WCAG` 指南，确保持续的无障碍改进。\n\n\n\n\n\n这些原则交织在数字设计的肌理中，创造出不仅易于访问，而且能带来令人愉悦体验的产品。其核心在于意识到：源于无障碍设计的特性往往会成为通用的喜爱。\n\
  \n通用设计的七大原则并非指南，而是一份打造欢迎性数字体验的配方。在整个设计过程中拥抱这些原则，意义不仅仅是勾选需求清单；它为所有人开启了更直观、更灵活、更具人性化的数字体验之门，无论他们的能力或生活状况如何。\n\
  \n为了有效地将这些原则付诸现实，我们需要理解如何实施以用户为中心的设计方法，将真实的人置于开发过程的核心。\n\n# 执行以用户为中心的设计方法\n\n以用户为中心的设计将人置于创作的核心，深入研究所有用户的生活、需求和体验，并将他们的观点穿插在设计设计的每一根线条中。通过这种方法，我们不仅是在创造产品，更在打造与人类多样性产生共鸣的体验。无障碍不是事后补救，而是从第一天起就是戏的主角。\n\
  \n## 理解多样化的用户需求和体验\n\n理解多样化的用户要求我们跳出自己的经验，考虑人们与技术交互的多种方式。这是用户为中心设计的飞跃——意识到我们的用户像热带雨生态系统一样多样，每个人都有其独特的能力、偏好和生活背景。\n\
  \n想想：\n\n*   一位用户可能带有永久性视觉障并航于数字世界。\n*   另一位用户可能因为运动受伤而暂时单手。\n*   而另一个人可能在海滩度假期间正苦于屏幕眩光的困扰。\n\
  \n为了真正掌握这种如万花筒般的用户需求，设计师们需要：\n\n*   **成为人口统计学侦探**：深入开展跨越不同背景、年龄和技术熟练程度的用户研究。设计师可以从对来自不同年龄组和技术背景背景的用户进行结构化访谈开始，记录他们如何完成常见任务，以识别模式和痛点。\n\
  *   **精通能力字母表**：从视觉到听觉，从运动到认知——考虑人类能力和挑战的完整范围。例如，在设计移动应用时，设计师应该测试使用标准触控控制的导航，以及使用语音命令或切换控制等替代输入方法的导航，以确保通用访问。\n\
  *   **拥抱变化**：记住，用户需求不是一成不变的。它们会随着时间、情况甚至情绪而变化。设计师可以通过创建具有调节设置的灵活界面来解决这个问题，例如一个根据一天中不同时间或用户疲劳程度变化而调整界面的阅读应用。\n\
  *   **连接交叉性的连接点**：识别身份的不同方面如何交织，创造出需要解决的独特无障碍难题。设计师可能会遇到一个既是色盲症又由于运动障碍而使用键盘导航的用户，这要求在界面设计中仔细考虑颜色对比和键盘焦点指示器。\n\
  \n在识别了这些多样化的用户需求和交叉性考量后，下一步是开发有效的研究方法来深入理解它们。让我们探索一些具体的技术，以帮助捕捉用户体验的全谱系，并将其转化为可操作的设计洞察。\n\
  \n## 包容性用户研究和测试的技巧\n\n为了真正为所有人设计，我们需要深入挖掘用户体验。这里是一些揭示这些隐藏洞察的强大技巧：\n\n*   **撒下更广阔的网**：在招募参与者时，考虑各种形式的多样性。一个真正有效的研究小组应该反映社会的多样性，将不同能力、年龄、文化和技术熟练程度的人聚集在一起，每个人都贡献他们独特的视角。\n\
  *   **设身处地**：真正的情境调查像是在用户的生活中充当“墙上的苍蝇”。设计师通过在用户的自然环境中观察他们，注意他们在现实语境下如何与技术交互，并提出深思的问题来揭示洞察。\n\
  *   **共情训练营**：同情图、用户画像（Persona）和其他工具允许你的团队站在用户的角度走一段路：\n    *   **同情图**（empathy\
  \ map）是一种视觉工具，通过将观察结果分为四个象限来帮助团队理解用户：他们说的、想的、感受的和做的。它捕捉用户的行为、情感和动机，以建立更深层次的共情并指导设计决策。\n\
  \    *   **用户画像**（persona）是一个基于研究的虚构目标用户代表，旨在体现他们的目标、行为、需求和挑战，帮助团队将设计决策与受众的真实体验和优先级保持一致。\n\
  *   **无障碍侦探工作**：对你的数字产品进行定期审计就像体检。同时使用高科技工具和手动测试来嗅嗅隐藏在设计中的任何障碍。\n*   **技术试驾**：邀请依赖辅助技术的的用户对你的产品进行全面测试。这就像聘请了专家顾问，他们可以发现你可能永远从未考虑过的问题。\n\
  *   **共创**：在有效的设计工作坊中，多样化的用户不仅仅是反馈提供者——他们是创作过程中的共同飞行员。这些会议可以激发任何一个设计师独立无法梦到的点子。\n\
  \n在通过用户共创收集了洞察后，下一个关键步骤是通过系统性的迭代来完善这些想法。这种持续的原型制作、测试和完善过程确保了我们的协作洞察演变为真正有效的解决方案。\n\
  \n## 迭代设计流程\n\n设计是一个活的实体，随着每次迭代而增长和适应。这就是以用户为中心的方法中迭代设计的精髓。它是在循环过程中的一种创作、测试和完善行为，每一次迭代都使我们更接近包容的承诺。\n\
  \n这一设计过程通常分为四个关键步骤：\n\n*   **原型游乐场**：我们从创建粗略的原型开始，就像草拟食谱一样。这些早期版本的设计是为了测试和完善，邀请多样化的用户提供意见，就像让的一群厨师品尝仍在开发中的菜肴。\n\
  *   **反馈盛宴**：随着设计的演变，我们通过用户测试和分析收集洞察。这种持续的反馈循环就像根据人们对味道、质地呈现的体验来完善食谱。每一次交互——点击、滑动和参与——帮助我们调整和改进。\n\
  *   **无障碍检查**：我们定期根据无障碍标准评估设计，确保它对所有人都有效。这像是在为了适应不同的饮食需求而微调食谱，确保菜肴所有人都能享受。\n*  \
  \ **拥抱转折**：有时，用户反馈会揭示重大变更的需求。正如厨师可能会完全重新思考某道菜一样，我们对重大修订保持开放，在需要时转型以满足我们多样化受众的需求。\n\
  \n这是一个持续改进的旅程，每一个循环都让我们更接近一个无障碍的数字世界。\n\n## 示例：微软 Xbox 自适应控制器\n\nXbox 自适应控制器颠覆了我们通常对设计的设计的预期——它是一个适应用户而非让用户适应控制器的游戏控制器。它不仅仅是一个控制器，更是行动受限人士进入游戏世界的大门，由微软的\
  \ Bryce Johnson、残障游戏玩家和非营利组织共同工程。\n\n\n\n\n\n想象巨大的、可编程的按钮，它们连接着由外部开关、按钮、支架和摇杆组成的宇宙。这就像是一个为游戏定制的命令中心，根据每位用户的独特需求量身打造。\n\
  \n![img](img/B32080_01_3.jpg)\n\n图 1.3：Xbox 自适应控制器周围有许多辅助技术支持，以实现游戏体验（由 Geni 创建，根据\
  \ CC-BY-SA 4.0 协议许可：[`creativecommons.org/licenses/by-sa/4.0/`](https://creativecommons.org/licenses/by-sa/4.0/)\
  \ ）\n\n但真正让这款控制器与众不同的不仅仅是它酷炫的功能，更是它的创作路历程：\n\n1. 微软深入研究了残障人士的世界，通过深入发现了他们的需求和面临的挑战。\n\
  2. 职业治疗师和无障碍专家成为了他们的副驾驶，在设计过程的每一步都提供指导。\n3. 他们制作了一个又一个原型，并让目标受众对每个版本进行试用。\n4. 反馈成为了他们的北极星，引导他们进行重大的设计调整，以提升可用性和无障碍性。\n\
  5. 他们回过大局，确保从包装到设置的一切都像控制器本身一样易于使用。\n\n结果呢？这是一个改变游戏规则的产品，它不仅在服务其目标受众，更在平整竞争环境，证明了只要有适当的设计和支持者的见解，任何人都可以玩。\n\
  \n虽然包容性设计的伦理论据非常有说服力，但许多机构也需要理解其对业务的影响，才能全力投入实施。让我们探索包容性设计如何通过扩大市场、增加创新、增强品牌声誉和降低法律风险来推动业务成功。\n\
  \n# 认可包容性的商业价值\n\n包容性设计是正确的事——但你知道它也是一种明明的商业举措吗？它通过创建适用于每个人的数字产品，直接提升了业务表现。根据 Forrester\
  \ 和微软 2016 年的一份报告，无障碍设计可以提高客户满意度，增强品牌感知并扩大市场覆盖范围。此外，投资无障碍性的公司更有可能促进创新和员工生产力。\n\n\
  当我们考虑到多样化用户进行设计时，我们扩大了市场覆盖范围，增加了用户满意度，并构建了更具创新性的解决方案：\n\n* **受众更大，利润更丰厚**：当你为所有人设计时，你就为更多客户铺设了红地毯。通过解决被忽视社区的需求，你发掘了新市场并释放了巨大的收入潜力。\n\
  * **创新点火石**：包容性设计挑战你的团队跳出框架思考，往往能带来全新的解决方案。这种创造性的问题解决方法可以点燃惠及整个产品线的突破，并让你从竞争对手中脱颖而出。\n\
  * **品牌助力**：向世界展示你的关怀，见证你的声誉一飞猛升。这就像是一场真正有意义的公关活动。消费者日益被与他们价值观一致的品牌所吸引，而包容性可以成为一种强大的差异化优势。\n\
  * **法律安全网**：走在无障碍法规的前面，让那些律师远不可及。主动拥抱无障碍性不仅能降低法律风险，还能将你的公司定位为负责任的行业领导者。\n* **通用吸引力**：关键在于：为无障碍而设计的特性往往会让所有用户感到愉悦。从字幕到语音命令，这些创新增强了每个人的可用性，创造了更直观、愉的体验。\n\
  \n为包容性提供强有力的商业理由，使设计从“可选”提升为“必选”。展示无障碍设计如何开启新市场并改进产品可以吸引决策者的注意力。以下是几个例子：\n\n* 为视障用户提供服务的有声书。有声书已成为蓬勃发展的行业，证明了无障碍功能在赋能用户的同时也能驱动收入。它们也造福多任务处理者、通勤者以及有学习差异的人群，展示了包容性设计如何扩展产品的触达范围和实用性。\n\
  * 在嘈杂环境中帮助每个人的闭字幕。字幕最初为聋人和听力障碍人士社区设计，现在广泛应用于健身房、机场和社交媒体，提升了所有人的用户体验。这个例子说明了无障碍功能通常会创造通用利益，增加参与度和客户满意度。\n\
  \n包容性设计将伦理与精明的商业相结合。解决多样化需求创造了更好的产品，并培养了品牌忠诚度。\n\n## 扩大市场覆盖范围\n\n包容性设计开启了一个隐藏在显眼处的强大市场。这就是包容性设计所做的——它就像发现了一条通往全新客户世界的秘密通道。让我们来算一些能让你大脑发光的数字：\n\
  \n* **十亿级受众**：世界卫生组织发布了一颗炸弹——全球范围内超过 10 亿人有某种形式的残疾。这是我们全球家庭的 15%！\n* **可支配收入金矿**：根据美国研究所\
  \ 2018 年的一份报告 ([`www.air.org/sites/default/files/2022-03/Hidden-Market-Spending-Power-of-People-with-Disabilities-April-2018.pdf`](https://www.air.org/sites/default/files/2022-03/Hidden-Market-Spending-Power-of-People-with-Disabilities-April-2018.pdf))，仅在美国，残障人士就拥有一个价值\
  \ 4900 亿美元的可支配收入宝库。这不是小钱——这是一个等待被服务的市场。\n* **科技市场异常火热**：根据 Market Research Future\
  \ ([`www.marketresearchfuture.com/reports/assistive-technology-market-29777`](https://www.marketresearchfuture.com/reports/assistive-technology-market-29777))，全球辅助技术市场预计到\
  \ 2034 年将爆炸至惊人的 880 亿美元。谈谈增长机会！你正在考虑的那些无障碍功能？它们不仅仅是为了小众群体设计的。它们是让你的产品对更广泛的人群产生不可抗拒力的秘诀。坡道服务的不仅仅是轮椅——它对婴儿车、行李箱和推车都变得无价了。\n\
  \n拥抱包容性设计意味着在做出明智商业选择的同时行善事。你正在开启此前不知道存在的市场大门，并创造可能成为可用性新标准的产品。\n\n## 增强品牌声誉\n\n\
  \n\n\n在当今的市场中，社会责任已成为日益增长的期望，包容性的承诺能够让品牌脱颖而出。这种方法可以增强忠诚度并产生积极的口碑营销。优先考虑包容性设计的公司（如\
  \ `Nike`）通常会获得更多的正面媒体报道和消费者好感。通过与公平和可访问性价值观价值观，品牌不仅加强了自己的声誉，还将自己定位为行业领导者，赢得更广泛观众的信任和钦仰。\n\
  \n## 法律合规与风险缓解\n\n数字可访问不仅是一项最佳实践，它在许多地区是法律要求。例如`美国`的《美国残疾人法案》和《欧洲无障碍法案》等法律规定公司确保其数字产品对所有用户都是可用的。从一开始就嵌入包容性设计可以使企业避免昂贵的诉讼和后期补救改造带来的烦恼。这种主动的方法还使他们能够轻松适应未来的无障碍法规。拥抱包容性不仅是明智之举，更是合规和风险管理的积极策略。\n\
  \n![img](img/B32080_01_4.jpg)\n\n图 1.4. 庆祝《美国残疾人法案》的旧金山街头艺术。由 `Dan Fontes` 创作。摄影\
  \ `Dale Cruse`。\n\n# 总结\n\n本章探讨了包容性设计的基本原则，追踪了其从基础的可访问功能到惠及所有用户的全面方法的演变。你学习了`通用设计七原则`及其如何应用于数字产品，发现了实施以用户为中心的设计方法的技术，并理解了如何为包容性建立有说力的业务理由。正如本章所示，`包容性设计不仅仅是为了让技术变得可用——而是为了让技术对每个人都更好`。\n\
  \n这些知识在当今的数字版图中至关重要，数字可访问性日益决定了对社会的参与。理解包容性设计原则有助于为所有人创建更好的产品，同时扩大市场范围并降低法律风险。此外，随着组织意识到包容性设计驱动创新并增强所有人的体验，这些技能对于设计师、开发人员和产品经理正变得至关重要。\n\
  \n本章为更详细的探索奠定了基础。随着我们的进行，我们将深入研究不同用户群的独特需求，包括密切关注特定的疾病、心理健康考量以及支持包容性访问的辅助技术。\n\n\
  # 理解多样化的用户需求：残疾类型与辅助技术\n\n*作者 Angela Young 博士，CPACC*\n\n如果你今天打开一个网站却无法阅读文本、听取音频或点击链接，你将如何找到所需的信息？对于像我这样的数百万人来说，这不是假设，而是日常的现实。可访问性弥补了这一鸿沟。它将障碍转化为机会，确保数字空间对所有人开放和欢迎。\n\
  \n可访问性不仅仅是标准和清单；可访问性关乎人。它关乎理解不同的需求如何塑造我们与世界互动的方式。也许你曾曾在嘈杂的咖啡馆里依靠字幕看视频，或者在忘记带眼镜时调整了手机上的字体大小。这些简单日常的工具反映了让包容性设计如此强大的相同原则。合规确保了底线，但真正的可访问性意味着考虑到真实用户来着设计。\n\
  \n在本章中，我们将分解人们体验数字世界的各种化方式、辅助技术的作用，以及深思的设计如何消除障碍。你将学习不同类型的残疾如何影响数字交互，包容性设计如何惠及每个人，以及微小的改变如何产生重大影响。无论你是设计师、开发人员还是决策者，理解这些概念将帮助你创建不仅具有功能性而且真正具有包容性的数字体验。可访问性不是事后才考虑的。它是构建适用于所有人技术的根本组成部分。\n\
  \n在本章中，我们将涵盖以下主题：\n\n*   理解残疾：经验的谱系\n*   数字背景下残疾类型的分类\n*   审视辅助技术的作用\n*   将用户需求映射到设计解决方案\n\
  *   中心化生活经验：与用户一起设计，而非为他们设计\n\n# 理解残疾：经验的谱系\n\n与人类体验中的许多其他身份一样，残疾存在于谱系之中：\n\n* \
  \  **情境性残疾**与环境有关，例如在刺眼的阳光下尝试阅读手机，或在单手抱孩子时操作平板电脑\n*   **临时性残疾**由短期状况引起，例如受伤或手术后的恢复期\n\
  *   **慢性疾病**（如`关节炎`或`偏头痛`）会有波动，产生好的日子和糟糕的日子\n*   **永久性残疾**（如`盲`或`瘫痪`）是持续的，但在塑造人们互动方式方面同样各异\n\
  \n除了定义之外，意识到这些经历如何是流动的且往往是不可见的也很重要。一个人在一生中可能会在不同类别之间移动……甚至在同一天内！疼痛发作、疲劳、行动能力变化或感官过载都可能改变一个人在时刻导航数字世界的方式。\n\
  \n例如，一个由于慢性疾病导致视力波动的学生，在糟糕的日子可能需要高对比度设置和放大字体来完成作业，但在好的日子则没有问题。如果没有这些选项，他们如何保持学习投入呢？\n\
  \n或者，考虑一个由于睡眠不足和环境噪音暂时丧失听力清晰的新手。在那个时刻，视频通话中的实时字幕可能是一项基本功能。这些微小的调整会向外扩散并惠及广泛的观众。\n\
  \n当我们理解每个人在生活的某个时刻都会面临障碍时，可访问性就变成了通用的——轮椅道帮助了快递员和推婴儿车的父母，而闭幕支持了从嘈杂环境到语言学习者的各种需求。\n\
  \n这是包容性设计背后的理念：可访问性不是例外，而是预期。通过将灵活性和选择嵌入我们的数字环境中，我们赋予了所有用户力量——不仅仅是医学定义上的残疾人士。\n\n\
  重要的是，残疾不仅是医学的；它也是社会性的。它源于人的身体或心理与他们所处的环境或系统之间的不匹配。一个人可能不是因为其状况本身而残疾，而是因为一个不支持键盘导航的网站，或一个完全依赖声音而没有替代文本的应用程序。这种观点转移了责任：从要求个人适应不可访问的系统变为要求系统满足真实人的需求。\n\
  \n随着我们的进行，将残疾归入更广泛的类别有助于理解它们如何影响数字交互。毕竟，与其将其构架为解决少数人的需求，不如当我们为所有人设计时，我们就开启了数字机会。下一节将探讨这些类别——视觉、听觉、运动和认知——并介绍支持每种类型的设计策略。\n\
  \n# 数字背景下残疾类型的分类\n\n\n\n\n在设计数字产品时，理解人们与产品交互的不同方式至关重要。残障并不是孤立的状况——它们是人类体验的一部分，影响着个体感知、处理和参与技术的方式。因此，需要注意的是，“残障”是一个可以与其他任何身份产生交叉的身份群体。你既可以是穆斯林又是残障人士，可以是酷少数群体又是残障人士，可以是\
  \ Z 世代又是残障人士等等。此类列不穷。\n\n在残障的伞下，四大残障类别——视觉、听觉、运动和认知涵盖了广泛的状况，并带来了独特的挑战。应对这些挑战需要周全的设计，充分考虑人类能力的全光谱。\n\
  \n### 视觉残障：在没有视力的情况下导航\n\n对于盲人或视力障碍的用户来说，导航数字界面涉及到将视觉信息转换为其他形式，例如音频或触觉反馈。但这可能会出现问题。例如，屏幕阅读器用户依赖于结构良好的代码来导航网页。如果网站缺乏语义化标题或图像的描述性\
  \ `alt` 文本，感觉就像在嘉年华里通过镜子迷宫中穿行。\n\n想象一个没有正确标记字段的职位申请门户。一个依赖屏幕阅读器的用户（可能是盲人）可能会反复听到“编辑框”而没有任何上下文，导致他们无法完成表单。相比之下，一个无障碍表单的每个字段都有清晰的标签，例如“姓名”、“电子邮件地址”或“上传简历”。那么，这种差异超越了功能性，体现了赋能。\n\
  \n倾向于使用缩放等替代方法而非屏幕阅读器的视力障碍用户可能会面临不同但同样巨大的障碍。例如，文本在缩放时超出屏幕会导致文本不可读，而固定的字体大小可能会导致内容在较小的屏幕上无法访问。响应式设计和可缩放文本选项是直接的解决方案，能够显著提高可用性。\n\
  \n### 听觉残障：增强访问性\n\n听觉残障涵盖了广泛的体验——聋、听力障碍和听觉处理障碍。例如，作为一名聋人，我可以告诉你，当视频缺少字幕或播客没有转录稿时，我们不仅是不不便——更是被完全排斥在外。\n\
  \n无障碍努力还必须考虑到那些听力障碍人士，他们可能依赖音量控制、放大工具或助听器。这些用户需要避免音频失真并支持用户控制声音设置的内容。其他人可能在准确处理声音方面遇到困难，即使听力测试显示他们处于“正常”范围内。\n\
  \n为听觉无障碍进行设计扩展了许多有记录残障人士之外许多人的可用性。考虑一个正试图用第二语言跟上快速讲座的国际学生，或者在拥挤咖啡馆里看视频教程的人。字幕、转录稿和声音的视觉替代方案让所有这些用户受益，同时也为我们聋人（d/Deaf）社区成员提供了关键访问点。\n\
  \n听觉包容延伸到媒体内容之外。使用视觉警报的系统——例如用闪烁灯光或屏幕通知代替闹钟——有助于确保每个人无论听力如何都能接收到相同的信息。\n\n重要的是，有人经历着聋症但认同为聋人（Deaf）社区的一部分。在书书中，该状况用小写，而身份群体本身用大写。\n\
  \n### 运动残障：重新思考交互\n\n运动残障涵盖了广泛的状况，从震颤、关节炎到瘫痪和截肢。这些状况影响了用户物理上与设备交互的方式，无论是通过鼠标、键盘还是触摸屏。\n\
  \n考虑一个灵活性有限、使用头戴指针或开关控制导航的用户。每次点击或移动都需要费力，因此过于复杂的工作流或微小、难以点击的按钮会产生不必要的障碍。以简单和高效为考虑进行设计（例如提供大的触控目标并尽量减少完成任务所需的交互次数）可以使技术更具访问性。\n\
  \n语音控制是运动残障用户的另一个变革性工具。然而，支持语音的界面必须考虑到语音模式的变异性。例如，有言语障碍的人甚至是有非母语口音的人，可能难以被某些系统理解。提供多种输入选项确保没有人被遗漏。\n\
  \n### 认知残障：简化复杂性\n\n认知残障——如 `ADHD`、阅读障碍和智力障碍——影响了用户感知、处理和对信息做出反应的方式。混乱且导航不一致的网页很容易让患\
  \ `ADHD` 的人无所适从，而长段的密集的文本可能会让阅读障碍用户完全放弃参与。\n\n简化复杂性会产生影响。将内容拆分为更小、更易于消化的块，使用一致的设计模式并结合视觉辅助，可以帮助用户保持专注并更有效地处理信息。例如，一个使用通俗语言和直观图标来解释保障范围的医疗保险网站，比一个埋在行业术语中的网站要友好得多。\n\
  \n交互内容也可以支持认知无障碍。一个使用颜色编码图表显示开支习惯的预算应用程序，为可能在处理数值数据方面遇到困难的用户提供了视觉清晰度。\n\n考虑精神和心理健康障碍也同样重要，它们通常被错误地与认知障碍归为类，但在影响数字交互的方式上有所不同。焦虑、`PTSD`、抑郁和类似状况可能会让某些设计选择——如定时表单、弹出窗口或意想不到的动作——变得深感痛苦或完全无法使用。例如，患有焦虑症的用户如果看到表单中包含倒计时器，可能会完全放弃表单，即使他们知道任务很简单。\n\
  \n`WCAG 2.2` 的最新更新开始更显式地解决这些问题。成功标准如 `3.3.7 冗余输入`（避免让用户重复输入信息）和 `3.2.6 一致帮助`（确保指导随处可用）是考虑到心理健康需求而开发的。这些变化反映了一种日益增长的意识，即无障碍不仅关乎理解——还关乎情感安全和减轻认知负荷。\n\
  \n为这些需求进行设计通常会为所有人带来更好的体验。高对比模式帮助人们在户外使用设备。字幕在嘈杂环境中很有用。语音控制支持正在做饭或多任务处理的用户。这些不是边缘情况的修复。它们是通用的增强。\n\
  \n真正的无障碍不仅仅是识别障碍——它意味着主动消除障碍。辅助技术，从屏幕阅读器、放大镜到眼动追踪和开关控制，让数百万人的数字交互成为可能。理解它们如何工作并在设计时考虑到它们，是构建真正包容的、以人为本的体验的关键。\n\
  \n\n\n\n辅助技术——旨在帮助残障人士访问、交互和导航数字及物理环境的工具、设备或软件——并非“额外品”或“可有可无的”，而是必不可少的。这些技术不仅提供了访问支持，而且当我们在整个设计过程中考虑到它们时，它们塑造了我们所做的设计决策。当我们为了让数字环境具备与辅助技术的流畅使用能力而进行设计时，我们确保了数字空间对所有人都是可用的。\n\
  \n了解这些技术的工作原理有助于设计师和开发者创建出不仅无障碍，而且对所有用户都无缝且直观的数字体验。\n\n### 针对视觉障碍的辅助技术\n\n对于视觉障碍人士，访问数字内容需要替代的方法来感知和交互信息。此类别的辅助技术将文本、图像和界面转换为可访问格式，以支持独立的导航和参与。\n\
  \n#### 屏幕阅读器：让数字世界可听\n\n`Screen readers` 是一种辅助技术，能够将屏幕上的文本转换为语音，允许盲人或视力障碍的用户导航网站、应用程序和数字文档。`JAWS`、`NVDA`\
  \ 和 `VoiceOver` 等工具可以解析网页结构并以语音形式向用户传达。\n\n一些用户——特别是聋盲人士——会将屏幕阅读器与`refreshable Braille\
  \ displays`（`RBDs`）结合使用，后者将屏幕阅读器的输出转换为触觉盲文（`Braille`）。虽然屏幕阅读器处理内容，但 `RBDs` 提供了一种替代输出格式，通过触觉让数字环境变得可用。\n\
  \n为了有效运行，屏幕阅读器极大受益于语义化的 `HTML` 和实施良好的 `ARIA`。清晰的标题、地标、标签和角色（roles）有助于这些工具向用户传达有意义的结构和上下文。如果没有这种结构，用户体验可能会变得混乱或不完整。\n\
  \n例如，当编码正确时，屏幕阅读器可以识别标题、链接和表单字段。然而，当一个按钮完全没有辅助名称时，屏幕阅读器可能会完全跳过它，或者笼泛地播报——例如只说“按钮”，而没有任何上下文——让用户只能猜测它的功能。\n\
  \n即使按钮标记了标签，标签本身仍然很重要。一个标记为“Button123”的按钮在技术上可能符合名称的要求，但它没有告诉用户任何信息。想象一下你正在尝试在线购物，听到的是“Button123”而不是“加入购物车”。你会点击它吗？你并不知道它是否会将商品添加到购物车——甚至是否会扣除你的信用卡。\n\
  \n无障碍设计不仅仅是为了让某物可以导航——更是为了让变得清晰。结构良好且具有有意义描述性标签的页面可以将混乱的体验转化为直观的体验。\n\n#### 屏幕放大镜和高对比度工具\n\
  \n对于视力障碍用户，`screen magnifiers` 放大屏幕内容，而高对比度工具通过增加文本与背景之间的对比度来提高可见性。\n\n对于视力障碍用户，`screen\
  \ magnifiers` 放大屏幕内容，而高对比度工具通过增加文本与背景之间的对比度来提高可见性。\n\n对于视力障碍用户，`screen magnifiers`\
  \ 放大屏幕内容，而高对比度工具通过增加文本与背景之间的对比度来提高可见性。\n\n对于视力障碍用户，`screen magnifiers` 放大屏幕内容，而高对比度工具通过增加文本与背景之间的对比度来提高可见性。\n\
  \n对于视力障碍用户，`screen magnifiers` 放大屏幕内容，而高对比度工具通过增加文本与背景之间的对比度来提高可见性。\n\n对于视力障碍用户，`screen\
  \ magnifiers` 放大屏幕内容，而高对比度工具通过增加文本与背景之间的对比度来提高可见性。\n\n对于视力障碍用户，`screen magnifiers`\
  \ 放大屏幕内容，而高对比度工具通过增加文本与背景之间的对比度来提高可见性。\n\n对于视力障碍用户，`screen magnifiers` 放大屏幕内容，而高对比度工具通过增加文本与背景之间的对比度来提高可见性。\n\
  \n对于视力障碍用户，`screen magnifiers` 放大屏幕内容，而高对比度工具通过增加文本与背景之间的对比度来提高可见性。\n\n对于视力障碍用户，`screen\
  \ magnifiers` 放大屏幕内容，而高对比度工具通过增加文本与背景之间的对比度来提高可见性。\n\n对于视力障碍用户，`screen magnifiers`\
  \ 放大屏幕内容，而高对比度工具通过增加文本与背景之间的对比度来提高可见性。\n\n#### 盲文显示器：触觉访问\n\n`Braille displays`\
  \ 将数字内容转换为触觉盲文（`Braille`），为盲人或聋人提供可访问性。`Braille displays` 将数字内容转换为触觉盲文（`Braille`），为盲人或聋人提供可访问性。\n\
  \n#### 针对低视的音频描述\n\n对于多媒体，`audio descriptions` 叙述视觉元素，为视力障碍用户提供上下文。`audio descriptions`\
  \ 叙述视觉元素，为视力障碍用户提供上下文。\n\n\n\n\n* 美国美国听力损失协会 (HLAA) – 助听听力系统概述：[`www.hearingloss.org/find-help/hearing-assistive-technology/assistive-listening-systems/`](https://www.hearingloss.org/find-help/hearing-assistive-technology/assistive-listening-systems/%20)\n\
  * Apple 专为 iPhone 设计助听器计划：[`support.apple.com/en-us/108780`](https://support.apple.com/en-us/108780%20)\n\
  * 全国聋人协会 – 技术建议：[`www.nad.org/resources/technology/`](https://www.nad.org/resources/technology/)\n\
  \n### 针对运动障碍的辅助技术\n对于运动障碍的人士，与数字设备交互可能需要传统键盘和鼠标之外的替代输入方法。该类别的辅助技术提供了解决方案，使用户能够轻松地导航、输入和控制数字界面。\n\
  \n#### 语音识别软件：免手交互\n对于运动受限的用户，`voice recognition` 软件提供了一种无需使用键盘或鼠标即可与设备交互的方法。诸如\
  \ `Dragon NaturallySpeaking` 等工具允许用户通过口头指令进行听写、导航菜单并执行命令。\n\n然而，此功能依赖于语音友好的接口。想象一下，用户口述“点击提交”，但遇到了一个没有标记可识别术语的按钮。通过使用清晰、可预测的标签并简化工作流，设计师可以确保这些工具能够无缝运行。\n\
  \n#### 自适应输入设备：扩展交互选项\n如 `switch controls`（开关控制）、`sip-and-puff systems`（吹气系统）和 `eye-tracking\
  \ software`（眼跟踪软件）等自适应技术重新定义了用户与数字设备交互的方式。这些工具对于无法使用传统方法的严重运动障碍人士至关重要。\n\n例如，使用单个开关的人可以通过循环选项并点击选择一个来导航界面。如果界面过于复杂，或完成一项任务需要过多步骤，用户的体验就会变得沮丧。这在移动设备上可能尤为困难，精细运动障碍者将难以选择小按钮。大的触摸目标、精简导航和清晰的工作流确保了自适应设备可以被有效使用。\n\
  \n#### 键盘导航和替代键盘\n许多运动障碍用户依赖 `keyboard navigation` 而不是鼠标。设计允许用户仅使用键盘即可完全导航的界面（例如确保逻辑合理的\
  \ Tab 顺序和可见的焦点指示器），可以确保无障碍性。某些个人可能还会使用替代键盘，例如单手键盘或屏幕键盘，来与数字内容交互。\n\n### 针对认知障碍的辅助技术\n\
  认知障碍影响个人处理、理解和与数字内容交互。该类别的辅助技术侧重于增强理解能力、减轻认知负载并提高多样化用户的可用性。\n\n#### 文本转语音工具：支持理解\n\
  `Text-to-speech (TTS)` 工具将书面文本转换为语音，使有认知障碍、学习障碍（如阅读障碍）或识字率低的用户从中获益。这些工具帮助用户更有效地处理和保留信息。\n\
  \n例如，患有阅读障碍的学生可能在面对密集的学术文本时很困难，但当使用 `TTS` 工具朗读内容时，他们可以更容易地跟上。然而，如果网站内容结构不佳或格式不一致，`TTS`\
  \ 工具可能难以清晰地传达信息。\n\n#### 语音转文本工具：减轻认知负载\n`Speech-to-text (STT)` 工具将语音转录为文本，为可能在书面语言或输入方面困难的用户提供了替代通信方法。这些工具对于书写障碍或听觉处理障碍等人士至关重要。\n\
  \n确保数字平台支持 `STT` 功能并提供清晰的错误修正选项，可以增强依赖这些工具用户的无障碍体验。\n\n#### 简化界面和可读性增强\n某些用户会经历认知或信息处理困难，包括\
  \ `ADHD`（多动症）、智力障碍或阅读障碍等学习差异者。其他人，例如自闭症用户，可能会从可预测的设计模式和减少感官过载中受益，尽管自闭症本身并不是认知障碍，但它可以与认知障碍共存。\n\
  \n设计最小化认知负载的界面可以显著提高可用性。有助于功能包括：\n* 一致的导航以减少困惑\n* 简单的语言和清晰的指令以支持理解\n* 内容分块将文本拆分为易管理的部分\n\
  * 图标和视觉辅助工具以强化含义\n\n例如，一个在线报税工具如果向用户展示长篇、密集且充满金融术语的页面，可能会让人迅速不知所措——特别是对于那些有 `ADHD`、阅读障碍或处理障碍的人来说。通过将过程拆分为带有进度指示器的逐步屏幕、通俗的语言解释和视觉提示（如图标或工具提示），该工具将变得更容易导航并让用户有心地完成。\n\
  \n这种包容性界面设计并不依赖辅助技术，但它具有相同的核心目标：让内容更容易被访问、理解和使用。在进入下一节之前，我们将关注主动协助用户导航数字环境的工具，以及如何从一开始在设计时就考虑到这些技术。\n\
  \n了解辅助技术的范围仅仅是第一步。确保它们在数字环境中无缝运行才是包容性设计真正成型的地方。这些工具的有效性完全取决于它们所交互的系统，这正是为什么从一开始就考虑无障碍性进行设计是至关重要的原因。在下一节中，我们将探索如何将辅助技术集成到设计过程中，确保数字体验不仅在技术上无障碍，而且对所有人都是真正实用的。\n\
  \n## 将辅助技术集成到设计中\n辅助技术的有效性取决于其所运行的环境。如果屏幕阅读器在编码时考虑了无障碍性，它就能更好地导航网站；而语音识别软件在设计为能够适应口头指令的界面上工作效果最好。\n\
  \n当然，我们无法自己规划每一种障碍，因为我们自己并没有在所有想象的领域都存在障碍。我们并不知道自己不知道的——直到各种障碍的人士以不同的方式与我们的数字环境交互。\n\
  \n这就是为什么与依赖辅助技术的真实用户进行测试是无价之宝。自动无障碍测试可以识别一些代码错误，但它们无法模拟用户的真实体验。例如，视力障碍用户可能会揭示显而易见的的导航问题，例如消失过快以至于屏幕阅读器无法检测到的下拉菜单。\n\
  \n为辅助技术进行设计还需要灵活性。考虑一个视频会议应用程序。为聋人用户提供字幕、为运动障碍者提供键盘快捷键，以及与屏幕阅读器的兼容性，可以确保该平台适用于广泛受众。这种灵活性造福了所有人，使应用程序或网站在不同场景下都更易使用。\n\
  \n\n\n\n当我们从辅助技术角度进行设计时，我们不仅是在解决问题，更是在创新。这些工具促使我们超越平均用户进行思考，创造直观且公平的体验。通过将设计实践与辅助技术的需求对齐，我们确保了数字空间对所有人都是可用的。\n\
  \n例如，设计具有清晰标签、可缩放文本和逻辑工作流的电子商务网站，可以提高屏幕阅读器用户的可用性，但这些特征同样惠了在小屏幕上购物或时间紧迫的人们。无障碍原则增强了整体用户体验，使产品对每个人来说都变得更好。\n\
  \n辅助技术为获取数字内容提供了必要的途径，但其有效性取决于它们与真实用户需求的契合程度。仅仅实现这些工具是不够的。设计师和开发者必须考虑不同的残障如何影响交互，并确保无障碍功能以实用且有意义的方式发挥作用。通过将用户需求映射到特定的设计解决方案，我们可以超越通用的修复方法，创建对所有用户都直观、无缝且赋能的数字体验。\n\
  \n# 将用户需求映射到设计解决方案\n\n无无障碍设计始于理解用户的多样化需求。最有效的解决方案并非一一切切——它们能够适应不同的场景、残障和辅助技术。满足这些需求从提问正确的问题开始：我们在为谁设计？他们可能会遇到什么障碍？我们如何从从初就减少或消除这些障碍？\n\
  \n一种强大的方法是内置定制化。让用户调整字体大小、切换到深色模式、关闭动态效果或选择他们偏好的输入方法，将控制权交给最了解自己需求的人。灵活的、为用户定制的体验通常是最具无障碍性的，也是最具包容性的。\n\
  \n这一过程始于提出关键问题：\n\n*   行动不便的用户将如何在电子商务网站上完成购买？\n*   聋哑学生参与虚拟讲座需要哪些工具？\n*   盲人用户如何独立导航交通类应用以查看实时到达时间？\n\
  *   患有 ADHD（注意力缺陷系障碍）的用户在填写复杂的在线表单时可能会遇到什么障碍？\n*   阅读障碍患者如何能够高效地阅读和理解新闻网站上的内容？\n\
  *   患有震抖的用户在需要与小型触摸屏按钮交互时，可能会遇到哪些无障碍挑战？\n*   色觉异常用户如何在财务仪表板上区分成功消息和错误消息？\n*   哪些修改可以使虚拟现实体验对具有各种残障的用户无障碍？\n\
  \n每个问题都揭示了独特的挑战和创新机会。\n\n为了有效地进行无障碍设计，系统性地评估用户需求至关重要。这意味着识别用户可能拥有的残障类型，理解他们可能遇到的障碍，并确保数字内容与用户自行选择的辅助技术兼容。\n\
  \n将用户需求映射到设计解决方案涉及识别这些障碍并以消除它们的方式进行设计——无论是通过语义结构、键盘导航、清晰的视觉设计或其他包容性策略。实现这需要对用户旅程以及各种辅助技术如何与数字环境交互有深入理解。\n\
  \n## 理解用户旅程\n\n用户行程展示了人们在现实场景中如何与技术交互。通过分析这些行程，我们发现了摩擦点和改进领域。考虑以下示例：\n\n*   **场景**：一个有阅读障碍的学生正在使用在线学习平台完成研究论文。\n\
  *   **挑战**：平台使用了装饰性衬线字体、间距紧凑的对齐文本，且没有调整视觉呈现的方法。这些选择让学生更难解码和保留信息，增加了疲劳和挫败感。\n*  \
  \ **解决方案**：使用无衬线、对阅读障碍友好的字体，增加充足的行间距并提供定制选项（如更改文本/背景颜色对比度），可以显著减轻视觉压力。虽然这不能治愈，但可选的文本转语音集成在解码变得太困难时也可以支持理解。\n\
  \n通过应用这些原则并与神经多样性用户进行测试，你可以收集到宝贵的见解，这些见解突出了特定的障碍并指导针对性的无障碍改进。通过理解用户的背景，设计师可以优先考虑影响最大的更改。\n\
  \n## 需求映射的现实应用\n\n理解用户需求只是第一步——将这些见解应用于真实世界的产品才是无障碍产生实际影响的地方。从教育到电子商务再到金融服务，不同的行业都面临独特的挑战和机会。通过检查这些空间中的常见无障碍障碍，我们可以确定适用于所有用户的实用解决方案，而不仅仅是残障用户。以下示例强调了映射用户需求如何带来更具无障碍性的数字体验。\n\
  \n### 学习平台：消除数字教育障碍\n\n学习平台服务于多样化的用户，包括认知残障、视觉障碍和听力损失者。然而，如果不考虑无障碍，这些平台可能会为学习带来巨大障碍。例如，考虑以下障碍和实用解决方案：\n\
  \n*   *想象这一场景*：一名盲人大学生、一名聋哑学生和一名患有 ADHD 的学生参加一门高度依赖视频内容和长篇作业的课程。\n*   *现在，他们可能会面临哪些挑战？*\n\
  \n*   视频缺少字幕或文本，排除了聋哑和听力障碍的学生\n*   长长文本会让 ADHD 或阅读障碍的学生感到难以理解\n*   盲人学生遇到导航障碍和无法与屏幕阅读器工作的测试\n\
  *   *解决方案是什么？*\n\n*   为所有视频内容提供字幕和文本\n*   允许调整播放速度以支持听觉处理需求\n*   使用清晰的标题和简洁的段落结构内容以增强认知无障碍\n\
  *   确保屏幕阅读器兼容，包括标记所有交互元素\n*   为测试和讨论表单开启全键盘导航\n\n这些更改改进了残障学生的体验，同时也惠了多任务处理者、非母语使用者以及在嘈杂或干扰环境中的用户。\n\
  \n教育开启了知识的大门，而零售领域的无障碍设计确保了在购物、连接和参与日常生活时这些大门依然开启。\n\n### 电子商务网站：确保包容性在线购物\n\n电子商务网站必须适应各种能力，但许多网站未能考虑到无障碍，导致某些用户在线购物时感到沮丧或无法进行。\n\
  \n*   *想象这一场景*：一位视力客户、另一位手部活动受限的用户以及第三位使用屏幕阅读器的用户尝试在零售网站上购买。\n*   *挑战是什么？*\n\n*\
  \   表单字段有视觉标签，但在程序上没有标记，导致屏幕阅读器用户感到困惑\n*   仅通过字体颜色变化信号的错误消息，色觉异常用户无法立即理解\n*   小的触摸目标和下拉菜单对于运动功能障碍的用户来说难以操作\n\
  *   缺失或缺乏描述性替代文本的产品图片让屏幕阅读器用户缺乏上下文\n\n\n\n\n\n# 解决方案有哪些？\n\n- 确保表单字段通过程序化（而非仅仅是视觉上）进行标记\n\
  - 使用图标或文字补充颜色编码的消息\n- 增大点击区域，并为键盘和切换控制用户简化交互操作\n- 为产品图像添加有意义的替代文本（alt text）\n\n\
  这些解决方案扩展了所有购物者的可用性，同时减少了购物车放弃率并增加了销售完成率。但无障碍性不仅关乎便利或转化率——它还关乎公平，特别是当涉及到财务独立和个人安全时。\n\
  \n随着越来越多的基本服务转向线上，数字无障碍已成为一个民权问题，而非偏好问题。管理银行账户、申请残障福利、签署医疗表格或审查法律文件等任务必须同时具备无障碍性和安全性。对于残障人士，尤其是那些使用辅助技术的人，如果系统在设计时没有考虑到他们的需求，隐私和自主权就会面临风险。\n\
  \n例如，一个通过屏幕阅读器填写医疗入诊表的盲人用户应该能够独立完成，而不需要第三方大声读出他们的健康信息。同样，听障用户必须能够以不依赖音频的格式接收重要的财务或法律信息。\n\
  \n在这些背景下，无障碍设计必须超越可读性——它必须优先考虑准确性、机密性和用户控制。包容性系统不仅是良好的商业实践；它们对于在利益重大的数字空间中保护残障用户的尊严、隐私和权利至关重要。\n\
  \n## 银行和金融工具：提高金融领域的数字无障碍性\n\n银行应用程序和网站处理需要精度和隐私的敏感任务。对于残障用户来说，不可用的设计不仅会带来挫败感，还会导致自主权的丧——特别是在独立管理财务时。\n\
  \n想象这样一个场景：一个盲人用户尝试输入 PIN 码，但该字段不兼容屏幕阅读器的输入。他们被迫向他人寻求帮助，损害了自己的隐私。一位认知障碍用户由于实现不当，无法依靠自动补全或使用密码管理器，增加了错误或安全问题的概率。第三位行动能力受限的用户由于应用程序仅支持鼠标输入，而难以完成交易。\n\
  \n### 挑战有哪些？\n\n- 视觉验证码（CAPTCHAs）、限时代码和排除了盲人、听障者或神经多样性用户的音频提示\n- 不可用的 PIN 输入字段，阻止了安全、独立的身份验证\n\
  - 不支持自动补全或密码管理器\n- 密集的金融术语和杂乱的数据表格\n- 200% 缩放时的布局失真，干扰了可读性和导航\n- 缺乏无障碍替代方案的验证码系统\n\
  \n### 解决方案有哪些？\n\n- 实现无障碍的登录选项，例如生物识别和不依赖视觉或声音的多因素身份认证\n- 确保 PIN 字段和安全表兼容屏幕阅读器和无障碍输入方法\n\
  - 支持自动补全、保存的凭据和密码管理器集成\n- 使用通俗语言、逻辑分组以及无障碍数据表格（带有表头、简洁标签和对屏幕阅读器友好的标记）重新格式化财务数据\n\
  - 测试与屏幕放大器和浏览器缩放（尤其是 200%）的兼容性，以便及发现响应式设计问题\n- 提供非视觉化的验证码替代方案，例如基于逻辑或多选的\n\n这些增强超越了技术合规性。它们保护隐私、支持独立并建立信任——这些在金融领域都是至关重要的。银行领域的无障碍性不仅关乎包容——它还关乎尊严、安全以及获得财务赋权的平等机会。\n\
  \n## 迭代：成功的关键\n\n映射用户需求不是一次性的活动，而是一个持续的过程。随着用户需求的演变，满足这些需求的解决方案也必须随之进化。考虑一家公司，他们发布了应用的无障碍版本，但通过反馈发现其实时聊天功能与屏幕阅读器不兼容。这种反馈循环对于完善设计和保持包容性至关重要。\n\
  \n迭代涉及设计师、开发者和用户之间的协作。与多样化的参与者进行定期的可用性测试，可以确保解决方案保持相关性和有效。例如，与依赖键盘导航的用户测试新的搜索过滤器，可能会揭示隐藏的障碍，从而在这些功能广泛发布之前对其进行改进。\n\
  \n## 识别并弥合鸿沟\n\n没有任何一个产品在第一次尝试时是完美的。用户需求与当前技术或设计能力之间往往存在鸿沟。承认这些差距是弥合它们的第一步。\n\n\
  例如，考虑一个设计用于举办网络研讨会的虚拟活动平台。如果该平台提供自动字幕，但未能提供手动编辑选项，字幕（或称“垃圾字幕”！）可能充满不准确之处。这里的鸿沟是缺乏一种确保字幕准确性的功能，这可能会排除听障参与者或有听力处理障碍的人。\n\
  \n弥合鸿沟涉及优先考虑与用户反馈一致的增强措施。这种迭代思维改进了无障碍性，驱动了创新并提升了整体用户体验。\n\n有效的无障碍解决方案需要的不仅仅是一次的修复；它们需要持续的评估、迭代和用户反馈。通过映射用户需求、实施辅助技术并随着时间的推移完善数字体验，我们创建了不仅功能完全而且真正包容的系统。然而，在理论上理解无障碍与亲身经历障碍是不同的。下一节将探讨如何以用户的生活体验为中心来加深共情、凸显不可见的障碍，并引导更有效的、以用户为中心的设计。\n\
  \n# 以生活体验为中心：共同设计，而非为他们设计\n\n共情通常被认为是包容性设计的基础，但如果没有指导，单凭共情可能会变成死胡同。你无法通过假装残障来完全理解残障的含义。相反，包容性设计要求团队投入共同工作——将残障人士引入流程，深度倾听，并根据他们分享的内容采取行动。\n\
  \n做得良好的无障碍设计不是想象障碍——而是与受其影响最大的人合作，消除真实的障碍。\n\n## 从观察到协作：通过生活体验建立洞察\n\n生活体验不是轶事——它是专业知识。在整个产品生命周期中与残障人士直接合作，将带来任何模拟都无法提供的洞察。\n\
  \n与其猜测用户可能遇到什么困难，不如邀请他们加入其中：\n\n- 招募残障用户作为可用性测试池的一部分，确保涵盖各种残障、辅助技术和交叉性视角\n- 为残障顾问、顾问和测试人员根据其时间和专业知识提供公平的报酬。无障碍性绝不应依赖于无偿的情感劳动或教育劳动。\n\
  - 与残障团队成员或倡导者一起审查画像和用户路径，确保你的假设反映了现实而非刻板印象\n\n无论你是在构建新产品还是改造现有产品，最有效的反馈将来自那些每天使用这些技术的人，而不是试图模拟陌生体验的内部团队。\n\
  \n新手提示：从与 3-5 名使用不同辅助技术的参与者（例如，屏幕阅读器用户、切换设备用户和依赖语音控制的人）进行有主持的可用性测试会议开始。\n\n\n\n\n\
  \n专家级操作：建立常设的残障顾问委员会，或从一开始就将残障人士嵌入到产品和 UX 团队。\n\n## 从测试转向伙伴关系：将反馈整合到工作流中\n\n如果反馈没有整合到决策中，它没有价值。一次性的用户测试只是开始，但可持续的可访问性来自于在每个迭代（sprint）、发布和评审中建立反馈循环。\n\
  \n以下是在你的流程中构建可访问性协作的方法：\n\n- 在 `QA` 和 `internal` 评审期间，使用真实的辅助技术（而非模拟）。使用屏幕阅读器（`JAWS`、`NVDA`、`VoiceOver`）、屏幕放大器、切换控制和语音导航工具进行测试。\n\
  - 创建漏洞报告或障碍跟踪机制，其中包含严重程度评级和可访问性影响，以便修复问题能与视觉或功能缺陷一样被优先处理。\n- 将设计师、开发者和 `QA` 引入用户回顾会议，而不仅仅是产品所有者。共享见解会导致共同的责任感。\n\
  - 记录所学到的知识并在团队间分享。避免知识孤岛，导致可访问性仅取决于某一个倡导者。\n\n初级提示：在你的 `Definition of Done`（完成定义）中添加屏幕阅读器测试。\n\
  \n专家级操作：在产品团队中分配可访问性联络员，他们直接与残障人士联系以关闭反馈循环。\n\n## 从意识到行动：创造责任文化\n\n真正的包容不仅限于测试——它存在于你的组织价值观、工作流和招聘实践中。创建一个让可访问性成为预期而非特例的文化，需要持续的投入：\n\
  \n- 用由残障人士主导的培训取代共心工作坊或模拟活动，重点关注现实世界的影响和解决方案。\n- 在 sprint 演示、全体会议或回顾会议中庆祝可访问性的胜利，并突出亲身经历的声音。可见性非常重要。\n\
  - 确保领导层将可访问性视为一个跨部门的优先要事项，而不是仅由合规团队拥有的事后考虑。\n- 使用指标衡量进展，例如来自残障用户的可用性评分，而不仅仅是 `WCAG`\
  \ 的通过率。\n\n初级提示：启动一个内部可访问性教育系列，重点介绍残障声音和实用工具。\n\n专家级操作：将可访问性指标与 `OKRs` 或 `KPIs`\
  \ 钩，将包容性与业务目标对齐。\n\n你不需要模拟残障来理解包容的需求。你需要倾听、聘用、参与和投入。残障人士不需要被想象——他们需要被倾听、被信任、被包含。他们的见解不是边缘案例——而是构建适用于所有人的系统的核心。当可访问性受到真实经验的指导时，结果就是更好的产品、更好的产出以及一个更公平的数字世界。\n\
  \n# 总结\n\n在本章中，你探索了不同类型的残障——视觉、听力、运动、认知和心理健康——如何塑造用户与数字体验的互动方式。你学习了这些差异如何影响访问需求，以及各种辅助技术（如屏幕阅读器、可重写式盲文显示器、切换控制和放大器）如何支持数百万用户的访问。我们还查看了清晰的内容结构、有意义的标签、键盘导航和灵活界面在支持跨残障类型可用性方面的重要性。\n\
  \n理解这些用户需求对于创建超越技术合规的可访问性产品至关重要。你看到了不可访问的设计选择如何限制对银行和医疗保健等关键服务的访问，以及包容性实践（如简单语言、可访问的身份验证和对自定义的支持）如何恢复自主权和信任。本章还强调了与真实用户和辅助技术测试的重要性，以及以亲身经历为中心而非依赖模拟。\n\
  \n在下一章中，我们将从理解用户需求转向将法律和伦理考虑应用于产品设计。你将学习如何使你的工作符合可访问性法律和标准，如何将包容性实践整合到设计系统和开发工作流中，并在团队和组织中扩展可访问性。\n\
  \n# 3\n\n# 无设计中的法律与伦理考虑\n\n*作者 Maya Sellon*\n\n当你在 `Netflix` 上开启字幕观看你喜欢的节目时，你正在从可访问性法律落实的结果受益。这些法律保护不仅确保合规；它们还驱动了为所有人创造更包容的体验。但可访问性不仅关乎合规——它还关乎伦理。仅仅满足法律最低标准的产品对许多人来说可能仍然不可用，而伦理驱动的方法可以确保一种像魔法一样无缝的体验。包容性设计应该被植入过程，而不是在表面点缀。\n\
  \n某些监管框架，如《美国残疾人法案》（`ADA`）和《联合国残疾人公约》（`CRPD`），已经为可访问性制定了法律要求，并为确保数字空间的包容奠定了基础。然而，仅仅有法律只是起点。真正的包容需要超越合规。伦理设计将焦点从满足最低标准转变为创造包容性体验。它承认，障碍是由设计选择造成的，而不是由残障人士造成的。\n\
  \n到本章结束，你将对主要的可访问性法律和国际保护有清晰的认识，这些法律将可访问性确立为一项基本人权问题，而不是转瞬即逝的趋势或设计偏好。有了这个基础，你能够自信地反对对可访问性措施的，无论是关于用户人口统计的质疑还是成本驱动的业务考量。你还将更好地理解法律要求和伦理考虑是如何交汇的，让你能够将包容性设计作为核心原则而非事后考虑来维护。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 导航全球可访问性立法\n- 平衡法律合规与伦理责任\n- 预测数字可访问性的未来法律趋势\n- 培养伦理驱动的设计文化\n\
  \n# 导航全球可访问性立法\n\n针对残障权的法律保护不仅仅是监管要求。它们将可访问性定义为基本人权，并塑造了社会处理包容的方式。虽然不同国家的可访问性法律不同，但它们是确保平等访问、防止歧视和要求组织负责任的关键工具。然而，法律保护远非普及。只有\
  \ 24% 的国家宪法专门禁止歧视或确认基于残障的平等权利，且于 10% 的国家宪法明确保障残障人士的民权（UCLA WORLD Policy Analysis\
  \ Center, 2024）。宪法保护是挑战不平等和消除歧视性法律的关键起点。在乌干达，法律改革导致了对残障人士的强制性工作场所便利（Shakespeare\
  \ et al., 2019），而在秘鲁和哥伦比亚，宪法保障确保了残障人士的投票权（Open Society Foundations, 2019）。虽然这些成功展示了可能性的，但仍然存在巨大的障碍——我们在本章稍些时候将探讨这一点。\n\
  \n\n\n\n\n除了设定法律义务，这些法律还影响着更广泛的社会态度。联合国《残疾人权利公约》（UN CRPD）倡导的残疾社会模式，将残疾重新定义为外部障碍问题，而非个人缺陷。这种转变产生了深远的影响，鼓励了从起始阶段就优先考虑可访问性的政策和设计实践，而不是将其视为事后补救。\n\
  \n以下是法律保护在全球范围内至关重要的原因：\n\n*   **人权与平等**：残疾权利是人权。超过 90% 的联合国成员国批准了《公约》，因为他们意识到残疾歧视是一个需要解决的全球性问题。\n\
  *   **打击系统性歧视**：法律保护防止排斥，并帮助打破就业、教育和公共服务中的障碍，确保残疾人士不会面临限制其机会和独立性的系统性障碍。\n*   **促进全球对齐**：国际法鼓励各国在可访问性努力上保持一致，为发展中国家提供了可以构建的基础，并支持跨国合作（联合国经济和社会事务部\
  \ [DESA]，n.d.-b）。\n*   **问责制与执行**：像《公约》这样的法律协议要求政府跟踪残疾权利的进展，有助于推动加强执法力度，并防止可访问性工作被忽视。\n\
  *   **经济影响**：这对业务是有的。减少残疾人士与非残疾人士之间的就业差距，通过让更多人对经济做出生产性贡献来增强经济融合，从而提升 GDP 并促进经济融合（Halder\
  \ & Argyropoulous, 2019）。\n\n法律保护塑造了可访问权，但其力量在于维护这些的体系。多年来，里程碑式的法律影响了全球的政策和标准，为可访问的数字环境提供了路线图。\n\
  \n## 建立数字可访问性的法律基础\n\n将可访问性作为人权的法律承认是通过一系列关键的全球运动和里程碑式立法演变而来的。这些节点塑造了影响今天数字可访问性的框架。\n\
  \n“国际残疾人年”标志着残疾定义方式的转折点，强调残疾是个人与其环境障碍之间相互作用的结果。这一转变导致了《残疾人行动计划》，它确立了全球包容议程，随后制定了《残疾人机会均等标准规则》（联合国大会\
  \ [UNGA], 1994）。这些框架在影响全球政策和行动的发展方面发挥了关键作用，并被联合国《公约》正式承认是推进残疾人机会平等的重要基础（UNGA, 2006）。\n\
  \n在美国，1973 年的《康复法》特别是第 504 条，成为一项具有里程碑意义的美国法律，禁止在联邦资助的项目中进行基于残疾的歧视。此后通过第 508 条（1998\
  \ 年）得到了扩展，要求联邦机构确保其电子和信息技术具有可访问性，与早期的 `WCAG` 原则保持一致（美国国会，2016）。\n\n美国《美国残疾人法案》（ADA）为残疾问题引入了民权权利方法，促进了包容性、可访问性和平等地位。这些原则影响了国际框架的发展，特别是联合国《公约》，该公约采用了类似的基于权利的模式来推进全球残疾权利（Blanck,\
  \ 2023; Kanter, 2003; Szymanski, 2009）。\n\n这些发展以及日益增长的国际倡导，导致了 2006 年联合国《公约》的制定——这是\
  \ 21 世纪第一部综合人权条约，也是将包括数字在内的可访问性承认为基本人权的关键一步（UN DESA, n.d.-a）。第 9 条要求各国确保获得物理环境、交通、信息和通信（包括数字服务）的，强调了消除生活中所有领域障碍的重要性（UNGA,\
  \ 2006）。\n\n这些法律基础解释了为什么可访问性不仅仅是良好的设计——它是一项法律权利。了解这些义务的来源，使你能够基于全球法律标准，自信地倡导包容且合规的数字产品。\n\
  \n## 数字可访问性与全球法律框架\n\n数字可访问性已成为维护残疾人士权利和消除系统性歧视的关键焦点。《网页内容可访问性指南》（`WCAG`）是一项国际认可的数字可访问性标准，`WCAG`\
  \ 2.0 也正式化为 `ISO/IEC 40500:2012`。`ISO/IEC 40500:2012` 预计将被 `ISO/IEC DIS 40500` 取替，与\
  \ `WCAG` 2.2 保持一致（国际标准组织，2012）。\n\n`WCAG` 定义了三个合规级别——A、AA 和 AAA，表示可访问水平的不断提高。每个级别都建立在前一的基础上，这意味着\
  \ AA 包含所有 A 级要求，而 AAA 包含所有 A 和 AA 级，以及额外的成功标准。AA 级是立法和政策中最常采纳的标准（Rogers, 2025）。虽然\
  \ AAA 代表最高标准，但即使是该层级的内容也可能无法完全解决不同类型、程度或组合的可访问性需求，特别是在认知、语言和学习领域（万维网联盟联盟 [W3C],\
  \ 2024b）。\n\n这些指南概述了可衡量的成功标准，用于评估网站、应用程序和数字内容是否可供残疾人士使用。尽管 `WCAG` 本身不具有法律约束力，但当它被纳入国家或地区法律时，通常会成为立法的基础。\n\
  \n例如，将于 2025 年生效的《欧洲可访问性法案》（`EAA`）是确保欧盟成员国范围内可访问性的一大步。每个欧盟国家都有责任实施 `EAA` 的要求，确定不合规的处罚，并指定执法机构，尽管某些国家已经实施了更强大的可访问性法律。`EAA`\
  \ 为指定的数字产品和服务引入了共同要求，通过其在 `EN 301 549` 中的引用（该标准是数字可访问性的欧洲技术标准）强化了 `WCAG` 的基准地位。该标准确立了欧盟范围内的基本可访问性要求，与\
  \ `WCAG` 原则和联合国《公约》更广泛的目标保持一致（欧洲议会和欧盟理事会，2019；欧洲电信标准协会，2021）。\n\n2024 年 4 月，美国司法部加强了对数字可访问性的性的关注，将《美国残疾人法案》下公共实体的\
  \ `WCAG` 2.1 AA 级正式确定为法律标准（美国司法部，2024）。虽然美国的法律格局由联邦、州和地方法律共同塑造，且法院裁决往往导致碎片化的阐释，但这一决定进一步巩固了\
  \ `WCAG` 作为网页可访问性基石标准的地位。\n\n\n\n\n\n`WCAG` 的影响已超出美国和欧洲，塑造了全球范围数字无障碍法律。新西兰、摩尔多和津巴布韦等国家已将\
  \ `WCAG` 纳入其国家设计标准（Jordanoski & Meyerhoff Nielsen, 2023）。巴西的《残疾人融入法》（`Law 13.146`,\
  \ 2015）规定公共和私营部门网站必须符合无障碍标准（Bianchi, 2021）。这些法律反映了国际社会对于确保数字空间包容性和可访问性的日益增长投入，并凸显了\
  \ `WCAG` 在塑造全球无障碍标准方面的关键作用。\n\n数字无障碍领域最早的全球法律胜利之一出现在 2000 年，当时布鲁斯·马格维尔（Bruce Maguire）根据澳大利亚《残疾歧视法》，成功起诉悉尼奥运会组委会（SOCOG），理由其未能为其网站提供无障碍支持，导致他作为一名盲人用户无法在线购票。这一裁决标志着里程碑式的时刻，确立了数字无障碍可能构成非法歧视（Russell,\
  \ 2003）。\n\n虽然国际法律和无障碍标准设定了预期，但其有效性往往取决于执法。法律行动在确保合规性方面起着关键作用，在组织忽视无障碍时要求其承担责任。一个具有里程碑意义的案件\
  \ `美国全国聋人协会等诉 Netflix` 最终达成了一项历史性的和解，要求 `Netflix` 在两年内对其点播流内容提供 100% 的闭式字幕（Disability\
  \ Rights Education & Defense Fund, 2012）。`Netflix` 诉讼是数字无障碍的一个关键时刻，它设定了影响整个流媒体行业无障碍政策的法律先例，要求内容提供者从一开始就优先考虑包容性设计。这就是为什么今天，你可以开启字幕并欣赏\
  \ `Netflix` 上几乎任何节目——这是一场通过法律行动实现的无障碍胜利。\n\n## 仍然面临的挑战\n\n`Netflix` 诉讼强调了无障碍的重要性，但同时也揭示了一个更深层次的问题：法律只有在得到执行时才是有效的。像这样的法律胜利有助于推动整个行业的变革，但执法情况在不同地区和行业之间仍然不一致。然而，尽管法律取得了进展，但执行、实施和意识方面的差距意味着障碍依然存在。以下是继续阻碍无障碍进展的某些最紧迫的挑战：\n\
  \n- **缺乏意识和教育**：许多组织尚未意识到自己在法律无障碍要求方面的义务，导致执行不力以及广泛的违合规行为。\n- **执法机制有限**：即使在存在无障碍法律的地方，执法也不一致，导致不合规问题。\n\
  - **资源限制**：小型企业和资金不足的组织在缺乏财务或技术支持的情况下，可能难以达到无障碍标准。\n- **技术的快速变化**：法律和标准难以跟上不断演变的数字技术，导致合规要求上出现空白。\n\
  \n然而，仅凭一个国家或组织的财富并不能决定无障碍的成功——专注的策略、教育、执法以及旨在消除歧视和文化态度的针对性意识活动至关重要。即使采纳了法律框架和标准，如果没有适当的支持，挑战将持续存在（Jordanoski\
  \ & Meyerhoff Nielsen, 2023）。\n\n这些挑战并不局限于组织。它们反映了更广泛的全球格局。虽然《残疾人权利公约》（`CRPD`）设定了一个强有基准，但并非所有国家都做出了同等承诺，许多已承诺的国家仍在努力中履行其义务。根据联合国《残疾人与发展报告》（2024），包括数字空间在内的无障碍努力需要加速高达\
  \ 65 倍，才能在 2030 年实现全球包容性目标。\n\n这凸显了一个重要的现实：法律框架为无障碍奠定了基础，但仅靠合规并不能保证包容性体验。即使在法律健全的地区，组织也必须超越仅仅满足法律要求，拥抱他们的伦理责任，创造有意义且持久的改变。\n\
  \n## 平衡法律合规与伦理责任\n\n对于许多企业而言，法律合规是启动无障碍倡议的主要动力。诸如 `ADA`、`EAA` 和 `UN CRPD` 等法律提供了清晰的法律基础。诉讼风险、财务罚款和声誉损害的风险为优先考虑无障碍提供了强有力的论据。然而，“合规优先”的心态可能会导致将无障碍变成一种“打选框”式的任务，在这种情况下，满足最低要求反而掩盖了设计适用于所有人的包容性体验这一更广泛的伦理责任。\n\
  \n那么，你如何确保无障碍不会变成另一个待勾选的框呢？\n\n这始于心态——一种将无障碍视为长期旅程的一部分，而非快速修复的心态。如果你正致力于改善无障碍，你正在帮助领导一场文化变革，这种变革将真正的包容性置于速度或表面解决方案之上。工具可以提供帮助，但只有在对工具能做什么和不能做什么有清晰理解的指导下才能起作用。\n\
  \n## 自动化解决方案的作用与局限性\n\n自动化测试使用软件工具根据无障碍标准快速扫描数字内容。这些工具因其速度、可扩展性和效率而特别有价值，支持高密度的审查和技术问题的识别。网页无障碍软件及服务公司\
  \ Deque（以其 `axe` 测试工具套件闻名）的一项分析了 13,000 多个网页的研究发现，自动化工具只能检测出网页上存在的 57% 以上的无障碍问题（Deque\
  \ Systems, n.d.）。这使得自动化测试在识别常见的、可量化的错误（如缺少替代文本或表单标签）方面具有无法估量的价值。\n\n然而，自动化测试的优势也伴随着巨大的局限性。同一项研究显示，自动化工具只能评估\
  \ `WCAG 2.1 AA 级` 下定义的 50 个成功标准中的 16 个，约占总标准的 30%（Deque Systems, n.d.）。这部分关注最频繁和最易衡量的无障碍问题，但\
  \ 70% 的成功标准需要无障碍专业人士通过手动评估或通过用户测试来确保合规性和可用性。\n\n这种区别至关重要。自动化工具可能擅长识别可量化的技术问题，但它们目前无法评估无障碍解决方案的质量或语境方面。这种差距可能会产生虚假的安全感，给人数字产品符合无障碍要求的错觉，而实际上，它并没有提供真正的包容性体验。\n\
  \n例如，自动化工具可能会确认存在替代文本，但它无法评估替代文本是否有意义，或是否传达了图片的内容。也许某个图片包含了关键信息（例如支持热线），而替代文本被设置为“叫中心支持电话”，但漏掉了具体的号码。自动化工具可能不会标记此为错误，但屏幕阅读器用户仍然无法获取该电话号码。\n\
  \n\n\n\n\n自动化测试中的这些差距揭示了过度依赖自动化方法来实现无障碍体验（accessibility）所面临的更广泛的挑战。随着无障碍格局的演变，工具市场正在从单纯的检测扩展到自动化解决方案。虽然自动化测试有助于检测某些无障碍问题，但现在有其他工具被营销为“自动化修复”。例如，**覆盖层（Overlays）**是某些第三方工具，它们声称可以在不更改底层代码的情况下解决无障碍问题。它们通常被定位为节省成本的方案，允许产品团队避免培训或重工的成本；由覆盖层处理无障碍问题，而团队则可以如常继续工作。\n\
  \n然而，这些工具并非没有风险，依赖它们可能会导致法律和声誉损害。在一个备受关注的案例中，美国联邦贸易委员会于 2025 年因误导性广告罚了一某公司 100 万美元，裁定其通过虚假陈述其覆盖层的功能而违反了联邦法律（Law\
  \ Office of Lainey Feingold, 2025）。批判性评估至关重要，对于“易于修复”的承诺应持谨慎态度。\n\n## 无障碍设计的伦理维度\n\
  \n法律合规为无障碍设定了基线，但组织还必须考虑设计的伦理影响。例如，经过深思设计的替代方案（如复杂视觉效果的文本版本）如果从一开始考虑到，可以增强无障碍性和包容性。然而，为数字产品或网站提供“无障碍版本”在技术上可能符合无障碍标准，但可能因强化“异类感”而导致用户边缘化的风险。为残障人士创建插件式（bolt-on）版本可能会历史历史隔离做法，并无法反映通用设计原则。\n\
  \n相反，伦理责任要求组织从一开始就优先考虑包容性。从一开始就进行无障碍设计不仅能确保合规，还能培养公平且尊重的用户体验。它还通过扩大市场范围和提升品牌声誉，与业务目标保持一致。\n\
  \n例如，运动设计（如为现代界面增添精致感的动画和过渡）可以增强视觉吸引力，但可能会干扰对运动敏感的用户（如患前庭功能障碍的用户）。深思的设计通过尊重用户偏好预见到这种需求。苹果和微软等公司允许用户在系统级别设置“减少运动”偏好。尊重这些偏好非常重要，绝不要覆盖它们，并确保经过深设计的创建替代体验，以在保持整体设计完整性的同时确保清晰度和可用性。\n\
  \n同样，在游戏行业，从一开始就设计的无障碍功能展示了包容性方法的力量。通过后期改造游戏以添加基本的键盘控制可能符合最低合规要求，但通常会导致糟糕的用户体验。与此相反，以无障碍为考量构建的游戏允许盲人玩家通过听觉反馈独立导航赛道。这种方法在于创造包容性体验，而不仅仅是满足要求。它展示了包容性设计如何驱动创新、释放创造力并扩展市场。\n\
  \n## 超越“勾选式”练习\n\n无障碍不仅仅是为了避免诉讼；它关乎意识到个人所面临的障碍并非他们固有的，而是由我们设计的系统、工具和环境创造的。为内容提供独立的“无障碍版本”在技术上可能符合法律标准，但它感觉像是事后补救措施。它看起来像是一个匆忙准备的选项，仿佛在说：“我们忘记你了，但这个将凑合吧。”\n\
  \n为了弥合合规与可用性之间的差距，组织必须将注意力从仅仅满足要求转向创建无障碍且包容性的产品。这种转变涉及：\n\n*   **投资于稳健的监控系统**：无障碍不是一次性的修复。持续的监控工具让无障碍保持可见并置于首位，在团队变动和数字产品演进的同时支持持续的承诺。\n\
  *   **将无障碍嵌入产品开发生命周期**：无障碍必须贯穿于设计、开发和测试。当设计师、开发者和测试人员将其视为工作的一部分时，它就不再是一项额外任务，减少了不必要的重工，并简单成为工作方式。\n\
  *   **转变领导态度**：如果没有领导层的支持，无障碍将处于资金不足、优先级低和被动应对的状态。许多组织陷入了自我实现的循环，即无障碍始终总感觉像是一项昂贵的、最后的负担。\n\
  \n将包容性设计想象成比烤蓝莓松饼。当无障碍从一开始就混合在一起时（就像在烘焙前将蓝莓拌入面团一样），它就变成了体验中不可或的一部分。味道被吸收，面团带有蓝莓的浓郁气息，结果是一个凝聚、周全且让每个人惊喜的产品。相比之下，在事后改造无障碍就像是在松饼出炉后试图将蓝莓塞进去：这既凌乱又毫无吸引力，并最终无法提供相同的体验。\n\
  \n随着无障碍审计变得日益复杂，记住工具和流程的有效性取决于其背后的意图至关重要。法律合规是必要的基础，但伦理责任确保了无障碍努力转化为所有用户有意义且公平的体验。\n\
  \n同样，随着技术的演进和数字格局的转变，无障碍法律必须跟上 AI 驱动界面和对数字公共服务依赖日益增加等创新步伐。为了更好地预测这些变化，让我们探索新兴法律趋势如何塑造无障碍的未来。\n\
  \n## 预测数字无障碍未来的法律趋势\n\n随着技术的进步和数字服务日益融入日常生活，无障碍法律必须演进以跟上节奏。一些新兴趋势正在塑造法律框架处理无障碍的方式，从对数字服务的依赖日益增加到人工智能的角色。理解这些趋势有助于个人和组织预测未来的法律要求，并主动将无障碍整合到他们的策略中。\n\
  \n## 对数字服务的依赖日益增加\n\n全球政府和组织正在快速实现服务的数字化，从医疗、银行到教育。例如，数字 ID、电子签证和在线公共服务的兴起提供了更大的便利，但如果不进行包容性设计，则面临扩大无障碍差距的风险。然而，这种进步取决于关键的前提条件，如可靠的设备、互联网连接和电力等负担公用事业。如果不解决这些基础需求，数字优先的策略可能会用新障碍取代传统障碍，特别是对于社会经济处于劣势的个人和社区。\n\
  \n法律框架开始应对这些挑战。例如，《欧洲无障碍法案》（European Accessibility Act）要求许多基本数字服务在 2025 年前实现无障碍，为各业的无障碍执法树立了新先例。然而，全球范围内合规性仍然不一致，组织必须为未来几年要求无障碍数字基础设施的更强监管（如\
  \ `EAA`）做好准备。\n\n需要注意：\n\n\n\n\n-   针对真实世界的人口设计，而不仅仅是理想状态。并非每个人都拥有最新的设备、最快的互联网连接，甚至无法稳定访问宽带。请使用人口统计数据、设备使用统计数据和平均互联网速度，以确保您的服务能够惠及真正需要它的人，而不仅仅是那些拥有尖端技术的人。\n\
