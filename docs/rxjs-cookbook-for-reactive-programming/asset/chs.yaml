  \n# 玩实时多人井字游戏\n\n井字游戏可能是世界上最知名的游戏之一。它看起来学起来很简单，但不要被它欺骗了。这是一场智力与策略的博弈。在这个食谱中，我们将井字游戏重新创建为一个实时多人在线游戏。让游戏开始吧！\n\
  \n## 如何实现…\n\n为了构建这个在线游戏，我们将使用 Angular 和 NestJS 来处理所有的 WebSocket 事件，因为这两个框架对 RxJS\
  \ 都有原生支持。我们将使用 NestJS 来处理服务器端玩家移动的逻辑，并使用 Angular 作为客户端应用，用于显示游戏的 3x3 网格、处理用户交互并向我们的\
  \ API 发送 WebSocket 事件。\n\n我们还需要遵循*构建一个现代聊天应用程序*食谱中*步骤 1* 和*步骤 2* 描述的说明，来创建一个 NestJS\
  \ WebSocket 网关并从客户端应用连接到 WebSocket。\n\n### 步骤 1 – 处理多对连接\n\n每当我们有一个新的 WebSocket\
  \ 连接时，就意味着有新玩家加入游戏。由于井字游戏只能由两个玩家进行，我们将游戏限制为两个玩家。如果有更多的连接，它们将进入观众模式：\n\n```typescript\n\
  @WebSocketGateway(8080)\nexport class GameGateway implements OnGatewayConnection,\
  \ OnModuleInit {\n  private clients$ = new BehaviorSubject<WebSocket[]>([]);\n \
  \ handleConnection(@ConnectedSocket() client: WebSocket): void {\n    if (this.clients$.getValue().length\
  \ >= 2) {\n      client.send(\n        JSON.stringify({ event: ‘join’, data: ‘Game\
  \ has already started.’ }),\n      );\n      client.close();\n      return;\n  \
  \  }\n    const clients = this.clients$.getValue();\n    const clientId = crypto.randomUUID();\n\
  \    client.id = clientId;\n    client.player = !clients.map(\n      (c) => c.player).includes(‘X’)\
  \ ? ‘X’ : ‘O’;\n    this.clients$.next([...clients, client]);\n  }\n}\n```\n\n对于观众，我们将仅通知他们游戏已经开始。否则，我们将\
  \ X 分配给第一个玩家，将 O 分给第二个玩家：\n\n```typescript\nonModuleInit(): void {\n  this.clients$\n\
  \    .pipe(\n      tap((clients) => {\n        clients.forEach((client) => {\n \
  \         client.send(\n            JSON.stringify({\n              event: ‘join’,\n\
  \              data: {\n                player: client.player,\n               \
  \ board: this.board,\n                nextPlayer: this.currentPlayer,\n        \
  \      },\n            }),\n          );\n        });\n      }),\n    )\n  .subscribe();\n\
  }\n```\n\n最后，游戏时间到！如果我们将两个浏览器窗口并排放在一起，可以看到两个玩家都已加入比赛。\n\n![图 9.6: 玩家已加入](img/B09031_10_8.png)\n\
  \n图 9.6: 玩家已加入\n\n### 步骤 2 – 操作\n\n一旦两个玩家都加入，我们就可以开始玩游戏了！当我们点击棋盘上的格子时，我们将向 API 发送事件。\n\
  \n```typescript\nmove(field: number): void {\n  this.socket.emit('move', field);\n\
  }\n```\n\n在客户端应用 `game-service.ts` 中，我们定义了 `move` 方法：\n\n```typescript\nmove(field:\
  \ number): void {\n  this.socket.emit('move', field);\n}\n```\n\n现在，我们可以在 `game-board.component`\
  \ 中订阅最新的棋盘状态并更新 UI：\n\n```typescript\ncurrentPlayerTurn = ‘X’;\nboard = Array(9).fill(null);\n\
  constructor(private wsService: WebSocketService) { }\nngOnInit() {\n  this.wsService.getBoardUpdate$().subscribe(({\
  \ data }: WsMessage) => {\n    const { move, currentPlayer, nextPlayer } = data;\n\
  \    this.board[move] = currentPlayer;\n    this.currentPlayerTurn = nextPlayer;\n\
  \  });\n}\n```\n\n当我们打开两个浏览器标签页并开始操作时，可以看到 UI 中的实时更新：\n\n![图 9.7: 操作](img/B09031_10_9.png)\n\
  \n图 9.7: 操作\n\n### 步骤 3 – 检查胜利\n\n每次移动结束后，我们将检查游戏是否结束。游戏会在两种情况下结束——如果我们有了胜者或者出现了平局：\n\
  \n```typescript\nplayerMoves$.pipe(\n  tap((clients) => this.handleCheckWinner(clients)),\n\
  \  tap((clients) => this.handleCheckDraw(clients)),\n  shareReplay({ bufferSize:\
  \ 1, refCount: true }),\n).subscribe();\n\nprivate handleCheckWinner(clients: WebSocket[]):\
  \ void {\n  const winner = this.gameService.checkWinner(this.board);\n  if (winner)\
  \ {\n    this.moves$.complete();\n    clients.forEach((client) => {\n      client.send(JSON.stringify({\
  \ event: ‘winner’, data: winner }));\n    });\n    this.resetGame();\n  }\n}\n```\n\
  \n在后端应用 `game.service.ts` 中，我们实现了这两个检查。\n\n\n\n\n\n```typescript\ncheckWinner():\
  \ string | undefined {\n  const winningScenarios = [\n    [0, 1, 2], // 行\n    [3,\
  \ 4, 5], // 中行\n    [6, 7, 8], // 下行\n    [0, 3, 6], // 左列\n    [1, 4, 7], // 中列\n\
  \    [2, 5, 8], // 右列\n    [0, 4, 8], // 对角线 \\\n    [2, 4, 6] // 对角线 /\n  ];\n\
  \  for (const scenario of winningScenarios) {\n    const [a, b, c] = scenario;\n\
  \    if (this.board[a] && this.board[a] === this.board[b]\n    && this.board[a]\
  \ === this.board[c]) {\n      this.moves$.complete();\n      return this.board[a];\n\
  \    }\n  }\n}\n```\n\n我们这种胜利者检查的方法是预先定义所有的获胜场景，并简单地检查当前棋盘状态是否匹配其中一种获胜情况。此外，我们完成了玩家的\
  \ `moves$` subject，以防止游戏结束后出现内存泄漏。\n\n![图 9.8：玩家胜利](img/B09031_10_10.png)\n\n图 9.8：玩家胜利\n\
  \n在出现平局的情况下，我们可以向所有客户端发送平局事件并显示重新游戏按钮。回到我们的 `game.service.ts` 中，我们可以简单地检查平局：\n\n\
  ```typescript\ncheckDraw(board: Array<string>): boolean {\n  return board.every(cell\
  \ => cell !== null) && !this.checkWinner(board);\n}\n```\n\n一旦打开 UI，我们就可以看到重启按钮并重新开始游戏：\n\
  \n![图 9.9：平局游戏](img/B09031_10_11.png)\n\n图 9.9：平局游戏\n\n## 另阅…\n\n*   NestJS 网关：[`docs.nestjs.com/websockets/gateways`](https://docs.nestjs.com/websockets/gateways)\n\
  *   RxJS `webSocket` 函数：[`rxjs.dev/api/webSocket/webSocket`](https://rxjs.dev/api/webSocket/webSocket)\n\
  \n# 10\n\n# 使用 RxJS 构建响应式 NestJS 微服务\n\n使用 NestJS，我们可以高效地构建可扩展、响应式、消息驱动且具有韧性的服务器端应用程序。由于\
  \ NestJS 对 RxJS 有着原生级支持，这可以将我们的响应式游戏提升到一个全新的水平。RxJS 可以帮助我们通过处理大量的并发请求，以及优雅地处理失败和恢复机制，来增强响应能力。它还能够帮助我们处理异步操作，这在事件驱动的系统中特别有用用。\n\
  \n在本章中，我们将涵盖以下食谱：\n\n*   在 NestJS 中构建具有韧性的 REST API 微服务\n*   使用 Kafka 掌握响应式事件流\n\
  *   在 NestJS 中通过 gRPC 流式传输实现实时性\n\n# 技术要求\n\n为了跟上本章的内容，你需要：\n\n*   RxJS v7\n*  \
  \ NestJS v11+\n*   Kafka v2.13-3.8.0\n*   KafkaJS v2.2.4\n*   grpc-js v1.12.2\n\
  *   Node.js v22+\n*   npm v11+ 或 pnpm v10+\n\n本章中食谱的代码可以在 GitHub 仓库中找到：[`github.com/PacktPublishing/RxJS-Cookbook-for-Reactive-Programming/tree/main/Chapter10`](https://github.com/PacktPublishing/RxJS-Cookbook-for-Reactive-Programming/tree/main/Chapter10)。\n\
  \n# 在 NestJS 中构建具有韧性的 REST API 微服务\n\n韧性的 REST API 微服务对于创建健壮可靠的系统至关重要，因为它们的设计是为了优雅地处理意外的流量高峰。它们通过隔离问题来防止级联故障，确保如果某个服务出现问题，不会导致整个应用程序崩溃。这种隔离也有助于高可用，因为即使某个服务宕机，其他服务也可以继续运行。\n\
  \n## 准备工作\n\n查看 *第 1 章 以了解更多 RxJS 中的 HTTP 通信策略。\n\n## 如何实现...\n\n在这个食谱中，我们将有两个 NestJS\
  \ 微服务，即 `recipes-api` 和 `orders-api`，它们之间进行同步通信，并将深入探讨韧性模式。我们将探索创建健壮且可靠的 REST API\
  \ 的不同技术。\n\n### 第 1 步 – 建立服务之间的通信\n\n一旦两个服务都运行，我们就可以轻松地通过 HTTP 在它们之间建立通信。从 `recipes-api`\
  \ 服务，我们将向运行在 localhost 3000 端口上的 `orders-api` 发送请求。一旦收到 `orders-api` 的响应，我们可以直接从响应中提取关于最新食谱订单的数据：\n\
  \n```typescript\ngetOrders(): Observable<string> {\n    return this.httpService.get<string>('/orders')\n\
  \    .pipe(\n      map(({ data }) => data),\n    );\n}\n```\n\n### 第 2 步 – 应用指数退避策略\n\
  \n在我们的 `recipes.service.ts` 中，我们有一个 `getOrder()` 方法：\n\n```typescript\ngetOrder():\
  \ Observable<string> {\n  return this.httpService.get<string>('http://localhost:300/orders')\n\
  \  .pipe(\n    map(({ data }) => data),\n    catchError(error => {\n      return\
  \ of(error);\n    }),\n    retry({\n      count: 3,\n      delay: (error, retryCount)\
  \ => {\n        console.log(`Attempt ${retryCount}: Error during network, retrying\
  \ in ${Math.pow(2, retryCount)} seconds...`);\n        return timer(Math.pow(2,\
  \ retryCount) * 1000);\n      },\n    }),\n  );\n}\n```\n\n如果 `orders-api` 不可用，或者发生了瞬时错误，我们将实施指数退避策略。该策略规定我们对失败的服务有一定的重试次数，但重试尝试之间的时间会增加。\n\
  \n### 第 3 步 – 实现舱壁（Bulkhead）韧性策略\n\n舱壁是一种韧性策略，通过隔离一个服务的资源并控制对这些资源的并发请求。这种方法的好处是，当发生错误时，它可以防止级联错误，使其他微服务继续按预期工作，而不影响系统的整体。\n\
  \n在第 2 步中，我们描述了在处理 HTTP 通信时如何处理单个服务。但如果我们想在整个微服务中应用相同的韧性策略呢？\n\n在这种情况下，我们可以利用 NestJS\
  \ 拦截器（interceptors）。在我们的 `bulkhead.interceptor.ts` 中，我们将实施舱壁韧性策略：\n\n```typescript\n\
  @Injectable()\nexport class BulkheadInterceptor implements NestInterceptor {\n \
  \ private MAX_CONCURRENT_REQUESTS = 3;\n  private activeRequests = 0;\n  private\
  \ requestQueue: (() => Observable<any>)[] = [];\n  intercept<T>(context: ExecutionContext,\
  \ next: CallHandler): \n  Observable<T> {\n    const request$ = next.handle().pipe(\n\
  \      catchError((err) => of(err)),\n      finalize(() => {\n        this.activeRequests--;\n\
  \        this.processQueue();\n      }),\n    );\n    if (this.activeRequests <\
  \ this.MAX_CONCURRENT_REQUESTS) {\n      this.activeRequests++;\n      return request$;\n\
  \    }\n    const queueRequest$: Observable<T> = new Observable((observer) => {});\n\
  \    return queueRequest$;\n  }\n}\n```\n\n我们可以注意到，如果有可用资源，我们将立即处理请求。否则，如果微服务的并发请求超过了允许的并发数，我们将这些请求放入队列，并在服务有更多资源时调度这些请求的处理：\n\
  \n```typescript\nconst queueRequest$: Observable<T> = new Observable((observer)\
  \ => {\n  this.requestQueue.push(() => {\n    return next.handle().pipe(\n     \
  \ catchError((err) => {\n        observer.error(err);\n        return of(err);\n\
  \      }),\n      map((result) => {\n        observer.next(result);\n        return\
  \ result;\n      }),\n    );\n  });\n  // 立即尝试处理队列\n  this.processQueue();\n});\n\
  return queueRequest$;\n```\n\n最后，当我们检查队列时，我们可以放入进入队列的第一个请求并完成请求任务：\n\n\n\n\n```typescript\n\
  private processQueue() {\n    if (\n        this.requestQueue.length > 0 &&\n  \
  \      this.activeRequests < this.MAX_CONCURRENT_REQUESTS\n    ) {\n        const\
  \ task = this.requestQueue.shift()!;\n        this.activeRequests++;\n        task().subscribe({\n\
  \            complete: () => {\n                this.activeRequests--;\n       \
  \         this.processQueue();\n            },\n        });\n    }\n}\n```\n\n另一种方法是利用\
  \ RxJS `mergeMap` 算符的力量，它内置了并发支持。在这种情况下，我们可以简单地使用这种模式，我们的拦截器看起来如下所示：\n\n```typescript\n\
  import { Observable, Subject, mergeMap } from 'rxjs';\n@Injectable()\nexport class\
  \ BulkheadInterceptor implements NestInterceptor {\n    private readonly MAX_CONCURRENT_REQUESTS\
  \ = 3;\n    private requestQueue = new Subject<Observable<any>>();\n    constructor()\
  \ {\n        this.requestQueue\n        .pipe(mergeMap((task) => task, this.MAX_CONCURRENT_REQUESTS))\n\
  \        .subscribe();\n    }\n    intercept(context: ExecutionContext, next: CallHandler):\
  \ \n    Observable<any> {\n        this.requestQueue.next(next.handle());\n    \
  \    return this.requestQueue.asObservable();\n    }\n}\n```\n\n## 另见...\n\n- NestJS\
  \ 博客上的韧性模式：https://medium.com/@a-ali-chishti/resiliencypatterns-nestjs-b39351f8dea8l](https://medium.com/%40ali-chishti/resiliencypatterns-nestjs-b39351f8dea8)\n\
  - 韧性最佳实践：https://dev.to/lucasnscr/resilience-and-bes](https://dev.to/lucasnscr/resilience-and-best-patterns-4mo)t\n\
  \n# 使用 Kafka 掌握响应式事件流\n\nApache Kafka 是一个分布式事件流平台，被成千上万的公司用于低延迟交付的高性能实时数据流水线。Apache\
  \ Kafka 最初在 LinkedIn 开发，后来成为开源。Kafka 的强大之处在于它非常易于访问，并且对系统崩溃具有韧性。\n\nKafka 的实时数据处理使其非常适合许多用例，例如：\n\
  \n* **用户活动跟踪** – Uber、Netflix 和 Spotify 等公司使用 Kafka 监控用户交互、点击和页面浏览。\n* **微服务的事件总线**\
  \ – Kafka 可以作为消息队列，帮助多个微服务进行通信并保持同步。\n* **可观测性** – Kafka 可以轻松与可观测工具集成，以跟踪系统的健康和性能，并处理分析错误数据。Cloudflare\
  \ 将 Kafka 用于分析。\n* **实时应用** – Kafka 可以实时处理支付、股票交易、地理位置或其他任何数据。它还可以轻松与 Apache Spark\
  \ 等数据分析工具集成。\n* **IoT 传感器数据** – Kafka 可用于收集和分析来自智能家居等设备传感器的数据。\n\n## 准备工作\n\n为了高效地跟随此配方，我们将涵盖一些\
  \ Kafka 的基本术语和定义。\n\n* **Topic (主题)** – 按顺序的不可变事件日志。主题通过键存储信息，因此我们可以通过键访问值。此外，还包含了时间戳和元数据。\n\
  * **Producer (生产者)** – 向 Kafka 主题发布/写入数据记录的数据源。\n* **Consumer (消费者)** – 订阅主题并处理数据。消费者可以对数据进行分组和聚合。\n\
  * **Broker (代理)** – 托管 Kafka 主题并处理数据存储和消息传递的 Kafka 服务器。\n* **Cluster (集群)** – 一组共同工作的\
  \ Broker，以提供容错和可扩展性。\n* **Partition (分区)** – 主题被分为多个分区，即可以分布在不同 Broker 上的有序记录序列。这实现了负载均衡和容错。\n\
  * **ZooKeeper** – 一个管理 Kafka 集群协调和状态的集中服务。它帮助处理诸如分区选举选举和管理 Broker 注册等事项。\n\n此外，在\
  \ Kafka 的官方文档中，有一个关于如何下载和启动 Kafka 的快速入门：https://kafka.apache.org/quickstart。现在我们准备好使用\
  \ KafkaJS 处理实时数据处理了。\n\n## 如何实现...\n\n在本次配方中，我们将创建一个响应式生产者和消费者。我们将利用 RxJS 的力量来处理数据流，构建一种在分布式系统中非常有用的韧性机制。\n\
  \n### 步骤 1 – 设置生产者\n\n在我们的 `message-broker.service` 中，我们将从创建一个 `Kafka` 实例并将我们的 `producer`\
  \ 连接到 Kafka 服务器开始：\n\n```typescript\nprivate readonly kafka: Kafka;\nprivate readonly\
  \ producer: Producer;\nconstructor() {\n    this.kafka = new Kafka({\n        brokers:\
  \ ['localhost:9092'],\n        retry: {\n            retries: 0\n        }\n   \
  \ });\n    this.producer = this.kafka.producer({\n        allowTopicCreation: true\n\
  \    });\n}\n```\n\n在 broker 数组中，我们列出了所有在后台运行的 Kafka broker。\n\n你会注意到我们禁用了 Kafka\
  \ 内置的重试机制。当需要自定义退避重试模式时，你可能想这样做。我们在这里这样做的原因是为了在实现韧性连接时用于学习。关于 KafkaJS 默认重试机制的更多信息可以在文档中找到：kafka.js.org/docs-retry。\n\
  \n我们也获取了生产者。现在，当我们调用生产者的 `connect()` 方法时，我们将连接到 Kafka broker，并产生消息。\n\n### 步骤 2\
  \ – 设置消费者\n\n在 `rxjs-message-consumer.ts` 的构造函数中，我们将执行 `Kafka` 实例化过程，与生产者生产者相同：\n\
  \n```typescript\nprivate readonly consumers: Consumer[] = [];\nconstructor() {\n\
  \    this.kafka = new Kafka({\n        brokers: ['localhost:9092'], // 替换为你的 broker\
  \ 地址\n        retry: {\n            retries: 0\n        }\n    });\n}\nasync consume(topics:\
  \ string[], config?: ConsumerConfig) {\n    const consumer = this.kafka.consumer({\
  \ groupId: 'my-group' });\n    await consumer.connect();\n    await consumer.subscribe({\
  \ topics, fromBeginning: true });\n    await consumer.run({\n        eachMessage:\
  \ async ({ topic, partition, message }) => {\n            // 消费消息\n            console.log({\n\
  \                topic,\n                partition,\n                offset: message.offset,\n\
  \                value: message.value.toString()\n            });\n        },\n\
  \    });\n    this.consumers.push(consumer);\n}\nasync onApplicationShutdown() {\n\
  \    await Promise.all(this.consumers.map(consumer => consumer.disconnect()));\n\
  }\n```\n\n现在，当我们从不同的服务调用消费者方法，我们将采取几个关键步骤：\n\n1. 根据 `groupId` 获取消费者。\n2. 连接到 Kafka\
  \ broker。\n3. 订阅作为参数传递的某些主题。\n4. 运行我们的消费者并在 `eachMessage` 回调中处理消息。\n5. 将当前消费者推入消费者列表中以跟踪所有消费者。\n\
  \n现在我们已经完成了 Kafka 消息代理的非常基础设置，准备好通过 RxJS 的魔力添加一点响应式特性！\n\n### 步骤 3 – 使 Kafka 生产者变为响应式\n\
  \n每当我们向我们的 NestJS API 控制器 `AppController` 发送 HTTP 请求时，我们将调用来自 `MessageBrokerService`\
  \ 的 `produce` 方法：\n\n```typescript\npublic kafkaMessage$ = new ReplaySubject<KafkaMessage>();\n\
  async produce(topic: string, message: string) {\n    this.kafkaMessage$.next({\n\
  \        topic,\n        compression: CompressionTypes.GZIP,\n        messages:\
  \ [{ value: message }],\n    });\n}\n```\n\n\n\n我们作为每条消息发送的请求体负载所示：\n\n```\n{\n\"\
  message\": \"{ \\\"id\\\": 3, \\\"name\\\": \\\"Pasta alla Gricia\\\", \\\"description\\\
  \": \\\"A Roman pasta dish featuring guanciale (cured pork jowl), pecorino romano\
  \ cheese, and black pepper.\\\", \\\"ingredients\\\": [\\\"pasta (rigatoni or bucatini)\\\
  \", \\\"guanciale\\\", \\\"pecorino romano cheese\\\", \\\"black pepper\\\"] }\"\
  \n}\n```\n\n现在，当我们将所有传入的消息存储在 RxJS subject 中时，我们就可以以响应的方式向 Kafka 代理器发送新消息。在服务的 `message-broker.ts`\
  \ 的 `init` 生命周期钩子中，我们可以订阅新消息：\n\n```\nthis.kafkaMessage$.pipe(\n  concatMap((kafkaMessage)\
  \ => from(this.producer.send(kafkaMessage))),\n).subscribe();\n```\n\n在这里，我们从生产器\
  \ `send` 方法的返回值创建了一个 `Observable` 流。通过利用 `concatMap` 操作符，我们不仅会将所有传入的消息发送到 Kafka\
  \ 代理器，还能保持消息的顺序。\n\n这是一个向 Kafka 代理器发送新消息的基本示例，但此时生产者器已连接。那么，如何创建一个对连接错误具有韧性的响应式生产者器呢？\n\
  \n### 第 4 步 – 响应生产者连接事件\n\n在我们的生产者服务初期，我们将模拟当生产者断开连接时会发生的情况：\n\n```\npublic producerActiveState$\
  \ = new Subject<boolean>();\nasync onModuleInit() {\n    setTimeout(() => {\n  \
  \      console.log('Disconnecting producer...');\n        this.producer.disconnect();\n\
  \    }, 40000);\n    setTimeout(() => {\n        console.log('Connecting producer...');\n\
  \        this.producer.connect();\n    }, 50000);\n    this.handleBrokerConnection();\n\
  }\n```\n\n在这种情况下，生产者保持韧性并继续收集传入的消息是关重要的。一旦它重新连接到代理器，生产者应该发送所有消息并继续接收新消息。\n\n在 `handleBrokerConnection`\
  \ 方法中，我们有以下代码：\n\n```\nhandleBrokerConnection(): void {\n    const producerConnect$\
  \ = from(this.producer.connect()).pipe(\n        retry({\n            count: 3,\n\
  \            delay: (error, retryCount) => {\n                console.log(\n   \
  \                 `Attempt ${retryCount}: Error occurred during network\n      \
  \              request, retrying in ${Math.pow(2, retryCount)} \n              \
  \      seconds...`\n                );\n                return timer(Math.pow(2,\
  \ retryCount) * 1000);\n            },\n        }),\n        catchError(error =>\
  \ {\n            console.error(`Error connecting to Kafka: ${error}`);\n       \
  \     this.producerActiveState$.next(false);\n            return EMPTY;\n      \
  \  }),\n    );\n    producerConnect$.subscribe();\n}\n```\n\n在这里，有几项正在操作：\n\n1.\
  \ `producerConnect$` 流是从 `this.producer.connect()` 的 Promise 响应创建的。\n2. 如果发生临时错误，我们应用指数退避重连策略，直到我们的生产者恢复连接。\n\
  \n在成功连接到生产者后，我们可以监听生产者的 `CONNECT` 和 `DISCONNECT` 事件。当连接变化时，我们将在单独的 subject 中跟踪活动状态：\n\
  \n```\nthis.producer.on(this.producer.events.CONNECT, () => {\n  this.producerActiveState$.next(true);\n\
  });\nconst producerDisconnect$ = fromEvent(\n  (handler) => this.producer.on(this.producer.events.DISCONNECT,\n\
  \  handler),\n);\n```\n\n此外，每当生产者断开连接时，我们将切换到 `producerConnect$` 流作为重连策略的一部分。\n\n\
  ```\nproducerDisconnect$.pipe(\n  switchMap(() => producerConnect$)\n).subscribe(()\
  \ => this.producerActiveState$.next(false));\n```\n\n### 第 5 步 – 生产者断开连接时的消息缓冲\n\
  \n由于我们已经在跟踪生产者的活动状态，我们可以如下 own 分离活动和非活动状态：\n\n```\nconst producerActive$ = this.producerActiveState$.asObservable().pipe(\n\
  \  filter(activeState => activeState));\nconst producerInactive$ = this.producerActiveState$.asObservable().pipe(\n\
  \  filter(activeState => !activeState));\n```\n\n现在 RxJS 的魔力开始了！根据这些状态，我们可以决定对传入的消息要做什么：\n\
  \n```\nconst acceptIncomingMessages$ = this.kafkaMessage$.pipe(\n  windowToggle(producerActive$,\
  \ () => producerInactive$));\nconst bufferIncomingMessages$ = this.kafkaMessage$.pipe(\n\
  \  bufferToggle(producerInactive$, () => producerActive$));\n```\n\n借助 `windowToggle`\
  \ 操作符，我们获得了对何时收集新流事件和何时停止之间切换的细粒度控制。如果生产者断开连接，我们将停止消息的常规发射。然而，在那个点，我们希望在缓冲区中收集所有传入的消息，以便在生产者重新连接后不会丢失它们。为了这些目的，我们可以利用\
  \ `bufferToggle` 操作符，它会在我们处于 `producerInactive$` 状态时跟踪所有消息。之后，我们可以合并这两个流，并在两种情况下向代理器发送消息：\n\
  \n```\nmerge(\n  acceptIncomingMessages$,\n  bufferIncomingMessages$\n).pipe(\n\
  \  mergeAll(),\n  concatMap((kafkaMessage) => from(this.producer.send(kafkaMessage))),\n\
  \  catchError(() => of('Error sending messages to Kafka!')),\n).subscribe();\n```\n\
  \n### 第 6 步 – 处理生产者上的背压\n\n当我们的 API 被大量新传入的消息淹没时，我们的生产者可能无法逐个发送所有消息。这可能会导致性能问题，如延迟、API\
  \ 中的内存泄漏，甚至服务器崩溃。在这些情况下，应用背压模式可能是很有用的。主要有两种主要的背压策略：有损背压和无损背压。根据用例，我们可以使用不同的 RxJS\
  \ 操作符选择要实现的策略策略。\n\n* 有损背压：`throttle`, `throttleTime`, `debounce`, `debounceTime`,\
  \ `sample`, `sampleTime`, `skip`, `skipLast`, `skipUntil`, `skipWhile`\n* 无损背压：`delay`,\
  \ `buffer`, `bufferCount`, `bufferTime`, `bufferToggle`, `bufferWhen`, `window`,\
  \ `windowCount`, `windowTime`, `windowToggle`, `windowWhen`\n\n有损背压策略具有较简单的形式，即消费者在过载时开始丢弃消息。这种策略在接收最新数据比处理每条消息更重要的情况下可能有用，例如实时股票价格。\n\
  \n在我们的用例中，我们决定采用无损背压，因为我们不想丢失任何消息：\n\n```\nmerge(\n  acceptIncomingMessages$,\n\
  \  bufferIncomingMessages$\n).pipe(\n  mergeAll(),\n  bufferTime(2000),\n  filter(messages\
  \ => messages.length > 0),\n  concatMap((kafkaMessage) => from(this.producer.sendBatch(\n\
  \    { topicMessages: kafkaMessage }\n  ))),\n  catchError(() => of('Error sending\
  \ messages to Kafka!')),\n).subscribe();\n```\n\n注意我们对流应用的几处更改：\n\n1. 我们使用 `bufferTime`\
  \ 操作符进行无损背压，每隔两秒我们将所有消息收集到缓冲区中。\n2. 我们过滤掉没有消息的时间帧（即空缓冲区）。\n3. 我们不是产生单条消息，而是使用 `sendBatch()`\
  \ 方法发送批消息。\n\n现在，正如我们所看到的，我们在同一个主题下异步获取消息。如果能将它们都收集在同一个主题下，并获得一个我们可以处理的消息数组，不是很好吗？\n\
  \n\n\n\n\n在我们消费者的 `run()` 方法中，我们之前一直在记录入站的消息。现在，让我们以响应式的方式来处理它们：\n\n```typescript\n\
  private readonly messages$ = new Subject<KafkaMessage>();\nawait consumer.run({\n\
  \    eachMessage: async ({ topic, partition, message }) => {\n        const kafkaMessage\
  \ = {\n            topic,\n            compression: CompressionTypes.GZIP,\n   \
  \         offset: message.offset,\n            messages: [{ value: message.value.toString()\
  \ }]\n        };\n        this.messages$.next(kafkaMessage);\n    },\n});\n```\n\
  \n每当有新消息到达时，我们的 `messages$` subject 就会收到通知。我们可以通过以下方式响应式地消费这些消息：\n\n```typescript\n\
  consumeMessages(): void {\n    this.messages$.asObservable().pipe(\n        groupBy(person\
  \ => person.topic, {\n            connector: () => new ReplaySubject(100) }),\n\
  \        concatMap(group$ => group$.pipe(\n            scan((acc, cur) => ({\n \
  \               topic: group$.key,\n                messages: acc.messages ? cur.messages.concat(acc.messages)\
  \ :\n                    cur.messages,\n            }), {} as KafkaConsumedMessage))\n\
  \        ),\n        catchError((error) => {\n            console.log('Error consuming\
  \ messages from Kafka!');\n            return EMPTY;\n        }),\n        tap(console.log),\n\
  \    ).subscribe();\n```\n\n在这里，我们可以看到，通过 `groupBy` 操作符的帮助，我们可以收集相同 topic 下的所有消息。之后，我们使用\
  \ `concatMap` 来保持消息的顺序，同时使用 `scan` 操作符转换内部流，将所有消息放入同一个数组中。另一种方法可能是使用 `mergeScan`\
  \ 操作符配合 `map` 操作符使用。\n\n当我们向 API 发送新的 POST 请求时，我们会看到消息被高效地分组到相同 topic 的数组中，并准备好处理。\n\
  \n![图 10.2：分组 Kafka 消息](img/B09031_11_2.png)\n\n图 10.2：分组 Kafka 消息\n\n我们可能还会注意到消息的顺序，最近的消息位于数组的开头。\n\
  \n### 步骤 8 – 处理消费者的背压\n\n正如我们在生产者上所做的那样，我们将对消费者部分应用无损背压。在流的开始，我们将添加 `bufferTime`\
  \ 操作符来处理无损背压。最后，我们的流看起来如下：\n\n```typescript\nthis.messages$.asObservable().pipe(\n\
  \    bufferTime(1000),\n    concatMap(messages => messages),\n    groupBy(person\
  \ => person.topic, {\n        connector: () => new ReplaySubject(100) }),\n    concatMap(group$\
  \ => group$.pipe(\n        scan((acc, cur) => ({\n            topic: group$.key,\n\
  \            messages: acc.messages\n            ? cur.messages.concat(acc.messages)\n\
  \            : cur.messages,\n        }), {} as KafkaConsumedMessage)\n    ),\n\
  \    catchError((error) => {\n        console.log('Error consuming messages from\
  \ Kafka!');\n        return EMPTY;\n    }),\n    tap(console.log),\n).subscribe();\n\
  ```\n\n### 步骤 9 – 实现死信队列\n\n此时，消息的消费可以运行得很顺畅。我们可以处理消息，或者将我们的消费者连接到我们想要的任何地方。但是关于\
  \ Kafka 总线上传消息的反序列化呢？如果处理消息时发生错误怎么办？对于这些情况，我们将发送一条格式无效的消息。我们将使用与之前相同的字符串化负载；只需删除一个逗号，以便导致解析失败。\n\
  \n在现实场景中，如果消息处理失败，我们希望跟踪所有失败的处理，将这些事件发送到监控服务，并调度它们重新处理。为了这些目的，我们将实现死信队列（dead-letter\
  \ queue）。这是一个处理消费者处理失败并发送到单独 topic 的消息的机制。我们将扩展步骤 7 中消费者 `run()` 方法的实现：\n\n```typescript\n\
  private readonly dlq$ = new ReplaySubject<KafkaMessage>();\nawait consumer.run({\n\
  \    eachMessage: async ({ topic, partition, message }) => {\n        const kafkaMessage\
  \ = {\n            topic,\n            compression: CompressionTypes.GZIP,\n   \
  \         offset: message.offset,\n            messages: [{ value: message.value.toString()\
  \ }]\n        };\n        let parsedMessage = null;\n        try {\n           \
  \ parsedMessage = this.deserializeMessage(kafkaMessage);\n        } catch (error)\
  \ {\n            this.dlq$.next({\n                topic: 'dlq',\n             \
  \   compression: CompressionTypes.GZIP,\n                messages: [{ value: message.value.toString()\
  \ }],\n                error\n            });\n            return;\n        }\n\
  \        this.messages$.next(parsedMessage);\n    },\n});\n```\n\n`deserializeMessage()`\
  \ 方法基本上尝试对每条消息调用 `JSON.parse()`。如果反序列化失败，我们将该消息发送到 `dlq` topic，并带上消息的信息和发生的错误。\n\
  \n每当有新消息发送到 `dlq` subject 时，我们可以通过调度一个新的值发射来响应该事件：\n\n```typescript\nasync onModuleInit()\
  \ {\n    this.dlq$.pipe(\n        delay(5000),\n        // 每天凌晨 2 点将 DLQ 错误发送到监控服务\n\
  \        subscribeOn(asyncScheduler),\n        materialize(),\n        tap(console.log),\n\
  \    ).subscribe();\n}\n```\n\n最后，当我们尝试发送一条包含错误的消息时，我们会在控制台中看到以下内容：\n\n\n\n\n\n\
  如果你以前没有用过 gRPC，他们的官方文档可能是一个很好的切入点：https://grpc.io/docs/what-is-grpc/introduction/。此外，NestJS\
  \ 还提供了关于如何设置 gRPC 微服务的文档：https://docs.nestjs.com/microservices/grpc。\n\n## 如何实现...\n\
  \n你是否好奇过像 Wolt 或 Uber Eats 这样的外卖应用是是如何向我们提供正在送餐的员的实时位置信息的？嗯，现在是时候揭秘其背后的运行原理了。在这个教程中，我们将\
  \ NestJS 服务器应用中构建一个 gRPC 微服务，它将接收食品订单，并利用 RxJS 的魔法力量，向客户端流式传输食品准备不同状态的结果。\n\n###\
  \ 步骤 1 – 定义 .proto 文件\n\n`.proto` 文件就像一个蓝图，定义了客户端和服务器之间通信的结构。通过在 `.proto/order.proto`\
  \ 文件中定义此 Protocol Buffers 结构，我们可以以比 JSON 更高效的方式序列化数据并在网络上发送食品订单数据：\n\n```\nsyntax\
  \ = \"proto3\";\npackage order;\nservice FoodOrderService {\n    rpc CreateOrder\
  \ (stream OrderRequest)\n    returns (stream OrderResponse);\n}\nmessage OrderRequest\
  \ {\n    string item = 1;\n    int32 quantity = 2;\n}\nmessage OrderResponse {\n\
  \    string id = 1;\n    string item = 2;\n    int32 quantity = 3;\n    string status\
  \ = 4;\n}\n```\n\n这里是对 `.proto` 文件定义的快速解读：\n\n1. 我们使用了 Protocol Buffers 的版本 3 语法。\n\
  2. `package` 帮助我们避免不同 Protocol Buffers 文件之间的命名冲突。\n3. 服务定义包含了服务名称、RPC 方法以及请求和响应类型。`CreateOrder`\
  \ 方法处理 `OrderRequest` 消息流并返回 `OrderResponse` 消息流。\n4. 我们定义了将在网络上发送的消息。你可以将消息看作是\
  \ REST 协议中的数据传输对象（`DTOs`）。消息定义了 gRPC 服务中客户端和服务器之间交换的数据结构。\n\n### 步骤 2 – 配置 gRPC\
  \ 微服务\n\n在我们的 `main.ts` 文件中，我们将设置通过 gRPC 协议进行通信的食品订单微服务：\n\n```\nimport { MicroserviceOptions,\
  \ Transport } from '@nestjs/microservices';\nimport { NestFactory } from '@nestjs/core';\n\
  import { join } from 'path';\nimport { ReflectionService } from '@grpc/reflection';\n\
  import { AppModule } from './app.module';\nasync function bootstrap() {\n    const\
  \ app = await NestFactory\n    .createMicroservice<MicroserviceOptions>(\n     \
  \   AppModule,\n        {\n         transport: Transport.GRPC,\n         options:\
  \ {\n             package: 'order',\n             protoPath: join(__dirname, './proto/order.proto'),\n\
  \             url: 'localhost:5000',\n             onLoadPackageDefinition: (pkg,\
  \ server) => {\n                new ReflectionService(pkg).addToServer(server);\n\
  \             },\n        },\n    });\n    await app.listen();\n}\nbootstrap();\n\
  ```\n\n在这里，我们定义了有效 gRPC 通信的所有必要选项，如传输方式、包名、`.proto` 文件的路径以及服务器 URL。此外，你可能注意到我们设置了\
  \ gRPC 服务器反射（reflection）。这允许客户端在不需要 Protocol Buffers 文件的情况下，发现服务器上可的服务及其方法。这种方法的好处是提供了更易开发体验；同时也更便于测试和调试\
  \ gRPC 服务。\n\n### 步骤 3 – 创建 gRPC 控制器\n\n在我们的 `order.controller.ts` 中，我们可以定义 gRPC\
  \ 方法，该方法将处理新订单的创建：\n\n```\n@Controller()\nexport class OrderController {\n  constructor(private\
  \ orderService: OrderService) {\n  @GrpcMethod('FoodOrderService', 'CreateOrder')\n\
  \  createOrder(\n    stream: Observable<OrderRequest>\n  ): Observable<OrderResponse>\
  \ {\n  return stream.pipe(mergeMap((data: OrderRequest) =>\n    this.orderService.createOrder(data)));\n\
  ```\n\n在这里，我们可以注意到几点重要事项：\n\n1. 通过 `@GrpcMethod` 装饰器，我们可以匹配 `.proto` 文件中的服务和 RPC\
  \ 方法。\n2. 控制器接收一个新的 `OrderRequest` 作为 `Observable`，这意味着我们可以对该流进行进行管道操作并利用 RxJS。\n\
  3. 我们也可以将 `OrderResponse` 作为 `Observable` 流返回。\n4. 凭借 RxJS `mergeMap` 操作符的力量，我们可以处理传入请求的并发性。这意味着可以同时处理三个以上的订单，而当我们只有三个或更少时，其他请求将排队。\n\
  \n### 步骤 4 – 食品订单响应式流\n\n在我们的 `order.service.ts` 中，我们将定义一个方法 `createOrder`，它接收新订单并返回特定订单的最新状态：\n\
  \n```\n@Injectable()\nexport class OrderService {\n  createOrder(orderRequest: OrderRequest):\
  \ Observable<OrderResponse> {\n    const id = crypto.randomUUID();\n    const newOrder:\
  \ OrderResponse = { orderRequest,\n    status: OrderStatus.PENDING };\n    const\
  \ currentOrder$ = new BehaviorSubject<OrderResponse>(newOrder);\n    return currentOrder$.asObservable();\n\
  \  }\n}\n```\n\n一旦接收到新订单，我们会立即将其状态更改为 `PENDING` 并通知客户端订单正在处理。随着时间的推移，将在 gRPC 流中将其状态切换到其他状态，如\
  \ `ACCEPTED`、`PREPARING`、`COURIER_ON_WAY` 或 `CANCELLED`。\n\n现在，一旦建立了 gRPC 流式传输，我们可以使用\
  \ RxJS 的力量来模拟随时间的响应式变化，更新订单状态并通知这些变化：\n\n```\nconst id = crypto.randomUUID();\n\
  const newOrder: OrderResponse = { orderRequest, id,\nstatus: OrderStatus.PENDING\
  \ };\nconst currentOrder$ = new BehaviorSubject<OrderResponse>(newOrder);\ncreateOrder(orderRequest:\
  \ OrderRequest): Observable<OrderResponse> {\n  const id = crypto.randomUUID();\n\
  \  const newOrder: OrderResponse = { ...orderRequest, id,\n  status: OrderStatus.PENDING\
  \ };\n  const orderStatus$ = new BehaviorSubject<OrderResponse>(newOrder);\n  of(newOrder)\n\
  \  .pipe(\n    delay(1000),\n    map((order: OrderResponse) => {\n      order.status\
  \ = OrderStatus.ACCEPTED;\n      orderStatus$.next(order);\n      return order;\n\
  \    }),\n    delay(1000),\n    map((order: OrderResponse) => {\n      order.status\
  \ = OrderStatus.PREPARING;\n      orderStatus$.next(order);\n      return order;\n\
  \    }),\n    delay(10000),\n    map((order: OrderResponse) => {\n      order.status\
  \ = OrderStatus.DELIVERED;\n      orderStatus$.next(order);\n      return order;\n\
  \    }),\n    tap(() => orderStatus$.complete()),\n    takeUntil(this.stop$),\n\
  \  )\n  .subscribe();\n  return orderStatus$.asObservable();\n}\n```\n\n在这里，我们通过简单地延迟订单状态变化的通知来模拟食品准备过程。在流的结束时，我们将完成\
  \ `orderStatus$` 流，因为我们需要通知控制器请求已完成，并可以处理下一个并发请求。\n\n### 步骤 5 – 流式传输快递的地理位置更新\n\n\
  在 `PREPARING` 和 `DELIVERED` 状态之间，我们还有一个状态，即外卖员从商家将食品订单送给客户。我们可以模拟这种行为的方法仅仅是在特定的间隔内附加地理坐标：\n\
  \n\n\n\n\n```typescript\nswitchMap((order: OrderResponse) => {\n    order.status\
  \ = OrderStatus.COURIER_ON_THE_WAY;\n    return interval(2000).pipe(\n        map(i\
  \ => {\n            const orderWithLocation = {\n                order,\n      \
  \          location: { lat: 40.7128 + i * 0.1, lng: -74.0060 + i * 0.1 \n      \
  \      }\n        };\n            this.orderStatus$.next(orderWithLocation);\n \
  \           return orderWithLocation;\n        }),\n        startWith({ ...order,\
  \ location: { lat: 40.7128, lng: -74.0060 } }),\n        takeUntil(merge(timer(10001),\
  \ this.stop$),\n    );\n}),\n```\n\n我们可以看到，每隔两秒我们会更新一次快递员的位置，并通知 gRPC 客户端该变化。此外，由于我们使用\
  \ `interval` 算符创建了一个内部 `Observable`，我们需要注意内存泄漏问题。在需要细粒度控制 Observable 流何时结束的情况下，我们可以使用像\
  \ `takeUntil` 这样的算子，它会在给定信号时自动取消任何观察者的订阅（在我们案例中，是 `timer` 算符在 10,001 毫秒后的发射，或者是我们停止服务）。\n\
  \n最后，当我们使用 `Postman` 等 API 测试工具测试我们的 gRPC 控制器时，可以看到我们是如何高效地流式传输数据并向客户端提供系统内部变化的及时通知的。\n\
