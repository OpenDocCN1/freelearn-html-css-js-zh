  \n3. 搞定！我们将把免费 PDF 和其他福利直接发送到你的邮箱。\n\n# 1\n\n# RxJS 中的错误处理与副作用\n\n欢迎阅读 *RxJS Cookbook\
  \ for Reactive Programming*！\n\n在使用了 `RxJS` 一段时间后，并学习了 `RxJS` 文档中的每一个操作符后，你是否曾感到困惑，或者不知道如何让你的\
  \ `RxJS` 技巧上一层楼？本书充实了（Packt-ed）高级配方和实践案例，带你进入新的高度，让你应对网络开发世界中的任何现实挑战。系好，这将是一个有趣的旅程！\n\
  \n本章探索了管理真实世界响应式编程中不可避免的复杂性的技术。我们将学习如何优雅地处理错误并维护流的完整性。我们将深入研究副作用管理，以便在不干扰数据流的情况下执行日志、API\
  \ 调用和 DOM 更新等任务。此外，我们将掌握隔离副作用的策略，以确保 `RxJS` 代码的可预测性和可测试性。最后，我们将理解 `WebSocket` 作为副作用的作用，并探索心跳技术以以响应式的方式确保连接的完整性。\n\
  \n在本章中，我们将涵盖以下配方：\n\n*   处理 DOM 更新\n*   处理网络请求\n*   处理网络错误\n*   调试 RxJS 流\n*   理解\
  \ HTTP 轮询\n*   处理 WebSocket 连接\n\n\n\n\n本章食谱的代码存放在 GitHub 仓库中：\n\n[`github.com/PacktPublishing/RxJS-Cookbook-for-Reactive-Programming/tree/main/Chapter01`](https://github.com/PacktPublishing/RxJS-Cookbook-for-Reactive-Programming/tree/main/Chapter01)\n\
  \n## 处理 DOM 更新\n\n由于其声明式和响应式的特性，RxJS 提供了一种高效处理 DOM 更新并响应 UI 更新的方法，而无需直接操作 DOM 元素。\n\
  \n## 如何实现……\n\n在这个示例中，我们将构建一个小型的**烹饪食谱**应用程序，其中我们将从从模拟的后端（使用 MSW）加载食谱列表并在列表中显示它们。之后，我们将实现两个搜索字段，通过名称和配料来查找所需的食谱。我们将通过声明式的方式处理这两个过滤器的输入更新来实现这一点，然后组合查询结果并最终提供过滤后的结果。\n\
  \n以下是该应用程序在初始状态下的外观：\n\n![图 1.1: 食谱应用 – 初始状态](img/B09031_01_01.png)\n\n图 1.1: 食谱应用\
  \ – 初始状态\n\n### 步骤 1 – 处理一个搜索输入\n\n让我们从简单的开始，首先实现按名称过滤搜索。在我们的 Angular 组件中，将有一个 `searchNameInput`\
  \ DOM 元素引用和一个 `fromEvent` 操作符：\n\n```typescript\n@ViewChild('searchNameInput') \n\
  \    searchNameInputElement!: ElementRef;\nngAfterViewInit() {\n    fromEvent<InputEvent>(\n\
  \        this.searchNameInputElement.nativeElement,'input')\n        .pipe(\n  \
  \          map((searchInput: InputEvent) =>\n                (searchInput.target\
  \ as HTMLInputElement)\n                    .value),\n            startWith(''),\
  \ debounceTime(500),\n            distinctUntilChanged(),\n            switchMap((searchName:\
  \ string) => \n                this.recipesService.searchRecipes$(searchName)))\n\
  \            .subscribe((recipes) => this.recipes = recipes);\n}\n```\n\n以下是我们所做的解析：\n\
  \n1.  通过 `map` 操作符，我们将提取输入的值，并使用 `startWith` 操作符规定初始值应为空字符串。\n\n2.  为了防止发送不必要的请求并增加服务器负载，我们将对用户的每次按键进行最多\
  \ 500 毫秒的防抖处理。此外，我们将检查搜索查询是否与上一个不同（例如，如果我们想搜索千 agna，我们会输入查询 `\"lasag\"`，获取结果，然后删除“`g`”并在\
  \ 500 毫秒内将“`g`”放回查询；我们不会发送另一个请求，因为查询没有变化）。\n\n3.  最后，一旦获取到搜索查询，我们将使用 `switchMap`\
  \ 获取查询值并将请求发送到后端 API。\n\n### 为什么使用 switchMap？\n\n我们在这里使用 `switchMap` 的主要原因是它的取消效果。这意味着：假设用户输入了一个搜索查询，而我们有一个正在进行的请求。现在，如果用户将查询更改为新的，之前的请求将被自动取消，因为我们不再对之前的结果感兴趣。\n\
  \n现在，当我们输入食谱查询时，我们可以在 UI 中看到结果：\n\n![图 1.2: 按名称搜索食谱](img/B09031_01_02.png)\n\n图\
  \ 1.2: 按名称搜索食谱\n\n### 步骤 2 – 处理两个搜索输入\n\n现在，让我们为配料添加第二个搜索输入。同样，我们将为第二个输入创建一个搜索输入事件流，但这次，我们还希望与第一个输入的结果组合。我们可以实现这一点的办法是使用\
  \ `combineLatest` 函数，它将从多个源创建一个事件流。\n\n`startWith` 操作符在这里也非常好用，因为在两个输入至少发射一次值之前，`combineLatest`\
  \ 不会发射任何值。这意味着如果不使用 `startWith`，我们最初将看到空的食谱列表。添加第二个输入后，我们的代码如下：\n\n```typescript\n\
  const searchNameInputValue$ = fromEvent<InputEvent>(\n    this.searchNameInputElement.nativeElement,\
  \ 'input')\n    .pipe(\n        map((searchInput: InputEvent) =>\n            (searchInput.target\
  \ as HTMLInputElement) .value),\n        startWith('')\n    );\n    const searchIngredientInputValue$\
  \ = fromEvent<InputEvent>(\n        this.searchIngredientInputElement.nativeElement,\
  \ 'input')\n        .pipe(\n            map((searchInput: InputEvent) =>\n     \
  \           (searchInput.target as HTMLInputElement) .value),\n            startWith('')\n\
  \    );\n    combineLatest({\n      searchName: searchNameInputValue$,\n      searchIngredient:\
  \ searchIngredientInputValue$\n    })\n    .pipe(debounceTime(500),\n          distinctUntilChanged(\n\
  \    (prev, curr) => prev.searchName ===\n        curr.searchName && prev.searchIngredient\
  \ ===\n            curr.searchIngredient),\n        switchMap(({ searchName, searchIngredient\
  \ }) =>\n            this.recipesService.searchRecipes$(\n                searchName,\
  \ searchIngredient)))\n    .subscribe((recipes) => this.recipes = recipes);\n```\n\
  \n注意与上一个示例相比 `distinctUntilChange` 的另一个重要变化。使用操作符时最常见的错误之一是假设它会自动判断流是否发生了变化，但那对于从流中输出的原始值有效。之前，我们从第一个搜索输入发射字符串值，但现在由于我们组合了两个搜索输入的结果，我们得到的是对象值流。因此，我们必须对对象属性进行深度检查，在这里是\
  \ `searchName` 和 `searchIngredient`。或者，我们可以使用 `distinctUntilChanged` 操作符。\n\n如果我们在浏览器中打开应用程序，现在不仅可以按名称，还可以按配料搜索食谱：\n\
  \n![图 1.3: 按名称和配料搜索食谱](img/B09031_01_03.png)\n\n图 1.3: 按名称和配料搜索食谱\n\n## 另另\n\n*\
  \   MSW: https://mswjs.io/\n*   `fromEvent` 操作符: https://rxjs.dev/api/function/fromEvent\n\
  *   `map`: https://rxjs.dev/api/operators/map\n*   `startWith` 操作符: https://rxjs.dev/api/operators/startWith\n\
  *   `switchMap`: https://rxjs.dev/api/operators/switchMap\n*   `combineLatest` 函数:\
  \ https://rxjs.dev/api/function/combineLatest\n*   `distinctUntilChanged` 操作符: https://rxjs.dev/api/operators/distinctUntilChanged\n\
  \n# 处理网络请求\n\nRxJS 真正擅长的领域是处理副作用。由于 `Observable` 是随时间到达的值流，这暗示了异步性。这使得 RxJS 成为管理异步状态和数据流（例如复杂的网络通信）的完美选择。在本章节中，我们将探索处理网络请求场景的最先进、复杂的方法。\n\
  \n## 如何实现……\n\n在这个示例中，我们将构建一个小型的烹饪食谱应用程序，其中我们将从模拟的后端（使用 MSW）加载食谱列表并在列表中显示它们。在点击特定的食谱后，我们将在新页面上显示该食谱的更多详情，这需要与后端进行再次通信来获取这些细节。\n\
  \n### 步骤 1 – 顺序处理请求\n\n假设我们有两个不同的端点。一个包含食谱信息，另一个仅包含相同 ID 的食谱详细信息。异步数据流看起来如下：\n\n\
  1.  我们将向 `https://super-recipes.com/api/recipes?id=1` 端点发送请求，它将返回食谱的基本信息。\n\n2.\
  \  然后我们将从响应中获取特定食谱的 ID，并向 `https://super-recipes.com/api/recipes/details?id=1` 端点发送一个新的顺序请求：\n\
  \n\n\n\n\n```\ngetRecipeById$(id: number): Observable<Recipe> {\n    return this.httpClient.get<Recipe>(\n\
  \        `/api/recipes?id=${id}`\n    );\n}\ngetRecipeDetails$(\n    id: number\n\
  ): Observable<{\n    recipe: Recipe,\n    details: RecipeDetails\n}> {\n    return\
  \ this.getRecipeById$(id).pipe(\n        switchMap((recipe: Recipe) => {\n     \
  \       return this.httpClient\n            .get<RecipeDetails>(\n             \
  \   `/api/recipes/details?id=${id}`\n            )\n            .pipe(map((details)\
  \ => ({\n                recipe,\n                details\n            }))\n   \
  \     ))\n        )\n    );\n}\n```\n\n3. 最后，我们将使用 `map` 操作符来合并来自两个端点的结果，因为我们在详情组件（details\
  \ component）中需要所有这些信息。\n\n如果我们点击其中一个菜谱，它会将我们导航到 `RecipeDetails` 页面，并显示每个菜谱特定的营养信息：\n\
  \n![图 1.4：带有营养信息的菜谱详情页](img/B09031_01_04.png)\n\n图 1.4：带有营养信息的菜谱详情页\n\n### 步骤 2\
  \ – 并行处理请求\n\n假设我们的菜谱使用了高分辨率的大图片。我们希望减少初始响应负载的大小，并减轻 `RecipeListComponent` 的初始加载负担。为了提高应用的性能，我们将图片加载分离到另一个端点，因此最初我们从一个端点显示菜谱列表数据。之后，我们将并行发送多个请求来获取所有对应的图片。在示例中，我们首先向\
  \ [`super-recipes.com/api/recipes`](https://super-recipes.com/api/recipes) 端点发送请求以获取菜谱列表。在响应中，我们将获得所有菜谱\
  \ ID 的列表，基于该列表向 [`super-recipes.com/api/recipes/images`](https://super-recipes.com/api/recipes/images)\
  \ 端点发送并行请求。同时，我们将为每个图片准备一个加载指示器。\n\n此外，我们将利用 `forkJoin` 操作符的力量来并行发送图片请求：\n\n```\n\
  getRecipesWithImageInParallel$(): Observable<ImageUrl[]> {\n    return this.getRecipes$().pipe(\n\
  \        tap((recipes: Recipe[]) =>\n            this.recipes.next(recipes)),\n\
  \        switchMap((recipes: Recipe[]) => {\n            const imageRequests = recipes.map((recipe)\
  \ =>\n                this.httpClient.get<ImageUrl>(\n                    `/api/recipes/images?id=${recipe.id}`\n\
  \                )\n            );\n        return forkJoin(imageRequests);\n  \
  \      }),\n    );\n}\n```\n\n现在当我们在浏览器中打开菜谱时，我们可以看到占位符而不是图片，并在 **Network**（网络）标签页中，我们可以看到图片正在并行下载：\n\
  \n![图 1.5：之前（第一次）和（第二次）的菜谱图片](img/B09031_01_05.png)![图 1.5：之前（第一次）和（第二次）的菜谱图片](img/B09031_01_06.png)\n\
  \n图 1.5：之前（第一次）和（第二次）的菜谱图片\n\n### 步骤 3 – 处理并发请求\n\n在目前为止的示例中，我们一直在并行发送多个请求，但这种方法的缺点是我们在显示结果之前必须等待所有图片请求完成。由于我们的图片可能有几\
  \ MB 大小并且可能会让服务器崩溃，我们可以通过并发处理图片请求来进一步提高菜谱应用的性能：\n\n1. 首先，我们可以加载前三个菜谱的图片。\n2. 然后，在获得这些图片的响应后，我们可以为剩余图片发送请求。\n\
  \n实现这种效果的方法是使用 **RxJS mergeMap 并发** 模式：\n\n```javascript\npublic recipes = new BehaviorSubject<Recipe[]>([]);\n\
  getRecipesWithConcurrentImage$(): Observable<ImageUrl> {\n    return this.getRecipes$().pipe(\n\
  \        tap((recipes: Recipe[]) => this.recipes.next(recipes)),\n        switchMap((recipes:\
  \ Recipe[]) => {\n            const imageIds = recipes.map(\n                (recipe)\
  \ => recipe.id);\n            return from(imageIds).pipe(\n                mergeMap((id)\
  \ =>  this.httpClient.get(\n                    `/api/recipes/images?id=${id}`),\
  \ 3\n            );\n        })\n    );\n}\n```\n\n通过从第一个请求中提取所有图片的 ID，我们可以从该 ID\
  \ 数组创建一个新的内部 Observable，并使用 `mergeMap` 发送并发请求。注意 `mergeMap` 的第二个参数：该参数将帮助我们精调同时可以进行多少并发请求。通过这种方式，我们可以限制请求数量，防止服务器产生过多的正在进行的请求。这意味着我们将三个三个地加载图片列表，这是我们可以在开发者工具（Dev\
  \ Tools）中观察到的现象。\n\n![图 1.6：并发图片请求](img/B09031_01_07.png)![图 1.6：并发图片请求](img/B09031_01_08.png)\n\
  \n图 1.6：并发图片请求\n\n## 另另\n\n* `forkJoin` 操作符: https://rxjs.dev/api/index/function/forkJoin\n\
  * `mergeMap` 操作符: https://rxjs.dev/api/operators/mergeMap\n\n# 处理网络错误\n\n到目前，我们已经处理了顺利路径（happy\
  \ path）。但如果情况不顺利呢？我们仍然需要构建健壮的应用。\n\n## 如何实现\n\n在这个示例中，我们将发现韧性模式并学习如何处理网络错误。\n\n\
  ### 步骤 1 – 捕获错误\n\n响应网络错误的最简单方法就是使用 `catchError` 操作符：\n\n```javascript\ngetRecipes$():\
  \ Observable<Recipe[]> {\n    return this.httpClient.get<Recipe[]>(\n        'https://super-recipes.com/api/recipes'\n\
  \    ).pipe(\n        catchError((error) => {\n            this._snackBar.open(\n\
  \                '无法获取菜谱。',\n                '关闭'\n            );\n            return\
  \ EMPTY;\n        })\n    );\n}\n```\n\n这里的策略非常简单。如果请求错误，捕获错误，在 UI 中显示并优雅地结束流。在某些情况下，我们可能需要重新抛出错误，如果我们在之后需要它：\n\
  \n```javascript\nthrowError(() => new Error('无法获取菜谱。'))\n```\n\n在浏览器中，我们可以打开开发者工具，禁用网络请求并看到这种行为，同时还有错误通知：\n\
  \n![图 1.7：错误通知](img/B09031_01_09.png)\n\n图 1.7：错误通知\n\n但是，如果服务器只是出现了一的瞬时小故障，导致这个错误是一次性的呢？在我们这样关闭通知后，没有办法知道几秒钟后一切是否正常，只能刷新页面并重新开始。这就是为什么我们需要重试策略。我们实现这种的方法是使用\
  \ RxJS `retry` 操作符。\n\n如果我们只传递一个数字作为参数，这表示将连续立即发生的重试次数。\n\n我们应用此操作符的方法是将其链在 `catchError`\
  \ 操作符之后：\n\n```javascript\ngetRecipes$(): Observable<Recipe[]> {\n    return this.httpClient.get<Recipe[]>(\n\
  \        'https://super-recipes.com/api/recipes'\n    ).pipe(\n        catchError((error)\
  \ => {\n            this._snackBar.open(\n                '无法获取菜谱。',\n         \
  \       '关闭'\n            );\n            return throwError(() => new Error(\n \
  \               '无法获取菜谱。'));\n        }),\n        retry(3)\n    );\n}\n```\n\n\
  实现 `retry` 模式将导致如下：\n\n![图 1.8：带有重试次数的错误](img/B09031_01_10.png)\n\n图 1.8：带有重试次数的错误\n\
  \n但是，理想情况下，我们希望在两次重试尝试之间留出时间，以便服务器恢复。这引导我们进入下一个模式。\n\n### 步骤 3 – 使用指数退避模式\n\n\n\n\
  \n\n这是一种重试模式，通过逐渐增加重试尝试之间的延迟，直到我们获得成功响应，或者最终放弃并判定系统当前存在问题：\n\n```javascript\n getRecipesWithBackoffStrategy$():\
  \ Observable<Recipe[]> {\n    return this.httpClient.get<Recipe[]>('/api/recipes')\n\
  \    .pipe(\n        catchError((error) => {\n            this._snackBar.open(\n\
  \                'Recipes could not be fetched.',\n                'Close'\n   \
  \         );\n            return throwError(() => new Error(error));\n        }),\n\
  \        retry({\n            count: 3,\n            delay: (error, retryCount)\
  \ => {\n            return timer(Math.pow(2, retryCount) * 1000);\n            },\n\
  \        }),\n    );\n}\n```\n\n为了实现这种模式，我们将延迟作为 `retry` 配置的一部分。它是一个带有 `error` 和\
  \ `retryCount` 参数的回调函数。在 RxJS `timer` 函数的帮助下，我们将发射一个延迟来发送新的通知，按指数级增加两次重试尝试之间的时间。结果是，我们将在网络开发者工具中看到四个失败的请求（一个原始请求和三个重试请求）。\n\
  \n![图 1.9：指数退避策略](img/B09031_01_11.png)\n\n图 1.9：指数退避策略\n\n### 步骤 4 – 使用断路器模式\n\n\
  想象家中的电路断路器。如果出现浪涌或过载，断路器会跳闸，切断电源以保护你的电器并防止进一步损坏。软件中的`断路器模式`原理类似。\n\n如果我们在系统中经历了多次级联错误，我们将打开电路。在\
  \ `OPEN` 状态下，我们将在特定段时间内立即拒绝向服务器的任何新请求。在此之后，我们进入 `HALF_OPEN` 状态，允许允许几次测试请求以检查系统在此期间是否已经恢复。如果系统已恢复且请求成功，我们就关闭电路。否则，我们将再次打开它持续一段时间。\n\
  \n首先，让我们编写方法来表示这些状态以及向这些状态的转换：\n\n```javascript\nprivate state: 'CLOSED' | 'OPEN'\
  \ | 'HALF_OPEN' = 'CLOSED';\nprivate openCircuit() {\n    if (this.state === 'OPEN')\
  \ return;\n    this.state = 'OPEN';\n    timer(15000)\n    .subscribe(() => this.halfOpenCircuit());\n\
  }\nprivate halfOpenCircuit() {\n    this.state = 'HALF_OPEN';\n}\nprivate closeCircuit()\
  \ {\n    this.state = 'CLOSED';\n}\n```\n\n现在我们准备好在发生网络故障应对这些状态做出反应。在我们的 `recipe.service.ts`\
  \ 中，我们将首先检查在处于 `OPEN` 状态时是否应该抛出错误：\n\n```javascript\nsendRequestIfCircuitNotOpen()\
  \ {\n    if (this.state === 'OPEN') {\n        console.error('Circuit is open, aborting\
  \ request');\n        return throwError(() =>\n            new Error('Circuit is\
  \ open'));\n    }\n    return this.httpClient.get<Recipe[]>('/api/recipes');\n}\n\
  getRecipesWithCircuitBreakerStrategy$():   \n    Observable<Recipe[]> {\n      \
  \  return defer(() => \n            this.sendRequestIfCircuitNotOpen());\n    }\n\
  ```\n\n以下是我们所做的分解：\n\n1.  首先，在 `defer` 函数的帮助下，我们推迟请求的执行，直到我们确定电路的当前状态。\n2.  我们检查电路状态是否为\
  \ `OPEN`：\n    *   如果是，我们立即抛出错误并设置一个 15 秒的定时器进入 `HALF_OPEN` 状态，以便我们可以在此之后再次尝试。\n\
  \    *   如果不是，我们将允许至少一次请求。\n\n现在让我们检查 `pipe` 操作符序列中包含了什么：\n\n```javascript\ngetRecipesWithCircuitBreakerStrategy$():\n\
  \    Observable<Recipe[]> {\n        return defer(() => \n            this.sendRequestIfCircuitNotOpen()\n\
  \        ).pipe(\n            catchError((error) => {this._snackBar.open(\n    \
  \            'Recipes could not be fetched.', 'Close');\n            return throwError(()\
  \ => new Error(\n                'Recipes could not be fetched.'));\n        }),\n\
  \        retry({\n            count: this.state === 'HALF_OPEN' ? 1 : 3,\n     \
  \       delay: (error, retryCount) => {\n                if( this.state === 'HALF_OPEN'\
  \ ||\n                    retryCount === 3)\n                {\n               \
  \     this.openCircuit();\n                    return throwError(() =>\n       \
  \                 new Error('Circuit is open'));\n                }\n          \
  \  return timer(2000);\n            },\n        }),\n    );\n}\n```\n\n作为重试机制的一部分，在这里我们可以注意到，根据电路状态将重试次数控制为一次或三次。此外，如果当前状态为\
  \ `HALF_OPEN` 且我们再次失败，或者最初超过三次重试时，我们将进入 `OPEN` 状态并抛出错误。我们每隔两秒进入一次 `retry` 块，检查是否有任何变化，直到系统最终恢复或我们放弃并显示错误通知。\n\
  \n![图 1.10：断路器模式](img/B09031_01_12.png)\n\n图 1.10：断路器模式\n\n\n\n\n\n```\nexport const\
  \ networkLogger: HttpInterceptorFn = (\n                                req, next)\
  \ => {\n    const started = Date.now();\n    const httpClient = inject(HttpClient);\n\
  \    const errorSubject = new Subject<HttpErrorResponse>();\n    function logSuccessfulResponse(event:\
  \ any) {\n        if (event instanceof HttpResponse) {\n            const elapsed\
  \ = Date.now() - started;\n            console.log(\n        `Request took %c${elapsed}\
  \ ms`, 'color: #ffc26e');\n            console.log('%cResponse:', 'color: #d30b8e',\
  \ \n                        event);\n        }\n    }\n    return next(req).pipe(\n\
  \        tap(() => console.log(\n           '-----------------'\n           `\\\
  nRequest for ${req.urlWithParams} started...`\n        )\n    ),\n    tap((event)\
  \ => logSuccessfulResponse(event)),\n    finalize(() => console.log('-----------------'))\n\
  \    );\n};\n```\n\n以下是我们正在操作步骤说明：\n\n1.  首先，我们记录每个请求开始的时间。\n2.  然后，在获取响应后，在 `logSuccessfulResponse`\
  \ 函数中，我们会在响应的同时显示请求所花费的时间。\n\n### 步骤 2 – 记录网络错误\n\n发生网络错误时，我们可以使用 `catchError` 操作符来处理网络错误，并记录错误发生的时间和原因：\n\
  \n```\nfunction logFailedResponse(error: HttpErrorResponse):\n    Observable<never>\
  \ {\n        const elapsed = Date.now() - started;\n        console.log(`Request\
  \ for ${\n            req.urlWithParams} failed after %c${elapsed} \n          \
  \  ms`,'color: #ffc26e'\n        );\n    console.log('%cError:', 'color: #d30b8e',\
  \ error);\n    errorSubject.next(error);\n    throw error;\n}\nreturn next(req).pipe(\n\
  \    tap(() =>\n        console.log(\n            ' ----------------- ',\n     \
  \       `\\nRequest for ${req.urlWithParams} started...`\n        )\n    ),\n  \
  \  tap((event) => logSuccessfulResponse(event)),\n    catchError((error) => logFailedResponse(error)),\n\
  \    finalize(() => console.log(' ----------------- '))\n);\n```\n\n此外，我们可能会注意到每当发生错误时，我们将该错误发送到\
  \ `errorSubject`。现在，每当有新错误发射到 `Subject` 时，我们就可以通知我们的分析服务，并在系统内部建立自定义的错误报告机制：\n\n\
  ```\nerrorSubject\n    .pipe(\n        concatMap((error: HttpErrorResponse) =>\n\
  \            httpClient.post('/api/analytics', error)\n    )\n).subscribe();\n```\n\
  \n现在，当我们打开浏览器控制台时，可以观察网络流量并改进调试体验。此外，注意在发生错误的情况下，我们会从终端获取一个错误响应，从我们的分析端获取一个成功响应。\n\
  \n![图 1.11: 控制台日志服务](img/B09031_01_13.png)![图 1.11: 控制台日志服务](img/B09031_01_14.png)\n\
  \n图 1.11: 控制台日志服务\n\n# 理解 HTTP 轮询\n\nHTTP 轮询（HTTP polling）是通过定期间隔获取数据以保持数据更新的常用技术之一。通过这种方式，我们可以从服务器获取实时更新，监控长时间运行任务的进度，或检查频繁的数据变化。这是一种通过\
  \ HTTP（一种无状态协议）与服务器模拟实时连接的方法。\n\n## 如何实现……\n\n在本食谱中，我们将通过构建一个小型烹饪食谱应用，来探索标准 HTTP\
  \ 轮询的响应式方法，以及长轮询（long polling）。首先，我们将从模拟后端（使用 MSW）加载食谱列表并并在列表中显示它们。然后，我们将实现一种轮询机制，持续检查是否有新的食谱数据，以用新数据刷新列表。\n\
  \n### 步骤 1 – 标准 HTTP 轮询\n\n在我们的 `http-polling.service.ts` 中，根据可配置的间隔，我们为该间隔设置了 `timer`。在每个间隔之后，我们都会发送一个新请求来获取最新数据：\n\
  \n```\nprivate stopPolling$ = new Subject<void>();\nstartPolling<T>(url: string,\
  \ interval: number = 5000): \n    Observable<T> {return timer(0, interval).pipe(\n\
  \        switchMap(() => this.httpClient.get<T>(url)),\n        takeUntil(this.stopPolling$),\n\
  \        shareReplay({ bufferSize: 1, refCount: true })\n    );\n}\n```\n\n如果在浏览器中打开控制台，我们可以观察到每五秒发送一次网络请求：\n\
  \n![图 1.12: HTTP 轮询](img/B09031_01_15.png)\n\n图 1.12: HTTP 轮询\n\n### 步骤 2 – 长 HTTP\
  \ 轮询\n\n**长轮询**（Long polling）与标准轮询有所不同。在间隔后发送请求（如果数据没有变化，可能会浪费带宽），客户端发送请求，服务器保持连接开启，直到新数据可用或发生超时：\n\
  \n```\nstartLongPolling<T>(\n    url: string,\n    interval: number = 5000\n): Observable<T>\
  \ {\n    return timer(0, interval).pipe(\n        switchMap(() => this.httpClient.get<T>(url).pipe(\n\
  \            timeout(interval)),\n    retry({\n        count: 3,\n        delay:\
  \ (error, retryCount) => {\n            console.log(\n                `Attempt ${retryCount}:\n\
  \                Error occurred during polling,retrying...`\n            );\n  \
  \          this._snackBar.open(\n                'Retrying to establish connection...',\
  \ 'Close'\n            );\n            return timer(interval);\n        },\n   \
  \ }),\n    catchError(error => {\n        console.error('Long polling error:', error);\n\
  \        this._snackBar.open(error.message, 'Close');\n        return throwError(()\
  \ => error);\n    }),\n    takeUntil(this.stopPolling$),\n    shareReplay({ bufferSize:\
  \ 1, refCount: true })\n    );\n}\n```\n\n与标准轮询相比，注意这里我们在请求末尾添加了定时器：\n\nswitchMap(()\
  \ => this.httpClient.get<T>(url).pipe(timeout(interval)),\n\n这意味着如果我们与服务器建立连接，且响应在定义的\
  \ `interval`（在本例中为五秒）之前到达，请求将超时，然后我们将进入 `retry` 机制。\n\n如果我们打开浏览器控制台，可能会观察到这种行为。如果响应在间隔内到达，我们将重试相同的请求，直到最终抛出错误。\n\
  \n![图 1.13: 长轮询](img/B09031_01_16.png)![图 1.13: 长轮询](img/B09031_01_17.png)\n\n图\
  \ 1.13: 长轮询\n\n### 如何尝试轮询\n\n在 `mocks/handlers.ts` 文件中，有一个来自 MSW 的 `delay` 函数可以延迟\
  \ HTTP 响应一段时间，因此我们可以尝试这个延迟。如果我们延迟设置为五秒以内，在我们的示例中，我们将看到食谱列表每五秒刷新一次。如果我们延迟设置为五秒以上，我们可以模拟后端服务的缓慢响应，并查看我们的应用程序在错误情况下的表现。\n\
  \n## 另\n\n*   `interval` 函数: [`rxjs.dev/api/function/interval`](https://rxjs.dev/api/function/interval)\n\
  *   `timeout` 操作符: [`rxjs.dev/api/operators/timeout`](https://rxjs.dev/api/operators/timeout)\n\
  *   `retry` 操作符: [`rxjs.dev/api/operators/retry`](https://rxjs.dev/api/operators/retry)\n\
  *   `delay` 操作符: [`rxjs.dev/api/operators/delay`](https://rxjs.dev/api/operators/delay)\n\
  \n# 处理 WebSocket 连接\n\n**WebSocket** 是一种为客户端与服务器之间提供实时通信的协议。WebSocket 与 HTTP 的区别在于前者是双向通信，双方都可以持续发送数据，这非常适合实时应用程序，如聊天应用、多人游戏、实时通知、IoT\
  \ 应用等。\n\nRxJS 为我们提供了 `webSocket` 工厂函数，它是浏览器提供的兼容 W3C WebSocket 对象的封装。\n\n\n\n\n\
  \n在本教程中，我们将通过构建一个简单的烹饪食应用，探索一种通过 WebSocket 处理实时更新的响应式方法。我们将通过 WebSocket 连接从模拟后端（使用\
  \ MSW）加载菜谱列表并并在列表中显示它们。此外，如果有新的数据条目，我们将通过 WebSocket 自动更新列表。再者，我们还将实现一个心跳机制，这在丢失\
  \ WebSocket 连接时是至关重要的。\n\n### 第 1  – 连接到套接字\n\n在我们的 `recipe-list.component.ts` 中，我们调用\
  \ `connect` 方法来建立与 WebSocket 的连接：\n\n```\nexport class RecipesListComponent {\n\
  \    constructor(private recipesService: RecipesService) {}\n    ngOnInit() {\n\
  \        this.recipesService.connect();\n    }\n    ngOnDestroy() {\n        this.recipesService.close();\n\
  \    }\n}\n```\n\n在我们的 `recipes.service.ts` 中，我们可以看到 `connect` 方法背后的实现：\n\n```\n\
  import {\n    webSocket, WebSocketSubject } from 'rxjs/webSocket';\nexport interface\
  \ Message<T> {\n    type: string;\n    payload?: T;\n}\nexport class RecipesService\
  \ {\n    private socket$!: WebSocketSubject<Message<any>>;\n    connect() {\n  \
  \      if (!this.socket$ || this.socket$.closed) {\n            this.socket$ = webSocket<Message<any>>({\n\
  \                url: 'wss://recipes.example.com',\n                deserializer:\
  \ (e) =>\n                    JSON.parse(e.data) as Message,\n            });\n\
  \            this.recipes$ = this.socket$.multiplex(\n                () => ({ subscribe:\
  \ 'recipes' }),\n                // 订阅消息\n                () => ({ unsubscribe:\
  \ 'recipes' }),\n                // 取消订阅消息\n                (message) => message.type\
  \ === 'recipes'\n                // 过滤函数\n            );\n        }\n    }\n   \
  \ close() {\n        this.socket$.complete();\n    }\n}\n```\n\n成功连接到套接字并获得解析 TCP\
  \ 连接传输的消息后，我们可以订阅特定的主题通道，这在 WebSocket 术语中被称为“多路复用”（multiplex）。这通常是为了效率，减少建立和维护多个连接的开销，或者当限制限制了可能的连接数量时。在我们的案例中，我们对菜谱列表感兴趣，因此我们将订阅该通道。\n\
  \n客户端与服务器之间通过 WebSocket 连接进行通信的方法是实现 `sendMessage` 方法：\n\n```\nsendMessage(message:\
  \ Message) {\n    this.socket$.next(message);\n}\n```\n\n现在，回到我们的组件，我们可以发送一个类型为\
  \ `\"recipe\"` 的消息，这将为我们获取菜谱列表：\n\n```\nthis.recipesService.sendMessage({ type:\
  \ 'recipes' });\nthis.recipesSubscription = this.recipesService.recipes$.subscribe(\n\
  \    (message: Message) => this.recipes = message.payload);\n```\n\n在我们的浏览器中，当我们打开控制台时，我们可能会观察到来自\
  \ WebSocket 连接的入站消息：\n\n![图 1.14: WebSocket 连接](img/B09031_01_18.png)\n\n图 1.14:\
  \ WebSocket 连接\n\n### 第 2  – 实现 WebSocket 心跳\n\n当我们丢失与 WebSockets 的连接时，可以采用像处理 HTTP\
  \ 请求那样的类似的重试机制。然而，WebSocket 有一种众为人知的重试策略称为“心跳”（心 beat）。这是一种用于保持连接活跃并确保客户端和服务器仍然响应的机制。\n\
  \n在我们的 `recipe.service.ts` 中，在重试失败后，我们可以向服务器发送心跳：\n\n```\nthis.socket$\n    .pipe(\n\
  \        retry({\n            count: 1,\n            delay: (error, retryCount)\
  \ => {\n                console.log(`尝试 ${retryCount}:\n                    在 websocket\
  \ \n                    连接期间发生错误，正在重试...`\n            );\n        return of(error).pipe(delay(1000));\n\
  \        },\n    ),\n    catchError((err) => {\n        console.error('在 websocket\n\
  \                      连接期间发生错误:', err);\n        this.sendHeartbeat();\n      \
  \  return of(null);\n    })\n).subscribe();\n```\n\n这是 `sendHeartbeat` 方法背后的实现：\n\
  \n```\n sendHeartbeat() {\n    timer(0, 5000)\n    .pipe(\n        tap(() => this.sendMessage({\
  \ type: 'heartbeat' })),\n        switchMap(() =>\n            this.socket$.pipe(\n\
  \                filter((msg) => msg.type === 'heartbeat'),\n                timeout(5000\
  \ * 2),\n                // 为响应留出心跳间隔的两倍\n                // 时间\n              \
  \  catchError(() => {\n                    this._snackBar.open(\n              \
  \          '丢失与 WebSocket 连接',\n                        '关闭');\n               \
  \     this.close();\n                return EMPTY;\n                // 在关闭后返回 null\
  \ 以停止重试尝试\n                })\n            )\n        ),\n    ).subscribe();\n}\n\
  ```\n\n现在我们可以看到，每五秒我们将向服务器发送一次心跳消息，以检查我们是否能够重新建立连接。如果没有运气，我们最终会抛出一个错误并显示一个已丢失连接的错误通知。围绕时间间隔和重试策略的逻辑完全取决于特定的用例或个人偏好。此外，本章“处理网络错误”教程中用于构建\
  \ RxJS 健壮 Web 应用的相同韧性策略也可以应用于 WebSocket。\n\n## 另另\n\n*   WebSocket: [`rxjs.dev/api/webSocket`](https://rxjs.dev/api/webSocket)\n\
  \n\n\n我们的 `swipe-unlock.component.html` 文件必须包含以下滑动区域和所有手机按钮的标记：\n\n```html\n<div\
  \ #swipeArea class=\"swipe-area\">\n    <button #one class=\"number\">1</button>\n\
  \    <button #two class=\"number\">2</button>\n    <button #three class=\"number\"\
  >3</button>\n    <button #four class=\"number\">4</button>\n    <button #five class=\"\
  number\">5</button>\n    <button #six class=\"number\">6</button>\n    <button #seven\
  \ class=\"number\">7</button>\n    <button #eight class=\"number\">8</button>\n\
  \    <button #nine class=\"number\">9</button>\n    <button #zero class=\"number\"\
  >0</button>\n</div>\n```\n\n通过一点 CSS 魔法，我们就能在 UI 中看到该组件：\n\n![图 2.1: 手机滑动组件](img/B09031_02_01.png)\n\
  \n图 2.1: 手机滑动组件\n\n同时，在我们的 `swipe-unlock.component.ts` 文件中，我们可以引用数字键盘 UI 的各种元素，以便对在它们上执行的任何事件进行操作：\n\
  \n```typescript\n@ViewChild('swipeArea')\nswipeArea!: ElementRef;\n@ViewChildren('one,\
  \ two, three, four, five, six, seven,\n              eight, nine, zero')\nnumbers!:\
  \ QueryList<ElementRef>;\n```\n\n### 步骤 2 – 识别用户触摸事件\n\n我们感兴趣的用户触摸屏幕、移动（滑动）并抬起离开屏幕的事件。我们可以这样创建这些事件流：\n\
  \n```typescript\nconst touchStart$ = fromEvent<TouchEvent>(\n    this.swipeArea.nativeElement,\n\
  \    'touchstart'\n);\nconst touchMove$ = fromEvent<TouchEvent>(\n    this.swipeArea.nativeElement,\n\
  \    'touchmove'\n);\nconst touchEnd$ = fromEvent<TouchEvent>(\n    this.swipeArea.nativeElement,\n\
  \    'touchend'\n);\n```\n\n从这里，我们可以对这些事件做出响应，计算触摸事件的坐标，检查它是否与数字键盘区域交叉，并在 UI 中将其高亮：\n\
  \n```typescript\nconst swipe$ = touchStart$.pipe(\n    switchMap(() =>\n       \
  \ touchMove$.pipe(\n            takeUntil(touchEnd$),\n            map((touchMove)\
  \ => ({\n                x: touchMove.touches[0].clientX,\n                y: touchMove.touches[0].clientY,\n\
  \            }))\n        )\n    ),\n);\n```\n\n现在，当我们订阅这些滑动坐标时，我们可以按顺序执行所需的操作，例如选择数字键盘并创建点轨迹：\n\
  \n```typescript\nswipe$.pipe(\n    tap((dot) => this.selectNumber(dot)),\n    mergeMap((dot)\
  \ => this.createTrailDot(dot)),\n).subscribe();\n```\n\n### 步骤 3 – 标记选中的数字键盘\n\n\
  在获取每次滑动的坐标后，我们可以轻松地检查它是否与数字键盘周围的区域交叉：\n\n```typescript\nprivate selectNumber(dot:\
  \ PixelCoordinates): void {\n    this.numbersElement.forEach((number) => {\n   \
  \     if (\n        dot.y > number.getBoundingClientRect().top &&\n        dot.y\
  \ < number.getBoundingClientRect().bottom &&\n        dot.x > number.getBoundingClientRect().left\
  \ &&\n        dot.x < number.getBoundingClientRect().right\n      ) {\n        \
  \    number.classList.add('selected');\n            this.patternAttempt.push(parseInt(\n\
  \                number.innerText)  \n            );\n        }\n    });\n}\n```\n\
  \n通过为每个交叉的元素添加 `selected` 类，我们可以视觉化地表示选中的数字键盘：\n\n![图 2.2: 标记选中的数字键盘](img/B09031_02_02.png)\n\
  \n图 2.2: 标记选中的数字键盘\n\n### 步骤 4 – 创建轨迹\n\n借助 `mergeMap` 操作符的帮助，我们可以汇集所有的滑动事件及其坐标，在\
  \ DOM 中创建一个代表用户操作轨迹的点，并在一定的延迟后从 DOM 中移除该轨迹。此外，一个很好的性能考虑因素是将许多个滑动事件分组到一个缓冲区中。我们可以通过使用\
  \ `bufferCount` 来做到这一点，该操作符帮助我们确保最佳的内存使用和计算效率：\n\n```typescript\nprivate createTrailDot(\n\
  \    dotCoordinates: PixelCoordinates\n): Observable<string[]> {\n    const dot\
  \ = document.createElement('div');\n    dot.classList.add('trail-dot');\n    dot.style.left\
  \ = `${dotCoordinates.x}px`;\n    dot.style.top = `${dotCoordinates.y}px`;\n   \
  \ this.swipeArea.nativeElement.appendChild(dot);\n    return of('').pipe(\n    \
  \    delay(1000),\n        bufferCount(100, 50),\n        finalize(() => dot.remove())\n\
  \    );\n}\n```\n\n现在，在浏览器的开发工具中，我们可以通过 DOM 来检查轨迹的创建：\n\n![图 2.3: 滑动轨迹](img/B09031_02_03.png)\n\
  \n图 2.3: 滑动轨迹\n\n### 步骤 5 – 检查结果\n\n最后，在 `showMessage` 方法流的末尾，我们必须检查填充了每个选中数字键盘的\
  \ `patternAttempt` 数组是否匹配我们的解锁手机模式（即 1 2 3）。\n\n\n\n\n*   `merge` 操作符：[`rxjs.dev/api/operators/merge`](https://rxjs.dev/api/operators/merge)\n\
  \n# 使用渐进式图像无缝加载图片\n\n在现代 Web 中，我们必须处理大小达 MB 级的资源。图片就是其中之一。大图片由于加载时间长会损害性能，这可能导致糟糕的用户体验和挫败感。为了解决这些问题，常用的模式之一是\
  \ `LowQualityImagePlaceholder` 模式，也称为“渐进式图像”（Progressive Image），即分阶段加载图片。首先，我们显示图片的轻量级版本（占位图）。然后在后台，加载原始图片。\n\
  \n## 如何实现……\n\n在本教程中，我们将学习如何借助 RxJS 的魔法轻松地处理渐进式图像模式。\n\n### 步骤 1 – 定义图像源\n\n在 `pro-img.component.ts`\
  \ 文件中，我们必须定义本地图片的路径，以及来自 `assets` 文件夹中相同图片的占位/模糊版本路径：\n\n```\nsrc = 'image.jpg';\n\
  placeholderSrc = 'blurry-image.jpeg';\nconst img = new Image();\nimg.src = this.src;\n\
  const placeholderImg = new Image();\nplaceholderImg.src = this.placeholderSrc;\n\
  ```\n\n### 步骤 2 – 创建进度流\n\n在图片加载期间，每隔 100 毫秒增加一次进度百分比，直到触发 `load` 事件。这表示图片已完全加载。如果发生错误，我们将进度设置为\
  \ `–1`：\n\n```\nconst loadProgress$ = timer(0, 100);\nconst loadComplete$ = fromEvent(img,\
  \ 'load')\n    .pipe(map(() => 100));\nconst loadError$ = fromEvent(img, 'error')\n\
  \    .pipe(map(() => -1));\n```\n\n现在，我们可以合并这些加载事件并将它们流向渐进式图像加载中：\n\n```\nloadingProgress$\
  \ = new BehaviorSubject<number>(0);\nthis.imageSrc$ = merge(loadProgress$, loadComplete$,loadError$).pipe(\n\
  \    tap((progress) => this.loadingProgress$.next(progress)),\n    map((progress)\
  \ => (progress === 100 ?img.src :placeholderImg.src)),\n    startWith(placeholderImg.src),\n\
  \    takeWhile((src) => src === placeholderImg.src, true),\n    catchError(() =>\
  \ of(placeholderImg.src)),\n    shareReplay({ bufferSize: 1, refCount: true })\n\
  );\n```\n\n我们对占位图使用 `startWith` 并在 UI 中立即显示它，同时此持续跟踪原始图片的加载进度。一旦达到 100%，我们将用原始图片替换占位图的源。\n\
  \n### 步骤 3 – 在模板中订阅图像流\n\n同时，在组件模板 `pro-img.component.html` 中，我们可以订阅图片在后台加载时已产生的进度：\n\
  \n```\n<div class=\"pro-img-container\">\n    @if ((loadingProgress$ | async) !==\
  \ 100) {\n        <div class=\"progress\">\n        {{ loadingProgress$ | async\
  \ }}%\n        </>\n    }\n    <img\n    [src]=\"imageSrc$ | async\"\n    alt=\"\
  Progressive image\"\n    class=\"pro-img\"\n    >\n</>\n```\n\n最后，如果我们打开浏览器，可能会看到这种行为生效：\n\
  \n![图 2.5: 渐进式图像](img/B09031_02_05.png)![图 2.5: 渐进式图像](img/B09031_02_06.png)\n\n\
  图 2.5：渐进式图像\n\n## 事项\n\n在本教程中，为了简单起见，我们选择了人为增加图片的下载进度。明显的缺点是我们无法获得图片的实际下载进度。有一种方法可以这种效果：通过将图片请求的\
  \ `responseType` 转换为 `blob`。更多详情请参考：[`stackoverflow.com/questions/14218607/javascript-loading-progress-of-an-image`](https://stackoverflow.com/questions/14218607/javascript-loading-progress-of-an-image)。\n\
  \n## 延伸阅读\n\n*   Harry Roberts 写的 *The Ultimate LQIP Technique*：[`csswizardry.com/2023/09/the-ultimate-lqip-lcp-technique/`](https://csswizardry.com/2023/09/the-ultimate-lqip-lcp-technique/)\n\
  \n*   HTML `load` 事件：https://developer.mozilla.org/en-US/docs/Web/API/Window/load_event\n\
  \n*   `takeWhile` 操作符：https://rxjs.dev/api/operators/takeWhile\n\n*   `startWith`\
  \ 操作符：https://rxjs.dev/api/operators/startWith\n\n\n\n\n\n-   Angular Material 标签页组件：https://material.angular.io/components/tabs/overview\n\
  \n# 响应拖放事件\n\n对于 Web 开发者来说，为文件上传创建一个拖放组件是一项非常常见的任务。如果你曾经开发过此类组件，你可能已经知道这并不是一项简单的任务，而且这类组件背后隐藏着许多许多的复杂性。幸运的是，我们有\
  \ `RxJS` 来帮助我们以响应式和声明式的方式简化响应拖放事件的体验。\n\n## 准备工作\n\n在本食谱中，为了提供对图片上传进度的支持，我们需要运行一个位于\
  \ `server` 文件夹中的小型 Node.js 服务器应用程序。我们可以通过使用以下命令运行该服务器程序：\n\n```\nnode index.js\n\
  ```\n\n之后，我们就可以进入 `client` 文件夹并深入研究响应式拖放组件了。\n\n## 如何实现……\n\n在本食谱中，我们将为 `.png` 图片定义一个拖放区域。然后，我们将添加对同时进行多个上传的支持，显示每个图片的上传进度，并在图片格式不正确时显示错误信息。我们还将实现一种重试机制，以防网络文件上传失败。\n\
  \n### 步骤 1 – 定义放置区域\n\n在我们的 `dnd-file-upload.component.html` 文件中，我们必须为放置区域放置标记语言：\n\
  \n```\n<div #dropzoneElement class=\"drop-zone-element\">\n    <p>将 png 图片拖入下方区域</p>\n\
  </</div>\n```\n\n在使用 `@ViewChild()` 获取 `dropzoneElement` 引用后，我们可以开始响应放置区域内的拖放事件：\n\
  \n```\n@ViewChild('dropzoneElement') dropzoneElement!: ElementRef;\nngAfterViewInit():\
  \ void {\n    const dropzone = this.dropzoneElement.nativeElement;\n    const dragenter$\
  \ = fromEvent<DragEvent>(\n        dropzone,\n        'dragenter'\n    );\n    const\
  \ dragover$ = fromEvent<DragEvent>(\n        dropzone,\n        'dragover'\n   \
  \ ).pipe(\n        tap((event: DragEvent) => {\n            event.preventDefault();\n\
  \            event.dataTransfer!.dropEffect = 'copy';\n            (event.target\
  \ as Element).classList.add('dragover');\n        })\n    );\n    const dragleave$\
  \ = fromEvent<DragEvent>(\n        dropzone,\n        'dragleave'\n    ).pipe(\n\
  \        tap((event: DragEvent) => {\n            (event.target as Element).classList.remove('dragover');\n\
  \        })\n    );\n    const drop$ = fromEvent<DragEvent>(\n        dropzone,\n\
  \        'drop'\n    ).pipe(\n        tap((event: DragEvent) => {\n            (event.target\
  \ as Element).classList.remove('dragover');\n        })\n    );\n    const droppable$\
  \ = merge(\n        dragenter$.pipe(map(() => true)),\n        dragover$.pipe(map(()\
  \ => true)),\n        dragleave$.pipe(map(() => false))\n    );\n}\n```\n\n在创建这些事件时，我们可以跟踪文件何时进入放置区域何时离开。基于此，我们可以通过添加相应的类来为组件设置样式。我们还定义了所有的放置事件，以便我们知道何时停止响应正在拖过的新图片流。\n\
  \n### 步骤 2 – 验证文件\n\n现在，我们可以挂钩到放置事件流并验证每张图片的格式；如果格式正确，我们就可以将每张图片上传到后端 API：\n\n```\n\
  drop$.pipe(\n    tap((event) => event.preventDefault()),\n    switchMap((event:\
  \ DragEvent) => {\n        const files$ = from(Array.from(\n            event.dataTransfer!.files));\n\
  \        return this.fileUploadService.validateFiles$(\n            files$);\n \
  \   }),\n  ...流的剩余部分\n```\n\n回到我们的 `FileUploadService` 服务中，我们有一个验证方法来检查我们是否上传了 `.png`\
  \ 图片：\n\n```\nvalidateFiles$(files: Observable<File>): Observable<{\n    valid:\
  \ boolean,\n    file: FileWithProgress\n}> {\n    return files.pipe(\n        map((file\
  \ File) => {\n            const newFile: FileWithProgress = new File(\n        \
  \        [file],\n                file.name,\n                { type: file.type\
  \ }\n            );\n            if (file.type === 'image/png') {\n            \
  \    newFile.progress = 0;\n            } else {\n                newFile.error\
  \ = 'Invalid file type';\n            }\n        return newFile;\n        }),\n\
  \        map((file: FileWithProgress) => {\n            return of({\n          \
  \      valid: !file.error,\n                file\n            });\n        }),\n\
  \        mergeAll()\n    );\n}\n```\n\n在这里，我们检查文件类型。如果是预期的类型，我们将进度设置为 `0` 并开始上传。否则，我们为该特定的文件上传设置错误消息。\n\
  \n### 步骤 3 – 上传文件并跟踪进度\n\n一旦我们验证了每个文件，就可以开始将它们上传到后端：\n\n```\ndrop$.pipe(\n    //\
  \ 步骤 1 中的验证步骤\n    map((file: FileWithProgress) =>\n        this.fileUploadService.handleFileValidation(file))\n\
  ```\n\n```\ndrop$.pipe(\n    // 步骤 1 中的验证步骤\n    map((file: FileWithProgress) =>\n\
  \        this.fileUploadService.handleFileValidation(file))\n```\n*（等待，提供的源文本在后半部分似乎是碎片化的/被中断的。我将根据提供的代码片段清理逻辑，同时保持内容不变。）*\n\
  \n*自我纠正：为步骤 3/4 提供的文本包含重复/看起来损坏的片段。我将完全按照提供的格式进行格式化，但应用 Markdown 规则。*\n\n一旦我们验证了每个文件，就可以开始将它们上传到后端：\n\
  ...\n如果它是有效文件，我们就启动向我们的 API 发起上传。在 Angular 中，如果我们想跟踪请求的实际进度，我们必须做几件事：\n1. 我们需要将请求负载作为\
  \ `FormData` 发送。\n2. 我们需要将 `responseType` 设置为 `'blob'`。\n3. 我们需要将 `reportProgress`\
  \ 标记设置为 `true`。\n\n在应用这些步骤后，我们的 `uploadFiles$` 方法看起来如下：\n\n```\nuploadFiles$(file:\
  \ File): Observable<number> {\n    const formData = new FormData();\n    formData.append('upload',\
  \ file);\n    const req = new HttpRequest(\n        'POST', '/api/upload', formData,\
  \ {\n            reportProgress: true,\n            responseType: 'blob'\n     \
  \   }\n    );\n    return this.httpClient.request(req).pipe(\n        map((event:\
  \ HttpEvent<Blob>) =>\n            getFileUploadProgress(event)),\n        filter(progress\
  \ => progress < 100),\n    );\n}\n```\n\n现在，当我们发送此请求时，我们将获得一系列可以响应的 HTTP 事件。如果我们检查\
  \ `getFileUploadProgress` 方法，我们将看到它的运行：\n\n```\ngetFileUploadProgress(event: HttpEvent<Blob>):\
  \ number {\n    const { type } = event;\n    if (type === HttpEventType.Sent) {\n\
  \        return 0;\n    }\n    if (type === HttpEventType.UploadProgress) {\n  \
  \      const percentDone = Math.round(\n            100 * event.loaded / event.total!);\n\
  \        return percentDone;\n    }\n    if (type === HttpEventType.Response) {\n\
  \        return 100;\n    }\n    return 0;\n}\n```\n\n通过这种方法，由于 `UploadProgress`\
  \ 事件，我们知道文件上传的准确进度。\n\n最后，我们可以从服务调用 `uploadFileWithProgress$` 方法，并返回每个带有对应文件进度信息的每个文件：\n\
  \n```\nuploadFileWithProgress$(file: FileWithProgress): Observable<FileWithProgress>\
  \ {\n    return this.uploadFile$(file).pipe(\n        map((progress: number) =>\n\
  \            this.createFileWithProgress(file, progress)),\n        endWith(this.createFileWithProgress(file,\
  \ 100))\n    );\n}\n```\n\n在发射进度值后，我们将返回带有其进度附加信息的文件，以便在 UI 中显示它。\n\n\n\n\n\n最后，一旦我们在组件内部订阅了整个文件上传事件流，我们就可以显示所有正在上传的文件列表，并带有相应的进度条。这还允许我们在发生错误时显示错误消息：\n\
  \n```\ndrop$.pipe(\n    // 步骤 1 中的验证步骤\n    // 步骤 2 中的文件上传步骤\n).subscribe({\n  \
  \  next: (file) => {\n        if (file.valid) {\n            this.validFiles.set(file.name,\
  \ file);\n            return;\n        }\n        if (!file.valid) {\n         \
  \   this._snackBar.open(\n                '文件上传无效。',\n                '关闭',\n  \
  \          {}\n            );\n        }\n    }\n});\n```\n\n当我们打开浏览器并拖入多个有效的 `.png`\
  \ 图像时，我们可以并发处理这些上传并观察它们的进度：\n\n![图 2.8: 响应式拖放文件上传](img/B09031_02_10.png)\n\n图 2.8:\
  \ 响应式拖放文件上传\n\n### 步骤 5 – 处理文件上传错误\n\n想象一下，在我们上传图像的过程中，网络中断了。此类组件的关键方面之一是它必须对这类错误具有鲁棒性，并提供恢复或重试机制。我们可以通过在文件上传流中捕获该网络错误，并在\
  \ UI 中失败的上传旁边显示重试按钮来实现。我们可以通过添加错误捕获机制来扩展服务方法：\n\n```\nuploadFileWithProgress$(file:\
  \ FileWithProgress): Observable<FileWithProgress> {\n    return this.uploadFile$(file).pipe(\n\
  \        map((progress: number) =>\n            this.createFileWithProgress(file,\
  \ progress)),\n        endWith(this.createFileWithProgress(file, 100)),\n      \
  \  catchError(() => {\n            const newFile: FileWithProgress =\n         \
  \       this.createFileWithProgress(\n                    file,\n              \
  \      -1,\n                    '上传失败'\n                );\n            return of(newFile);\n\
  \        })\n    );\n}\n```\n\n回到我们的组件模板 `dnd-file-upload.component.html` 中，如果文件的上传进度为\
  \ `–1`（意味着之前失败了），我们可以添加一个重试按钮：\n\n```\n@if (file.value.progress !== -1) {\n    {{\
  \ file.value.progress }}%\n} @else {\n    <button\n        mat-icon-button\n   \
  \     (click)=\"retryUpload(file.value)\"\n        >\n        <mat-icon aria-hidden=\"\
  false\" fontIcon=\"redo\">\n        </mat-icon>\n    </button>\n}\nretryUpload(file:\
  \ FileWithProgress): void {\n    this.recipeService.uploadFileWithProgress$(\n \
  \       file).subscribe({ next: (file: FileWithProgress) =>\n            this.validFiles.set(file.name,\
  \ file),\n        error: (err) => console.error(err),\n        });\n}\n```\n\n如果打开打开浏览器，且发生了了上传错误，我们可能会在\
  \ UI 中注意到重试按钮。如果网络恢复，我们可以为失败的上传触发另一个上传请求：\n\n![图 2.9: 文件上传重试](img/B09031_02_11.png)\n\
  \n图 2.9: 文件上传重试\n\n## 另请\n\n- HTML `input` 文件: [`developer.mozilla.org/en-US/docs/Web/HTML/Element/input/file`](https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input/file)\n\
  - `interval` 函数: https://rxjs.dev/api/index/function/interval\n- `repeat` 操作符: https://rxjs.dev/api/operators/repeat\n\
  - `scan` 操作符: https://rxjs.dev/api/operators/scan\n- `finalize` 操作符: https://rxjs.dev/api/operators/finalize\n\
  - `merge` 操作符: https://rxjs.dev/api/operators/merge\n- `mergeAll` 操作符: https://rxjs.dev/api/operators/mergeAll\n\
  - `endWith` 操作符: https://rxjs.dev/api/operators/endWith\n\n# 使用灵活的 RxJS 控制构建你的完美音频播放器\n\
  \n每个人都喜欢音乐。无论你是使用 Spotify、Deezer、YouTube 还是其他平台来听你喜爱的单曲，使用复杂的音频播放器控制你的播放列表都是提供卓越用户体验的基本条件之一。在本食谱中，我们将创建一个轻量级的\
  \ RxJS 音频播放器，具有响应式控制功能，用于播放和暂停歌曲、控制音量，以及跳到播放列表中的下一首歌。\n\n## 如何实现……\n\n在本食谱中需要理解的关键是\
  \ `native HTMLAudioElement`，并据此判断哪些事件是响应时是最重要的。\n\n### 步骤 1 – 创建音频播放器事件\n\n在我们的\
  \ `audio-player.component.html` 文件中，我们必须为音频播放器实现标记：\n\n```\n<audio #audio></audio>\n\
  ```\n\n关于该音频 HTML 元素，在组件 `audio-player.component.ts` 文件中，我们将定义该元素的所有关键事件：\n\n```\n\
  @ViewChild('audio') audioElement!:\n    ElementRef<HTMLAudioElement>;\nngAfterViewInit():\
  \ void {\n    const audio = this.audioElement.nativeElement;\n    const duration$\
  \ = fromEvent(audio,  \n        'loadedmetadata').pipe(map(() => (\n           \
  \ { duration: audio.duration }))\n    );\n    const playPause$ = fromEvent(audio,\
  \ \n        'play').pipe(map(() => (\n            { isPlaying: true }))\n    );\n\
  \    const pause$ = fromEvent(audio, \n        'pause').pipe(map(() => (\n     \
  \       { isPlaying: false }))\n    );\n    const volumeChange$ = fromEvent(audio,\
  \ \n        'volumechange').pipe(map(() => (\n            { volume: audio.volume\
  \ }))\n    );\n    const time$ = fromEvent(audio, \n        'timeupdate').pipe(map(()\
  \ => (\n            { currentTime: audio.currentTime }))\n    );\n    const error$\
  \ = fromEvent(audio, \n        'error');\n\n    merge(\n        duration$,\n   \
  \     playPause$,\n        pause$,\n        volumeChange$,\n        time$,\n   \
  \     error$\n    ).subscribe(state => {\n        this.audioService.updateState(state);\n\
  \    });\n}\n```\n\n通过订阅音频元素的 `play`、`pause`、`volumechange`、`timeupdate` 以及 `error`\
  \ 事件，我们可以获取关于歌曲 `duration` 值的信息。\n\n### 步骤 2 – 管理歌曲状态\n\n在 `audio.service.ts` 文件中，我们将存储歌曲的状态：\n\
  \n```\npublic audioState$ = new BehaviorSubject<AudioState>({\n    isPlaying: false,\n\
  \    volume: 0.5,\n    currentTrackIndex: 0,\n    duration: 0,\n    tracks: []\n\
  });\n\nupdateState(state: Partial<AudioState>): void {\n    this.audioState$.next({\n\
  \        ...this.audioState$.value,\n        ...state\n    });\n}\n```\n\n现在，可以在组件中订阅状态变化并保持状态。\n\
  \n### 步骤 3 – 播放/暂停歌曲\n\n回到我们的 `audio-player.component.ts` 文件中，每当播放或暂停事件被触发时，状态就会更新，此时我们可以订阅状态变化：\n\
  \n```\nthis.audioService.audioState$.subscribe(({ isPlaying }) =>\n    this.isPlaying\
  \ = isPlaying;\n);\n```\n\n现在，在 `audio-player.component.html` 文件中，我们可以根据以下条件展示 `play`\
  \ 或 `pause` 图标：\n\n```\n<button mat-fab class=\"play-pause-btn\" (click)=\"playPause()\"\
  >\n    @if (isPlaying) {\n        <mat-icon>pause</mat-icon>\n    } @else {\n  \
  \      <mat-icon>play_arrow</mat-icon>\n    }\n</button>\n```\n\n我们也可以在播放歌曲时控制音频：\n\
  \n```\nplayPause(): void {\n    if (!this.isPlaying) {\n        this.audioElement.nativeElement.play();\n\
  \    } else {\n        this.audioElement.nativeElement.pause();\n    }\n}\n```\n\
  \n### 步骤 4 – 控制歌曲音量\n\n通过订阅音频播放器状态，我们还可以根据之前发布的 `volumechange` 事件获取音量信息：\n\n```js\n\
  this.audioService.audioState$.subscribe(({ volume }) => {\n    this.volume = volume;\n\
  });\n```\n\n我们可以像这样在 UI 中表示这种状态：\n\n```html\n<div class=\"volume\">\n    @if (volume\
  \ === 0) {\n        <mat-icon>volume_off</mat-icon>\n    } @else {\n        <mat-icon>volume_up</mat-icon>\n\
  \    }\n    <input\n        type=\"range\"\n        [value]=\"volume\"\n       \
  \ min=\"0\"\n        max=\"1\"\n        step=\"0.01\"   \n        (input)=\"changeVolume($event)\"\
  \n    />\n</div>\n```\n\n\n\n\n现在，我们可以通过调用 `changeVolume()` 方法改变音频播放器的音来发射相同的事件：\n\
  \n```\nchangeVolume({ target: { value } }): void {\n    this.audioElement.nativeElement.volume\
  \ = value;\n}\n```\n\n这将自动响应式地更新音频播放器元素上的 `volume` 状态。\n\n### 第 5  – 切换歌曲\n\n回到我们的\
  \ `audio.service.ts` 文件，我们已经实现了在歌曲列表列表中更改当前歌曲索引的方法：\n\n```\npreviousSong(): void\
  \ {\n    let prevIndex =\n        this.audioState$.value.currentTrackIndex - 1;\n\
  \    const tracks = this.audioState$.value.tracks;\n    if (prevIndex < 0) {\n \
  \       prevIndex = tracks.length - 1; // 回到到\n                                \
  \       // 最后\n    }\n    this.updateState({\n        isPlaying: false,\n      \
  \  currentTrackIndex: prevIndex\n    });\n}\nnextSong(): void {\n    let nextIndex\
  \ =\n        this.audioState$.value.currentTrackIndex + 1;\n    const tracks = this.audioState$.value.tracks;\n\
  \    if (nextIndex >= tracks.length) {\n        nextIndex = 0; // 回到开头\n    }\n\
  \    this.updateState({\n        isPlaying: false,\n        currentTrackIndex: nextIndex\n\
  \    });\n}\n```\n\n此外，当到达列表末尾时，我们将循环到播放列表的开头。\n\n在 `audio-player.component.ts`\
  \ 组件中，我们可以订阅此状态变化并使用音频元素更改歌曲：\n\n```\nthis.audioService.audioState$.subscribe(({\n\
  \    currentTrackIndex,\n    tracks\n}) => {\n    if (\n        tracks[currentTrackIndex].title\
  \ !==\n            this.currentTrack.title\n    ) {\n        this.audioElement.nativeElement.src\
  \ =\n            tracks[currentTrackIndex].song;\n        this.currentTrack = tracks[currentTrackIndex];\n\
  \    }\n});\n```\n\n这意味着我们拥有了关于当前歌曲的所有信息，这意味着我们可以在我们的 `audio-player.component.html`\
  \ 模板中显示这些数据。\n\n### 第 6  – 跳到歌曲的中间\n\n在我们的音频元素中，有一个 `timeupdate` 事件，让我们能够跟踪并更新歌曲的当前时间：\n\
  \n```\nconst time$ = fromEvent(audio, 'timeupdate').pipe(\n    map(() => ({ time:\
  \ audio.currentTime }))\n);\ntime$.subscribe(({ time }) => this.currentTime = time);\n\
  ```\n\n在 UI 中，我们可以将此当前时间信息与之前的歌曲元数据结合，将其显示在滑块中，并观察歌曲进度：\n\n```\n<p>{{ currentTime\
  \ | time }}</p>\n<audio #audio></audio>\n<mat-slider [max]=\"duration\" class=\"\
  song\">\n    <input matSliderThumb\n    [value]=\"currentTime\"\n    (dragEnd)=\"\
  skip($event)\"\n    >\n</mat-slider>\n<p>{{ duration | time }}</p>\n```\n\n最后，如果打开浏览器，我们可以检查所有这些功能并播放我们喜爱的音乐：\n\
