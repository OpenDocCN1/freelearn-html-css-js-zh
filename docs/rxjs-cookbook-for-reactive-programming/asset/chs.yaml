  *   The `share` 操作符: [`rxjs.dev/api/index/function/share`](https://rxjs.dev/api/index/function/share)\n\
  *   The `exhaustMap` 操作符: [`rxjs.dev/api/operators/exhaustMap`](https://rxjs.dev/api/operators/exhaustMap)\n\
  *   The `switchMap` 操作符: [`rxjs.dev/api/operators/switchMap`](https://rxjs.dev/api/operators/switchMap)\n\
