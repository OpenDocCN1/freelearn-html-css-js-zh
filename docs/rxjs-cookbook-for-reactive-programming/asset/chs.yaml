  \ RxJS 操作符的实时用法，然后我们学习了动画、测试以及如何使用 `RxJS` 提高性能。\n\n我很喜欢书中对状态管理主题的涵盖方式。`NgRx` 是一种广泛采用的状态管理解决方案，但理解我们如何使用\
  \ `RxJS` 实现它也很重要，本书很好地涵盖了这部分内容。\n\n在书的最后部分，涵盖了使用 `RxJS` 进行实时通信，这正是 `RxJS` 发挥优势的地方。它还演示了如何通过构建微服务来有效地结合\
  \ `RxJS` 和 `NestJS`。\n\nSantosh Yadav\nAngular Google 专家 | GitHub Star | Nx 冠军 |\
