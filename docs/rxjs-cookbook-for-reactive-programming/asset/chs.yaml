  \n# 实现乐观更新模式\n\n`乐观更新模式`（optimistic update pattern）是一种用户界面设计策略，通过立即反映用户所做的更改（即使这些更改尚未被服务器确认）来增强用户体验。这种方法创建了一种响应和流畅的感觉，减少了对延迟的感知并提升了整体用户满意度。这种模式非常有用，特别是在我们处于离线状态时。\n\
  \n## 如何实现……\n\n在本教程中，我们将实现一个名为 `optimisticUpdate` 的自定义操作符，它将处理 `POST` 请求，方式是立即向用户显示结果，然后在后台继续网络请求。如果我们离线状态且请求失败，我们将在一段时间后进行重试。如果请求第二次失败，我们将提供一个回滚选项，在大多数情况下，这将是从列表中移除我们乐观添加的条目。\n\
  \n### 步骤 1 – 创建自定义操作符\n\n在我们的 `operators/optimistic-update.operator.ts` 文件中，我们将放置用于处理乐观\
  \ `POST` 请求的自定义 RxJS 操作符：\n\n```\nimport { Observable, concat, of, throwError }\
  \ from 'rxjs';\nimport { catchError, ignoreElements, retry } from 'rxjs/operators';\n\
  export function optimisticUpdate<T, E = any>(\n  originalValue: T,\n  rollback:\
  \ (value: T, error: E) => void,\n  retryConfig: { count: number, delay: number }\
  \ =\n    { count: 1, delay: 3000 }\n): (source: Observable<T>) => Observable<T>\
  \ {\n  return (source: Observable<T>) => {\n    return concat(\n      of(originalValue),\n\
  \      source.pipe(\n        ignoreElements(),\n        retry(retryConfig),\n  \
  \      catchError((error) => {\n          rollback(originalValue, error);\n    \
  \      return throwError(() => error);\n        })\n      )\n    );\n  };\n} \n\
  ```\n\n让我们分解一下我们在这里的操作：\n\n1.  首先，作为操作符参数，我们提供了一个即将发送到后端的食谱对象以及一个回滚函数（如果请求失败我们该做什么）。\n\
  2.  然后，通过 `concat` 操作符，我们合并了两个应该按顺序执行的流：一个流是我们要发布的原始对象值的乐观原始值，另一个流是向后端的实际请求。\n3.\
  \  我们立即将原始对象值的原始值作为第一个发射值返回，并在 UI 中乐观地显示该食谱。\n4.  之后，我们开始处理正在进行的请求。在请求失败的情况下，我们根据需要定义了重试机制：在这种情况下，我们将在三秒内重试一次。\n\
  5.  如果我们离线且请求失败，那么我们就会捕获该错误并提供回滚选项。\n\n### 步骤 2 – 应用乐观更新操作符\n\n在 `recipes.service.ts`\
  \ 中，我们有一个用于发布新食谱的 `postRecipe` 方法：\n\n```\npublic recipes$ = new Subject<Recipe\
  \ | Error>();\npostRecipe(): void {\n  this.http.post<Recipe>('/api/recipes', this.recipe).pipe(\n\
  \    optimisticUpdate(\n      this.recipe,\n      (originalItem: Recipe, error:\
  \ Error) => {\n        // 在此处回滚 UI \n        this.recipes$.next(error);\n      }\n\
  \    ),\n    filter((recipe) => !!recipe)\n  ).subscribe(\n    (recipe: Recipe)\
  \ => this.recipes$.next(recipe)\n  );\n}\n```\n\n在这里，我们可以看到在调用 `postRecipe` 方法时，我们立即将新的潜在食谱值放入\
  \ `Subject` 中。如果发生错误，我们有一个回滚选项来显示错误消息。\n\n\n\n\n\n我们生活在一个数据的世界，通过在系统内部实现数据可视化并启用交互与探索，我们让用户更深入地理解复杂数据集。实现这一目标的方法之一是使用图表。图表能够帮助用户发现数据中隐藏模式和洞察。\n\
  \n## 如何实现……\n\n在本教程中，我们将通过订阅 `WebSocket` 连接来可视化全年食谱订单，并在数据到达时观察实时变化。\n\n### Step\
  \ 1 – 连接到 RxJS WebSocket\n\n在我们的 `RecipesService` 类中，我们将建立与 `WebSocket` 的连接，并为可以订阅的订单数据开启主题：\n\
  \n```\nimport { webSocket, WebSocketSubject } from ‘rxjs/webSocket’;\nexport class\
  \ RecipesService {\n  private socket$!: WebSocketSubject<Message>;\n  public orders$!:\
  \ Observable<Message>;\n  constructor() {}\n  connect() {\n    if (!this.socket$\
  \ || this.socket$.closed) {\n      this.socket$ = webSocket<Message>({\n       \
  \ url: environment.wsEndpoint,\n        deserializer: (e) => JSON.parse(e.data)\
  \ as Message,\n      });\n      this.orders$ = this.socket$.multiplex(\n       \
  \ () => ({ subscribe: ‘orders’ }),\n        () => ({ unsubscribe: ‘orders’ }),\n\
  \        (message) => message.type === ‘orders’\n      );\n    }\n  }\n}\n```\n\n\
  ### Step 2 – 连接丢失后重新连接到 WebSocket\n\n在成功建立 `WebSocket` 的连接后，我们必须考虑连接丢失或出现服务器问题的情况。这在实时应用中对于维护数据流的可靠性以及构建韧性的\
  \ `WebSocket` 连接至关重要。\n\n在 `operators/retry-connection.ts` 中，我们定义了一个自定义的 RxJS 操作符来处理这些恢复性场景：\n\
  \n```\nimport { catchError, Observable, of, OperatorFunction, retry, timer } from\
  \ ‘rxjs’;\ntype TRetryOptions = {\n    count: number;\n    delayTime: number;\n\
  }\ntype TMessage = {\n    type: string;\n    payload?: unknown;\n}\nexport function\
  \ retryConnection<T>({ count, delayTime }: TRetryOptions): OperatorFunction<T, T\
  \ | TMessage> {\n  return (source: Observable<T>) =>\n    source.pipe(\n      retry({\n\
  \        count,\n        delay: (err, retryAttempt) => {\n            console.error(‘Socket\
  \ connection failed:’, err);\n            return timer(retryAttempt * delayTime);\n\
  \        },\n      }),\n      catchError((err: Error) => {\n        console.error(‘Socket\
  \ connection failed:’, err);\n        return of({ type: ‘error’, payload: err }\
  \ as TMessage);\n      })\n    );\n}\n```\n\n现在我们可以管道到 `orders$` `WebSocket` 流并应用\
  \ `retryConnection` 操作符：\n\n```\nthis.orders$ = this.socket$.multiplex(\n  () =>\
  \ ({ subscribe: ‘orders’ }), // 订阅消息\n  () => ({ unsubscribe: ‘orders’ }), // 取消订阅消息\n\
  \  (message) => message.type === ‘orders’ // 过滤函数\n).pipe(\n  retryConnection<Message>({\n\
  \    count: 5,\n    delayTime: 1000,\n  }),\n);\n```\n\n这将确保用户体验无中断的实时更新。\n\n###\
  \ Step 3 – 订阅 socket 数据并可视化数据\n\n回到我们的组件 `recipes-chart.component.ts`，借助 `ApexCharts`\
  \ 库，我们已经设置了组件以及为每年每月 12 个数据槽的配置。现在，唯一需要做的就是通过订阅服务中的 `orders$` `Observable` 为组件提供数据：\n\
  \n```typescript\n@ViewChild(ChartComponent, { static: false }) chart!: ChartComponent;\n\
  ngOnInit() {\n  this.recipesService.connect();\n}\nngAfterViewInit(): void {\n \
  \ this.recipesService.orders$.subscribe((message: Message) => {\n    this.orders\
  \ = [...this.orders, ...message.payload];\n    this.chart.updateSeries([{\n    \
  \  name: ‘Orders’,\n      data: this.orders,\n    }]);\n  });\n}\nngOnDestroy()\
  \ {\n  this.recipesService.close();\n}\n```\n\n最后，如果我们打开浏览器，就可以观察所有通过 socket 到送的数据。\n\
  \n![](img/B09031_10_1.png)![图 9.1: 实时 RxJS 图表](img/B09031_10_2.png)[](Images/B09031_10_3.png)\n\
  \n图 9.1: 实时 RxJS 图表\n\n## 另见……\n\n*   `ApexCharts` 库：[`apexcharts.com/`](https://apexcharts.com/)\n\
  \n*   `WebSocket` 函数：[`rxjs.dev/api/webSocket/webSocket`](https://rxjs.dev/api/webSocket/webSocket)\n\
  \n# 构建现代聊天应用程序\n\n在当今世界，聊天应用程序对于与同事、朋友和家人保持联系至关重要。它们彻底改变了人们联系的方式，促进了个人关系的发展并方便了专业环境下的高效协作。但精心构建此类实时应用具有挑战性，有很多需要考虑的事情，例如消息的准时送达、可靠性、处理回复、发送语音消息和图片等事件等。\n\
  \n## 如何实现……\n\n在本教程中，我们将构建一个极简版的 Instagram 聊天克隆。我们将能够使用此聊天与朋友通信，检查朋友是否正在输入以及检查朋友的在线状态。我们将使用\
  \ Angular 作为客户端。\n\n### Step 1 – 创建一个 NestJS WebSocket 网关\n\n在我们的服务器应用中，我们将利用 NestJS\
  \ 的网关功能来创建实时聊天。NestJS 开箱支持两个 WebSocket 平台：`socket.io` 和 `ws`。由于 RxJS WebSocket 是基于\
  \ `ws` 构建的，我们将使用后者。我们将安装 `ws` 平台的依赖项：\n\n```bash\nnpm i --save @nestjs/websockets\
  \ @nestjs/platform-ws\n```\n\n安装后，我们可以在应用程序启动时使用 WebSocket 适配器：\n\n```typescript\n\
  import { WsAdapter } from ‘@nestjs/platform-ws’;\nasync function bootstrap() {\n\
  \    const app = await NestFactory.create(AppModule);\n    app.useWebSocketAdapter(new\
  \ WsAdapter(app));\n    await app.listen(3000);\n}\nbootstrap();\n```\n\n现在我们准备好创建\
  \ WebSocket 网关了。当我们进入 `chat.gateway.ts` 时，我们可以看到如何处理新的传入连接：\n\n```typescript\nimport\
  \ {\n  ConnectedSocket,\n  OnGatewayConnection,\n  OnGatewayDisconnect,\n  WebSocketGateway,\n\
  \  WebSocketServer\n} from ‘@nestjs/websockets’;\nimport * as WebSocket from ‘ws’;\n\
  @WebSocketGateway(8080)\nexport class ChatGateway implements OnGatewayConnection,\
  \ OnGatewayDisconnect {\n  @WebSocketServer()\n  server: WebSocket.Server;\n  constructor(\n\
  \    private chatConnectionService: ChatConnectionService,\n    private chatService:\
  \ ChatService,\n  ) {}\n  handleConnection(@ConnectedSocket() client: WebSocket):\
  \ void {\n    this.chatConnectionService.handleClientConnection(client);\n  }\n\
  }\n```\n\n我们使用 `@WebSocketGateway` 装饰器表示 `ChatGateway` 类将在端口 `8080` 上处理 WebSocket\
  \ 连接。`ChatGateway` 类还实现了 `OnGatewayConnection` 接口，它提供了一个生命周期钩子，每当新客户端连接到我们的 WebSocket\
  \ 服务器时都会执行代码。通过 `@ConnectedSocket` 装饰器，我们可以获取客户端 socket。\n\n在 `chat-conection.service.ts`\
  \ 中，我们将处理 WebSocket 的新客户端连接和断开：\n\n\n\n\n\n```typescript\nimport { Injectable, OnModuleInit\
  \ } from '@nestjs/common’;\nimport { BehaviorSubject, tap } from ‘rxjs’;\nimport\
  \ * as WebSocket from ‘ws’;\nimport { Message } from '../chat.type’;\n@Injectable()\n\
  export class ChatConnectionService implements OnModuleInit {\n  private clients$\
  \ = new BehaviorSubject<WebSocket[]>([]);\n  private clientOneId = ‘b9ec382c-a624-40ba-9865-a81be0d390a8’;\n\
  \  private clientTwoId = ‘e1426280-0169-4647-b7d1-5e061a23a0d8’;\n  handleClientConnection(client:\
  \ WebSocket): void {\n    const clients = this.clients$.getValue();\n    if (clients.length\
  \ >= 2) {\n      // 聊天室只有 2 个人\n      client.close();\n      return;\n    }\n  \
  \  client.id = !clients.map((c: WebSocket) => c.id).includes(\n      this.clientOneId)\n\
  \      ? this.clientOneId\n      : this.clientTwoId;\n    this.clients$.next([...clients,\
  \ client]);\n  }\n  handleDisconnect(client: WebSocket): void {\n    const clients\
  \ = this.clients$.getValue();\n    this.clients$.next(clients.filter((c: WebSocket)\
  \ => \n      c.id !== client.id));\n  }\n}\n```\n\n在 `clients$` `BehaviorSubject`\
  \ 中，我们跟踪所有到 WebSocket 的客户端连接。每当有新连接建立时，我们都会检查是否已经有两个聊天参与者。否则，我们将为每个新客户端分配一个新的随机\
  \ ID，因为 `ws` 模块并没有具备跟踪客户端 ID 的原生方法。\n\n现在我们可以订阅并响应新的连接事件了：\n\n```typescript\nonModuleInit()\
  \ {\n  this.clients$\n    .pipe(\n      tap((clients: WebSocket[]) => {\n      \
  \  clients.forEach((client) => {\n          client.send(\n            JSON.stringify({\n\
  \              event: ‘connect’,\n              data: {\n                clientId:\
  \ client.id,\n                otherClientId:\n                  client.id === this.clientOneId\n\
  \                    ? this.clientTwoId\n                    : this.clientOneId,\n\
  \                },\n              }),\n            );\n          });\n        }),\n\
  \    )\n  .subscribe();\n}\n```\n\n通过这种方式，我们可以向所有客户端广播新事件 `connect`，其消息包含了有关该连接的信息。\n\
  \n### 步骤 2 – 从前端应用连接到 RxJS WebSocket\n\n在我们的 Angular 应用中，将有一个 `ChatService` 来处理\
  \ WebSocket 的连接逻辑：\n\n```typescript\nimport { Injectable } from ‘angular/core’;\n\
  import { Observable } from ‘rxjs’;\nimport { webSocket, WebSocketSubject } from\
  \ ‘rxjs/webSocket’;\nexport interface IWsMessage<T> {\n  event: string;\n  data?:\
  \ T;\n}\n@Injectable({\n  providedIn: ‘root’\n})\nexport class ChatService {\n \
  \ private socket$: WebSocketSubject<Message>;\n  public clientId$!: Observable<Message>;\n\
  \  constructor() {\n    this.connect();\n  }\n  connect() {\n    if (!this.socket$\
  \ || this.socket$.closed) {\n      this.socket$ = webSocket<IWsMessage<IMessage>>({\n\
  \        url: ‘ws://localhost:8080’,\n        deserializer: (e) => JSON.parse(e.data)\
  \ as IWsMessage<IMessage>,\n      });\n      this.clientConnection$ = this.socket$.multiplex(\n\
  \        () => ({ subscribe: ‘connect’ }),\n        () => ({ unsubscribe: ‘connect’\
  \ }),\n        (message) => message.event === ‘connect’\n      );\n  }\n```\n\n\
  最初，我们将建立 WebSocket 连接并订阅 `connect` 主题。在连接成功后，我们在这里可以获取所有关于正在进行的客户端连接的相关事件。\n\n###\
  \ 步骤 3 – 处理聊天主题消息\n\n当我们在聊天输入框中输入内容并点击发送按钮时，我们调用服务方法 `sendChatMessage()`：\n\n```typescript\n\
  sendChatMessage(message: string, clientId: string) {\nthis.socket$.next({\n  event:\
  \ ‘message’,\n  data: {\n    topic: ‘chat’,\n    message,\n    clientId\n  }});\n\
  }\n```\n\n通过这样做，我们正在向 WebSocket 发送一个 `message` 事件进行处理。回到我们后端的 `chat.gateway.ts`，我们可以通过定义一个新的事件处理器来订阅\
  \ `message` 事件：\n\n```typescript\nimport {\n  MessageBody,\n  SubscribeMessage,\n\
  } from ‘@nestjs/websockets’;\n@WebSocketGateway(8080, { pingTimeout: 2000 })\nexport\
  \ class ChatGateway implements OnGatewayConnection, OnGatewayDisconnect {\n  @SubscribeMessage(‘message’)\n\
  \  handleMessage(\n    @MessageBody() data: { topic: string; message: string;\n\
  \      clientId: string },\n  ): void {\n    const { topic, message, clientId }\
  \ = data;\n    this.chatService.sendTopicMessage(topic, {\n      id: crypto.randomUUID(),\n\
  \      message,\n      clientId,\n      timestamp: new Date(),\n    });\n  }\n}\n\
  ```\n\n通过 `@MessageBody` 装饰器，我们从客户端通过 socket 发送的数据（在我们的例中，就是聊天主题键）。\n\n每当有新消息时，我们都想将该消息发送到\
  \ `chat` 主题。我们需要为该主题创建一个响应式流，在 `chat.service.ts` 中如下：\n\n```typescript\ntopics:\
  \ {\n  [topicKey: string]: ReplaySubject<Message | { typing: string } | any>;\n\
  } = {\n  chat: new ReplaySubject(100),\n};\nonModuleInit() {\n  const chatTopic$\
  \ = this.topics[‘chat’].pipe(\n    shareReplay({ bufferSize: 1, refCount: true }),\n\
  \  );\n  const messages$ = chatTopic$.pipe(\n    filter((data: WsMessage<string>)\
  \ => ‘message’ in data),\n    scan((acc, message) => [...acc, message], []),\n \
  \   map((messages) => ({ event: ‘chat’, data: messages })),\n  );\n  messages$.subscribe(\n\
  \    (response: { event: string; data: Message[] }) => {\n      this.chatConnectionService.broadcastMessage(response);\n\
  \    },\n  );\n}\nsendTopicMessage(topic: string, message: Message | ChatEvent):\
  \ void {\n  if (this.topics[topic]) {\n    this.topics[topic].next(message);\n \
  \ }\n}\n```\n\n最初，我们将建立 WebSocket 连接并订阅 `connect` 主题。在连接成功后，我们在这里可以获取所有关于正在进行的客户端连接的相关事件。\n\
  \n聊天历史的最佳方式是使用 `ReplaySubject`，因为每个新连接都可以看到之前的事件。我们还可以利用 `shareReplay` 将聊天历史广播给所有客户端。现在我们可以向所有参与者广播。\n\
  \n### 步骤 4 – 处理用户输入的事件\n\n当用户在聊天中输入内容时，如果输入框中有内容，我们可以从前端应用发出输入事件：\n\n```typescript\n\
  sendIsTyping(clientId: string, isTyping: boolean = true) {\n  this.socket$.next({\
  \ event: ‘typing’, data: { topic: ‘chat’, clientId,\n    isTyping } });\n}\n```\n\
  \n现在我们需要在后端处理此事件：\n\n```typescript\n@SubscribeMessage(‘typing’)\nhandleTyping(\n\
  \  @MessageBody() data: { topic: string; clientId: string;\n    isTyping: boolean\
  \ },\n): void {\n  const { topic, isTyping, clientId } = data;\n  this.chatService.sendTopicMessage(topic,\
  \ {\n    clientId,\n    isTyping,\n  });\n}\n```\n\n由于我们正在向*步骤* *3* 中设置的相同主题发送新数据，我们的\
  \ `chat.service.ts` 生命周期周期钩子最终看起来如下：\n\n\n\n\n\n```\nonModuleInit() {\n  const chatTopic$\
  \ = this.topics[‘chat’].pipe(\n    shareReplay({ bufferSize: 1, refCount: true }),\n\
  \  );\n  const messages$ = chatTopic$.pipe(\n    filter((data: WsMessage<string>)\
  \ => ‘message’ in data),\n    scan((acc, message) => [...acc, message], []),\n \
  \   map((messages) => ({ event: ‘chat’, data: messages })),\n  );\n  const typing$\
  \ = chatTopic$.pipe(\n    filter((data: ChatEvent) => ‘isTyping’ in data),\n   \
  \ distinctUntilKeyChanged(‘isTyping’),\n    map(({ clientId, isTyping }: ChatEvent)\
  \ => ({\n      event: ‘chat’,\n      data: { clientId, isTyping },\n    })),\n \
  \ );\n  merge(messages$, typing$).subscribe(\n    (response: { event: string; data:\
  \ Message[] }) => {\n      this.latestMessages$.next(response.data);\n       this.chatConnectionService.broadcastMessage(response);\n\
  \    },\n  );\n}\n```\n\n与我们在 `step 3` 中做的不同之处在于，我们将 `typing$` 流与聊天消息合并了。现在，我们可以获取到另一个客户端何时开始打字的信息，并且可以将该信息显示在前端：\n\
  \n```\nisTyping = false;\nngOnInit(): void {\n  this.chatService.getChatSocket$().pipe(\n\
  \    filter(({ data }: IWsMessage<IChatEvent | IMessage[]>) => (\n    data as IChatEvent).clientId\
  \ !== this.clientId),\n  ).subscribe(({ data }) => {\n    if (‘isTyping’ in data)\
  \ {\n      this.isTyping = data.isTyping;\n      return;\n    }\n    this.messages\
  \ = data as IMessage[];\n  });\n}\n```\n\n现在，当我们并排打开两个浏览器并在其中一个应用程序中开始打字时，另一个客户端将看到第一个客户端开始打字。\n\
  \n![图 9.3: 用户正在输入事件](img/B09031_10_5.png)\n\n图 9.3：用户正在输入事件\n\n### 步骤 7 – 处理客户端断开\n\
  \n你可能已经注意到了每个聊天参与旁旁绿色在线指示器。但如果他们其中一人离开了聊天呢？那么我们预计该指示器会变为离线，对吧？\n\n为了实现这种效果，我们可以利用\
  \ NestJS 的 `OnGatewayDisconnect` 生命周期周期钩子：\n\n```\nhandleDisconnect(@ConnectedSocket()\
  \ client: WebSocket): void {\n  this.chatConnectionService.handleDisconnect(client);\n\
  }\n```\n\n每当客户端从 socket 断开连接时，我们可以调用 `chat-connection.service.ts` 中的 `handleDisconnect()`\
  \ 方法：\n\n```\nhandleDisconnect(client: WebSocket): void {\n  const clients = this.clients$.getValue();\n\
  \  this.clients$.next(clients.filter((c: WebSocket) => c.id !== client.id));\n}\n\
  ```\n\n在这里，我们只需过滤掉断开连接的客户端并通知 `clients$` `ReplaySubject` 这一变化。现在，我们可以通过 `isOnline`\
  \ 属性来扩展我们正在广播的消息：\n\n```\nclient.send(\n  JSON.stringify({\n    event: ‘connect`,\n\
  \    data: {\n      clientId: client.id,\n      otherClientId:\n        client.id\
  \ === this.clientOneId\n          ? this.clientTwoId\n          : this.clientOneId,\n\
  \      isOnline: clients.length === 2,\n      },\n    }),\n);\n```\n\n我们可以通过关闭其中一个客户端的窗口轻松测试此行为。\n\
  \n![图 9.4: 在线指示器](img/B09031_10_6.png)\n\n图 9.4：在线指示器\n\n### 步骤 8 – 处理 WebSocket\
  \ 断开\n\n在实时应用中，还有一个至关重要的用例用以维护数据流的可靠性，那就是 WebSocket 连接临时不可用的情况。\n\n在这一步中，我们将引入一种错误处理机制，在连接中断期间队列消息，并在连接重新建立后尝试重新发送它们。我们将使用\
  \ RxJS 的 `ReplaySubject` 来存储消息，并在再次建立连接后重放历史消息。\n\n回到 `chat.service.ts`，我们将扩展 `sendChatMessage()`\
  \ 方法来处理 socket 关闭的情况：\n\n```\nprivate socketOfflineMessages$ = new ReplaySubject<IWsMessage<IMessage>>(100);\n\
  sendChatMessage(message: string, clientId: string) {\n  if (this.socket$.closed)\
  \ {\n    this.socketOfflineMessages$.next({ event: ‘message’,\n      data: { topic:\
  \ ‘chat’, message, clientId }});\n    this.connect();\n  return;\n}\n  this.socket$.next({\
  \ event: ‘message’, data: { topic: ‘chat’, message,\n                     clientId\
  \ }});\n}\n```\n\n现在我们已经消息存储在 `socketOfflineMessages$` 中，我们可以在 `connect()` 方法中观察何时何时重新建立\
  \ WebSocket 连接：\n\n```\nthis.socket$ = webSocket<IWsMessage<IMessage>>({\n  url:\
  \ ‘ws://localhost:8080’,\n  deserializer: (e) => JSON.parse(e.data) as IWsMessage<IMessage>,\n\
  \  openObserver: {\n    next: () => {\n      this.socketOfflineMessages$.subscribe(\n\
  \        (message: IWsMessage<IMessage>) => {this.socketOfflineMessages$.subscribe(\n\
  \        );\n    },\n  },\n});\n```\n\n我们可以注意到 `webSocket` 函数接受 `openObserver` 作为配置的一部分。关于重连策略的更多信息，请参阅*实现实时数据*。\n\
  \n### 步骤 9 – 发送语音消息\n\n在客户端 `chat.service.ts` 中，我们将添加一个单独的方法 `sendVoiceMethod()`，它将在我们点击\
  \ UI 上的按钮时被调用：\n\n```\nconst constraints = { audio: true };\nconst audioChunks:\
  \ BlobPart[] = [];\nconst micRecording$ = from(navigator.mediaDevices.getUserMedia(constraints));\n\
  audioChunkEvent$ = micRecording$.pipe(\n  switchMap((stream: MediaStream) => {\n\
  \    const mediaRecorder = new MediaRecorder(stream);\n    mediaRecorder.start();\n\
  \    setTimeout(() => {\n      mediaRecorder.stop();\n    }, 5000); // 记录 5 秒\n\
  \    return merge(\n      fromEvent(mediaRecorder, ‘dataavailable’),\n      fromEvent(mediaRecorder,\
  \ ‘stop’),\n    );\n  })\n);\n```\n\n在这里，我们可以观察到我们正在使用 MediaDevices API，通过请求使用麦克风的权限来创建流\
  \ `micRecording$`。一旦我们在浏览器中允许麦克风权限，就可以从 `dataavailable` 和 `stop` 事件创建事件流：\n\n```\n\
  return audioChunkEvent$.pipe(\n  map((audioEvent: BlobEvent | Event) => {\n    if\
  \ (‘data’ in audioEvent) {\n      audioChunks.push(audioEvent.data);\n      return\
  \ EMPTY;\n    }\n    const audioBlob = new Blob(audioChunks, { type: ‘audio/wav’\
  \ });\n    const reader = new FileReader();\n    reader.readAsDataURL(audioBlob);\n\
  \    return fromEvent<BlobEvent>(reader, ‘loadend’);\n  }),\n  switchAll(),\n  tap((progressEvent:\
  \ Event) =>\n    this.sendVoiceMessageToServer(progressEvent, clientId)),\n  catchError((error:\
  \ Error) => {\n    console.error(‘访问媒体设备错误’, error);\n    return EMPTY;\n  })\n\
  ).subscribe();\n```\n\n如果发生了 `dataavailable` 事件，我们将更新音频块。如果录制停止，我们将通过录制创建一个新的文件\
  \ blob 来收集音频，将结果编码为 Base64 格式，并将 `loadend` 流传递到 Observable 管道。\n\n现在，在流的末端，我们有了数据\
  \ URL 格式的结果，可以作为语音消息通过我们的聊天主题发送到 WebSocket 网关：\n\n```\nsendVoiceMessageToServer(progressEvent:\
  \ Event, clientId: string) {\n  if (!progressEvent) return;\n  const reader = progressEvent.target\
  \ as FileReader;\n  const base64AudioMessage = reader.result as string;\n  this.socket$.next({\
  \ event: ‘message’, data: { topic: ‘chat’, clientId, message: base64AudioMessage\
  \ } });\n}\n```\n\n我们的后端将语音消息存储在与其他消息相同的 `ReplaySubject` 中，这意味着我们将像以前一样获取新的 WebSocket\
  \ 消息，只需在聊天消息订阅中进行微调：\n\n\n\n\n\n```typescript\nthis.chatService.getChatSocket$().pipe(\n\
  \  filter(({ data }: IWsMessage<IChatEvent | IMessage[]>) =>\n      (data as IChatEvent).clientId\
  \ !== this.clientId),\n).subscribe(({ data }) => {\n  if (‘isTyping’ in data) {\n\
  \    this.isTyping = data.isTyping;\n    return;\n  }\nthis.messages = data.map((chatMessage:\
  \ IMessage) => {\n  if (chatMessage.message.startsWith(‘data:audio’)) {\n    return\
  \ { ...chatMessage, isVoice: true };\n  }\n  return chatMessage;\n  });\n});\n```\n\
  \n在这里，我们将检查消息是否以 `data:audio` 开头，这表明我们正在处理一个数据 URL 或语音消息。现在，我们可以区分普通消息和语音消息，并在语音消息的情况下，将源传递给\
  \ HTML 音频元素。\n\n最后，当我们打开浏览器时，可以给朋友发送语音消息：\n\n![图 9.5: 语音消息](img/B09031_10_7.png)\n\
  \n图 9.5: 语音消息\n\n## 另见…\n\n*   [NestJS 网关: [`docs.nestjs.com/websockets/gateways`](https://docs.nestjs.com/websockets/gateways)]\n\
