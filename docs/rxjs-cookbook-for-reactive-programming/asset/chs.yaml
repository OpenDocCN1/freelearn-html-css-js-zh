  *   `withLatesFrom` 操作符：https://rxjs.dev/api/operators/withLatestFrom\n*   Web API\
  \ Crypto 的 `randomUUID` 方法：[`developer.mozilla.org/en-US/docs/`](https://developer.mozilla.org/en-US/docs/Web/API/Crypto/randomUUID)\n\
  *   [Web/API/Crypto/randomUUID](https://developer.mozilla.org/en-US/docs/Web/API/Crypto/randomUUID)\n\
  \n# 使用无限滚动时间轴组件获取数据\n\n想象一下你正在浏览你喜欢的烹饪 Web 应用，获取美味新食谱的最新更新。为了显示这些最新消息，常见的用户体验（UX）模式之一是在时间轴组件中显示这些食谱新闻（例如\
  \ Facebook 的动态）。当你滚动时，如果有新的食谱，系统会提示有新食谱，这样你就可以回到顶部重新开始。\n\n## 如何实现……\n\n在这个食谱中，我们将构建一个时间轴组件，显示你最喜欢的最新烹饪食谱列表。由于世界上有很多美味的食谱，初始加载将是一个巨大的列表。为了提高应用程序性能并改善整体用户体验，我们可以实现无限滚动列表，这样当用户滚动到初始\
  \ 5 条食谱列表的末尾时，我们可以获取一组 5 条新食谱。一段时间后，我们可以发送新请求来检查是否有新食谱，并刷新我们的食谱新闻时间轴。\n\n### 步骤\
  \ 1 – 检测列表末尾\n\n在我们的 `RecipesList` 组件中，我们将创建一个滚动事件流。在每次发射时，我们将根据某个阈值检查在 UI 中我们是否接近列表末尾：\n\
  \n```\nprivate isNearBottom(): boolean {\n    const threshold = 100; // 距离底部的像素\n\
  \    const position = window.innerHeight + window.scrollY;\n    const height = document.documentElement.scrollHeight;\n\
  \    return position > height - threshold;\n}\nconst isNearBottom$ = fromEvent(window,\
  \ 'scroll').pipe(\n    startWith(null),\n    auditTime(10), // 防止事件过度触发\n    observeOn(animationFrameScheduler),\n\
  \    map(() => this.isNearBottom()),\n    distinctUntilChanged(), // 仅在靠近底部\n  \
  \                           //状态改变时发射\n)\n```\n\n正如你所想象的，随着滚动事件的发射，存在性能瓶颈的可能。我们可以使用\
  \ `auditTime` 操作符来限制流处理的滚动事件数量。这特别有用，因为我们想要确保始终在处理最新的滚动事件，而 `auditTime` 始终会在指定的时间范围内发射最最近的值。此外，通过\
  \ `observeOn(animationFrameScheduler)`，我们可以安排任务在浏览器下一次重绘之前执行。这对于动画或任何导致重绘的更新都有益，因为可以帮助防止卡顿（jank）并让应用程序感觉更流畅。\n\
  \n`auditTime` 对比 `throttleTime`\n\n你可能会奇怪为什么我们在滚动流中使用 `auditTime` 而不是 `throttleTime`。这两个操作符之间的关键区别在于，`auditTime`\
  \ 在时间窗口内发射最后一个值，而 `throttleTime` 在时间窗口内发射第一个值。`throttleTime` 的常见用例可能包括限制 API 调用的频率、处理按钮点击以防止意外双击，以及控制动画的频率。\n\
  \n一旦我们知道正接近列表末尾，就可以触发加载状态并使用新数据包触发下次请求。\n\n### 步骤 2 – 控制下一页和列表的加载状态\n\n在我们的 `RecipesList`\
  \ 组件顶部，我们将定义必要的状态来控制整个流程，并知道何时需要下一页 `page`、何时显示 `loader` 以及何时到达列表末尾：\n\n```\nprivate\
  \ page = 0;\npublic loading$ = new BehaviorSubject<boolean>(false);\npublic noMoreData$\
  \ = new Subject<void>();\nprivate destroy$ = new Subject<void>();\n```\n\n现在，我们可以继续我们的\
  \ `isNearBottom$` 流，响应下一页，并指定何时显示加载器：\n\n```\nisNearBottom$.pipe(  \n    filter((isNearBottom)\
  \ =>\n        isNearBottom && !this.loading$.value),\n    tap(() => this.loading$.next(true)),\n\
  \    switchMap(() =>\n        this.recipesService.getRecipes(++this.page)\n    \
  \    .pipe(\n            tap((recipes) => {\n                if (recipes.length\
  \ === 0)\n                this.noMoreData$.next();\n            }),\n          \
  \  finalize(() => this.loading$.next(false))\n        )\n    ),\n    takeUntil(this.destroy$))\n\
  \    )\n    .subscribe((recipes) =>\n        this.recipes = [...recipes]);\n}\n\
  ```\n\n这里是我们所做的分解：\n\n1.  首先，检查我们是否接近底部。\n2.  通过显示加载器启动新请求。\n3.  使用下一页数据发送新请求。\n\
  4.  当我们收到成功响应时，向下滚动。\n5.  一旦流完成，我们移除加载旋转器。\n\n### 步骤 3 – 检查新食谱\n\n在我们的 `recipes.service.ts`\
  \ 文件中，我们实现了一个方法，定期检查是否有新食谱，以及我们是否应该回到时间轴顶部并使用新数据刷新它：\n\n```\ncheckNewRecipes() {\n\
  \    return interval(10000).pipe(\n        switchMap(() =>\n            ))\n```\n\
  \n一旦我们收到多个食谱，我们可以在 `NewRecipesComponent` 内部订阅这些信息并在 UI 中显示它们。\n\n\n\nWeb 应用中的动画不仅仅是装饰性元素。当使用合理时，它们可以显著提升`用户体验`\
  \ (`UX`) 并为终端用户创造 `wow` 惊艳效果。在动画方面，由于 RxJS 具有协调多个事件的强大能力，在创建复杂动画时会变得非常得手。\n\n在本章中，我们将通过实现以下配谱，探索如何使用\
  \ RxJS 动画为用户添加一些最酷的视觉享受方法：\n\n*   使用 RxJS 模拟真实的球跳动物理效果\n*   使用 RxJS 创建迷人的流体粒子效果\n\
  *   使用 RxJS 过渡动画为组件添加细微的优雅感\n\n# 技术要求\n\n为了跟随本章的内容，你需要以下环境：\n\n*   `Angular v19+`\n\
  *   `RxJS v7`\n*   `Node.js v22+`\n*   `npm v11+` 或 `pnpm v10+`\n\n本章配谱的代码放置在 GitHub\
  \ 仓库中：https://github.com/PacktPublishing/RxJS-Cookbook-for-Reactive-Programming/tree/main/Chapter03\n\
  \n# 使用 RxJS 模拟真实的球跳动物理效果\n\n拿起你的物理教科书，让我们通过 RxJS 进入真实的球体物理世界吧！我们即将发现如何将现实世界的物理原理转换为响应式的\
  \ RxJS 事件流，从而在 UI 中模拟平滑的球体运动。\n\n## 如何实现……\n\n在这个配谱中，我们将实现一个响应式的跳动球动画，确保它以每秒 60\
  \ 帧的速度运行。我们力求让跳球物理效果尽可能真实，在每次跳动时应用重力、下落速度和能量损失。\n\n### 第 1 步——制作球下落动画\n\n在网页上看到卡顿的动画不是很烦人吗？为了避免这种情况并提供最好的用户体验，我们要做的第一件事就是确保动画以\
  \ 60 fps 运行。我们可以通过使用 RxJS 的 `animationFrameScheduler` 来实现这一点，它会在 `requestAnimationFrame`\
  \ 触发时执行浏览器任务。\n\n在 `bouncing-ball.component.ts` 中，我们将首先为动画帧定义一个 `Observable` 流：\n\
  \n```\nconst ballLoop$ = interval(0, animationFrameScheduler);\n```\n\n现在我们可以对 `animationFrame$`\
  \ 流进行管道操作，并在每个新的动画帧更新球的位置：\n\n```\nconst initialHeight = 0;\nngAfterViewInit() {\n\
  \    const initialHeight = 0;\n    this.ballLoop$ = animationFrame$.pipe(\n    \
  \    scan(({ y, dy}, velocity) => {\n            dy += gravity;\n            y +=\
  \ dy;\n        return { y, dy };\n        }, { y: initialHeight, dy: 0 }),\n   \
  \     tap(({ y }) => {\n            ball.style.top = `${y}px`;\n        }),\n  \
  \  );\n    this.ballLoop$.subscribe();\n}\n```\n\n此时，我们将看到一个动画，其中我们在每一帧中都会更新球的 `y`\
  \ 位置，其中 `dy` 是球的运动方向。\n\n任何在高中上过物理课的人都会知道重力定律。这些定律基本上是说，如果我们有 `9.81m/s²` 的重力加速度，意味着球在下落的每秒内都会获得额外的\
  \ `9.81m/s` 速度。在我们的配谱中，如果我们将一个动画帧映射为现实中的一秒，意味着我们只需要将重力值累加到 `dy` 上，就可以实现类似的效果。通过说\
  \ `dy += gravity`，我们可以模拟球如何随时间获得速度。\n\n### 第 2 步——从地面反弹\n\n我们现在希望球能识别`地面` 并每次从其上反弹：\n\
  \n```\n@ViewChild('ball', { static: true }) ballRef!: ElementRef;\nbounceCount =\
  \ 0;\nngAfterViewInit() {\n    const ball = this.ballRef.nativeElement;\n    const\
  \ container = document.documentElement;\n    let energyLoss = 0.8;\n    this.ballLoop$\
  \ = animationFrame$.pipe(\n        scan(({ y, dy}, velocity) => {\n            dy\
  \ += gravity;\n            y += dy;\n            // 从地面反弹\n            if (y + ball.offsetHeight\
  \ > \n                container.clientHeight) {\n                    y = container.clientHeight\
  \ –\n                        ball.offsetHeight;\n                    dy = -dy *\
  \ energyLoss;\n                    // 反转方向并减少能量\n                    this.bounceCount++;\n\
  \            }\n            return { y, dy };\n        }, { y: initialHeight, dy:\
  \ 0 }),\n    tap(({ y }) => {\n        ball.style.top = `${y}px`;\n    }),\n);\n\
  ```\n\n在这里，我们可以看到我们更新了逻辑，以便知道球何时撞击地面（到达视口末端），通过反转方向并考虑每次跳动时的能量损失来实现反弹。\n\n### 第\
  \ 3 步——停止并重复动画\n\n为了防止内存泄漏，并在球停止下落时完成流以控制动画，我们将应用 RxJS 的 `takeWhile` 算符：\n\n```\n\
  private bounceRepeat$ = new Subject<void>();\nmessage = signal<string>('');\nngAfterViewInit()\
  \ {\n    this.ballLoop$ = interval(\n        0,\n        animationFrameScheduler\n\
  \    ).pipe(\n        // 流的其余部分\n        takeWhile(({ y, dy }) => y < container.clientHeight\
  \ - ball.offsetHeight - 10 || Math.abs(dy) > 5\n        ),\n        finalize(()\
  \ => {\n            message.set(`跳动 ${this.bounceCount} 次后停止`);\n        }),\n \
  \       repeat({ delay: () => this.bounceRepeat$ })\n    );\n}\nstartBouncing()\
  \ {\n    this.bounceRepeat$.next();\n}\n```\n\n在这里，我们简单地说，当距离地面 10 px 且当前运动大于 5\
  \ px 时，流应该停止。\n\n此外，每当我们点击 **开始跳动** 按钮时，我们都通过利用 `repeat` 算符再次触发动画。`repeat` 算符的另一个很棒的地方是，即使我们多次点击，它也不会触发新的动画，因为它只会在流完成后重新订阅。\n\
  \n![图 3.1: RxJS 跳动球](img/09031_03_1.png)\n\n图 3.1: RxJS 跳动球\n\n## 另请\n\n*   RxJS\
  \ `animationFrameScheduler`: [`rxjs.dev/index/const/animationFrameScheduler`](https://rxjs.dev/index/const/animationFrameScheduler)\n\
  *   RxJS `repeat` 算符: [`rxjs.dev/api/operators/repeat`](https://rxjs.dev/api/operators/repeat)\n\
  \n\n\n在 `particles.component.ts` 组件中，我们可以设置一个 canvas 元素引用并生成一个粒子数组：\n\n```typescript\n\
  @ViewChild('canvas', { static: true })\ncanvas!: ElementRef<HTMLCanvasElement>;\n\
  private ctx!: CanvasRenderingContext2D;\nprivate particles$!: Observable<Particle[]>;\n\
  private generateParticle(): Particle {\n    return {\n        x: Math.random() *\
  \ this.canvas.nativeElement.width,\n        y: Math.random() * this.\n         \
  \   canvas.nativeElement.height,\n        radius: Math.random() * 0.5 + 2.5,\n \
  \       vx: Math.random() < 0.5\n            ? (Math.random() + 0.8)\n         \
  \   : -(Math.random() + 0.8),\n        vy: Math.random() < 0.5\n            ? (Math.random()\
  \ + 0.8)\n            : -(Math.random() + 0.8),\n        color: `rgba(255,255,255,0.5)`\n\
  \    }\n};\n```\n\n在生成粒子时，我们将拥有以下属性：\n\n- 粒子坐标 `x` 和 `y`\n- 粒子的尺寸和颜色\n- 粒子的移动方向，由\
  \ `vx` 和 `vy` 定义\n\n现在我们可以调用 `generateParticles()` 方法并在 canvas 上绘制粒子：\n\n```typescript\n\
  ngOnInit() {\nthis.ctx = this.canvas.nativeElement.getContext('2d')!;\nconst initialParticles:\
  \ Particle[] = Array.from(\n    { length: 123 },\n    this.generateParticle,\n \
  \   this\n);\nconst animationFrame$ = animationFrames();\nthis.particles$ = animationFrame$.pipe(\n\
  \    scan((particles: Particle[], event: IAnimationFrame) => \n    {\n        return\
  \ particles.map(particle => {\n            let newX = particle.x + particle.vx;\n\
  \            let newY = particle.y + particle.vy;\n            return {\n      \
  \          ...particle,\n                x: newX,\n                y: newY,\n  \
  \              vx: particle.vx,\n                vy: particle.vy\n            };\n\
  \        });\n    }, initialParticles),\n    tap(particles => this.drawParticles(particles))\n\
  );\n```\n\n在这里，你可能会注意到我们在使用 RxJS 的 `animationFrames` 函数来确保动画平滑，并在浏览器渲染周期内渲染粒子。每当我们进入一个新的渲染周期时，我们就可以更新\
  \ canvas 上每个粒子的位置，并调用 `drawParticles()` 方法：\n\n```typescript\ndrawParticles(particles:\
  \ Particle[]) {\n    this.ctx.clearRect(\n        0,\n        0,\n        this.canvas.nativeElement.width,\n\
  \        this.canvas.nativeElement.height\n    );\n    particles.forEach(particle\
  \ =>\n        this.drawParticle(particle));\n}\ndrawParticle(particle: Particle)\
  \ {\n    this.ctx.beginPath();\n    this.ctx.arc(\n        particle.x,\n       \
  \ particle.y,\n        particle.radius,\n        0,\n        Math.PI * 2\n    );\n\
  \    this.ctx.fillStyle = particle.color;\n    this.ctx.fill();\n}\n```\n\n### 步骤\
  \ 2 – 检测边界碰撞\n\n根据我们粒子配方的当前状态，我们可能会注意到，一段时间后，所有粒子都会飞出屏幕。这是因为我们没有检测正在观察的 canvas 容器的边界。我们可以使用\
  \ `checkWallCollision()` 方法来检查粒子是否撞击墙壁，并改变每个粒子的移动方向：\n\n```typescript\ndetectWallCollision(\n\
  \    particle: Particle,\n    newX: number,\n    newY: number\n): Particle {\n \
  \   if (newX + particle.radius >\n        this.canvas.nativeElement.width ||\n \
  \       newX - particle.radius < 0\n    ) {\n        particle.vx *= -particle.vx;\n\
  \    }\n    if (newY + particle.radius >\n        this.canvas.nativeElement.height\
  \ ||\n        newY - particle.radius < 0\n    ) {\n        particle.vy *= -particle.vy;\n\
  \    }\n    return particle;\n}\n```\n\n一旦我们实现了 `checkWallCollision()` 方法，我们就可以在流中检测粒子的边界碰撞：\n\
  \n```typescript\nthis.particles$ = animationFrame$.pipe(\n    scan((particles: Particle[],\
  \ event: IAnimationFrame) => \n    {\n        return particles.map(particle => {\n\
  \            let newX = particle.x + particle.vx;\n            let newY = particle.y\
  \ + particle.vy;\n            const updatedParticle = this.detectWallCollision(particle,\
  \ newX, newY);\n            return {\n                ...updatedParticle,\n    \
  \            x: newX,\n                y: newY\n            };\n        });\n  \
  \  }, initialParticles),\n    tap(particles => this.drawParticles(particles))\n\
  );\n```\n\n### 步骤 3 – 绘制线条\n\n在绘制并动画粒子移动后，我们可以计算它们之间的距离并绘制线条。如果它们距离小于 250px，我们将调用\
  \ `drawLine()` 方法：\n\n```typescript\ndrawConnections(particles: Particle[]) {\n\
  \    for (let i = 0; i < particles.length; i++) {\n        for (let j = i + 1; j\
  \ < particles.length; j++) {\n            const particle1 = particles[i];\n    \
  \        const particle2 = particles[j];\n            const distance = Math.sqrt(\n\
  \                Math.pow(particle1.x - particle2.x, 2) +\n                Math.pow(particle1.y\
  \ - particle2.y, 2)\n            );\n            if (distance <= 250) {\n      \
  \          const opacity = 1 - distance / 250;\n                this.drawLine(particle1,\
  \ particle2, opacity);\n            }\n        }\n    }\n}\n```\n\n谁说我们生活中不需要勾股定理？在\
  \ `drawConnections()` 方法中，我们正在画布 上绘制连接。\n\n![图 3.2: RxJS 粒子](img/0931_03_2.png)\n\
  \n### 步骤 4 – 使用悬停效果移动粒子\n\n在这一步中，我们将以 `particles.js` 库的方式与鼠标进行交互：\n\n```typescript\n\
  const mouseMove$ = fromEvent<MouseEvent>(\n    this.canvas.nativeElement,\n    'mousemove'\n\
  ).pipe(\n    throttleTime(5),\n    map((event: MouseEvent) => {\n        const rect\
  \ = this.canvas.nativeElement.getBoundingClientRect();\n        return {\n     \
  \       x: (event.clientX - rect.left) * (this.canvas.nativeElement.width / rect.width),\n\
  \            y: (event.clientY - rect.top) * (this.canvas.nativeElement.height /\
  \ rect.height),\n        };\n    }),\n    takeUntil(\n        merge(\n         \
  \   fromEvent(this.canvas.nativeElement, 'mouseout'),\n            fromEvent(this.canvas.nativeElement,\
  \ 'mouseleave')\n        )\n    )\n);\n```\n\n由于 canvas 的尺寸相对于屏幕尺寸经过了缩放，我们需要比例地转换鼠标坐标。之后，我们可以将\
  \ `mouseMove$` 流包含在主 `particles$` 流中：\n\n```typescript\nthis.particles$ = merge(mouseMove$,\
  \ animationFrame$).pipe(\n    scan(\n        (particles: Particle[],\n         event:\
  \ { x: number, y: number } | IAnimationFrame\n        ) => {\n            if ('x'\
  \ in event && 'y' in event) {\n                this.mouseX = event.x;\n        \
  \        this.mouseY = event.y;\n                return particles;\n           \
  \ }\n            return particles.map(particle => {\n                const mouseMoveCoordinates\
  \ = this.handleMouseInteraction(particle);\n                let newX = mouseMoveCoordinates?.newX\
  \ || particle.x + particle.vx;\n                let newY = mouseMoveCoordinates?.newY\
  \ || particle.y + particle.vy;\n                return {\n                    particle,\n\
  \                    x: newX,\n                    y: newY,\n                  \
  \  vx: particle.vx,\n                    vy: particle.vy\n                };\n \
  \           });\n        },\n        initialParticles\n    )\n);\n```\n\n最后，我们可以调用\
  \ `handleMouseInteraction()` 方法并让粒子离开悬停半径：\n\n```typescript\nhandleMouseInteraction(particle:\
  \ Particle) {\n    const dx = this.mouseX - particle.x;\n    const dy = this.mouseY\
  \ - particle.y;\n    const distance = Math.sqrt(dx * dx + dy * dy);\n    if (distance\
  \ < 250) {\n        const force = (250 - distance) / 250;\n        return {\n  \
  \          newX: particle.x - dx * force * 0.5,\n            newY: particle.y -\
  \ dy * force * 0.5\n        };\n    }\n    return null;\n}\n```\n\n\n\n\n```\nhandleMouseInteraction(\n\
  \    particle: Particle\n): { newX: number; newY: number } | undefined {\n    //\
  \ Mouse hover radius avoidance\n    const distanceToMouse = Math.sqrt(\n       \
  \ (this.mouseX - particle.x) ** 2 +\n        (this.mouseY - particle.y) ** 2\n \
  \   );\n    if (distanceToMouse > 200) return;\n    // Calculate angle between particle\
  \ and mouse\n    const angle = Math.atan2(\n        particle.y - this.mouseY,\n\
  \        particle.x - this.mouseX\n    );\n    const normalX = Math.cos(angle);\n\
  \    const normalY = Math.sin(angle);\n    const influenceFactor = Math.max(\n \
  \       0, 1 - distanceToMouse / 200);\n    particle.vx += normalX * influenceFactor\
  \ * 2;\n    // Adjust the factor as needed\n    particle.vy += normalY * influenceFactor\
  \ * 2;\n    // Adjust the factor as needed\n    particle.x = this.mouseX + 200 *\
  \ normalX + particle.vx;\n    particle.y = this.mouseY + 200 * normalY + particle.vy;\n\
  \    return {\n        newX: particle.x,\n        newY: particle.y,\n    };\n}\n\
  ```\n\n又是一个没有使用三角函数 `sin`, `co....` 的日子……哦等等。数学教授们一直都是正确的！以下是我们知道当粒子与鼠标悬停半径之间的距离小于\
  \ 200 px 时，应该如何移动粒子的方法：\n\n*   `Math.atan2` 计算粒子与鼠标之间的角度（以弧度为单位）。该角度是从正 `x` 轴逆时针测量到连接粒子和鼠标的直线的角度。\n\
  \n*   `Math.cos(angle)` 和 `Math.sin(angle)` 提供了从鼠标指向粒子的单位向量的 `x` 和 `y` 分量。该向量是经过归一化的，这意味着它的长度为\
  \ `1`。\n\n*   计算粒子速度向量与归一化方向向量的点积。这衡量了粒子速度中有多大比例是朝鼠标方向的。\n\n*   通过在角度相反的方向上移动鼠标\
  \ 200 个单位并加上调整后的速度，计算粒子的新位置。\n\n粒子运动背后的三角函数涉及计算从粒子到鼠标的角度和方向，确定鼠标对粒子速度的影响，然后更新粒子的位置使其远离鼠标。通过这种方式，我们能够避开鼠标光标并根据它们的相对位置调整粒子速度。\n\
  \n![Figure 3.3: RxJS particles hover effect](img/B09031_03_3.png)\n\n图 3.3: RxJS\
  \ 粒子悬停效果\n\n## See also\n\n*   `Particles.js`: [`vincentgarreau.com/particles.js/`](https://vincentgarreau.com/particles.js/)\n\
  \n# 使用 RxJS 过渡为组件增添微妙的优雅\n\n我们提升 UI 组件用户体验的方法是添加清晰且具有视觉吸引力的反馈。还有什么比这更好的方法呢，比如为组件添加一个复杂的响应式动画？让我们想象一下，对于我们全新的设计系统，我们需要创建一个上传按钮，并带有具有视觉吸引力的进度指示器，指示器能够优雅地更新。\n\
  \n## 如何实现……\n\n在这个食谱（recipe）中，我们将发挥创意，为上传按钮编写一个方案：我们将逐渐增加进度，并在过程中控制动画状态，直到上传完全完成。\n\
  \n### 第 1 步 – 增加上传进度\n\n第一步，我们将定义一个随机进度流，发射从 `0` 到 `100` 的值：\n\n```\nconst uploadProgress$\
  \ = range(0, 101).pipe(\n    zipWith(interval(50)),\n    map(([value, _]) => value),\n\
  \    take(101)\n);\n```\n\n在这里，我们可以在生成上传进度的方式或从服务器获取实际进度上发挥创意。目前的方法只是模拟，这个食谱的重点在于对上传进度进行动画处理。\n\
  \n### 第 2 步 – 进度动画\n\n在有效地管理不同按钮的上传进度后，我们可以利用 RxJS `BehaviorSubject` 状态转换，并相应地为按钮上传进度制作动画：\n\
  \n```\nconst clickStream$ = this.upload$.pipe(\n    tap(() => this.btnState$.next(EBtnStates.LOADING)),\n\
  \    switchMap(() => animationFrames()),\n    withLatestFrom(uploadProgress$, this.btnState$),\n\
  \    distinctUntilChanged(\n        ([_, progress], [__, prevProgress]) =>\n   \
  \         progress === prevProgress),\n    tap(([_, progress]) => {\n        if\
  \ (progress === 100) {\n            this.btnState$.next(EBtnStates.DONE);\n    \
  \    }\n    }),\n    takeWhile(([_, __, btnState]) =>\n        btnState !== EBtnStates.DONE,\
  \ true)\n);\n```\n\n每当我们点击按钮时，我们都会切换到 `animationFrames()` 流，这为我们提供了一个用于更新和渲染高性能动画的时间范围。只要我们不是\
  \ `DONE` 状态，就会获取动画帧流。之后，我们将该流与来自 `uploadProgress$` 的最新流结合，并增加按钮的背景宽度。\n\n在 `button-upload.component.html`\
  \ 模板中，我们可以将 `buttonWidth` signal 值绑定到：\n\n```\n<button #submitButton (click)=\"\
  startUpload()\">\n<span\n  class=\"upload\"\n  [style.width.px]=\"buttonWidth()\"\
  \n></>\n  @if ((btnState$ | async) === 'loading') {\n      <span class=\"spinner\"\
  ></span>\n  } @else if ((btnState$ | async) === 'done') {\n      <span class=\"\
  checkmark\"></span>\n  } @else {\n      <span class=\"upload-text\">Upload</span>\n\
  \  }\n</button>\n```\n\n最后，当我们打开浏览器时，可以看到它的运行效果：\n\n![Figure 3.3: RxJS particles\
  \ hover effect](img/034.png)\n\n# 测试 RxJS 应用\n\n**代码测试**是现代软件开发中最好且最重要的实践之一。建立代码测试可以确保代码的可靠性和正确性，提高代码质量，增强代码抗错误能力，并在我们更改代码时提供安全保障。我们可以使用单元测试来验证所有组件按预期工作。然后，我们可以编写集成测试来验证组件在特定场景下的协同工作，或者检查它们与外部系统（如后端\
  \ API）的集成情况。测试还可以作为代码行为的文档。所有这些优势也适用于 RxJS 代码，特别是复杂的流。通过测试 Observable、订阅和操作符，我们可以验证数据流符合预期，并且异步操作得到了正确处理。\n\
  \n测试具有挑战性，特别是对于 RxJS，因为它的异步特性意味着操作是随时间执行的，而不是可预测的线性方式。这就是为什么我们有很多酷的测试工具和库，让我们在处理异步代码和事件协调时变得更轻松。RxJS\
  \ 测试的关键元素包括：\n\n*   **TestScheduler**: 一个虚拟时间环境，用于控制和模拟基于时间的操作，使异步测试具有确定性。\n*  \
  \ **弹道图 (Marble diagrams)**：用于描述 Observable 和操作符随时间行为的可视化，有助于设计测试用例。\n*   **断言库**:\
  \ 使用如 Jasmine 或 Jest 等库来定义期望并验证实际输出是否符合预期结果。\n\n在本章中，我们将涵盖以下食谱：\n\n*   使用弹道测试掌握基于时间的\
  \ RxJS 操作符\n*   在 Angular 中使用 Observable 模拟 HTTP 依赖\n*   使用 **Mock Service Worker**\
  \ (**MSW**) 模拟 API 调用\n*   使用 NgRx 测试复杂的状态管理\n\n\n\n\n本章食谱的代码存放在此 GitHub 仓库中：[`github.com/PacktPublishing/RxJS-Cookbook-for-Reactive-Programming/tree/main/Chapter04`](https://github.com/PacktPublishing/RxJS-Cookbook-for-Reactive-Programming/tree/main/Chapter04)\n\
  \n# 使用弹理图测试掌握基于时间的 RxJS 运算符\n\n`RxJS marble diagrams` 是一种可视化和理解响应式编程中 `Observables`\
  \ 和运算符行为的强大工具。它们提供了一个清晰的、基于时间线的表示，展示了值、事件和错误如何流过 `Observable` 流。通过直观的符号和视觉时间线，弹理图简化了\
  \ RxJS 概念的通信与理解，有助于响应式代码的设计、调试和文档。这可以帮助我们理解复杂的响应式系统是如何工作的，并让响应式代码的测试变得更容易，特别是在处理异步操作和状态转换时\n\
  \n## 准备工作\n\n为了演示 RxJS 弹理图的力量，我们将为 *第 2 章 中的*使用 RxJS 驱动通知简化实时更新*食谱编写一个弹理单元测试 ([`github.com/PacktPublishing/RxJS-Cookbook-for-Reactive-Programming/tree/main/Chapter02/rxjs-notification`](https://github.com/PacktPublishing/RxJS-Cookbook-for-Reactive-Programming/tree/main/Chapter02/rxjs-notification))。\n\
  \n为了理解弹理图语法并帮助我们跟随食谱，这里有一份快速速查表：\n\n* `-`: 代表虚拟时间流逝的一帧。\n* `[a-z0-9]`: 代表 `Observable`\
  \ 发出的值。\n* `(abc)`：组合在同一帧内发射的多个值。\n* `|`: 代表 `Observable` 的完成。\n* `#`: 代表 `Observable`\
  \ 出的错误。\n* `^`: 代表订阅开始的点。\n* `!`: 代表订阅结束（取消）的点。\n* `[0-9]+(ms|s|m)`:代表特定的持续时间（毫秒、秒、分钟）。\n\
  \n## 如何实现……\n\n在本食谱中，我们将测试随时间异步移入并在 UI 中堆叠的通知流。为了实现这一点，我们将用弹理图展示传入的通知，然后断言给定的事件序列，以确保我们获得了及时的状态转换，这些转换将反映在\
  \ UI 中\n\n### 第 1 步 – 设置 TestScheduler\n\n在测试开始，我们将设置 `TestScheduler`。我们需要 `TestScheduler`\
  \ 在受控的虚拟时间环境中执行我们的 `Observable` 流：\n\n```javascript\ndescribe('NotificationService',\
  \ () => {\n    let service: NotificationService;\n    let testScheduler: TestScheduler;\n\
  \    beforeEach(() => {\n        TestBed.configureTestingModule({\n            providers:\
  \ [NotificationService]\n        });\n        testScheduler = new TestScheduler(\n\
  \            (actual, expected) => {\n                expect(actual).toEqual(expected);\n\
  \    });\n    service = TestBed.inject(NotificationService);\n});\n```\n\n### 第\
  \ 2 步 – 测试简单的 RxJS 流\n\n在这一步中，为了简化测试，我们将暂时注释掉 `addNotification$()` 方法内部的自动关闭通知逻辑：\n\
  \n```javascript\naddNotification$(\n    notification: Notification,\n    autodismiss\
  \ = true,\n    timeout = 5000\n) {\n    this.addNotification$.next(notification);\n\
  \    // if (autodismiss) {\n    // timer(timeout).subscribe(() => \n      this.removeNotification(notification.id));\n\
  \  // }\n}\n```\n\n在这里，我们将演示通知如何随时间添加到堆栈中，以及我们如何用 RxJS 弹理图表示该时间线：\n\n```javascript\n\
  it('should add notifications', fakeAsync(() => {\n    testScheduler.run(({ cold,\
  \ expectObservable,\n        expectSubscriptions }) => {\n            const notification1:\
  \ \n                Notification = { id: '1',\n                    message: 'Recipe\
  \ added successfully.',\n                    type: 'success' };\n            const\
  \ notification2:\n                Notification = { id: '2',\n                  \
  \  message: 'Recipe added successfully.',\n                    type: 'success' };\n\
  \        const add1$ = cold('a', { a: notification1 });\n        const add2$ = cold('--a',\
  \ { a: notification2 });\n        const expected$ = 'a-b';\n        const expectedValues\
  \ = {\n            a: [notification1],\n            b: [notification1, notification2]\n\
  \        };\n        add1$.subscribe(notification =>\n            service.addNotification(notification));\n\
  \        add2$.subscribe(notification =>  \n            service.addNotification(notification));\n\
  \            service.notifications.subscribe();\n        // Delay the subscription\
  \ to notifications$ to\n       //ensure addNotification has been called\n      \
  \  testScheduler.schedule(() =>  \n            expectObservable(service.notifications$)\n\
  \            .toBe(expected$, expectedValues));\n      });\n}));\n```\n\n让我们稍微拆解一下例子：\n\
  \n1. 首先，我们在时间的第一帧为第一个通知创建一个冷（cold）`Observable`。这样做是因为与热 `Observables` 相比，冷 `Observables`\
  \ 为我们测试异步行为提供了更好的控制和可预测性，因为它们只在我们订阅流时才开始发射值。\n2. 对于第二个通知，在前两帧内什么都不会发生，然后我们将在第三帧等待并最终发射一个值。\n\
  \n将此想象成我们可以在代码中可视化的事件时间线，其中时间线中的每个 `'-'` 代表 1 毫秒。我们立即发射第一个通知。同时，第二个通知等待两帧，然后发射一个值。当我们查看事件时间线时，可以清楚地看到顺序如下：\n\
  \n1. 第一帧 – 第一个通知发射一个值；第二个通知在等待。此时，我们预期堆栈中有一个通知。\n2. 第二帧 – 什么都没有发生，堆栈中仍然有一个通知。\n\
  3. 第三帧 – 第二个通知发射一个值。一旦我们发射了第二个通知，我们预期堆栈中有两个通知。\n\n### 第 3 步 – 测试复杂的 RxJS 流\n\n现在我们已经理解了弹理测试的基础知识，准备好测试更复杂的流了，例如在不同延迟后自动关闭通知。我们即将看到此功能如何影响我们在添加多个通知但在其间关闭它们的时间线。在我们取消了*第\
  \ 2 步*中对 `addNotification$()` 方法的代码注释后，我们的测试看起来可能会像这样：\n\n\n\n\n\n```typescript\n\
  it('should add and remove notification after 5 seconds',\nfakeAsync(() => {\n  \
  \  testScheduler.run(({ cold, expectObservable }) => {\n        const notification1:\
  \ Notification = { id: '1',\n            message: 'Recipe added successfully.',\n\
  \            type: 'success' };\n        const notification2: Notification = { id:\
  \ '2',\n            message: 'Recipe could not be added.',\n            type: 'error'\
  \ };\n        const notification3: Notification = { id: '3',\n            message:\
  \ 'Recipe could not be added.',\n            type: 'error' };\n        const add1$\
  \ = cold('a', { a: notification1 });\n        const add2$ = cold('1500ms a', { a:\
  \ notification2  \n    });\n    const add3$ = cold('4000ms a', { a: notification3\
  \ });\n    const expected$ =\n        'a 1499ms b 2499ms c 999ms d 3999ms e';\n\
  \    const expectedValues = {\n        a: [notification1],\n        b: [notification1,\
  \ notification2],\n        c: [notification1, notification2, notification3],\n \
  \       d: [notification2, notification3],\n        e: [notification2]\n    };\n\
  \    add1$.subscribe(notification =>\n        service.addNotification(notification));\n\
  \    add2$.subscribe(notification =>\n        service.addNotification(notification,\
  \ false));\n    add3$.subscribe(notification =>  \n        service.addNotification(notification));\n\
  \        service.notifications.subscribe();\n        testScheduler.schedule(() =>\
  \ {\n            expectObservable(service.notifications$).toBe(\n              \
  \  expected$, \n                expectedValues\n            );\n        });\n  \
  \  });\n}));\n```\n\n让我们也拆解这个示例以加强理解：\n\n1. 我们为第一个通知创建了一个冷热的 `Observable`，它会立即发射。\n\
  \n2. 在 `1500 ms` 之后，我们发射了第二个通知，它不会自动消失。这意味着该通知将留在栈栈中，直到我们手动将其移除。\n\n3. 在 `4000 ms`\
  \ 之后，我们发射了第三个通知。\n\n现在，有趣的部分开始了。首先，通过观察预期的时间线，某些值看起来可能奇怪，但这些值背后有很好的理由。每个值的发射都会耗费\
  \ `1 ms` 的虚拟时间。这意味着如果我们想在两个发射的值之间创建一个 `1500 ms` 的间隔，我们可以像弹性图一样描述这个时间线：`'a 1499ms\
  \ b'`。现在，如果我们仔细观察预期的时间线，`'a 1499ms b 2499ms c 999ms d 3999ms e'`，事情变得合理了：\n\n1.\
  \ 首先，我们发射了第一个通知的值，它将在 `5000 ms` 后被丢弃。此时，栈栈中有第一个通知。\n\n2. 我们等待 `1499 ms`，然后发射了耗时\
  \ `1 ms` 的第二个通知，它不会从栈中自动消失。此时，栈栈中有前两个通知。\n\n3. 第三个通知应该在第一个通知之后 `4000 ms` 发射。到目前为止，虚拟时间已经通过了\
  \ `1500 ms`。这意味着我们必须等待 `2499 ms` 才能发射第三个通知的值。此时，栈栈中有所有三个通知。\n\n4. 到目前为止，在我们发射了第一个值后，时间线上已经通过了\
  \ `4000 ms`。这意味着我们等待 `999 ms` 直到第一个通知从栈中自动丢弃。一旦发生这种情况，栈中就剩下第二个和第三个通知。\n\n5. 在虚拟时间的这一点上，由于我们发射了第三个通知，已经通过了\
  \ `1000 ms`。我们再等待 `3999 ms` 并从栈中移除第三个通知。最后，栈中只剩下第二个通知。\n\n这并不像最初看起来那么难，对吧？这些弹性图很有趣！通过这种弹性图的模式，我们可以描述任何异步事件流，这可以帮助我们对测试更具描述性。\n\
  \n## 另请\n\n- 弹性语法：[`rxjs.dev/guide/testing/marble-testing#marble-syntax`](https://rxjs.dev/guide/testing/marble-testing#marble-syntax)\n\
  - RxJS 弹性测试博客：[`betterprogramming.pub/rxjs-testing-write-unit-tests-for-observables-603af959e251`](https://betterprogramming.pub/rxjs-testing-write-unit-tests-for-observables-603af959e251)\n\
  - *Getting Started with Marble Tests* 课程：[`rxjs-course.dev/course/testing/getting-started-with-marble-tests`](https://rxjs-course.dev/course/testing/getting-started-with-marble-tests)\n\
  - Ben Lesh 的文章 *Hot vs Cold Observables*：[`benlesh.medium.com/hot-vs-cold-observables-f8094ed53339`](https://benlesh.medium.com/hot-vs-cold-observables-f8094ed53339)\n\
  - *Testing asynchronous RxJs operators* 文章：[`medium.com/angular-in-depth/testing-asynchronous-rxjs-operators`](https://medium.com/angular-in-depth/testing-asynchronous-rxjs-operators)\n\
  \n# 使用 Observable 模拟 HTTP 依赖\n\n在 Angular 中，每个 HTTP 调用都表示为 `Observable`。这意味着每当我们编写集成测试时，都必须模拟依赖项。\n\
  \n## 准备工作\n\n在本配方中，我们将测试在 [第一章](https://github.com/PacktPublishing/RxJS-Cookbook-for-Reactive-Programming/tree/main/Chapter01/network-requests)\
  \ 中实现的服务。\n\n## 如何实现\n\n为了模拟服务的 HTTP 调用，我们将借助 `@angular/common/http/testing` 模块并学习如何测试发送的。\n\
  \n### 第一步 – 设置 TestBed\n\n为了能够模拟 HTTP 通信，我们需要在每个测试开始之前设置 `TestBed`。在我们的 `recipe.service.spec.ts`\
  \ 文件中，将有以下配置：\n\n```typescript\nbeforeEach(() => {\n    TestBed.configureTestingModule({\n\
  \        providers: [\n            provideHttpClient(),\n            provideHttpClientTesting(),\n\
  \            RecipesService\n        ],\n    });\n    service = TestBed.inject(RecipesService);\n\
  \    httpMock = TestBed.inject(HttpTestingController);\n});\nafterEach(() => {\n\
  \    httpMock.verify();\n});\n```\n\n现在，当我们运行测试时，请求不会发送到真实的后端，而是发送到我们的测试后端。我们还可以注意到我们正在注入\
  \ `HttpTestingController`，它可以帮助我们与模拟后端交互，向其发送请求并断言从模拟后端返回的响应。\n\n\n\n\n\n```javascript\n\
  const mockResponse = [\n    {\n    \"id\": 1,\n    \"name\": \"Spaghetti Aglio e\
  \ Olio\",\n    \"description\": \"Simple yet flavorful pasta with garlic,\n    \
  \                olive oil, and chili flakes\",\n    \"ingredients\": [\"spaghetti\"\
  , \"garlic\", \"olive oil\",\n                    \"chili flakes\", \"parmesan cheese\"\
  ,\n                    \"parsley\"]\n    },\n    {\n    \"id\": 2,\n    \"name\"\
  : \"Chicken Tikka Masala\",\n    \"description\": \"Creamy, spiced Indian curry\
  \ with tender\n                    chicken pieces.\",\n    \"ingredients\": [\"\
  chicken breasts\", \"yogurt\",\n                    \"garam masala\", \"turmeric\"\
  , \"cumin\",\n                    \"tomatoes\", \"onion\", \"ginger\", \n      \
  \              \"garlic\", \"heavy cream\"]\n    },\n];\n```\n\n现在我们可以通过在测试中调用 `getRecipes$`\
  \ 方法来断言此响应。在我们的集成测试中，我们将定义一个获取食谱列表的测试场景：\n\n```javascript\nit('should fetch a list\
  \ of recipes', fakeAsync(() => {\n    const recipes$ = service.getRecipes$();\n\
  \    const recipes = firstValueFrom(recipes$);\n    const request = httpMock.expectOne('/api/recipes');\n\
  \    request.flush(mockResponse);\n    expect(await recipes).toEqual(mockResponse));\n\
  ```\n\n我们所做的：\n1. 首先，我们将一个 HTTP 调用赋值给 `recipes$`。\n2. 然后，我们使用来自 RxJS 的 `firstValueFrom`\
  \ 函数，它会自动订阅、发送 HTTP 请求并将值转换为 Promise。\n3. 接下来，我们使用 `HttpTestingController` 对请求进行断言，并检查是否发送了正确的请求。\n\
  4. 紧接着，我们使用 `flush` 方法交付模拟响应。\n5. 最后，我们对响应进行断言。\n\n### 步骤 3：按顺序测试多个请求\n\n在我们的 `recipe.service.ts`\
  \ 文件中，我们有一个 `getRecipeDetails()` 方法，它按顺序发送两个请求，一个接一个地：\n\n```typescript\ngetRecipeById$(id:\
  \ number): Observable<Recipe> {\n    return this.httpClient.get<Recipe>(`/api/recipes/${id}`);\n\
  }\n\ngetRecipeDetails$(id: number): Observable<{ recipe: Recipe; details: Recipe\
  \ }> {\n    return this.getRecipeById$(id).pipe(\n        switchMap((recipe: Recipe)\
  \ => {\n            return this.httpClient.get<RecipeDetails>(`/api/recipes/details/${id}`)\n\
  \                .map((details) => ({ recipe, details }));\n        }));\n```\n\n\
  这意味着在我们的测试中，我们必须断言这两个请求和响应，因为我们将它们合并作为整个流的结果。我们的模拟响应看起来像所示：\n\n```javascript\nconst\
  \ dummyRecipe = {\n    \"id\": 1,\n    \"name\": \"Spaghetti Aglio e Olio\",\n \
  \   \"description\": \"Simple yet flavorful pasta with garlic,\n               \
  \     olive oil, and chili flakes\",\n    \"ingredients\": [\"spaghetti\", \"garlic\"\
  , \"olive oil\",\n                    \"chili flakes\", \"parmesan cheese\",\n \
  \                   \"parsley\"]\n};\n\nconst dummyDetails = {\n    \"id\": 1,\n\
  \    \"prepTime\": 720000,\n    \"cuisine\": \"Italian\",\n    \"diet\": \"Vegetarian\"\
  ,\n    \"url\": \"/assets/images/spaghetti.jpg\",\n    \"nutrition\": {\n      \
  \  \"calories\": 450,\n        \"fat\": 15,\n        \"carbs\": 70,\n        \"\
  protein\": 10\n    }\n};\n```\n\n现在，让我们测试获取食谱详情：\n\n```javascript\nit('should fetch\
  \ recipe details', async () => {\n    const recipeDetails$ = service.getRecipeDetails$(dummyRecipe.id);\n\
  \    const recipeDetails = firstValueFrom(recipeDetails$);\n```\n\n这意味着在我们的测试中，我们必须断言这两个请求和响应，因为我们将它们合并作为整个流的结果。我们的模拟响应看起来像所示：\n\
  \n（此处由于代码块重复，根据指令“不要重复输出原文”，在翻译流中应保持逻辑连贯，但由于指令要求是翻译给定文本。重新梳理逻辑，以下是针对后续后续文本的翻译：）\n\
  \n### 步骤 3：按顺序测试多个请求\n\n在我们的 `recipe.service.ts` 文件中，我们有一个 `getRecipeDetails()`\
  \ 方法，它按顺序发送两个请求，一个接一个地：\n\n这意味着在我们的测试中，我们必须同时断言这两个请求和响应，因为我们将它们合并为整个流的结果。我们的模拟响应看起来像所示：\n\
  \n现在，让我们测试获取食谱详情：\n\n```javascript\nit('should fetch recipe details', async () =>\
  \ {\n    const recipeDetails$ = service.getRecipeDetails$(dummyRecipe.id);\n   \
  \ const recipeDetails = firstValueFrom(recipeDetails$);\n```\n\n（注：由于原文文本中存在部分重复的段落和代码，译文已按照逻辑结构进行整合，并确保所有非代码内容均已翻译。）\n\
  \n---\n\n# 使用 MSW 模拟 API 调用\n\n在之前的实战教程中，我们已经看到 Angular 的 `HttpTestingController`\
  \ 类如何帮助我们模拟与外部服务的集成，并防止触发真实的 HTTP 请求。\n\n在本实战教程中，我们将探索如何能够通过使用 **Mock Service Worker\
  \ (MSW)** 库来进一步简化这一过程。总的来说，MSW 就像是浏览器和外部服务之间的一个代理，因此它非常适合用来拦截（interfere）所有正在进行的请求，并返回我们想要的内容，而不是去调用真实的后端服务。\n\
  \n## 准备工作\n\n\n\n\n\n在本教程中，我们将测试在 *第一章* 中实现的网络请求服务（[`github.com/PacktPublishing/RxJS-Cookbook-for-Reactive-Programming/tree/main/Chapter01/network-requests`](https://github.com/PacktPublishing/RxJS-Cookbook-for-Reactive-Programming/tree/main/Chapter01/network-requests)）。\n\
  \n由于 `MSW` 仅与 `Jest` 配合使用，我们首先需要在 Angular 项目中配置测试使用 `Jest`，而不是默认的测试框架 `Jasmine`\
  \ 和 `Karma`。我们可以通过使用 `jest-preset-angular` 库来实现。我们将在前一个教程中过的过的测试用例场景，但这次，我们将看到 `MSW`\
  \ 的威力，以及我们如何简化 RxJS 副作用（如网络请求和错误）的测试过程。\n\n### Jest 设置\n\n为了让教程的重点放在编写测试上，我们将跳过\
  \ `Jest` 的设置部分。如果你需要更多关于如何操作的信息，可以查看 Tim Deschryver 的这篇精彩博客，介绍了如何将 `Jest` 集成到 Angular\
  \ 应用程序和库中：[`timdeschryver.dev/blog/integrate-jest-into-an-angular-application-and-library#`](https://timdeschryver.dev/blog/integrate-jest-into-an-angular-application-and-library#)。\n\
  \n### 步骤 1 – 设置 TestBed\n\n为了能够模拟与外部服务的 HTTP 通信，我们首先需要在每个测试之前通过从 `mocks/node.ts`\
  \ 文件导入服务器来启动 `MSW`。之后，我们将在每个测试开始时设置 `TestBed` 模块。\n\n在我们的 `recipe.service.spec.ts`\
  \ 文件中，有如下配置：\n\n```\nbeforeEach(() => {\n    TestBed.configureTestingModule({\n\
  \        providers: [\n            provideHttpClient(),\n            RecipesService\n\
  \        ],\n    });\n    service = TestBed.inject(RecipesService);\n});\nbeforeAll\
  \ (() => {\n    server.listen();\n});\n```\n\n现在，与前一个教程的区别在于，我们不再需要将 `provideHttpClientTesting`\
  \ 放入 `providers` 数组，也不需要注入 `HttpTestingController`。此外，请注意，在运行所有测试之前，我们需要调用 `MSW`\
  \ 提供的模拟服务器上的 `listen()` 方法。这将启动 `MSW` 并拦截所有指向真实后端服务的 API 调用。\n\n### 步骤 2 – 测试简单的\
  \ HTTP 请求\n\n在我们的 `recipe.service.ts` 文件中，我们有一个发送 HTTP 请求的 `getRecipes$` 服务方法，因此针对该外部通信的集成测试看起来如下：\n\
  \n```\ntest('should fetch a list of recipes', async () => {\n    const recipes$\
  \ = service.getRecipes$()\n    const response = await firstValueFrom(recipes$)\n\
  \    expect(response).toStrictEqual([{\n        \"id\": 1,\n        \"name\": \"\
  Spaghetti Aglio e Olio\",\n        \"description\": \"Simple yet flavorful pasta\
  \ with\n                       garlic, olive oil, and chili\n                  \
  \     flakes\",\n        \"ingredients\": [\"spaghetti\", \"garlic\", \"olive oil\"\
  ,\n                        \"chili flakes\", \"parmesan cheese\",\n            \
  \            \"parsley\"]\n    }])\n});\n```\n\n让我们看看在上一个测试中做了什么：\n\n1. 我们调用 `getRecipes$`\
  \ 方法来触发请求。\n2. 接着，请求会被 `MSW` 自动拦截，并返回一个模拟响应。\n3. 接下来，使用 `firstValueFrom` 操作符提取响应值。\n\
  4. 最后，我们进行 `Jest` 断言，以检查响应是否确实是我们预期的内容。\n\n### 步骤 3 – 顺序测试多个请求\n\n在我们的 `recipe.service.ts`\
  \ 文件中，我们有一个 `getRecipeDetails$()` 方法，它会顺序发送两个请求，一个接一个。\n\n这意味着在测试中，我们必须断言这两个正在进行的请求和响应，因为我们将它们组合作为整个流的结果：\n\
  \n```\ntest('should fetch recipe details', (done) => {\n    const dummyRecipe =\
  \ {\n        id: 1,\n        name: 'Spaghetti Aglio e Olio',\n        description:\
  \ 'Simple yet flavorful pasta with\n                      garlic, olive oil, and\
  \ chili flakes',\n        ingredients: ['spaghetti', 'garlic']\n    };\n    const\
  \ dummyDetails = {\n        id: 1,\n        prepTime: 7200000,\n        cuisine::\
  \ 'Italian',\n        diet: 'Vegetarian',\n        url: '/assets/images/spaghetti.jpg',\n\
  \        nutrition: {\n              calories: 450,\n              fat: 15,\n  \
  \            carbs: 70,\n              protein: 10\n        }\n    };\n    const\
  \ recipes$ = service.getRecipeDetails$(\n                                 dummyRecipe.id)\n\
  \    const {\n        recipe,\n        details\n    } = await firstValueFrom(recipes$)\n\
  \    expect(recipe).toEqual(dummyRecipe);\n    expect(details).toEqual(dummyDetails);\n\
  ```\n\n让我们看看在上一个测试中做了什么：\n\n1. 我们调用 `getRecipesDetails$` 方法按顺序触发两个请求，一个接一个。\n2.\
  \ 请求会被 `MSW` 自动拦截，并返回一个模拟响应。\n3. 使用 `firstValueFrom` 操作符提取响应值。\n\n### 步骤 4 – 并行测试多个请求\n\
  \n在我们的 `recipe.service.ts` 文件中，我们有一个 `getRecipesWith$` 方法，它并行发送多个请求。\n\n以下是测试这些请求的方法：\n\
  \n```\ntest('should fetch images in parallel', (done) => {\n    const dummyImages\
  \ = [\n    {\n        \"id\": 1,\n        \"url\": \"/assets/images/spaghetti.jpg\"\
  \n    },\n    {\n        \"id\": 2,\n        \"url\": \"/assets/images/chicken_tikka_masala.jpg\"\
  \n    }\n    ]\n    const recipes$ = service.getRecipesWithParallel()\n    const\
  \ images = await firstValueFrom(recipes$)\n    expect(images).toStrictEqual(dummyImages);\n\
  });\n```\n\n将这种方法与前一个教程的方法相比，由于 `MSW` 的威力，注意我们的集成测试变得多么简单。\n\n### 步骤 5 – 测试错误\n\n\
  在我们的服务中，我们有一个 `getRecipes$` 方法发送简单的 HTTP 请求，但在发生错误时也有 `catchError` 处理器：\n\n```\n\
  test('request error', waitForAsync(async () => {\n    server.use([\n        http.get('/api/recipes',\
  \ async ({ request }) => {\n            return HttpResponse.error()\n        })\n\
  \    ])\n    const recipes$ = service.getRecipes$()\n    const errorResponse = await\
  \ firstValueFrom(recipes$)\n    expect(errorResponse.message).toStrictEqual('Something\
  \ went wrong.');\n}));\n```\n\n这里在使用 `MSW` 会变得有点棘手。在同一个 MSW 处理器中无法同时处理成功和错误情况，因此如果我们想在测试中模拟错误，我们必须用错误处理器覆盖原始处理器，以返回一个模拟错误响应。\n\
  \n之后，流程与之前的方法相同：我们调用服务方法，使用 `firstValueFrom` 操作符提取响应，并断言错误信息。\n\n\n\n\n\n在本教程中，我们将回顾食谱应用程序示例，并为\
  \ NgRx 的不同部分编写单元测试和集成测试，例如：\n\n*   Store（存储）\n*   Selectors（选择器）\n*   Actions（动作）\n\
  *   Effects（副作用）\n\n### 步骤 1 – 设置模拟 store (mock store)\n\n为了测试选择器是否切分了我们可以在组件内订阅的状态正确部分，我们首先需要在单元测试内部设置一个模拟\
  \ store。我们可以使用来自 `ngrx/store/testing` 包的 `provideMockStore` 方法轻松地实现这一点：\n\n```javascript\n\
  describe('RecipesSelectors', () => {\n    const initialState: AppState = {\n   \
  \     recipesState: {\n            recipes: [\n            {\n              \"id\"\
  : 1,\n              \"name\": \"Spaghetti Aglio e Olio\",\n              \"description\"\
  : \"Simple yet flavorful pasta\n                              with garlic, olive\
  \ oil, and\n                              chili flakes\",\n              \"ingredients\"\
  : [\"spaghetti\", \"garlic\", \"olive\n                               oil\", \"\
  chili flakes\",  \n                               \"parmesan cheese\", \n      \
  \                         \"parsley\"],\n              \"image\": \"/assets/images/spaghetti.jpg\"\
  \n            },\n            ],\n            selectedRecipe: null,\n          \
  \  error: null,\n            loading: false\n        }\n    };\n    let store: MockStore;\n\
  \    beforeEach(() => {\n        TestBed.configureTestingModule({\n            providers:\
  \ [provideMockStore()]\n        });\n        store = TestBed.inject(MockStore);\n\
  \    });\n});\n```\n\n### 步骤 2 – 测试 store 选择器\n\n在设置模拟 store 后，我们可以调用该选择器上的 `projector`\
  \ 函数，并传递我们想要单元测试的状态片段：\n\n```javascript\nit('should select the recipes state', ()\
  \ => {\n    const result = selectRecipesState.projector(\n        initialState.recipesState\n\
  \    );\n    expect(result.recipes.length).toEqual(1);\n    expect(result.recipes[0].id).toEqual(1);\n\
  });\n```\n\n实现相同操作的另一种方法是通过通过 `provideMockStore` 提供选择器状态，如下：\n\n```javascript\n\
  provideMockStore({\n    selectors: [\n    {\n        selector: selectRecipesState,\n\
  \        value: [\n        {\n            \"id\": 1,\n            \"name\": \"Spaghetti\
  \ Aglio e Olio\",\n            \"description\": \"Simple yet flavorful pasta with\n\
  \                            garlic, olive oil, and chili\n                    \
  \        flakes\",\n            \"ingredients\": [\"spaghetti\", \"garlic\", \"\
  olive\n                             oil\", \"chili flakes\",\n                 \
  \           \"parmesan cheese\", \"parsley\"],\n            \"image\": \"/assets/images/spaghetti.jpg\"\
  \n        },\n      ]\n    },\n  ]\n}),\n```\n\n之后，我们可以在测试中订阅 store 选择器。在这种情况下，我们的测试看起来像所示：\n\
  \n```javascript\nit('should select the recipes state', (done) => {\n    store.select(selectRecipesState).subscribe(\n\
  \        (mockBooks) => {\n        expect(mockBooks).toEqual([\n        {\n    \
  \         id: 'mockedId',\n             volumeInfo: {\n                 title: 'Mocked\
  \ Title',\n                 authors: ['Mocked Author'],\n             },\n     \
  \   },\n    ]);\n    done();\n  });\n});\n```\n\n### 步骤 3 – 设置集成测试和模拟动作 (mock actions)\n\
  \n在我们的 `recipes.store.spec.ts` 文件中，我们将开始配置测试套件：\n\n```javascript\ndescribe('RecipesEffects',\
  \ () => {\n    let actions$: Observable<Action>;\n    let effects: RecipesEffects;\n\
  \    let recipesService: RecipesService;\n    let testScheduler: TestScheduler;\n\
  \    beforeEach(() => {\n        TestBed.configureTestingModule({\n            imports:\
  \ [],\n            providers: [\n                RecipesService,\n             \
  \   RecipesEffects,\n                provideHttpClient(),\n                provideHttpClientTesting(),\n\
  \                provideMockActions(() => actions$)\n            ]\n        });\n\
  \        effects = TestBed.inject(RecipesEffects);\n        recipesService = TestBed.inject(RecipesService);\n\
  });\n```\n\n让我们分解一下我们在这里做了什么：\n\n1.  我们在每次执行测试之前调用了 `TestBed.configureTestingModule()`\
  \ 方法。\n2.  然后我们为 `TestBed` 传递了必要的依赖项。\n3.  最后我们注入了想要测试的服务和副作用。\n\n### 步骤 4 – 测试副作用并分发动作\n\
  \n现在，我们准备好编写集成测试了。在 `recipes.effects.ts` 文件中，我们可以注意到 `loadRecipe$` 副作用将观察 `loadRecipesAction()`\
  \ 是否被分发。`getRecipes$` 服务方法将带有 HTTP 请求被调用，该请求将返回食谱列表的响应，并带有该列表的负载分发 `loadRecipesActionSuccess()`：\n\
  \n```javascript\nit('should dispatch loadRecipesActionSuccess when the service responds\
  \ with recipes', async () => {\n    // 食谱列表，检查 mocks/mock.json 文件\n    const mockRecipes\
  \ = []\n    spyOn(\n        recipesService,\n        'getRecipes$'\n    ).and.returnValue(of([mockRecipes]));\n\
  \    actions$ = of(loadRecipesAction());\n    const effectResult =\n        await\
  \ firstValueFrom(effects.loadRecipes$);\n    expect(effectResult).toEqual(\n   \
  \     loadRecipesActionSuccess({ recipes })\n    );\n});\n```\n\n在编写测试时，检查反向的错误情况始终是一个良好的做法，即我们故意让测试失败，以确之确定测试是否在正常工作：\n\
  \n```javascript\nspyOn(recipesService, 'getRecipes$').and.returnValue(of([\n   \
  \ ...recipes,\n    {\n        \"id\": 6,\n        \"name\": \"Spaghetti Carbonara\"\
  ,\n        \"description\": \"Rich and creamy pasta with\n                     \
  \   pancetta, eggs, and cheese.\",\n        \"ingredients\": [\"spaghetti\", \"\
  pancetta\", \"eggs\",\n                        \"parmesan cheese\", \"black pepper\"\
  ],\n        \"image\": \"/assets/images/spaghetti_carbonara\"\n    }\n]));\n```\n\
  \n因此，如果我们在服务的返回值中再添加一个食谱，我们的测试应该由于以下错误而失败：\n\n![Figure 4.1: Failing test error](img/B09031_04_1.png)\n\
  \n图 4.1：测试失败\n\n现在，我们可以安全地说我们的测试按预期工作，没有产生虚假的测试用例。\n\n### 步骤 5 – 测试副作用错误\n\n在此步骤中，我们将测试服务返回错误的情况。首先，我们将模拟错误响应，然后分发\
  \ `loadRecipesAction()` 动作，最后检查我们的副作用是否会捕获该错误以及分发的 `loadRecipesAction()` 动作：\n\n\
  ```javascript\nit('should dispatch loadRecipesActionError when the service responds\
  \ with an error', async () => {\n    const error = new Error('Error loading recipes');\n\
  \    spyOn(recipesService, 'getRecipes$').and.returnValue(\n        throwError(()\
  \ => 'error')\n    );\n    actions$ = of(loadRecipesAction());\n    const effectResult\
  \ =\n        await firstValueFrom(effects.loadRecipes$);\n    expect(effectResult).toEqual(loadRecipesActionError({\n\
  \        error: error.message\n    }));\n});\n```\n\n\n\n\n\n在 Web 端提供卓越用户体验的关键方面之一是\
  \ 性能。`RxJS` 中的性能优化涉及对数据流的仔细管理，以及策略性地使用操作符来简化应用程序中的异步操作。关键技术包括过滤不必要的发射、异步处理、高效的数据组合以及防止内存泄漏。通过采用这些策略，你可以最大限度地减少冗余计算，降低渲染开销，并创建更具响应性且更流畅的用户体验。\n\
  \n在本章中，我们将涵盖以下食谱：\n\n*   通过策略性选择操作符优化 `RxJS` 流\n*   创建一个自定义的核心 Web 指标（Core Web Vitals）性能监控系统\n\
  *   结合 `RxJS` 使用 Web Workers\n\n# 技术要求\n\n完成本章，你需要以下内容：\n\n*   `Angular` v19+\n\
  *   `RxJS` v7\n*   `Node.js` v22+\n*   `npm` v11+ 或 `pnpm` v10+\n\n本章食谱的代码可以在本书的\
  \ GitHub 仓库中找到：[`github.com/PacktPublishing/RxJS-Cookbook-for-Reactive-Programming/tree/main/Chapter05`](https://github.com/PacktPublishing/RxJS-Cookbook-for-Reactive-Programming/tree/main/Chapter05)。\n\
  \n# 通过策略性选择操作符优化 RxJS 流\n\n尽管 `RxJS` 被认为是一个高性能的库，但如果我们不留意，可能会在系统中引入性能瓶颈。为了防止这种情况的发生，我们需要理解什么可能导致低效的\
  \ `RxJS` 流：\n\n*   过度订阅和内存泄漏\n*   低效的操作符和复杂的管道\n*   复杂的数据流\n*   对冷 Observable（cold）和热\
  \ Observable（hot））的误解\n\n## 如何实现……\n\n在这个食谱中，我们将处理并防止一个简单 `RxJS` 流中的大多数潜在性能瓶颈，例如根据搜索查询发送\
  \ HTTP 请求的搜索输入。我们还将创建一个简单的自定义 `RxJS` 操作符来对流执行的速度进行基准测试。\n\n### 第一步 – 创建事件流\n\n首先，我们将在\
  \ UI 中定义一个简单的输入并创建一个用户输入事件流。在 `app.component.html` 中输入以下内容：\n\n```\n<input #input\
  \ type=\"text\" />\n```\n\n然后，在 `app.component.ts` 文件中，可以使用 `fromEvent` 操作符来创建一个事件流：\n\
  \n```\n@ViewChild('input') input!: ElementRef;\nngAfterViewInit(): void {\n    const\
  \ input$ = fromEvent<KeyboardEvent>(\n        this.input.nativeElement, 'input'\
  \     );\n}\n```\n\n### 第二步 – 为了效率而转换数据流\n\n如果我们订阅当前的流，将得到一个 `InputEvent` 值的 `Observable`\
  \ 流。但我们只对输入值感兴趣，其他内容都不感兴趣。此外，如果输入为空，我们不想发送请求，因为我们知道结果应该是一个空列表。通过使用 `RxJS` 的 `map`\
  \ 和 `filter` 操作符来实现这一点：\n\n```\ninput$.pipe(\n    map((event: Event) =>\n      \
  \  (event.target as HTMLInputElement).value),\n    filter((value) => value.trim().length\
  \ > 0),\n)\n```\n\n### 第三步 – 过滤以减少数据流\n\n目前，每当用户输入内容时，都会发射新值。这是不高效的，因为每次发射都会向 API\
  \ 发送新请求。此外，我们希望防止应用程序对每一个变化都反应过快，以便获得更流畅、响应更迅速的用户体验。我们可以通过 `debounceTime` 和 `distinctUntilChanged`\
  \ 对事件进行速率限制，进一步缩小数据并优化流：\n\n```\ninput$.pipe(\n    debounceTime(300),\n    map((event:Event)\
  \ =>\n        (event.target as HTMLInputElement).value),\n    distinctUntilChanged(),\n\
  \    filter((value) => value.trim().length > 0),\n)\n```\n\n### 第四步 – 取消不必要的请求\n\
  \n当用户输入搜索查询且我们获得最新的过滤查询时，我们希望向 API 发送 HTTP 请求以根据该查询获取结果。为了确保只有最新的搜索词触发 API 请求，并在用户快速打字时取消之前的所有请求，可以使用使用高阶\
  \ `switchMap` `Observable`。通过这样做，我们可以优化从 API 将结果传递给用户的方式：\n\n```\ninput$.pipe(\n\
  \    debounceTime(300),\n    map((event: Event) =>\n        (event.target as HTMLInputElement).value),\n\
  \    distinctUntilChanged(),\n    filter((value) => value.trim().length > 0),\n\
  \    switchMap((value) =>\n        this.recipesService.getRecipes$(value)),\n)\n\
  ```\n\n以下是 `switchMap` 可以帮助我们的一些方法：\n\n*   **防止内存泄漏**：它防止了由于多个内部 `Observables` 同时保持订阅和激活而可能发生的内存泄漏，即使在它们不再需要时也会消耗资源。\n\
  *   **防止资源累积**：如果没有 `switchMap`，如果源 `Observable` 快速发射值，可能会导致多个待处理异步操作堆积。`switchMap`\
  \ `Observable` 确保只有最新的操作是活跃的，防止资源浪费。\n*   **简化嵌套订阅**：在复杂的数据流中，你可能需要嵌套订阅多个 `Observables`。`switchMap`\
  \ `Observable` 扁平了这种嵌套，使代码更具可读性和维护性。\n*   **避免订阅管理开销**：嵌套场景下的手动订阅管理容易出错。\n\n###\
  \ 第五步 – 缓存结果\n\n想象这样一个场景：多个组件想要用户搜索某个术语时获得的相同结果。为了确保多个订阅者接收到相同的值，并缓存发射的值，可以使用 `shareReplay`\
  \ 操作符：\n\n```\ninput$.pipe(\n    map((event: Event) =>\n        (event.target as\
  \ HTMLInputElement).value),\n    debounceTime(300),\n    distinctUntilChanged(),\n\
  \    filter((value) => value.trim().length > 0),\n    switchMap((value) =>\n   \
  \     this.recipesService.getRecipes$(value)),\n  shareReplay(1)\n)\n```\n\n在这种情况下，`shareReplay`\
  \ 将冷 `Observable` 转换为热 `Observable`。\n\n## 热与冷 Observable\n\n理解热冷 Observable 区别对于有效管理资源和数据流至关重要，也可以避免\
  \ `RxJS` 应用程序中的意外行为。可以将冷 Observable 想象成工厂，每当有人想要产品时就会创建一个产品。冷 Observable 在简单情况下更高效，因为它们只在需要时产生数据，并且每个订阅执行一次。我们称冷\
  \ Observable 为单播，因为每个订阅者接收到独立的数据序列。可以将热 Observable 想象成电台，无论是否有人听都在广播。热 Observable\
  \ 在规模较大和实现缓存机制时性能更高。这就是为什么我们把热 Observable 称为多播（multicast）——流将执行一次，所有订阅者将获得相同的值。\n\
  \n### 第六步 – 防止内存泄漏\n\n讽刺的是，`shareReplay` 操作符的使用可能会导致整个应用程序出现内存泄漏。我们在这里使用方式会导致流在组件销毁时始终保持活跃。我们可以通过向\
  \ `shareReplay` 操作符传递 `refCount` 参数来控制这一点：\n\n```\ninput$.pipe(\n    map((event:\
  \ Event) =>\n        (event.target as HTMLInputElement).value),\n    debounceTime(300),\n\
  \    distinctUntilChanged(),\n    filter((value) => value.trim().length > 0),\n\
  \    switchMap((value) =>\n        this.recipesService.getRecipes$(value)),\n  \
  \  shareReplay({ bufferSize: 1, refCount: true }),\n    takeUntil(this.destroy$)\n\
  )\n```\n\n\n\n\n\n让我们逐步仔细查看这段代码：\n\n1.  我们将 `bufferSize` 设置为 `1`，这样我们只重放最后一次的缓存值。\n\
  2.  我们传递 `refCount` 来跟踪活跃订阅者的数量。当订阅者数量降为 `0` 时，底层的 `Observable` 将自动取消订阅，并且其资源将得到清理。\n\
  3.  最后，在组件销毁后，我们使用 `takeUntil` 从流中取消订阅。\n\n## `shareReplay` 在底层是如何工作的？\n\n在底层，`shareReplay`\
  \ 算符利用 `ReplaySubject` 来能够管理从源 `Observable` 发射到多个订阅者的多路复值。默认情况下，`shareReplay` 将永久缓存已传递的缓冲区值。即使订阅者数量降为零，它也不会从\
  \ `ReplaySubject` 取消订阅。如果我们不小心，这可能会导致应用程序中出现内存泄漏，但当我们希望避免对频繁使用的 `Observables` 进行昂贵的计算时，我们可能希望这样做。如果我们想对这种行为进行程序化控制，`shareReplay`\
  \ 提供了一个可以作为参数传递的配置对象。此外，如果我们希望取消订阅由 RxJS 自动处理，我们可能会考虑使用 `share` 算符。\n\n另一种常用技术是使用\
  \ `takeUntil` 算符，它可以帮助我们优雅地管理 `Observable` 订阅的生命周期。虽然它通常用于组件销毁，但它也可以广泛应用于根据外部事件或条件控制数据流。\n\
  \n## `takeUntil` – 一个常见的陷阱\n\n关于 `takeUntil` 算符最常见的误解之一是它在流中的位置。顺序非常重要！`takeUntil`\
  \ 的位置决定了哪些算符受通知器影响以及以什么顺序影响。最常见且直接的放置方式是在算符链的末尾。这允许整个算符流处理值，直到通知器 `Observable` 发射。如果我们把\
  \ `takeUntil` 放置在流的中间，就可以选择性地控制流的哪些部分受通知器影响。它也可以被放置在高阶 `Observable`（如 `switchMap`、`mergeMap`\
  \ 或 `concatMap`）内部，以控制内部 `Observables` 的寿命。能够灵活地放置 `takeUntil` 算符使我们能够对 `Observable`\
  \ 流进行细粒度的控制，并有助于有效管理它们的生命周期。\n\n### 步骤 7 – 测量 RxJS 流性能\n\n正如我们可以使用内置的 `Performance\
  \ API` 测量性能一样，我们可以在 RxJS 中创建类似的东西来标记流的开始和结束。为了实现这个目的，我们将创建自定义算符，并将它们仔细地放置在我们想要监控的流中：\n\
  \n```\nexport function startMeasurePerformance<T>() {\n    return (source$: Observable<T>)\
  \ => new Observable<T>(\n        observer => {\n        const subscription = source$.pipe(\n\
  \            skipUntil(source$)\n        ).subscribe({\n        next(value) {\n\
  \            performance.mark('start')\n            observer.next(value);\n    \
  \    },\n        error(err) { observer.error(err); },\n        complete() { observer.complete();\
  \ }\n    });\n    return subscription;\n});\n}\n```\n\n一旦我们将 `startMeasurePerformance`\
  \ 算符放置在流的开头并标记性能监控的开始，就可以将 `measurePerformance` 放在流的末尾：\n\n```\nexport function\
  \ measurePerformance<T>() {\n    return (source$: Observable<T>) => new Observable<T>(\n\
  \        observer => {\n        const subscription = source$.subscribe({\n     \
  \       next(value) {\n                observer.next(value);\n                performance.mark('end');\n\
  \                performance.measure(\n                    'Measure between start\
  \ and end',\n                    'start',\n                    'end'\n         \
  \       );\n                const measure = performance\n                .getEntriesByName(\n\
  \                    'Measure between start and end')\n                [0];\n  \
  \              console.log(`\n                    Duration between start and end:\n\
  \                        ${measure.duration} milliseconds.\n                `);\n\
  \                performance.clearMarks();\n                performance.clearMeasures();\n\
  \            },\n            error(err) { observer.error(err); },\n            complete()\
  \ { observer.complete(); }\n        });\n        return subscription;\n    });\n\
  }\n```\n\n## 另另\n\n*   Dmytro Mezhenskyi 关于 `shareReplay` 隐藏陷阱的视频：[`www.youtube.com/watch?v=mVKAzhlqTx8&t`](https://www.youtube.com/watch?v=mVKAzhlqTx8&t)\n\
  *   Joshua Morony 关于通过 `share` 和 `shareReplay` 算符提高性能的精彩视频：[`www.youtube.com/watch?v=H542ZSyubrE`](https://www.youtube.com/watch?v=H542ZSyubrE)\n\
  *   Dominic Elm 的高级缓存机制博客：[`blog.thoughtram.io/angular/2018/03/05/advanced-caching-with-rxjs.html`](https://blog.thoughtram.io/angular/2018/03/05/advanced-caching-with-rxjs.html)\n\
  *   `shareReplay` 算符：[`rxjs.dev/api/index/function/shareReplay`](https://rxjs.dev/api/index/function/shareReplay)\n\
  *   `share` 算符：[`rxjs.dev/api/index/function/share`](https://rxjs.dev/api/index/function/share)\n\
  \n# 创建自定义 Core Web Vitals 性能监控系统\n\n作为 Web API 规范的一部分，浏览器运行时包含的功能之一是 `PerformanceObserver`。该观察者可以测量记录在浏览器性能时间线上的事件，并帮助我们跟踪应用程序中最重要的性能指标。\n\
  \n## 如何实现……\n\n在这个食谱中，我们将构建一个小型自定义性能观察者来跟踪 `Core Web Vitals` 指标并改进应用程序的性能，这是我们在确定性能瓶颈后需要做的。一旦收集了指标信息，我们就可以将其发送到\
  \ API 服务。\n\n### 步骤 1 – 设置性能观察者\n\n由于 `PerformanceObserver` Web API 不遵循标准的 `addEventListener/removeEventListener`\
  \ 事件注册模式，我们无法使用 RxJS 的 `fromEvent` 算符。相反，我们必须使用 `fromEventPattern` 算符，它可以帮助我们根据自定义事件模式发射事件，并为\
  \ `PerformanceObserver` 创建 RxJS 封装。\n\n首先，在 `service/web-vitals-observer.ts` 服务中，我们将设置\
  \ `PerformanceObserver`：\n\n```\npublic observePerformanceEntry(\n    entryType:\
  \ string\n): Observable<PerformanceObserverEntryList> {\n    this.performanceObserver$\
  \ = \n        fromEventPattern<PerformanceObserverEntryList>(\n            (handler)\
  \ => {\n                const observer = new PerformanceObserver(\n            \
  \        (list) =>handler(list.getEntries()));\n                observer.observe({\n\
  \                    entryTypes: [entryType],\n                    buffered: true\n\
  \                });\n                return observer;\n            },\n       \
  \     (handler, observer) => observer.disconnect()\n        );\n    return this.performanceObserver$;\n\
  }\n```\n\n让我们分解一下为止所做的：\n\n1.  首先，我们实例化了 `PerformanceObserver` 并传递了处理回调函数，一旦我们调用\
  \ `observe()` 方法并且为某个 `entryType` 属性记录了性能条目，该函数就会被调用。\n\n\n\n\n2. 然后，我们指定了浏览器需要观察的性能条目集。以下是我们可以作为\
  \ `entryType` 属性传递的值：\n\n*   `largest-contentful-paint`\n*   `layout-shift`\n* \
  \  `first-input`\n*   `paint`\n\n3. 最后，我们返回了 `performanceObserver$`，这样我们就可以从任何需要的组件中进行订阅。\n\
  \n### 第二步 – 观察性能条目\n\n在我们的 `app.component.ts` 文件中，我们根据不同的条目类型定义不同的性能流：\n\n```\n\
  private firstInputPaint$ =\n    this.webVitalsObserverService\n        .observePerformanceEntry('paint');\n\
  private firstContentfulPaint$ =\n    this.webVitalsObserverService\n        .observePerformanceEntry('first-input');\n\
  private cumulativeLayoutShift$ =\n    this.webVitalsObserverService\n        .observePerformanceEntry('layout-shift');\n\
  private largestContentfulPaint$ =\n    this.webVitalsObserverService\n        .observePerformanceEntry(\n\
  \            'largest-contentful-paint');\n```\n\n现在，我们可以合并所有这些流，为我们的自定义分析收集性能指标，并获得关于\
  \ Web 页面加载时间、累积布局偏移、用户时间交互等更多重要洞察：\n\n```\nloading = true;\nngOnInit(): void {\n\
  \    setTimeout(() => {\n        // 模拟累积布局偏移 (Cumulative Layout Shift)\n       \
  \ this.loading = false;\n    }, 2000);\n    merge(\n        this.firstInputPaint$,\n\
  \        this.largestContentfulPaint$,\n        this.firstContentfulPaint$,\n  \
  \      this.cumulativeLayoutShift$\n    ).subscribe((entry) => console.log(entry));\n\
  }\n```\n\n### 另另\n\n*   `PerformanceObserver` Web API：[`developer.mozilla.org/en-US/docs/Web/API/PerformanceObserver`](https://developer.mozilla.org/en-US/docs/Web/API/PerformanceObserver)\n\
  *   Web Vitals 文章：https://web.dev/articles/vitals\n*   RxJS 的 `fromEventPattern`\
  \ 操作符：[`rxjs.dev/api/index/function/fromEventPattern`](https://rxjs.dev/api/index/function/fromEventPattern)\n\
  \n# 配合 RxJS 使用 Web Workers\n\n我们都都知道 JavaScript 是一种单线程语言，至少在浏览器运行时环境中是这样。这意味着浏览器一次只能处理一个操作。因此，如果我们有一个长时间运行的任务，它可能会阻塞主线程，意味着浏览器冻结并阻塞整个用户体验。通常在客户端，我们不需要处理计算密集型或长时间运行的任务，但当我们确实需要处理时，可以将沉重的工作负载卸载到后台运行的独立线程中，类似于\
  \ Web Workers，这可以帮助我们防止 UI 冻结并确保交互顺畅，即使我们在执行资源密集型操作时也是如此。\n\n## 如何实现……\n\n在本食谱中，我们将通过创建一个\
  \ web worker 并运行一百万次简单转换的迭代，来模拟计算密集型操作。\n\n### 第一步 – 在 Angular 中设置 web worker\n\n\
  如果我们想让 web worker 位于 `src/app/app.component.ts`，我们只需在终端中运行以下命令：\n\n```\nng generate\
  \ web-worker app\n```\n\n在我们的示例中，web worker 将运行百万次迭代。为了模拟某种形式的数据处理，我们将执行以下操作：\n\n\
  1.  每隔五次迭代，返回 `null` 作为结果。\n2.  每隔十次迭代，返回上一次的结果，而不是当前的结果。\n3.  否则，我们将迭代次数翻倍作为结果。\n\
  4.  我们将调用 `postMessage()` 方法从 web worker 获取结果并将其发送回主线程。\n\n### 第二步 – 订阅 web worker\
  \ 消息\n\n要访问 worker 文件，我们必须实例化一个新的 `Worker` 类并提供 worker 的路径。然后，我们可以通过发送一个包含迭代次数的消息的消息来启动\
  \ worker：\n\n```\nngOnInit(): void {\n    const worker = new Worker(new URL(\n \
  \       './app.worker',\n        import.meta.url\n    ));\n    worker.postMessage({\
  \ iterations: 1_000_000 });\n    const message$ = fromEvent<MessageEvent>(\n   \
  \     worker,\n        'message'\n    );\n    message$.subscribe((data) => {\n \
  \       console.log('Received message from worker:', data);\n    });\n}\n```\n\n\
  之后，我们已经准备好创建一个消息事件流并对其做出反应。但如果我们打开开发者工具并开始使用该应用程序，一段时间后，应用程序将变得越来越慢，尽管我们在后台处理一个长时间任务。\n\
  \n这意味着我们可以获取消息订阅并应用额外的性能优化。\n\n### 第三步 – 优化 worker 消息流\n\n目前，我们可以看到几个领域还有改进空间：\n\
  \n*   我们获得了整个 `MessageEvent` 接口作为流的结果，但我们只对 `data` 感感兴趣。\n*   结果包含了 `null` 值。\n\
  *   存在连续的重复值。\n*   事件数量导致控制台因内存负载而崩溃。\n\n我们可以通过应用某些 RxJS 操作符来解决并修复这些问题：\n\n```\n\
  const message$ = fromEvent<MessageEvent>(\n    worker,\n    'message'\n).pipe(\n\
  \    filter(( { data } ) => data !== null),\n    map(({ data }) => data),\n    distinctUntilChanged(),\n\
  \    bufferCount(1000),\n    share()\n);\n```\n\n让我们分解一下我们在这里所做的：\n\n1.  首先，我们使用\
  \ `filter` 操作符排除了 `null` 值。\n2.  然后，我们通过 `map` 转换了数据，而不是整个 web worker 事件。\n3.  接着，我们使用\
  \ `distinctUntilChanged` 过滤掉了重复值。\n4.  然后，我们通过 `bufferCount` 收集了 1000 个事件并将其放入缓冲区。这样做显著改进了内存使用。\n\
  5.  通过使用 `throttleTime`，我们跳过了每隔 10 毫秒的消息，因为并不是所有消息都重要。\n6.  最后，我们使用 `share` 将结果立即返回给多个订阅者。\n\
  \n现在，我们的消息流在传递消息时更加高效。\n\n## 参考\n\n*   Angular 关于 Web Workers 的指南：[`angular.dev/ecosystem/web-workers#adding-a-worker`](https://angular.dev/ecosystem/web-workers#adding-a-worker)\n\
  *   MDN Web Workers 文档：[`developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Using_web_workers`](https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Using_web_workers)\n\
  *   RxJS 的 `bufferCount` 操作符：[`rxjs.dev/api/operators/bufferCount`](https://rxjs.dev/api/operators/bufferCount)\n\
  *   RxJS 的 `throttleTime` 操作符：[`rxjs.dev/api/operators/throttleTime`](https://rxjs.dev/api/operators/throttleTime)\n\
  *   RxJS 的 `share` 操作符：[`rxjs.dev/api/operators/share`](https://rxjs.dev/api/operators/share)\n\
  \n# 6\n\n# 使用 RxJS 构建响应式状态管理系统\n\n状态管理是困难的，这很有道理。如果我们想象一个完美的状态管理库，该库的主要特性将是扩展性、预测性、性能、可维护性和开发者体验以及灵活性。RxJS\
  \ 可以帮助我们实现所有这些。通过高效地管理整个应用程序的数据流和用户交互，它可以让状态更具可扩展性。我们可以将状态更改建模为事件流，从而更容易理解状态复杂度。此外，RxJS\
  \ 允许我们以声明的方式表示状态更改，并以自然的方式对状态更改做出反应，更改发生时会自动传播到整个系统中，这可以带来更优的状态更新。在本章中，我们将涵盖一些先进且复杂的管理\
  \ RxJS 状态的方法：\n\n*   构建自定义客户端状态管理\n*   在 Angular 中使用 NgRx 进行状态管理\n*   TanStack Query\
  \ 遇见 RxJS – 使用 Angular 和 RxJS 构建你自己的 TanStack query\n\n\n\n\n# 技术要求\n\n为了学习本章节的内容，你需要以下环境：\n\
  \n* Angular v19+\n* RxJS v7\n* Node.js v22+\n* npm v11+ 或 pnpm v10+\n\n本章中各个食谱的代码可以在此\
  \ GitHub 仓库中找到：[`github.com/PacktPublishing/RxJS-Cookbook-for-Reactive-Programming/tree/main/Chapter06`](https://github.com/PacktPublishing/RxJS-Cookbook-for-Reactive-Programming/tree/main/Chapter06)\n\
  \n# 构建自定义客户端状态管理\n\n想象一下我们在引言中提到的完美状态管理。那个状态管理器应该具备哪些功能？它可能会结合现有优秀库中的最佳特性。我们期望拥有以下功能：\n\
  \n* **全局状态访问**：从任何组件都能轻松访问状态\n* **可预测的状态更新**：无意外的副作用\n* **可扩展性**：轻松将应用程序扩展到无限数量的新模块/功能，轻松管理数据流复杂性\n\
  * **响应式**：每当状态更新时，自动刷新组件状态\n* **细粒度控制**：能够创建更小、更易管理的状态切片，每个切片负责一个特定领域\n* **性能**：通过针对性的重新渲染实现高效的状态更新，提供尽可能优的用户体验\n\
  * **错误和副作用处理**：优雅地处理网络请求并创建健性的错误处理机制\n* **开发者体验**：清晰简洁的用法，思考状态变化时易理解的心理模型，以及集成的调试工具\n\
  \n我们知道有很多库可以解决这些问题，但为了真正理解一个库，让我们尝试从零创建一个自己的极简 Redux 风格状态管理，并理解这种系统背后的底层复杂性。\n\n\
  Redux 数据流通常看起来如下所示：\n\n![Figure 6.1: Redux mental model](img/B09031_06_1.png)\n\n\
  图 6.1：Redux 心理模型\n\n## 如何实现……\n\n在这个示例中，我们将构建一个小型**烹饪食谱（Cooking Recipes）**应用程序，我们将从模拟数据（使用\
  \ `MockServiceWorker`）加载食谱列表并在列表中显示它们。此外，我们能够知道当前选中了哪一个食谱，并将其表示在独立的状态中。对于这个食谱，我们不使用任何状态管理库，而是构建自己的自定义库。\n\
  \n### 第 1 步 – 定义状态\n\n我们将开始创建一个 `recipes-store.service.ts` 文件，作为状态管理器。首先，我们将状态放入一个\
  \ `BehaviorSubject` 类中。它可以为构建简单、灵活且响应式的状态提供坚实的基础。通过 `BehaviorSubject`，我们可以通过推送新值来轻松通知所有订阅者状态变化，同时也可以拉取最新的状态值，因为\
  \ `BehaviorSubject` 会维护并向所有订阅者提供当前状态值：\n\n```\nimport { BehaviorSubject } from \"\
  rxjs\";\nexport class RecipesStoreService {\n    private initialState: AppState\
  \ = {\n        recipesState: {\n            recipes: [],\n            selectedRecipe:\
  \ null,\n            error: null,\n            loading: false,\n        },\n   \
  \     ordersState: {\n            orders: [],\n        }\n    };\n    private state$\
  \ = new BehaviorSubject<AppState>(\n        this.initialState\n    );\n}\n```\n\n\
  ### 第 2 步 – 分发动作（Dispatching actions）\n\n现在我们需要某种方式提供以不可变（immutable）方式分发可以改变状态的能力。为此，我们可以使用一个\
  \ **RxJS Subject** 来建立单向通信并广播系统内部发生的事件：\n\n```\nexport class RecipesStoreService\
  \ {\n    public actions$ = new Subject<Action>();\n    constructor() {\n       \
  \ this.actions$.pipe(\n            withLatestFrom(this.state$),\n            map(([action,\
  \ state]) => rootReducer(\n                                  state, action))\n \
  \       ).subscribe((state: AppState) => {\n            this.state$.next(state);\n\
  \        });\n    }\n    dispatch({ type, payload }: Action): void {\n        this.actions$.next({\n\
  \            type,\n            payload\n        });\n    }\n}\n```\n\n分发动作后，我们将通知所有订阅者并根据其类型开始对此新动作做出响应。在接下来的代码中，我们将分发的动作与`第\
  \ 1 步`中已经定义的 `withLatestFrom` 状态相结合，并应用纯还原器函数（reducer function）以不可变的方式进行状态转换。\n\n\
  假设在我们的 `recipes.actions.ts` 中，我们有如下动作创建器：\n\n```\nexport interface Action<T = any>\
  \ {\n    type: string;\n    payload?: T;\n    error?: Error\n}\nexport const LOAD_RECIPES\
  \ = 'LOAD_RECIPES';\nexport const LOAD_RECIPES_SUCCESS = 'LOAD_RECIPES_SUCCESS';\n\
  export const LOAD_RECIPES_ERROR = 'LOAD_RECIPES_ERROR';\nexport const loadRecipesAction\
  \ = (): Action => ({\n    type: LOAD_RECIPES\n});\nexport const loadRecipesActionSuccess\
  \ = (payload:\n    Recipe[]): Action => ({\n        type: LOAD_RECIPES_SUCCESS,\n\
  \        payload\n});\nexport const loadRecipesActionError = (error: Error):\n \
  \   Action => ({\n        type: LOAD_RECIPES_ERROR,\n        error\n});\n```\n\n\
  当组件挂载时，我们将分发 `loadRecipesAction`。结果是根还原器（root reducer）将对动作做出响应并应用状态更改。我们定义的 `on`\
  \ 函数如下：\n\n```\nexport function on(\n    actionType: string,\n    reducerFn: Reducer<AppState,\
  \ Action>\n) {\n    return { actionType, reducerFn };\n}\n```\n\n### 第 3 步 – 应用状态转换的还原函数\n\
  \n在我们的 `recipes.reducer.ts` 文件中，我们将创建一个还原器，捕获分发的动作并根据动作类型及其负载进行状态转换：\n\n```\nfunction\
  \ createReducer(\n    ...ons: Record<string, any>[]\n): Reducer<AppState, Action>\
  \ {\n    return function (state: AppState, action: Action) {\n        for (let on\
  \ of ons) {\n            if (action.type === on.actionType) {\n                return\
  \ on.reducerFn(state, action);\n            }\n        }\n        return state;\n\
  \    };\n}\nexport const recipesReducer = createReducer(\n    on(LOAD_RECIPES, (state:\
  \ AppState) => Object.assign(\n        {},\n        structuredClone(state),\n  \
  \      { loading: true }\n    )`),\n    on(LOAD_RECIPES_SUCCESS, (\n        state:\
  \ AppState,\n        { payload }: Action\n    ) => Object.assign(\n        {},\n\
  \        structuredClone(state),\n        { recipes: payload ?? [], loading: false\
  \ }\n    )`),\n    on(LOAD_RECIPES_ERROR, (\n        state: AppState,\n        {\
  \ payload }: Action) => Object.assign(\n        {},\n        structuredClone(state),\n\
  \        { error: payload, loading: false }\n    )`),\n)\n```\n\n我们通过遍历所有可能的动作、过滤出实际发生的动作并对分发的动作应用\
  \ `on` 还原函数，创建一个还原函数。\n\n\n\n\n\n```typescript\nexport class RecipesService {\n\
  \    loadRecipes$ = this.recipeStore.createEffect(() => {\n        return this.recipeStore.actions$\n\
  \        .pipe(\n            ofType(LOAD_RECIPES),\n            exhaustMap(() =>\
  \ this.getRecipes().pipe(\n                map(res => loadRecipesActionSuccess(res)),\n\
  \            catchError((error: Error) =>\n            // gracefully error exit\
  \ and continue stream\n                of(loadRecipesActionError(\n            \
  \        error.message ?? error\n                ))\n             )\n        ))\n\
  \        );\n    });\n    getRecipes(): Observable<Recipe[]> {\n        return this.http.get<Recipe[]>('/api/recipes');\n\
  \    }\n    loadRecipes(): void {\n        this.recipeStore.dispatch(loadRecipesAction());\n\
  \    }\n}\n```\n\n在前面的代码中，我们有一个小型工具函数 `ofType`，它类似于 NgRx，用于过滤传入的 actions，并处理特定 action\
  \ 的副作用：\n\n```typescript\nexport function ofType(type: string) {\n    return (source:\
  \ Observable<Action>) => source.pipe(\n        filter(action => action.type ===\
  \ type)\n    );\n}\n```\n\n这里可能感兴趣的是 RxJS 中 `exhaustMap` 操作符的使用，它可以帮助我们完成以下工作：\n\
  \n*   防止冗余的 action\n*   频率限制 – 在上一个请求完成之前，不会启动新的请求\n*   顺序请求 – 如果你有一系列需要按顺序执行的操作，且每个操作都取决于上一个操作的结果，`exhaustMap`\
  \ 可以确保每个操作在下一个操作开始之前完成\n\n### `exhaustMap` 对比 `switchMap`\n\n在我们的 effect 中处理并发请求时，我们可以使用\
  \ `switchMap` 操作符实现几乎相同的结果。唯一的区别是，如果在一个正在进行的请求完成之前触发了相同的请求，它将取消之前的请求并启动新请求。相反，`exhaustMap`\
  \ 会等待第一个请求解析完成，并忽略新进入的请求。我们在这里选择的方法可能会根据不同的产品用例或个人偏好而异。\n\n很好，现在我们的 reducer 将接纳\
  \ `LOAD_RECIPES_SUCCESS` action，提取响应数据负载并更新状态。如果发生错误，将分发 `LOAD_RECIPES_ERROR` action，并用错误消息更新状态。\n\
  \n### 步骤 5 – 切分状态 (Slicing the state)\n\n现在我们已经分发 action、转换到目标状态并处理副作用了，我们可以在组件内部订阅\
  \ store 的切片并显示来自后端的数据。在 `recipes-store.service.ts` 内部，我们将创建一个 selector，它能够从应用状态中派生特定的数据：\n\
  \n```typescript\nselectState$(\n    selector?: (state: AppState) => Partial<AppState>,\n\
  \    cachedValues = 1\n): Observable<Partial<AppState>> {\n    return this.state$.asObservable().pipe(\n\
  \        map((selector || ((state) => state))),\n        shareReplay(cachedValues),\n\
  \    );\n}\n```\n\n这里可能有趣的是 `shareReplay` 操作符的使用，它在我们需要将相同的缓存值多路广播给多个订阅者的场景中特别有用。在我们的案例中，这意味着每当我们在应用程序的任何不同部分调用同一个\
  \ selector 时，后加入的状态订阅者都会获取之前发布的值。通过这种方式，我们通过立即返回最新的缓存值来优化应用性能，而无需再次计算这部分相同的状态。\n\
  \n### `shareReplay` 的底层工作原理\n\n该操作符在底层利用了 `ReplaySubject`，并通过这种方式将从源 Observable\
  \ 发布的值多路广播给多个订阅者。默认情况下，`shareReplay` 会永久缓存通过的缓冲区值数量。即使订阅者数量降为 0，它也不会从 `ReplaySubject`\
  \ 取消订阅。如果我们不小心，这可能会导致应用程序出现内存泄漏，但当我们希望避免对频繁使用的 Observable（如状态选择器）进行昂贵的计算时，我们可能想要这样做。如果我们想对这种行为进行程序化控制，`shareReplay`\
  \ 提供了一个可以作为参数传递的配置对象。此外，如果我们想让 RxJS 自动处理取消订阅，我们可能会考虑使用 `share` 操作符。\n\n最后，在我们的 `recipes-list.component.ts`\
  \ 组件中，我们可以订阅状态的一个切片：\n\n```typescript\nexport class RecipesListComponent {\n   \
  \ recipes: Recipe[] = [];\n    constructor(\n        private recipeStore: RecipesStoreService,\n\
  \        private  recipesService: RecipesService\n    ) { }\n    ngOnInit() {\n\
  \        this.recipesService.loadRecipes();\n        this.recipeStore.selectState$((\n\
  \            state: Partial<AppState>\n        ) => state.recipesState?.recipes).subscribe(\n\
  \            (recipes: Partial<AppState>) => {\n                this.recipes = recipes\
  \ as Recipe[];\n            }\n        );\n    }\n}\n```\n\n搞定！\n\n![图 6.2: 菜谱应用](img/B09031_06_2.png)\n\
  \n图 6.2: 菜谱应用\n\n现在，如果我们在浏览器中打开应用，就可以看到代表客户端状态的菜谱列表。\n\n### 步骤 6 – 创建可组合的 reducers\n\
  \n通常，我们想要组合多个 reducer 并以一种声明式的、函数的方式将它们组合起来。为了这些目的，我们将创建一个自定义函数，组合两个不同 reducer 的状态和\
  \ actions：\n\n```typescript\nfunction combineReducers<S, A>(\n    reducers: { [K\
  \ in keyof S]: Reducer<S[K], A> }\n): Reducer<S, A> {\n    return (state: S, action:\
  \ A) => {\n        if (!state) return {} as S;\n        const newState = { ...state\
  \ } as S;\n        for (let key in reducers) {\n            newState[key] = reducerskey;\n\
  \        }\n        return newState;\n    };\n}\n```\n\n现在，我们的 `rootReducer` 如下：\n\
  \n```typescript\nexport const rootReducer = combineReducers({\n    recipesState:\
  \ recipesReducer,\n    ordersState: orderReducer\n});\n```\n\n### 步骤 7 – 创建 meta-reducers\n\
  \n开发者体验是使用状态管理库的关键考虑之一。我们需要快速有效地检测 bug 并响应状态变化。为了这些目的，我们将创建一个自定义日志 meta-reducer：\n\
  \n```typescript\nexport function logMetaReducer(\n    target: Function,\n    context:\
  \ any\n) {\n    return function (...args: any[]) {\n        const [{ type, payload\
  \ }] = args;\n        console.log(`%cCalling Action: ${type}\\n`,\n            \
  \        'color: #d30b8e', payload);\n        const result = target.apply(context,\
  \ args);\n        console.log(`%cAction ${type} state:\\n`,\n                  \
  \  'color: #ffc26e', result);\n        return result;\n    };\n}\n```\n\n为了给每个 reducer\
  \ 应用 meta-reducer，我们将它封装在 `rootReducer` 围，使其变为如下：\n\n```typescript\nexport const\
  \ rootReducer = logMetaReducer(combineReducers({\n    recipesState: recipesReducer,\n\
  \    ordersState: orderReducer\n}), this);\n```\n\n在我们的控制台中，我们可以看到 meta-reducer\
  \ 运行并观察所有分发的 actions 和状态转换！\n\n![图 6.3: meta-reducer 日志](img/B09031_06_3.png)\n\n\
  图 6.3: meta-reducer 日志\n\n## 另\n\n*   MSW: [`mswjs.io/`](https://mswjs.io/)\n* \
