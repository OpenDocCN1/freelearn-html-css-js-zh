  \n![](img/QR_Code-_Rxjs_Cookbook_Discort.jpg)\n\n# 前言\n\n**RxJS** 或 **Reactive Extensions\
  \ for JavaScript**（JavaScript 响应式扩展）是一个 JavaScript 库，旨在简化处理异步数据流、组织随时间变化的事件和序列。\n\
  \n然而，社区中认为 RxJS 的学习曲线非常陡峭，尽管它拥有强大的功能。RxJS 之所以有这种声誉，一个原因是大多数教程、书籍和在线材料都集中在 RxJS 操作符上。这些资源深入解释了每个操作符的工作原理，并配有视觉图表。虽然在开始学习\
  \ RxJS 时这些资源非常有帮助且必不可少，但开发者可能仍面临挑战，如 RxJS 流的调试和优化、有效测试 RxJS 流、管理响应式状态、完全采用响应式范式，以及在现实场景中识别正确的\
  \ RxJS 操作符。\n\n\n\n\n\n`RxJS Cookbook for Reactive Programming` 采用了一种略有不同的方法。这是一本全栈书籍，强调使用\
  \ RxJS 技术、模式和操作符来构建现代 Web 应用，这些技术天然适用于特定的场景。每一章由实用的配方组成，为各种挑战提供解决方案，涵盖从客户端应用中的副作用处理和错误恢复性模式，到创建实时聊天应用程序和事件驱动的后端微服务。\n\
  \n随着学习深入，你将对响应式编程在复杂现实场景中的潜力产生深刻的理解。这本书赋予了开发者将 RxJS 无缝集成到 `Angular` 和 `NestJS` 等流行\
  \ Web 开发框架和库的能力，为开发现代、渐进、韧性、响应式、高性能且交互式的 Web 应用提供了不可价值的指南。\n\n在书结束时，你将掌握响应式编程原则、`RxJS`\
  \ 库以及 `Observables` 的用法，同时能够编写以声明式和异步方式响应数据和事件变化的代码。\n\n## 本书适用于\n\n本书非常适合想要使用 `RxJS`\
  \ 采用响应式编程原则的中中高级 JavaScript 开发者。无论你是在使用 `Angular` 还是 `NestJS`，你都能找到可以帮助你利用 `RxJS`\
  \ 管理前后端异步操作和响应式数据流的配方和真实示例。\n\n## 本书内容\n\n## 第 1 章, 处理 RxJS 中的错误和副作用\n使你掌握必要的技巧，用以优雅地处理错误并维护流的完整性，包括实现强大的韧性模式（如指数退避和断路器），确保你的应用程序保持响应和韧性。\n\
  \n你还将深入研究副作用管理的艺术，学习如何在不破坏数据流的情况下无缝执行日志记录、API 调用和 DOM 更新等任务。最后，你将探索副作用的 `WebSockets`\
  \ 引人世界，并发现如何实现心跳技术以以真正的响应式方式确保连接的完整性。\n\n## 第 2 章, 使用 RxJS 构建用户界面\n向你展示如何构建各种组件，例如响应式音频播放器、吸引用户的无限滚动体验、直观的拖放界面、响应式手机滑动组件等许多其他内容。\n\
  \n通过利用 `RxJS` 处理用户输入、创建事件流并连接异步数据，你将释放响应式 UI 组件的全部潜力，让你能够创建无缝的用户体验。\n\n## 第 3 章,\
  \ 使用 RxJS 理解响应式动画系统\n教你如何使用 `RxJS` 构建吸引用户的动态交互动画。\n\n你将学习如何将动画逻辑建模为值流，通过对其进行转换和组合，来实现以\
  \ 60 fps 运行的流畅、高性能动画。你将探索创建平滑过渡、编排复杂序列以及将动画与其他应用程序事件同步的技术。你还将构建引入胜的动画组件，例如跳球动画、制作加载按钮状态切换，以及重现\
  \ `particles.js` 的迷人效果。\n\n## 第 4 章, 测试 RxJS 应用\n引导你通过各种技术有效地测试你的响应式代码，包括深入研究使用\
  \ `Mock Service Worker` (`MSW`) 进行无缝集成测试，并探索 `NgRx` 状态单元测试。\n\n你将发现如何在测试中处理异步数据流，掌握用于复杂场景的理理石测试（marble\
  \ testing）以有信心地验证复杂场景并防止回归，并学习如何轻松模拟基于时间的操作。你还将探索使用 `MSW` 模拟 API 响应并简化集成测试工作流的实际示例，深入研究\
  \ `NgRx` 状态管理的复杂性，并学习如何为你的状态管理逻辑编写有效的单元测试。在本章结束时，你将能够创建一个可靠且可维护的 `RxJS` 代码库。\n\n\
  ## 第 5 章, 使用 RxJS 进行性能优化\n深入研究数据流管理以及策略性使用操作符来简化异步操作。你将发现如何选择正确的操作符以最小化冗余计算并减少渲染开销。\n\
  \n本章还探索了构建自定义性能监控系统以跟踪 `Core Web Vitals`，获取有关应用程序性能的宝贵见解，并识别改进之处。你将学习如何结合 `Web Workers`\
  \ 和 `RxJS` 流，将重型计算从浏览器主线程中卸载，进一步提升性能。你还将发现如何将性能瓶颈转换为优化的高效流。\n\n## 第 6 章, 使用 RxJS\
  \ 构建响应式状态管理系统\n探索 `RxJS` 如何提供管理应用状态的响应式方法，提高可预测性、可测试性和响应式更新。这一基础将使你能够从零构建自定义的响应式状态管理解决方案。\n\
  \n你将学习如何使用 `NgRx` 等强大的库来处理 `Angular` 应用中状态管理的复杂性，掌握即使是最复杂的状态交互。\n\n你将通过构建你自己的自定义版本来学习\
  \ `TanStack Query`，从而对异步状态管理获得深层次的见解，并发现 `Observables` 的异步本质如何完美地契合这一范式。\n\n## 第\
  \ 7 章, 使用 RxJS 构建渐进式 Web 应用\n探索如何利用 `RxJS` 通过关键的`渐进式 Web 应用` (`PWA`) 特性增强你的 `Angular`\
  \ 应用，包括推送通知、后台同步和离线功能。\n\n你将学习如何使用 `RxJS` 有效地管理推送通知，为你的用户提供及时且相关的更新。你将使用 `Dexie.js`\
  \ 和 `RxJS` 实现后台同步，在不中断用户工作流的情况下保持数据更新。最后，你将学习如何利用 `RxDB` 和 `RxJS` 在网络不可用时也提供无缝的用户体验，确保你的应用程序始终可用且功能正常。\n\
  \n## 第 8 章, 使用 RxJS 构建离线优先应用\n深入研究离线优先应用的关键领域，并展示 `RxJS` 如何赋予你实现无缝离线体验的能力。\n\n通过掌握各种策略获得对离线数据同步的细粒度控制，包括缓存优先、网络优先、失效更新（stale-while-revalidate）和缓存网络竞争，学习每种策略如何影响用户体验和数据可靠性，并为你的特定需求选择最佳方法。\n\
  \n除了基础同步之外，你还将探索使用乐观更新（optimistic update）模式处理数据更新的高级技术。你还将学习如何在向服务器确认之前对用户操作提供即时响应，同时在连接恢复时确保数据完整性和平滑过渡。\n\
  \n## 第 9 章, 使用 RxJS 实现实时化\n深入 `WebSockets` 的世界，并展示 `RxJS` 如何赋予你能够在 `Angular` 和 `NestJS`\
  \ 应用中创建无缝实时功能的能力。\n\n\n\n\n你将学习如何使用 `WebSockets` 建立持久的客户端-服务器连接以实现双向通信和即时数据更新，并探索实践示例，例如创建一个能够动态跟踪和可视化数据更新的实时仪表板。然后，你将深入学习为多人井字游戏构建流畅的游戏体验。最后，你将制作一个具有语音消息功能的聊天应用程序，提供真正的沉浸式聊天体验。\n\
  \n第 10 章 使用 RxJS 构建响应式 NestJS 微服务]，将探索 `RxJS` 如何为构建 `NestJS` API 带来响应式编程的优雅感。\n\n\
  你将学习如何为实时数据流，并利用 `RxJS` 复杂的错误处理和韧性模式构建容错的微服务。你将通过集成 `Kafka` 等异步消息平台来扩展你的工具箱，实现事件驱动架构，并处理高量数据流，以实现服务之间的无缝通信。\n\
  \n最后，你将深入研究 `gRPC`，利用其高效性在你的微服务架构中实现高性能的远程过程调用。\n\n# 如何充分利用本书\n\n你应该具备 `JavaScript`\
  \ 经验以及通用的 Web 概念。拥有服务器端 `Angular` 和 `NestJS` 等框架和库的经验会更好。在异步编程、函数式编程和响应式编程基础方面具有深厚基础将是一个优势。如果你已经熟悉核心\
  \ `RxJS` 概念，如 `Observer` 和 `Iterator` 模式、`Observables`、`Subscriptions`、`operators`、`Subjects`\
  \ 和 `Schedulers`，你将能从这本书中获得最大的收益。\n\n| 本书涵盖的软件/硬件 | 操作系统要求 |\n| :--- | :--- |\n\
  | RxJS v7 | Windows, macOS, 或 Linux |\n| Angular v19+ | |\n| Node.js v22+ | |\n\
  | npm v11+ | |\n| pnpm v10+ | |\n| NestJS v11+ | |\n\n在第 10 章 中，你需要为其中一个配方运行本地 `Kafka`\
  \ 服务器。你可以在 `Kafka` 文档 [`kafka.apache.org/quickstart`](https://kafka.apache.org/quickstart)\
  \ 中找到详细信息。\n\n## 注意事项\n\n本书没有使用 `Angular` 的 Resource API，因为在出版时它仍处于实验阶段。\n\n**如果你正在使用本书的电子版，我们建议你自己手动输入代码，或从本书的\
