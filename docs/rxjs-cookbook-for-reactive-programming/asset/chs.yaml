  \n# 在 Angular 中使用 NgRx 进行状态管理\n\n`NgRx` 是一个用于使用 Angular 构建响应式应用的框架，灵感源自 Redux。来自\
  \ NgRx 文档的下图提供了 NgRx 关键组件的视觉化概述：\n\n![Figure 6.4: NgRx overview](img/B09031_06_4.png)\n\
  \n图 6.4：NgRx 概述\n\n通过 NgRx，我们可以实现以下操作：\n\n*   定义全局和本地存储（stores）\n*   编写处理异步操作的副作用（side\
  \ effects）\n*   分发动作（actions）\n*   将 reducers 定义为纯函数，以实现可预测的状态变更\n*   编写选择器（selectors）以对状态进行更细粒度的控制\n\
  *   执行时间旅行调试（time-travel debugging）\n*   归一化实体数据\n*   与 Angular 路由状态集成\n*   创建支持\
  \ Signals 的响应式存储\n\n现在我们已经对 NgRx 有了整体的了解，让我们深入探讨一个如何处理状态管理挑战的实际示例。\n\n## 重要说明\n\n\
  在编写本食谱时，最新版本的 Angular 和 NgRx 均为 `v18`。在示例中，我们使用通过 `appConfig` 独立（standalone）方法来编写组件和提供服务。如果你使用的是较旧的模块（module）方法，代码可能会有所不同，但与状态管理相关的方法和概念应该保持不变。\n\
  \n## 如何实现……\n\n在这个示例中，我们将构建一个小型烹菜谱（Cooking Recipes）应用，其中我们将从模拟后端（BE，使用 `MockServiceWorker`）加载菜谱列表并在列表中显示它们。此外，我们还将能够知道当前选中了哪个菜谱。这个菜谱应用与之前的一个非常相似，但这次我们利用\
  \ NgRx 作为状态管理的解决方案，因此我们可以对比其降低的复杂度以及我们需要注意的边缘情况。我们将探索 NgRx 提供的某些功能，使我们的代码具有扩展性、健壮性并保持最新。最后，我们将存储器连接到\
  \ Angular 路由器，以便我们能够感知所有的导航和状态。\n\n### Step 1 – 配置 NgRx 存储\n\n在我们的全局配置 `app.config.ts`\
  \ 中，我们首先提供来自 NgRx 的存储，以便该存储在整个应用程序中可用：\n\n```\nimport { RootStoreConfig } from '@ngrx/store';\n\
  export const appConfig: ApplicationConfig = {\n    providers: [\n        provideStore(reducers\
  \ as RootStoreConfig<Action>)\n    ]\n}\n```\n\n`AppState` 是一个接口，我们将在其中定义全局状态的结构：\n\
  \n```\nexport interface RecipesState {\n    recipes: Recipe[];\n    selectedRecipe:\
  \ Recipe | null;\n    error: Error | null;\n    loading: boolean;\n}\nexport interface\
  \ AppState {\n    recipesState: RecipesState;\n}\n```\n\n在我们的 `recipes.reducers.ts`\
  \ 中，我们现在可以定义功能 reducer，它将根据分发的动作来控制状态的转换：\n\n```\nimport { map, catchError, of,\
  \ exhaustMap } from \"rxjs\";\nimport { Actions, createEffect, ofType } from \"\
  @ngrx/effects\";\nexport const initialState: State = {\n    recipes: [],\n    selectedRecipe:\
  \ null,\n    error: null,\n    loading: false,\n}\nexport const recipeReducer =\
  \ createReducer(\n    initialState,\n    on(RecipesActions.loadRecipes, state =>\
  \ ({\n        ...state,\n        loading: true,\n    })),\n    on(RecipesActions.loadRecipesSuccess,\
  \ (state, { recipes }) => ({\n        ...state,\n        recipes,\n        loading:\
  \ false,\n    })),\n);\nexport const recipesFeature = createFeature({\n    name:\
  \ 'recipesState',\n    reducer: recipeReducer,\n});\n```\n\n在前面的代码中，我们定义了初始状态，创建了处理状态转换的\
  \ `recipeReducer`，并最后将我们的 reducer 连接到功能状态上。此外，我们还可以注意到，如果我们分发 `RecipesActions`，我们将更改加载状态以显示加载器，一旦请求完成，我们将把\
  \ `loading` 设回 `false` 以隐藏旋转器，并将接收到的数据设置为响应。我们可以分发的动作列表在 `recipes.actions.ts` 中声明，它的样子如下：\n\
  \n```\nimport { createAction, props } from \"@ngrx/store\";\nexport const loadRecipesAction\
  \ = createAction('[Recipes] Load Recipes');\nexport const loadRecipesActionSuccess\
  \ = createAction(\n    '[Recipes] Load Recipes Success', props<{ recipes: Recipe[]\
  \ }>()\n);\nexport const loadRecipesActionError = createAction(\n    '[Recipes]\
  \ Load Recipes Error', props<{ error: string }>()\n);\n```\n\n现在我们准备好从组件中分发动作了。在\
  \ `RecipeListComponent` 中，从 `@ngrx/store` 注入存储后，我们只需调用开始获取菜谱的动作即可：\n\n```\nthis.store.dispatch(loadRecipesAction());\n\
  ```\n\n### Step 2 – 处理副作用\n\n发送 HTTP 请求和加载数据是外部交互或副作用，因此我们必须将其定义为异步动作。在我们的 `recipes.effects.ts`\
  \ 中，有如下内容：\n\n```\nimport { map, catchError, of, exhaustMap } from \"rxjs\";\nimport\
  \ { Actions, createEffect, ofType } from \"@ngrx/effects\";\nexport class RecipesEffects\
  \ {\n    loadRecipes$ = createEffect(() =>\n        this.actions$.pipe(\n      \
  \      ofType(loadRecipesAction),\n            exhaustMap(() => this.recipesService.getRecipes$().pipe(\n\
  \                    map(recipes => loadRecipeActionSuccess({\n                \
  \    recipes\n                })),\n                catchError((error: Error) =>\n\
  \                    of(loadRecipeActionError({\n                        error:\
  \ error.message\n                    }))\n                )\n            ))\n  \
  \      )\n    );\n}\n```\n\n在这个副作用中，我们可以观察到当特定类型的动作发生时，我们可以触发相应的副作用。NgRx 通过 `ofType`\
  \ 操作符内置了动作过滤器来匹配触发的动作。因此，当 `loadRecipesAction` 发生时，我们调用后端服务并对成功和错误情况做出反应。像前面的食谱一样，注意\
  \ `exhaustMap` 操作符的使用。\n\n### Step 3 – 定义选择器\n\nNgRx 通过定义创建状态切片的选择器，提供了对状态进行非常控制的能力。你可以将选择器视为对你想在组件中显示的特定状态部分的查询。这种方法有许多优点：\n\
  \n*   **可读性和可维护性**：我们可以将提取状态切片的逻辑提取到组件之外。\n*   **内存化（Memoization）**：所有选择器默认缓存，因此我们可以获得性能提升，特别是在复杂的状态结构中。\n\
  *   **可组合性**：选择器可以组合以实现更细粒度的控制。\n*   **可测试性**：由于选择器是纯函数且没有副作用，因此可以轻松测试。\n*   **类型安全**：这有助于实现智能代码补全和早期错误检测，提升整体开发体验。\n\
  \n在我们的 `recipes.selector.ts` 中，我们有一个名为 `selectRecipesState` 的状态切片。这意味着我们可以为该状态创建一个**功能选择器**，并为功能状态的子部分创建组合选择器：\n\
  \n```\nimport { createFeatureSelector, createSelector } from '@ngrx/store';\nimport\
  \ * as fromRecipes from './recipes.reducer';\nexport const selectRecipesState =\n\
  \    createFeatureSelector<fromRecipes.State>('recipesState');\nexport const selectRecipesWithSelectedRecipes\
  \ =\n    createSelector(\n        selectRecipesState,\n        (state: fromRecipes.State)\
  \ => state.selectedRecipe\n    );\n```\n\n到此为止，我们已经成功实现了与之前一个食谱相同的行为。谈到降低复杂度，对吧？\n\
  \n\n\n\n\n现在，让我们探索 `NgRx` 的其他功能，并进一步改进我们的菜谱应用程序。\n\n### 步骤 4 – 使用 NgRx Router State\
  \ 扩展应用状态\n\n通过 `Router State`，我们可以将 Angular 路由器无缝集成到应用状态中，使我们已拥所有优势（如时间旅行调试、选择器和改进的可测试性）也适用于路由和导航事件。首先，在我们的\
  \ store 配置中，我们提供了 Router store 并添加 `routerReducer` 作为 `AppState` 的一部分：\n\n```typescript\n\
  import { RootStoreConfig } from '@ngrx/store';\nimport { provideRouterStore, routerReducer\
  \ } from '@ngrx/router-store';\nexport const appConfig: ApplicationConfig = {\n\
  \    providers: [\n        provideStore(reducers, {\n            router: routerReducer\n\
  \        } as RootStoreConfig<AppState, Action>),\n        provideRouterStore()\n\
  \    ]\n}\n```\n\n回到 `reducers/index.ts`，我们将添加一个路由状态作为 `AppState` 的一部分：\n\n```typescript\n\
  import * as fromRouter from '@ngrx/router-store';\nexport interface AppState {\n\
  \    recipesState: RecipesState;\n    router: fromRouter.RouterReducerState;\n}\n\
  ```\n\n一个非常棒的补充是 `router selectors`，我们可以开箱即用：\n\n```typescript\nexport const {\n\
  \    selectCurrentRoute, // 选择当前路由\n    selectFragment, // 选择当前路由片段\n    selectQueryParams,\
  \ // 选择当前路由查询参数\n    selectQueryParam, // 选择查询参数的工厂函数\n    selectRouteParams, //\
  \ 选择当前路由参数\n    selectRouteParam, // 选择路由参数的工厂函数\n    selectRouteData, // 选择当前路由数据\n\
  \    selectRouteDataParam, // 选择路由数据参数的工厂函数\n    selectUrl, // 选择当前 url\n    selectTitle,\
  \ // 如果可用则选择标题\n} = getRouterSelectors();\nexport const selectRecipesWithCurrentRoute\
  \ = createSelector(\n    selectRecipesState,\n    selectCurrentRoute,\n    (recipesState,\
  \ routerState) => ({\n        recipesState,\n        routerState\n    })\n);\n```\n\
  \n现在，在我们的 `recipes-list.component.ts` 中，我们可以订阅这部分状态：\n\n```typescript\nimport {\
  \ select } from '@ngrx/store';\nthis.store.pipe(select(\n    fromRecipes.selectRecipesWithCurrentRoute\n\
  )).subscribe(({ recipesState: { recipes } }) => {\n    this.recipes = recipes;\n\
  });\n```\n\n此外，如果我们打开 NgRx Dev Tools，可以在我们在应用中跳转时看到分发的路由事件。\n\n![图 6.5: NgRx Store\
  \ DevTools](img/B09031_06_5.png)\n\n图 6.5: NgRx Store DevTools\n\n### 步骤 5 – 创建元还原器\
  \ (meta-reducers)\n\n有时，我们希望在 action 修改状态之前拦截它并在之间执行一些工作。一些用例包括用于调试的日志、状态持久化到本地存储以及性能监控。在示例中，我们实现了一个简单的日志系统。首先，我们在\
  \ store 配置中定义一个元-reducer：\n\n```typescript\nimport { RootStoreConfig } from '@ngrx/store';\n\
  import { provideRouterStore, routerReducer } from '@ngrx/router-store';\nimport\
  \ { metaReducers } from './reducers/recipes.meta-reducer';\nexport const appConfig:\
  \ ApplicationConfig = {\n    providers: [\n        provideStore(reducers, {\n  \
  \          metaReducers,\n            router: routerReducer\n        } as RootStoreConfig<AppState,\
  \ Action>),\n    ]\n}\n```\n\n现在，在我们的 `recipes.meta-reducer.ts` 中，我们可以实现自定义的调试函数，它将作为\
  \ action 和 reducer 之间的中间件。\n\n注意，我们只在开发模式下运行此中间件，而在生产模式下运行：\n\n```typescript\nimport\
  \ { isDevMode } from '@angular/core';\nimport { ActionReducer, MetaReducer } from\
  \ '@ngrx/store';\nexport function debug<T>(reducer: ActionReducer<T>): ActionReducer<T>\
  \ {\n    return function (state, action) {\n        console.log(`%cState:\\n`, 'color:\
  \ #ffc26e', state);\n        console.log(`%cCalling Action: ${action.type}\\n`,\n\
  \                                     'color: #d30b8e');\n        return reducer(state,\
  \ action);\n    };\n}\nexport const metaReducers: MetaReducer<AppState>[] =\n  \
  \  isDevMode() ? [debug] : [];\n```\n\n在应用配置中应用 `metaReducer` 后，我们可以在浏览器控制台中看到所有带有负载和当前状态分发的\
  \ action。\n\n![图 6.6: 记录元-reducer](img/B09031_06_6.png)\n\n图 6.6: 记录元-reducer\n\n\
  ## 另参\n\n* NgRx 文档：[`ngrx.io/docs`](https://ngrx.io/docs)\n\n* Redux DevTools: [`chromewebstore.google.com/detail/redux-devtools/lmhkpmbekcpmknklioeibfkpmmfibljd?pli=1`](https://chromewebstore.google.com/detail/redux-devtools/lmhkpmbekcpmknklioeibfkpmmfibljd?pli=1)\n\
  \n# TanStack Query 遇上 RxJS – 使用 Angular 和 RxJS 构建自己的 TanStack query\n\n`TanStack\
  \ Query` 作为首选的异步状态管理库席卷了我们的社区，这有其道理。使用 TanStack Query 有许多优势，例如：\n\n* 声明式数据获取\n*\
  \ 自动缓存和重新获取\n* 健壮的错误处理——优雅地处理失败并自动重试请求\n* 垃圾回收\n* 卓越的开发者体验——用于调试和检查查询的专用 Dev Tools\n\
  \n在使用 TanStack Query 时，我们注意到它只支持 Promise 而不支持 Observable。但异步编程和副作用处理正是 RxJS 发挥优势的地方。因此，让我们借助\
  \ RxJS 构建一个非常自定义的极简 TanStack Query 版本。\n\n## 如何实现……\n\n在示例中，我们将使用 Angular 构建一个小型菜谱应用程序，从后端加载菜谱列表并在列表中显示。我们管理状态的方法是通过复制\
  \ TanStack Query 的一组功能，并将其称为 `RxJS-Query`。\n\n我们将复制的功能包括：\n\n* 声明式查询\n* 基于查询的自动缓存\n\
  * 智能后台重新获取——在窗口聚焦、网络恢复或查询键变化时\n* `Stale-while-revalidate` 缓存策略\n* 可查询键\n* 请求取消\n\
  * 请求去重\n* 请求失败时的重试机制\n* 垃圾回收\n* 用于可视化缓存存储的小型开发工具\n\n### 步骤 1 – 设置声明式查询\n\n如果我们查看\
  \ TanStack 在 Angular 中的文档，可以看到一个查询看起来像什么。让我们尝试复制相同的开发体验和行为。在我们的 `RecipesListComponent`\
  \ 中，我们将编写第一个使用 `recipes` 查询键获取菜谱列表的查询：\n\n```typescript\nexport class RecipesListComponent\
  \ {\n    recipes$: Observable<QueryState<Recipe[]>>\n    constructor(\n        private\
  \ queryClient: QueryClientService,\n        private recipesService: RecipesService\n\
  \    ) {}\n    ngOnInit(): void {\n        this.queryClient.injectQuery(\n     \
  \       ['recipes'],\n            () => this.recipesService.getRecipes$(),\n   \
  \         { staleTime: 1000 * 5 }\n        );\n    }\n}\n```\n\n### 步骤 2 – 使用 Map\
  \ 缓存查询\n\n现在我们将 `QueryClientService` 以及 `injectQuery` 函数背后的实现：\n\n\n\n\n\n```typescript\n\
  export class QueryClientService {\n    private cache = new Map<\n        string,\n\
  \        { state$: BehaviorSubject<any>; lastFetched: number }\n    >();\n    private\
  \ query<T>(\n        key: string[],\n        queryFn: () => Observable<T>,\n   \
  \     options: QueryOptions,\n    ): Observable<QueryState<T>> {\n        const\
  \ compositeKey = JSON.stringify(key);\n        let cachedValue = this.cache.get(compositeKey);\n\
  \        const { staleTime = 0, retryNo = 3, gcTime = 30000 } = options;\n     \
  \   let { state$ } = cachedValue || {};\n        if (!state$) {\n            //\
  \ 开始一个新的状态流\n        }\n        return state$.asObservable();\n    }\n    public\
  \ injectQuery<T>(\n        queryKey: string[],\n        queryFn: () => Observable<T>,\n\
  \        queryOptions: QueryOptions,\n    ): Observable<QueryState<T>> {\n     \
  \   return this.query<T>(queryKey, queryFn, queryOptions);\n    }\n}\n```\n\n让我们来分析一下这个示例以及我们目前的内容：\n\
  \n1.  首先，我们将创建一个 `Map` 缓存，它将根据查询键的数组（或一个大的组合键）来存储我们的查询和 Observable 流。每当我们调用查询函数时，首先会检查缓存中是否存在值，如果有，我们将直接从缓存中返回一个\
  \ Observable 值。\n\n2.  现在，让我们看看如果没有之前的缓存值且我们需要触发新请求时会发生什么（`!state$` `if` 块中的代码）：\n\
  \n```typescript\nstate$ = new BehaviorSubject<QueryState<T>>({\n    isLoading: true,\n\
  \    isFetching: true,\n});\nthis.cache.set(\n    compositeKey,\n    { state$, lastFetched:\
  \ 0 }\n);\nreturn state$.pipe(\n    filter((state: QueryState<T>) => state.isFetching),\n\
  \    switchMap((val) =>\n        merge(\n                of(val),\n            \
  \    queryFn().pipe(\n                    retry(retryNo),\n                    map((data)\
  \ => {\n                        this.cache.set(compositeKey, {\n               \
  \             state$,\n                            lastFetched: Date.now() + staleTime,\n\
  \                        });\n                        return {\n               \
  \             data,\n                            isFetching: false,\n          \
  \                  isLoading: false\n                        };\n              \
  \      }),\n                )\n        ),\n    ),\n    shareReplay(1),\n);\n```\n\
  \n让我们看看我们在这里做了什么：\n\n1.  首先，我们设置了一个带有初始加载值的新状态。如果你在好奇为什么我们同时需要 `isLoading` 和 `isFetching`\
  \ 状态，那是因为我们需要 `isLoading` 来表示数据正在首次加载，并且我们需要在 UI 中显示加载动画（spinner）。当我们已经拥有数据但正在进行智能后台重新获取以验证过时数据时，我们使用\
  \ `isFetching`。\n\n2.  然后，我们立即设置缓存，而不是在请求完成后再设置。通过这样做，我们可以对多个相同的请求进行去重（如果有多个组件调用同一个查询）。此外，当有新请求进入时，`switchMap`\
  \ 操作符会取消之前的请求。\n\n3.  接着，我们将加载状态与 `queryFn` 合并，以便在 UI 中不丢失用于展示的之前的加载状态，并并行运行发送请求的\
  \ `queryFn`。请求完成后，我们将提取响应数据负载，用新值更新缓存，并设置 `staleTime`（即从该刻起我们认为数据是新的时长）。\n\n4. \
  \ 最后，我们使用 `shareReplay` 操作符缓存所有之前的值。\n\n### 步骤 3 – 使用 stale-while-revalidate（过用时更新）机制进行缓存\n\
  \n这是一种流行的缓存机制，被 `TanStack Query` 使用，灵感来自 `HTTP Cache-Control Header`。\n\n> stale-while-revalidate\
  \ 响应指令表示，在重新验证缓存时，缓存可以重用过期的响应。\n\n> – MDN 文档\n\n这意味着每当我们通过查询键请求数据时，首先会检查该数据是否是新的，如果是，我们将立即返回数据。但如果它是过期的（stale），我们仍然会显示该数据，并在后台执行更新以获取最新数据，而不会干扰当前的用户流。一旦后台重新验证完成并获得新数据，`TanStack\
  \ Query` 将无缝地更新 UI 以反映最新信息。这种方法的主要优势如下：\n\n*   **提高感知性能**：由于我们可以立即接收到缓存数据，用户体验到更快的初始加载时间。\n\
  *   **减轻服务器负载**：由于利用了缓存数据，向服务器发起的不必要请求减少了。\n*   **数据始终最新**：后台重新验证确保了显示的数据最终会更新，而不需要用户交互。\n\
  \n在我们的示例中，我们将通过在 `QueryOption` 中定义毫秒单位的 `staleTime` 来实现相同的效果：\n\n```typescript\n\
  type QueryOptions = {\n    refetchOnWindowFocus?: boolean;\n    refetchOnReconnect?:\
  \ boolean;\n    staleTime?: number;\n    retryNo?: number;\n    gcTime?: number;\n\
  \    // ... 其他选项\n};\n```\n\n现在，我们从 Map 缓存返回状态值的条件可能是：\n\n```typescript\nif (!state$\
  \ || Date.now() > cachedValue.lastFetched)\n```\n\n### 步骤 4 – 后台更新\n\n`TanStack\
  \ Query` 根据以下因素进行智能重新获取：\n\n*   窗口聚焦\n*   连接恢复后网络恢复\n*   组件挂载\n*   键的更改\n\n如果查询键发生变化，我们将将其视为一个新条目。组件挂载也是直观的；让我们响应这些事件：\n\
  \n```typescript\nprivate queryTriggers(\n    key: string[],\n    { refetchWindowFocus\
  \ = true, refetchReconnect = true }: QueryOptions,\n): void {\n    const focus$\
  \ = refetchWindowFocus\n        ? fromEvent(window, 'focus')\n        : from [];\n\
  \    const networkReconnect$ = refetchReconnect\n        ? fromEvent(window, 'online')\n\
  \        : from [];\n    merge(focus$, networkReconnect$).subscribe(\n        ()\
  \ => this.refetch(key));\n}\n```\n\n我们使用 RxJS 的 `fromEvent` 操作符创建一个事件流；具体来说，当我们在应用聚焦或恢复网络时，就会触发新事件，我们会收到通知。一旦发生，我们就调用\
  \ `RxJS-Query` 进行后台获取以获得新数据。此外，我们可以通过传递 `refetchWindowFocus` 和 `refetchReconnect`\
  \ 参数来取消这种行为：\n\n```typescript\npublic refetch(key: string[]): void {\n    const\
  \ compositeKey = JSON.stringify(key);\n    const cachedValue = this.cache.get(compositeKey);\n\
  \    let { state$, lastFetched } = cachedValue;\n    if (state$ && Date.now() >\
  \ lastFetched) {\n        state$.next({ ...state$.value, isFetching: true });\n\
  \    }\n}\n```\n\n由于我们的状态是 `BehaviorSubject`，我们可以通过调用 `next` 方法并将获取状态设置为 `true`\
  \ 来触发新的 HTTP 请求。\n\n### 步骤 5 – 自动垃圾收集\n\n根据在 `QueryOptions` 中定义的 `gcTime`，我们可以根据键跟踪查询并将其从内存中移除以防止内存泄漏。`gcTime`\
  \ 默认是无限的（我们假设我们需要所有获取过的数据），但如果我们选择在查询键下存储数据的时间范围更短，也可以这样做。一旦我们将该时间定义为例如 30 秒，就可以有一个负责移除缓存查询的函数：\n\
  \n```typescript\npublic removeQuery(key: string[]): void {\n    const compositeKey\
  \ = JSON.stringify(key);\n    const cachedValue = this.cache.get(compositeKey);\n\
  \    let { state$ } = cachedValue;\n    if (state$) {\n        this.cache.delete(compositeKey);\n\
  \    }\n}\n```\n\n我们在 `gcTime` 周期后调用此函数的方法是利用 **RxJS 调度器 (schedulers)** 的力量。\n\n\
  \n\n\n\n## 什么是调度器（Scheduler）？\n\n`RxJS` 调度器可以帮助我们控制流中异步操作的时机和执行。它们通过让我们定义一个 `Observable`\
  \ 通知观察者（Observers）的执行上下文，对并发资源管理进行细粒度的控制。\n\n在我们的示例中，在状态流的末尾，我们可以使用 `finalize` 操作符并调用\
  \ `asyncScheduler`（基于时间的调度器）：\n\n```\nfinalize(() =>\n    asyncScheduler.schedule(\n\
  \        () => this.removeQuery(key),\n        gcTime\n    ),\n)\n```\n\n现在我们已经涵盖了\
  \ RxJS Query 的主要功能，点击此处查看其完整功能的完整示例：[`github.com/PacktPublishing/RxJS-Cookbook-for-Reactive-Programming/tree/main/Chapter06/rxjs-query`](https://github.com/PacktPublishing/RxJS-Cookbook-for-Reactive-Programming/tree/main/Chapter06/rxjs-query)。\n\
  \n在这一坚实的基础上，我们可以轻松地复制 TanStack Query 的其余功能并扩展我们的 RxJS Query，例如处理变更（mutations）、乐观更新、并行请求、依赖请求、分页支持或离线支持。\n\
  \n## 另另\n\n*   TanStack 的文档：[`tanstack.com/query/latest/docs/framework/angular/overview`](https://tanstack.com/query/latest/docs/framework/angular/overview)\n\
  *   `merge`:[`rxjs.dev/api/index/function/merge`](https://rxjs.dev/api/index/function/merge)\n\
  *   `catchError` 操作符：[`rxjs.dev/api/operators/catchError`](https://rxjs.dev/api/operators/catchError)\n\
  *   `shareReplay` 操作符：[`rxjs.dev/api/index/function/shareReplay`](https://rxjs.dev/api/index/function/shareReplay)\n\
  *   HTTP Cache-Control Header：[`developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control`](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Cache-Control)\n\
  *   `fromEvent` 操作符：[`rxjs.dev/api/index/function/fromEvent`](https://rxjs.dev/api/index/function/fromEvent)\n\
  *   RxJS 调度器：[`rxjs.dev/guide/scheduler`](https://rxjs.dev/guide/scheduler)\n\n\
  # 7\n\n# 使用 RxJS 构建渐进式 Web 应用\n\n**渐进式 Web 应用**（**PWAs**）是利用现代 Web 能力为用户提供原生应用体验的\
  \ Web 应用。它们结合了 Web 应用和移动端应用的优点，在不同设备上提供无缝、可靠且吸引人的用户体验。PWAs 的特殊之处在于具有推送通知、离线访问、后台数据同步、原生应用体验等功能。\n\
  \n在本章中，我们将通过涵盖以下食谱来实现一些核心 PWA 功能：\n\n*   使用 RxJS 推送通知交付实时食品订单更新\n*   实现响应式后台数据同步\n\
  *   使用 RxDB 无缝构建离线可用应用程序\n\n# 技术要求\n\n为了跟随本章节，你需要以下环境：\n\n*   Angular `v19+`\n*\
  \   RxJS `v7`\n*   Node.js `v22+` 和 npm `v11+`\n*   RxDB\n*   NestJS `v11+`\n\n\
  本章食谱的代码放置在此 GitHub 仓库中：[`github.com/PacktPublishing/RxJS-Cookbook-for-Reactive-Programming/tree/main/Chapter07`](https://github.com/PacktPublishing/RxJS-Cookbook-for-Reactive-Programming/tree/main/Chapter07)。\n\
  \n要将 Angular 应用转换为 PWA，我们可以运行一个简单的命令，这将为我们的项目添加所有必要的配置和基础 service worker：\n\n```\n\
  ng add @angular/pwa\n```\n\n由于 service worker 是应用成为 PWA 的要求之一，且仅在生产模式下启用，因此我们必须构建应用并在本地提供服务，以观察每个食谱的运行情况。在每个食谱中，我们将使用简单的\
  \ `http-server` 库在本地托管客户端，并在终端中运行以下命令在浏览器中观察离线模式：\n\n```\nnpm run build && http-server\
  \ ${build-location} -c-1 –o\n```\n\n# 使用 RxJS 推送通知交付实时食品订单更新\n\n推送通知已成为用户与我们的 Web\
  \ 和移动应用交互的重要方面。通过推送通知，我们可以获得及时的更新和重要的提醒及警报，驱动用户交互并增加转化率。\n\n## 如何实现……\n\n为了向客户端交付及时的食品订单推送通知，我们将在\
  \ Angular 客户端应用和 NestJS 后端应用中结合 RxJS 的力量。在这个食谱中，我们还需要一个后端应用，因为我们需要以安全、经过验证的方式传递推送通知。行业中实现\
  \ Web 服务器向推送服务标识身份的通用做法是利用**自愿应用服务器身份识别**（**VAPID**）密钥。\n\n### 步骤 1 – 生成 VAPID 密钥\n\
  \n由于 VAPID 密钥充当推送通知的数字签名，首先，我们需要生成一对公、私 VAPID 密钥。我们可以这样做的方法是在系统中全局安装 `web-push`\
  \ 库，并在终端中调用 `generate-vapid-keys` 命令：\n\n```\nnpm install web-push -g\nweb-push\
  \ generate-vapid-keys\n```\n\n之后我们可以从控制台获取结果并在后端使用这些密钥（或从环境变量或密钥管理器加载）：\n\n```\n\
  const vapidKeys = {\n    publicKey: '//your public key',\n    privateKey: '//your\
  \ private key',\n};\nconst options = {\n    vapidDetails: {\n        subject: 'mailto:example_email@example.com',\n\
  \        publicKey: vapidKeys.publicKey,\n        privateKey: vapidKeys.privateKey,\n\
  \    },\n};\n```\n\n### 步骤 2 – 设置公密钥接口\n\n由于我们要将公私密钥保留在服务端，我们将设置一个获取公密钥的接口。现在，客户端应用可以请求并获取公密钥，我们需要向该客户端发送通知：\n\
  \n```\n@Get('/api/publicKey')\ngetPublicKey() {\n    return { publicKey: vapidKeys.publicKey\
  \ };\n}\n```\n\n### 步骤 3 – 请求订阅\n\n在获取公密钥后，我们可以在浏览器中请求允许通知。Angular 的 `SwPush` 模块通过暴露\
  \ `requestSubscription()` 方法消除了与浏览器 **Push API** 交互的复杂度：\n\n```typescript\nimport\
  \ { SwPush } from '@angular/service-worker';\ninterface PublicKeyResponse {\n  \
  \  publicKey: string;\n}\n@Injectable({ providedIn: 'root' })\nexport class PushNotificationService\
  \ {\n    constructor(private swPush: SwPush, private http: HttpClient) {}\n    subscribeToNotifications()\
  \ {\n        this.http.get<PublicKeyResponse>(\n            'http://localhost:3000/api/publicKey').pipe(\n\
  \                switchMap((res: PublicKeyResponse) => {\n                   return\
  \ this.swPush.requestSubscription({\n                       serverPublicKey: res.publicKey\n\
  \                    });\n                }),\n        catchError(err => {\n   \
  \         console.error(\n            'Could not subscribe to notifications', err);\n\
  \            return EMPTY;\n        })\n    )\n    .subscribe();\n    }\n}\n```\n\
  \n在调用 `requestSubscription()` 后，我们会在浏览器中看到正在请求用户允许推送通知：\n\n![Figure 7.1: Notification\
  \ user permission](img/B09031_08_1.png)\n\nFigure 7.1: Notification user permission\n\
  \n### 步骤 4 – 从 API 发送响应式推送通知\n\n此时，我们获得了在浏览器中显示通知的用户权限。现在，我们准备好从服务器发送推送通知。首先，我们定义一个通知负载对象，我们将按照特定间隔将其发送客户端：\n\
  \n\n\n\n\n```javascript\nexport const orderNotification = {\n    [OrderStatus.ACCEPTED]:\
  \ {\n        \"notification\": {\n            \"title\": \"订单已接受\",\n          \
  \  \"body\": \"您的订单已被接受，正在准备中。\",\n            \"icon\": \"http://localhost:3000/assets/burger.jpg”,\n\
  \        }\n    },\n    [OrderStatus.COURIER_ON_THE_WAY]: {\n        \"notification\"\
  : {\n            \"title\": \"快递员正在路途中\",\n            \"body\": \"您的订单正在派送中。请实时跟踪您的订单。\"\
  ,\n            \"actions\": [{\"action\": \"location\",\n                      \
  \   \"title\": \"查看位置\"}],\n            \"data\": {\"onActionClick\": {\n      \
  \          \"default\": {\"operation\": \"openWindow\",            \n          \
  \                  \"url\": \"http://127.0.0.1:8080/\n                    geolocation?lat=12.9716&long=77.5946\"\
  },\n                \"rate\": {\"operation\": \"openWindow\",\n                \
  \         \"url\": \"http://127.0.0.1:8080/\n                    geolocation?lat=12.9716&long=77.5946\"\
  }\n                }\n            }\n        }\n    },\n}\n```\n\n在这个对象中，我们将定义每个通知将包含哪些信息，以及将提供哪些用户操作。我们可以注意到，当食物订单被接受时，我们将有一个通知标题、正文和一个图标。当快递员在路途中时，我们将有一个操作按钮，它将引导至\
  \ PWA 地理位置页面以查看外卖的当前位置。\n\n在我们应该传递通知的后端端点中，我们可以定义 RxJS 流来调用 `webpush` 包中的 `sendNotifications()`\
  \ 方法：\n\n```javascript\n@Post('/api/subscriptions')\nasync addSubscription(@Body()sub:NotificationSubscription){\n\
  \    return of(orderNotification[OrderStatus.ACCEPTED])\n    .pipe(switchMap((notification)\
  \ =>   \n          webpush.sendNotification(sub, JSON.stringify(\n             \
  \                   notification), options)),\n          delayWhen(() => this.\n\
  \                    foodOrderService.processOrder()),\n          switchMap(() =>\
  \ webpush.sendNotification(sub,\n                    JSON.stringify(orderNotification[\n\
  \                    OrderStatus.COURIER_ON_THE_WAY]),\n                    options)),\n\
  \          delay(4000),\n          switchMap(() => webpush.sendNotification(sub,\n\
  \                    JSON.stringify(orderNotification[\n                    OrderStatus.DELIVERED]),\
  \ options)),\n          );\n}\n```\n\n### 第 5  – 响应传入的推送通知\n\n最后，现在我们有一个可以发送及时通知的后端端点，我们可以从客户端应用调用该端点并订阅传入的推送通知：\n\
  \n```javascript\nsubscribeToNotifications() {\n    this.http.get<PublicKeyResponse>(\n\
  \        '/api/publicKey').pipe(\n    switchMap((res: PublicKeyResponse) => {\n\
  \        return this.swPush.requestSubscription({\n            serverPublicKey:\
  \ res.publicKey\n        });\n    }),\n    switchMap((sub: PushSubscription) =>\
  \    \n        this.http.post('/api/subscriptions', sub)),\n        catchError(err\
  \ => {\n            console.error('无法订阅通知            \n                        \
  \   notifications', err);\n           return EMPTY;\n        })\n    )\n    .subscribe();\n\
  }\n```\n\n当我们打开浏览器时，可以观察到传入的推送通知：\n\n![图 7.2: 食物订单推送通知](img/B09031_08_02.png)\n\n\
  图 7.2: 食物订单推送通知\n\n## 另\n\n*   Angular University 关于推送通知的完整指南：[`blog.angular-university.io/angular-push-notifications/`](https://blog.angular-university.io/angular-push-notifications/)\n\
  *   Angular 关于推送通知的文档：[`angular.dev/ecosystem/service-workers/push-notifications`](https://angular.dev/ecosystem/service-workers/push-notifications)\n\
  *   `SwPush` 类文档：[`angular.dev/api/service-worker/SwPush`](https://angular.dev/api/service-worker/SwPush)\n\
  *   Firebase 云消息：[`firebase.google.com/docs/cloud-messaging`](https://firebase.google.com/docs/cloud-messaging)\n\
  \n# 实现响应式后台数据同步\n\nPWA 中的 `Background data sync` 这种同步允许我们的应用程序在后台同步数据，即使应用程序没有被活动使用。这确保了应用程序的数据始终是最新的，并提供了无缝的用户体验。这一功能在离线场景下特别有用，因为它可以保持数据新鲜，我们可以在离线模式下访问最新数据。\n\
  \n## 如何实现……\n\n在这个食谱中，我们将利用 Angular 的拦截器和 Dexie.js（浏览器 `IndexedDB` 数据库的小型封装）来模拟\
  \ PWA 的数据后台同步。\n\n### 第 1  – 拦截配置请求\n\n在 `services/recipes.service.ts` 中，我们有一个指向服务器的简单\
  \ HTTP 请求：\n\n```javascript\ngetRecipes() {\n    return this.http.get('/api/recipes');}\n\
  ```\n\n我们可以拦截每个配置请求的方法是使用 Angular 的拦截器。在 `interceptors/background-sync.interceptor.ts`\
  \ 中，我们为后台同步生成了一个起点：\n\n```javascript\nimport { HttpInterceptorFn } from '@angular/common/http';\n\
  export const backgroundSyncInterceptor: HttpInterceptorFn =\n    (req, next) =>\
  \ {\n        return next(req);\n    };\n```\n\n### 第 2 – 与 API 建立后台同步\n\n每当有配置请求时，我们可以设置一个定时器，定期在后台发送请求以检查是否有更新。通过这样做，我们可以确保我们的\
  \ Web 应用中有最新数据：\n\n```javascript\nimport { HttpInterceptorFn } from '@angular/common/http';\n\
  import { exhaustMap, tap, timer, take } from 'rxjs';\nexport const backgroundSyncInterceptor:\
  \ HttpInterceptorFn =\n    (req, next) => {\n        if (req.url.includes('/recipes'))\
  \ {\n            console.log(\n                '后台同步请求。正在重试\n                 request...');\n\
  \            return timer(0, 5000).pipe(\n                take(5),\n           \
  \     exhaustMap(() => next(req)),\n            );\n        }\n     return next(req);\n\
  \    };\n```\n\n### 第 3 – 设置 Dexie.js\n\nPWA 的主要功能之一是可以离线工作。准备离线状态的最佳时机是在在线时。我们在这里想要在客户端存储最新数据，以便在离线时访问。我们将使用\
  \ Dexie.js 库在每次后台同步后将数据存储在 `IndexedDB` 中：\n\n```javascript\nimport Dexie from 'dexie';\n\
  export interface Recipe {\n    id?: number;\n    lastUpdated: number;\n    data:\
  \ {\n       title: string;\n       ingredients: string[];\n       instructions:\
  \ string;\n    };\n}\nexport class RecipesDB extends Dexie {\n    recipes: Dexie.Table<Recipe,\
  \ number>;\n    constructor() {\n        super('RecipesDB');\n        this.version(1).stores({\n\
  \            recipes: '++id'\n        });\n        this.recipes = this.table('recipes');\n\
  \    }\n}\nexport const db = new RecipesDB();\n```\n\n### 第 4 – 在 IndexedDB 中存储同步数据\n\
  \n一旦我们完成了 `IndexedDB` 的设置，每我们从后台同步收集到新数据时，就可以存储它们。\n\n\n\n\n```javascript\nreturn\
  \ timer(2000, 5000).pipe(\n    take(5),\n    exhaustMap(() => next(req)),\n    switchMap((response)\
  \ => {\n        if (response instanceof HttpResponse) {\n            return response.body\
  \ as RecipeResponse[];\n        }\n        return EMPTY;\n    }),\n    concatMap(async\
  \ ({ id, ...data }: RecipeResponse) => {console.log(id);\n        const existingRecipe\
  \ = await db.recipes.get(id);\n        const isRecipeStale = existingRecipe && \
  \    \n        existingRecipe.lastUpdated < data.timestamp;\n        if (!existingRecipe)\
  \ {\n            console.log(`Adding recipe with id ${\n                id} in IndexedDB.`);\n\
  \            return db.recipes.add({ id, data,\n                lastUpdated: data.timestamp\
  \ });\n        }\n        if (isRecipeStale) {\n            console.log(`Updating\
  \ recipe with id ${\n                id} in IndexedDB.`);\n            return db.recipes.update(id,\
  \ { data,\n                lastUpdated: data.timestamp });\n        }\n        console.log(`Recipe\
  \ with id ${\n            id} already exists in IndexedDB.`);\n        return EMPTY;\n\
  \    }),\n    catchError((error) => {\n        console.error('Error while syncing\
  \ data:', error);\n        return EMPTY;\n    })\n);\n```\n\n当我们收到后端响应时，将检查特定的食谱是否已存在于\
  \ `IndexedDB` 中。如果不存在，我们可以将该食谱添加到数据库。然而，如果它已经存在，我们将检查食谱数据是否已过期，以便我们知道是否需要更新该食谱。最后，如果食谱存在于数据库中且数据是新的，我们将优雅地退出并继续流，因为数据库不需要进行任何更改。\n\
  \n当我们打开浏览器并检查 `DevTools` 时，可以查看结果：\n\n![Figure 7.3: Recipes IndexedDB](img/B09031_08_3.png)\n\
  \n图 7.3：食谱 IndexedDB\n\n现在我们已经已经在 `IndexedDB` 中存储了数据，就可以在我们的 `IndexedDB` 数据库上创建响应式查询。在\
  \ `app.component.rs` 中，我们可以创建一个响应式查询并在 UI 中显示 `recipes` 数据：\n\n```javascript\nimport\
  \ { liveQuery } from 'dexie';\nrecipes$ = liveQuery(() => db.recipes.toArray());\n\
  ```\n\n最后，当我们运行应用构建并在离线模式下打开浏览器时，我们仍然能看到从 `IndexedDB` 获取的 `recipes` 数据。\n\n# 使用\
  \ RxDB 无缝构建离线就绪的应用程序\n\n`RxDB` 是一个强大的响应式 NoSQL 数据库。RxDB 之所以强大，是因为它能够创建高效的实时应用、其离线优先的方法、自动后台数据更新等许多功能。\n\
  \n由于它是构建在 `RxJS` 之上的，因此 `RxDB` 默认是响应式的。我们可以编写响应式数据库查询，每当底层数据发生变化时，查询就会自动更新。RxDB\
  \ 提供了 `Observables` 作为变更流，允许我们监听任何数据修改，例如文档的插入、更新和删除。\n\n通过将 `RxJS` 与其变更流结合，RxDB\
  \ 允许您构建能够实时响应数据变化的应用程序，保持 UI 始终同步。除了离线功能，这使得 RxDB 成为构建 PWA 的完美选择。\n\n## 准备工作\n\n\
  由于 RxDB 提供了各种可能性，它的文档是探索所有功能的极佳学习资源。如果您的需求超过了构建 PWA，您可以在这里查看：[`rxdb.info/quickstart.html`](https://rxdb.info/quickstart.html)。\n\
  \n## 如何实现……\n\n在这个食谱中，我们将范围限制在如何设置 RxDB 并尽可能利用 `RxJS` 上。我们将构建一个保持数据同步的小型离线优先烹饪应用。\n\
  \n### 第 1 步 – 定义食谱模式 (schema)\n\n通过 RxDB，我们可以为数据库对象创建一个模式。这可能很重要，因为模式可以配合 RxDB 验证食谱对象，确保它们在存储到数据库或在数据库中处理之前具有正确的结构和必需的属性：\n\
  \n```javascript\nexport const recipeSchema = {\n    title: 'recipe schema',\n  \
  \  description: 'describes a simple recipe',\n    primaryKey: 'id',\n    type: 'object',\n\
  \    version: 0,\n    properties: {\n        id: {\n            type: 'string',\n\
  \        },\n        title: {\n            type: 'string',\n            primary:\
  \ true,\n        },\n        ingredients: {\n            type: 'array',\n      \
  \      items: {\n                type: 'string',\n            },\n        },\n \
  \       instructions: {\n            type: 'string',\n        },\n    },\n    required:\
  \ ['title', 'ingredients', 'instructions'],\n};\n```\n\n当我们拆解这个模式时，我们可能会注意到关键部分：\n\
  \n* `Schema metadata`（模式元数据）提供了有关模式的信息，包括它的标题、描述、主键、类型和版本\n* `properties` 定义了食谱对象中属性的结构和类型\n\
  * `required` 属性列出了对于有效食谱对象是强制的属性\n\n### 第 2 步 – 创建 RxDatabase\n\n当我们确定了食谱模式后，就可以创建一个食物食谱客户端数据库。在\
  \ `services/rxdb.service.ts` 中，我们将拥有以下代码：\n\n```javascript\nimport { RxDatabase,\
  \ createRxDatabase } from 'rxdb';\nimport { getRxStorageDexie } from 'rxdb/plugins/storage-dexie';\n\
  async initDatabase(): Promise<RxDatabase> {\n    const db = await createRxDatabase({\n\
  \        name: 'recipes',\n        storage: getRxStorageDexie(),\n        collections:\
  \ {\n            recipes: {\n                schema: recipeSchema\n            }\n\
  \        }\n    });\n    return db;\n}\n```\n\n首先，我们调用 `createRxDatabase` 方法，并在其中传递数据库名称和存储。我们使用\
  \ Dexie.js 插件，它是浏览器 `IndexedDB` 数据库的封装。在创建数据库后，我们就准备好在 `IndexedDB` 中存储食谱数据了。\n\n\
  ### 第 3 步 – 订阅变更 (ChangeEvent)\n\n在创建数据库和集合后，我们可以对 `recipe` 实体执行 CRUD 操作：\n\n```javascript\n\
  db.recipes.insert({\n    id: crypto.randomUUID(),\n    title: 'Spaghetti Carbonara',\n\
  \    ingredients: ['spaghetti', 'eggs', 'bacon', 'parmesan', 'cheese'],\n    instructions:\
  \ 'Cook spaghetti. Fry bacon. Mix eggs and cheese. Combine all ingredients.'\n});\n\
  ```\n\n在将数据插入 RxDB 集合后，我们可以订阅 `ChangeEvent` 并跟踪客户端数据库中的所有更改：\n\n```javascript\n\
  db$.subscribe((changeEvent) => {\n    console.dir(changeEvent)\n});\n```\n\n此外，在\
  \ `rxdb.service.ts` 中，当我们想要添加新食谱时，可以创建一个 RxJS 流并调用 RxDB 的 `insert()` 方法：\n\n```javascript\n\
  export class RxDBService {\n    db$: Observable<RxDatabase> = from(this.initDatabase())\n\
  \    .pipe(\n        catchError((error) => {\n            console.error('Error initializing\
  \ database:', error);\n            return EMPTY;\n        }),\n        retry(3),\n\
  \        shareReplay({ bufferSize: 1, refCount: true })\n    );\n    addRecipe$\
  \ = new Subject<Recipe>();\n    constructor() {\n        this.addRecipe$\n     \
  \   .pipe(\n            withLatestFrom(this.db$),\n            switchMap(([recipe,\
  \ db]) =>\n                db.collections['recipes'].insert(recipe)),\n        catchError((error)\
  \ => {\n            console.error('Error inserting recipe:', error);\n         \
  \   return EMPTY;\n        })\n    )\n    .subscribe();\n    }\n    addRecipe(data:\
  \ Recipe): void {\n        this.addRecipe$.next(data);\n    }\n}\n```\n\n由于食谱标题是数据库的主键，如果我们添加具有相同标题的食谱，将得到错误。\n\
  \n### 第 4 步 – 使用 RxQuery 搜索食谱\n\n要使用 `RxQuery` 创建查询，首先我们需要在的 `main.ts` 文件中包含 RxQuery\
  \ 构建器插件：\n\n```javascript\nimport { RxDBQueryBuilderPlugin } from 'rxdb/plugins/query-builder';\n\
  addRxPlugin(RxDBQueryBuilderPlugin);\n```\n\n之后，回到 `rxdb.service.ts`，我们可以调用集合上的\
  \ `find()` 方法，并使用 **Query Builder** 传递多种选择器，以通过标题搜索所需的食谱：\n\n\n\n\n\n```typescript\n\
  recipes$ = new BehaviorSubject<Recipe[]>([]);\nfindRecipe$ = new Subject<string>();\n\
  constructor() {\n    this.findRecipe$\n    .pipe(\n    withLatestFrom(this.db$),\n\
  \    switchMap(\n        ([recipeTitle, db]) =>\n            db.collections['recipes'].find().where(\n\
  \                'title').eq(recipeTitle).$\n        ),\n        map((recipes: RxDocument[])\
  \ => recipes.map((r) =>\n            r.toJSON()))\n    )\n    .subscribe((recipes)\
  \ => this.recipes$.next(recipes as\n                                           \
  \    Recipe[]));\n}\nfindRecipe(recipeTitle: string): void {\n    this.findRecipe$.next(recipeTitle);\n\
  }\n```\n\n在这里，我们可以注意到我们搜索了 `recipes` 集合，以找到标题与所需食谱完全匹配的项目。之后，通过 `$`，我们可以观察查询结果并相应地更新\
  \ UI。\n\n## 更多...\n\n以下是几点需要注意的：\n\n*   **数据库迁移**：随着应用程序的增长和数据架构的演进，RxDB 提供了优雅管理这些更改的工具。你可以定义迁移策略，自动更新现有数据以匹配新架构，防止数据丢失并确保用户获得平滑过渡。这也扩展到了底层的存储引擎。如果你需要从一种存储类型切换到另一种，RxDB\
  \ 允许你无缝故障地迁移所有数据。\n\n*   **实时复制**：RxDB 允许你的应用程序与各种后端（如 GraphQL、CouchDB 甚至其他 RxDB\
  \ 实例）无缝同步数据，让实时协作变得轻而易举。它通过一种简单但强大的复制协议实现了这一点，确保了所有连接客户端之间的数据一致性。更好的是，RxDB 在离线场景下表现出色。你的应用可以在离线时继续修改数据，一旦重新建立连接，RxDB\
  \ 将自动将这些更改与服务器同步。\n\n*   **冲突解决**：当多个用户或离线设备对同一信息进行更改时，RxDB 为你的数据提供了安全网。这确保了即使有许多并发编辑，你的数据也能保持一致，防止数据丢失和混惑。\n\
  \n*   **备份机制**：以防发生意外问题或数据迁移，它可以作为一个安全网。RxDB 通过将备份以易于理解和使用的格式写入计算机的文件系统，简化了这一过程。这让我们放心，知道宝贵的数据是安全的，并在需要时可以恢复，就像拥有重要文件的额外副本一样。\n\
  \n## 另见\n\n*   作为 PWA 数据库的 RxDB：[`rxdb.info/articles/progressive-web-app-database.html`](https://rxdb.info/articles/progressive-web-app-database.html)\n\
  \n*   离线优先的 RxDB：[`rxdb.info/offline-first.html`](https://rxdb.info/offline-first.html)\n\
  \n*   RxQuery：[`rxdb.info/rx-query.html`](https://rxdb.info/rx-query.html)\n\n*\
  \   RxDB 冲突解决：[`rxdb.info/transactions-conflicts-revisions.html#conflicts`](https://rxdb.info/transactions-conflicts-revisions.html#conflicts)\n\
  \n# 8\n\n# 使用 RxJS 构建离线优先的应用\n\n我们生活日益连接的世界中，正因如此，很容易忽视离线功能的重要性。然而，现实情况是，互联网连接并不总有保障。无论是由于网络覆盖有限，还是仅仅位于偏远地区，都有无数用户可能发现自己没有互联网连接的情况。这就是离线优先\
  \ Web 应用大显身手的地方。\n\n`离线优先` Web 应用的设计目标是即使在用户离线时也能无缝运行。它们优先提供核心功能和数据访问，而不依赖于持续的互联网连接。这种方法有许多优势：\n\
  \n*   **增强用户体验**：通过确保用户无论网络可用如何都能与应用交互，离线优先的应用提供了更流畅、更一致的体验。这消除了等待内容加载或离线时无法执行基本任务的挫败感。\n\
  \n*   **提高可用性**：离线能力使 Web 应用更具包容性，特别是在互联网访问不稳定或有限的地区。这扩大了潜在用户群，并确保每个人从应用的功能中受益。\n\
  \n*   **提高性能**：离线优先的应用通常加载更快、响应更快，因为它们利用了缓存数据和资源。这带来了更高效、更愉快的用户体验。\n\n*   **降低数据成本**：对于使用流量流量或昂贵数据套餐的用户来说，离线功能可以帮助减少数据消耗。这在数据成本较高的地区尤为宝贵。\n\
  \n*   **数据同步**：离线优先的应用通常会在恢复连接后实现与服务器同步数据的机制。这确保了用户数据在不同设备之间保持更新和一致。\n\n为了处理设计离线\
  \ Web 应用的复杂性，我们可以使用不同的离线策略，针对特定的用例进行精心定制：\n\n| **策略** | **用例** |\n| --- | --- |\n\
  | **缓存优先 (Cache-First)** | *很少变化的视觉元素*：网站 Logo、图标、背景图等*应用外壳*：单页应用程序的基础框架，用于即时加载*离线可访问内容*：文档、帮助文件、用户手册*不经常更新的产品图片*：保持一段时间静态的电子商务产品照片\
  \ |\n| **网络优先 (Network-First)** | *时间敏感的新闻文章*：突发新闻、实时更新、时事新闻*实时社交媒体馈*：需要立即更新的帖子、评论和互动*不断变化的金融数据*：股价、汇率、市场信息、游戏排行榜\
  \ |\n\n\n\n\n\n为了让 Angular 应用能够离线运行，我们可以运行一个简单的命令，它会将所有必要的配置和一个基础的 service worker\
  \ 添加到我们的项目中：\n\n```\nng add @angular/pwa\n```\n\n由于 service workers 仅在生产模式下启用，因此为了观察每个配方的实际执行情况，我们必须构建应用并在本地提供服务。在每个配方中，我们都会使用简单的\
  \ `http-server` 库在本地托管客户端应用，并通过终端中运行以下命令在浏览器中观察离线模式：\n\n```\nnpm run build && http-server\
  \ ${build-location} -c-1 –o\n```\n\n本章中所有配方的共同点是，每当我们有一个名为 `Going offline`（进入离线）的步骤时，它是检查离线行为的必要步骤。\n\
  \n此外，本章中所有策略（乐观更新模式外）的共同点是我们需要生成一个 Angular 拦截器（interceptor）。我们所有模拟离线模式的逻辑将放在 `offline.interceptor.ts`\
  \ 文件中。\n\n在 Angular 中，我们可以简单地使用以下命令生成请求拦截器：\n\n```\nng generate interceptor interceptors/offline\n\
  ```\n\n# 使用缓存优先策略实现无缝的 RxJS 离线优先应用\n\n在这个配方中，我们将探索如何实现一种离线策略，即我们首先检查缓存中是否有数据，然后回退到网络。\n\
  \n## 如何实现……\n\n我们将利用 Angular 的 `interceptors` 并模拟在 service worker 内部实现 `Cache-First\
  \ offline strategy`（缓存优先离线策略）的行为。\n\n### 第一步 – 从 Cache API 提取数据\n\n通常在现代 Web 中，我们将离线模式的数据存储在浏览器的\
  \ `Cache API` 中。当使用离线模式时，`Cache-first strategy` 规定如下：\n\n1. 首先，尝试从 `Cache API` 获取数据。\n\
  2. 如果缓存中有数据，则立即将其作为响应返回给拦截器。\n3. 如果数据与请求的 URL 键不匹配，则进入网络并检查我们是否已恢复在线。\n\n此类策略的实现方式如下：\n\
  \n```\nexport const offlineInterceptor: HttpInterceptorFn = (req:\n    HttpRequest<unknown>,\
  \ next: HttpHandlerFn) => {\n    return openCache$.pipe(\n        switchMap((cache:\
  \ Cache) =>\n            from(cache.match(req.url))),\n        switchMap((cacheResponse:\
  \ Response | undefined) => {\n            if (cacheResponse) {\n               \
  \ return from(cacheResponse.json());\n            }\n            return continueRequest$;\n\
  \        }),\n        map((response: unknown) => {\n            return new HttpResponse({\n\
  \                status: 200,\n                body: response\n            })\n\
  \        })\n    );\n}\n```\n\n### 第二步 – 回退到网络\n\n当我们拥有网络访问权限时，一切运行顺畅，因为我们的数据只隔了一个\
  \ HTTP 网络请求。但我们不能认为理所当然，现在是通过缓存最新的新鲜数据来准备离线事件的完美时机：\n\n```\nconst openCache$ = from(caches.open('my-app-cache'));\n\
  const continueRequest$ = next(req).pipe(\n    withLatestFrom(openCache$),\n    map(([response,\
  \ cache]) => {\n      if (response instanceof HttpResponse) {\n        cache.put(req.url,\
  \ response);\n      }\n      return response;\n    }),\n    catchError(() => EMPTY)\n\
  \  );\n```\n\n让我们拆解一下我们正在做的：\n\n1. 我们使用 `openCache$ = from(caches.open('my-app-cache'))`\
  \ 来访问缓存。\n2. 我们使用 `next(req)` 定义 `continueRequest$` 来处理请求流。\n3. 我们使用 `withLatestFrom(openCache$)`\
  \ 在获取响应的同时获取缓存。\n4. 如果响应是 `HttpResponse`，我们使用 `cache.put(req.url, response)` 存储它。\n\
  5. 如果网络请求失败，我们使用 `catchError` 返回 `EMPTY`。\n\n\n\n\n当我们在线时，我们可以看到网络请求正在发送。网络响应将刷新我们的缓存数据，这样当我们离线时就能获取尽可能最新的值。\n\
  \n![图 8.5：网络优先离线模式](img/B09031_09_5.png)\n\n图 8.5：网络优先离线模式\n\n一旦我们离线，我们可以看到网络请求失败了，但由于我们有缓存回退机制，一切都能按预期工作，并且显示了缓存中的最新数据。\n\
  \n这种方法一个明显的缺点可能是网络缓慢时的用例。我们将不得不等待缓慢的网络响应，尽管 UI 中可能已经准备好了可以从缓存中显示的数据。接下来的两种策略旨在解决这一挑战。\n\
  \n# 使用 Stale-While-Revalidate（过时同时更新）策略优化数据新鲜度和性能\n\n`Stale-While-Revalidate` 是当我们想要始终向用户显示某些数据（即使这些数据可能已过期）时的一种常用策略。之后，我们在后台发送网络请求并在之后刷新数据。这在我们离线时也能帮助我们，因为我们可以先显示旧数据，然后在重新上线后在后台重试并检查。\n\
  \n## 如何实现……\n\n我们将利用 Angular 的拦截器（interceptors），并模拟类似于在 service worker 中实现 Stale-While-Revalidate\
  \ 离线策略的行为。这里的策略是创建两个流，它们按顺序发射值，首先是缓存数据，第二个是网络响应数据。\n\n### 第 1 步 – 从缓存中提取数据\n\n现在拦截器已经就绪，我们可以拦截每个\
  \ HTTP 请求，并在离线时显示缓存数据：\n\n```\nconst openCache$ = from(caches.open('my-app-cache'));\n\
  const dataFromCache$ = openCache$.pipe(\n  switchMap((cache: Cache) => from(cache.match(req.url))),\n\
  \  switchMap((cacheResponse: Response | undefined) => {\n    if (cacheResponse)\
  \ {\n      return from(cacheResponse.json());\n    }\n    return EMPTY;\n  }),\n\
  \  map((response: unknown) => new HttpResponse({\n    body: response\n  })),\n);\n\
  ```\n\n让我们拆解一下在这里所的操作：\n\n1. 首先，我们打开缓存 `my-app-cache` 并从它创建一个 Observable 流。\n2.\
  \ 然后，我们检查缓存中是否存在与当前请求 URL 匹配的内容。\n3. 如果有缓存数据，我们将其作为响应返回。\n4. 如果没有缓存数据，我们优雅地完成该流而不产生结果。\n\
  \n### 第 2 步 – 在后台检查新鲜数据\n\n当我们完成来自缓存存储的流时，我们将发送网络请求来检查新鲜数据：\n\n```\nconst continueRequest$\
  \ = next(req).pipe(\n  withLatestFrom(openCache$),\n  map(([response, cache]) =>\
  \ {\n    if (response instanceof HttpResponse) {\n      cache.put(\n        req.url,\n\
  \        new Response(JSON.stringify(response.body))\n      );\n    }\n    return\
  \ response;\n  }),\n  // 如果请求失败则进行指数退避（查看第 01 章）\n);\n```\n\n现在，我们可以使用 RxJS 的 `concat`\
  \ 运算符来控制 Stale-While-Revalidate 离线策略的事件序列：\n\n```\nreturn concat(\n  dataFromCache$,\n\
  \  continueRequest$\n);\n```\n\n这意味着如果我们遇到离线情况，我们首先向用户显示缓存数据，之后在后台发送请求来检查我们是否已上线并刷新数据。\n\
  \n### 第 3 步 – 离线\n\n首先，我们将从本地服务器提供应用：\n\n```\nnpm run build && http-server ./dist/rxjs-offline-stale-while-revalidate/browser\
  \ -c-1 –o\n```\n\n如果我们打开浏览器和开发者工具，我们可以看到该策略的运行情况：\n\n![图 8.6：在线请求](img/B09031_09_6.png)\n\
  \n图 8.6：在线请求\n\n在 **Network** 标签页上，我们可以看到在线时有一个正在网络请求，这是符合预期的。这是为离线情况做准备并用最新数据填充缓存的时候：\n\
  \n![图 8.7：Stale-While-Revalidate 离线模式](img/B09031_09_7.png)\n\n图 8.7：Stale-While-Revalidate\
  \ 离线模式\n\n一旦进入离线模式，我们可以观察到 **Stale-While-Revalidate** 策略的作用。我们立即显示缓存数据，但在后台检查是否已重新上线。一旦我们重新上线，我们将看到来自服务器的新鲜数据。\n\
  \n# 缓存与网络竞争策略\n\n我们可以将这种策略想为**胜者全得**（winner takes all）。我们尝试同时从缓存和网络获取数据，谁快就显示谁的响应。该策略旨在尽可能快地显示数据，优先考虑第一个可用源。这种策略确保用户能够快速看到内容，即使我们处于离状态或网络连接缓慢。\n\
  \n## 如何实现……\n\n我们将利用 Angular 的拦截器，并模拟类似于在 service worker 中实现 Racing Cache and Network\
  \ 离线策略的行为。\n\n### 第 1 步 – 从缓存中提取数据\n\n首先，我们将定义一个从缓存中提取数据的流：\n\n```\nlet dataFromCache$:\
  \ Observable<HttpEvent<any>>;\nconst openCache$ = from(caches.open('my-app-cache'));\n\
  dataFromCache$ = openCache$.pipe(\n  switchMap((cache: Cache) => from(cache.match(req.url))),\n\
  \  switchMap((cacheResponse: Response | undefined) => {\n    if (cacheResponse)\
  \ {\n      return from(cacheResponse.json());\n    }\n    return EMPTY;\n  }),\n\
  \  map((response: unknown) => new HttpResponse({\n    body: response\n  }))\n);\n\
  ```\n\n让我们拆解一下在这里所的操作：\n\n1. 首先，我们打开缓存 `my-app-cache` 并从它创建一个 Observable 流。\n2.\
  \ 然后，我们检查缓存中是否存在与当前请求 URL 匹配的内容。\n3. 如果有缓存数据，我们将其作为响应返回。\n4. 如果没有缓存数据，我们返回 `EMPTY`。通过使用\
  \ `EMPTY` 运算符来实现，目的是防止在没有缓存时提前完成流。\n\n### 第 2 步 – 发送网络请求\n\n这是我们定义网络请求的方式：\n\n```\n\
  let continueRequestWithCacheSave$: Observable<HttpEvent<any>>;\ncontinueRequestWithCacheSave$\
  \ = next(req).pipe(\n  withLatestFrom(openCache$),\n  map(([response, cache]) =>\
  \ {\n    if (response instanceof HttpResponse) {\n      cache.put(\n        req.url,\n\
  \        new Response(JSON.stringify(response.body))\n      );\n    }\n    return\
  \ response;\n  }),\n  catchError(() => dataFromCache$),\n);\n```\n\n让我们拆解一下在这里所的操作：\n\
  \n1. 我们为拦截器的 `next` 函数创建一个 Observable 流，并将其与打开缓存结果的 Promise 结合。\n2. 我们发送请求，一旦从网络获取响应，我们就打开**Cache**\
  \ 存储，并通过相应的请求 URL 键存入最新的新鲜值。\n3. 如果在离线时请求失败，我们将引用缓存值。\n\n### 第 3 步 – 网络与缓存竞赛\n\n\
  现在一旦我们定义了两个流，就准备好进行竞赛。为了实现这种效果，我们可以利用 RxJS 的 `raceWith` 运算符。这意味着如果我们返回以下流：\n\n```\n\
  return dataFromCache$.pipe(\n  raceWith(continueRequestWithCacheSave$),\n);\n```\n\
  \n我们将得到竞赛胜者的响应。由于我们在 MSW 网络处理程序中有两秒延迟，显然在初始没有缓存数据的情况下，缓存每次都会胜。我们可以通过在 `dataFromCache$`\
  \ 流开头放置一个超过两秒的延迟来测试并调整它。\n\n\n\n如果我们打开浏览器和开发者工具（Dev Tools），就可以开始测试：\n\n![图 8.8:\
  \ 网络胜出](img/B09031_09_8.png)\n\n图 8.8: 网络胜利\n\n最初，我们可以看到网络请求胜出，因为缓存存储中没有任何内容。但如果我们刷新页面并查看开发者工具，就会发现从缓存读取比网络请求更快，所以这次是缓存胜出：\n\
  \n![图 8.9: 离线模式下缓存与网络的竞赛](img/B09031_09_9.png)\n\n图 8.9: 离线模式下缓存与网络的竞赛\n\n最后，如果我们进入离线模式，就可以看到\
  \ `Racing Cache and Network`（缓存网络竞赛）策略生效。首先，我们将尝试发送请求，看到请求失败，然后进入缓存。\n\n## 另类\n\n\
