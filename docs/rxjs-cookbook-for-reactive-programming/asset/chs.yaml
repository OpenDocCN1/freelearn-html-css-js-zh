  \n# 使用 RxJS 驱动的通知简化实时更新\n\n通知是向用户提示系统内相关事件或更改的主要方式之一。通过利用 `Observables` 和 `operators`，RxJS\
  \ 提供了一个强大的框架，用于高效且有效地管理这些异步通知。\n\n## 如何实现……\n\n在这个食谱中，我们将有一个通知数组，用于表示基于用户操作的入站通知，按\
  \ ID 存储它们，并在一段时间后删除它们。我们还提供支持从堆栈中手动移除通知的功能。\n\n### 第 1  – 堆叠入站通知\n\n为了高效地整理通知堆栈，在\
  \ `NotificationService` 内部，我们将使用 `BehaviorSubject` 来表示随时间异步到达的所有通知。我们还有一个 `Subject`，在我们想要向堆栈中添加新通知时触发事件，另一个用于移除：\n\
  \n```\nprivate notifications$ = new BehaviorSubject<Notification[]>([]);\nprivate\
  \ addNotification$ = new Subject<Notification>();\nprivate removeNotification$ =\
  \ new Subject<string>();\naddNotification(notification: Notification) {\n    this.addNotification$.next(notification);\n\
  }\nremoveNotification(id: string) {\n    this.removeNotification$.next(id);\n}\n\
  ```\n\n因此，每当有发布新数据的持续请求时，我们将通过 `withLatestFrom` 操作符的帮助将这两个操作与通知堆栈的最新状态结合，并更新其状态：\n\
  \n```\nget notifications(): Observable<Notification[]> {\n    return merge(\n  \
  \      addNotification$,\n        removeNotification$\n    ).pipe(\n        withLatestFrom(this.notifications$),\n\
  \        map(([changedNotification, notifications]) => {\n            if (changedNotification\
  \ instanceof Object) {\n                this.notifications$.next([\n           \
  \         ...notifications,\n                    changedNotification\n         \
  \       ]);\n            } else {\n                this.notifications$.next(notifications.filter(\n\
  \                    notification => notification.id !== changedNotification));\n\
  \            }\n        })\n    )\n}\n``` 根据最新发射值的 `type`，我们可以决定是添加还是从堆栈中过滤新通知。\n\
  \n### 第 2 – 响应用户操作并显示通知\n\n在我们的 `app.component.html` 文件中，我们有一个简单的按钮，将触发添加菜谱的 `POST`\
  \ 请求：\n\n```\n<button (click)=\"sendRequest()\">Add recipe</button>\n```\n\n点击该按钮将调用一个函数：\n\
  \n```\nsendRequest() {\n    this.recipeService.postRecipes();\n}\n```\n\n在 `RecipeService`\
  \ 中，我们必须实现向 API 发送请求的方法。如果收到成功响应，我们将执行副作用将通知添加到堆栈中。如果收到错误，我们将显示一个类型为 `error` 的通知：\n\
  \n```\ngetRecipes(): void {\n    this.httpClient.get<Recipe[]>('/api/recipes').pipe(\n\
  \        tap(() => {\n            this.notificationService.addNotification({\n \
  \               id: crypto.randomUUID(),\n                message: 'Recipe added\
  \ successfully.',\n                type: 'success'\n            });\n        }),\n\
  \        catchError((error) => {\n            this.notificationService.addNotification({\n\
  \                id: crypto.randomUUID(),\n                message: 'Recipe could\
  \ not be added.',\n                type: 'error'\n            });\n            return\
  \ throwError(() =>\n                new Error('Recipe could not be added.'));\n\
  \        }),\n    ).subscribe();\n}\n```\n\n最后，在 `NotificationComponent` 中，我们可以订阅\
  \ `notifications$` 的变化并显示通知：\n\n```\n<div class=\"container\">\n    <div\n     \
  \ *ngFor=\"let notification of notifications | async\"  \n      class=\"notification\
  \ {{ notification.type }}\"\n    >\n      {{ notification.message }}\n        <mat-icon\n\
  \            (click)=\"removeNotification(notification.id)\" \n            class=\"\
  close\">\n            Close\n        </mat-icon>\n    </div>\n</div>\n```\n\n\n\n\
  \n此前，我们可以通过点击关闭按钮手动从栈中移除通知。现在，经过一段时间后，我们希望通知能自动从栈中移除。在 `NotificationService` 中，当最初将通知添加到栈中时，我们只需定义一个定时器，之后将调用\
  \ `removeNotification` 方法：\n\n```\naddNotification(\n    notification: Notification,\n\
  \    timeout = 5000\n) {\n    this.addNotification$.next(notification);\n    timer(timeout).subscribe(()\
  \ =>\n        this.removeNotification(notification.id));\n}\n```\n\n## 另另\n\n* \
